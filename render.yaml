services:
  - type: web
    name: edu-games-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SOCKET_CORS_ORIGINS
        value: https://ho-nguyen.github.io
      - key: MONGODB_DB
        value: educational_games
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false