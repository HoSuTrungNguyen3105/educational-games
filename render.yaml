services:
  - type: web
    name: edu-games-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SOCKET_CORS_ORIGINS
        value: https://hosutrungnguyen3105.github.io,http://localhost:5173
      - key: REFRESH_ALLOWED_ORIGINS
        value: https://hosutrungnguyen3105.github.io,http://localhost:5173
      # Secret dùng chung BFF <-> API (header x-bff-internal-token).
      # Phải đặt CÙNG MỘT giá trị ở cả hai service API và BFF.
      - key: BFF_BACKEND_TOKEN
        sync: false
      - key: MONGODB_DB
        value: educational_games
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      # ── AI Service (Java) ──────────────────────────────────────────
      # Frontend gọi /api/ai/* của Backend chính này; Backend chính mới gọi AI Service.
      # KHI DEPLOY: localhost KHÔNG phải máy chạy AI Service — phải trỏ URL thật,
      # tốt nhất đặt AI Service trong cùng mạng nội bộ.
      - key: AI_BACKEND_URL
        sync: false
      # Shared secret gửi qua header X-Ai-Internal-Token.
      # PHẢI khớp với EDU_AI_INTERNAL_TOKEN của AI Service.
      - key: AI_BACKEND_TOKEN
        generateValue: true
      - key: AI_BACKEND_TIMEOUT_MS
        value: 120000
  # ── BFF (Backend for Frontend) ──────────────────────────────────────
  # Frontend trên GitHub Pages gọi thẳng BFF này (VITE_BFF_BASE trong
  # .env.production ở gốc repo). BFF giữ session bằng HttpOnly cookie rồi
  # proxy sang API kèm header x-bff-internal-token. Thiếu service này thì
  # mọi request /bff/* và /api/* của frontend đều 404 trên Pages.
  - type: web
    name: edu-games-bff
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && cd .. && npm install && npm run build
    startCommand: node bff/index.js
    healthCheckPath: /educational-games/bff/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_URL
        value: https://educational-games-lp4z.onrender.com/api
      - key: BFF_BASE_PATH
        value: /educational-games
      # Cookie phải gửi được cross-site (Pages -> Render) nên SameSite=None
      - key: BFF_COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGINS
        value: https://hosutrungnguyen3105.github.io,http://localhost:5173
      - key: MONGODB_DB
        value: educational_games
      - key: MONGODB_URI
        sync: false
      - key: BFF_BACKEND_TOKEN
        sync: false
