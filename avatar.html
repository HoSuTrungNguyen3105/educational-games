<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xưởng Avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3FF;
    --card:#FFFFFF;
    --ink:#241934;
    --ink-soft:#6C6285;
    --pink:#FF5DA2;
    --sky:#3FB6E8;
    --sun:#FFC93C;
    --mint:#37D7A7;
    --line:#E7E2FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 8%, #ECE7FF 0%, transparent 42%),
      radial-gradient(circle at 92% 18%, #FFE7F3 0%, transparent 40%),
      var(--bg);
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
  }
  h1,h2,.rail-label,.btn,.gender-btn{font-family:'Baloo 2',sans-serif;}

  header{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 8px;
  }
  header h1{
    margin:0;
    font-size:2.1rem;
    font-weight:800;
    letter-spacing:0.2px;
  }
  header h1 span{color:var(--pink);}
  header p{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:56ch;
  }

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:24px 24px 60px;
    display:grid;
    grid-template-columns: 400px 1fr;
    gap:26px;
    align-items:start;
  }
  @media (max-width:940px){
    .app{grid-template-columns:1fr; padding:16px 14px 48px;}
    header{padding:28px 14px 4px;}
  }

  /* ---- Stage (avatar preview) ---- */
  .stage{
    background:var(--card);
    border-radius:32px;
    padding:22px 22px 20px;
    box-shadow:0 18px 40px -22px rgba(36,25,52,0.28);
    position:sticky;
    top:20px;
  }
  @media (max-width:940px){ .stage{position:static;} }

  .gender-toggle{
    display:flex;
    background:#F1EEFC;
    border-radius:999px;
    padding:4px;
    gap:4px;
    margin-bottom:16px;
  }
  .gender-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:999px;
    font-size:0.95rem;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .18s, color .18s;
  }
  .gender-btn.is-active{
    background:var(--ink);
    color:#fff;
  }

  .stage-frame{
    position:relative;
    border-radius:26px;
    background:
      repeating-conic-gradient(from 0deg, #F8F6FF 0deg 90deg, #F1EDFF 90deg 180deg);
    background-size:22px 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 0 6px;
  }
  .stage-frame::before{
    content:"";
    position:absolute;
    inset:10px;
    border:2px dashed #D9D2F5;
    border-radius:20px;
    pointer-events:none;
  }
  #avatarSvg{
    width:100%;
    max-width:280px;
    height:auto;
    display:block;
  }

  .stage-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:16px;
    padding:12px 10px;
    font-size:0.92rem;
    font-weight:700;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{ background:var(--pink); color:#fff; }
  .btn-secondary{ background:#F1EEFC; color:var(--ink); }
  .btn-tertiary{ background:var(--ink); color:#fff; }
  .btn:hover{filter:brightness(1.06);}

  .current-picks{
    margin-top:16px;
    font-size:0.86rem;
    color:var(--ink-soft);
    line-height:1.55;
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .current-picks b{color:var(--ink);}

  /* ---- Picker ---- */
  .picker{
    background:var(--card);
    border-radius:32px;
    padding:20px 20px 26px;
    box-shadow:0 18px 40px -24px rgba(36,25,52,0.24);
  }

  .rail{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:14px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
    scrollbar-width:thin;
  }
  .rail-btn{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:transparent;
    border:2px solid transparent;
    border-radius:18px;
    padding:8px 10px 7px;
    cursor:pointer;
    min-width:74px;
  }
  .rail-btn.is-active{
    border-color:var(--pink);
    background:#FFF0F7;
  }
  .rail-swatch{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
    border:2px solid rgba(36,25,52,0.08);
  }
  .rail-swatch.is-empty{
    background:repeating-linear-gradient(45deg,#EDEBF8,#EDEBF8 4px,#E1DEF4 4px,#E1DEF4 8px);
  }
  .rail-label{
    font-size:0.74rem;
    font-weight:700;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .rail-btn.is-active .rail-label{color:var(--ink);}

  .grid-title{
    margin:0 0 12px;
    font-size:1.15rem;
    font-weight:700;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(84px,1fr));
    gap:14px 10px;
  }
  .tile-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .tile{
    width:100%;
    aspect-ratio:1;
    max-width:76px;
    border-radius:18px;
    border:2px solid rgba(36,25,52,0.07);
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    transition:transform .12s ease;
  }
  .tile:hover{transform:translateY(-2px);}
  .tile.is-active{
    border-color:var(--pink);
    box-shadow:0 0 0 3px #FFE1F0;
  }
  .tile-check{
    position:absolute;
    top:-6px;
    right:-6px;
    background:var(--pink);
    color:#fff;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:0.7rem;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #fff;
  }
  .tile-none{color:#B7AEDD; font-weight:800; font-size:1.4rem;}
  .tile-label{
    font-size:0.72rem;
    text-align:center;
    color:var(--ink-soft);
    line-height:1.2;
  }

  footer{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 40px;
    color:var(--ink-soft);
    font-size:0.82rem;
  }
</style>
</head>
<body>

<header>
  <h1>Xưởng <span>Avatar</span></h1>
  <p>Chọn da, tóc, quần áo và phụ kiện — mỗi ô là một món đồ. Ghép lại để tạo nhân vật của riêng bạn, rồi tải ảnh về dùng làm avatar.</p>
</header>

<div class="app">
  <div class="stage">
    <div class="gender-toggle" id="genderToggle">
      <button class="gender-btn is-active" data-gender="boy">Bé trai</button>
      <button class="gender-btn" data-gender="girl">Bé gái</button>
    </div>

    <div class="stage-frame">
      <svg id="avatarSvg" viewBox="0 0 300 440" width="300" height="440" xmlns="http://www.w3.org/2000/svg">
        <g id="avatarLayers"></g>
      </svg>
    </div>

    <div class="stage-actions">
      <button class="btn btn-secondary" id="randomizeBtn">🎲 Ngẫu nhiên</button>
      <button class="btn btn-secondary" id="resetBtn">↺ Đặt lại</button>
    </div>
    <div class="stage-actions">
      <button class="btn btn-primary" id="downloadBtn" style="flex:1 1 100%;">⬇ Tải ảnh PNG</button>
    </div>

    <div class="current-picks" id="currentPicks"></div>
  </div>

  <div class="picker">
    <div class="rail" id="rail"></div>
    <h2 class="grid-title" id="gridTitle">Tóc</h2>
    <div class="grid" id="grid"></div>
  </div>
</div>

<footer>Tự tạo hoàn toàn trong trình duyệt — không lưu dữ liệu ở đâu khác.</footer>

<script>
/* ---------------- geometry helpers ---------------- */
function pt(cx,cy,r,deg){
  const a=deg*Math.PI/180;
  return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
}
function shade(hex,percent){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(ch=>ch+ch).join('');
  let r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  const amt=percent/100*255;
  r=Math.min(255,Math.max(0,Math.round(r+amt)));
  g=Math.min(255,Math.max(0,Math.round(g+amt)));
  b=Math.min(255,Math.max(0,Math.round(b+amt)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function capPath(cx,cy,r,notches,depth,startDeg,endDeg,fringeDrop){
  const steps=notches*2;
  let d='', sx=0, sy=0;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const deg=startDeg+(endDeg-startDeg)*t;
    const rr=(i%2===1)?r+depth:r;
    const [x,y]=pt(cx,cy,rr,deg);
    if(i===0){ d=`M ${x.toFixed(1)},${y.toFixed(1)} `; sx=x; sy=y; }
    else d+=`L ${x.toFixed(1)},${y.toFixed(1)} `;
  }
  d+=`Q ${cx},${(sy+fringeDrop).toFixed(1)} ${sx.toFixed(1)},${sy.toFixed(1)} Z`;
  return d;
}
function girlLongHair(cx,cy,r,dropY,waveCount){
  const steps=waveCount*2, startDeg=185, endDeg=355;
  let d='', sx=0, sy=0;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const deg=startDeg+(endDeg-startDeg)*t;
    const rr=(i%2===1)?r+8:r;
    const [x,y]=pt(cx,cy,rr,deg);
    if(i===0){ d=`M ${x.toFixed(1)},${y.toFixed(1)} `; sx=x; sy=y; }
    else d+=`L ${x.toFixed(1)},${y.toFixed(1)} `;
  }
  const [xr]=pt(cx,cy,r,endDeg);
  d+=`L ${xr.toFixed(1)},${dropY} Q ${cx},${(dropY+20).toFixed(1)} ${sx.toFixed(1)},${dropY} L ${sx.toFixed(1)},${sy.toFixed(1)} Z`;
  return d;
}
function starShape(cx,cy,rOuter,rInner,color){
  let pts=[];
  for(let i=0;i<10;i++){
    const r=i%2===0?rOuter:rInner;
    const a=(Math.PI/5)*i-Math.PI/2;
    pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
  }
  return `<polygon points="${pts.join(' ')}" fill="${color}"/>`;
}
function heartShape(cx,cy,size,color){
  const s=size/16;
  return `<path transform="translate(${cx-16*s},${cy-14*s}) scale(${s})" d="M16,28 C4,20 0,12 0,7 C0,2 4,-2 8,-2 C12,-2 16,1 16,6 C16,1 20,-2 24,-2 C28,-2 32,2 32,7 C32,12 28,20 16,28 Z" fill="${color}" fill-opacity="0.9"/>`;
}

/* ---------------- body / face ---------------- */
function bodyBase(skin){
  const sole=shade(skin,-20);
  return `
    <ellipse cx="150" cy="420" rx="72" ry="10" fill="rgba(36,25,52,0.08)"/>
    <rect x="118" y="255" width="27" height="148" rx="13" fill="${skin}"/>
    <rect x="155" y="255" width="27" height="148" rx="13" fill="${skin}"/>
    <ellipse cx="131" cy="402" rx="18" ry="9" fill="${sole}"/>
    <ellipse cx="169" cy="402" rx="18" ry="9" fill="${sole}"/>
    <rect x="108" y="150" width="84" height="112" rx="27" fill="${skin}"/>
    <rect x="79" y="158" width="27" height="100" rx="13" fill="${skin}"/>
    <rect x="194" y="158" width="27" height="100" rx="13" fill="${skin}"/>
    <circle cx="92" cy="262" r="14" fill="${skin}"/>
    <circle cx="208" cy="262" r="14" fill="${skin}"/>
    <rect x="136" y="118" width="28" height="30" rx="10" fill="${skin}"/>
    <circle cx="150" cy="95" r="56" fill="${skin}"/>
  `;
}
function drawFace(style){
  const ink='#241934';
  let eyes='', brows='', mouth='', blush='';
  if(style!=='fierce'){
    blush=`<circle cx="115" cy="103" r="9" fill="#FF8FAE" opacity="0.35"/><circle cx="185" cy="103" r="9" fill="#FF8FAE" opacity="0.35"/>`;
  }
  switch(style){
    case 'gentle':
      eyes=`<circle cx="128" cy="90" r="8" fill="${ink}"/><circle cx="131" cy="87" r="2.4" fill="#fff"/><circle cx="172" cy="90" r="8" fill="${ink}"/><circle cx="175" cy="87" r="2.4" fill="#fff"/>`;
      brows=`<path d="M118,72 Q128,68 138,72" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M162,72 Q172,68 182,72" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      mouth=`<path d="M138,116 Q150,124 162,116" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      break;
    case 'happy':
      eyes=`<circle cx="128" cy="89" r="10" fill="${ink}"/><circle cx="131.5" cy="85.5" r="3" fill="#fff"/><circle cx="172" cy="89" r="10" fill="${ink}"/><circle cx="175.5" cy="85.5" r="3" fill="#fff"/>`;
      brows=`<path d="M116,68 Q128,63 140,69" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M160,69 Q172,63 184,68" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      mouth=`<path d="M133,114 Q150,136 167,114 Q150,124 133,114 Z" fill="${ink}"/>`;
      break;
    case 'wink':
      eyes=`<circle cx="128" cy="90" r="8" fill="${ink}"/><circle cx="131" cy="87" r="2.4" fill="#fff"/><path d="M163,90 Q172,80 183,90" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      brows=`<path d="M118,70 Q128,66 138,71" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M162,70 Q172,66 182,71" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      mouth=`<path d="M136,115 Q150,128 164,115" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      break;
    case 'laughing':
      eyes=`<path d="M117,89 Q128,77 139,89" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M161,89 Q172,77 183,89" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      brows=`<path d="M116,66 Q128,61 140,67" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M160,67 Q172,61 184,66" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      mouth=`<path d="M129,112 Q150,142 171,112 Q150,130 129,112 Z" fill="${ink}"/>`;
      break;
    case 'fierce':
      eyes=`<rect x="121" y="86" width="15" height="8" rx="3" fill="${ink}"/><rect x="164" y="86" width="15" height="8" rx="3" fill="${ink}"/>`;
      brows=`<path d="M116,74 L140,68" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M160,68 L184,74" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      mouth=`<path d="M136,120 L164,120" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      break;
  }
  return blush+brows+eyes+mouth;
}

/* ---------------- hair ---------------- */
function hairMarkup(h){
  const c=h.color;
  let back='', front='';
  switch(h.style){
    case 'spiky': front=`<path d="${capPath(150,95,60,6,16,185,355,-8)}" fill="${c}"/>`; break;
    case 'messy': front=`<path d="${capPath(150,95,62,5,9,185,355,-2)}" fill="${c}"/>`; break;
    case 'side':  front=`<path d="${capPath(150,95,58,3,4,185,355,2)}" fill="${c}"/>`; break;
    case 'wild':  front=`<path d="${capPath(150,95,64,8,20,185,355,-6)}" fill="${c}"/>`; break;
    case 'long':
      back=`<path d="${girlLongHair(150,95,60,300,4)}" fill="${c}"/>`;
      front=`<path d="${capPath(150,95,58,4,6,185,355,2)}" fill="${c}"/>`;
      break;
    case 'twin':
      back=`<g transform="rotate(-10 88 175)"><ellipse cx="88" cy="175" rx="16" ry="82" fill="${c}"/></g><g transform="rotate(10 212 175)"><ellipse cx="212" cy="175" rx="16" ry="82" fill="${c}"/></g>`;
      front=`<path d="${capPath(150,95,58,4,6,185,355,0)}" fill="${c}"/>`;
      break;
    case 'wavy':
      back=`<path d="${girlLongHair(150,95,52,255,7)}" fill="${c}"/>`;
      front=`<path d="${capPath(150,95,58,5,8,185,355,1)}" fill="${c}"/>`;
      break;
    case 'braid':
      back=`<g transform="rotate(14 198 190)"><ellipse cx="198" cy="190" rx="14" ry="92" fill="${c}"/><rect x="190" y="150" width="16" height="6" rx="3" fill="${shade(c,-25)}"/><rect x="190" y="185" width="16" height="6" rx="3" fill="${shade(c,-25)}"/><rect x="190" y="220" width="16" height="6" rx="3" fill="${shade(c,-25)}"/></g>`;
      front=`<path d="${capPath(150,95,58,4,6,185,355,0)}" fill="${c}"/>`;
      break;
  }
  return {back, front};
}

/* ---------------- clothing ---------------- */
function shirtMarkup(o){
  const c=o.color, d=shade(c,-18);
  const sleeves=`<rect x="77" y="156" width="30" height="60" rx="14" fill="${c}"/><rect x="193" y="156" width="30" height="60" rx="14" fill="${c}"/>`;
  const torso=`<rect x="106" y="149" width="88" height="110" rx="26" fill="${c}"/>`;
  switch(o.style){
    case 'tee':
      return torso+sleeves+`<path d="M132,149 Q150,164 168,149" stroke="${d}" stroke-width="3" fill="none"/>`;
    case 'hoodie':
      return `<path d="M124,152 Q150,110 176,152 Z" fill="${c}"/>`+torso+
        `<rect x="77" y="156" width="30" height="72" rx="14" fill="${c}"/><rect x="193" y="156" width="30" height="72" rx="14" fill="${c}"/>`+
        `<rect x="143" y="152" width="4" height="16" rx="2" fill="${d}"/><rect x="153" y="152" width="4" height="16" rx="2" fill="${d}"/>`+
        `<rect x="128" y="215" width="44" height="24" rx="8" fill="${d}"/>`;
    case 'jacket':
      return torso+sleeves+
        `<rect x="146" y="149" width="8" height="108" fill="${d}"/>`+
        `<path d="M120,149 L138,149 L132,168 Z" fill="${d}"/><path d="M180,149 L162,149 L168,168 Z" fill="${d}"/>`+
        `<rect x="140" y="149" width="20" height="14" fill="#F5F5F5"/>`;
    case 'polo':
      return torso+sleeves+
        `<path d="M128,149 L150,166 L172,149 L164,149 L150,159 L136,149 Z" fill="${d}"/>`+
        `<circle cx="150" cy="185" r="2.4" fill="${d}"/><circle cx="150" cy="200" r="2.4" fill="${d}"/>`;
    case 'sweater':
      return torso+sleeves+
        `<rect x="77" y="204" width="30" height="12" rx="4" fill="${d}"/><rect x="193" y="204" width="30" height="12" rx="4" fill="${d}"/>`+
        `<circle cx="150" cy="158" r="14" fill="none" stroke="${d}" stroke-width="4"/>`;
    case 'cardigan':
      return `<rect x="140" y="149" width="20" height="110" fill="#F5F5F5"/>`+
        `<rect x="104" y="149" width="42" height="110" rx="20" fill="${c}"/><rect x="154" y="149" width="42" height="110" rx="20" fill="${c}"/>`+
        sleeves+
        `<path d="M138,168 L150,180 L162,168 L156,188 L150,180 L144,188 Z" fill="${d}"/>`;
    case 'sailor':
      return torso+sleeves+
        `<path d="M112,150 L150,190 L188,150 L188,168 L150,205 L112,168 Z" fill="${d}"/>`+
        `<path d="M150,190 L138,222 L162,222 Z" fill="#C0392B"/>`;
  }
  return torso+sleeves;
}
function pantsMarkup(o){
  const c=o.color, d=shade(c,-20);
  switch(o.style){
    case 'shorts':
      return `<rect x="112" y="255" width="76" height="72" rx="18" fill="${c}"/>`;
    case 'jeans':
      return `<rect x="112" y="255" width="76" height="148" rx="15" fill="${c}"/><line x1="150" y1="258" x2="150" y2="398" stroke="${d}" stroke-width="2" opacity="0.4"/>`;
    case 'cargo':
      return `<rect x="112" y="255" width="76" height="95" rx="16" fill="${c}"/><rect x="103" y="292" width="18" height="26" rx="4" fill="${d}"/><rect x="179" y="292" width="18" height="26" rx="4" fill="${d}"/>`;
    case 'joggers':
      return `<rect x="112" y="255" width="76" height="148" rx="15" fill="${c}"/><rect x="120" y="255" width="6" height="148" fill="${d}"/><rect x="174" y="255" width="6" height="148" fill="${d}"/><rect x="112" y="380" width="76" height="18" rx="9" fill="${d}"/>`;
    case 'skirt':

  return `<rect x="112" y="255" width="76" height="90" rx="16" fill="${c}"/>`;

function shoesMarkup(o){

/* ---------------- hat / glasses / accessory ---------------- */

function glassesMarkup(o){
  if(o.style==='none') return '';
  const c=o.color;
  switch(o.style){
    case 'round':
      return `<circle cx="128" cy="90" r="16" fill="#fff" fill-opacity="0.3" stroke="${c}" stroke-width="4"/><circle cx="172" cy="90" r="16" fill="#fff" fill-opacity="0.3" stroke="${c}" stroke-width="4"/><line x1="144" y1="90" x2="156" y2="90" stroke="${c}" stroke-width="4"/>`;
    case 'sun':
      return `<rect x="112" y="78" width="32" height="24" rx="7" fill="${c}"/><rect x="156" y="78" width="32" height="24" rx="7" fill="${c}"/><rect x="144" y="86" width="12" height="6" fill="${c}"/>`;
    case 'heart':
      return heartShape(128,88,16,c)+heartShape(172,88,16,c)+`<line x1="144" y1="90" x2="156" y2="90" stroke="${c}" stroke-width="3"/>`;
    case 'cat':
      return `<path d="M108,86 L144,80 L144,98 L112,100 Z" fill="#fff" fill-opacity="0.25" stroke="${c}" stroke-width="4"/><path d="M192,86 L156,80 L156,98 L188,100 Z" fill="#fff" fill-opacity="0.25" stroke="${c}" stroke-width="4"/><line x1="144" y1="88" x2="156" y2="88" stroke="${c}" stroke-width="4"/>`;
    case 'star':
      return starShape(128,88,14,6,c)+starShape(172,88,14,6,c);
  }
  return '';
}
function accessoryMarkup(o){
  if(o.style==='none') return {back:'',front:''};
  const c=o.color, d=shade(c,-20);
  switch(o.style){
    case 'headphones':
      return {back:'', front:`<path d="M100,70 Q150,18 200,70" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="100" cy="98" r="15" fill="${c}"/><circle cx="200" cy="98" r="15" fill="${c}"/><circle cx="100" cy="98" r="7" fill="#241934"/><circle cx="200" cy="98" r="7" fill="#241934"/>`};

    case 'mask':
      return {back:'', front:`<rect x="121" y="100" width="58" height="26" rx="13" fill="${c}"/><line x1="121" y1="108" x2="90" y2="96" stroke="${c}" stroke-width="3"/><line x1="179" y1="108" x2="210" y2="96" stroke="${c}" stroke-width="3"/>`};
    case 'backpack':
      return {back:`<rect x="118" y="140" width="64" height="26" rx="10" fill="${c}"/>`, front:`<rect x="132" y="148" width="8" height="40" rx="4" fill="${d}"/><rect x="160" y="148" width="8" height="40" rx="4" fill="${d}"/>`};
    case 'ears':
      return {back:'', front:`<path d="M118,42 L128,4 L146,36 Z" fill="${c}"/><path d="M182,42 L172,4 L154,36 Z" fill="${c}"/><path d="M122,38 L129,14 L140,34 Z" fill="#F2A6C6"/><path d="M178,38 L171,14 L160,34 Z" fill="#F2A6C6"/>`};

  }
  return {back:'',front:''};
}

  {key:'shoes', label:'Giày'},
  {key:'hat', label:'Mũ'},
  {key:'glasses', label:'Kính'},
  {key:'accessory', label:'Phụ kiện'}
];

/* ---------------- state ---------------- */
let state={gender:'boy', skin:0, face:1, hair:0, shirt:0, pants:0, shoes:0, hat:0, glasses:0, accessory:0};
let activeCategory='hair';

function getOptions(key){
  switch(key){
    case 'skin': return SKIN;
    case 'face': return FACE;
    case 'hair': return HAIR[state.gender];
    case 'shirt': return SHIRT[state.gender];
    case 'pants': return PANTS[state.gender];
    case 'shoes': return SHOES[state.gender];
    case 'hat': return HAT;
    case 'glasses': return GLASSES;
    case 'accessory': return ACCESSORY;
  }
}

/* ---------------- render ---------------- */
function renderAvatar(){
  const skin=SKIN[state.skin].hex;
  const faceStyle=FACE[state.face].style;
  const hairOpt=HAIR[state.gender][state.hair];
  const shirtOpt=SHIRT[state.gender][state.shirt];
  const pantsOpt=PANTS[state.gender][state.pants];
  const shoesOpt=SHOES[state.gender][state.shoes];
  const hatOpt=HAT[state.hat];
  const glassesOpt=GLASSES[state.glasses];
  const accOpt=ACCESSORY[state.accessory];

  const hair=hairMarkup(hairOpt);
  const acc=accessoryMarkup(accOpt);

  document.getElementById('avatarLayers').innerHTML=
    acc.back+
    hair.back+
    bodyBase(skin)+
    pantsMarkup(pantsOpt)+
    shirtMarkup(shirtOpt)+
    shoesMarkup(shoesOpt)+
    drawFace(faceStyle)+
    hair.front+
    hatMarkup(hatOpt)+
    glassesMarkup(glassesOpt)+
    acc.front;

  document.getElementById('currentPicks').innerHTML=
    `<b>${SKIN[state.skin].name}</b> · ${FACE[state.face].name} · ${hairOpt.name}<br>`+
    `${shirtOpt.name} · ${pantsOpt.name} · ${shoesOpt.name}<br>`+
    `${hatOpt.name} · ${glassesOpt.name} · ${accOpt.name}`;
}

function renderRail(){
  const rail=document.getElementById('rail');
  rail.innerHTML=CATEGORIES.map(cat=>{
    const opts=getOptions(cat.key);
    const cur=opts[state[cat.key]];
    let swatch;
    if(cat.key==='face'){
      swatch=`<span class="rail-swatch">${cur.emoji}</span>`;
    } else if(cur.style==='none'){
      swatch=`<span class="rail-swatch is-empty"></span>`;
    } else {
      const color=cat.key==='skin'? cur.hex : cur.color;
      swatch=`<span class="rail-swatch" style="background:${color}"></span>`;
    }
    return `<button class="rail-btn ${cat.key===activeCategory?'is-active':''}" data-cat="${cat.key}">
      ${swatch}<span class="rail-label">${cat.label}</span>
    </button>`;
  }).join('');
}

function renderGrid(){
  const cat=CATEGORIES.find(c=>c.key===activeCategory);
  const opts=getOptions(activeCategory);
  document.getElementById('gridTitle').textContent=cat.label;
  document.getElementById('grid').innerHTML=opts.map((o,i)=>{
    const active=i===state[activeCategory]?'is-active':'';
    let tileStyle='', content='';
    if(activeCategory==='face'){
      tileStyle='background:#FFF1E4';
      content=`<span>${o.emoji}</span>`;
    } else if(activeCategory==='skin'){
      tileStyle=`background:${o.hex}`;
    } else if(o.style==='none'){
      tileStyle='background:repeating-linear-gradient(45deg,#EDEBF8,#EDEBF8 6px,#E1DEF4 6px,#E1DEF4 12px)';
      content='<span class="tile-none">–</span>';
    } else {
      tileStyle=`background:${o.color}`;
    }
    return `<div class="tile-wrap">
      <button class="tile ${active}" data-index="${i}" style="${tileStyle}" title="${o.name}">
        ${content}${active?'<span class="tile-check">✓</span>':''}
      </button>
      <span class="tile-label">${o.name}</span>
    </div>`;
  }).join('');
}

function renderAll(){ renderAvatar(); renderRail(); renderGrid(); }

/* ---------------- events ---------------- */
document.getElementById('rail').addEventListener('click', e=>{
  const btn=e.target.closest('.rail-btn');
  if(!btn) return;
  activeCategory=btn.dataset.cat;
  renderRail(); renderGrid();
});
document.getElementById('grid').addEventListener('click', e=>{
  const btn=e.target.closest('.tile');
  if(!btn) return;
  state[activeCategory]=parseInt(btn.dataset.index,10);
  renderAll();
});
document.getElementById('genderToggle').addEventListener('click', e=>{
  const btn=e.target.closest('[data-gender]');
  if(!btn) return;
  state.gender=btn.dataset.gender;
  document.querySelectorAll('#genderToggle [data-gender]').forEach(b=>b.classList.toggle('is-active', b===btn));
  renderAll();
});
document.getElementById('randomizeBtn').addEventListener('click', ()=>{
  state.gender=Math.random()<0.5?'boy':'girl';
  document.querySelectorAll('#genderToggle [data-gender]').forEach(b=>b.classList.toggle('is-active', b.dataset.gender===state.gender));
  CATEGORIES.forEach(cat=>{
    const opts=getOptions(cat.key);
    state[cat.key]=Math.floor(Math.random()*opts.length);
  });
  renderAll();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state={gender:'boy', skin:0, face:1, hair:0, shirt:0, pants:0, shoes:0, hat:0, glasses:0, accessory:0};
  document.querySelectorAll('#genderToggle [data-gender]').forEach(b=>b.classList.toggle('is-active', b.dataset.gender==='boy'));
  renderAll();
});
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const svg=document.getElementById('avatarSvg');
  const xml=new XMLSerializer().serializeToString(svg);
  const svg64=btoa(unescape(encodeURIComponent(xml)));
  const img=new Image();
  img.onload=function(){
    const canvas=document.createElement('canvas');
    canvas.width=600; canvas.height=880;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#F5F3FF';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,600,880);
    canvas.toBlob(function(blob){
      const link=document.createElement('a');
      link.download='avatar.png';
      link.href=URL.createObjectURL(blob);
      link.click();
    });
  };
  img.src='data:image/svg+xml;base64,'+svg64;
});

renderAll();
</script>
