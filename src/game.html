  /* chalk dashed divider */

    border:none;
    border-top:3px dashed rgba(31,58,52,0.18);
  }
  .chalk-rule-light{
    border:none;
    border-top:2px dashed rgba(246,241,228,0.28);

  /* signature chalk token badge used for templates, results, ranks */
  .chalk-token{
    display:flex; align-items:center; justify-content:center;
    border-radius:9999px;
    border:3px dashed var(--ring, #F4B942);
    background:#FFFDF7;

  ::-webkit-scrollbar-thumb{ background:#D8CFB8; border-radius:8px; }

  @keyframes pop-in{
    0%{ transform:scale(.92); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .anim-pop{ animation: pop-in .28s cubic-bezier(.2,.9,.3,1.3) both; }

  @keyframes chalk-progress{
    from{ stroke-dashoffset: var(--circ); }
    to{ stroke-dashoffset: 0; }
  }

  @keyframes float-slow{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-6px); }
  }
  .float-slow{ animation: float-slow 3.6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    .anim-pop, .float-slow{ animation:none !important; }

  input:focus, button:focus, select:focus, textarea:focus{

  }

  .badge-status{
    font-family:'JetBrains Mono', monospace;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

</style>

const mockGameTemplates = [

const initialGames = [

  { id: "game-002", title: "Khám phá vũ trụ", description: "Cùng khám phá những kiến thức thú vị về vũ trụ", subject: "Khoa học", topic: "Vũ trụ", language: "vi", template: "space-ship", status: "published", thumbnail: null, questionsCount: 3, playersCount: 18, code: "VUTRU22", createdAt: "2026-08-11T09:00:00Z", updatedAt: "2026-08-16T14:20:00Z" },

const initialQuestions = [

  { id: "question-002", gameId: "game-001", content: "56 + 24 bằng bao nhiêu?", options: [{ id: "answer-004", content: "70" }, { id: "answer-005", content: "80" }, { id: "answer-006", content: "90" }], correctAnswer: "answer-005", timeLimit: 15, points: 100, image: null },
  { id: "question-003", gameId: "game-001", content: "Một lớp có 32 học sinh, đã có 19 bạn nộp bài. Hỏi còn bao nhiêu bạn chưa nộp?", options: [{ id: "answer-007", content: "11 bạn" }, { id: "answer-008", content: "12 bạn" }, { id: "answer-009", content: "13 bạn" }], correctAnswer: "answer-008", timeLimit: 20, points: 100, image: null },
  { id: "question-004", gameId: "game-002", content: "Hành tinh nào được gọi là \"Hành tinh Đỏ\"?", options: [{ id: "answer-010", content: "Sao Kim" }, { id: "answer-011", content: "Sao Hỏa" }, { id: "answer-012", content: "Sao Thổ" }], correctAnswer: "answer-011", timeLimit: 15, points: 100, image: null },
  { id: "question-005", gameId: "game-002", content: "Hệ Mặt Trời có tất cả bao nhiêu hành tinh?", options: [{ id: "answer-013", content: "7" }, { id: "answer-014", content: "8" }, { id: "answer-015", content: "9" }], correctAnswer: "answer-014", timeLimit: 15, points: 100, image: null },
  { id: "question-006", gameId: "game-002", content: "Ngôi sao nào gần Trái Đất nhất?", options: [{ id: "answer-016", content: "Mặt Trời" }, { id: "answer-017", content: "Sao Bắc Cực" }, { id: "answer-018", content: "Sao Hôm" }], correctAnswer: "answer-016", timeLimit: 20, points: 100, image: null },
  { id: "question-007", gameId: "game-003", content: "Thủ đô của Việt Nam là gì?", options: [{ id: "answer-019", content: "Hà Nội" }, { id: "answer-020", content: "Đà Nẵng" }, { id: "answer-021", content: "TP. Hồ Chí Minh" }], correctAnswer: "answer-019", timeLimit: 15, points: 100, image: null },
  { id: "question-008", gameId: "game-003", content: "1 giờ có bao nhiêu phút?", options: [{ id: "answer-022", content: "50" }, { id: "answer-023", content: "60" }, { id: "answer-024", content: "70" }], correctAnswer: "answer-023", timeLimit: 10, points: 100, image: null },
];

const mockPlayersPool = [
  { name: "Nguyễn Minh Anh" }, { name: "Trần Gia Huy" }, { name: "Lê Khánh Linh" },
  { name: "Phạm Bảo Ngọc" }, { name: "Đỗ Quang Vinh" }, { name: "Vũ Thảo My" },
];

const initialResults = [
  { id: "result-001", gameId: "game-001", playerId: "player-001", playerName: "Nguyễn Minh Anh", score: 850, correctAnswers: 9, totalQuestions: 10, accuracy: 90, completionTime: 142, rank: 1 },
  { id: "result-002", gameId: "game-001", playerId: "player-002", playerName: "Trần Gia Huy", score: 780, correctAnswers: 8, totalQuestions: 10, accuracy: 80, completionTime: 156, rank: 2 },
  { id: "result-003", gameId: "game-001", playerId: "player-003", playerName: "Lê Khánh Linh", score: 720, correctAnswers: 8, totalQuestions: 10, accuracy: 80, completionTime: 168, rank: 3 },
];

const mockCurrentUser = { id: "user-001", name: "Nguyễn Minh Anh", role: "teacher", avatar: null };

const SUBJECTS = ["Toán", "Khoa học", "Tiếng Việt", "Tổng hợp", "Tiếng Anh"];

/* =========================================================================
   MOCK PERSISTENCE (localStorage) — swap-friendly service layer
   ========================================================================= */

const STORAGE_KEYS = { games: "lms_games", questions: "lms_questions", results: "lms_results" };

function loadStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) { localStorage.setItem(key, JSON.stringify(fallback)); return JSON.parse(JSON.stringify(fallback)); }
    return JSON.parse(raw);
  } catch (e) { return JSON.parse(JSON.stringify(fallback)); }
}
function saveStore(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { /* ignore quota errors */ }
}

const delay = (ms) => new Promise((res) => setTimeout(res, ms));
const uid = (prefix) => `${prefix}-${Math.random().toString(36).slice(2, 9)}`;

/* gameService / questionService / resultService simulate an async CRUD API.
   Swapping these bodies for real `fetch()` calls later requires no UI changes. */
const gameService = {
  async list(filters = {}) {
    await delay(500);
    let games = loadStore(STORAGE_KEYS.games, initialGames);
    if (filters.query) {
      const q = filters.query.trim().toLowerCase();
      games = games.filter(g => g.title.toLowerCase().includes(q) || g.topic.toLowerCase().includes(q));
    }
    if (filters.status && filters.status !== "all") games = games.filter(g => g.status === filters.status);
    if (filters.subject && filters.subject !== "all") games = games.filter(g => g.subject === filters.subject);
    return games.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  },
  async get(id) {
    await delay(350);
    const games = loadStore(STORAGE_KEYS.games, initialGames);
    return games.find(g => g.id === id) || null;
  },
  async getByCode(code) {
    await delay(600);
    const games = loadStore(STORAGE_KEYS.games, initialGames);
    return games.find(g => g.code.toLowerCase() === code.trim().toLowerCase() && g.status === "published") || null;
  },
  async create(data) {
    await delay(400);
    const games = loadStore(STORAGE_KEYS.games, initialGames);
    const now = new Date().toISOString();
    const game = { id: uid("game"), status: "draft", playersCount: 0, questionsCount: 0, code: uid("code").slice(0, 8).toUpperCase(), createdAt: now, updatedAt: now, ...data };
    games.push(game);
    saveStore(STORAGE_KEYS.games, games);
    return game;
  },
  async update(id, data) {
    await delay(400);
    const games = loadStore(STORAGE_KEYS.games, initialGames);
    const idx = games.findIndex(g => g.id === id);
    if (idx === -1) throw new Error("Không tìm thấy trò chơi");
    games[idx] = { ...games[idx], ...data, updatedAt: new Date().toISOString() };
    saveStore(STORAGE_KEYS.games, games);
    return games[idx];
  },
  async remove(id) {
    await delay(350);
    let games = loadStore(STORAGE_KEYS.games, initialGames);
    games = games.filter(g => g.id !== id);
    saveStore(STORAGE_KEYS.games, games);
    let qs = loadStore(STORAGE_KEYS.questions, initialQuestions);
    qs = qs.filter(q => q.gameId !== id);
    saveStore(STORAGE_KEYS.questions, qs);
    return true;
  },
  async duplicate(id) {
    await delay(450);
    const games = loadStore(STORAGE_KEYS.games, initialGames);
    const src = games.find(g => g.id === id);
    if (!src) throw new Error("Không tìm thấy trò chơi");
    const now = new Date().toISOString();
    const copy = { ...src, id: uid("game"), title: `${src.title} (Bản sao)`, status: "draft", playersCount: 0, code: uid("code").slice(0, 8).toUpperCase(), createdAt: now, updatedAt: now };
    games.push(copy);
    saveStore(STORAGE_KEYS.games, games);
    const qs = loadStore(STORAGE_KEYS.questions, initialQuestions).filter(q => q.gameId === id);
    const allQs = loadStore(STORAGE_KEYS.questions, initialQuestions);
    qs.forEach(q => allQs.push({ ...q, id: uid("question"), gameId: copy.id }));
    saveStore(STORAGE_KEYS.questions, allQs);
    return copy;
  },
};

const questionService = {
  async listByGame(gameId) {
    await delay(350);
    return loadStore(STORAGE_KEYS.questions, initialQuestions).filter(q => q.gameId === gameId);
  },
  async save(gameId, questions) {
    await delay(300);
    let all = loadStore(STORAGE_KEYS.questions, initialQuestions);
    all = all.filter(q => q.gameId !== gameId);
    all = all.concat(questions.map(q => ({ ...q, gameId })));
    saveStore(STORAGE_KEYS.questions, all);
    const games = loadStore(STORAGE_KEYS.games, initialGames);
    const idx = games.findIndex(g => g.id === gameId);
    if (idx !== -1) { games[idx].questionsCount = questions.length; saveStore(STORAGE_KEYS.games, games); }
    return questions;
  },
};

const resultService = {
  async listByGame(gameId) {
    await delay(450);
    return loadStore(STORAGE_KEYS.results, initialResults).filter(r => r.gameId === gameId).sort((a, b) => b.score - a.score);
  },
  async submit(result) {
    await delay(300);
    const all = loadStore(STORAGE_KEYS.results, initialResults);
    const entry = { id: uid("result"), ...result };
    all.push(entry);
    saveStore(STORAGE_KEYS.results, all);
    return entry;
  },
};

/* =========================================================================
   SMALL UI PRIMITIVES
   ========================================================================= */

function ChalkToken({ icon, ring = "#F4B942", size = 56, fontSize = 24, className = "" }) {
  return (
    <div className={`chalk-token ${className}`} style={{ "--ring": ring, width: size, height: size, fontSize: fontSize }}>
      <span>{icon}</span>
    </div>

}

function StatusBadge({ status }) {
  const map = {
    published: { label: "Đã xuất bản", cls: "bg-mint/15 text-mint border-mint/30" },
    draft: { label: "Bản nháp", cls: "bg-marigold/15 text-[#8a6a10] border-marigold/40" },
  };
  const s = map[status] || map.draft;
  return (
    <span className={`badge-status text-[11px] uppercase px-2.5 py-1 rounded-full border ${s.cls}`}>{s.label}</span>
  );
}

function PrimaryButton({ children, onClick, className = "", disabled, type = "button" }) {
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`font-display font-semibold rounded-2xl px-5 py-3 bg-board text-paper hover:bg-board2 active:scale-[0.98] transition disabled:opacity-40 disabled:cursor-not-allowed shadow-[0_3px_0_rgba(0,0,0,0.15)] ${className}`}>
      {children}
    </button>
  );
}
function GhostButton({ children, onClick, className = "", disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className={`font-display font-semibold rounded-2xl px-5 py-3 border-2 border-board/20 text-board hover:bg-board/5 active:scale-[0.98] transition disabled:opacity-40 ${className}`}>
      {children}
    </button>

}
function IconButton({ children, onClick, title, className = "" }) {
  return (
    <button onClick={onClick} title={title}
      className={`w-9 h-9 rounded-full flex items-center justify-center border border-board/15 text-board hover:bg-board/5 transition ${className}`}>
      {children}

}

function Loader({ label = "Đang tải..." }) {
  return (
    <div className="flex flex-col items-center justify-center py-16 gap-4 text-board/70">
      <div className="relative w-14 h-14">
        <div className="absolute inset-0 rounded-full border-4 border-board/10"></div>
        <div className="absolute inset-0 rounded-full border-4 border-marigold border-t-transparent animate-spin"></div>
      </div>
      <p className="font-body text-sm">{label}</p>
    </div>

}

function EmptyState({ icon = "🗂️", title, subtitle, action }) {
  return (
    <div className="flex flex-col items-center justify-center text-center py-16 px-6 gap-3">
      <div className="text-5xl float-slow">{icon}</div>
      <h3 className="font-display text-lg text-board">{title}</h3>
      {subtitle && <p className="text-sm text-[#786F5B] max-w-sm">{subtitle}</p>}
      {action}
    </div>
  );
}

function ErrorState({ title = "Đã có lỗi xảy ra", subtitle, onRetry }) {
  return (
    <div className="flex flex-col items-center justify-center text-center py-16 px-6 gap-3">
      <div className="text-5xl">🧭</div>
      <h3 className="font-display text-lg text-coral">{title}</h3>
      {subtitle && <p className="text-sm text-[#786F5B] max-w-sm">{subtitle}</p>}
      {onRetry && <PrimaryButton onClick={onRetry}>Thử lại</PrimaryButton>}
    </div>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  const cls = toast.type === "error" ? "bg-coral text-white" : toast.type === "success" ? "bg-mint text-white" : "bg-board text-paper";
  return (
    <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl shadow-lg font-body text-sm anim-pop ${cls}`}>
      {toast.message}
    </div>
  );
}

/* =========================================================================
   APP SHELL / NAVIGATION STATE
   ========================================================================= */

function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((message, type = "info") => {
    setToast({ message, type });
    window.clearTimeout(show._t);
    show._t = window.setTimeout(() => setToast(null), 2600);
  }, []);
  return [toast, show];
}

function App() {
  const [role, setRole] = useState(null); // null | 'teacher' | 'student'
  const [toast, showToast] = useToast();

  if (!role) return <HomeScreen onSelectRole={setRole} />;
  if (role === "teacher") return <TeacherApp onExit={() => setRole(null)} showToast={showToast} toast={toast} />;
  return <StudentApp onExit={() => setRole(null)} showToast={showToast} toast={toast} />;
}

      <div className="max-w-3xl w-full text-center">
        <div className="flex justify-center gap-3 mb-6">
          {mockGameTemplates.map(t => (

        </div>
        <h1 className="font-display text-5xl md:text-6xl text-paper leading-tight mb-4">
          Lớp Học <span className="text-marigold">Vui</span>
        </h1>
        <p className="font-body text-paper/70 text-lg max-w-xl mx-auto mb-12">
          Nền tảng trò chơi học tập — giáo viên tạo bài, học sinh tham gia bằng mã và cùng leo hạng trên bảng xếp hạng.
        </p>
        <div className="grid sm:grid-cols-2 gap-5 text-left">
          <button onClick={() => onSelectRole("teacher")}
            className="anim-pop card-paper p-6 text-left hover:-translate-y-1 transition shadow-[0_4px_0_rgba(0,0,0,0.12)] group">
            <ChalkToken icon="🧑‍🏫" ring="#F4B942" size={52} fontSize={22} />
            <h3 className="font-display text-xl mt-4 text-board">Tôi là giáo viên</h3>
            <p className="text-sm text-[#786F5B] mt-1">Tạo trò chơi, quản lý câu hỏi và theo dõi kết quả lớp học.</p>
            <span className="inline-block mt-4 text-sm font-semibold text-ink2 group-hover:translate-x-1 transition">Vào Dashboard →</span>
          </button>
          <button onClick={() => onSelectRole("student")}
            className="anim-pop card-paper p-6 text-left hover:-translate-y-1 transition shadow-[0_4px_0_rgba(0,0,0,0.12)] group" style={{ animationDelay: ".05s" }}>
            <ChalkToken icon="🎒" ring="#4CAF7D" size={52} fontSize={22} />
            <h3 className="font-display text-xl mt-4 text-board">Tôi là học sinh</h3>
            <p className="text-sm text-[#786F5B] mt-1">Nhập mã trò chơi để tham gia cùng cả lớp và ghi điểm.</p>
            <span className="inline-block mt-4 text-sm font-semibold text-mint group-hover:translate-x-1 transition">Tham gia ngay →</span>
          </button>
        </div>
        <p className="text-paper/40 text-xs mt-10 font-mono">Frontend Prototype · Dữ liệu mô phỏng (Mock Data)</p>

function TeacherApp({ onExit, showToast, toast }) {
  const [screen, setScreen] = useState("dashboard"); // dashboard | library | create | edit | results
  const [activeGameId, setActiveGameId] = useState(null);
  const [refreshFlag, setRefreshFlag] = useState(0);
  const bump = () => setRefreshFlag(f => f + 1);

  const goResults = (id) => { setActiveGameId(id); setScreen("results"); };
  const goEdit = (id) => { setActiveGameId(id); setScreen("create"); };
  const goCreateNew = () => { setActiveGameId(null); setScreen("create"); };

  return (
    <div className="min-h-screen flex flex-col bg-paper">
      <TeacherNav screen={screen} setScreen={setScreen} onExit={onExit} onCreate={goCreateNew} />
      <main className="flex-1 max-w-6xl w-full mx-auto px-5 md:px-8 py-8">
        {screen === "dashboard" && (
          <TeacherDashboard key={refreshFlag} onOpenLibrary={() => setScreen("library")} onCreate={goCreateNew} onEdit={goEdit} onResults={goResults} />
        )}
        {screen === "library" && (
          <GameLibrary key={refreshFlag} onCreate={goCreateNew} onEdit={goEdit} onResults={goResults}
            showToast={showToast} onChanged={bump} />
        )}
        {screen === "create" && (
          <CreateGameFlow gameId={activeGameId} showToast={showToast}
            onDone={() => { bump(); setScreen("library"); }}
            onCancel={() => setScreen("library")} />
        )}
        {screen === "results" && (
          <TeacherResults gameId={activeGameId} onBack={() => setScreen("library")} />
        )}
      </main>
      <Toast toast={toast} />
    </div>
  );
}

function TeacherNav({ screen, setScreen, onExit, onCreate }) {
  const tabs = [
    { id: "dashboard", label: "Dashboard" },
    { id: "library", label: "Thư viện trò chơi" },
  ];
  return (
    <header className="board-panel sticky top-0 z-20">
      <div className="max-w-6xl mx-auto px-5 md:px-8 py-4 flex items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <span className="text-2xl">🎓</span>
          <span className="font-display text-paper text-lg">Lớp Học Vui</span>
        </div>
        <nav className="hidden sm:flex items-center gap-1 bg-paper/10 rounded-full p-1">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setScreen(t.id)}
              className={`px-4 py-2 rounded-full text-sm font-body transition ${screen === t.id ? "bg-marigold text-board font-semibold" : "text-paper/70 hover:text-paper"}`}>
              {t.label}
            </button>
          ))}
        </nav>
        <div className="flex items-center gap-3">
          <PrimaryButton onClick={onCreate} className="!bg-marigold !text-board !shadow-none px-4 py-2 text-sm">+ Tạo trò chơi</PrimaryButton>
          <button onClick={onExit} className="flex items-center gap-2 text-paper/70 hover:text-paper text-sm">
            <span className="w-8 h-8 rounded-full bg-paper/15 flex items-center justify-center font-display">{mockCurrentUser.name[0]}</span>
            <span className="hidden md:inline">Thoát</span>
          </button>
        </div>
      </div>
    </header>
  );
}

function TeacherDashboard({ onOpenLibrary, onCreate, onEdit, onResults }) {
  const [games, setGames] = useState(null);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    setGames(null); setError(null);
    gameService.list().then(setGames).catch(e => setError(e.message));
  }, []);
  useEffect(() => { load(); }, [load]);

  const stats = useMemo(() => {
    if (!games) return null;
    const published = games.filter(g => g.status === "published").length;
    const drafts = games.filter(g => g.status === "draft").length;
    const players = games.reduce((s, g) => s + g.playersCount, 0);
    return { total: games.length, published, drafts, players };
  }, [games]);

  return (
    <div className="space-y-8">
      <div>
        <p className="text-[#786F5B] text-sm font-mono">Xin chào,</p>
        <h1 className="font-display text-3xl text-board">{mockCurrentUser.name} 👋</h1>
      </div>

      {error && <ErrorState subtitle="Không thể tải dữ liệu Dashboard." onRetry={load} />}
      {!error && !games && <Loader label="Đang tải dashboard..." />}

      {!error && games && (
        <React.Fragment>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {[
              { label: "Tổng trò chơi", value: stats.total, icon: "🗂️", ring: "#5B4B8A" },
              { label: "Đã xuất bản", value: stats.published, icon: "✅", ring: "#4CAF7D" },
              { label: "Bản nháp", value: stats.drafts, icon: "✏️", ring: "#F4B942" },
              { label: "Lượt chơi", value: stats.players, icon: "🎮", ring: "#FF6B5B" },
            ].map(s => (
              <div key={s.label} className="card-paper p-5">
                <ChalkToken icon={s.icon} ring={s.ring} size={40} fontSize={18} />
                <div className="font-display text-2xl text-board mt-3">{s.value}</div>
                <div className="text-xs text-[#786F5B] font-mono uppercase mt-1">{s.label}</div>
              </div>
            ))}
          </div>

          <div>
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-display text-xl text-board">Trò chơi gần đây</h2>
              <button onClick={onOpenLibrary} className="text-sm text-ink2 font-semibold hover:underline">Xem tất cả →</button>
            </div>
            {games.length === 0 ? (
              <EmptyState icon="🎲" title="Chưa có trò chơi nào" subtitle="Tạo trò chơi đầu tiên để bắt đầu ôn tập cùng học sinh."
                action={<PrimaryButton onClick={onCreate} className="mt-2">+ Tạo trò chơi</PrimaryButton>} />
            ) : (
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {games.slice(0, 3).map(g => (
                  <GameCard key={g.id} game={g} onEdit={() => onEdit(g.id)} onResults={() => onResults(g.id)} />
                ))}
              </div>
            )}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function GameCard({ game, onEdit, onResults, onDuplicate, onDelete, onShare }) {
  const tpl = mockGameTemplates.find(t => t.id === game.template);
  return (
    <div className="card-paper p-5 flex flex-col gap-3 anim-pop hover:-translate-y-0.5 transition shadow-[0_2px_0_rgba(0,0,0,0.06)]">
      <div className="flex items-start justify-between">
        <ChalkToken icon={tpl ? tpl.icon : "🎲"} ring={tpl ? tpl.ring : "#5B4B8A"} size={44} fontSize={20} />
        <StatusBadge status={game.status} />
      </div>
      <div>
        <h3 className="font-display text-lg text-board leading-snug clamp-2">{game.title}</h3>
        <p className="text-sm text-[#786F5B] mt-1 clamp-2">{game.description}</p>
      </div>
      <div className="flex items-center gap-3 text-xs text-[#786F5B] font-mono">
        <span>{game.subject}</span><span>·</span><span>{game.questionsCount} câu hỏi</span><span>·</span><span>{game.playersCount} lượt chơi</span>
      </div>
      <hr className="chalk-rule my-1" />
      <div className="flex items-center justify-between gap-2">
        <div className="flex gap-2">
          <IconButton title="Chỉnh sửa" onClick={onEdit}>✏️</IconButton>
          {onDuplicate && <IconButton title="Sao chép" onClick={onDuplicate}>📄</IconButton>}
          {onShare && game.status === "published" && <IconButton title="Chia sẻ" onClick={onShare}>🔗</IconButton>}
          {onDelete && <IconButton title="Xóa" onClick={onDelete}>🗑️</IconButton>}

        <button onClick={onResults} className="text-sm font-semibold text-ink2 hover:underline">Kết quả →</button>

}

function GameLibrary({ onCreate, onEdit, onResults, showToast, onChanged }) {
  const [query, setQuery] = useState("");
  const [status, setStatus] = useState("all");
  const [subject, setSubject] = useState("all");
  const [games, setGames] = useState(null);
  const [error, setError] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [shareGame, setShareGame] = useState(null);

  const load = useCallback(() => {
    setGames(null); setError(null);
    gameService.list({ query, status, subject }).then(setGames).catch(e => setError(e.message || "Lỗi tải dữ liệu"));
  }, [query, status, subject]);

  useEffect(() => { const t = setTimeout(load, 250); return () => clearTimeout(t); }, [load]);

  const handleDelete = async (id) => {
    await gameService.remove(id);
    showToast("Đã xóa trò chơi", "success");
    setConfirmDelete(null);
    onChanged(); load();
  };
  const handleDuplicate = async (id) => {
    await gameService.duplicate(id);
    showToast("Đã sao chép trò chơi vào Bản nháp", "success");
    onChanged(); load();
  };

  return (
    <div className="space-y-6">
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <h1 className="font-display text-3xl text-board">Thư viện trò chơi</h1>
        <PrimaryButton onClick={onCreate}>+ Tạo trò chơi mới</PrimaryButton>
      </div>

      <div className="flex flex-col sm:flex-row gap-3">
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Tìm theo tên hoặc chủ đề..."
          className="flex-1 card-paper px-4 py-2.5 text-sm placeholder:text-[#A69C82]" />
        <select value={status} onChange={e => setStatus(e.target.value)} className="card-paper px-4 py-2.5 text-sm">
          <option value="all">Tất cả trạng thái</option>
          <option value="published">Đã xuất bản</option>
          <option value="draft">Bản nháp</option>
        </select>
        <select value={subject} onChange={e => setSubject(e.target.value)} className="card-paper px-4 py-2.5 text-sm">

      </div>

      {error && <ErrorState subtitle="Không thể tải thư viện trò chơi." onRetry={load} />}
      {!error && !games && <Loader label="Đang tìm trò chơi..." />}
      {!error && games && games.length === 0 && (
        <EmptyState icon="🔍" title="Không tìm thấy trò chơi phù hợp"
          subtitle="Thử đổi từ khóa tìm kiếm hoặc bộ lọc, hoặc tạo một trò chơi mới."
          action={<PrimaryButton onClick={onCreate} className="mt-2">+ Tạo trò chơi</PrimaryButton>} />
      )}
      {!error && games && games.length > 0 && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
          {games.map(g => (
            <GameCard key={g.id} game={g} onEdit={() => onEdit(g.id)} onResults={() => onResults(g.id)}
              onDuplicate={() => handleDuplicate(g.id)} onDelete={() => setConfirmDelete(g)}
              onShare={() => setShareGame(g)} />
          ))}
        </div>
      )}

      {confirmDelete && (
        <Modal onClose={() => setConfirmDelete(null)}>
          <h3 className="font-display text-xl text-board mb-2">Xóa "{confirmDelete.title}"?</h3>
          <p className="text-sm text-[#786F5B] mb-6">Thao tác này không thể hoàn tác. Toàn bộ câu hỏi và kết quả liên quan sẽ bị xóa.</p>
          <div className="flex justify-end gap-3">
            <GhostButton onClick={() => setConfirmDelete(null)}>Hủy</GhostButton>
            <PrimaryButton onClick={() => handleDelete(confirmDelete.id)} className="!bg-coral">Xóa trò chơi</PrimaryButton>
          </div>
        </Modal>
      )}
      {shareGame && (
        <Modal onClose={() => setShareGame(null)}>
          <h3 className="font-display text-xl text-board mb-2">Chia sẻ "{shareGame.title}"</h3>
          <p className="text-sm text-[#786F5B] mb-4">Học sinh nhập mã sau tại màn hình "Tham gia trò chơi":</p>
          <div className="font-mono text-3xl tracking-[0.3em] text-center bg-board text-marigold rounded-2xl py-5">{shareGame.code}</div>

          </div>
        </Modal>
      )}

function Modal({ children, onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4 bg-board/40 backdrop-blur-sm" onClick={onClose}>
      <div className="card-paper max-w-md w-full p-6 anim-pop" onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>

}

/* ---------------------- CREATE / EDIT GAME FLOW ---------------------- */

const STEPS = [
  { id: "template", label: "Chọn mẫu" },
  { id: "info", label: "Nhập thông tin" },
  { id: "questions", label: "Câu hỏi" },
  { id: "customize", label: "Tùy chỉnh" },
  { id: "preview", label: "Xem trước" },
];

function emptyQuestion() {
  return {
    id: uid("question"),
    content: "",
    options: [{ id: uid("answer"), content: "" }, { id: uid("answer"), content: "" }, { id: uid("answer"), content: "" }],
    correctAnswer: null,
    timeLimit: 20,
    points: 100,
    image: null,
  };
}

function CreateGameFlow({ gameId, onDone, onCancel, showToast }) {
  const [loading, setLoading] = useState(!!gameId);
  const [stepIdx, setStepIdx] = useState(0);
  const [form, setForm] = useState({ title: "", description: "", subject: SUBJECTS[0], topic: "", template: null, theme: "marigold" });
  const [questions, setQuestions] = useState([]);
  const [savingStatus, setSavingStatus] = useState(null);

  useEffect(() => {
    if (!gameId) return;
    (async () => {
      const g = await gameService.get(gameId);
      if (g) {
        setForm({ title: g.title, description: g.description, subject: g.subject, topic: g.topic, template: g.template, theme: g.theme || "marigold" });
        setStepIdx(1);
      }
      const qs = await questionService.listByGame(gameId);
      setQuestions(qs.length ? qs : [emptyQuestion()]);
      setLoading(false);
    })();
  }, [gameId]);

  useEffect(() => { if (!gameId && questions.length === 0) setQuestions([emptyQuestion()]); }, []);

  const step = STEPS[stepIdx];
  const canNext = useMemo(() => {
    if (step.id === "template") return !!form.template;
    if (step.id === "info") return form.title.trim().length > 2 && form.topic.trim().length > 1;
    if (step.id === "questions") return questions.length > 0 && questions.every(q => q.content.trim() && q.correctAnswer && q.options.every(o => o.content.trim()));
    return true;
  }, [step, form, questions]);

  const persist = async (status) => {
    setSavingStatus(status);
    let id = gameId;
    const payload = { ...form, status, questionsCount: questions.length };
    if (id) {
      await gameService.update(id, payload);
    } else {
      const created = await gameService.create(payload);
      id = created.id;
    }
    await questionService.save(id, questions);
    setSavingStatus(null);
    showToast(status === "published" ? "Đã xuất bản trò chơi 🎉" : "Đã lưu bản nháp", "success");
    onDone();
  };

  if (loading) return <Loader label="Đang tải trò chơi..." />;

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between">
        <h1 className="font-display text-3xl text-board">{gameId ? "Chỉnh sửa trò chơi" : "Tạo trò chơi mới"}</h1>
        <button onClick={onCancel} className="text-sm text-[#786F5B] hover:text-board">Hủy ✕</button>
      </div>

      <Stepper steps={STEPS} activeIdx={stepIdx} onJump={(i) => i < stepIdx && setStepIdx(i)} />

      <div className="card-paper p-6 md:p-8 min-h-[380px]">
        {step.id === "template" && <StepTemplate form={form} setForm={setForm} />}
        {step.id === "info" && <StepInfo form={form} setForm={setForm} />}
        {step.id === "questions" && <StepQuestions questions={questions} setQuestions={setQuestions} />}
        {step.id === "customize" && <StepCustomize form={form} setForm={setForm} />}
        {step.id === "preview" && <StepPreview form={form} questions={questions} />}
      </div>

      <div className="flex items-center justify-between">
        <GhostButton onClick={() => setStepIdx(i => Math.max(0, i - 1))} disabled={stepIdx === 0}>← Quay lại</GhostButton>
        <div className="flex gap-3">
          {step.id === "preview" ? (
            <React.Fragment>
              <GhostButton onClick={() => persist("draft")} disabled={savingStatus !== null}>
                {savingStatus === "draft" ? "Đang lưu..." : "Lưu bản nháp"}
              </GhostButton>
              <PrimaryButton onClick={() => persist("published")} disabled={savingStatus !== null}>
                {savingStatus === "published" ? "Đang xuất bản..." : "Xuất bản 🚀"}
              </PrimaryButton>
            </React.Fragment>
          ) : (
            <PrimaryButton onClick={() => setStepIdx(i => Math.min(STEPS.length - 1, i + 1))} disabled={!canNext}>
              Tiếp tục →
            </PrimaryButton>
          )}
        </div>
      </div>
    </div>
  );
}

function Stepper({ steps, activeIdx, onJump }) {
  return (
    <div className="flex items-center gap-1 sm:gap-2 overflow-x-auto pb-1">
      {steps.map((s, i) => (
        <React.Fragment key={s.id}>
          <button onClick={() => onJump(i)}
            className={`flex items-center gap-2 px-3 py-2 rounded-full text-xs sm:text-sm whitespace-nowrap font-body transition
              ${i === activeIdx ? "bg-board text-paper font-semibold" : i < activeIdx ? "bg-mint/15 text-mint" : "bg-board/5 text-[#786F5B]"}`}>
            <span className="font-mono">{i + 1}</span>{s.label}
          </button>
          {i < steps.length - 1 && <div className="w-4 sm:w-8 h-px chalk-rule flex-shrink-0"></div>}
        </React.Fragment>
      ))}
    </div>
  );
}

function StepTemplate({ form, setForm }) {
  return (
    <div>
      <h2 className="font-display text-xl text-board mb-1">Chọn mẫu trò chơi</h2>
      <p className="text-sm text-[#786F5B] mb-6">Mỗi mẫu mang một cách chơi khác nhau — chọn mẫu phù hợp với nội dung ôn tập của bạn.</p>
      <div className="grid sm:grid-cols-2 gap-4">
        {mockGameTemplates.map(t => (
          <button key={t.id} onClick={() => setForm(f => ({ ...f, template: t.id }))}
            className={`text-left p-5 rounded-2xl border-2 transition flex gap-4 items-start
              ${form.template === t.id ? "border-ink2 bg-ink2/5" : "border-board/10 hover:border-board/25"}`}>
            <ChalkToken icon={t.icon} ring={t.ring} size={48} fontSize={22} />
            <div>
              <h3 className="font-display text-base text-board">{t.name}</h3>
              <p className="text-sm text-[#786F5B] mt-1">{t.description}</p>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function Field({ label, children, hint }) {
  return (
    <label className="block mb-5">
      <span className="block text-sm font-semibold text-board mb-1.5">{label}</span>
      {children}
      {hint && <span className="block text-xs text-[#A69C82] mt-1">{hint}</span>}
    </label>
  );
}
const inputCls = "w-full card-paper px-4 py-2.5 text-sm border-board/10 focus:border-ink2";

function StepInfo({ form, setForm }) {
  return (
    <div>
      <h2 className="font-display text-xl text-board mb-6">Nhập thông tin trò chơi</h2>
      <div className="grid sm:grid-cols-2 gap-x-6">
        <Field label="Tên trò chơi">
          <input className={inputCls} value={form.title} maxLength={80}
            onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="Ví dụ: Ôn tập Toán lớp 3" />
        </Field>
        <Field label="Môn học">
          <select className={inputCls} value={form.subject} onChange={e => setForm(f => ({ ...f, subject: e.target.value }))}>
            {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
        <Field label="Chủ đề" hint="Chủ đề cụ thể của bài ôn tập">
          <input className={inputCls} value={form.topic}
            onChange={e => setForm(f => ({ ...f, topic: e.target.value }))} placeholder="Ví dụ: Phép cộng và phép trừ" />
        </Field>
        <Field label="Ngôn ngữ">
          <select className={inputCls} value={form.language || "vi"} onChange={e => setForm(f => ({ ...f, language: e.target.value }))}>
            <option value="vi">Tiếng Việt</option>
            <option value="en">Tiếng Anh</option>
          </select>
        </Field>
      </div>
      <Field label="Mô tả">
        <textarea className={inputCls + " min-h-[90px]"} value={form.description} maxLength={200}
          onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder="Mô tả ngắn gọn nội dung trò chơi..." />
      </Field>
    </div>
  );
}

function StepQuestions({ questions, setQuestions }) {
  const [openIdx, setOpenIdx] = useState(0);

  const update = (idx, patch) => setQuestions(qs => qs.map((q, i) => i === idx ? { ...q, ...patch } : q));
  const updateOption = (idx, optId, content) => setQuestions(qs => qs.map((q, i) => i !== idx ? q : { ...q, options: q.options.map(o => o.id === optId ? { ...o, content } : o) }));
  const addOption = (idx) => setQuestions(qs => qs.map((q, i) => i !== idx ? q : (q.options.length >= 4 ? q : { ...q, options: [...q.options, { id: uid("answer"), content: "" }] })));
  const removeOption = (idx, optId) => setQuestions(qs => qs.map((q, i) => {
    if (i !== idx || q.options.length <= 2) return q;
    const opts = q.options.filter(o => o.id !== optId);
    return { ...q, options: opts, correctAnswer: q.correctAnswer === optId ? null : q.correctAnswer };
  }));
  const addQuestion = () => { setQuestions(qs => [...qs, emptyQuestion()]); setOpenIdx(questions.length); };
  const removeQuestion = (idx) => { setQuestions(qs => qs.filter((_, i) => i !== idx)); setOpenIdx(0); };
  const move = (idx, dir) => setQuestions(qs => {
    const next = [...qs]; const target = idx + dir;
    if (target < 0 || target >= next.length) return qs;
    [next[idx], next[target]] = [next[target], next[idx]];
    return next;
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <h2 className="font-display text-xl text-board">Quản lý câu hỏi</h2>
        <span className="text-xs font-mono text-[#786F5B]">{questions.length} câu hỏi</span>
      </div>
      <div className="space-y-3">
        {questions.map((q, idx) => (
          <div key={q.id} className="border border-board/10 rounded-2xl overflow-hidden">
            <button onClick={() => setOpenIdx(openIdx === idx ? -1 : idx)}
              className="w-full flex items-center justify-between px-4 py-3 bg-board/[0.03] text-left">
              <span className="flex items-center gap-3 min-w-0">
                <span className="w-7 h-7 rounded-full bg-board text-paper text-xs flex items-center justify-center font-mono flex-shrink-0">{idx + 1}</span>
                <span className="font-body text-sm text-board truncate">{q.content || "Câu hỏi mới — nhấn để chỉnh sửa"}</span>
              </span>
              <span className="text-[#786F5B] text-xs flex-shrink-0 ml-2">{openIdx === idx ? "▲" : "▼"}</span>
            </button>
            {openIdx === idx && (
              <div className="p-4 sm:p-5 border-t border-board/10 space-y-4">
                <Field label="Nội dung câu hỏi">
                  <textarea className={inputCls} value={q.content} onChange={e => update(idx, { content: e.target.value })} placeholder="Nhập câu hỏi..." />
                </Field>
                <div>
                  <span className="block text-sm font-semibold text-board mb-2">Phương án trả lời (chọn ô tròn cho đáp án đúng)</span>
                  <div className="space-y-2">
                    {q.options.map(o => (
                      <div key={o.id} className="flex items-center gap-2">
                        <button onClick={() => update(idx, { correctAnswer: o.id })}
                          className={`w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition ${q.correctAnswer === o.id ? "bg-mint border-mint text-white" : "border-board/25"}`}>
                          {q.correctAnswer === o.id && "✓"}
                        </button>
                        <input className={inputCls} value={o.content} onChange={e => updateOption(idx, o.id, e.target.value)} placeholder="Nội dung đáp án" />
                        {q.options.length > 2 && (
                          <button onClick={() => removeOption(idx, o.id)} className="text-[#A69C82] hover:text-coral px-1">✕</button>
                        )}
                      </div>
                    ))}
                  </div>
                  {q.options.length < 4 && (
                    <button onClick={() => addOption(idx)} className="text-sm text-ink2 font-semibold mt-2 hover:underline">+ Thêm đáp án</button>
                  )}
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <Field label="Thời gian trả lời (giây)">
                    <input type="number" min={5} max={120} className={inputCls} value={q.timeLimit}
                      onChange={e => update(idx, { timeLimit: Number(e.target.value) || 5 })} />
                  </Field>
                  <Field label="Điểm số">
                    <input type="number" min={10} step={10} className={inputCls} value={q.points}
                      onChange={e => update(idx, { points: Number(e.target.value) || 10 })} />
                  </Field>
                </div>
                <div className="flex items-center justify-between pt-1">
                  <div className="flex gap-2">
                    <IconButton title="Di chuyển lên" onClick={() => move(idx, -1)}>↑</IconButton>
                    <IconButton title="Di chuyển xuống" onClick={() => move(idx, 1)}>↓</IconButton>
                  </div>
                  {questions.length > 1 && (
                    <button onClick={() => removeQuestion(idx)} className="text-sm text-coral font-semibold hover:underline">Xóa câu hỏi</button>
                  )}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      <GhostButton onClick={addQuestion} className="mt-4 w-full">+ Thêm câu hỏi</GhostButton>
    </div>
  );
}

function TeacherResults({ gameId, onBack }) {
  const [game, setGame] = useState(null);
  const [results, setResults] = useState(null);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    setResults(null); setError(null);
    Promise.all([gameService.get(gameId), resultService.listByGame(gameId)])
      .then(([g, r]) => { setGame(g); setResults(r); })
      .catch(e => setError(e.message || "Lỗi tải kết quả"));
  }, [gameId]);
  useEffect(() => { load(); }, [load]);

  return (
    <div className="space-y-6">
      <button onClick={onBack} className="text-sm text-[#786F5B] hover:text-board">← Thư viện trò chơi</button>
      {error && <ErrorState onRetry={load} subtitle="Không thể tải kết quả trò chơi." />}
      {!error && !results && <Loader label="Đang tải kết quả..." />}
      {!error && results && (
        <React.Fragment>
          <div className="flex items-center justify-between flex-wrap gap-3">
            <h1 className="font-display text-3xl text-board">{game ? game.title : "Kết quả"}</h1>
            <StatusBadge status={game ? game.status : "draft"} />
          </div>
          {results.length === 0 ? (
            <EmptyState icon="📊" title="Chưa có lượt chơi nào" subtitle="Chia sẻ mã trò chơi để học sinh tham gia và bạn sẽ thấy kết quả tại đây." />
          ) : (
            <LeaderboardTable results={results} />
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function rankMedal(rank) {
  if (rank === 1) return { icon: "🥇", ring: "#F4B942" };
  if (rank === 2) return { icon: "🥈", ring: "#9CA3AF" };
  if (rank === 3) return { icon: "🥉", ring: "#B5651D" };
  return { icon: rank, ring: "#DCD2B4" };
}

function LeaderboardTable({ results }) {
  return (
    <div className="card-paper overflow-hidden">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-left text-[#786F5B] font-mono text-xs uppercase border-b border-board/10">
            <th className="px-5 py-3">Hạng</th>
            <th className="px-5 py-3">Học sinh</th>
            <th className="px-5 py-3">Điểm</th>
            <th className="px-5 py-3">Độ chính xác</th>
            <th className="px-5 py-3 hidden sm:table-cell">Thời gian hoàn thành</th>
          </tr>
        </thead>
        <tbody>
          {results.map((r, i) => {
            const medal = rankMedal(i + 1);
            return (
              <tr key={r.id} className="border-b border-board/5 last:border-0">
                <td className="px-5 py-3">
                  <ChalkToken icon={medal.icon} ring={medal.ring} size={34} fontSize={i < 3 ? 16 : 13} />
                </td>
                <td className="px-5 py-3 font-body text-board">{r.playerName}</td>
                <td className="px-5 py-3 font-display text-board">{r.score}</td>
                <td className="px-5 py-3 text-[#786F5B]">{r.correctAnswers}/{r.totalQuestions} ({r.accuracy}%)</td>
                <td className="px-5 py-3 hidden sm:table-cell text-[#786F5B] font-mono">{r.completionTime}s</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function StudentApp({ onExit, showToast, toast }) {
  const [screen, setScreen] = useState("join"); // join | name | waiting | play | result | leaderboard
  const [game, setGame] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [playerName, setPlayerName] = useState("");
  const [session, setSession] = useState({ score: 0, correct: 0, answers: [], startedAt: null });
  const [finalResult, setFinalResult] = useState(null);
  const [leaderboard, setLeaderboard] = useState(null);

  const restart = () => {
    setScreen("join"); setGame(null); setQuestions([]); setPlayerName("");
    setSession({ score: 0, correct: 0, answers: [], startedAt: null }); setFinalResult(null); setLeaderboard(null);
  };

  return (
    <div className="min-h-screen bg-paper flex flex-col">
      <StudentTopBar onExit={onExit} />
      <main className="flex-1 flex flex-col">
        {screen === "join" && (
          <JoinGameScreen onFound={(g) => { setGame(g); setScreen("name"); }} />
        )}
        {screen === "name" && game && (
          <EnterNameScreen game={game} onBack={() => setScreen("join")} onSubmit={(name) => { setPlayerName(name); setScreen("waiting"); }} />
        )}
        {screen === "waiting" && game && (
          <WaitingRoomScreen game={game} playerName={playerName}
            onStart={async () => { const qs = await questionService.listByGame(game.id); setQuestions(qs); setScreen("play"); }} />
        )}
        {screen === "play" && game && questions.length > 0 && (
          <PlayGameScreen game={game} questions={questions} playerName={playerName}
            onFinish={async (sessionResult) => {
              const total = questions.reduce((s, q) => s + q.points, 0);
              const entry = await resultService.submit({
                gameId: game.id, playerId: uid("player"), playerName,
                score: sessionResult.score, correctAnswers: sessionResult.correct,
                totalQuestions: questions.length, accuracy: Math.round((sessionResult.correct / questions.length) * 100),
                completionTime: sessionResult.timeUsed,
              });
              setFinalResult(entry);
              setScreen("result");
            }} />
        )}
        {screen === "result" && finalResult && (
          <ResultScreen result={finalResult} totalQuestions={questions.length}
            onSeeLeaderboard={async () => { const r = await resultService.listByGame(game.id); setLeaderboard(r); setScreen("leaderboard"); }} />
        )}
        {screen === "leaderboard" && leaderboard && (
          <LeaderboardScreen results={leaderboard} playerName={playerName} onPlayAgain={restart} />
        )}
      </main>
      <Toast toast={toast} />
    </div>
  );
}

function PlayGameScreen({ game, questions, onFinish }) {
  const [idx, setIdx] = useState(0);
  const q = questions[idx];
  const [timeLeft, setTimeLeft] = useState(q.timeLimit);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const startRef = useRef(Date.now());
  const tpl = mockGameTemplates.find(t => t.id === game.template);

  useEffect(() => {
    setTimeLeft(q.timeLimit); setSelected(null); setRevealed(false);
  }, [idx]);

  useEffect(() => {
    if (revealed) return;
    if (timeLeft <= 0) { handleAnswer(null); return; }
    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [timeLeft, revealed]);

  function handleAnswer(optionId) {
    if (revealed) return;
    const isCorrect = optionId === q.correctAnswer;
    setSelected(optionId);
    setRevealed(true);
    if (isCorrect) {
      const bonus = Math.round((timeLeft / q.timeLimit) * 40);
      setScore(s => s + q.points + bonus);
      setCorrectCount(c => c + 1);
    }
    setTimeout(() => {
      if (idx + 1 < questions.length) {
        setIdx(i => i + 1);
      } else {
        const timeUsed = Math.round((Date.now() - startRef.current) / 1000);
        onFinish({ score: score + (isCorrect ? q.points + Math.round((timeLeft / q.timeLimit) * 40) : 0), correct: correctCount + (isCorrect ? 1 : 0), timeUsed });
      }
    }, 1300);
  }

  const pct = (timeLeft / q.timeLimit) * 100;
  const progressColor = pct > 50 ? "#4CAF7D" : pct > 20 ? "#F4B942" : "#FF6B5B";

  return (
    <div className="flex-1 flex flex-col px-5 md:px-8 py-6 max-w-2xl mx-auto w-full">
      <div className="flex items-center justify-between mb-6">
        <span className="font-mono text-xs text-[#786F5B]">Câu {idx + 1}/{questions.length}</span>
        <span className="flex items-center gap-2">
          <ChalkToken icon={tpl ? tpl.icon : "🎲"} ring={tpl ? tpl.ring : "#F4B942"} size={30} fontSize={14} />
          <span className="font-display text-board">{score} điểm</span>
        </span>
      </div>

      <div className="w-full h-2 bg-board/10 rounded-full mb-2 overflow-hidden">
        <div className="h-full rounded-full transition-all duration-1000 ease-linear" style={{ width: `${pct}%`, background: progressColor }}></div>
      </div>
      <div className="text-right text-xs font-mono text-[#786F5B] mb-6">⏱ {timeLeft}s</div>

      <div key={q.id} className="card-paper p-6 sm:p-8 flex-1 flex flex-col anim-pop">
        <h2 className="font-display text-xl sm:text-2xl text-board mb-8 text-center">{q.content}</h2>
        <div className="grid gap-3 mt-auto">
          {q.options.map((o, i) => {
            let stateCls = "border-board/12 hover:border-ink2/50";
            if (revealed) {
              if (o.id === q.correctAnswer) stateCls = "border-mint bg-mint/10";
              else if (o.id === selected) stateCls = "border-coral bg-coral/10";
              else stateCls = "border-board/10 opacity-50";
            } else if (o.id === selected) stateCls = "border-ink2 bg-ink2/10";
            return (
              <button key={o.id} disabled={revealed} onClick={() => handleAnswer(o.id)}
                className={`text-left px-5 py-4 rounded-2xl border-2 transition font-body text-base flex items-center gap-3 ${stateCls}`}>
                <span className="w-7 h-7 rounded-full border-2 border-current flex items-center justify-center text-xs font-mono flex-shrink-0">{String.fromCharCode(65 + i)}</span>
                <span className="flex-1">{o.content}</span>
                {revealed && o.id === q.correctAnswer && <span>✅</span>}
                {revealed && o.id === selected && o.id !== q.correctAnswer && <span>❌</span>}
              </button>
            );
          })}
        </div>
        {revealed && (
          <p className={`text-center mt-5 font-display text-lg ${selected === q.correctAnswer ? "text-mint" : "text-coral"}`}>
            {selected === q.correctAnswer ? "Chính xác! 🎉" : selected === null ? "Hết giờ! ⏰" : "Chưa đúng rồi 😅"}
          </p>
        )}
      </div>
    </div>
  );
}

function ResultScreen({ result, totalQuestions, onSeeLeaderboard }) {
  const isGreat = result.accuracy >= 80;
  return (
    <div className="flex-1 flex items-center justify-center px-6 py-10">
      <div className="max-w-md w-full text-center anim-pop">
        <div className="text-7xl mb-4 float-slow">{isGreat ? "🏆" : result.accuracy >= 50 ? "🌟" : "💪"}</div>
        <h1 className="font-display text-3xl text-board mb-1">{result.score} điểm</h1>
        <p className="text-[#786F5B] mb-8">{result.correctAnswers}/{result.totalQuestions} câu đúng · độ chính xác {result.accuracy}%</p>
        <div className="grid grid-cols-2 gap-4 mb-8">
          <div className="card-paper p-4">
            <div className="font-display text-2xl text-mint">{result.correctAnswers}</div>
            <div className="text-xs text-[#786F5B] font-mono uppercase mt-1">Câu đúng</div>
          </div>
          <div className="card-paper p-4">
            <div className="font-display text-2xl text-ink2">{result.completionTime}s</div>
            <div className="text-xs text-[#786F5B] font-mono uppercase mt-1">Thời gian</div>
          </div>
        </div>
        <PrimaryButton onClick={onSeeLeaderboard} className="w-full">Xem bảng xếp hạng →</PrimaryButton>
      </div>
    </div>
  );
}

function LeaderboardScreen({ results, playerName, onPlayAgain }) {
  return (
    <div className="flex-1 flex items-center justify-center px-6 py-10">
      <div className="max-w-md w-full anim-pop">
        <h1 className="font-display text-2xl text-board text-center mb-6">🏅 Bảng xếp hạng</h1>
        <div className="card-paper divide-y divide-board/5 overflow-hidden mb-6">
          {results.map((r, i) => {
            const medal = rankMedal(i + 1);
            const isMe = r.playerName === playerName;
            return (
              <div key={r.id} className={`flex items-center gap-3 px-4 py-3 ${isMe ? "bg-ink2/5" : ""}`}>
                <ChalkToken icon={medal.icon} ring={medal.ring} size={34} fontSize={i < 3 ? 16 : 13} />
                <span className={`flex-1 font-body ${isMe ? "font-semibold text-ink2" : "text-board"}`}>{r.playerName}{isMe && " (bạn)"}</span>
                <span className="font-display text-board">{r.score}</span>
              </div>
            );
          })}
        </div>
        <PrimaryButton onClick={onPlayAgain} className="w-full">Chơi trò chơi khác</PrimaryButton>
      </div>
    </div>
  );
}

/* =========================================================================
   MOUNT
   ========================================================================= */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
