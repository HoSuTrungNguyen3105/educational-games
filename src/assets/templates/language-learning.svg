<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Minh họa hội thoại tiếng Anh với các bong bóng thoại">
  <rect width="1200" height="675" rx="34" fill="#f5f3ff"/>
  <circle cx="1066" cy="110" r="84" fill="#ddd6fe"/>
  <circle cx="1130" cy="222" r="30" fill="#a5f3fc"/>
  <text x="74" y="112" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7c3aed" letter-spacing="3">LANGUAGE LEARNING</text>
  <text x="74" y="172" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#2e1065">Present Perfect</text>
  <text x="74" y="216" font-family="Arial, sans-serif" font-size="24" fill="#6d28d9">Nói về trải nghiệm và hành động đã hoàn thành</text>

  <path d="M102 292h430a30 30 0 0 1 30 30v154a30 30 0 0 1-30 30H286l-52 44v-44h-132a30 30 0 0 1-30-30V322a30 30 0 0 1 30-30Z" fill="#7c3aed"/>
  <text x="142" y="358" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">“Have you ever been to Hue?”</text>
  <text x="142" y="410" font-family="Arial, sans-serif" font-size="22" fill="#ede9fe">Bạn đã từng đến Huế chưa?</text>
  <text x="142" y="462" font-family="Arial, sans-serif" font-size="20" font-style="italic" fill="#ddd6fe">Dùng để hỏi về trải nghiệm trong đời.</text>

  <path d="M668 250h430a30 30 0 0 1 30 30v154a30 30 0 0 1-30 30H854l-52 44v-44H668a30 30 0 0 1-30-30V280a30 30 0 0 1 30-30Z" fill="#ffffff" stroke="#06b6d4" stroke-width="5"/>
  <text x="708" y="316" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#155e75">“Yes, I have. It was amazing!”</text>
  <text x="708" y="368" font-family="Arial, sans-serif" font-size="22" fill="#0e7490">Rồi, mình đã đến. Chuyến đi tuyệt lắm!</text>
  <text x="708" y="420" font-family="Arial, sans-serif" font-size="20" font-style="italic" fill="#64748b">Cấu trúc: have/has + V3/ed.</text>

  <g font-family="Arial, sans-serif">
    <rect x="102" y="540" width="214" height="70" rx="35" fill="#ffffff" stroke="#ddd6fe" stroke-width="3"/>
    <text x="144" y="584" font-size="22" font-weight="700" fill="#6d28d9">ever · never</text>
    <rect x="336" y="540" width="214" height="70" rx="35" fill="#ffffff" stroke="#a5f3fc" stroke-width="3"/>
    <text x="378" y="584" font-size="22" font-weight="700" fill="#0e7490">already · yet</text>
    <rect x="570" y="540" width="214" height="70" rx="35" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <text x="612" y="584" font-size="22" font-weight="700" fill="#c2410c">since · for</text>
    <rect x="804" y="540" width="294" height="70" rx="35" fill="#ffffff" stroke="#fde68a" stroke-width="3"/>
    <text x="846" y="584" font-size="22" font-weight="700" fill="#a16207">just · recently · so far</text>
  </g>
