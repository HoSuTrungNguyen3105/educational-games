  <rect x="180" y="240" width="480" height="280" rx="10" fill="#fafafa" stroke="#a1a1aa" stroke-width="3"/>
  <rect x="180" y="240" width="44" height="280" fill="#e4e4e7"/>
  <g fill="#d4d4d8"><circle cx="202" cy="280" r="6"/><circle cx="202" cy="330" r="6"/><circle cx="202" cy="380" r="6"/><circle cx="202" cy="430" r="6"/><circle cx="202" cy="480" r="6"/></g>
  <g stroke="#d4d4d8" stroke-width="7" stroke-linecap="round">
