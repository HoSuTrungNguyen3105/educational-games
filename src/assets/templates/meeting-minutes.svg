  <text x="104" y="140" font-family="'Times New Roman', serif" font-size="38" font-weight="700" fill="#27272a">BIÊN BẢN HỌP TỔ CHUYÊN MÔN</text>
  <text x="106" y="178" font-family="Arial, sans-serif" font-size="21" fill="#71717a">Họp định kỳ tháng · Tổ khối 4, 5</text>

