<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Minh họa báo cáo chuyển đổi số trong giáo dục với biểu đồ">
  <rect width="1200" height="675" rx="34" fill="#eff6ff"/>
  <rect x="0" y="0" width="30" height="675" fill="#1e3a8a"/>
  <text x="78" y="102" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a" letter-spacing="3">PROFESSIONAL ACADEMIC</text>
  <text x="78" y="164" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#0f172a">Chuyển đổi số trong giáo dục</text>
  <text x="78" y="208" font-family="Arial, sans-serif" font-size="23" fill="#475569">Báo cáo chuyên đề · Dữ liệu khảo sát 120 trường học</text>

  <rect x="78" y="268" width="650" height="324" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="112" y="314" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Mức độ sẵn sàng chuyển đổi số</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#64748b">
    <path d="M124 540h560M124 484h560M124 428h560M124 372h560" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="170" y="430" width="86" height="110" rx="8" fill="#93c5fd"/>
    <rect x="302" y="380" width="86" height="160" rx="8" fill="#60a5fa"/>
    <rect x="434" y="330" width="86" height="210" rx="8" fill="#3b82f6"/>
    <rect x="566" y="296" width="86" height="244" rx="8" fill="#1d4ed8"/>
    <text x="190" y="570" fill="#475569">2019</text>
    <text x="322" y="570" fill="#475569">2021</text>
    <text x="454" y="570" fill="#475569">2023</text>
    <text x="586" y="570" fill="#475569">2026</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="768" y="268" width="360" height="96" rx="18" fill="#1e3a8a"/>
    <text x="800" y="312" font-size="27" font-weight="700" fill="#ffffff">86%</text>
    <text x="800" y="344" font-size="19" fill="#dbeafe">giáo viên dùng học liệu số</text>

    <rect x="768" y="384" width="360" height="96" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="800" y="428" font-size="27" font-weight="700" fill="#1e3a8a">72%</text>
    <text x="800" y="460" font-size="19" fill="#64748b">lớp học có thiết bị kết nối</text>

    <rect x="768" y="500" width="360" height="92" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="800" y="544" font-size="27" font-weight="700" fill="#0f766e">+38%</text>
    <text x="800" y="576" font-size="19" fill="#64748b">mức độ tương tác của học sinh</text>
