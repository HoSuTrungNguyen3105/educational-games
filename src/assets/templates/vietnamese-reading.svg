<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Minh họa cây đa đầu làng">
  <rect width="1200" height="675" rx="34" fill="#f7f5ef"/>
  <rect x="64" y="60" width="1072" height="555" rx="18" fill="#fffdf7" stroke="#d6cdb8" stroke-width="3"/>
  <text x="104" y="140" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#44403c">CÂY ĐA ĐẦU LÀNG</text>
  <text x="106" y="178" font-family="Arial, sans-serif" font-size="21" fill="#78716c">Tiếng Việt 5 · Bài đọc hiểu</text>

  <!-- ground -->
