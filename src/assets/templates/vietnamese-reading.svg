    <path d="M880 300h180M880 336h160M880 372h176M880 408h140"/>
  </g>
  <rect x="872" y="248" width="196" height="40" rx="8" fill="#f5efe2"/>
  <text x="888" y="275" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#57534e">Đọc hiểu</text>

  <text x="104" y="580" font-family="Arial, sans-serif" font-size="20" fill="#a8a29e">EduPlay Document Studio · Vietnamese Reading</text>
