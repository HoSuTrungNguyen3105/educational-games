    <path d="M690 380c4 50 2 92-4 140"/>
    <path d="M520 400c-2 40 0 80 4 120"/>
    <path d="M640 400c2 40 0 80-4 120"/>
  </g>
  <!-- canopy -->
  <ellipse cx="580" cy="300" rx="240" ry="86" fill="#4d7c0f"/>
  <ellipse cx="430" cy="322" rx="130" ry="58" fill="#65a30d"/>
  <ellipse cx="730" cy="322" rx="130" ry="58" fill="#3f6212"/>
  <!-- bench under tree -->
  <rect x="500" y="492" width="160" height="12" rx="6" fill="#92400e"/>
  <rect x="516" y="504" width="10" height="18" fill="#78716c"/>
  <rect x="634" y="504" width="10" height="18" fill="#78716c"/>

  <!-- text lines like a book page, right side -->
