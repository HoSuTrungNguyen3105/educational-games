  <text x="716" y="513" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">2</text>
  <text x="770" y="492" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e293b">Áp dụng công thức</text>
