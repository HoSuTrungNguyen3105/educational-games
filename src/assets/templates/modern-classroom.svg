  <text x="716" y="359" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">1</text>
  <text x="770" y="342" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e293b">Quan sát hình</text>
  <text x="770" y="378" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Xác định chiều dài, chiều rộng</text>

