  <path d="M474 326v182M150 326h292M150 508h292" stroke="#2563eb" stroke-width="7" fill="none"/>
  <text x="184" y="552" font-family="Arial, sans-serif" font-size="26" fill="#475569">P = (8 + 5) × 2 = 26 cm</text>

  <rect x="678" y="286" width="410" height="124" rx="20" fill="#ffffff" stroke="#fcd34d" stroke-width="4"/>
