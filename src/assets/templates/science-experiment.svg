<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Minh họa thí nghiệm sự chuyển thể của nước">
  <rect width="1200" height="675" rx="34" fill="#ecfeff"/>
  <rect x="64" y="60" width="1072" height="555" rx="18" fill="#ffffff" stroke="#a5f3fc" stroke-width="3"/>
  <text x="104" y="140" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#155e75">SỰ CHUYỂN THỂ CỦA NƯỚC</text>
  <text x="106" y="178" font-family="Arial, sans-serif" font-size="21" fill="#64748b">Khoa học 4 · Bài thí nghiệm: Nước đá tan và hơi nước ngưng tụ</text>

  <!-- bench -->
  <rect x="130" y="512" width="940" height="10" rx="5" fill="#cffafe"/>

  <!-- ice glass -->
  <path d="M240 330h150l-14 182H254Z" fill="#f0fdff" stroke="#0e7490" stroke-width="4"/>
  <path d="M246 420h138l-8 92H254Z" fill="#a5f3fc"/>
  <g fill="#ffffff" stroke="#7dd3fc" stroke-width="3">
    <rect x="272" y="356" width="44" height="44" rx="8" transform="rotate(12 294 378)"/>
    <rect x="322" y="378" width="38" height="38" rx="8" transform="rotate(-10 341 397)"/>
  </g>
  <g fill="#67e8f9"><circle cx="222" cy="392" r="6"/><circle cx="222" cy="428" r="6"/><circle cx="410" cy="400" r="6"/><circle cx="410" cy="436" r="6"/></g>
  <text x="238" y="556" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#155e75">Cốc nước đá</text>

  <!-- arrows -->
  <path d="M470 400h90" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
  <path d="M548 384l24 16-24 16Z" fill="#0e7490"/>

  <!-- kettle with steam -->
  <path d="M640 400h190l-16 112H656Z" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <path d="M640 428l-34-20c-10-6-6-22 6-22h28Z" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <path d="M700 400a140 40 0 0 1 130 0Z" fill="#94a3b8"/>
  <g stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M690 330c-10-22 10-30 0-54"/>
    <path d="M740 330c-10-22 10-30 0-54"/>
    <path d="M790 330c-10-22 10-30 0-54"/>
  </g>
  <text x="646" y="556" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#155e75">Ấm nước đun sôi</text>

  <!-- cold plate with droplets -->
  <ellipse cx="960" cy="330" rx="105" ry="26" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <g fill="#38bdf8"><path d="M910 372c8 12 8 20 0 26-8-6-8-14 0-26Z"/><path d="M960 384c8 12 8 20 0 26-8-6-8-14 0-26Z"/><path d="M1010 372c8 12 8 20 0 26-8-6-8-14 0-26Z"/></g>
  <text x="872" y="556" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#155e75">Đĩa lạnh úp trên</text>

  <text x="104" y="580" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">EduPlay Document Studio · Water States Experiment</text>
</svg>
