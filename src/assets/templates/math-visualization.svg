<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Minh họa hằng đẳng thức đáng nhớ bằng hình vuông">
  <rect width="1200" height="675" rx="34" fill="#eef2ff"/>
  <g stroke="#c7d2fe" stroke-width="2">
    <path d="M0 75h1200M0 150h1200M0 225h1200M0 300h1200M0 375h1200M0 450h1200M0 525h1200M0 600h1200"/>
    <path d="M75 0v675M150 0v675M225 0v675M300 0v675M375 0v675M450 0v675M525 0v675M600 0v675M675 0v675M750 0v675M825 0v675M900 0v675M975 0v675M1050 0v675M1125 0v675"/>
  </g>
  <text x="72" y="106" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#4f46e5" letter-spacing="3">TOÁN HỌC TRỰC QUAN</text>
  <text x="72" y="166" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#1e1b4b">Hằng đẳng thức đáng nhớ</text>

  <rect x="96" y="248" width="300" height="300" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="6"/>
  <rect x="120" y="272" width="176" height="176" fill="#c7d2fe"/>
  <rect x="296" y="272" width="76" height="176" fill="#fde68a"/>
  <rect x="120" y="448" width="176" height="76" fill="#fde68a"/>
  <rect x="296" y="448" width="76" height="76" fill="#fca5a5"/>
  <text x="168" y="370" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#3730a3">a²</text>
  <text x="322" y="370" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e">ab</text>
  <text x="180" y="500" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e">ab</text>
  <text x="318" y="500" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#991b1b">b²</text>

  <rect x="480" y="248" width="636" height="132" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="4"/>
  <text x="524" y="304" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">(a + b)² = a² + 2ab + b²</text>
  <text x="524" y="348" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Diện tích hình vuông lớn bằng tổng diện tích bốn phần</text>

  <rect x="480" y="414" width="302" height="134" rx="20" fill="#4f46e5"/>
  <text x="520" y="464" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Ví dụ</text>
  <text x="520" y="506" font-family="Arial, sans-serif" font-size="26" fill="#eef2ff">(x + 3)² = x² + 6x + 9</text>

  <rect x="814" y="414" width="302" height="134" rx="20" fill="#ffffff" stroke="#fcd34d" stroke-width="4"/>
  <text x="854" y="464" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">Mẹo nhớ</text>
  <text x="854" y="506" font-family="Arial, sans-serif" font-size="22" fill="#78350f">Bình phương + gấp đôi tích + bình phương</text>
  <text x="98" y="618" font-family="Arial, sans-serif" font-size="22" fill="#6366f1">Biến công thức thành hình ảnh — hiểu sâu, nhớ lâu.</text>
</svg>
