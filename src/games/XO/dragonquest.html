<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Battle — Trả lời để chiến đấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1020;
    --panel:#171a30;
    --panel-2:#20233f;
    --line: rgba(232,214,176,.16);
    --gold:#e8b649;
    --gold-dim:#8a7038;
    --crimson:#e0546a;
    --teal:#49c6b8;
    --paper:#f2ecdd;
    --paper-dim:#b9b3a0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 20% -10%, #1c2145 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 110%, #241a35 0%, transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex; justify-content:center;
    padding:28px 16px 60px;
  }
  .stage{ width:100%; max-width:760px; }

  .topbar{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:18px; flex-wrap:wrap; gap:6px;
  }
  .brand{
    font-family:'Cinzel',serif; font-weight:700; letter-spacing:.04em;
    font-size:22px; color:var(--gold);
  }
  .brand span{ color:var(--paper-dim); font-size:13px; font-family:'Inter'; font-weight:500; letter-spacing:0; display:block; margin-top:2px; }
  .score{
    font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--paper);
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:6px 12px;
  }
  .score b{ color:var(--gold); }

  /* ===== Arena ===== */
  .arena{
    position:relative;
    background:linear-gradient(180deg,#171a30,#12142a);
    border:1px solid var(--line); border-radius:16px;
    padding:26px 22px 18px;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:10px;
    overflow:hidden;
  }
  .arena::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(600px 200px at 50% 100%, rgba(232,182,73,.08), transparent);
    pointer-events:none;
  }
  .combatant{ display:flex; flex-direction:column; align-items:center; gap:10px; z-index:1; }
  .combatant .name{ font-family:'Cinzel',serif; font-size:14px; letter-spacing:.03em; color:var(--paper-dim); }
  .hpbar-wrap{ width:150px; }
  .hpbar{ height:9px; border-radius:6px; background:#0c0e1c; border:1px solid var(--line); overflow:hidden; }
  .hpfill{ height:100%; border-radius:6px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .hpfill.player{ background:linear-gradient(90deg,#2fa89a,var(--teal)); }
  .hpfill.enemy{ background:linear-gradient(90deg,#a8324a,var(--crimson)); }
  .hptext{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim); margin-top:4px; text-align:center; }

  .sprite{ width:96px; height:96px; position:relative; }
  .sprite svg{ width:100%; height:100%; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
  .sprite.hit{ animation:hit .35s ease; }
  .sprite.attack{ animation:lunge .4s ease; }
  @keyframes hit{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px) rotate(-2deg);} 55%{transform:translateX(6px) rotate(2deg);} }
  @keyframes lunge{ 0%,100%{transform:translateX(0);} 40%{transform:translateX(10px) scale(1.04);} }

  .vs{ font-family:'Cinzel',serif; color:var(--gold-dim); font-size:22px; padding-bottom:44px; }

  .floattext{
    position:absolute; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px;
    pointer-events:none; opacity:0; z-index:5;
  }
  .floattext.show{ animation:floatUp 1s ease forwards; }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(0);} 15%{opacity:1;} 100%{opacity:0; transform:translateY(-46px);} }
  .floattext.dmg{ color:var(--crimson); }
  .floattext.heal{ color:var(--gold); }

  /* ===== Question card ===== */
  .qcard{
    margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 18px 16px;
  }
  .qmeta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .qeyebrow{ font-family:'Cinzel',serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-dim); }
  .timerwrap{ display:flex; align-items:center; gap:8px; }
  .timerring{ position:relative; width:30px; height:30px; }
  .timerring svg{ width:30px; height:30px; transform:rotate(-90deg); }
  .timerring circle.bg{ stroke:var(--line); }
  .timerring circle.fg{ stroke:var(--gold); transition:stroke-dashoffset 1s linear; }
  .timernum{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper); }

  .qtext{ font-size:18px; font-weight:600; line-height:1.45; margin-bottom:14px; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .options{ grid-template-columns:1fr; } }
  .opt{
    text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--paper);
    border-radius:10px; padding:12px 14px; font-family:'Inter'; font-size:14.5px; font-weight:500;
    cursor:pointer; transition:border-color .15s, transform .1s, background .15s;
  }
  .opt:hover:not(:disabled){ border-color:var(--gold-dim); transform:translateY(-1px); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--gold); background:rgba(232,182,73,.14); }
  .opt.wrong{ border-color:var(--crimson); background:rgba(224,84,106,.14); }

  .feedback{ margin-top:12px; font-family:'IBM Plex Mono',monospace; font-size:13px; min-height:18px; }
  .feedback.ok{ color:var(--gold); } .feedback.bad{ color:var(--crimson); }

  /* ===== Attack picker ===== */
  .attacks{ display:none; margin-top:14px; gap:10px; grid-template-columns:repeat(3,1fr); }
  .attacks.show{ display:grid; }
  @media (max-width:520px){ .attacks.show{ grid-template-columns:1fr; } }
  .atk{
    background:linear-gradient(180deg,#232748,#191c34); border:1px solid var(--gold-dim); border-radius:10px;
    padding:12px 10px; text-align:center; cursor:pointer; color:var(--paper);
    transition:transform .1s, border-color .15s;
  }
  .atk:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .atk .icon{ font-size:22px; display:block; margin-bottom:4px; }
  .atk .aname{ font-weight:600; font-size:13.5px; }
  .atk .arange{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim); margin-top:2px; }

  .banner{
    display:none; margin-top:16px; text-align:center; padding:22px 18px; border-radius:14px;
    border:1px solid var(--line); background:var(--panel);
  }
  .banner.show{ display:block; }
  .banner h2{ font-family:'Cinzel',serif; color:var(--gold); font-size:24px; margin-bottom:8px; }
  .banner p{ color:var(--paper-dim); font-size:14px; margin-bottom:16px; }
  .retry{
    font-family:'Cinzel',serif; background:var(--gold); color:#241a06; border:none; border-radius:8px;
    padding:10px 22px; font-weight:700; cursor:pointer; letter-spacing:.03em;
  }

  .statusline{ text-align:center; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--paper-dim); }
  .statusline.err{ color:var(--crimson); }
</style>
</head>
<body>
<div class="stage">

  <div class="topbar">
    <div class="brand">QUIZ BATTLE<span>Trả lời đúng để mở đòn tấn công</span></div>
    <div class="score">Điểm: <b id="scoreVal">0</b></div>
  </div>

  <div class="arena" id="arena">
    <div class="combatant">
      <div class="name">Nhà hiền triết</div>
      <div class="sprite" id="playerSprite">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="16" fill="#f2ecdd"/><path d="M50 14c-10 0-17 6-17 6l4 8h26l4-8s-7-6-17-6z" fill="#49c6b8"/><rect x="34" y="50" width="32" height="34" rx="8" fill="#20233f" stroke="#49c6b8" stroke-width="2"/><rect x="40" y="84" width="8" height="14" fill="#49c6b8"/><rect x="52" y="84" width="8" height="14" fill="#49c6b8"/></svg>
      </div>
      <div class="hpbar-wrap"><div class="hpbar"><div class="hpfill player" id="playerHpFill" style="width:100%"></div></div><div class="hptext" id="playerHpText">100 / 100</div></div>
    </div>

    <div class="vs">VS</div>

    <div class="combatant">
      <div class="name" id="enemyName">Slime Cổ Đại</div>
      <div class="sprite" id="enemySprite">
        <svg viewBox="0 0 100 100"><path d="M50 20c22 0 34 18 34 38 0 16-15 26-34 26S16 74 16 58c0-20 12-38 34-38z" fill="#7a4fb8" opacity="0.9"/><circle cx="40" cy="52" r="5" fill="#0e1020"/><circle cx="62" cy="52" r="5" fill="#0e1020"/><path d="M40 66q10 8 20 0" stroke="#0e1020" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="hpbar-wrap"><div class="hpbar"><div class="hpfill enemy" id="enemyHpFill" style="width:100%"></div></div><div class="hptext" id="enemyHpText">80 / 80</div></div>
    </div>

    <div class="floattext" id="floatText"></div>
  </div>

  <div class="qcard" id="qcard">
    <div class="qmeta">
      <div class="qeyebrow" id="qcounter">Câu hỏi 1</div>
      <div class="timerwrap">
        <div class="timerring">
          <svg viewBox="0 0 30 30">
            <circle class="bg" cx="15" cy="15" r="13" fill="none" stroke-width="3"/>
            <circle class="fg" id="timerCircle" cx="15" cy="15" r="13" fill="none" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <div class="timernum" id="timerNum">20</div>
        </div>
      </div>
    </div>
    <div class="qtext" id="qtext">Đang tải câu hỏi…</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="attacks" id="attacks"></div>
  </div>

  <div class="banner" id="banner">
    <h2 id="bannerTitle"></h2>
    <p id="bannerText"></p>
    <button class="retry" id="retryBtn">Chơi lại</button>
  </div>

  <div class="statusline" id="statusline"></div>

</div>

<script>
const GAME_ID = "6a896225c065c4e24882a0dc";
const QUESTIONS_URL = `https://educational-games-lp4z.onrender.com/api/questions/game/${GAME_ID}`;
const ANSWER_URL = "https://educational-games-lp4z.onrender.com/api/games/answer";

const ATTACKS = [
  { name:"Chém", icon:"⚔️", min:14, max:22 },
  { name:"Cầu lửa", icon:"🔥", min:18, max:28 },
  { name:"Sét", icon:"⚡", min:10, max:34 },
];
const ENEMY_NAMES = ["Slime Cổ Đại","Yêu Tinh Rừng Sâu","Bóng Ma Thư Viện","Rồng Non Tinh Nghịch"];
const ENEMY_BASE_HP = 80;
const ENEMY_HP_STEP = 25;
const PLAYER_MAX_HP = 100;
const ENEMY_HIT_DMG = [8,16];

let state = {
  questions: [],
  qIndex: 0,
  score: 0,
  playerHp: PLAYER_MAX_HP,
  enemyHp: ENEMY_BASE_HP,
  enemyMaxHp: ENEMY_BASE_HP,
  enemyRound: 0,
  timer: null,
  timeLeft: 20,
  timeLimit: 20,
  locked: false,
};

const el = id => document.getElementById(id);

function setStatus(msg, isErr){
  const s = el('statusline');
  s.textContent = msg || '';
  s.className = 'statusline' + (isErr ? ' err' : '');
}

async function loadQuestions(){
  setStatus('Đang tải câu hỏi từ máy chủ…');
  try{
    const res = await fetch(QUESTIONS_URL);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('Không có câu hỏi nào');
    state.questions = data;
    setStatus('');
    renderQuestion();
  }catch(err){
    setStatus('Không tải được câu hỏi (' + err.message + '). Kiểm tra CORS / kết nối mạng của máy chủ API rồi tải lại trang.', true);
    el('qtext').textContent = 'Không thể tải câu hỏi lúc này.';
  }
}

function renderQuestion(){
  clearInterval(state.timer);
  state.locked = false;
  el('attacks').className = 'attacks';
  el('attacks').innerHTML = '';
  el('feedback').textContent = '';
  el('feedback').className = 'feedback';

  const q = state.questions[state.qIndex % state.questions.length];
  el('qcounter').textContent = `Câu hỏi ${state.qIndex + 1}`;
  el('qtext').textContent = q.content;

  const optWrap = el('options');
  optWrap.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.content;
    btn.onclick = () => submitAnswer(q, opt.id, btn);
    optWrap.appendChild(btn);
  });

  state.timeLimit = q.timeLimit || 20;
  state.timeLeft = state.timeLimit;
  updateTimerRing();
  state.timer = setInterval(() => {
    state.timeLeft -= 1;
    updateTimerRing();
    if(state.timeLeft <= 0){
      clearInterval(state.timer);
      if(!state.locked) handleTimeout();
    }
  }, 1000);
}

function updateTimerRing(){
  const circ = 2 * Math.PI * 13;
  const ratio = Math.max(0, state.timeLeft / state.timeLimit);
  el('timerCircle').style.strokeDasharray = circ;
  el('timerCircle').style.strokeDashoffset = circ * (1 - ratio);
  el('timerNum').textContent = Math.max(0, state.timeLeft);
}

async function submitAnswer(question, answerId, btnEl){
  if(state.locked) return;
  state.locked = true;
  clearInterval(state.timer);
  Array.from(el('options').children).forEach(b => b.disabled = true);

  let result = null;
  try{
    const res = await fetch(ANSWER_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ questionId: question.id, answerId })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    result = await res.json();
  }catch(err){
    setStatus('Không gửi được đáp án tới máy chủ (' + err.message + ').', true);
    state.locked = false;
    Array.from(el('options').children).forEach(b => b.disabled = false);
    return;
  }

  setStatus('');
  if(result.correct){
    btnEl.classList.add('correct');
    el('feedback').textContent = `Chính xác! +${result.points ?? 0} điểm — chọn một đòn để tấn công.`;
    el('feedback').className = 'feedback ok';
    state.score += (result.points ?? 0);
    el('scoreVal').textContent = state.score;
    showAttackOptions();
  } else {
    btnEl.classList.add('wrong');
    el('feedback').textContent = 'Sai rồi — đối thủ phản đòn!';
    el('feedback').className = 'feedback bad';
    setTimeout(enemyStrikes, 500);
  }
}

function handleTimeout(){
  state.locked = true;
  Array.from(el('options').children).forEach(b => b.disabled = true);
  el('feedback').textContent = 'Hết giờ — đối thủ phản đòn!';
  el('feedback').className = 'feedback bad';
  setTimeout(enemyStrikes, 400);
}

function showAttackOptions(){
  const wrap = el('attacks');
  wrap.innerHTML = '';
  ATTACKS.forEach(a => {
    const div = document.createElement('div');
    div.className = 'atk';
    div.innerHTML = `<span class="icon">${a.icon}</span><span class="aname">${a.name}</span><span class="arange">${a.min}-${a.max} dmg</span>`;
    div.onclick = () => playerAttacks(a);
    wrap.appendChild(div);
  });
  wrap.className = 'attacks show';
}

function floatText(text, cls, overEnemy){
  const arena = el('arena');
  const ft = el('floatText');
  const rect = (overEnemy ? el('enemySprite') : el('playerSprite')).getBoundingClientRect();
  const arenaRect = arena.getBoundingClientRect();
  ft.style.left = (rect.left - arenaRect.left + rect.width/2 - 14) + 'px';
  ft.style.top = (rect.top - arenaRect.top - 6) + 'px';
  ft.textContent = text;
  ft.className = 'floattext ' + cls;
  void ft.offsetWidth;
  ft.className = 'floattext ' + cls + ' show';
}

function playerAttacks(atk){
  el('attacks').className = 'attacks';
  const dmg = Math.floor(Math.random() * (atk.max - atk.min + 1)) + atk.min;
  state.enemyHp = Math.max(0, state.enemyHp - dmg);
  el('enemySprite').className = 'sprite hit';
  floatText('-' + dmg, 'dmg', true);
  updateBars();
  setTimeout(() => { el('enemySprite').className = 'sprite'; }, 400);

  if(state.enemyHp <= 0){
    setTimeout(defeatEnemy, 500);
  } else {
    setTimeout(nextQuestionOrEnd, 900);
  }
}

function enemyStrikes(){
  const dmg = Math.floor(Math.random() * (ENEMY_HIT_DMG[1]-ENEMY_HIT_DMG[0]+1)) + ENEMY_HIT_DMG[0];
  state.playerHp = Math.max(0, state.playerHp - dmg);
  el('playerSprite').className = 'sprite hit';
  floatText('-' + dmg, 'dmg', false);
  updateBars();
  setTimeout(() => { el('playerSprite').className = 'sprite'; }, 400);

  if(state.playerHp <= 0){
    setTimeout(gameOver, 600);
  } else {
    setTimeout(nextQuestionOrEnd, 900);
  }
}

function updateBars(){
  el('playerHpFill').style.width = (state.playerHp / PLAYER_MAX_HP * 100) + '%';
  el('playerHpText').textContent = `${state.playerHp} / ${PLAYER_MAX_HP}`;
  el('enemyHpFill').style.width = (state.enemyHp / state.enemyMaxHp * 100) + '%';
  el('enemyHpText').textContent = `${state.enemyHp} / ${state.enemyMaxHp}`;
}

function defeatEnemy(){
  state.enemyRound += 1;
  const nextMax = ENEMY_BASE_HP + state.enemyRound * ENEMY_HP_STEP;
  state.enemyMaxHp = nextMax;
  state.enemyHp = nextMax;
  el('enemyName').textContent = ENEMY_NAMES[state.enemyRound % ENEMY_NAMES.length];
  updateBars();
  el('feedback').textContent = 'Hạ gục! Một đối thủ mới xuất hiện.';
  el('feedback').className = 'feedback ok';
  nextQuestionOrEnd();
}

function nextQuestionOrEnd(){
  state.qIndex += 1;
  if(state.qIndex >= state.questions.length * 20){
    winGame();
    return;
  }
  renderQuestion();
}

function gameOver(){
  clearInterval(state.timer);
  el('qcard').style.display = 'none';
  const b = el('banner');
  el('bannerTitle').textContent = 'Bạn đã gục ngã';
  el('bannerText').textContent = `Điểm số cuối cùng: ${state.score}. Thử lại để đánh bại đối thủ tiếp theo!`;
  b.className = 'banner show';
}

function winGame(){
  clearInterval(state.timer);
  el('qcard').style.display = 'none';
  const b = el('banner');
  el('bannerTitle').textContent = 'Chiến thắng vang dội!';
  el('bannerText').textContent = `Bạn đã trả lời hết câu hỏi với ${state.score} điểm.`;
  b.className = 'banner show';
}

el('retryBtn').onclick = () => {
  state = { questions: state.questions, qIndex:0, score:0, playerHp:PLAYER_MAX_HP,
    enemyHp:ENEMY_BASE_HP, enemyMaxHp:ENEMY_BASE_HP, enemyRound:0, timer:null,
    timeLeft:20, timeLimit:20, locked:false };
  el('scoreVal').textContent = 0;
  el('enemyName').textContent = ENEMY_NAMES[0];
  updateBars();
  el('qcard').style.display = 'block';
  el('banner').className = 'banner';
  renderQuestion();
};

loadQuestions();
</script>
</body>
</html>
