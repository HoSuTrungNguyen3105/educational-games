<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XO - Bàn cờ vô hạn</title>
    <style>
        :root {
            --bg-canvas: #1a1a2e;
            --grid-color: #2a2a5a;
            --x-color: #ff6b6b;
            --o-color: #4ecdc4;
            --header-bg: #16213e;
            --header-text: #ffffff;
            --btn-bg: #e94560;
            --btn-text: #ffffff;
            --win-border: #e94560;
            --win-bg: rgba(0, 0, 0, 0.85);
            --panel-bg: #1e2a4a;
            --panel-text: #eee;
            --input-bg: #2a3a5a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: var(--bg-canvas); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; height: 100vh; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        #header { padding: 10px 20px; background: var(--header-bg); color: var(--header-text); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--grid-color); z-index: 10; flex-shrink: 0; }
        #header .turn { font-size: 1.4rem; font-weight: 600; }
        #header .turn span { padding: 6px 16px; border-radius: 30px; background: var(--grid-color); display: inline-block; color: var(--header-text); }
        #header .score { font-size: 1.2rem; background: var(--grid-color); padding: 6px 16px; border-radius: 30px; color: var(--header-text); }
        #header .score span { font-weight: 700; }
        .btn-reset { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 8px 24px; border-radius: 30px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-reset:hover { filter: brightness(1.1); transform: scale(1.02); }
        #main { display: flex; flex: 1; overflow: hidden; position: relative; }
        #canvas-wrap { flex: 1; position: relative; overflow: hidden; background: var(--bg-canvas); cursor: grab; min-width: 0; }
        #canvas-wrap:active { cursor: grabbing; }
        #gameCanvas { display: block; width: 100%; height: 100%; background: var(--bg-canvas); }
        #color-panel { width: 260px; background: var(--panel-bg); color: var(--panel-text); padding: 16px 14px; overflow-y: auto; flex-shrink: 0; border-left: 2px solid var(--grid-color); display: flex; flex-direction: column; gap: 12px; transition: transform 0.3s ease, width 0.3s ease; }
        #color-panel h3 { font-size: 1.1rem; text-align: center; letter-spacing: 1px; border-bottom: 1px solid var(--grid-color); padding-bottom: 8px; margin-bottom: 4px; color: var(--panel-text); }
        .color-group { display: flex; flex-direction: column; gap: 4px; }
        .color-group label { font-size: 0.85rem; font-weight: 500; display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
        .color-group label input[type="color"] { width: 36px; height: 30px; border: none; background: var(--input-bg); border-radius: 6px; cursor: pointer; padding: 2px; }
        .color-group label input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-group label input[type="color"]::-webkit-color-swatch { border: 1px solid #555; border-radius: 4px; }
        .panel-actions { display: flex; gap: 8px; margin-top: 6px; }
        .panel-actions button { flex: 1; background: var(--btn-bg); color: var(--btn-text); border: none; padding: 8px 0; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .panel-actions button:hover { filter: brightness(1.1); }
        .panel-actions button.secondary { background: var(--grid-color); color: var(--panel-text); }
        .panel-toggle { display: none; background: var(--panel-bg); color: var(--panel-text); border: none; border-radius: 30px; padding: 6px 16px; font-size: 1rem; cursor: pointer; border: 1px solid var(--grid-color); }
        .panel-toggle:hover { background: var(--grid-color); }
        #win-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--win-bg); padding: 30px 50px; border-radius: 20px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.4s; border: 2px solid var(--win-border); backdrop-filter: blur(4px); z-index: 20; color: white; }
        #win-message.show { opacity: 1; pointer-events: auto; }
        #win-message h2 { font-size: 2.8rem; margin-bottom: 10px; }
        #win-message p { font-size: 1.2rem; opacity: 0.8; }
        #win-message .coin-reward { font-size: 1.1rem; color: #f4b942; margin-top: 8px; font-weight: 700; }
        #win-message .btn-again { margin-top: 20px; background: var(--btn-bg); color: var(--btn-text); border: none; padding: 10px 30px; border-radius: 30px; font-size: 1.2rem; cursor: pointer; transition: 0.2s; pointer-events: auto; }
        #win-message .btn-again:hover { filter: brightness(1.1); }
        @media (max-width: 800px) { #color-panel { width: 220px; padding: 12px 10px; } }
        @media (max-width: 650px) {
            #main { flex-direction: column; }
            #color-panel { width: 100% !important; max-height: 200px; border-left: none; border-top: 2px solid var(--grid-color); flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 16px; padding: 10px 12px; overflow-y: auto; }
            #color-panel h3 { display: none; }
            .color-group { flex-direction: row; align-items: center; gap: 4px; }
            .color-group label { font-size: 0.75rem; gap: 4px; }
            .color-group label input[type="color"] { width: 28px; height: 24px; }
            .panel-actions { order: 10; width: 100%; justify-content: center; }
            .panel-actions button { padding: 4px 12px; font-size: 0.8rem; flex: 0 1 auto; }
            #header .turn { font-size: 1rem; }
            #header .score { font-size: 0.9rem; padding: 4px 12px; }
            .btn-reset { padding: 6px 16px; font-size: 0.9rem; }
        }
        @media (max-width: 480px) { #color-panel { max-height: 160px; } #win-message { padding: 20px 30px; } #win-message h2 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <div class="turn">🎯 Lượt: <span id="turnDisplay">X</span></div>
            <div class="score">🏆 X: <span id="scoreX">0</span> &nbsp;|&nbsp; O: <span id="scoreO">0</span></div>
            <div style="display:flex; gap:8px; align-items:center;">
                <span id="modeLabel" style="font-size:0.8rem; background:var(--grid-color); padding:4px 10px; border-radius:20px; display:none;"></span>
                <button class="btn-reset" id="resetBtn">🔄 Bàn mới</button>
                <button class="panel-toggle" id="panelToggle">🎨 Màu</button>
            </div>
        </div>
        <div id="main">
            <div id="canvas-wrap">
                <canvas id="gameCanvas"></canvas>
                <div id="win-message">
                    <h2 id="winnerText">🎉 X thắng!</h2>
                    <p id="winDesc">5 liên tiếp</p>
                    <div class="coin-reward" id="coinReward" style="display:none">🪙 +50 xu</div>
                    <button class="btn-again" id="playAgainBtn">🔄 Chơi tiếp</button>
                </div>
            </div>
            <div id="color-panel">
                <h3>🎨 Tùy chỉnh màu</h3>
                <div class="color-group">
                    <label>Nền canvas <input type="color" id="bgCanvas" value="#1a1a2e"></label>
                    <label>Đường kẻ <input type="color" id="gridColor" value="#2a2a5a"></label>
                </div>
                <div class="color-group">
                    <label>Quân X <input type="color" id="xColor" value="#ff6b6b"></label>
                    <label>Quân O <input type="color" id="oColor" value="#4ecdc4"></label>
                </div>
                <div class="color-group">
                    <label>Nền header <input type="color" id="headerBg" value="#16213e"></label>
                    <label>Chữ header <input type="color" id="headerText" value="#ffffff"></label>
                </div>
                <div class="color-group">
                    <label>Nút (nền) <input type="color" id="btnBg" value="#e94560"></label>
                    <label>Nút (chữ) <input type="color" id="btnText" value="#ffffff"></label>
                </div>
                <div class="color-group">
                    <label>Thông báo (nền) <input type="color" id="winBg" value="#000000"></label>
                    <label>Thông báo (viền) <input type="color" id="winBorder" value="#e94560"></label>
                </div>
                <div class="panel-actions">
                    <button class="secondary" id="resetColorsBtn">↺ Mặc định</button>
                    <button id="closePanelBtn">✕ Ẩn</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ===== postMessage Communication =====
        let gameConfig = { mode: 'solo', gameId: null, playerName: 'Player', apiBase: '', authToken: null, userId: null };
        let bridgeReady = false;

        window.parent.postMessage({ type: 'ready' }, '*');

        window.addEventListener('message', function(e) {
            var msg = e.data;
            if (!msg || typeof msg !== 'object') return;

            if (msg.type === 'init') {
                var d = msg.data || {};
                gameConfig.gameId = d.gameId || null;
                gameConfig.playerName = d.playerName || 'Player';
                gameConfig.apiBase = d.apiBase || '';
                gameConfig.authToken = d.authToken || null;
                gameConfig.userId = d.userId || null;
                gameConfig.mode = d.playMode || 'solo';
                bridgeReady = true;
                updateModeLabel();
                if (gameConfig.mode === 'multiplayer') {
                    myPlayer = 'X';
                    opponentPlayer = 'O';
                }
            } else if (msg.type === 'opponent-move') {
                var d = msg.data || {};
                if (d.row !== undefined && d.col !== undefined) {
                    handleOpponentMove(d.row, d.col);
                }
            } else if (msg.type === 'multiplayer-start') {
                var d = msg.data || {};
                gameConfig.mode = 'multiplayer';
                myPlayer = 'X';
                opponentPlayer = 'O';
                gameConfig.opponent = d.opponent;
                updateModeLabel();
                resetGame();
            }
        });

        function sendToParent(type, data) {
            window.parent.postMessage({ type: type, data: data }, '*');
        }

        function updateModeLabel() {
            var label = document.getElementById('modeLabel');
            if (gameConfig.mode === 'multiplayer') {
                label.textContent = '👥 Chơi chung';
                label.style.display = 'inline-block';
            } else {
                label.textContent = '🤖 Solo';
                label.style.display = 'inline-block';
            }
        }

        // ===== DOM refs =====
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var wrap = document.getElementById('canvas-wrap');
        var turnDisplay = document.getElementById('turnDisplay');
        var scoreXEl = document.getElementById('scoreX');
        var scoreOEl = document.getElementById('scoreO');
        var resetBtn = document.getElementById('resetBtn');
        var playAgainBtn = document.getElementById('playAgainBtn');
        var winMsg = document.getElementById('win-message');
        var winnerText = document.getElementById('winnerText');
        var winDesc = document.getElementById('winDesc');
        var coinRewardEl = document.getElementById('coinReward');

        var colorInputs = {
            bgCanvas: document.getElementById('bgCanvas'),
            gridColor: document.getElementById('gridColor'),
            xColor: document.getElementById('xColor'),
            oColor: document.getElementById('oColor'),
            headerBg: document.getElementById('headerBg'),
            headerText: document.getElementById('headerText'),
            btnBg: document.getElementById('btnBg'),
            btnText: document.getElementById('btnText'),
            winBg: document.getElementById('winBg'),
            winBorder: document.getElementById('winBorder'),
        };
        var panel = document.getElementById('color-panel');
        var panelToggle = document.getElementById('panelToggle');
        var closePanelBtn = document.getElementById('closePanelBtn');
        var resetColorsBtn = document.getElementById('resetColorsBtn');

        // ===== Settings =====
        var DEFAULT_COLORS = {
            bgCanvas: '#1a1a2e', gridColor: '#2a2a5a', xColor: '#ff6b6b', oColor: '#4ecdc4',
            headerBg: '#16213e', headerText: '#ffffff', btnBg: '#e94560', btnText: '#ffffff',
            winBg: '#000000', winBorder: '#e94560',
        };
        var colors = Object.assign({}, DEFAULT_COLORS);

        // ===== Game state =====
        var CELL_SIZE = 50;
        var HALF = CELL_SIZE / 2;
        var grid = {};
        var currentPlayer = 'X';
        var myPlayer = 'X';       // In multiplayer, which player am I?
        var opponentPlayer = 'O'; // In multiplayer, which player is opponent?
        var gameOver = false;
        var scoreX = 0, scoreO = 0;
        var totalGames = 0;

        // Pan state
        var offsetX = 0, offsetY = 0;
        var isDragging = false;
        var dragStartX = 0, dragStartY = 0;
        var startOffsetX = 0, startOffsetY = 0;

        // ===== AI Logic (for solo mode) =====
        function getAIMove() {
            var emptyCells = [];
            for (var r = -15; r <= 15; r++) {
                for (var c = -15; c <= 15; c++) {
                    if (!grid[r + ',' + c]) emptyCells.push({ row: r, col: c });
                }
            }
            if (emptyCells.length === 0) return null;

            // 1. Check if AI can win
            for (var i = 0; i < emptyCells.length; i++) {
                var cell = emptyCells[i];
                grid[cell.row + ',' + cell.col] = 'O';
                if (checkWin(cell.row, cell.col, 'O')) {
                    grid[cell.row + ',' + cell.col] = null;
                    return cell;
                }
                grid[cell.row + ',' + cell.col] = null;
            }

            // 2. Check if player can win (block)
            for (var i = 0; i < emptyCells.length; i++) {
                var cell = emptyCells[i];
                grid[cell.row + ',' + cell.col] = 'X';
                if (checkWin(cell.row, cell.col, 'X')) {
                    grid[cell.row + ',' + cell.col] = null;
                    return cell;
                }
                grid[cell.row + ',' + cell.col] = null;
            }

            // 3. Prioritize center or cells near existing pieces
            var scored = emptyCells.map(function(cell) {
                var score = 0;
                // Prefer cells near existing pieces
                for (var dr = -2; dr <= 2; dr++) {
                    for (var dc = -2; dc <= 2; dc++) {
                        if (grid[(cell.row + dr) + ',' + (cell.col + dc)]) score += 5;
                    }
                }
                // Prefer center
                score -= Math.abs(cell.row) + Math.abs(cell.col);
                // Add randomness
                score += Math.random() * 3;
                return { cell: cell, score: score };
            });
            scored.sort(function(a, b) { return b.score - a.score; });
            return scored[0].cell;
        }

        function handleAIMove() {
            if (gameOver || currentPlayer !== 'O') return;
            var move = getAIMove();
            if (!move) return;

            setTimeout(function() {
                grid[move.row + ',' + move.col] = 'O';
                draw();

                if (checkWin(move.row, move.col, 'O')) {
                    gameOver = true;
                    scoreO++;
                    updateScore();
                    showWinMessage('O');
                    draw();
                    return;
                }

                currentPlayer = 'X';
                turnDisplay.textContent = currentPlayer;
                draw();
            }, 300 + Math.random() * 400);
        }

        // ===== Opponent move (multiplayer) =====
        function handleOpponentMove(row, col) {
            if (gameOver) return;
            var key = row + ',' + col;
            if (grid[key]) return;

            grid[key] = opponentPlayer;
            draw();

            if (checkWin(row, col, opponentPlayer)) {
                gameOver = true;
                if (opponentPlayer === 'X') scoreX++;
                else scoreO++;
                updateScore();
                showWinMessage(opponentPlayer);
                draw();
                return;
            }

            currentPlayer = myPlayer;
            turnDisplay.textContent = currentPlayer;
            draw();
        }

        // ===== Apply colors =====
        function applyColors() {
            var root = document.documentElement;
            root.style.setProperty('--bg-canvas', colors.bgCanvas);
            root.style.setProperty('--grid-color', colors.gridColor);
            root.style.setProperty('--x-color', colors.xColor);
            root.style.setProperty('--o-color', colors.oColor);
            root.style.setProperty('--header-bg', colors.headerBg);
            root.style.setProperty('--header-text', colors.headerText);
            root.style.setProperty('--btn-bg', colors.btnBg);
            root.style.setProperty('--btn-text', colors.btnText);
            root.style.setProperty('--win-bg', colors.winBg);
            root.style.setProperty('--win-border', colors.winBorder);
            for (var key in colorInputs) {
                if (colors[key] !== undefined) colorInputs[key].value = colors[key];
            }
            canvas.style.backgroundColor = colors.bgCanvas;
            wrap.style.backgroundColor = colors.bgCanvas;
            document.body.style.backgroundColor = colors.bgCanvas;
            draw();
        }

        function saveColorsToStorage() { try { localStorage.setItem('xo-colors', JSON.stringify(colors)); } catch(e){} }
        function loadColorsFromStorage() {
            try {
                var saved = localStorage.getItem('xo-colors');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    for (var key in colors) { if (parsed[key] !== undefined) { colors[key] = parsed[key]; } }
                }
            } catch(e){}
        }

        function onColorChange(e) { if (colors[e.target.id] !== undefined) { colors[e.target.id] = e.target.value; applyColors(); saveColorsToStorage(); } }
        for (var key in colorInputs) { colorInputs[key].addEventListener('input', onColorChange); }

        function resetColors() {
            for (var key in DEFAULT_COLORS) { colors[key] = DEFAULT_COLORS[key]; colorInputs[key].value = DEFAULT_COLORS[key]; }
            applyColors(); saveColorsToStorage();
        }
        resetColorsBtn.addEventListener('click', resetColors);
        panelToggle.addEventListener('click', function() { panel.style.display = panel.style.display === 'none' ? '' : 'none'; });
        closePanelBtn.addEventListener('click', function() { panel.style.display = 'none'; });

        // ===== Canvas resize =====
        function resizeCanvas() { var rect = wrap.getBoundingClientRect(); canvas.width = rect.width; canvas.height = rect.height; draw(); }
        window.addEventListener('resize', resizeCanvas);

        // ===== Game logic =====
        function getCellFromPoint(cx, cy) {
            var wx = cx - offsetX, wy = cy - offsetY;
            return { row: Math.floor(wy / CELL_SIZE), col: Math.floor(wx / CELL_SIZE) };
        }

        function checkWin(row, col, player) {
            var directions = [[1,0],[0,1],[1,1],[1,-1]];
            for (var d = 0; d < directions.length; d++) {
                var count = 1;
                for (var step = 1; step < 5; step++) {
                    if (grid[(row + directions[d][0]*step) + ',' + (col + directions[d][1]*step)] === player) count++;
                    else break;
                }
                for (var step = 1; step < 5; step++) {
                    if (grid[(row - directions[d][0]*step) + ',' + (col - directions[d][1]*step)] === player) count++;
                    else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function handleCanvasClick(e) {
            if (gameOver) return;
            // In multiplayer, only allow move on my turn
            if (gameConfig.mode === 'multiplayer' && currentPlayer !== myPlayer) return;

            var rect = canvas.getBoundingClientRect();
            var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
            var cell = getCellFromPoint(cx, cy);
            var key = cell.row + ',' + cell.col;
            if (grid[key]) return;

            grid[key] = currentPlayer;
            draw();

            // In multiplayer, send move to opponent
            if (gameConfig.mode === 'multiplayer') {
                sendToParent('game-move', {
                    gameId: gameConfig.gameId,
                    row: cell.row,
                    col: cell.col,
                    player: currentPlayer
                });
            }

            if (checkWin(cell.row, cell.col, currentPlayer)) {
                gameOver = true;
                totalGames++;
                if (currentPlayer === 'X') scoreX++;
                else scoreO++;
                updateScore();
                showWinMessage(currentPlayer);
                draw();

                // Send game-over to parent with +50 coins for winner
                var isWinner = (gameConfig.mode === 'multiplayer' && currentPlayer === myPlayer) ||
                               (gameConfig.mode === 'solo' && currentPlayer === 'X');
                if (isWinner) {
                    sendToParent('game-over', {
                        score: 50,
                        correct: 1,
                        totalQuestions: 1,
                        timeUsed: 0,
                        coinReward: 50
                    });
                    coinRewardEl.style.display = 'block';
                    coinRewardEl.textContent = '🪙 +50 xu';
                } else if (gameConfig.mode === 'solo') {
                    // AI wins, no coins
                    coinRewardEl.style.display = 'none';
                } else {
                    // Opponent won in multiplayer, no coins for us
                    coinRewardEl.style.display = 'none';
                }
                return;
            }

            currentPlayer = (currentPlayer === 'X' ? 'O' : 'X');
            turnDisplay.textContent = currentPlayer;
            draw();

            // AI move in solo mode
            if (gameConfig.mode === 'solo' && currentPlayer === 'O') {
                handleAIMove();
            }
        }

        // ===== Draw =====
        function draw() {
            var w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = colors.bgCanvas;
            ctx.fillRect(0, 0, w, h);
            var startCol = Math.floor(-offsetX / CELL_SIZE) - 1;
            var endCol = Math.ceil((w - offsetX) / CELL_SIZE) + 1;
            var startRow = Math.floor(-offsetY / CELL_SIZE) - 1;
            var endRow = Math.ceil((h - offsetY) / CELL_SIZE) + 1;
            ctx.strokeStyle = colors.gridColor;
            ctx.lineWidth = 1;
            for (var r = startRow; r <= endRow; r++) {
                for (var c = startCol; c <= endCol; c++) {
                    var x = offsetX + c * CELL_SIZE, y = offsetY + r * CELL_SIZE;
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
                    var val = grid[r + ',' + c];
                    if (val) {
                        ctx.font = (CELL_SIZE * 0.7) + 'px "Segoe UI", Arial, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = val === 'X' ? colors.xColor : colors.oColor;
                        ctx.fillText(val, x + HALF, y + HALF + 2);
                    }
                }
            }
        }

        // ===== Win message =====
        function showWinMessage(player) {
            winnerText.textContent = '🎉 ' + player + ' thắng!';
            winDesc.textContent = '5 liên tiếp';
            winMsg.classList.add('show');
        }

        function updateScore() { scoreXEl.textContent = scoreX; scoreOEl.textContent = scoreO; }

        function resetGame() {
            grid = {};
            currentPlayer = 'X';
            gameOver = false;
            hideWinMessage();
            turnDisplay.textContent = myPlayer;
            coinRewardEl.style.display = 'none';
            draw();
        }

        function hideWinMessage() { winMsg.classList.remove('show'); }

        function fullReset() { scoreX = 0; scoreO = 0; totalGames = 0; updateScore(); resetGame(); }

        // ===== Pan events =====
        function onPointerDown(e) {
            var clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX);
            var clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY);
            if (clientX === undefined) return;
            isDragging = true;
            dragStartX = clientX; dragStartY = clientY;
            startOffsetX = offsetX; startOffsetY = offsetY;
            canvas.style.cursor = 'grabbing';
            e.preventDefault();
        }
        function onPointerMove(e) {
            if (!isDragging) return;
            var clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX);
            var clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY);
            if (clientX === undefined) return;
            offsetX = startOffsetX + (clientX - dragStartX);
            offsetY = startOffsetY + (clientY - dragStartY);
            draw();
            e.preventDefault();
        }
        function onPointerUp(e) {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'grab';
                var clientX = e.clientX || (e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientX);
                var clientY = e.clientY || (e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientY);
                if (clientX !== undefined) {
                    if (Math.abs(clientX - dragStartX) < 5 && Math.abs(clientY - dragStartY) < 5) {
                        handleCanvasClick(e);
                    }
                }
                e.preventDefault();
            }
        }

        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp, { passive: false });

        resetBtn.addEventListener('click', fullReset);
        playAgainBtn.addEventListener('click', resetGame);

        // ===== Init =====
        loadColorsFromStorage();
        applyColors();
        resizeCanvas();
        updateScore();
        turnDisplay.textContent = 'X';
        updateModeLabel();
        panel.style.display = '';
        if (window.innerWidth < 650) panel.style.display = 'none';
        panelToggle.style.display = (window.innerWidth < 650) ? 'inline-block' : 'none';
        window.addEventListener('resize', function() {
            panelToggle.style.display = (window.innerWidth < 650) ? 'inline-block' : 'none';
        });
    })();
    </script>
</body>
</html>
