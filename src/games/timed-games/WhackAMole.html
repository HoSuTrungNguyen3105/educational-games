<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đập Chuột Nhanh Tay</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF7EE;--ink:#20283A;--teal:#1B998B;--ticket:#E4572E;--gold:#F4B942;--pink:#FF6F91}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--paper);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:#fff;border-bottom:1px solid rgba(0,0,0,.08);flex-shrink:0;height:50px}
.header .icon{font-size:26px}
.header .title{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--gold)}
.header .stats{display:flex;align-items:center;gap:14px;margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(0,0,0,.55)}
.header .stat{display:flex;align-items:center;gap:5px}
.header .timer{color:var(--teal);font-weight:600}
.btn-quit{font-family:'Poppins',sans-serif;font-size:12px;border:1px solid rgba(0,0,0,.15);border-radius:14px;padding:5px 16px;background:transparent;cursor:pointer;transition:all .15s;color:var(--ink)}
.btn-quit:hover{background:rgba(0,0,0,.05)}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.question-card{background:#fff;border-radius:16px;padding:20px;max-width:500px;width:100%;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.06);margin-bottom:24px}
.question-card .label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;color:#8A7C63;letter-spacing:1px;margin-bottom:8px}
.question-card h2{font-family:'Poppins',sans-serif;font-size:18px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:420px;width:100%}
.hole{position:relative;aspect-ratio:1;border-radius:35%;background:linear-gradient(180deg,#8B6339 0%,#5C4023 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;transition:all .2s;border:3px solid transparent}
.hole:disabled{cursor:default}
.hole .hole-shadow{position:absolute;inset-x:8px;bottom:0;height:12px;background:rgba(0,0,0,.3);border-radius:50% 50% 0 0}
.hole .mole{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;animation:popIn .3s ease}
.hole .mole-emoji{font-size:32px;margin-bottom:4px}
.hole .mole-text{font-size:11px;color:#fff;background:rgba(0,0,0,.4);border-radius:8px;padding:3px 8px;text-align:center;line-height:1.3;max-width:90px}
.hole.correct{border-color:var(--teal);box-shadow:0 0 0 4px rgba(27,153,139,.3)}
.hole.wrong{border-color:var(--ticket);box-shadow:0 0 0 4px rgba(228,87,46,.3);opacity:.7}
.hole.dimmed{opacity:.4}
.hole .result-icon{position:absolute;top:-8px;right:-8px;font-size:20px;z-index:20}
.empty-hole{opacity:.3;font-size:24px}
.feedback{margin-top:20px;font-family:'Poppins',sans-serif;font-size:18px;text-align:center}
.feedback.correct{color:var(--teal)}
.feedback.wrong{color:var(--ticket)}
.feedback.timeout{color:#888}
.explanation{margin-top:12px;padding:10px 14px;background:#f0f9ff;border-left:3px solid var(--teal);border-radius:8px;font-size:13px;line-height:1.5;max-width:500px;width:100%;text-align:left}
.overlay{display:none;position:fixed;inset:0;background:rgba(32,40,58,.85);z-index:100;justify-content:center;align-items:center}
.overlay.active{display:flex}
.overlay-card{background:#fff;border-radius:20px;padding:36px 44px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3);max-width:380px;width:90%;animation:popIn .4s ease}
.overlay-card h2{font-family:'Poppins',sans-serif;font-size:22px;margin-bottom:8px}
.overlay-card .final-score{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;color:var(--gold);margin:12px 0}
.overlay-card .final-time{font-size:14px;color:#888;margin-bottom:20px}
.overlay-card .btn-back{padding:10px 28px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@media(max-width:500px){.grid{gap:10px;max-width:300px}.hole .mole-emoji{font-size:24px}.hole .mole-text{font-size:10px;padding:2px 6px}.question-card h2{font-size:15px}.header .title{font-size:13px}}
</style>
</head>
<body>
<div id="api_submit"></div>
<div class="header">
  <span class="icon">🔨</span>
  <span class="title">ĐẬP CHUỘT NHANH TAY</span>
  <div class="stats">
    <span id="questionCounter">Câu 0/0</span>
    <span class="timer" id="timerDisplay">⏱ 0s</span>
    <span>⭐ <b id="scoreDisplay">0</b></span>
    <button class="btn-quit" id="btnQuit">Thoát</button>
  </div>
</div>
<div class="main">
  <div class="question-card">
    <div class="label">Đập vào con chuột có đáp án đúng!</div>
    <h2 id="questionText">Đang tải...</h2>
  </div>
  <div class="grid" id="grid"></div>
  <div class="feedback" id="feedback"></div>
  <div id="explanationArea"></div>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2>🎉 Hoàn thành!</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-time" id="finalTime">Thời gian: 0s</div>
    <button class="btn-back" id="btnBack">Quay lại</button>
  </div>
</div>
<script>
(function(){
var questions=[],currentIdx=0,score=0,correctCount=0,startTime=0,timeLeft=0,timerInterval=null,answered=false;
var grid=document.getElementById('grid'),questionText=document.getElementById('questionText');
var questionCounter=document.getElementById('questionCounter'),timerDisplay=document.getElementById('timerDisplay');
var scoreDisplay=document.getElementById('scoreDisplay'),feedback=document.getElementById('feedback');
var explanationArea=document.getElementById('explanationArea'),overlay=document.getElementById('overlay');
var finalScore=document.getElementById('finalScore'),finalTime=document.getElementById('finalTime');
var MOLE_HOLES=[0,1,2,3,4,5];
var LETTERS=['A','B','C','D','E','F'];

function shuffleArray(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function renderQuestion(){
  if(currentIdx>=questions.length){endGame();return;}
  answered=false;
  var q=questions[currentIdx];
  questionText.textContent=q.content;
  questionCounter.textContent='Câu '+(currentIdx+1)+'/'+questions.length;
  scoreDisplay.textContent=score;
  feedback.textContent='';
  feedback.className='feedback';
  explanationArea.innerHTML='';

  var holeAssignments=shuffleArray(MOLE_HOLES);
  var optionsWithHoles=q.options.map(function(o,i){return{id:o.id,content:o.content,hole:holeAssignments[i]};});
  var holeMap={};
  optionsWithHoles.forEach(function(o){holeMap[o.hole]=o;});

  grid.innerHTML='';
  MOLE_HOLES.forEach(function(h){
    var btn=document.createElement('button');
    btn.className='hole';
    var opt=holeMap[h];
    if(opt){
      btn.innerHTML='<div class="hole-shadow"></div><div class="mole"><span class="mole-emoji">🐹</span><span class="mole-text">'+opt.content+'</span></div>';
      btn.onclick=function(){selectAnswer(opt.id,q);};
    }else{
      btn.innerHTML='<span class="empty-hole">🕳️</span>';
      btn.disabled=true;
    }
    grid.appendChild(btn);
  });

  timeLeft=q.timeLimit||15;
  updateTimer();
  startTimer(q);
}

function startTimer(q){
  clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){clearInterval(timerInterval);if(!answered)selectAnswer(null,q);}
  },1000);
}

function updateTimer(){
  var q=questions[currentIdx];
  var tl=q?q.timeLimit:15;
  var pct=Math.max((timeLeft/tl)*100,0);
  timerDisplay.textContent='⏱ '+timeLeft+'s';
  if(pct>50)timerDisplay.style.color='var(--teal)';
  else if(pct>20)timerDisplay.style.color='var(--gold)';
  else timerDisplay.style.color='var(--ticket)';
}

function selectAnswer(answerId,q){
  if(answered)return;
  answered=true;
  clearInterval(timerInterval);

  var btns=Array.from(grid.querySelectorAll('.hole'));
  btns.forEach(function(b){b.disabled=true;});

  if(answerId!==null&&typeof window.apiSubmitAnswer==='function'){
    window.apiSubmitAnswer(q.id,answerId)
    .then(function(res){showResult(res.correct,res.points,q,answerId,res.correctAnswer);})
    .catch(function(){showResult(false,0,q,answerId,null);});
  }else{
    showResult(false,0,q,answerId,null);
  }
}

function showResult(isCorrect,earnedPoints,q,answerId,correctAnswerId){
  var btns=Array.from(grid.querySelectorAll('.hole'));
  btns.forEach(function(b){
    var textEl=b.querySelector('.mole-text');
    if(!textEl)return;
    var optContent=textEl.textContent;
    var matchingOpt=q.options.find(function(o){return o.content===optContent;});
    if(!matchingOpt)return;
    if(matchingOpt.id===correctAnswerId)b.classList.add('correct');
    if(matchingOpt.id===answerId&&!isCorrect)b.classList.add('wrong');
    if(matchingOpt.id!==correctAnswerId&&matchingOpt.id!==answerId)b.classList.add('dimmed');
    if(matchingOpt.id===correctAnswerId&&matchingOpt.id!==answerId){
      var icon=document.createElement('span');
      icon.className='result-icon';icon.textContent='✅';
      b.appendChild(icon);
    }
    if(matchingOpt.id===answerId&&!isCorrect){
      var icon2=document.createElement('span');
      icon2.className='result-icon';icon2.textContent='❌';
      b.appendChild(icon2);
    }
  });

  if(isCorrect){
    var timeBonus=Math.round((timeLeft/(q.timeLimit||15))*40);
    score+=earnedPoints+timeBonus;
    correctCount++;
    scoreDisplay.textContent=score;
    feedback.textContent='Đập trúng rồi! 🎉';
    feedback.className='feedback correct';
  }else if(answerId===null){
    feedback.textContent='Hết giờ! ⏰';
    feedback.className='feedback timeout';
  }else{
    feedback.textContent='Trật rồi 😅';
    feedback.className='feedback wrong';
  }

  if(q.explanation){
    explanationArea.innerHTML='<div class="explanation">💡 <b>Giải thích:</b> '+q.explanation+'</div>';
  }

  setTimeout(function(){
    currentIdx++;
    renderQuestion();
  },1800);
}

function endGame(){
  clearInterval(timerInterval);
  var timeUsed=Math.round((Date.now()-startTime)/1000);
  finalScore.textContent=score+' điểm';
  finalTime.textContent='Thời gian: '+timeUsed+' giây | Đúng: '+correctCount+'/'+questions.length;
  overlay.classList.add('active');
  setTimeout(function(){parent.postMessage({type:'game-over',data:{score:score,correct:correctCount,totalQuestions:questions.length,timeUsed:timeUsed}},'*');},1300);
}

document.getElementById('btnQuit').onclick=function(){parent.postMessage({type:'quit'},'*');};
document.getElementById('btnBack').onclick=function(){parent.postMessage({type:'quit'},'*');};

window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  if(e.data.type==='init'){
    var d=e.data.data;
    questions=d.questions||[];
    startTime=Date.now();
    score=0;correctCount=0;currentIdx=0;
    scoreDisplay.textContent='0';
    overlay.classList.remove('active');
    renderQuestion();
  }
});

parent.postMessage({type:'ready'},'*');
})();
</script>
</body>
</html>
