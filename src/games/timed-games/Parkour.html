<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Word Parkour — Nhảy qua sàn từ vựng</title>
<script src="config.js"></script>
<script>window.EG=(function(){var c=window.EG_CONFIG||{};try{if(/[?&]preview=1/.test(location.search)){var d=localStorage.getItem('eg_draft');if(d)c=JSON.parse(d)}}catch(e){}return c})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --dusk:#170A3A; --violet:#5B21B6; --pink:#FF6B9D; --amber:#FFB36B;
  --teal:#19D3A2; --cream:#FFF4E6; --sun:#FFD25E; --red:#FF5C7A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c0522;overscroll-behavior:none}
body{font-family:"Baloo 2","Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--cream);display:grid;place-items:center;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;max-height:880px;overflow:hidden;background:var(--dusk);touch-action:none}
@media (min-width:500px){#app{border-radius:30px;box-shadow:0 0 0 2px #4b2a8f,0 30px 90px rgba(255,107,157,.28)}}
canvas{position:absolute;inset:0;display:block}

#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:flex-start}
#lives{font-size:22px;letter-spacing:2px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
#coins{font-size:14px;font-weight:700;color:var(--sun);margin-top:2px}
.stats{text-align:right;line-height:1}
#score{font-size:34px;font-weight:800;text-shadow:0 0 14px rgba(255,107,157,.8)}
#lvl{font-size:14px;color:var(--amber);font-weight:700}
.lbar{width:96px;height:7px;border-radius:9px;background:rgba(255,244,230,.2);margin:5px 0 0 auto;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--teal);border-radius:9px;transition:width .3s}
#card{margin:6px auto 0;width:fit-content;min-width:190px;text-align:center;padding:8px 26px 10px;border-radius:24px;
  background:rgba(23,10,58,.55);border:2px solid rgba(255,179,107,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 34px rgba(255,107,157,.4);pointer-events:auto;cursor:pointer}
#cEmoji{font-size:64px;line-height:1.05;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#cLabel{font-size:14px;font-weight:600;color:var(--amber);line-height:1}
#card.pulse{animation:pulse .45s}
@keyframes pulse{40%{transform:scale(1.1)}}
#combo{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 48px);font-weight:800;font-size:20px;color:var(--sun);
  text-shadow:0 0 12px rgba(255,210,94,.8);opacity:0;transition:opacity .2s;pointer-events:none}
#combo.on{opacity:1}
#toast{position:absolute;left:12px;right:12px;top:38%;text-align:center;font-size:26px;font-weight:800;opacity:0;pointer-events:none;
  text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.4)}
#toast.show{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.9)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:56px;font-weight:800;color:var(--sun);
  text-shadow:0 0 24px rgba(255,210,94,.9),0 4px 0 #b57a00;opacity:0;pointer-events:none}
#banner.show{animation:ban 1.3s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);text-align:center;font-size:13px;color:rgba(255,244,230,.75);pointer-events:none;transition:opacity 1s}
#hint.off{opacity:0}
#mute{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 110px);width:40px;height:40px;border-radius:50%;
  border:2px solid rgba(255,179,107,.55);background:rgba(23,10,58,.55);color:#fff;font-size:18px;cursor:pointer;z-index:3}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
  background:radial-gradient(circle at 50% 25%,rgba(150,50,160,.5),rgba(16,6,40,.94) 70%);z-index:5;transition:opacity .3s;overflow-y:auto}
.overlay.hidden{opacity:0;pointer-events:none}
.logo{font-size:60px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,150,80,.7))}
@keyframes float{50%{transform:translateY(-10px) rotate(-6deg)}}
h1{font-size:50px;line-height:1;font-weight:800;text-shadow:0 0 28px rgba(255,107,157,.9),0 4px 0 #7a1f58}
.sub{color:var(--amber);font-size:16px;max-width:300px;line-height:1.3;font-weight:600}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:320px;margin-top:4px}
.tp{border:0;border-radius:20px;padding:12px 8px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;color:var(--dusk);
  background:var(--cream);box-shadow:0 5px 0 var(--c),0 0 22px rgba(255,255,255,.08);transition:transform .08s;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.05}
.tp:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c)}
.tp .e{font-size:34px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tp small{font-size:12px;font-weight:600;opacity:.65}
.toggle{border:2px solid rgba(255,179,107,.6);background:transparent;color:var(--cream);border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#053D2C}
.btn{border:0;border-radius:18px;padding:12px 26px;font:inherit;font-weight:800;font-size:20px;cursor:pointer;color:var(--dusk);
  background:var(--sun);box-shadow:0 5px 0 #B98500;width:100%;max-width:300px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B98500}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:none;border:2px solid rgba(255,179,107,.6)}
.btn:focus-visible,.tp:focus-visible,.toggle:focus-visible,#mute:focus-visible,#card:focus-visible{outline:3px solid #fff;outline-offset:3px}
.big{font-size:68px;font-weight:800;color:var(--sun);text-shadow:0 0 26px rgba(255,210,94,.8);line-height:1}
.medal{font-size:22px;font-weight:700;color:var(--teal)}
.res{display:flex;gap:22px;color:var(--amber);font-size:14px}
.res b{display:block;font-size:24px;color:#fff}
.lt{font-size:13px;font-weight:700;color:var(--amber);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px}
.chip{background:rgba(255,244,230,.14);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.miss{background:rgba(255,92,122,.28)}
@media (prefers-reduced-motion:reduce){.logo,#card.pulse,#toast.show,#banner.show{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Khu vực chơi game"></canvas>

  <div id="hud">
    <div class="row">
      <div><div id="lives" aria-label="Số mạng còn lại"></div><div id="coins">🪙 0</div></div>
      <div class="stats"><div id="score">0</div><div id="lvl">Cấp 1</div><div class="lbar"><i id="lfill"></i></div></div>
    </div>
    <div id="card" role="button" tabindex="0" aria-live="polite"><div id="cEmoji">🦊</div><div id="cLabel">Word Parkour</div></div>
  </div>
  <div id="combo"></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="hint">Chạm nửa trên để nhảy lên · nửa dưới để tụt xuống · hoặc phím ↑ ↓</div>
  <button id="mute" aria-label="Bật tắt âm thanh">🔊</button>

  <div id="start" class="overlay">
    <div class="logo">🦊</div>
    <h1>Word Parkour</h1>
    <p class="sub">Nhảy lên sàn có từ tiếng Anh đúng với hình. Nhảy sai sàn là mất tim!</p>
    <button class="toggle" id="listen" aria-pressed="false">🎧 Chế độ nghe: Tắt</button>
    <div class="topics">
      <button class="tp" data-topic="fruit" style="--c:#E2A100"><span class="e">🍎</span>Trái cây<small>Fruits</small></button>
      <button class="tp" data-topic="animal" style="--c:#D4577E"><span class="e">🐘</span>Động vật<small>Animals</small></button>
      <button class="tp" data-topic="object" style="--c:#12A07C"><span class="e">🎒</span>Đồ vật<small>Objects</small></button>
      <button class="tp" data-topic="mix" style="--c:#7C4BD6"><span class="e">🌈</span>Tổng hợp<small>Mix</small></button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="medal" id="medal">Nhảy giỏi lắm!</div>
    <div class="big" id="fScore">0</div>
    <div class="res"><div><b id="fSolved">0</b>câu đúng</div><div><b id="fLvl">1</b>cấp đạt</div><div><b id="fCoins">0</b>xu</div><div><b id="fBest">0</b>kỷ lục</div></div>
    <div id="learnBox"><div class="lt">Từ đã học</div><div class="chips" id="learned"></div></div>
    <div id="missBox"><div class="lt">Cần ôn lại</div><div class="chips" id="missed"></div></div>
    <button class="btn" id="again">Nhảy lại</button>
    <button class="btn ghost" id="menu">Đổi chủ đề</button>
  </div>
</div>

<script>
(function(){
/* ================= Tiện ích ================= */
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rnd=()=>Math.random();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rand(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT='"Baloo 2",system-ui,sans-serif';

/* ================= Từ vựng ================= */
const B=(e,en,vi)=>({e,en,vi});
const banks={
  fruit:[B('🍎','apple','quả táo'),B('🍌','banana','quả chuối'),B('🍇','grape','quả nho'),B('🍓','strawberry','dâu tây'),B('🍊','orange','quả cam'),B('🍉','watermelon','dưa hấu'),B('🍍','pineapple','quả dứa'),B('🍒','cherry','anh đào'),B('🥭','mango','quả xoài'),B('🥥','coconut','quả dừa'),B('🍋','lemon','quả chanh'),B('🍑','peach','quả đào')],
  animal:[B('🐶','dog','con chó'),B('🐱','cat','con mèo'),B('🐘','elephant','con voi'),B('🦁','lion','sư tử'),B('🐵','monkey','con khỉ'),B('🐰','rabbit','con thỏ'),B('🐟','fish','con cá'),B('🐦','bird','con chim'),B('🐮','cow','con bò'),B('🐷','pig','con lợn'),B('🐢','turtle','con rùa'),B('🦒','giraffe','hươu cao cổ'),B('🐯','tiger','con hổ'),B('🐼','panda','gấu trúc')],
  object:[B('📚','book','quyển sách'),B('✏️','pencil','bút chì'),B('🎒','backpack','cái cặp'),B('⏰','clock','đồng hồ'),B('🏠','house','ngôi nhà'),B('🚗','car','ô tô'),B('⚽','ball','quả bóng'),B('🚲','bicycle','xe đạp'),B('☂️','umbrella','cái ô'),B('🌙','moon','mặt trăng'),B('⭐','star','ngôi sao'),B('🔑','key','chìa khóa'),B('🎈','balloon','bóng bay'),B('🎁','gift','món quà')]
};
banks.mix=[].concat(banks.fruit,banks.animal,banks.object);
(function(){
  const c=(window.EG&&window.EG.wordparkour)||(window.EG&&window.EG.wordrush)||{},w=c.words||{};
  ['fruit','animal','object'].forEach(k=>{
    if(Array.isArray(w[k])){
      const l=w[k].filter(x=>x&&x.en&&String(x.en).trim()).map(x=>B(x.e||'❓',String(x.en).trim(),x.vi||''));
      if(l.length>=3)banks[k]=l;
    }
  });
  banks.mix=[].concat(banks.fruit,banks.animal,banks.object);
})();

/* ================= Cấu hình ================= */
const CF=(window.EG&&window.EG.wordparkour)||(window.EG&&window.EG.wordrush)||{};
const LIVES=CF.lives||3,LEVEL_EVERY=CF.levelEvery||6,SPEED_F=CF.speed||1;

/* ================= Trạng thái ================= */
let W=0,H=0,dpr=1;
let state='menu',topic='fruit',listen=false;
let score=0,lives=LIVES,level=1,combo=0,correctCnt=0,coinCnt=0,best=0;
let worldSpeed=270*SPEED_F;
let lane=1, transT=1, transFrom=1, transTo=1;   // 0=trên,1=giữa,2=dưới
let foxY=0, foxRot=0, foxBob=0;
let T=0,lastT=0,shake=0,flash=0,flashCol='255,60,90';
let distance=0, dustT=0;
let rows=[], particles=[], active=null;
let learned=[], missed=[], lastItems=[];
let skyStars=[];
let skyGrad=null, platGrads=[], platDarkGrads=[];

/* Vị trí 3 sàn (theo tỉ lệ chiều cao) */
const PLAT_Y=[0.42,0.64,0.86];
const PLAT_H=22;
const LANE_COLOR=['#FF6B9D','#FFD25E','#19D3A2'];
const LANE_COLOR_LT=['#FFB0C0','#FFF0B0','#80FFD9'];
const FOX_X_FRAC=0.28;
const CARD_W=88, CARD_H=52;

/* ================= Âm thanh ================= */
let AC=null,muted=false;
function tone(f,d,type,v,slide){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  move:()=>tone(320,.09,'sine',.06,240),
  coin:()=>tone(1250,.07,'square',.04),
  ok:()=>{tone(523,.12,'triangle',.15);setTimeout(()=>tone(784,.18,'triangle',.15),90)},
  bad:()=>tone(170,.32,'sawtooth',.12,-100),
  up:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.15),i*90))},
  over:()=>{[400,300,220,150].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sawtooth',.1),i*140))}
};
function speak(text){
  if(muted||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);}catch(e){}
}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';};

/* ================= Resize + cache ================= */
function buildGrads(){
  skyGrad=ctx.createLinearGradient(0,0,0,H*0.42);
  skyGrad.addColorStop(0,'#170a3a');
  skyGrad.addColorStop(.45,'#5b21b6');
  skyGrad.addColorStop(.8,'#e0448e');
  skyGrad.addColorStop(1,'#ffb36b');
  platGrads=PLAT_Y.map(py=>{
    const y=py*H;
    const g=ctx.createLinearGradient(0,y,0,y+PLAT_H);
    g.addColorStop(0,'#3a2b5c');
    g.addColorStop(1,'#1d1234');
    return g;
  });
  platDarkGrads=PLAT_Y.map(py=>{
    const y=py*H+PLAT_H;
    const g=ctx.createLinearGradient(0,y,0,y+10);
    g.addColorStop(0,'#100726');
    g.addColorStop(1,'#08041a');
    return g;
  });
}
function resize(){
  const r=$('app').getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  foxY=PLAT_Y[1]*H;
  skyStars=Array.from({length:36},()=>({x:rnd()*W,y:rnd()*H*0.34,r:.4+rnd()*1.1,p:rnd()*6}));
  buildGrads();
}
window.addEventListener('resize',resize);

/* ================= Logic ================= */
function pickItem(bank){
  let it,g=0;
  do{it=bank[rand(0,bank.length-1)];}while(lastItems.indexOf(it)>=0&&g++<30);
  lastItems.push(it);if(lastItems.length>4)lastItems.shift();
  return it;
}
function spawnRow(){
  const bank=banks[topic];
  const item=pickItem(bank);
  const others=shuffle(bank.filter(x=>x!==item&&x.en!==item.en)).slice(0,2);
  const arr=shuffle([item,...others]);
  const correctLane=arr.indexOf(item);
  const cards=arr.map((it,i)=>({lane:i,item:it,correct:i===correctLane}));
  rows.push({x:W+60,item,correctLane,cards,judged:false,pickedLane:-1,spoken:false});
  refreshActive();
}
function refreshActive(){
  let next=null;
  for(let i=0;i<rows.length;i++){if(!rows[i].judged){next=rows[i];break;}}
  if(next===active)return;
  active=next;
  const card=$('card');
  if(active){
    if(listen){
      $('cEmoji').textContent='🔊';
      $('cLabel').textContent='Nghe và chọn từ đúng';
      if(!active.spoken){active.spoken=true;const a=active;setTimeout(()=>{if(a===active)speak(a.item.en);},250);}
    }else{
      $('cEmoji').textContent=active.item.e;
      $('cLabel').textContent='Đây là gì?';
    }
    card.classList.remove('pulse');
    void card.offsetWidth;
    card.classList.add('pulse');
  }
}
function startGame(t){
  topic=t;score=0;lives=LIVES;level=1;combo=0;correctCnt=0;coinCnt=0;
  worldSpeed=270*SPEED_F;lane=1;transT=1;transFrom=1;transTo=1;
  rows=[];particles=[];learned=[];missed=[];lastItems=[];active=null;
  distance=0;shake=0;flash=0;
  $('start').classList.add('hidden');
  $('over').classList.add('hidden');
  state='play';spawnRow();hud();
  const h=$('hint');h.classList.remove('off');setTimeout(()=>h.classList.add('off'),5000);
}
function hud(){
  $('score').textContent=score;
  $('lvl').textContent='Cấp '+level;
  $('lives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,LIVES-Math.max(0,lives)));
  $('coins').textContent='🪙 '+coinCnt;
  $('lfill').style.width=((correctCnt%LEVEL_EVERY)/LEVEL_EVERY*100)+'%';
  const c=$('combo');
  if(combo>=2){c.textContent='Liên tiếp x'+combo+' 🔥';c.classList.add('on');}
  else c.classList.remove('on');
}
function say(el,t,color){
  el.textContent=t;
  el.classList.remove('show');
  if(color!==undefined)el.style.color=color;
  void el.offsetWidth;
  el.classList.add('show');
}
function burst(x,y,cols,n,g){
  if(particles.length>90)n=Math.min(n,20);
  for(let i=0;i<n;i++){
    const a=rnd()*6.28,s=60+rnd()*240;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:.5+rnd()*.6,max:1.1,c:cols[rand(0,cols.length-1)],s:2+rnd()*3,g:g});
  }
}
function judge(r){
  r.judged=true;
  r.pickedLane=lane;
  const ok=(lane===r.correctLane),it=r.item;
  const px=W*FOX_X_FRAC, py=foxY-30;
  if(ok){
    combo++;correctCnt++;
    const mult=Math.min(4,1+Math.floor(combo/4));
    score+=10*mult;
    if(learned.indexOf(it)<0)learned.push(it);
    burst(px,py,['#FFD25E','#FF6B9D','#19D3A2','#35E0FF','#FFF4E6'],36,380);
    say($('toast'),it.e+' '+it.en+' = '+it.vi,'#3DF0B0');
    sfx.ok();
    if(!listen)setTimeout(()=>speak(it.en),150);
    if(correctCnt%LEVEL_EVERY===0){
      level++;
      worldSpeed=Math.min(660*SPEED_F,(270+(level-1)*40)*SPEED_F);
      say($('banner'),'Cấp '+level+'!');
      sfx.up();
    }
  }else{
    combo=0;lives--;shake=.5;flash=1;flashCol='255,60,90';
    if(missed.indexOf(it)<0)missed.push(it);
    burst(px,py,['#FF5C7A','#8F5AA8'],24,300);
    say($('toast'),'Đáp án: '+it.e+' '+it.en+' = '+it.vi,'#FFB0C0');
    sfx.bad();setTimeout(()=>speak(it.en),250);
  }
  hud();
  refreshActive();
  if(lives<=0)gameOver();
}
function gameOver(){
  state='over';sfx.over();
  best=Math.max(best,score);
  setTimeout(()=>{rows=[];active=null;},1200);
  setTimeout(()=>{
    $('fScore').textContent=score;
    $('fSolved').textContent=correctCnt;
    $('fLvl').textContent=level;
    $('fCoins').textContent=coinCnt;
    $('fBest').textContent=best;
    $('medal').textContent=score>=300?'Nhà thông thái tí hon! 🏆':score>=150?'Nhảy xuất sắc! 🌟':score>=60?'Nhảy giỏi lắm!':'Cố lên, thử lại nhé!';
    fill($('learned'),learned,'');
    fill($('missed'),missed,'miss');
    $('learnBox').style.display=learned.length?'block':'none';
    $('missBox').style.display=missed.length?'block':'none';
    $('over').classList.remove('hidden');
  },1000);
}
function fill(box,list,cls){
  box.textContent='';
  list.slice(0,8).forEach(it=>{
    const s=document.createElement('span');
    s.className='chip '+cls;
    s.textContent=it.e+' '+it.en+' · '+it.vi;
    box.appendChild(s);
  });
}

/* ================= Điều khiển ================= */
function move(d){
  if(state!=='play'||transT<1)return;
  const target=clamp(lane+d,0,2);
  if(target!==lane){
    transFrom=lane;transTo=target;transT=0;
    // dust khi bật nhảy
    burst(W*FOX_X_FRAC,PLAT_Y[lane]*H-20,['rgba(255,220,180,.85)','#FFD25E'],8,80);
    sfx.move();
  }
}

/* ================= Cập nhật ================= */
function update(dt){
  T+=dt;
  const v=state==='play'?worldSpeed:state==='menu'?180:60;
  distance+=v*dt;

  /* Nội suy nhảy giữa các sàn */
  if(transT<1){
    transT=Math.min(1,transT+dt/0.30);
    if(transT>=1){transFrom=transTo;}
  }
  const tt=easeOut(transT);
  const yBase=lerp(PLAT_Y[transFrom]*H,PLAT_Y[transTo]*H,tt);
  const arc=Math.sin(transT*Math.PI)*42;
  foxY=yBase-arc;
  foxRot=Math.sin(transT*Math.PI)*(transTo-transFrom)*1.1;
  foxBob=Math.sin(T*15)*Math.abs(lane-transFrom>=0?1:1)*3;

  /* Sinh hàng mới */
  if(state==='play'){
    const last=rows[rows.length-1];
    if(!last||last.x<W-CARD_W-40)spawnRow();

    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      r.x-=v*dt;
      if(!r.judged&&r.x<=W*FOX_X_FRAC)judge(r);
    }
    rows=rows.filter(r=>r.x>-CARD_W-20);
  }

  /* Hạt bụi chân */
  dustT-=dt;
  if(dustT<=0&&state!=='over'){
    dustT=.08;
    particles.push({x:W*FOX_X_FRAC+(rnd()-.5)*16,y:PLAT_Y[transTo]*H-2,vx:(rnd()-.5)*30-v*.1,vy:-15-rnd()*30,life:.35,max:.35,c:'rgba(255,220,180,.55)',s:2.5+rnd()*2,g:0});
  }

  /* Hạt */
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;
  }
  if(particles.length>0)particles=particles.filter(p=>p.life>0);

  shake=Math.max(0,shake-dt*1.4);
  flash=Math.max(0,flash-dt*2.2);
}

/* ================= Vẽ ================= */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawSky(){
  ctx.fillStyle=skyGrad;
  ctx.fillRect(0,0,W,H);
  /* Sao lấp lánh */
  ctx.fillStyle='#fff';
  for(let i=0;i<skyStars.length;i++){
    const s=skyStars[i];
    const a=.35+.5*Math.sin(T*2+s.p);
    ctx.globalAlpha=a;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* Mặt trăng */
  const cx=W*0.78,cy=H*0.16,r=Math.min(W*.11,56);
  const gl=ctx.createRadialGradient(cx,cy,r*.5,cx,cy,r*2.6);
  gl.addColorStop(0,'rgba(255,210,140,.55)');
  gl.addColorStop(1,'rgba(255,210,140,0)');
  ctx.fillStyle=gl;ctx.fillRect(cx-r*3,cy-r*3,r*6,r*6);
  ctx.fillStyle='#FFE9B0';
  ctx.beginPath();ctx.arc(cx,cy,r,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(200,150,90,.35)';
  ctx.beginPath();ctx.arc(cx-r*.3,cy-r*.2,r*.18,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*.25,cy+r*.15,r*.12,0,6.28);ctx.fill();
  /* Núi xa */
  ctx.fillStyle='#2b1656';
  ctx.beginPath();ctx.moveTo(0,H*0.42);
  for(let x=0;x<=W;x+=24){
    const y=H*0.34+Math.sin(x*.013+1.7)*12+Math.sin(x*.031+4.1)*6;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H*0.42);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1a0e3d';
  ctx.beginPath();ctx.moveTo(0,H*0.42);
  for(let x=0;x<=W;x+=24){
    const y=H*0.38+Math.sin(x*.019+3.1)*8+Math.sin(x*.045+0.9)*4;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H*0.42);ctx.closePath();ctx.fill();
}
function drawPlatforms(){
  const scrollX=(distance*0.9)%64;
  for(let i=0;i<3;i++){
    const y=PLAT_Y[i]*H;
    /* Thân sàn */
    ctx.fillStyle=platGrads[i];
    ctx.fillRect(0,y,W,PLAT_H);
    /* Mép phát sáng trên */
    ctx.fillStyle=LANE_COLOR[i];
    ctx.fillRect(0,y-3,W,3);
    /* Viền sáng mờ */
    const g=ctx.createLinearGradient(0,y-14,0,y);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,LANE_COLOR_LT[i]+'44');
    ctx.fillStyle=g;ctx.fillRect(0,y-14,W,14);
    /* Đáy tối */
    ctx.fillStyle=platDarkGrads[i];
    ctx.fillRect(0,y+PLAT_H,W,10);
    /* Vạch texture cuộn */
    for(let x=-scrollX;x<W;x+=64){
      ctx.fillStyle='rgba(255,255,255,.06)';
      ctx.fillRect(x,y+6,32,4);
      ctx.fillStyle=LANE_COLOR[i];
      ctx.globalAlpha=.35;
      ctx.fillRect(x+40,y+13,10,3);
      ctx.globalAlpha=1;
    }
    /* Nếu cáo đang đứng trên sàn này → vệt sáng nhẹ */
    if(i===transTo||(transT<1&&i===transFrom)){
      ctx.fillStyle='rgba(255,244,230,.05)';
      ctx.fillRect(0,y,W,PLAT_H);
    }
  }
}
function drawCard(card){
  /* thẻ từ ngữ nổi phía trên sàn */
  const row=card;
  const x=row.x;
  const baseY=PLAT_Y[card.lane]*H;
  const cy=baseY-42;
  const isJudged=row.judged;
  const isCorrect=card.correct;
  const isPicked=row.pickedLane===card.lane;
  let bg='#FFF4E6',fg='#2B1055',border=LANE_COLOR[card.lane];
  if(isJudged){
    if(isCorrect){bg='#3DF0B0';fg='#053D2C';border='#3DF0B0';}
    else if(isPicked){bg='#FF5C7A';fg='#fff';border='#FF5C7A';}
    else {bg='#cfc6dc';fg='#6b5e86';border='#9d94b3';}
  }
  /* cột đỡ */
  ctx.fillStyle='#5a2d12';
  ctx.fillRect(x+CARD_W/2-3,cy+CARD_H,6,baseY-(cy+CARD_H)-2);
  /* thân thẻ */
  rr(x,cy,CARD_W,CARD_H,12);
  ctx.fillStyle=bg;ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=border;ctx.stroke();
  /* dòng chữ */
  const word=card.item.en;
  let fs=22;
  ctx.font='800 '+fs+'px '+FONT;
  let tw=ctx.measureText(word).width;
  if(tw>CARD_W-14){
    fs=fs*(CARD_W-14)/tw;
    ctx.font='800 '+fs+'px '+FONT;
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=fg;
  ctx.fillText(word,x+CARD_W/2,cy+CARD_H/2+1);
}
function drawFox(){
  const x=W*FOX_X_FRAC, y=foxY;
  const sc=Math.min(1,W/460)*0.95;
  const run=Math.sin(T*15);

  /* bóng */
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(x,PLAT_Y[transTo]*H+2,28*sc,6*sc,0,0,6.28);
  ctx.fill();

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(foxRot);
  ctx.scale(sc,sc);
  ctx.translate(0,-Math.abs(run)*8);

  const OR='#FF8A3D',DK='#5a2d12';
  /* chân */
  ctx.fillStyle=DK;
  rr(-15,-14+(run>0?-8:0),11,16,4);ctx.fill();
  rr(4,-14+(run>0?0:-8),11,16,4);ctx.fill();
  /* thân */
  ctx.fillStyle=OR;ctx.beginPath();ctx.ellipse(0,-34,20,25,0,0,6.28);ctx.fill();
  ctx.fillStyle='#FFB07A';ctx.beginPath();ctx.ellipse(0,-30,11,16,0,0,6.28);ctx.fill();
  /* đuôi */
  ctx.save();
  ctx.translate(0,-22);
  ctx.rotate(Math.sin(T*7)*.3);
  ctx.fillStyle=OR;ctx.beginPath();ctx.ellipse(0,-6,15,24,0,0,6.28);ctx.fill();
  ctx.fillStyle='#FFF4E6';ctx.beginPath();ctx.ellipse(0,-24,10,9,0,0,6.28);ctx.fill();
  ctx.restore();
  /* đầu */
  ctx.fillStyle=OR;ctx.beginPath();ctx.arc(0,-70,21,0,6.28);ctx.fill();
  ctx.beginPath();ctx.moveTo(-20,-76);ctx.lineTo(-13,-99);ctx.lineTo(-3,-84);ctx.fill();
  ctx.beginPath();ctx.moveTo(20,-76);ctx.lineTo(13,-99);ctx.lineTo(3,-84);ctx.fill();
  ctx.fillStyle=DK;
  ctx.beginPath();ctx.moveTo(-14,-80);ctx.lineTo(-12,-92);ctx.lineTo(-7,-83);ctx.fill();
  ctx.beginPath();ctx.moveTo(14,-80);ctx.lineTo(12,-92);ctx.lineTo(7,-83);ctx.fill();
  ctx.fillStyle='#FFF4E6';
  ctx.beginPath();ctx.ellipse(-19,-64,5,7,.3,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(19,-64,5,7,-.3,0,6.28);ctx.fill();
  /* khăn */
  const wv=Math.sin(T*10)*4;
  ctx.fillStyle='#35E0FF';
  rr(-19,-54,38,10,5);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(12,-50);ctx.lineTo(36+wv,-44);ctx.lineTo(32+wv,-36);ctx.lineTo(10,-44);
  ctx.fill();
  ctx.restore();
}
function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((rnd()-.5)*shake*18,(rnd()-.5)*shake*18);

  drawSky();
  drawPlatforms();

  /* vẽ theo thứ tự z: sàn trên cùng vẽ trước, sàn dưới vẽ sau — nhưng ở đây
     vì sàn nằm ngang và tách biệt, vẽ tuần tự là đủ. Thẻ + cáo chèn đúng vị trí. */
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.x<-CARD_W-10||r.x>W+10)continue;
    for(let k=0;k<3;k++)drawCard(r.cards[k]);
  }
  drawFox();
  drawParticles();

  ctx.restore();
  if(flash>0){
    ctx.fillStyle='rgba('+flashCol+','+flash*.3+')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ================= Vòng lặp ================= */
function loop(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);
  lastT=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= Input ================= */
let sx=0,sy=0,used=false,down=false,downT=0;
cv.addEventListener('pointerdown',e=>{
  sx=e.clientX;sy=e.clientY;used=false;down=true;downT=performance.now();
});
cv.addEventListener('pointermove',e=>{
  if(!down||used)return;
  const dy=e.clientY-sy;
  if(Math.abs(dy)>28){
    move(dy>0?1:-1);   /* vuốt xuống → xuống sàn dưới */
    used=true;
  }
});
cv.addEventListener('pointerup',e=>{
  down=false;
  if(used)return;
  const r=cv.getBoundingClientRect();
  const y=e.clientY-r.top;
  /* Chạm nửa trên → lên sàn trên ; nửa dưới → xuống sàn dưới */
  move(y<H/2?-1:1);
});
cv.addEventListener('pointercancel',()=>{down=false;});
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();move(-1);}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();move(1);}
});
$('card').addEventListener('click',()=>{if(listen&&active)speak(active.item.en);});
$('card').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&listen&&active)speak(active.item.en);});
$('listen').onclick=()=>{
  listen=!listen;
  $('listen').setAttribute('aria-pressed',listen);
  $('listen').textContent='🎧 Chế độ nghe: '+(listen?'Bật':'Tắt');
  if(active)active.spoken=false;
  if(listen&&active&&state==='play')speak(active.item.en);
};
document.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.topic)));
$('again').onclick=()=>startGame(topic);
$('menu').onclick=()=>{
  $('over').classList.add('hidden');
  $('start').classList.remove('hidden');
  state='menu';rows=[];particles=[];lane=1;transFrom=1;transTo=1;transT=1;
  foxY=PLAT_Y[1]*H;foxRot=0;
  $('cEmoji').textContent='🦊';$('cLabel').textContent='Word Parkour';
};

/* ================= Khởi động ================= */
resize();
hud();
requestAnimationFrame(loop);
})();
</script>
