<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja Vượt Chướng Ngại</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF7EE;--ink:#20283A;--teal:#1B998B;--ticket:#E4572E;--gold:#F4B942}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:linear-gradient(180deg,#1D2E4A 0%,#16233A 60%,#0F172A 100%);color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;height:50px}
.header .icon{font-size:26px}
.header .title{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--gold)}
.header .stats{display:flex;align-items:center;gap:14px;margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,.5)}
.header .stat{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);padding:3px 10px;border-radius:16px}
.btn-quit{font-family:'Poppins',sans-serif;font-size:12px;border:1px solid rgba(244,185,66,.3);border-radius:14px;padding:5px 16px;background:transparent;cursor:pointer;transition:all .15s;color:var(--gold)}
.btn-quit:hover{background:rgba(244,185,66,.12)}
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:20px}
.scene{position:relative;width:100%;max-width:600px;height:130px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#223154 0%,#16233A 100%)}
.ground{position:absolute;inset-x-0;bottom:0;height:24px;background:repeating-linear-gradient(90deg,rgba(244,185,66,.35) 0 18px,transparent 18px 36px)}
.ninja{position:absolute;bottom:24px;left:40px;font-size:48px;transition:transform .5s ease;z-index:10}
.ninja.jumping{transform:translateY(-50px)}
.obstacle{position:absolute;bottom:24px;font-size:22px;opacity:.7;transition:right .3s}
.scene-label{position:absolute;top:10px;left:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.5)}
.question-card{background:rgba(255,255,255,.95);border-radius:16px;padding:24px;max-width:500px;width:100%;color:var(--ink);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.q-content{font-family:'Poppins',sans-serif;font-size:18px;line-height:1.5;margin-bottom:20px;text-align:center}
.options{display:flex;flex-direction:column;gap:10px}
.option-btn{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid rgba(0,0,0,.08);border-radius:14px;background:#fff;cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.option-btn:hover:not(:disabled){border-color:rgba(244,185,66,.4)}
.option-btn:disabled{cursor:default}
.option-btn .letter{width:30px;height:30px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;flex-shrink:0}
.option-btn.correct{border-color:var(--teal);background:rgba(27,153,139,.1)}
.option-btn.wrong{border-color:var(--ticket);background:rgba(228,87,46,.1)}
.option-btn.dimmed{opacity:.5}
.feedback{margin-top:16px;font-family:'Poppins',sans-serif;font-size:17px;text-align:center}
.feedback.correct{color:var(--teal)}
.feedback.wrong{color:var(--ticket)}
.feedback.timeout{color:#888}
.explanation{margin-top:12px;padding:10px 14px;background:#f0f9ff;border-left:3px solid var(--teal);border-radius:8px;font-size:13px;line-height:1.5;color:var(--ink)}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.9);z-index:100;justify-content:center;align-items:center}
.overlay.active{display:flex}
.overlay-card{background:#fff;border-radius:20px;padding:36px 44px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4);max-width:380px;width:90%;animation:popIn .4s ease}
.overlay-card h2{font-family:'Poppins',sans-serif;font-size:22px;margin-bottom:8px;color:var(--ink)}
.overlay-card .final-score{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;color:var(--gold);margin:12px 0}
.overlay-card .final-time{font-size:14px;color:#888;margin-bottom:20px}
.overlay-card .btn-back{padding:10px 28px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@media(max-width:500px){.q-content{font-size:15px}.option-btn{font-size:12px;padding:10px 12px}.header .title{font-size:13px}.ninja{font-size:36px;left:20px}.scene{height:110px}}
</style>
</head>
<body>
<div id="api_submit"></div>
<div class="header">
  <span class="icon">🥷</span>
  <span class="title">NINJA VƯỢT CHƯỚNG NGẠI</span>
  <div class="stats">
    <span id="questionCounter">Câu 0/0</span>
    <span>⭐ <b id="scoreDisplay">0</b></span>
    <button class="btn-quit" id="btnQuit">Thoát</button>
  </div>
</div>
<div class="main">
  <div class="scene" id="scene">
    <div class="ground"></div>
    <div class="ninja" id="ninja">🥷</div>
    <span class="scene-label" id="sceneLabel">Câu 1/1</span>
  </div>
  <div class="question-card">
    <div class="q-content" id="qContent">Đang tải...</div>
    <div class="options" id="qOptions"></div>
    <div class="feedback" id="feedback"></div>
    <div id="explanationArea"></div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2>🎉 Hoàn thành!</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-time" id="finalTime">Thời gian: 0s</div>
    <button class="btn-back" id="btnBack">Quay lại</button>
  </div>
</div>
<script>
(function(){
var questions=[],currentIdx=0,score=0,correctCount=0,startTime=0,timeLeft=0,timerInterval=null,answered=false;
var jumping=false;
var ninja=document.getElementById('ninja'),scene=document.getElementById('scene'),sceneLabel=document.getElementById('sceneLabel');
var qContent=document.getElementById('qContent'),qOptions=document.getElementById('qOptions');
var scoreDisplay=document.getElementById('scoreDisplay'),questionCounter=document.getElementById('questionCounter');
var feedback=document.getElementById('feedback'),explanationArea=document.getElementById('explanationArea');
var overlay=document.getElementById('overlay'),finalScore=document.getElementById('finalScore'),finalTime=document.getElementById('finalTime');
var OBSTACLE_ICONS=["🌵","🪨","🔥","🧱"];

function renderObstacles(){
  scene.querySelectorAll('.obstacle').forEach(function(o){o.remove();});
  for(var i=0;i<4;i++){
    var obs=document.createElement('span');
    obs.className='obstacle';
    obs.textContent=OBSTACLE_ICONS[i%OBSTACLE_ICONS.length];
    obs.style.right=(10+i*22)+'%';
    scene.appendChild(obs);
  }
}

function jump(){
  if(jumping)return;
  jumping=true;
  ninja.classList.add('jumping');
  setTimeout(function(){jumping=false;ninja.classList.remove('jumping');},500);
}

function renderQuestion(){
  if(currentIdx>=questions.length){endGame();return;}
  answered=false;
  var q=questions[currentIdx];
  qContent.textContent=q.content;
  questionCounter.textContent='Câu '+(currentIdx+1)+'/'+questions.length;
  sceneLabel.textContent='Câu '+(currentIdx+1)+'/'+questions.length;
  scoreDisplay.textContent=score;
  feedback.textContent='';feedback.className='feedback';
  explanationArea.innerHTML='';

  renderObstacles();

  var LETTERS=['A','B','C','D'];
  qOptions.innerHTML='';
  q.options.forEach(function(o,i){
    var btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML='<span class="letter">'+LETTERS[i]+'</span><span>'+o.content+'</span>';
    btn.onclick=function(){selectAnswer(o.id,q);};
    qOptions.appendChild(btn);
  });

  timeLeft=q.timeLimit||15;
  updateTimer();
  startTimer(q);
}

function startTimer(q){
  clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){clearInterval(timerInterval);if(!answered)selectAnswer(null,q);}
  },1000);
}

function updateTimer(){
  var q=questions[currentIdx];
  var tl=q?q.timeLimit:15;
  var pct=Math.max((timeLeft/tl)*100,0);
  if(pct>50)sceneLabel.style.color='rgba(76,175,80,.8)';
  else if(pct>20)sceneLabel.style.color='rgba(244,185,66,.8)';
  else sceneLabel.style.color='rgba(228,87,46,.8)';
}

function selectAnswer(answerId,q){
  if(answered)return;
  answered=true;
  clearInterval(timerInterval);

  var btns=Array.from(qOptions.querySelectorAll('.option-btn'));
  btns.forEach(function(b){b.disabled=true;});

  if(answerId!==null&&typeof window.apiSubmitAnswer==='function'){
    window.apiSubmitAnswer(q.id,answerId)
    .then(function(res){
      if(res.correct)jump();
      showResult(res.correct,res.points,q,answerId,res.correctAnswer);
    })
    .catch(function(){showResult(false,0,q,answerId,null);});
  }else{
    showResult(false,0,q,answerId,null);
  }
}

function showResult(isCorrect,earnedPoints,q,answerId,correctAnswerId){
  var btns=Array.from(qOptions.querySelectorAll('.option-btn'));
  btns.forEach(function(b){
    var text=b.querySelector('span:last-child').textContent;
    var matching=q.options.find(function(o){return o.content===text;});
    if(!matching)return;
    if(matching.id===correctAnswerId)b.classList.add('correct');
    if(matching.id===answerId&&!isCorrect)b.classList.add('wrong');
    if(matching.id!==correctAnswerId&&matching.id!==answerId)b.classList.add('dimmed');
  });

  if(isCorrect){
    var timeBonus=Math.round((timeLeft/(q.timeLimit||15))*40);
    score+=earnedPoints+timeBonus;
    correctCount++;
    scoreDisplay.textContent=score;
    feedback.textContent='Bật nhảy qua chướng ngại vật! 🥷';
    feedback.className='feedback correct';
  }else if(answerId===null){
    feedback.textContent='Hết giờ, va phải chướng ngại vật! ⏰';
    feedback.className='feedback timeout';
  }else{
    feedback.textContent='Va phải chướng ngại vật rồi!';
    feedback.className='feedback wrong';
  }

  if(q.explanation){
    explanationArea.innerHTML='<div class="explanation">💡 <b>Giải thích:</b> '+q.explanation+'</div>';
  }

  setTimeout(function(){
    currentIdx++;
    renderQuestion();
  },1800);
}

function endGame(){
  clearInterval(timerInterval);
  var timeUsed=Math.round((Date.now()-startTime)/1000);
  finalScore.textContent=score+' điểm';
  finalTime.textContent='Thời gian: '+timeUsed+' giây | Đúng: '+correctCount+'/'+questions.length;
  overlay.classList.add('active');
  setTimeout(function(){parent.postMessage({type:'game-over',data:{score:score,correct:correctCount,totalQuestions:questions.length,timeUsed:timeUsed}},'*');},1300);
}

document.getElementById('btnQuit').onclick=function(){parent.postMessage({type:'quit'},'*');};
document.getElementById('btnBack').onclick=function(){parent.postMessage({type:'quit'},'*');};

window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  if(e.data.type==='init'){
    var d=e.data.data;
    questions=d.questions||[];
    startTime=Date.now();
    score=0;correctCount=0;currentIdx=0;
    scoreDisplay.textContent='0';
    overlay.classList.remove('active');
    renderQuestion();
  }
});

parent.postMessage({type:'ready'},'*');
})();
</script>
</body>
</html>
