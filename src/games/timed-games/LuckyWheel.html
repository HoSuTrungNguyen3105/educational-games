<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vòng Quay May Mắn</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF7EE;--ink:#20283A;--teal:#1B998B;--ticket:#E4572E;--gold:#F4B942;--pink:#FF6F91}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:radial-gradient(120% 140% at 50% 0%,#2A1F52 0%,#17102F 55%,#120C24 100%);color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;height:50px}
.header .icon{font-size:26px}
.header .title{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--gold)}
.header .stats{display:flex;align-items:center;gap:14px;margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,.6)}
.header .stat{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);padding:3px 10px;border-radius:16px}
.btn-quit{font-family:'Poppins',sans-serif;font-size:12px;border:1px solid rgba(244,185,66,.4);border-radius:14px;padding:5px 16px;background:transparent;cursor:pointer;transition:all .15s;color:var(--gold)}
.btn-quit:hover{background:rgba(244,185,66,.15)}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px}
.wheel-container{position:relative;width:320px;height:346px}
.glow-ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 10px rgba(244,185,66,.1),0 0 60px rgba(244,185,66,.25)}
.pointer{position:absolute;left:50%;transform:translateX(-50%);top:-4px;z-index:20}
.bulb{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);transition:opacity .3s}
.wheel-svg{position:absolute;left:0;top:26px;transition:none}
.wheel-svg.spinning{transition:transform 4.2s cubic-bezier(0.12,0.67,0.1,1)}
.center-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:#1D2E4A;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:13px;color:var(--gold);z-index:10;pointer-events:none}
.spin-btn{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;padding:14px 40px;border:none;border-radius:30px;background:linear-gradient(180deg,var(--gold),var(--ticket));color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35);cursor:pointer;transition:all .15s;margin-top:8px}
.spin-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.spin-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.spin-label{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,.5);margin-top:10px}
.question-panel{width:100%;max-width:480px;animation:popIn .4s ease}
.question-card{background:rgba(255,255,255,.95);border-radius:16px;padding:24px;color:var(--ink);box-shadow:0 4px 20px rgba(0,0,0,.3);position:relative;overflow:hidden}
.question-card .bg-emoji{position:absolute;right:-16px;top:-16px;font-size:64px;opacity:.1;transform:rotate(12deg);pointer-events:none;user-select:none}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(244,185,66,.2);color:#8a6a10;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;padding:4px 12px;border-radius:20px}
.q-timer{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600}
.q-content{font-family:'Poppins',sans-serif;font-size:18px;line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.option-btn{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid rgba(0,0,0,.08);border-radius:14px;background:#fff;cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.option-btn:hover:not(:disabled){border-color:rgba(228,87,46,.3)}
.option-btn:disabled{cursor:default}
.option-btn .letter{width:30px;height:30px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;flex-shrink:0}
.option-btn.correct{border-color:var(--teal);background:rgba(27,153,139,.1)}
.option-btn.wrong{border-color:var(--ticket);background:rgba(228,87,46,.1)}
.option-btn.dimmed{opacity:.5}
.feedback{margin-top:16px;font-family:'Poppins',sans-serif;font-size:17px;text-align:center}
.feedback.correct{color:var(--teal)}
.feedback.wrong{color:var(--ticket)}
.feedback.timeout{color:#888}
.explanation{margin-top:12px;padding:10px 14px;background:#f0f9ff;border-left:3px solid var(--teal);border-radius:8px;font-size:13px;line-height:1.5;color:var(--ink)}
.overlay{display:none;position:fixed;inset:0;background:rgba(18,12,36,.9);z-index:100;justify-content:center;align-items:center}
.overlay.active{display:flex}
.overlay-card{background:#fff;border-radius:20px;padding:36px 44px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4);max-width:380px;width:90%;animation:popIn .4s ease}
.overlay-card h2{font-family:'Poppins',sans-serif;font-size:22px;margin-bottom:8px;color:var(--ink)}
.overlay-card .final-score{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;color:var(--gold);margin:12px 0}
.overlay-card .final-time{font-size:14px;color:#888;margin-bottom:20px}
.overlay-card .btn-back{padding:10px 28px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.name-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;flex:1;padding:20px}
.name-card{background:rgba(255,255,255,.95);border-radius:20px;padding:36px 40px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3);max-width:420px;width:90%;animation:popIn .4s ease}
.name-card .emoji{font-size:48px;margin-bottom:8px}
.name-card h2{font-family:'Poppins',sans-serif;font-size:22px;color:var(--ink);margin-bottom:4px}
.name-card .subtitle{font-size:13px;color:#888;margin-bottom:16px}
.name-card .hint{font-size:12px;color:var(--gold);margin-bottom:16px;font-weight:600}
.name-row{display:flex;gap:8px}
.name-input{flex:1;padding:10px 14px;border:2px solid rgba(0,0,0,.1);border-radius:10px;font-family:'Nunito',sans-serif;font-size:15px;outline:none;transition:border-color .2s;color:var(--ink)}
.name-input:focus{border-color:var(--gold)}
.name-input::placeholder{color:#bbb}
.add-btn{padding:10px 16px;border:none;border-radius:10px;background:var(--gold);color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;white-space:nowrap}
.add-btn:active{transform:scale(.95)}
.name-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:36px;margin-top:12px}
.name-tag{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold),#e6a800);color:var(--ink);padding:5px 12px;border-radius:20px;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;animation:popIn .25s ease}
.name-tag .remove{cursor:pointer;font-size:15px;opacity:.6;transition:opacity .15s;line-height:1}
.name-tag .remove:hover{opacity:1}
.name-counter{font-family:'JetBrains Mono',monospace;font-size:12px;color:#888;margin-top:8px}
.name-btn{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(180deg,var(--gold),var(--ticket));color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;cursor:pointer;transition:all .15s;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.name-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.name-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes bulbBlink{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:500px){.wheel-container{width:260px;height:286px}.q-content{font-size:15px}.option-btn{font-size:12px;padding:10px 12px}.header .title{font-size:13px}.header .stat{padding:2px 7px;font-size:11px}.name-card{padding:28px 24px}}
</style>
</head>
<body>
<div id="api_submit"></div>
<div class="header" id="header" style="display:none">
  <span class="icon">🎡</span>
  <span class="title">VÒNG QUAY MAY MẮN</span>
  <div class="stats">
    <div class="stat"><span>Đã quay:</span><b id="progressLabel">0/0</b></div>
    <div class="stat">⭐ <b id="scoreDisplay">0</b></div>
    <button class="btn-quit" id="btnQuit">Thoát</button>
  </div>
</div>
<div class="main" id="mainArea">
  <div id="nameScreen" class="name-screen">
    <div class="name-card">
      <div class="emoji">🎡</div>
      <h2>VÒNG QUAY MAY MẮN</h2>
      <div class="subtitle">Nhập tên học sinh — mỗi tên = 1 câu hỏi trên vòng quay</div>
      <div class="name-row">
        <input type="text" class="name-input" id="nameInput" placeholder="Nhập tên học sinh..." maxlength="30">
        <button class="add-btn" id="addBtn">Thêm</button>
      </div>
      <div class="name-tags" id="nameTags"></div>
      <div class="name-counter" id="nameCounter">0 học sinh · 0 câu hỏi</div>
      <button class="name-btn" id="nameBtn" disabled>BẮT ĐẦU CHƠI 🎯</button>
    </div>
  </div>
  <div id="wheelPhase" style="display:none">
    <div class="wheel-container" id="wheelContainer">
      <div class="glow-ring"></div>
      <svg class="pointer" width="36" height="40" viewBox="0 0 36 40"><polygon points="18,36 4,6 32,6" fill="#E4572E" stroke="#FFFBF2" stroke-width="3" stroke-linejoin="round"/><circle cx="18" cy="6" r="6" fill="#FFFBF2" stroke="#E4572E" stroke-width="2"/></svg>
      <svg class="wheel-svg" id="wheelSvg" width="320" height="320" viewBox="0 0 320 320"></svg>
      <div class="center-circle">QUAY</div>
    </div>
    <div style="text-align:center">
      <button class="spin-btn" id="spinBtn">QUAY NGAY! 🎯</button>
      <div class="spin-label" id="spinLabel">Đã trả lời 0 câu · ⭐ 0 điểm</div>
    </div>
  </div>
  <div id="questionPhase" class="question-panel" style="display:none">
    <div class="question-card">
      <div class="bg-emoji">🎡</div>
      <div class="q-header">
        <span class="q-badge">🎟️ <span id="qPlayerName"></span></span>
        <span class="q-timer" id="qTimer">⏱ 0s</span>
      </div>
      <div class="q-content" id="qContent"></div>
      <div class="options" id="qOptions"></div>
      <div class="feedback" id="feedback"></div>
      <div id="explanationArea"></div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2>🎉 Hoàn thành!</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-time" id="finalTime">Thời gian: 0s</div>
    <button class="btn-back" id="btnBack">Quay lại</button>
  </div>
</div>
<script>
(function(){
var COLORS=["#E4572E","#F4B942","#1B998B","#FF6F91","#4C8DFF","#8B6FF1","#4CAF7D","#FF9F5A","#31B0C9","#D96CD9"];
var questions=[],answeredIds=[],score=0,correctCount=0,startTime=0,playerName='';
var spinning=false,gamePhase="wheel",currentQ=null,timeLeft=0,timerInterval=null,selectedAnswer=null,revealed=false;
var rotation=0,segmentCount=0,segmentAngle=0;
var wheelSvg=document.getElementById('wheelSvg'),spinBtn=document.getElementById('spinBtn');
var spinLabel=document.getElementById('spinLabel'),progressLabel=document.getElementById('progressLabel');
var scoreDisplay=document.getElementById('scoreDisplay');
var wheelPhase=document.getElementById('wheelPhase'),questionPhase=document.getElementById('questionPhase');
var nameScreen=document.getElementById('nameScreen'),header=document.getElementById('header');
var qPlayerName=document.getElementById('qPlayerName'),qTimer=document.getElementById('qTimer');
var qContent=document.getElementById('qContent'),qOptions=document.getElementById('qOptions');
var feedback=document.getElementById('feedback'),explanationArea=document.getElementById('explanationArea');
var overlay=document.getElementById('overlay'),finalScore=document.getElementById('finalScore'),finalTime=document.getElementById('finalTime');
var nameInput=document.getElementById('nameInput'),nameBtn=document.getElementById('nameBtn');
var addBtn=document.getElementById('addBtn'),nameTags=document.getElementById('nameTags');
var nameCounter=document.getElementById('nameCounter');
var playerNames=[];

function renderTags(){
  nameTags.innerHTML='';
  playerNames.forEach(function(n,i){
    var tag=document.createElement('span');
    tag.className='name-tag';
    tag.innerHTML=n+'<span class="remove" data-i="'+i+'">&times;</span>';
    nameTags.appendChild(tag);
  });
  nameTags.querySelectorAll('.remove').forEach(function(btn){
    btn.onclick=function(){
      playerNames.splice(parseInt(this.getAttribute('data-i')),1);
      renderTags();
    };
  });
  nameCounter.textContent=playerNames.length+' học sinh · '+playerNames.length+' câu hỏi';
  nameBtn.disabled=playerNames.length===0;
}

function addName(){
  var name=nameInput.value.trim();
  if(!name)return;
  if(playerNames.indexOf(name)>=0){nameInput.value='';nameInput.focus();return;}
  playerNames.push(name);
  nameInput.value='';
  nameInput.focus();
  renderTags();
}

addBtn.onclick=addName;
nameInput.onkeydown=function(e){if(e.key==='Enter')addName();};

function startGame(){
  if(playerNames.length===0)return;
  nameScreen.style.display='none';
  header.style.display='flex';
  wheelPhase.style.display='block';
  if(questions.length>0)renderWheel();
  parent.postMessage({type:'player-name',data:{names:playerNames}},'*');
}

nameBtn.onclick=startGame;

function polar(angleDeg,r){
  var rad=((angleDeg-90)*Math.PI)/180;
  return{x:160+r*Math.cos(rad),y:160+r*Math.sin(rad)};
}

function renderWheel(){
  segmentCount=questions.length;
  segmentAngle=360/segmentCount;
  var radius=152;
  wheelSvg.innerHTML='';

  var circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx','160');circle.setAttribute('cy','160');circle.setAttribute('r',radius+6);
  circle.setAttribute('fill','#FFFBF2');circle.setAttribute('stroke','#1D2E4A');circle.setAttribute('stroke-width','3');
  wheelSvg.appendChild(circle);

  questions.forEach(function(q,i){
    var startAngle=i*segmentAngle;
    var endAngle=(i+1)*segmentAngle;
    var p1=polar(startAngle,radius);
    var p2=polar(endAngle,radius);
    var largeArc=endAngle-startAngle<=180?'0':'1';
    var labelPos=polar(startAngle+segmentAngle/2,radius*0.66);
    var color=COLORS[i%COLORS.length];
    var isDone=answeredIds.indexOf(q.id)>=0;

    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M 160 160 L '+p1.x+' '+p1.y+' A '+radius+' '+radius+' 0 '+largeArc+' 1 '+p2.x+' '+p2.y+' Z');
    path.setAttribute('fill',color);path.setAttribute('stroke','#FFFBF2');path.setAttribute('stroke-width','3');
    if(isDone)path.setAttribute('opacity','0.28');
    wheelSvg.appendChild(path);

    var text=document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x',labelPos.x);text.setAttribute('y',labelPos.y);
    text.setAttribute('fill','#fff');text.setAttribute('font-size','20');text.setAttribute('font-weight','700');
    text.setAttribute('font-family','Fredoka, sans-serif');text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');
    text.setAttribute('transform','rotate('+(startAngle+segmentAngle/2)+','+labelPos.x+','+labelPos.y+')');
    if(isDone){text.setAttribute('opacity','0.5');text.textContent='✓';}
    else{text.textContent=q._playerName||'';}
    wheelSvg.appendChild(text);
  });

  var centerC=document.createElementNS('http://www.w3.org/2000/svg','circle');
  centerC.setAttribute('cx','160');centerC.setAttribute('cy','160');centerC.setAttribute('r',radius*0.22);
  centerC.setAttribute('fill','#1D2E4A');centerC.setAttribute('stroke','#F4B942');centerC.setAttribute('stroke-width','4');
  wheelSvg.appendChild(centerC);
  var centerT=document.createElementNS('http://www.w3.org/2000/svg','text');
  centerT.setAttribute('x','160');centerT.setAttribute('y','161');centerT.setAttribute('fill','#F4B942');
  centerT.setAttribute('font-size','15');centerT.setAttribute('font-weight','700');centerT.setAttribute('font-family','Fredoka, sans-serif');
  centerT.setAttribute('text-anchor','middle');centerT.setAttribute('dominant-baseline','middle');centerT.textContent='QUAY';
  wheelSvg.appendChild(centerT);

  renderBulbs();
}

function renderBulbs(){
  var existing=document.querySelectorAll('.bulb');
  existing.forEach(function(b){b.remove();});
  var container=document.getElementById('wheelContainer');
  for(var i=0;i<24;i++){
    var angle=(i*360)/24;
    var rad=((angle-90)*Math.PI)/180;
    var r=160+14;
    var x=160+r*Math.cos(rad)-3.5;
    var y=160+r*Math.sin(rad)-3.5;
    var bulb=document.createElement('div');
    bulb.className='bulb';
    bulb.style.left=x+'px';bulb.style.top=y+'px';
    if(spinning){bulb.style.animation='bulbBlink .5s infinite '+(i%2===0?'0s':'.25s');}
    container.appendChild(bulb);
  }
}

function spinWheel(){
  if(spinning||answeredIds.length>=segmentCount)return;
  spinning=true;
  spinBtn.disabled=true;
  spinBtn.textContent='ĐANG QUAY... 🎡';

  var available=questions.map(function(_,i){return i;}).filter(function(i){return answeredIds.indexOf(questions[i].id)<0;});
  var winIdx=available[Math.floor(Math.random()*available.length)];
  var winCenter=winIdx*segmentAngle+segmentAngle/2;
  var targetMod=(360-winCenter+360)%360;
  var currentMod=((rotation%360)+360)%360;
  var delta=targetMod-currentMod;
  if(delta<=0)delta+=360;
  var extraSpins=5+Math.floor(Math.random()*2);
  rotation+=extraSpins*360+delta;

  wheelSvg.classList.add('spinning');
  wheelSvg.style.transform='rotate('+rotation+'deg)';
  renderBulbs();

  setTimeout(function(){
    spinning=false;
    wheelSvg.classList.remove('spinning');
    currentQ=questions[winIdx];
    gamePhase='question';
    wheelPhase.style.display='none';
    questionPhase.style.display='block';
    renderQuestion();
  },4200);
}

function renderQuestion(){
  if(!currentQ)return;
  selectedAnswer=null;revealed=false;
  qPlayerName.textContent=currentQ._playerName||'Bạn';
  qContent.textContent=currentQ.content;
  feedback.textContent='';feedback.className='feedback';
  explanationArea.innerHTML='';

  var LETTERS=['A','B','C','D'];
  qOptions.innerHTML='';
  currentQ.options.forEach(function(o,i){
    var btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML='<span class="letter">'+LETTERS[i]+'</span><span>'+o.content+'</span>';
    btn.onclick=function(){selectAnswer(o.id);};
    qOptions.appendChild(btn);
  });

  timeLeft=currentQ.timeLimit||15;
  updateQTimer();
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timeLeft--;
    updateQTimer();
    if(timeLeft<=0){clearInterval(timerInterval);if(!revealed)selectAnswer(null);}
  },1000);
}

function updateQTimer(){
  var tl=currentQ?currentQ.timeLimit:15;
  var pct=Math.max((timeLeft/tl)*100,0);
  qTimer.textContent='⏱ '+timeLeft+'s';
  if(pct>50)qTimer.style.color='var(--teal)';
  else if(pct>20)qTimer.style.color='var(--gold)';
  else qTimer.style.color='var(--ticket)';
}

function selectAnswer(answerId){
  if(revealed)return;
  selectedAnswer=answerId;revealed=true;
  clearInterval(timerInterval);

  var btns=Array.from(qOptions.querySelectorAll('.option-btn'));
  btns.forEach(function(b){b.disabled=true;});

  if(answerId!==null&&typeof window.apiSubmitAnswer==='function'){
    window.apiSubmitAnswer(currentQ.id,answerId)
    .then(function(res){showResult(res.correct,res.points,res.correctAnswer);})
    .catch(function(){showResult(false,0,null);});
  }else{
    showResult(false,0,null);
  }
}

function showResult(isCorrect,earnedPoints,correctAnswerId){
  var btns=Array.from(qOptions.querySelectorAll('.option-btn'));
  btns.forEach(function(b){
    var text=b.querySelector('span:last-child').textContent;
    var matching=currentQ.options.find(function(o){return o.content===text;});
    if(!matching)return;
    if(matching.id===correctAnswerId)b.classList.add('correct');
    if(matching.id===selectedAnswer&&!isCorrect)b.classList.add('wrong');
    if(matching.id!==correctAnswerId&&matching.id!==selectedAnswer)b.classList.add('dimmed');
  });

  var timeBonus=0;
  if(isCorrect){
    timeBonus=Math.round((timeLeft/(currentQ.timeLimit||15))*40);
    score+=earnedPoints+timeBonus;
    correctCount++;
    scoreDisplay.textContent=score;
    feedback.textContent='Chính xác! +'+(earnedPoints+timeBonus)+' điểm 🎉';
    feedback.className='feedback correct';
  }else if(selectedAnswer===null){
    feedback.textContent='Hết giờ rồi! ⏰';
    feedback.className='feedback timeout';
  }else{
    feedback.textContent='Chưa đúng, quay tiếp nhé!';
    feedback.className='feedback wrong';
  }

  if(currentQ.explanation){
    explanationArea.innerHTML='<div class="explanation">💡 <b>Giải thích:</b> '+currentQ.explanation+'</div>';
  }

  answeredIds.push(currentQ.id);
  progressLabel.textContent=answeredIds.length+'/'+segmentCount;
  spinLabel.textContent='Đã trả lời '+answeredIds.length+' câu · ⭐ '+score+' điểm';

  setTimeout(function(){
    gamePhase='wheel';
    questionPhase.style.display='none';
    wheelPhase.style.display='block';
    renderWheel();
    if(answeredIds.length>=segmentCount){endGame();}
    else{spinBtn.disabled=false;spinBtn.textContent='QUAY NGAY! 🎯';}
  },1900);
}

function endGame(){
  clearInterval(timerInterval);
  var timeUsed=Math.round((Date.now()-startTime)/1000);
  finalScore.textContent=score+' điểm';
  finalTime.textContent='Thời gian: '+timeUsed+' giây | Đúng: '+correctCount+'/'+questions.length;
  overlay.classList.add('active');
  setTimeout(function(){parent.postMessage({type:'game-over',data:{score:score,correct:correctCount,totalQuestions:questions.length,timeUsed:timeUsed}},'*');},1300);
}

spinBtn.onclick=spinWheel;
document.getElementById('btnQuit').onclick=function(){parent.postMessage({type:'quit'},'*');};
document.getElementById('btnBack').onclick=function(){parent.postMessage({type:'quit'},'*');};

window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  if(e.data.type==='init'){
    var d=e.data.data;
    var mode=d.playMode||'solo';
    var qSource=d.questions||[];

    if(mode==='solo'){
      var pName=d.playerName||'Bạn';
      playerNames=[pName];
      for(var i=0;i<qSource.length;i++){
        if(!playerNames[i])playerNames.push(pName);
      }
      playerNames=playerNames.slice(0,qSource.length);
      renderTags();
      nameScreen.style.display='none';
      header.style.display='flex';
      wheelPhase.style.display='block';
    }else{
      if(playerNames.length===0&&qSource.length>0){
        for(var i=0;i<qSource.length;i++)playerNames.push('Học sinh '+(i+1));
        renderTags();
      }
    }

    var count=Math.max(playerNames.length,qSource.length);
    questions=[];
    for(var i=0;i<count;i++){
      var q=qSource[i%qSource.length];
      var name=playerNames[i%playerNames.length];
      var parts=name.trim().split(/\s+/);
      var shortName=parts.length>1?parts[parts.length-1]:name;
      questions.push(Object.assign({},q,{_playerName:shortName,_fullName:name}));
    }
    segmentCount=questions.length;
    segmentAngle=360/segmentCount;
    answeredIds=[];score=0;correctCount=0;startTime=Date.now();
    rotation=0;spinning=false;gamePhase='wheel';
    scoreDisplay.textContent='0';
    progressLabel.textContent='0/'+segmentCount;
    spinLabel.textContent='Đã trả lời 0 câu · ⭐ 0 điểm';
    overlay.classList.remove('active');
    wheelSvg.style.transform='rotate(0deg)';
    spinBtn.disabled=false;spinBtn.textContent='QUAY NGAY! 🎯';
    renderWheel();
  }
});

parent.postMessage({type:'ready'},'*');
})();
</script>
</body>
</html>
