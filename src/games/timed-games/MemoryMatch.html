<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lật Thẻ Trí Nhớ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FBF7EE;
            --ink: #20283A;
            --teal: #1B998B;
            --ticket: #E4572E;
            --gold: #F4B942;
            --pink: #FF6F91;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: var(--paper);
            color: var(--ink);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            background: #fff;
            border-bottom: 1px solid rgba(0, 0, 0, .08);
            flex-shrink: 0;
            height: 50px;
        }
        .header .icon {
            font-size: 26px;
        }
        .header .title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--pink);
        }
        .header .stats {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: rgba(0, 0, 0, .55);
        }
        .header .timer {
            color: var(--teal);
            font-weight: 600;
        }
        .btn-quit {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            border: 1px solid rgba(0, 0, 0, .15);
            border-radius: 14px;
            padding: 5px 16px;
            background: transparent;
            cursor: pointer;
            transition: all .15s;
            color: var(--ink);
        }
        .btn-quit:hover {
            background: rgba(0, 0, 0, .05);
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 16px;
        }
        .question-card {
            background: #fff;
            border-radius: 16px;
            padding: 14px 18px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
            border: 1px solid rgba(0, 0, 0, .06);
            flex-shrink: 0;
        }
        .question-card .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            color: #8A7C63;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .question-card h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 17px;
            line-height: 1.4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 520px;
            width: 100%;
            perspective: 800px;
            flex-shrink: 0;
        }
        .card-btn {
            position: relative;
            height: 100px;
            cursor: pointer;
            transition: transform 0.5s ease, opacity 0.3s, left 0.6s ease, top 0.6s ease;
            transform-style: preserve-3d;
            border: none;
            background: transparent;
            padding: 0;
        }
        .card-btn.shuffling {
            transition: left 0.6s ease, top 0.6s ease, transform 0.5s ease;
        }
        .card-btn:disabled {
            cursor: default;
        }
        .card-btn.flipped {
            transform: rotateY(180deg);
        }
        .card-btn.found {
            transform: rotateY(180deg);
            cursor: default;
            opacity: 0.85;
        }
        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            border: 2px solid rgba(0, 0, 0, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            transition: border-color 0.3s, background 0.3s;
            padding: 6px;
            background: #fff;
        }
        .card-front {
            background: linear-gradient(135deg, rgba(255, 111, 145, .15), rgba(244, 185, 66, .15));
            border-color: rgba(0, 0, 0, .12);
        }
        .card-front .question-mark {
            font-size: 36px;
            opacity: .5;
        }
        .card-back {
            background: #fff;
            transform: rotateY(180deg);
            flex-direction: column;
            gap: 4px;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            line-height: 1.3;
            color: var(--ink);
            font-weight: 600;
            word-break: break-word;
            padding: 6px;
            justify-content: center;
        }
        .card-btn.correct .card-back {
            border-color: var(--teal);
            background: rgba(27, 153, 139, .12);
        }
        .card-btn.wrong .card-back {
            border-color: var(--ticket);
            background: rgba(228, 87, 46, .12);
        }
        .card-btn.dimmed .card-back {
            opacity: .4;
        }
        .card-btn.show-initial .card-back {
            border-color: var(--gold);
        }
        .feedback {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            text-align: center;
            min-height: 30px;
        }
        .feedback.correct {
            color: var(--teal);
        }
        .feedback.wrong {
            color: var(--ticket);
        }
        .feedback.timeout {
            color: #888;
        }
        .explanation {
            margin-top: 8px;
            padding: 10px 14px;
            background: #f0f9ff;
            border-left: 3px solid var(--teal);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 520px;
            width: 100%;
            text-align: left;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(32, 40, 58, .85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .overlay.active {
            display: flex;
        }
        .overlay-card {
            background: #fff;
            border-radius: 20px;
            padding: 36px 44px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, .3);
            max-width: 380px;
            width: 90%;
            animation: popIn .4s ease;
        }
        .overlay-card h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .overlay-card .final-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 40px;
            font-weight: 700;
            color: var(--gold);
            margin: 12px 0;
        }
        .overlay-card .final-time {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }
        .overlay-card .btn-back {
            padding: 10px 28px;
            background: var(--teal);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 540px) {
            .grid {
                gap: 8px;
                max-width: 340px;
            }
            .card-btn {
                height: 80px;
            }
            .card-back {
                font-size: 12px;
            }
            .header .title {
                font-size: 13px;
            }
            .question-card h2 {
                font-size: 15px;
            }
        }
        @media (max-width: 400px) {
            .grid {
                gap: 6px;
                max-width: 280px;
            }
            .card-btn {
                height: 70px;
            }
            .card-back {
                font-size: 10px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>
    <div id="api_submit"></div>
    <div class="header">
        <span class="icon">🃏</span>
        <span class="title">LẬT THẺ TRÍ NHỚ</span>
        <div class="stats">
            <span id="questionCounter">Câu 0/0</span>
            <span class="timer" id="timerDisplay">⏱ 15s</span>
            <span>⭐ <b id="scoreDisplay">0</b></span>
            <button class="btn-quit" id="btnQuit">Thoát</button>
        </div>
    </div>
    <div class="main">
        <div class="question-card">
            <div class="label">Tìm đáp án đúng duy nhất</div>
            <h2 id="questionText">Đang tải...</h2>
        </div>
        <div class="grid" id="grid"></div>
        <div class="feedback" id="feedback"></div>
        <div id="explanationArea"></div>
    </div>
    <div class="overlay" id="overlay">
        <div class="overlay-card">
            <h2>🎉 Hoàn thành!</h2>
            <div class="final-score" id="finalScore">0</div>
            <div class="final-time" id="finalTime">Thời gian: 0s</div>
            <button class="btn-back" id="btnBack">Quay lại</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── STATE ──────────────────────────────────────────────
            var questions = [];
            var currentIdx = 0;
            var score = 0;
            var correctCount = 0;
            var startTime = 0;
            var timeLeft = 15;
            var timerInterval = null;
            var answered = false; // true when correct found or timeout

            // For current question
            var cardData = []; // array of { id, content, correct }
            var canClick = false;

            // DOM refs
            var grid = document.getElementById('grid');
            var questionText = document.getElementById('questionText');
            var questionCounter = document.getElementById('questionCounter');
            var timerDisplay = document.getElementById('timerDisplay');
            var scoreDisplay = document.getElementById('scoreDisplay');
            var feedback = document.getElementById('feedback');
            var explanationArea = document.getElementById('explanationArea');
            var overlay = document.getElementById('overlay');
            var finalScore = document.getElementById('finalScore');
            var finalTime = document.getElementById('finalTime');

            // ─── HELPERS ────────────────────────────────────────────
            function shuffleArray(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
                return arr;
            }

            // ─── RENDER QUESTION ──────────────────────────────────
            function renderQuestion() {
                if (currentIdx >= questions.length) {
                    endGame();
                    return;
                }

                var q = questions[currentIdx];
                questionText.textContent = q.content;
                questionCounter.textContent = 'Câu ' + (currentIdx + 1) + '/' + questions.length;
                scoreDisplay.textContent = score;
                feedback.textContent = '';
                feedback.className = 'feedback';
                explanationArea.innerHTML = '';
                answered = false;
                canClick = false;

                // ── Build cardData: 1 correct, 3 wrong (from options) ──
                var correctOpt = q.options.find(function(opt) { return opt.id === q.correctAnswerId; });
                var correctContent = correctOpt ? correctOpt.content : '?';

                var wrongOptions = q.options.filter(function(opt) { return opt.id !== q.correctAnswerId; });
                shuffleArray(wrongOptions);
                var selectedWrong = wrongOptions.slice(0, 3);
                while (selectedWrong.length < 3) {
                    selectedWrong.push({ id: null, content: 'Sai' });
                }

                cardData = [];
                cardData.push({ id: q.correctAnswerId, content: correctContent, correct: true });
                selectedWrong.forEach(function(w) {
                    cardData.push({ id: w.id, content: w.content, correct: false });
                });
                shuffleArray(cardData);

                // ── Phase 1: Show only 4 answer cards face-up ──
                grid.innerHTML = '';
                grid.style.position = 'relative';
                cardData.forEach(function(item) {
                    var card = document.createElement('button');
                    card.className = 'card-btn flipped show-initial';
                    card.dataset.id = item.id !== null ? item.id : '';
                    card.dataset.correct = item.correct ? 'true' : 'false';
                    card.innerHTML =
                        '<div class="card-face card-front"><span class="question-mark">❓</span></div>' +
                        '<div class="card-face card-back"><span>' + item.content + '</span></div>';
                    card.onclick = function() { handleCardClick(this); };
                    grid.appendChild(card);
                });

                feedback.textContent = 'Memorize the answers!';
                feedback.className = 'feedback';

                // ── Phase 2: After 3s, add empty cards and shuffle with animation ──
                setTimeout(function() {
                    var answerCards = Array.from(grid.children);

                    // Add 8 empty cards
                    for (var i = 0; i < 8; i++) {
                        var emptyCard = document.createElement('button');
                        emptyCard.className = 'card-btn';
                        emptyCard.dataset.id = '';
                        emptyCard.dataset.correct = 'false';
                        emptyCard.innerHTML =
                            '<div class="card-face card-front"><span class="question-mark">❓</span></div>' +
                            '<div class="card-face card-back"><span>\u00A0</span></div>';
                        emptyCard.onclick = function() { handleCardClick(this); };
                        grid.appendChild(emptyCard);
                    }

                    // Flip answer cards down
                    answerCards.forEach(function(c) { c.classList.remove('flipped', 'show-initial'); });

                    // Capture current positions
                    var allCards = Array.from(grid.children);
                    var startPositions = allCards.map(function(c) {
                        var r = c.getBoundingClientRect();
                        return { left: r.left, top: r.top };
                    });

                    // Shuffle DOM order
                    shuffleArray(allCards);
                    allCards.forEach(function(c) { grid.appendChild(c); });

                    // Capture new positions and animate from old to new
                    allCards.forEach(function(c, i) {
                        var oldPos = startPositions[i];
                        var newRect = c.getBoundingClientRect();
                        var dx = oldPos.left - newRect.left;
                        var dy = oldPos.top - newRect.top;
                        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                            c.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
                            c.classList.add('shuffling');
                            // Force reflow
                            c.offsetHeight;
                            c.style.transform = '';
                            // Clean up after animation
                            (function(card) {
                                setTimeout(function() {
                                    card.classList.remove('shuffling');
                                    card.style.transform = '';
                                }, 650);
                            })(c);
                        }
                    });

                    canClick = true;
                    feedback.textContent = 'Chọn đáp án đúng!';
                    feedback.className = 'feedback';

                    // Start timer after shuffle
                    timeLeft = q.timeLimit || 15;
                    updateTimer();
                    startTimer(q);
                }, 3000);
            }

            // ─── TIMER ─────────────────────────────────────────────
            function startTimer(q) {
                clearInterval(timerInterval);
                timerInterval = setInterval(function() {
                    timeLeft--;
                    updateTimer();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                    if (!answered) {
                        // Timeout: reveal all answers
                        answered = true;
                        canClick = false;
                        feedback.textContent = '⏰ Hết giờ! Đáp án đúng là: ' + getCorrectContent();
                        feedback.className = 'feedback timeout';
                        var cards = grid.querySelectorAll('.card-btn');
                        cards.forEach(function(c) {
                            c.classList.add('flipped');
                            c.disabled = true;
                            if (c.dataset.correct === 'true') {
                                c.classList.add('correct');
                            } else {
                                c.classList.add('dimmed');
                            }
                        });
                        setTimeout(function() {
                            currentIdx++;
                            renderQuestion();
                        }, 2500);
                    }
                    }
                }, 1000);
            }

            function updateTimer() {
                timerDisplay.textContent = '⏱ ' + timeLeft + 's';
                var pct = (timeLeft / (questions[currentIdx] ? questions[currentIdx].timeLimit || 15 : 15)) * 100;
                if (pct > 50) timerDisplay.style.color = 'var(--teal)';
                else if (pct > 20) timerDisplay.style.color = 'var(--gold)';
                else timerDisplay.style.color = 'var(--ticket)';
            }

            function getCorrectContent() {
                var q = questions[currentIdx];
                var opt = q.options.find(function(o) { return o.id === q.correctAnswerId; });
                return opt ? opt.content : '?';
            }

            // ─── CARD CLICK HANDLER ──────────────────────────────
            function handleCardClick(card) {
                if (!canClick || answered) return;
                if (card.classList.contains('found')) return;
                if (card.classList.contains('flipped')) return;

                // Flip the card up — stays flipped always
                card.classList.add('flipped');

                var isCorrect = card.dataset.correct === 'true';
                if (isCorrect) {
                    answered = true;
                    canClick = false;
                    clearInterval(timerInterval);
                    card.classList.add('correct');
                    card.classList.add('found');
                    var bonus = 10;
                    score += bonus;
                    correctCount++;
                    scoreDisplay.textContent = score;
                    feedback.textContent = '🎉 Chính xác! +' + bonus + ' điểm';
                    feedback.className = 'feedback correct';
                    // Flip all other cards to reveal answers
                    var allCards = grid.querySelectorAll('.card-btn');
                    allCards.forEach(function(c) {
                        c.classList.add('flipped');
                        c.disabled = true;
                        if (c.dataset.correct === 'true' && c !== card) {
                            c.classList.add('correct');
                        } else if (c.dataset.correct === 'false' && c !== card) {
                            c.classList.add('dimmed');
                        }
                    });
                    // Show explanation
                    var q = questions[currentIdx];
                    if (q.explanation) {
                        explanationArea.innerHTML = '<div class="explanation">💡 <b>Giải thích:</b> ' + q.explanation + '</div>';
                    }
                    setTimeout(function() {
                        currentIdx++;
                        renderQuestion();
                    }, 2500);
                } else {
                    // Wrong — card stays flipped, show it's wrong
                    card.classList.add('wrong');
                    score = Math.max(0, score - 3);
                    scoreDisplay.textContent = score;
                    var content = card.querySelector('.card-back span').textContent.trim();
                    if (content === '\u00A0' || content === '') {
                        feedback.textContent = '❌ Ô trống! -3 điểm';
                    } else {
                        feedback.textContent = '❌ Sai! -3 điểm';
                    }
                    feedback.className = 'feedback wrong';
                    // Card stays flipped — no setTimeout to remove flipped
                }
            }

            // ─── END GAME ──────────────────────────────────────────
            function endGame() {
                clearInterval(timerInterval);
                var timeUsed = Math.round((Date.now() - startTime) / 1000);
                finalScore.textContent = score + ' điểm';
                finalTime.textContent = 'Thời gian: ' + timeUsed + ' giây | Đúng: ' + correctCount + '/' + questions
                    .length;
                overlay.classList.add('active');
                setTimeout(function() {
                    parent.postMessage({
                        type: 'game-over',
                        data: {
                            score: score,
                            correct: correctCount,
                            totalQuestions: questions.length,
                            timeUsed: timeUsed
                        }
                    }, '*');
                }, 1300);
            }

            // ─── EXIT ──────────────────────────────────────────────
            document.getElementById('btnQuit').onclick = function() {
                parent.postMessage({ type: 'quit' }, '*');
            };
            document.getElementById('btnBack').onclick = function() {
                parent.postMessage({ type: 'quit' }, '*');
            };

            // ─── PARENT MESSAGE ────────────────────────────────────
            window.addEventListener('message', function(e) {
                if (!e.data || !e.data.type) return;
                if (e.data.type === 'init') {
                    var d = e.data.data;
                    if (d && d.questions) {
                        questions = d.questions;
                        // Ensure each question has correctAnswerId and options
                        questions = questions.map(function(q) {
                            if (!q.correctAnswerId && q.correctIds && q.correctIds.length > 0) {
                                q.correctAnswerId = q.correctIds[0];
                            }
                            q.options = q.options || [];
                            return q;
                        });
                    } else {
                        console.error('No questions provided');
                    }

                    startTime = Date.now();
                    score = 0;
                    correctCount = 0;
                    currentIdx = 0;
                    scoreDisplay.textContent = '0';
                    overlay.classList.remove('active');
                    renderQuestion();
                }
            });

            parent.postMessage({ type: 'ready' }, '*');

        })();
    </script>
</body>
</html>
