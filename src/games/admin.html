<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị Game</title>
<style>
  :root{--bg:#0e1124;--bg2:#141836;--card:#1a1f45;--card2:#222859;--line:#303668;--tx:#e9ecff;--mut:#9aa3d6;--ac:#6c8cff;--ac2:#8f6bff;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--r:14px}
  [data-theme=light]{--bg:#f2f4ff;--bg2:#fff;--card:#fff;--card2:#eef0ff;--line:#d6daf5;--tx:#1b1f45;--mut:#5d6599;--ac:#4a68e8;--ac2:#7a55e8;--ok:#10a874;--wa:#c98a05;--er:#dc3f3f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--ac)}
  :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
  .hide{display:none!important}

  /* ===== khóa PIN ===== */
  #lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
    background:radial-gradient(ellipse at 30% 10%,#34308f 0,transparent 55%),var(--bg)}
  .lbox{width:min(100%,380px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .lbox .ic{font-size:44px}
  .lbox h1{font-size:22px;margin:6px 0 4px}
  .lbox p{color:var(--mut);font-size:13.5px;margin-bottom:14px}
  .lbox input{width:100%;text-align:center;letter-spacing:.5em;font-size:24px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);margin-bottom:10px}
  #lockErr{color:var(--er);min-height:20px;font-size:13.5px;margin-bottom:6px}

  /* ===== khung chính ===== */
  #app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
  #nav{background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
  .brand i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-style:normal;font-size:19px}
  .nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;text-align:left;color:var(--mut);font-weight:600;width:100%}
  .nb:hover{background:var(--card)}
  .nb.on{background:linear-gradient(135deg,rgba(108,140,255,.25),rgba(143,107,255,.25));color:var(--tx);box-shadow:inset 0 0 0 1px var(--ac)}
  .nb .n{margin-left:auto;font-size:11px;background:var(--er);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
  .grow{flex:1}
  .meter{margin:10px 6px 4px;font-size:12px;color:var(--mut)}
  .meter div{height:6px;border-radius:6px;background:var(--card2);margin-top:5px;overflow:hidden}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--wa));width:0}
  main{padding:20px clamp(14px,3vw,34px) 60px;min-width:0}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .head h2{font-size:24px}
  .head p{color:var(--mut);font-size:13.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat b{font-size:28px;line-height:1.1}
  .stat span{color:var(--mut);font-size:13px}
  .stat small{color:var(--ok);font-size:12px}
  .btn{border:1px solid var(--line);background:var(--card2);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--ac)}
  .btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
  .btn.d{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.5);color:var(--er)}
  .btn.s{padding:5px 10px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
  .tag.ok{color:var(--ok);border-color:var(--ok)}.tag.er{color:var(--er);border-color:var(--er)}.tag.wa{color:var(--wa);border-color:var(--wa)}
  .alert{padding:10px 14px;border-radius:12px;font-size:13.5px;border:1px solid;margin-bottom:12px}
  .alert.wa{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.5);color:var(--wa)}
  .alert.er{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.5);color:var(--er)}
  .alert.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.5);color:var(--ok)}
  .alert.in{background:rgba(108,140,255,.1);border-color:rgba(108,140,255,.5);color:var(--ac)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
  .bar .n{flex:0 0 130px;color:var(--mut)}.bar .tr{flex:1;height:14px;border-radius:14px;background:var(--card2);overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:14px}.bar .p{flex:0 0 76px;text-align:right}

  /* form */
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);font-weight:600}
  input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--tx);width:100%;min-width:0}
  textarea{resize:vertical;min-height:90px}
  textarea.code{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;min-height:360px;tab-size:2}
  input[type=color]{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);padding:2px}
  .fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx)}
  .chk input{width:18px;height:18px;accent-color:var(--ac)}
  .sw{position:relative;width:42px;height:24px;flex:none}
  .sw input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:2;width:100%;height:100%;margin:0}
  .sw i{position:absolute;inset:0;border-radius:24px;background:var(--card2);border:1px solid var(--line);transition:.2s}
  .sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.2s}
  .sw input:checked+i{background:var(--ok);border-color:var(--ok)}.sw input:checked+i::after{left:21px;background:#fff}

  /* danh sách game */
  .gl{display:flex;flex-direction:column;gap:10px}
  .gi{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .gi.off{opacity:.55}
  .gi .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
  .gi .mt{flex:1;min-width:0}
  .gi .mt b{display:block;font-size:15.5px}
  .gi .mt small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gi .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  /* ngân hàng câu hỏi */
  .qi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .qi.bad{border-color:var(--er)}
  .qi .qt{font-weight:600}
  .qi ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px;margin-top:2px}
  .qi li{font-size:13.5px;padding:3px 9px;border-radius:8px;background:var(--card2)}
  .qi li.ok{background:rgba(52,211,153,.18);color:var(--ok);font-weight:700}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chp{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600;color:var(--mut)}
  .chp.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .mx td.z{color:var(--er);font-weight:700}
  /* vth */
  .ev{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:10px;margin-bottom:10px}
  .ev .eh{display:grid;gap:8px;grid-template-columns:90px 1fr auto auto;align-items:end}
  .sp{display:grid;gap:6px;grid-template-columns:1.4fr 1fr .7fr .7fr .7fr auto;align-items:end;margin-top:8px}
  .sp label.f{font-size:11px}
  svg.tl{width:100%;height:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
  /* modal */
  #mod{position:fixed;inset:0;z-index:90;background:rgba(5,6,20,.7);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;backdrop-filter:blur(3px)}
  #mod.show{display:flex}
  .mbox{width:min(100%,640px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .mbox.w{width:min(100%,900px)}
  .mbox h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:120;background:var(--card2);border:1px solid var(--ac);padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:.25s;max-width:92vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.er{border-color:var(--er)}#toast.ok{border-color:var(--ok)}

  @media (max-width:860px){
    #app{grid-template-columns:1fr}
    #nav{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
    .brand,.meter,.grow{display:none}
    .nb{width:auto;white-space:nowrap;padding:8px 12px}
    .nb span.tx{font-size:13px}
    .sp{grid-template-columns:1fr 1fr 1fr}
    .ev .eh{grid-template-columns:80px 1fr}
    .bar .n{flex-basis:96px}
  }
</style>
</head>
<body>

<div id="lock" class="hide">
  <div class="lbox">
    <div class="ic">🔐</div><h1 id="lockT">Khu vực quản trị</h1>
    <p id="lockP">Nhập mã PIN để tiếp tục.</p>
    <input id="pin1" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••" aria-label="Mã PIN">
    <input id="pin2" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Nhập lại PIN" class="hide" aria-label="Nhập lại mã PIN" style="font-size:18px">
    <div id="lockErr" role="alert"></div>
    <button class="btn p" id="lockBtn" style="width:100%;justify-content:center;padding:11px">Mở khóa</button>
    <p style="margin:12px 0 0;font-size:12px">Mã PIN chỉ ngăn người dùng thường mở nhầm trang này trên thiết bị. Đây không phải bảo mật máy chủ.</p>
  </div>
</div>

<div id="app" class="hide">
  <nav id="nav" aria-label="Điều hướng quản trị"></nav>
  <main><div id="view"></div></main>
</div>
<div id="mod"><div class="mbox" id="mbox"></div></div>
<div id="toast" role="status"></div>

function allBackupKeys() { const set = new Set(trackedKeys().keys()); set.add('vuon-thu-ho-cfg-v1'); lsKeys().forEach(k => { if (!ADMIN_KEYS.includes(k)) set.add(k); }); return [...set].filter(k => lsGet(k) != null); }
function vBackup() {
  const keys = allBackupKeys(), tot = keys.reduce((a, k) => a + (k.length + lsGet(k).length) * 2, 0);
  return head('Sao lưu & khôi phục', 'Xuất toàn bộ dữ liệu game ra một tệp, hoặc nhập lại từ tệp (tương thích trang Trung Tâm Game).') + storeWarn() +
    `<div class="grid g2"><div class="card"><h3 style="margin-bottom:6px">⬇ Sao lưu</h3><p style="color:var(--mut);margin-bottom:12px">${keys.length} mục dữ liệu · ${fmtB(tot)}</p><div class="row"><button class="btn p" data-a="export">Tải file sao lưu</button><button class="btn" data-a="copy">📋 Sao chép JSON</button></div></div>
    <div class="card"><h3 style="margin-bottom:6px">⬆ Khôi phục</h3><p style="color:var(--mut);margin-bottom:12px">Chọn tệp sao lưu, xem trước rồi mới ghi vào trình duyệt.</p><div class="row"><button class="btn p" data-a="import">Chọn tệp sao lưu...</button></div></div></div>
    <div class="card" style="margin-top:14px;border-color:var(--er)"><h3 style="margin-bottom:6px;color:var(--er)">⚠ Vùng nguy hiểm</h3><p style="color:var(--mut);margin-bottom:12px">Xóa toàn bộ dữ liệu game trong trình duyệt này (không xóa mã PIN và nhật ký).</p><button class="btn d" data-a="wipe">Xóa toàn bộ dữ liệu game</button></div>`;
}
const buildBackup = () => { const data = {}; allBackupKeys().forEach(k => { data[k] = lsGet(k); }); return { app: 'trung-tam-game', v: 1, at: new Date().toISOString(), data }; };
function bindBackup() {
  $('view').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
    if (a === 'export') { download('tien-trinh-game-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(buildBackup(), null, 2)); log('Xuất sao lưu toàn bộ'); toast('Đã tạo file sao lưu', 'ok'); }
    else if (a === 'copy') copyText(JSON.stringify(buildBackup(), null, 2));
    else if (a === 'wipe') { if (!(await confirmBox('Xóa <b>toàn bộ</b> dữ liệu game? Hãy sao lưu trước. Không thể hoàn tác.', 'Xóa hết'))) return; allBackupKeys().forEach(lsDel); log('Xóa toàn bộ dữ liệu game'); loadAll(); render(); meter(); toast('Đã xóa', 'ok'); }
    else if (a === 'import') pickFile('.json,application/json', text => {
      let j; try { j = JSON.parse(text); } catch (x) { toast('File không phải JSON hợp lệ', 'er'); return; } if (!j || j.app !== 'trung-tam-game' || !j.data || typeof j.data !== 'object') { toast('Không đúng định dạng sao lưu của Trung Tâm Game', 'er'); return; }
      const ents = Object.entries(j.data).filter(([k, v]) => typeof v === 'string' && !ADMIN_KEYS.includes(k)), tk = trackedKeys();
      modal('Xem trước khi khôi phục', `<p style="margin-bottom:8px;color:var(--mut)">Tệp tạo lúc ${esc(j.at || '?')} · ${ents.length} mục</p><div class="tw" style="max-height:260px;overflow:auto"><table><thead><tr><th>Khóa</th><th>Kích thước</th><th>Hiện tại</th></tr></thead><tbody>${ents.map(([k, v]) => { let ok = true; try { JSON.parse(v); } catch (x) { ok = false; } return `<tr><td><code style="font-size:12px">${esc(k)}</code>${tk.has(k) ? '<br><small style="color:var(--mut)">' + esc(tk.get(k).game) + '</small>' : ''}${ok ? '' : ' <span class="tag er">JSON lỗi</span>'}</td><td>${fmtB((k.length + v.length) * 2)}</td><td>${lsGet(k) != null ? '<span class="tag wa">sẽ ghi đè</span>' : '<span class="tag ok">mới</span>'}</td></tr>`; }).join('')}</tbody></table></div>
        <div class="row" style="margin-top:12px"><label class="chk"><input type="radio" name="rs_m" value="merge" checked> Gộp (chỉ ghi các mục trong tệp)</label><label class="chk"><input type="radio" name="rs_m" value="replace"> Thay thế (xóa dữ liệu game không có trong tệp)</label></div>`,
        [{ label: 'Hủy' }, { label: 'Khôi phục', cls: 'p', fn: () => { const mode = document.querySelector('input[name=rs_m]:checked').value; if (mode === 'replace') { const inc = new Set(ents.map(x => x[0])); allBackupKeys().forEach(k => { if (!inc.has(k)) lsDel(k); }); } ents.forEach(([k, v]) => lsSet(k, v)); log('Khôi phục từ sao lưu', ents.length + ' mục (' + mode + ')'); loadAll(); render(); meter(); toast(`Đã khôi phục ${ents.length} mục`, 'ok'); } }], true);
    });
  };
}

/* ================= 7. Nhật ký ================= */
function vLog() {
  const l = rdJ(LOG).val || [];
  return head('Nhật ký thao tác', 'Ghi lại các thay đổi admin đã thực hiện trên thiết bị này (tối đa 150 dòng).', `<button class="btn" data-a="exp">⬇ Xuất</button><button class="btn d" data-a="clr" ${l.length ? '' : 'disabled'}>Xóa nhật ký</button>`) +
    `<div class="tw"><table><thead><tr><th>Thời gian</th><th>Thao tác</th><th>Chi tiết</th></tr></thead><tbody>${l.length ? l.map(x => `<tr><td style="white-space:nowrap;color:var(--mut)">${esc(new Date(x.t).toLocaleString('vi-VN'))}</td><td><b>${esc(x.a)}</b></td><td>${esc(x.d)}</td></tr>`).join('') : '<tr><td colspan="3" style="text-align:center;color:var(--mut);padding:24px">Chưa có thao tác nào.</td></tr>'}</tbody></table></div>`;
}
function bindLog() { $('view').onclick = async e => { const b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a === 'exp') download('nhat-ky-admin.json', JSON.stringify(rdJ(LOG).val || [], null, 2)); else if (b.dataset.a === 'clr' && await confirmBox('Xóa toàn bộ nhật ký?')) { lsDel(LOG); render(); } }; }

/* ================= 8. Cài đặt ================= */
function vSet() {
  const a = rdJ(AUTH).val || {};
  return head('Cài đặt', 'Mã PIN, giao diện và dữ liệu quản trị.') + storeWarn() +
    `<div class="grid g2"><div class="card"><h3 style="margin-bottom:10px">🔐 Mã PIN</h3>${a.off ? '<p style="color:var(--wa);margin-bottom:10px">Khóa PIN đang tắt.</p>' : ''}<div class="fg"><label class="f">PIN hiện tại<input type="password" id="s_old" inputmode="numeric" maxlength="8" autocomplete="off"></label><label class="f">PIN mới (4–8 số)<input type="password" id="s_new" inputmode="numeric" maxlength="8" autocomplete="off"></label></div>
      <div class="row" style="margin-top:10px"><button class="btn p" data-a="pin">Đổi PIN</button>${a.off ? '' : '<button class="btn d" data-a="pinoff">Tắt khóa PIN</button>'}</div><div id="s_msg" style="margin-top:8px;min-height:20px"></div></div>
    <div class="card"><h3 style="margin-bottom:10px">🎨 Giao diện</h3><div class="row"><button class="btn" data-a="th" data-th="dark">🌙 Tối</button><button class="btn" data-a="th" data-th="light">☀️ Sáng</button></div>
      <h3 style="margin:18px 0 10px">🧹 Dữ liệu quản trị</h3><p style="color:var(--mut);margin-bottom:10px">Xóa danh sách game đã lưu để Trung Tâm Game quay về mặc định.</p><button class="btn d" data-a="regclr">Xóa danh sách game đã lưu</button></div></div>`;
}
function bindSet() {
  $('view').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, msg = t => { $('s_msg').innerHTML = t; };
    if (a === 'th') { document.documentElement.dataset.theme = b.dataset.th; lsSet('tt-admin-theme', b.dataset.th); }
    else if (a === 'regclr') { if (await confirmBox('Xóa danh sách game đã lưu?')) { lsDel(REG); loadReg(); log('Xóa danh sách game đã lưu'); toast('Đã xóa', 'ok'); } }
    else if (a === 'pin') { const au = rdJ(AUTH).val || {}, old = $('s_old').value, nw = $('s_new').value; if (au.hash && await sha(au.salt + old) !== au.hash) { msg('<span style="color:var(--er)">PIN hiện tại chưa đúng.</span>'); return; } if (!/^\d{4,8}$/.test(nw)) { msg('<span style="color:var(--er)">PIN mới phải gồm 4–8 chữ số.</span>'); return; } const salt = Math.random().toString(36).slice(2); wrJ(AUTH, { salt, hash: await sha(salt + nw) }); log('Đổi mã PIN'); msg('<span style="color:var(--ok)">Đã đổi PIN.</span>'); }
    else if (a === 'pinoff') { const au = rdJ(AUTH).val || {}, old = $('s_old').value; if (au.hash && await sha(au.salt + old) !== au.hash) { msg('<span style="color:var(--er)">Hãy nhập PIN hiện tại để tắt khóa.</span>'); return; } wrJ(AUTH, { off: true }); log('Tắt khóa PIN'); render(); }
  };
}

/* ================= Khởi động ================= */
{ const th = lsGet('tt-admin-theme'); if (th) document.documentElement.dataset.theme = th; }
initAuth();
})();
</script>
</body>
</html>
