<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Battle — Trả lời để chiến đấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0d1a;
  --panel:#13162b;
  --panel-2:#1a1e38;
  --panel-3:#222742;
  --line:rgba(232,214,176,.12);
  --line-strong:rgba(232,214,176,.22);
  --gold:#f0c05a;
  --gold-dim:#a08040;
  --gold-glow:rgba(240,192,90,.18);
  --crimson:#e85d74;
  --crimson-dim:#a03048;
  --crimson-glow:rgba(232,93,116,.2);
  --teal:#4fd1c0;
  --teal-dim:#2a887c;
  --teal-glow:rgba(79,209,192,.18);
  --paper:#f2ecd8;
  --paper-dim:#a09880;
  --violet:#8b6fbf;
  --violet-dim:#5a4480;
  --violet-glow:rgba(139,111,191,.22);
  --azure:#5aa8f0;
  --azure-dim:#2f5f96;
  --azure-glow:rgba(90,168,240,.2);
  /* tier colors: common / elite / boss */
  --t-common:#8fa0c0;
  --t-common-glow:rgba(143,160,192,.18);
  --t-elite:#8b6fbf;
  --t-elite-glow:rgba(139,111,191,.28);
  --t-boss:#e85d74;
  --t-boss-glow:rgba(232,93,116,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 15% -5%,rgba(76,60,120,.25) 0%,transparent 60%),
    radial-gradient(900px 500px at 95% 105%,rgba(120,40,60,.2) 0%,transparent 55%),
    radial-gradient(600px 400px at 50% 60%,rgba(40,60,100,.1) 0%,transparent 50%),
    var(--ink);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  padding:28px 16px 60px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e8d6b0' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.6;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%,rgba(242,236,216,.9),transparent),
    radial-gradient(1.4px 1.4px at 28% 8%,rgba(242,236,216,.7),transparent),
    radial-gradient(1.8px 1.8px at 46% 22%,rgba(240,192,90,.8),transparent),
    radial-gradient(1.2px 1.2px at 62% 6%,rgba(242,236,216,.6),transparent),
    radial-gradient(1.6px 1.6px at 78% 16%,rgba(242,236,216,.8),transparent),
    radial-gradient(1.3px 1.3px at 90% 28%,rgba(139,111,191,.8),transparent),
    radial-gradient(1.5px 1.5px at 8% 42%,rgba(242,236,216,.55),transparent),
    radial-gradient(1.7px 1.7px at 35% 55%,rgba(242,236,216,.7),transparent),
    radial-gradient(1.4px 1.4px at 68% 48%,rgba(240,192,90,.6),transparent),
    radial-gradient(1.6px 1.6px at 92% 62%,rgba(242,236,216,.65),transparent),
    radial-gradient(1.3px 1.3px at 20% 78%,rgba(242,236,216,.5),transparent),
    radial-gradient(1.5px 1.5px at 55% 88%,rgba(242,236,216,.6),transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{
  0%{opacity:.35}
  50%{opacity:.75}
  100%{opacity:.45}
}
.stage{width:100%;max-width:880px;position:relative;z-index:1}

/* ===== TOPBAR ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  flex-wrap:wrap;
  gap:10px;
  padding:0 4px;
}
.brand{
  font-family:'Cinzel',serif;
  font-weight:800;
  letter-spacing:.06em;
  font-size:24px;
  color:var(--gold);
  text-shadow:0 0 30px rgba(240,192,90,.25),0 2px 4px rgba(0,0,0,.4);
  position:relative;
}
.brand span{
  color:var(--paper-dim);
  font-size:12.5px;
  font-family:'Inter';
  font-weight:500;
  letter-spacing:.02em;
  display:block;
  margin-top:3px;
  text-shadow:none;
}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  color:var(--paper);
  background:linear-gradient(180deg,var(--panel),rgba(19,22,43,.8));
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 14px;
  box-shadow:0 4px 12px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .15s,border-color .15s;
}
.score:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.score b{color:var(--gold)}
.btn-quit{
  font-family:'Cinzel',serif;
  font-size:12px;
  border:1px solid var(--crimson-dim);
  border-radius:10px;
  padding:7px 16px;
  color:var(--crimson);
  background:linear-gradient(180deg,rgba(232,93,116,.08),transparent);
  cursor:pointer;
  transition:all .2s;
  letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(232,93,116,.1);
}
.btn-quit:hover{
  border-color:var(--crimson);
  background:linear-gradient(180deg,rgba(232,93,116,.15),transparent);
  box-shadow:0 4px 14px rgba(232,93,116,.2);
  transform:translateY(-1px);
}

/* ===== LEVEL / XP BAR ===== */
.levelbar{
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(180deg,var(--panel),rgba(19,22,43,.9));
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 16px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.03);
}
.lv-badge{
  font-family:'Cinzel',serif;
  font-weight:800;
  font-size:14px;
  color:#2a2008;
  background:linear-gradient(180deg,var(--gold),#d4a845);
  border-radius:10px;
  padding:6px 12px;
  white-space:nowrap;
  box-shadow:0 0 14px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.35);
  flex-shrink:0;
}
.xp-track{
  flex:1;
  min-width:80px;
  height:10px;
  border-radius:8px;
  background:#0a0c18;
  border:1px solid var(--line);
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
}
.xp-fill{
  height:100%;
  background:linear-gradient(90deg,var(--azure-dim),var(--azure));
  box-shadow:0 0 10px var(--azure-glow);
  border-radius:8px;
  transition:width .5s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}
.xp-fill::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.18),transparent 70%);
  animation:shimmer 2.5s ease-in-out infinite;
}
.xp-text{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--paper-dim);
  white-space:nowrap;
  flex-shrink:0;
}

/* ===== DUNGEON HEADER (floor + tier) ===== */
.dungeon-head{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.floor-badge,.tier-badge{
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:6px 14px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.floor-badge{color:var(--paper-dim)}
.floor-badge b{color:var(--gold)}
.tier-badge{font-weight:700;transition:all .3s}
.tier-badge.common{color:var(--t-common);border-color:rgba(143,160,192,.35);box-shadow:0 0 12px var(--t-common-glow)}
.tier-badge.elite{color:var(--t-elite);border-color:rgba(139,111,191,.5);box-shadow:0 0 14px var(--t-elite-glow)}
.tier-badge.boss{
  color:var(--t-boss);border-color:rgba(232,93,116,.6);box-shadow:0 0 18px var(--t-boss-glow);
  animation:bossPulse 1.6s ease-in-out infinite;
}
@keyframes bossPulse{
  0%,100%{box-shadow:0 0 14px var(--t-boss-glow)}
  50%{box-shadow:0 0 26px var(--t-boss-glow)}
}

/* ===== ARENA ===== */
.arena{
  position:relative;
  background:
    linear-gradient(180deg,rgba(19,22,43,.95) 0%,rgba(15,17,34,.97) 62%,rgba(8,9,18,1) 100%),
    radial-gradient(700px 250px at 30% 100%,rgba(79,209,192,.07),transparent),
    radial-gradient(600px 200px at 70% 100%,rgba(232,93,116,.06),transparent);
  border:1px solid var(--line);
  border-radius:20px;
  padding:32px 26px 22px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
  gap:14px;
  overflow:hidden;
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 0 1px rgba(255,255,255,.02),
    inset 0 1px 0 rgba(255,255,255,.04);
  transition:box-shadow .4s;
}
.arena.boss-active{
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 0 1px rgba(232,93,116,.15),
    inset 0 1px 0 rgba(255,255,255,.04),
    0 0 40px rgba(232,93,116,.12);
}
/* ambient light pools + soft floor sheen */
.arena::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(800px 280px at 50% 110%,rgba(240,192,90,.07),transparent 60%),
    radial-gradient(260px 220px at 10% 15%,rgba(240,192,90,.14),transparent 70%),
    radial-gradient(260px 220px at 90% 15%,rgba(240,192,90,.14),transparent 70%),
    linear-gradient(180deg,transparent 70%,rgba(79,209,192,.04));
  pointer-events:none;
}
/* stone floor + ground line */
.arena::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:34%;
  background:
    linear-gradient(180deg,transparent,rgba(0,0,0,.35) 88%),
    repeating-linear-gradient(90deg,rgba(232,214,176,.035) 0 2px,transparent 2px 64px),
    linear-gradient(0deg,rgba(6,7,14,.9),rgba(6,7,14,0));
  border-top:1px solid rgba(232,214,176,.08);
  pointer-events:none;
}
/* ornate corner flourishes */
.arena .corner-orn{
  position:absolute;
  width:34px;height:34px;
  border:1.5px solid var(--gold-dim);
  opacity:.35;
  pointer-events:none;
  z-index:1;
}
.arena .corner-orn.tl{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.arena .corner-orn.tr{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.arena .corner-orn.bl{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.arena .corner-orn.br{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 8px 0}
/* torches flanking the arena */
.torch{
  position:absolute;
  top:18px;
  width:16px;
  z-index:1;
  pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(240,140,60,.5));
}
.torch.left{left:22px}
.torch.right{right:22px}
.torch .stick{width:5px;height:26px;margin:0 auto;background:linear-gradient(180deg,#5a4020,#2c1d0c);border-radius:2px}
.torch .flame{
  width:14px;height:20px;margin:-2px auto 0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff2b0,#f0a63c 55%,#c94a2e 85%,transparent 100%);
  animation:flicker 1.6s ease-in-out infinite alternate;
  transform-origin:50% 100%;
}
@keyframes flicker{
  0%{transform:scale(1,1) rotate(-2deg);opacity:.9}
  30%{transform:scale(.94,1.08) rotate(1deg);opacity:1}
  60%{transform:scale(1.05,.94) rotate(-1deg);opacity:.85}
  100%{transform:scale(.97,1.05) rotate(2deg);opacity:1}
}
/* drifting embers across the chamber */
.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.embers span{
  position:absolute;
  bottom:-6px;
  width:3px;height:3px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 6px 1px rgba(240,192,90,.8);
  opacity:0;
  animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  8%{opacity:.9}
  90%{opacity:.5}
  100%{opacity:0;transform:translate(var(--dx,10px),-220px) scale(1)}
}
.combatant{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  z-index:1;
  position:relative;
}
.combatant .name{
  font-family:'Cinzel',serif;
  font-size:14px;
  letter-spacing:.04em;
  color:var(--paper-dim);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  position:relative;
}
.combatant .name::after{
  content:'';
  display:block;
  width:28px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
  margin:5px auto 0;
  border-radius:2px;
  opacity:.6;
}
.hpbar-wrap{width:170px;position:relative}
.hpbar{
  height:11px;
  border-radius:8px;
  background:#0a0c18;
  border:1px solid var(--line);
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.03);
}
.hpbar::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%);
  pointer-events:none;
  border-radius:8px;
}
.hpfill{
  height:100%;
  border-radius:8px;
  transition:width .6s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}
.hpfill::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.18),transparent 70%);
  animation:shimmer 2.5s ease-in-out infinite;
}
@keyframes shimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
.hpfill.player{
  background:linear-gradient(90deg,var(--teal-dim),var(--teal));
  box-shadow:0 0 12px var(--teal-glow),inset 0 -1px 0 rgba(0,0,0,.2);
}
.hpfill.enemy{
  background:linear-gradient(90deg,var(--crimson-dim),var(--crimson));
  box-shadow:0 0 12px var(--crimson-glow),inset 0 -1px 0 rgba(0,0,0,.2);
}
.hpfill.enemy.elite{background:linear-gradient(90deg,var(--violet-dim),var(--violet));box-shadow:0 0 12px var(--violet-glow),inset 0 -1px 0 rgba(0,0,0,.2)}
.hptext{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--paper-dim);
  margin-top:5px;
  text-align:center;
  letter-spacing:.02em;
}
.sprite{
  width:110px;
  height:110px;
  position:relative;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
  transition:transform .3s ease;
}
.sprite.boss-size{width:132px;height:132px}
.sprite svg{width:100%;height:100%}
.sprite.hit{animation:hit .45s ease}
@keyframes hit{
  0%,100%{transform:translateX(0) scale(1)}
  15%{transform:translateX(-10px) rotate(-4deg) scale(.97)}
  35%{transform:translateX(8px) rotate(3deg) scale(.97)}
  55%{transform:translateX(-5px) rotate(-2deg)}
  75%{transform:translateX(3px) rotate(1deg)}
}
.sprite.attack{animation:attackLunge .4s ease}
@keyframes attackLunge{
  0%{transform:translateX(0)}
  40%{transform:translateX(28px) scale(1.05)}
  100%{transform:translateX(0)}
}
.sprite.enemy-attack{animation:enemyLunge .4s ease}
@keyframes enemyLunge{
  0%{transform:translateX(0)}
  40%{transform:translateX(-28px) scale(1.05)}
  100%{transform:translateX(0)}
}
.sprite::before{
  content:'';
  position:absolute;
  inset:-8px;
  border-radius:50%;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
}
.combatant:first-child .sprite::before{
  background:radial-gradient(circle,rgba(79,209,192,.12),transparent 70%);
}
.combatant:last-child .sprite::before{
  background:radial-gradient(circle,rgba(232,93,116,.12),transparent 70%);
}
.combatant:last-child .sprite.elite::before{background:radial-gradient(circle,rgba(139,111,191,.18),transparent 70%);opacity:1}
.combatant:last-child .sprite.boss::before{background:radial-gradient(circle,rgba(232,93,116,.28),transparent 70%);opacity:1}
.sprite:hover::before{opacity:1}
.vs{
  font-family:'Cinzel',serif;
  color:var(--gold-dim);
  font-size:26px;
  padding-bottom:50px;
  font-weight:700;
  letter-spacing:.08em;
  position:relative;
  text-shadow:0 0 20px rgba(240,192,90,.15);
}
.vs::before,.vs::after{
  content:'';
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:18px;
  background:linear-gradient(180deg,var(--gold-dim),transparent);
  opacity:.4;
}
.vs::before{bottom:18px}
.vs::after{top:-8px;background:linear-gradient(180deg,transparent,var(--gold-dim))}
.floattext{
  position:absolute;
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:22px;
  pointer-events:none;
  opacity:0;
  z-index:10;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
  letter-spacing:.02em;
  white-space:nowrap;
}
.floattext.show{animation:floatUp 1.1s ease forwards}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) scale(.8)}
  12%{opacity:1;transform:translateY(-8px) scale(1.1)}
  25%{transform:translateY(-16px) scale(1)}
  100%{opacity:0;transform:translateY(-56px) scale(.95)}
}
.floattext.dmg{color:var(--crimson)}
.floattext.heal{color:var(--gold)}
.floattext.coin{color:var(--gold);font-size:19px}
.floattext.xp{color:var(--azure);font-size:16px}

/* ===== QCARD ===== */
.qcard{
  margin-top:20px;
  background:
    linear-gradient(180deg,var(--panel),rgba(19,22,43,.97));
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px 24px 20px;
  position:relative;
  box-shadow:
    0 16px 48px rgba(0,0,0,.3),
    0 0 0 1px rgba(255,255,255,.02),
    inset 0 1px 0 rgba(255,255,255,.03);
  overflow:hidden;
}
.qcard::before{
  content:'';
  position:absolute;
  top:0;
  left:24px;
  right:24px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
  opacity:.25;
}
.qmeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.qeyebrow{
  font-family:'Cinzel',serif;
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-dim);
  position:relative;
  padding-left:14px;
}
.qeyebrow::before{
  content:'';
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:6px;
  height:6px;
  background:var(--gold);
  border-radius:50%;
  box-shadow:0 0 8px var(--gold-glow);
}
.timerwrap{display:flex;align-items:center;gap:10px}
.timerring{position:relative;width:36px;height:36px}
.timerring svg{
  width:36px;
  height:36px;
  transform:rotate(-90deg);
  filter:drop-shadow(0 0 4px rgba(240,192,90,.2));
}
.timerring circle.bg{stroke:rgba(232,214,176,.1)}
.timerring circle.fg{stroke:var(--gold);transition:stroke-dashoffset 1s linear}
.timernum{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  color:var(--paper);
}
.qtext{
  font-size:19px;
  font-weight:600;
  line-height:1.55;
  margin-bottom:18px;
  color:var(--paper);
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  padding:0 2px;
}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.options{grid-template-columns:1fr}}
.opt{
  text-align:left;
  background:linear-gradient(180deg,var(--panel-2),var(--panel-3));
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:12px;
  padding:14px 18px;
  font-family:'Inter';
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.03);
}
.opt::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(240,192,90,.05),transparent 50%);
  opacity:0;
  transition:opacity .2s;
}
.opt:hover:not(:disabled){
  border-color:var(--gold-dim);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.25),0 0 16px var(--gold-glow);
}
.opt:hover:not(:disabled)::before{opacity:1}
.opt:disabled{cursor:default;opacity:.85}
.opt.correct{
  border-color:var(--gold);
  background:linear-gradient(180deg,rgba(232,182,73,.18),rgba(232,182,73,.06));
  box-shadow:0 0 20px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.05);
  animation:correctPulse .5s ease;
}
@keyframes correctPulse{
  0%{transform:scale(1)}
  40%{transform:scale(1.02)}
  100%{transform:scale(1)}
}
.opt.wrong{
  border-color:var(--crimson);
  background:linear-gradient(180deg,rgba(224,84,106,.16),rgba(224,84,106,.05));
  box-shadow:0 0 16px var(--crimson-glow);
  animation:wrongShake .45s ease;
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}
.feedback{
  margin-top:16px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13.5px;
  min-height:20px;
  padding:10px 14px;
  border-radius:10px;
  transition:all .3s ease;
}
.feedback.ok{
  color:var(--gold);
  background:rgba(240,192,90,.08);
  border:1px solid rgba(240,192,90,.15);
}
.feedback.bad{
  color:var(--crimson);
  background:rgba(232,93,116,.06);
  border:1px solid rgba(232,93,116,.12);
}

/* ===== ATTACKS ===== */
.attacks-head{
  display:none;
  justify-content:space-between;
  align-items:baseline;
  margin-top:18px;
  margin-bottom:2px;
}
.attacks-head.show{display:flex;animation:fadeInUp .4s ease}
.attacks-head .label{
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gold-dim);
}
.attacks-head .hint{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--paper-dim);
}
.attacks{
  display:none;
  margin-top:10px;
  gap:12px;
  grid-template-columns:repeat(3,1fr);
  max-height:340px;
  overflow-y:auto;
  padding-right:2px;
}
.attacks.show{display:grid;animation:fadeInUp .4s ease}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:560px){.attacks.show{grid-template-columns:1fr}}
.attacks::-webkit-scrollbar{width:6px}
.attacks::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:6px;opacity:.5}
.attacks::-webkit-scrollbar-track{background:transparent}
.atk{
  background:linear-gradient(180deg,#262a4e,#1c1f3a);
  border:1px solid var(--gold-dim);
  border-radius:12px;
  padding:14px 12px;
  text-align:center;
  cursor:pointer;
  color:var(--paper);
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.2);
}
.atk::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(240,192,90,.08),transparent);
  opacity:0;
  transition:opacity .2s;
}
.atk:hover:not(.locked){
  border-color:var(--gold);
  transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(0,0,0,.3),0 0 20px var(--gold-glow);
}
.atk:hover:not(.locked)::before{opacity:1}
.atk .icon{
  font-size:24px;
  display:block;
  margin-bottom:5px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
}
.atk .aname{font-weight:700;font-size:13px;letter-spacing:.01em;line-height:1.25}
.atk .arange{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--paper-dim);
  margin-top:4px;
  display:block;
}
.atk .areq{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  margin-top:5px;
  display:block;
  font-weight:600;
}
/* rarity tiers by data-tier */
.atk[data-tier="1"]{border-color:var(--t-common);box-shadow:0 6px 16px rgba(0,0,0,.2),0 0 10px var(--t-common-glow)}
.atk[data-tier="2"]{border-color:var(--teal);box-shadow:0 6px 16px rgba(0,0,0,.2),0 0 10px var(--teal-glow)}
.atk[data-tier="3"]{border-color:var(--violet);box-shadow:0 6px 16px rgba(0,0,0,.2),0 0 10px var(--violet-glow)}
.atk[data-tier="4"]{border-color:var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.2),0 0 10px var(--gold-glow)}
.atk[data-tier="5"]{border-color:var(--crimson);box-shadow:0 6px 16px rgba(0,0,0,.25),0 0 14px var(--crimson-glow)}
.atk[data-tier="1"] .aname{color:var(--t-common)}
.atk[data-tier="2"] .aname{color:var(--teal)}
.atk[data-tier="3"] .aname{color:var(--violet)}
.atk[data-tier="4"] .aname{color:var(--gold)}
.atk[data-tier="5"] .aname{color:var(--crimson)}
.atk.locked{
  cursor:not-allowed;
  filter:grayscale(.75) brightness(.6);
  opacity:.7;
}
.atk.locked .areq{color:var(--crimson)}
.atk .lock-ic{display:none}
.atk.locked .lock-ic{display:inline-block;margin-right:3px}

/* ===== BANNER ===== */
.banner{
  display:none;
  margin-top:22px;
  text-align:center;

  border:1px solid var(--line);

.banner.show{display:block;animation:bannerIn .6s ease}
@keyframes bannerIn{

}
.banner::before{
  content:'';
  position:absolute;

}
.banner p{

}
.banner .summary{

.banner .summary .chip{

.banner .summary .chip b{color:var(--gold)}
.retry{

  overflow:hidden;
}
.retry:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(240,192,90,.35),inset 0 1px 0 rgba(255,255,255,.3);
}
.retry:active{transform:translateY(0)}
.statusline{
  text-align:center;
  margin-top:14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;

}
.statusline.err{color:var(--crimson)}

/* ===== EFFECTS ===== */
.defeat-flash{animation:defeatFlash .7s ease}
@keyframes defeatFlash{
  0%{filter:brightness(1)}
  30%{filter:brightness(2) saturate(1.5)}
  100%{filter:brightness(1)}
}
.shake{animation:screenShake .4s ease}
@keyframes screenShake{
  0%,100%{transform:translate(0)}
  15%{transform:translate(-4px,2px)}
  30%{transform:translate(4px,-2px)}
  45%{transform:translate(-3px,-1px)}
  60%{transform:translate(3px,1px)}
  75%{transform:translate(-1px,0)}
}
.levelup-flash{animation:levelUpFlash 1s ease}
@keyframes levelUpFlash{
  0%{box-shadow:0 0 0 rgba(90,168,240,0)}
  30%{box-shadow:0 0 40px rgba(90,168,240,.6)}
  100%{box-shadow:0 0 0 rgba(90,168,240,0)}
}

/* ===== RESPONSIVE ===== */
@media(max-width:560px){
  .arena{padding:24px 16px 18px;grid-template-columns:1fr auto 1fr;gap:8px}

  .hpbar-wrap{width:130px}

}

/* ===== OUTFIT PALETTES (applied as class on #playerSprite) ===== */

/* ===== TOPBAR SHOP BUTTON ===== */
.btn-shop{

}

}

  background:linear-gradient(180deg,var(--panel),rgba(11,13,26,.98));

.shop-coins{

.shop-close{

.shop-tabs{display:flex;gap:8px;margin-bottom:10px}
.shop-tab{

}
.shop-tab.active{color:var(--gold);background:var(--panel-3);border-color:var(--gold-dim)}
.shop-equipped{

}

.shop-grid{

}
@media(max-width:560px){.shop-grid{grid-template-columns:1fr}}
.shop-item{

.shop-buy-btn:disabled{

/* ---------- Shop logic ---------- */
function findItem(type,id){
  var list=type==='weapon'?WEAPONS:type==='hair'?HAIRS:OUTFITS;
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return list[0];
}
function isOwned(type,id){
  var owned=type==='weapon'?loadout.ownedWeapons:type==='hair'?loadout.ownedHairs:loadout.ownedOutfits;
  return owned.indexOf(id)!==-1;
}
function isEquipped(type,id){
  if(type==='weapon')return loadout.equippedWeapon===id;
  if(type==='hair')return loadout.equippedHair===id;
  return loadout.equippedOutfit===id;
}
function spendCoins(amount){
  userCoins=Math.max(0,userCoins-amount);
  el('coinVal').textContent=userCoins;
  broadcastState();
  try{window.parent.postMessage({type:'add-coins',data:{amount:-amount}},'*');}catch(e){}
}
function applyPlayerVisual(){
  var outfit=findItem('outfit',loadout.equippedOutfit);
  var weapon=findItem('weapon',loadout.equippedWeapon);
  var hair=findItem('hair',loadout.equippedHair);
  el('playerSprite').className='sprite player-outfit '+outfit.cls;
  el('weaponBadge').textContent=weapon.icon;
  el('equipLine').textContent='Trang bị: '+weapon.name+' \u00B7 '+outfit.name;
  // Directly update SVG gradient stops to ensure colors change
  var css=getComputedStyle(el('playerSprite'));
  var a=css.getPropertyValue('--outfit-a').trim()||'#5dd8c8';
  var b=css.getPropertyValue('--outfit-b').trim()||'#2a887c';
  var a2=css.getPropertyValue('--outfit-a2').trim()||'#49c6b8';
  var b2=css.getPropertyValue('--outfit-b2').trim()||'#1e5e56';
  var svg=el('playerSprite').querySelector('svg');
  if(svg){
    var stops=svg.querySelectorAll('#pg stop');
    if(stops[0])stops[0].style.stopColor=a;
    if(stops[1])stops[1].style.stopColor=b;
    var stops2=svg.querySelectorAll('#pg2 stop');
    if(stops2[0])stops2[0].style.stopColor=a2;
    if(stops2[1])stops2[1].style.stopColor=b2;
    var aura=svg.querySelectorAll('#pAura stop');
    if(aura[0])aura[0].style.stopColor=a;
    if(aura[1])aura[1].style.stopColor=a;
    // Update hair color
    var h0=svg.getElementById('hairStop0');
    var h1=svg.getElementById('hairStop1');
    if(h0)h0.style.stopColor=hair.color;
    if(h1)h1.style.stopColor=hair.color2;
  }
}
function equipItem(type,id){
  if(type==='weapon')loadout.equippedWeapon=id;
  else if(type==='hair')loadout.equippedHair=id;
  else loadout.equippedOutfit=id;
  applyPlayerVisual();
  renderShopGrid(currentShopTab);
  syncLoadoutToBackend();
}
function buyItem(type,id){
  var item=findItem(type,id);
  if(!item || userCoins<item.price) return;
  if(item.price>0) spendCoins(item.price);
  var owned=type==='weapon'?loadout.ownedWeapons:type==='hair'?loadout.ownedHairs:loadout.ownedOutfits;
  owned.push(id);
  equipItem(type,id);
}
function syncLoadoutToBackend(){
  try{window.parent.postMessage({type:'save-loadout',data:{loadout:JSON.parse(JSON.stringify(loadout))}},'*');}catch(e){}
}
function renderShopGrid(tab){
  currentShopTab=tab;
  el('tabWeapon').classList.toggle('active',tab==='weapon');
  el('tabOutfit').classList.toggle('active',tab==='outfit');
  el('tabHair').classList.toggle('active',tab==='hair');
  el('shopCoinVal').textContent=userCoins;
  var list=tab==='weapon'?WEAPONS:tab==='hair'?HAIRS:OUTFITS;
  var grid=el('shopGrid');grid.innerHTML='';
  list.forEach(function(item){
    var owned=isOwned(tab,item.id), equipped=isEquipped(tab,item.id);
    var card=document.createElement('div');
    card.className='shop-item'+(equipped?' equipped':'');
    var btnLabel = equipped ? 'Đang dùng' : (owned ? 'Trang bị' : (userCoins>=item.price ? 'Mua \u2014 '+item.price+' xu' : 'Không đủ xu'));
    var disabled = equipped || (!owned && userCoins<item.price);
    var statLine = tab==='weapon' ? ('+'+item.bonus+' sát thương') : tab==='hair' ? 'Đổi màu tóc' : 'Đổi giao diện nhân vật';

      '<span class="shop-icon">'+item.icon+'</span>'+
      '<span class="shop-name">'+item.name+'</span>'+
      '<span class="shop-desc">'+item.desc+'</span>'+
      '<span class="shop-stat">'+statLine+'</span>'+
      '<button class="shop-buy-btn"'+(disabled?' disabled':'')+'>'+btnLabel+'</button>';
    card.querySelector('button').onclick=function(){ owned ? equipItem(tab,item.id) : buyItem(tab,item.id); };

  });

/* ---------- Leveling ---------- */
function levelFromXp(xp){
  var lv=1;
  for(var i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i]) lv=i+1; }
  return lv;
}
function xpRangeForLevel(lv){
  var cur=LEVELS[lv-1]!==undefined?LEVELS[lv-1]:LEVELS[LEVELS.length-1];
  var next=LEVELS[lv]!==undefined?LEVELS[lv]:null;
  return {cur:cur,next:next};
}
function updateLevelUI(prevLevel){
  var lv=levelFromXp(state.xp);
  state.level=lv;
  el('lvVal').textContent=lv;
  var rng=xpRangeForLevel(lv);
  if(rng.next===null){
    el('xpFill').style.width='100%';
    el('xpText').textContent=state.xp+' XP (Cấp tối đa)';
  }else{
    var pct=Math.max(0,Math.min(100,(state.xp-rng.cur)/(rng.next-rng.cur)*100));
    el('xpFill').style.width=pct+'%';
    el('xpText').textContent=state.xp+' / '+rng.next+' XP';
  }
  if(prevLevel!==undefined && lv>prevLevel){
    el('levelbar').classList.add('levelup-flash');
    setTimeout(function(){el('levelbar').classList.remove('levelup-flash')},1000);
    setStatus('Thăng cấp! Bạn đã đạt Lv.'+lv+' — mở khoá đòn đánh mới.');
  }
}
function gainXp(amount,overEnemy){
  var prevLevel=state.level;
  state.xp+=amount;
  updateLevelUI(prevLevel);
  floatText('+'+amount+' XP','xp',!!overEnemy);
}

/* ---------- Dungeon tier / floor ---------- */
function computeDungeonMeta(round){
  var pos=round+1; // 1-indexed monster number within the run
  var tier='common';
  if(pos%5===0) tier='boss';
  else if(pos%3===0) tier='elite';
  var floor=Math.floor(round/5)+1;
  return {tier:tier,floor:floor};
}
function updateDungeonUI(){
  el('floorVal').textContent=state.floor;
  var tb=el('tierBadge');
  tb.className='tier-badge '+state.tier;
  tb.textContent = state.tier==='boss' ? 'TRÙM TẦNG' : (state.tier==='elite' ? 'Tinh Anh' : 'Thường');
  el('arena').classList.toggle('boss-active', state.tier==='boss');
  var spriteCls='sprite'+(state.tier==='boss'?' boss-size boss':(state.tier==='elite'?' elite':''));
  el('enemySprite').className=spriteCls;
  el('enemyHpFill').className='hpfill enemy'+(state.tier==='elite'?' elite':'');
}
function enemyDisplayName(round,tier){
  if(tier==='boss') return BOSS_NAMES[Math.floor(round/5)%BOSS_NAMES.length];
  return ENEMY_NAMES[round%ENEMY_NAMES.length];
}
function coinRewardFor(tier,floor){
  var base=10+floor*4;
  if(tier==='boss') return Math.round(base*4);
  if(tier==='elite') return Math.round(base*2);
  return base;
}

/* ---------- Question flow ---------- */
function renderQuestion(){
  clearInterval(state.timer);state.locked=false;
  el('attacks').className='attacks';el('attacks').innerHTML='';
  el('attacksHead').className='attacks-head';
  el('feedback').textContent='';el('feedback').className='feedback';
  var q=state.questions[state.qIndex%state.questions.length];
  el('qcounter').textContent='Câu hỏi '+(state.qIndex+1);
  el('qtext').textContent=q.content;
  var optWrap=el('options');optWrap.innerHTML='';
  q.options.forEach(function(opt){
    var btn=document.createElement('button');btn.className='opt';btn.textContent=opt.content;
    btn.onclick=function(){submitAnswer(q,opt.id,btn)};optWrap.appendChild(btn);
  });
  state.timeLimit=q.timeLimit||20;state.timeLeft=state.timeLimit;updateTimerRing();
  state.timer=setInterval(function(){
    state.timeLeft--;updateTimerRing();
    if(state.timeLeft<=0){clearInterval(state.timer);if(!state.locked)handleTimeout()}
  },1000);
}

function updateTimerRing(){
  var circ=2*Math.PI*15;var ratio=Math.max(0,state.timeLeft/state.timeLimit);
  el('timerCircle').style.strokeDasharray=circ;
  el('timerCircle').style.strokeDashoffset=circ*(1-ratio);
  el('timerNum').textContent=Math.max(0,state.timeLeft);
}

function submitAnswer(question,answerId,btnEl){
  if(state.locked)return;state.locked=true;clearInterval(state.timer);
  Array.from(el('options').children).forEach(function(b){b.disabled=true});

  if(typeof window.apiSubmitAnswer==="function"){
    window.apiSubmitAnswer(question.id,answerId).then(function(response){
      var result = response && response.data ? response.data : response;
      handleAnswerResult(result,btnEl);
    }).catch(function(){
      setStatus('Lỗi gửi đáp án',true);
      state.locked=false;Array.from(el('options').children).forEach(function(b){b.disabled=false});
    });
  }else{
    handleAnswerResult({correct:false,points:0},btnEl);
  }
}

function handleAnswerResult(result,btnEl){
  setStatus('');
  if(result.correct){
    btnEl.classList.add('correct');
    el('feedback').textContent='Chính xác! +'+(result.points||0)+' điểm — chọn một đòn để tấn công.';
    el('feedback').className='feedback ok';
    state.score+=(result.points||0);el('scoreVal').textContent=state.score;
    gainXp(XP_PER_CORRECT,false);
    if(window.GameTaskBridge)GameTaskBridge.emit('ANSWER_CORRECT',{gameId:state.gameId});
    showAttackOptions();
  }else{
    btnEl.classList.add('wrong');
    el('feedback').textContent='Sai rồi — đối thủ phản đòn!';
    el('feedback').className='feedback bad';
    setTimeout(enemyStrikes,500);
  }
}

function handleTimeout(){
  state.locked=true;Array.from(el('options').children).forEach(function(b){b.disabled=true});
  el('feedback').textContent='Hết giờ — đối thủ phản đòn!';
  el('feedback').className='feedback bad';setTimeout(enemyStrikes,400);
}

/* ---------- Attack selection (XP gated) ---------- */
function showAttackOptions(){
  var wrap=el('attacks');wrap.innerHTML='';
  var unlockedCount=0;
  ATTACKS.forEach(function(a){
    var locked = state.xp < a.reqXp;
    if(!locked) unlockedCount++;
    var div=document.createElement('div');
    div.className='atk'+(locked?' locked':'');
    div.setAttribute('data-tier',a.tier);
    var reqHtml = locked ? '<span class="areq"><span class="lock-ic">\uD83D\uDD12</span>Cần '+a.reqXp+' XP</span>' : '';
    var weaponBonus=findItem('weapon',loadout.equippedWeapon).bonus;
    var rangeLabel=(a.min+weaponBonus)+'-'+(a.max+weaponBonus)+' dmg'+(weaponBonus>0?' (+'+weaponBonus+' vũ khí)':'');
    div.innerHTML='<span class="icon">'+a.icon+'</span><span class="aname">'+a.name+'</span><span class="arange">'+rangeLabel+'</span>'+reqHtml;
    if(!locked){
      div.onclick=function(){playerAttacks(a)};
    }
    wrap.appendChild(div);
  });
  el('attacksHint').textContent=unlockedCount+'/'+ATTACKS.length+' đòn đã mở khoá';
  wrap.className='attacks show';
  el('attacksHead').className='attacks-head show';
}

function floatText(text,cls,overEnemy){
  var arena=el('arena'),ft=el('floatText');
  var rect=(overEnemy?el('enemySprite'):el('playerSprite')).getBoundingClientRect();
  var arenaRect=arena.getBoundingClientRect();
  ft.style.left=(rect.left-arenaRect.left+rect.width/2-14)+'px';
  ft.style.top=(rect.top-arenaRect.top-6)+'px';
  ft.textContent=text;ft.className='floattext '+cls;void ft.offsetWidth;ft.className='floattext '+cls+' show';
}

function playerAttacks(atk){
  el('attacks').className='attacks';
  el('attacksHead').className='attacks-head';
  var weaponBonus=findItem('weapon',loadout.equippedWeapon).bonus;
  var dmg=Math.floor(Math.random()*(atk.max-atk.min+1))+atk.min+weaponBonus;
  state.enemyHp=Math.max(0,state.enemyHp-dmg);
  el('enemySprite').classList.add('hit');
  el('playerSprite').className='sprite attack';
  floatText('-'+dmg,'dmg',true);updateBars();
  setTimeout(function(){
    el('enemySprite').classList.remove('hit');
    el('playerSprite').className='sprite';
  },450);
  if(state.enemyHp<=0){
    el('enemySprite').classList.add('defeat-flash');
    setTimeout(defeatEnemy,600);
  }
  else setTimeout(nextQuestionOrEnd,1000);
}

function enemyStrikes(){
  var dmgMult = state.tier==='boss'?1.6:(state.tier==='elite'?1.2:1);
  var dmg=Math.round((Math.floor(Math.random()*(ENEMY_HIT_DMG[1]-ENEMY_HIT_DMG[0]+1))+ENEMY_HIT_DMG[0])*dmgMult);
  state.playerHp=Math.max(0,state.playerHp-dmg);
  el('playerSprite').className='sprite hit';
  el('enemySprite').classList.add('enemy-attack');
  el('arena').classList.add('shake');
  floatText('-'+dmg,'dmg',false);updateBars();
  setTimeout(function(){
    el('playerSprite').className='sprite';
    el('enemySprite').classList.remove('enemy-attack');
    el('arena').classList.remove('shake');
  },450);
  if(state.playerHp<=0)setTimeout(gameOver,700);
  else setTimeout(nextQuestionOrEnd,1000);
}

function updateBars(){
  el('playerHpFill').style.width=(state.playerHp/PLAYER_MAX_HP*100)+'%';
  el('playerHpText').textContent=state.playerHp+' / '+PLAYER_MAX_HP;
  el('enemyHpFill').style.width=(state.enemyHp/state.enemyMaxHp*100)+'%';
  el('enemyHpText').textContent=state.enemyHp+' / '+state.enemyMaxHp;
}

function grantCoins(amount){
  if(amount<=0)return;
  userCoins+=amount;
  state.sessionCoins+=amount;
  el('coinVal').textContent=userCoins;
  if(el('shopOverlay').classList.contains('show')) el('shopCoinVal').textContent=userCoins;
  broadcastState();
  try{window.parent.postMessage({type:'add-coins',data:{amount:amount}},'*');}catch(e){}
}

function defeatEnemy(){
  var defeatedTier=state.tier, defeatedFloor=state.floor;
  var reward=coinRewardFor(defeatedTier,defeatedFloor);
  grantCoins(reward);
  floatText('+'+reward+' XU','coin',true);
  gainXp(defeatedTier==='boss'?25:(defeatedTier==='elite'?15:8),true);

  state.enemyRound++;
  var meta=computeDungeonMeta(state.enemyRound);
  state.tier=meta.tier;state.floor=meta.floor;
  var nextMax=ENEMY_BASE_HP+state.enemyRound*ENEMY_HP_STEP;
  if(state.tier==='boss') nextMax=Math.round(nextMax*1.6);
  else if(state.tier==='elite') nextMax=Math.round(nextMax*1.25);
  state.enemyMaxHp=nextMax;state.enemyHp=nextMax;
  el('enemyName').textContent=enemyDisplayName(state.enemyRound,state.tier);
  el('enemySprite').innerHTML=renderEnemySprite(state.enemyRound,state.tier);
  updateDungeonUI();
  updateBars();
  var msg = defeatedTier==='boss' ? 'Hạ gục Trùm tầng! +'+reward+' xu — bước sang tầng mới.' : 'Hạ gục! +'+reward+' xu. Một đối thủ mới xuất hiện.';
  el('feedback').textContent=msg;
  el('feedback').className='feedback ok';
  setTimeout(nextQuestionOrEnd,300);
}

function nextQuestionOrEnd(){
  state.qIndex++;
  if(state.qIndex>=state.questions.length*20)winGame();
  else renderQuestion();
}

function summaryChips(){
  return '<div class="chip">Điểm: <b>'+state.score+'</b></div>'+
         '<div class="chip">Xu kiếm được: <b>'+state.sessionCoins+'</b></div>'+
         '<div class="chip">Cấp: <b>Lv.'+state.level+'</b></div>'+
         '<div class="chip">Tầng đạt tới: <b>'+state.floor+'</b></div>';
}

function gameOver(){
  clearInterval(state.timer);el('qcard').style.display='none';
  el('bannerTitle').textContent='Bạn đã gục ngã';
  el('bannerText').textContent='Đừng nản lòng — thử lại để leo cao hơn và đánh bại Trùm tiếp theo!';
  el('bannerSummary').innerHTML=summaryChips();
  el('banner').className='banner show';
  parent.postMessage({type:"game-over",data:{score:state.score,correct:state.qIndex,timeUsed:0,totalCoins:userCoins}},"*");
  if(window.GameTaskBridge)GameTaskBridge.emit('GAME_LOST',{gameId:state.gameId});
}

function winGame(){
  clearInterval(state.timer);el('qcard').style.display='none';
  el('bannerTitle').textContent='Chiến thắng vang dội!';
  el('bannerText').textContent='Bạn đã trả lời hết câu hỏi và chinh phục '+state.floor+' tầng dungeon.';
  el('bannerSummary').innerHTML=summaryChips();
  el('banner').className='banner show';
  parent.postMessage({type:"game-over",data:{score:state.score,correct:state.questions.length,timeUsed:0,totalCoins:userCoins}},"*");
  if(window.GameTaskBridge)GameTaskBridge.emit('GAME_WON',{gameId:state.gameId});
}

el('retryBtn').onclick=function(){
  var keepQuestions=state.questions, keepGameId=state.gameId;
  state={questions:keepQuestions,qIndex:0,score:0,xp:0,level:1,playerHp:PLAYER_MAX_HP,enemyHp:ENEMY_BASE_HP,enemyMaxHp:ENEMY_BASE_HP,enemyRound:0,tier:'common',floor:1,timer:null,timeLeft:20,timeLimit:20,locked:false,gameId:keepGameId,sessionCoins:0};
  el('scoreVal').textContent='0';el('coinVal').textContent=userCoins;
  el('enemyName').textContent=ENEMY_NAMES[0];
  el('enemySprite').innerHTML=renderEnemySprite(0,'common');
  updateLevelUI();updateDungeonUI();updateBars();applyPlayerVisual();
  el('qcard').style.display='block';el('banner').className='banner';renderQuestion();
};

el('btnQuit').onclick=function(){parent.postMessage({type:"quit"},"*")};

window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.type==='init'){
    var d=e.data.data||{};
    var meta0=computeDungeonMeta(0);
    state={
      questions:d.questions||[],qIndex:0,score:0,xp:0,level:1,
      playerHp:PLAYER_MAX_HP,enemyHp:ENEMY_BASE_HP,enemyMaxHp:ENEMY_BASE_HP,
      enemyRound:0,tier:meta0.tier,floor:meta0.floor,
      timer:null,timeLeft:20,timeLimit:20,locked:false,
      gameId:d.gameId||null,sessionCoins:0
    };
    userCoins=d.coins||0;
    if(d.loadout&&typeof d.loadout==='object'){
      loadout.ownedWeapons=Array.isArray(d.loadout.ownedWeapons)&&d.loadout.ownedWeapons.length?d.loadout.ownedWeapons:['wood'];
      loadout.ownedOutfits=Array.isArray(d.loadout.ownedOutfits)&&d.loadout.ownedOutfits.length?d.loadout.ownedOutfits:['scholar'];
      loadout.equippedWeapon=d.loadout.equippedWeapon||'wood';
      loadout.equippedOutfit=d.loadout.equippedOutfit||'scholar';
      loadout.ownedHairs=Array.isArray(d.loadout.ownedHairs)&&d.loadout.ownedHairs.length?d.loadout.ownedHairs:['brown'];
      loadout.equippedHair=d.loadout.equippedHair||'brown';
    }
    el('scoreVal').textContent='0';el('coinVal').textContent=userCoins;
    el('enemyName').textContent=enemyDisplayName(0,state.tier);
    el('enemySprite').innerHTML=renderEnemySprite(0,state.tier);
    el('qcard').style.display='block';el('banner').className='banner';
    updateLevelUI();updateDungeonUI();updateBars();applyPlayerVisual();renderQuestion();
    if(window.GameTaskBridge)GameTaskBridge.emit('GAME_PLAYED',{gameId:d.gameId});
  }
});

parent.postMessage({type:"ready"},"*");
})();
</script>
</body>
</html>
