<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Battle — Trả lời để chiến đấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0d1a;
  --panel:#13162b;
  --panel-2:#1a1e38;
  --panel-3:#222742;
  --line:rgba(232,214,176,.12);
  --line-strong:rgba(232,214,176,.22);
  --gold:#f0c05a;
  --gold-dim:#a08040;
  --gold-glow:rgba(240,192,90,.18);
  --crimson:#e85d74;
  --crimson-dim:#a03048;
  --crimson-glow:rgba(232,93,116,.2);
  --teal:#4fd1c0;
  --teal-dim:#2a887c;
  --teal-glow:rgba(79,209,192,.18);
  --paper:#f2ecd8;
  --paper-dim:#a09880;
  --violet:#8b6fbf;
  --violet-dim:#5a4480;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 15% -5%,rgba(76,60,120,.25) 0%,transparent 60%),
    radial-gradient(900px 500px at 95% 105%,rgba(120,40,60,.2) 0%,transparent 55%),
    radial-gradient(600px 400px at 50% 60%,rgba(40,60,100,.1) 0%,transparent 50%),
    var(--ink);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  padding:28px 16px 60px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e8d6b0' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
}
.stage{width:100%;max-width:820px;position:relative;z-index:1}

/* ===== TOPBAR ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
  flex-wrap:wrap;
  gap:10px;
  padding:0 4px;
}
.brand{
  font-family:'Cinzel',serif;
  font-weight:800;
  letter-spacing:.06em;
  font-size:24px;
  color:var(--gold);
  text-shadow:0 0 30px rgba(240,192,90,.25),0 2px 4px rgba(0,0,0,.4);
  position:relative;
}
.brand span{
  color:var(--paper-dim);
  font-size:12.5px;
  font-family:'Inter';
  font-weight:500;
  letter-spacing:.02em;
  display:block;
  margin-top:3px;
  text-shadow:none;
}
.topbar-right{display:flex;align-items:center;gap:10px}
.score{
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  color:var(--paper);
  background:linear-gradient(180deg,var(--panel),rgba(19,22,43,.8));
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 14px;
  box-shadow:0 4px 12px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .15s,border-color .15s;
}
.score:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.score b{color:var(--gold)}
.btn-quit{
  font-family:'Cinzel',serif;
  font-size:12px;
  border:1px solid var(--crimson-dim);
  border-radius:10px;
  padding:7px 16px;
  color:var(--crimson);
  background:linear-gradient(180deg,rgba(232,93,116,.08),transparent);
  cursor:pointer;
  transition:all .2s;
  letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(232,93,116,.1);
}
.btn-quit:hover{
  border-color:var(--crimson);
  background:linear-gradient(180deg,rgba(232,93,116,.15),transparent);
  box-shadow:0 4px 14px rgba(232,93,116,.2);
  transform:translateY(-1px);
}

/* ===== ARENA ===== */
.arena{
  position:relative;
  background:
    linear-gradient(180deg,rgba(19,22,43,.95),rgba(11,13,26,.98)),
    radial-gradient(700px 250px at 30% 100%,rgba(79,209,192,.06),transparent),
    radial-gradient(600px 200px at 70% 100%,rgba(232,93,116,.05),transparent);
  border:1px solid var(--line);
  border-radius:20px;
  padding:32px 26px 22px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
  gap:14px;
  overflow:hidden;
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 0 1px rgba(255,255,255,.02),
    inset 0 1px 0 rgba(255,255,255,.04);
}
.arena::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(800px 280px at 50% 110%,rgba(240,192,90,.07),transparent 60%),
    linear-gradient(180deg,transparent 70%,rgba(79,209,192,.04));
  pointer-events:none;
}
.arena::after{
  content:'';
  position:absolute;
  bottom:0;
  left:10%;
  right:10%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
  opacity:.3;
}
.combatant{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  z-index:1;
  position:relative;
}
.combatant .name{
  font-family:'Cinzel',serif;
  font-size:14px;
  letter-spacing:.04em;
  color:var(--paper-dim);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  position:relative;
}
.combatant .name::after{
  content:'';
  display:block;
  width:28px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
  margin:5px auto 0;
  border-radius:2px;
  opacity:.6;
}
.hpbar-wrap{width:170px;position:relative}
.hpbar{
  height:11px;
  border-radius:8px;
  background:#0a0c18;
  border:1px solid var(--line);
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.03);
}
.hpbar::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%);
  pointer-events:none;
  border-radius:8px;
}
.hpfill{
  height:100%;
  border-radius:8px;
  transition:width .6s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}
.hpfill::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.18),transparent 70%);
  animation:shimmer 2.5s ease-in-out infinite;
}
@keyframes shimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
.hpfill.player{
  background:linear-gradient(90deg,var(--teal-dim),var(--teal));
  box-shadow:0 0 12px var(--teal-glow),inset 0 -1px 0 rgba(0,0,0,.2);
}
.hpfill.enemy{
  background:linear-gradient(90deg,var(--crimson-dim),var(--crimson));
  box-shadow:0 0 12px var(--crimson-glow),inset 0 -1px 0 rgba(0,0,0,.2);
}
.hptext{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--paper-dim);
  margin-top:5px;
  text-align:center;
  letter-spacing:.02em;
}
.sprite{
  width:110px;
  height:110px;
  position:relative;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
  transition:transform .3s ease;
}
.sprite svg{width:100%;height:100%}
.sprite.hit{animation:hit .45s ease}
@keyframes hit{
  0%,100%{transform:translateX(0) scale(1)}
  15%{transform:translateX(-10px) rotate(-4deg) scale(.97)}
  35%{transform:translateX(8px) rotate(3deg) scale(.97)}
  55%{transform:translateX(-5px) rotate(-2deg)}
  75%{transform:translateX(3px) rotate(1deg)}
}
.sprite.attack{animation:attackLunge .4s ease}
@keyframes attackLunge{
  0%{transform:translateX(0)}
  40%{transform:translateX(28px) scale(1.05)}
  100%{transform:translateX(0)}
}
.sprite.enemy-attack{animation:enemyLunge .4s ease}
@keyframes enemyLunge{
  0%{transform:translateX(0)}
  40%{transform:translateX(-28px) scale(1.05)}
  100%{transform:translateX(0)}
}
.sprite::before{
  content:'';
  position:absolute;
  inset:-8px;
  border-radius:50%;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
}
.combatant:first-child .sprite::before{
  background:radial-gradient(circle,rgba(79,209,192,.12),transparent 70%);
}
.combatant:last-child .sprite::before{
  background:radial-gradient(circle,rgba(232,93,116,.12),transparent 70%);
}
.sprite:hover::before{opacity:1}
.vs{
  font-family:'Cinzel',serif;
  color:var(--gold-dim);
  font-size:26px;
  padding-bottom:50px;
  font-weight:700;
  letter-spacing:.08em;
  position:relative;
  text-shadow:0 0 20px rgba(240,192,90,.15);
}
.vs::before,.vs::after{
  content:'';
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:18px;
  background:linear-gradient(180deg,var(--gold-dim),transparent);
  opacity:.4;
}
.vs::before{bottom:18px}
.vs::after{top:-8px;background:linear-gradient(180deg,transparent,var(--gold-dim))}
.floattext{
  position:absolute;
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:22px;
  pointer-events:none;
  opacity:0;
  z-index:10;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
  letter-spacing:.02em;
}
.floattext.show{animation:floatUp 1.1s ease forwards}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) scale(.8)}
  12%{opacity:1;transform:translateY(-8px) scale(1.1)}
  25%{transform:translateY(-16px) scale(1)}
  100%{opacity:0;transform:translateY(-56px) scale(.95)}
}
.floattext.dmg{color:var(--crimson)}
.floattext.heal{color:var(--gold)}

/* ===== QCARD ===== */
.qcard{
  margin-top:20px;
  background:
    linear-gradient(180deg,var(--panel),rgba(19,22,43,.97));
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px 24px 20px;
  position:relative;
  box-shadow:
    0 16px 48px rgba(0,0,0,.3),
    0 0 0 1px rgba(255,255,255,.02),
    inset 0 1px 0 rgba(255,255,255,.03);
  overflow:hidden;
}
.qcard::before{
  content:'';
  position:absolute;
  top:0;
  left:24px;
  right:24px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
  opacity:.25;
}
.qmeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.qeyebrow{
  font-family:'Cinzel',serif;
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-dim);
  position:relative;
  padding-left:14px;
}
.qeyebrow::before{
  content:'';
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:6px;
  height:6px;
  background:var(--gold);
  border-radius:50%;
  box-shadow:0 0 8px var(--gold-glow);
}
.timerwrap{display:flex;align-items:center;gap:10px}
.timerring{position:relative;width:36px;height:36px}
.timerring svg{
  width:36px;
  height:36px;
  transform:rotate(-90deg);
  filter:drop-shadow(0 0 4px rgba(240,192,90,.2));
}
.timerring circle.bg{stroke:rgba(232,214,176,.1)}
.timerring circle.fg{stroke:var(--gold);transition:stroke-dashoffset 1s linear}
.timernum{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  color:var(--paper);
}
.qtext{
  font-size:19px;
  font-weight:600;
  line-height:1.55;
  margin-bottom:18px;
  color:var(--paper);
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  padding:0 2px;
}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.options{grid-template-columns:1fr}}
.opt{
  text-align:left;
  background:linear-gradient(180deg,var(--panel-2),var(--panel-3));
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:12px;
  padding:14px 18px;
  font-family:'Inter';
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.03);
}
.opt::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(240,192,90,.05),transparent 50%);
  opacity:0;
  transition:opacity .2s;
}
.opt:hover:not(:disabled){
  border-color:var(--gold-dim);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.25),0 0 16px var(--gold-glow);
}
.opt:hover:not(:disabled)::before{opacity:1}
.opt:disabled{cursor:default;opacity:.85}
.opt.correct{
  border-color:var(--gold);
  background:linear-gradient(180deg,rgba(232,182,73,.18),rgba(232,182,73,.06));
  box-shadow:0 0 20px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.05);
  animation:correctPulse .5s ease;
}
@keyframes correctPulse{
  0%{transform:scale(1)}
  40%{transform:scale(1.02)}
  100%{transform:scale(1)}
}
.opt.wrong{
  border-color:var(--crimson);
  background:linear-gradient(180deg,rgba(224,84,106,.16),rgba(224,84,106,.05));
  box-shadow:0 0 16px var(--crimson-glow);
  animation:wrongShake .45s ease;
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}
.feedback{
  margin-top:16px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13.5px;
  min-height:20px;
  padding:10px 14px;
  border-radius:10px;
  transition:all .3s ease;
}
.feedback.ok{
  color:var(--gold);
  background:rgba(240,192,90,.08);
  border:1px solid rgba(240,192,90,.15);
}
.feedback.bad{
  color:var(--crimson);
  background:rgba(232,93,116,.06);
  border:1px solid rgba(232,93,116,.12);
}
.attacks{
  display:none;
  margin-top:18px;
  gap:12px;
  grid-template-columns:repeat(3,1fr);
}
.attacks.show{display:grid;animation:fadeInUp .4s ease}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:560px){.attacks.show{grid-template-columns:1fr}}
.atk{
  background:linear-gradient(180deg,#262a4e,#1c1f3a);
  border:1px solid var(--gold-dim);
  border-radius:12px;
  padding:16px 12px;
  text-align:center;
  cursor:pointer;
  color:var(--paper);
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.2);
}
.atk::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(240,192,90,.08),transparent);
  opacity:0;
  transition:opacity .2s;
}
.atk:hover{
  border-color:var(--gold);
  transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(0,0,0,.3),0 0 20px var(--gold-glow);
}
.atk:hover::before{opacity:1}
.atk .icon{
  font-size:26px;
  display:block;
  margin-bottom:6px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
}
.atk .aname{font-weight:700;font-size:14px;letter-spacing:.01em}
.atk .arange{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--paper-dim);
  margin-top:4px;
  display:block;
}

/* ===== BANNER ===== */
.banner{
  display:none;
  margin-top:22px;
  text-align:center;
  padding:36px 28px;
  border-radius:18px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),rgba(19,22,43,.98));
  position:relative;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.banner.show{display:block;animation:bannerIn .6s ease}
@keyframes bannerIn{
  from{opacity:0;transform:translateY(20px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.banner::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;
}
.banner h2{
  font-family:'Cinzel',serif;
  color:var(--gold);
  font-size:28px;
  margin-bottom:10px;
  font-weight:700;
  letter-spacing:.03em;
  text-shadow:0 0 30px rgba(240,192,90,.2);
}
.banner p{
  color:var(--paper-dim);
  font-size:15px;
  margin-bottom:22px;
  line-height:1.6;
}
.retry{
  font-family:'Cinzel',serif;
  background:linear-gradient(180deg,var(--gold),#d4a845);
  color:#2a2008;
  border:none;
  border-radius:10px;
  padding:12px 28px;
  font-weight:700;
  cursor:pointer;
  letter-spacing:.04em;
  font-size:14px;
  transition:all .2s ease;
  box-shadow:0 6px 20px rgba(240,192,90,.25),inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;
  overflow:hidden;
}
.retry:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(240,192,90,.35),inset 0 1px 0 rgba(255,255,255,.3);
}
.retry:active{transform:translateY(0)}
.statusline{
  text-align:center;
  margin-top:14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:var(--paper-dim);
  min-height:20px;
}
.statusline.err{color:var(--crimson)}

/* ===== EFFECTS ===== */
.defeat-flash{animation:defeatFlash .7s ease}
@keyframes defeatFlash{
  0%{filter:brightness(1)}
  30%{filter:brightness(2) saturate(1.5)}
  100%{filter:brightness(1)}
}
.shake{animation:screenShake .4s ease}
@keyframes screenShake{
  0%,100%{transform:translate(0)}
  15%{transform:translate(-4px,2px)}
  30%{transform:translate(4px,-2px)}
  45%{transform:translate(-3px,-1px)}
  60%{transform:translate(3px,1px)}
  75%{transform:translate(-1px,0)}
}

/* ===== RESPONSIVE ===== */
@media(max-width:560px){
  .arena{padding:24px 16px 18px;grid-template-columns:1fr auto 1fr;gap:8px}
  .sprite{width:88px;height:88px}
  .hpbar-wrap{width:130px}
  .vs{font-size:20px;padding-bottom:36px}
  .qtext{font-size:17px}
  .brand{font-size:20px}
  .topbar{justify-content:center;text-align:center}
  .topbar-right{width:100%;justify-content:center;margin-top:6px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="api_submit"></div>
<div class="stage">
  <div class="topbar">
    <div class="brand">QUIZ BATTLE<span>Trả lời đúng để mở đòn tấn công</span></div>
    <div class="topbar-right">
      <div class="score">&#128176; <b id="coinVal">0</b></div>
      <div class="score">Điểm: <b id="scoreVal">0</b></div>
      <button class="btn-quit" id="btnQuit">Thoát</button>
    </div>
  </div>

  <div class="arena" id="arena">
    <div class="combatant">
      <div class="name">Nhà hiền triết</div>
      <div class="sprite" id="playerSprite">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5dd8c8"/>
              <stop offset="100%" stop-color="#2a887c"/>
            </linearGradient>
            <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#49c6b8"/>
              <stop offset="100%" stop-color="#1e5e56"/>
            </linearGradient>
            <filter id="pglow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <ellipse cx="50" cy="92" rx="28" ry="6" fill="#000" opacity=".25"/>
          <rect x="38" y="78" width="10" height="14" rx="3" fill="url(#pg2)"/>
          <rect x="52" y="78" width="10" height="14" rx="3" fill="url(#pg2)"/>
          <rect x="32" y="48" width="36" height="34" rx="9" fill="#1c2040" stroke="url(#pg)" stroke-width="2.5"/>
          <path d="M32 62h36" stroke="url(#pg)" stroke-width="1" opacity=".3"/>
          <circle cx="50" cy="32" r="17" fill="#f2ecdd"/>
          <path d="M33 14c-10 2-16 9-16 9l5 10h26l5-10s-6-7-16-9z" fill="url(#pg)" filter="url(#pglow)"/>
          <path d="M38 20h24v6H38z" fill="url(#pg2)" opacity=".5"/>
          <circle cx="43" cy="34" r="2.5" fill="#0e1020"/>
          <circle cx="57" cy="34" r="2.5" fill="#0e1020"/>
          <path d="M47 40q3 3 6 0" stroke="#0e1020" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <rect x="44" y="52" width="12" height="16" rx="3" fill="url(#pg)" opacity=".15"/>
        </svg>
      </div>
      <div class="hpbar-wrap"><div class="hpbar"><div class="hpfill player" id="playerHpFill" style="width:100%"></div></div><div class="hptext" id="playerHpText">100 / 100</div></div>
    </div>
    <div class="vs">VS</div>
    <div class="combatant">
      <div class="name" id="enemyName">Slime Cổ Đại</div>
      <div class="sprite" id="enemySprite">
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="eg" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#a070e0"/>
              <stop offset="60%" stop-color="#6b4fa8"/>
              <stop offset="100%" stop-color="#3d2a60"/>
            </radialGradient>
            <filter id="eglow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <ellipse cx="50" cy="90" rx="26" ry="7" fill="#000" opacity=".3"/>
          <path d="M50 18c24 0 36 18 36 40 0 18-16 30-36 30S14 76 14 58c0-22 12-40 36-40z" fill="url(#eg)" filter="url(#eglow)" opacity=".95"/>
          <path d="M50 22c20 0 30 14 30 32 0 14-12 24-30 24S20 68 20 54c0-18 10-32 30-32z" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
          <ellipse cx="38" cy="48" rx="6" ry="7" fill="#0e1020" opacity=".7"/>
          <ellipse cx="62" cy="48" rx="6" ry="7" fill="#0e1020" opacity=".7"/>
          <circle cx="40" cy="46" r="2.5" fill="#e8b649"/>
          <circle cx="64" cy="46" r="2.5" fill="#e8b649"/>
          <path d="M38 64q12 10 24 0" stroke="#0e1020" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
          <circle cx="30" cy="58" r="4" fill="rgba(160,120,220,.3)"/>
          <circle cx="70" cy="52" r="3" fill="rgba(160,120,220,.25)"/>
          <circle cx="50" cy="72" r="2.5" fill="rgba(160,120,220,.2)"/>
        </svg>
      </div>
      <div class="hpbar-wrap"><div class="hpbar"><div class="hpfill enemy" id="enemyHpFill" style="width:100%"></div></div><div class="hptext" id="enemyHpText">80 / 80</div></div>
    </div>
    <div class="floattext" id="floatText"></div>
  </div>

  <div class="qcard" id="qcard">
    <div class="qmeta">
      <div class="qeyebrow" id="qcounter">Câu hỏi 1</div>
      <div class="timerwrap">
        <div class="timerring">
          <svg viewBox="0 0 36 36">
            <circle class="bg" cx="18" cy="18" r="15" fill="none" stroke-width="3"/>
            <circle class="fg" id="timerCircle" cx="18" cy="18" r="15" fill="none" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <div class="timernum" id="timerNum">20</div>
        </div>
      </div>
    </div>
    <div class="qtext" id="qtext">Đang tải câu hỏi…</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="attacks" id="attacks"></div>
  </div>

  <div class="banner" id="banner">
    <h2 id="bannerTitle"></h2>
    <p id="bannerText"></p>
    <button class="retry" id="retryBtn">Chơi lại</button>
  </div>
  <div class="statusline" id="statusline"></div>
</div>

<script>
(function(){
var ATTACKS=[
  {name:"Chém",icon:"\u2694\uFE0F",min:14,max:22},
  {name:"Cầu lửa",icon:"\uD83D\uDD25",min:18,max:28},
  {name:"Sét",icon:"\u26A1",min:10,max:34}
];
var ENEMY_NAMES=["Slime Cổ Đại","Yêu Tinh Rừng Sâu","Bông Ma Thư Viện","Rồng Non Tinh Nghịch"];
var ENEMY_BASE_HP=80,ENEMY_HP_STEP=25,PLAYER_MAX_HP=100,ENEMY_HIT_DMG=[8,16];

var state={questions:[],qIndex:0,score:0,playerHp:PLAYER_MAX_HP,enemyHp:ENEMY_BASE_HP,enemyMaxHp:ENEMY_BASE_HP,enemyRound:0,timer:null,timeLeft:20,timeLimit:20,locked:false};
var userCoins=0;

function broadcastState(){
  try{window.parent.postMessage({type:'state-update',data:{type:'play-to-win',coins:userCoins+state.score}},'*');}catch(e){}
}

var el=function(id){return document.getElementById(id)};

function setStatus(msg,isErr){var s=el('statusline');s.textContent=msg||'';s.className='statusline'+(isErr?' err':'')}

function renderQuestion(){
  clearInterval(state.timer);state.locked=false;
  el('attacks').className='attacks';el('attacks').innerHTML='';
  el('feedback').textContent='';el('feedback').className='feedback';
  var q=state.questions[state.qIndex%state.questions.length];
  el('qcounter').textContent='Câu hỏi '+(state.qIndex+1);
  el('qtext').textContent=q.content;
  var optWrap=el('options');optWrap.innerHTML='';
  q.options.forEach(function(opt){
    var btn=document.createElement('button');btn.className='opt';btn.textContent=opt.content;
    btn.onclick=function(){submitAnswer(q,opt.id,btn)};optWrap.appendChild(btn);
  });
  state.timeLimit=q.timeLimit||20;state.timeLeft=state.timeLimit;updateTimerRing();
  state.timer=setInterval(function(){
    state.timeLeft--;updateTimerRing();
    if(state.timeLeft<=0){clearInterval(state.timer);if(!state.locked)handleTimeout()}
  },1000);
}

function updateTimerRing(){
  var circ=2*Math.PI*15;var ratio=Math.max(0,state.timeLeft/state.timeLimit);
  el('timerCircle').style.strokeDasharray=circ;
  el('timerCircle').style.strokeDashoffset=circ*(1-ratio);
  el('timerNum').textContent=Math.max(0,state.timeLeft);
}

function submitAnswer(question,answerId,btnEl){
  if(state.locked)return;state.locked=true;clearInterval(state.timer);
  Array.from(el('options').children).forEach(function(b){b.disabled=true});

  if(typeof window.apiSubmitAnswer==="function"){
    window.apiSubmitAnswer(question.id,answerId).then(function(response){
      var result = response && response.data ? response.data : response;
      handleAnswerResult(result,btnEl);
    }).catch(function(){
      setStatus('Lỗi gửi đáp án',true);
      state.locked=false;Array.from(el('options').children).forEach(function(b){b.disabled=false});
    });
  }else{
    handleAnswerResult({correct:false,points:0},btnEl);
  }
}

function handleAnswerResult(result,btnEl){
  setStatus('');
  if(result.correct){
    btnEl.classList.add('correct');
    el('feedback').textContent='Chính xác! +'+(result.points||0)+' điểm — chọn một đòn để tấn công.';
    el('feedback').className='feedback ok';
    state.score+=(result.points||0);el('scoreVal').textContent=state.score;
    el('coinVal').textContent=userCoins+state.score;
    broadcastState();
    showAttackOptions();
  }else{
    btnEl.classList.add('wrong');
    el('feedback').textContent='Sai rồi — đối thủ phản đòn!';
    el('feedback').className='feedback bad';
    setTimeout(enemyStrikes,500);
  }
}

function handleTimeout(){
  state.locked=true;Array.from(el('options').children).forEach(function(b){b.disabled=true});
  el('feedback').textContent='Hết giờ — đối thủ phản đòn!';
  el('feedback').className='feedback bad';setTimeout(enemyStrikes,400);
}

function showAttackOptions(){
  var wrap=el('attacks');wrap.innerHTML='';
  ATTACKS.forEach(function(a){
    var div=document.createElement('div');div.className='atk';
    div.innerHTML='<span class="icon">'+a.icon+'</span><span class="aname">'+a.name+'</span><span class="arange">'+a.min+'-'+a.max+' dmg</span>';
    div.onclick=function(){playerAttacks(a)};wrap.appendChild(div);
  });
  wrap.className='attacks show';
}

function floatText(text,cls,overEnemy){
  var arena=el('arena'),ft=el('floatText');
  var rect=(overEnemy?el('enemySprite'):el('playerSprite')).getBoundingClientRect();
  var arenaRect=arena.getBoundingClientRect();
  ft.style.left=(rect.left-arenaRect.left+rect.width/2-14)+'px';
  ft.style.top=(rect.top-arenaRect.top-6)+'px';
  ft.textContent=text;ft.className='floattext '+cls;void ft.offsetWidth;ft.className='floattext '+cls+' show';
}

function playerAttacks(atk){
  el('attacks').className='attacks';
  var dmg=Math.floor(Math.random()*(atk.max-atk.min+1))+atk.min;
  state.enemyHp=Math.max(0,state.enemyHp-dmg);
  el('enemySprite').className='sprite hit';
  el('playerSprite').className='sprite attack';
  floatText('-'+dmg,'dmg',true);updateBars();
  setTimeout(function(){el('enemySprite').className='sprite';el('playerSprite').className='sprite'},450);
  if(state.enemyHp<=0){
    el('enemySprite').classList.add('defeat-flash');
    setTimeout(defeatEnemy,600);
  }
  else setTimeout(nextQuestionOrEnd,1000);
}

function enemyStrikes(){
  var dmg=Math.floor(Math.random()*(ENEMY_HIT_DMG[1]-ENEMY_HIT_DMG[0]+1))+ENEMY_HIT_DMG[0];
  state.playerHp=Math.max(0,state.playerHp-dmg);
  el('playerSprite').className='sprite hit';
  el('enemySprite').className='sprite enemy-attack';
  el('arena').classList.add('shake');
  floatText('-'+dmg,'dmg',false);updateBars();
  setTimeout(function(){
    el('playerSprite').className='sprite';
    el('enemySprite').className='sprite';
    el('arena').classList.remove('shake');
  },450);
  if(state.playerHp<=0)setTimeout(gameOver,700);
  else setTimeout(nextQuestionOrEnd,1000);
}

function updateBars(){
  el('playerHpFill').style.width=(state.playerHp/PLAYER_MAX_HP*100)+'%';
  el('playerHpText').textContent=state.playerHp+' / '+PLAYER_MAX_HP;
  el('enemyHpFill').style.width=(state.enemyHp/state.enemyMaxHp*100)+'%';
  el('enemyHpText').textContent=state.enemyHp+' / '+state.enemyMaxHp;
}

function defeatEnemy(){
  state.enemyRound++;
  var nextMax=ENEMY_BASE_HP+state.enemyRound*ENEMY_HP_STEP;
  state.enemyMaxHp=nextMax;state.enemyHp=nextMax;
  el('enemyName').textContent=ENEMY_NAMES[state.enemyRound%ENEMY_NAMES.length];
  updateBars();el('feedback').textContent='Hạ gục! Một đối thủ mới xuất hiện.';
  el('feedback').className='feedback ok';nextQuestionOrEnd();
}

function nextQuestionOrEnd(){
  state.qIndex++;
  if(state.qIndex>=state.questions.length*20)winGame();
  else renderQuestion();
}

function gameOver(){
  clearInterval(state.timer);el('qcard').style.display='none';
  el('bannerTitle').textContent='Bạn đã gục ngã';
  el('bannerText').textContent='Điểm số cuối cùng: '+state.score+'. Thử lại để đánh bại đối thủ tiếp theo!';
  el('banner').className='banner show';
  parent.postMessage({type:"game-over",data:{score:state.score,correct:state.qIndex,timeUsed:0,totalCoins:userCoins+state.score}},"*");
}

function winGame(){
  clearInterval(state.timer);el('qcard').style.display='none';
  el('bannerTitle').textContent='Chin thắng vang dội!';
  el('bannerText').textContent='Bạn đã trả lời hết câu hỏi với '+state.score+' điểm.';
  el('banner').className='banner show';
  parent.postMessage({type:"game-over",data:{score:state.score,correct:state.questions.length,timeUsed:0,totalCoins:userCoins+state.score}},"*");
}

el('retryBtn').onclick=function(){
  state={questions:state.questions,qIndex:0,score:0,playerHp:PLAYER_MAX_HP,enemyHp:ENEMY_BASE_HP,enemyMaxHp:ENEMY_BASE_HP,enemyRound:0,timer:null,timeLeft:20,timeLimit:20,locked:false};
  el('scoreVal').textContent='0';el('coinVal').textContent=userCoins;
  el('enemyName').textContent=ENEMY_NAMES[0];updateBars();
  el('qcard').style.display='block';el('banner').className='banner';renderQuestion();
};

el('btnQuit').onclick=function(){parent.postMessage({type:"quit"},"*")};

window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.type==='init'){
    var d=e.data.data||{};
    state.questions=d.questions||[];state.qIndex=0;state.score=0;
    state.playerHp=PLAYER_MAX_HP;state.enemyHp=ENEMY_BASE_HP;
    state.enemyMaxHp=ENEMY_BASE_HP;state.enemyRound=0;state.locked=false;
    userCoins=d.coins||0;
    el('scoreVal').textContent='0';el('coinVal').textContent=userCoins;
    el('enemyName').textContent=ENEMY_NAMES[0];
    el('qcard').style.display='block';el('banner').className='banner';
    updateBars();renderQuestion();
  }
});

parent.postMessage({type:"ready"},"*");
})();
</script>
</body>
</html>
