<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Làng Nhỏ Của Tôi - Chiến Đấu</title>
    <style>
        /* -------- GIỮ NGUYÊN PHẦN CSS (đã tối ưu) -------- */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --soil: #d89a5a;
            --soil-dark: #b87a3a;
            --soil-light: #ecb87a;
            --grass: #5fa864;
            --grass-dark: #3f7a4f;
            --grass-light: #7fc87a;
            --wood: #8a6a3a;
            --wood-dark: #6a4a2a;
            --wood-light: #b08a5a;
            --gold: #f5c842;
            --gold-dark: #d4a820;
            --panel: #fefaf0;
            --line: #d4b88a;
            --ink: #2a1f10;
            --ink-dim: #8a7a5a;
            --danger: #d94a5a;
            --water: #5ab0d0;
            --water-dark: #3a8aaa;
            --shadow: rgba(20, 12, 4, 0.35);
            --radius: 16px;
            --radius-sm: 10px;
        }
        html,
        body {
            height: 100%;
            background: #1a1208;
            color: var(--ink);
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            touch-action: manipulation;
        }
        #root {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .font-display {
            font-family: 'Quicksand', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            border: none;
            background: none;
            touch-action: manipulation;
        }
        .hidden {
            display: none !important;
        }

        /* -------- SCREENS -------- */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            background: linear-gradient(170deg, #eaf6ff 0%, #f5ede0 100%);
            position: relative;
            overflow: hidden;
        }
        .screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(200, 180, 140, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(160, 200, 160, 0.10) 0%, transparent 40%);
            pointer-events: none;
        }
        @keyframes popIn {
            0% {
                transform: scale(0.92) translateY(16px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .anim-pop {
            animation: popIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
        }

        .card-glow {
            background: var(--panel);
            border: 2px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 2rem 1.8rem;
            max-width: 28rem;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
        }
        .card-glow .hero-icon {
            font-size: 4rem;
            margin-bottom: 0.6rem;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.10));
        }
        .card-glow h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--grass-dark);
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
        }
        .card-glow .sub {
            color: var(--ink-dim);
            font-size: 0.92rem;
            margin-bottom: 1.6rem;
            line-height: 1.5;
        }
        .glow-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1.05rem;
            border: 2px solid;
            transition: transform 0.12s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .glow-btn:active {
            transform: scale(0.97);
        }
        .glow-btn.primary {
            background: var(--grass);
            color: #fff;
            border-color: var(--grass-dark);
            box-shadow: 0 4px 0 var(--grass-dark);
        }
        .glow-btn.primary:active {
            box-shadow: 0 1px 0 var(--grass-dark);
            transform: translateY(3px) scale(0.97);
        }
        .glow-btn.secondary {
            background: transparent;
            color: var(--ink-dim);
            border-color: var(--line);
        }
        .glow-btn.secondary:active {
            background: rgba(0, 0, 0, 0.04);
        }
        .glow-btn.danger {
            background: transparent;
            color: var(--danger);
            border-color: rgba(217, 74, 90, 0.3);
        }
        .glow-btn.danger:active {
            background: rgba(217, 74, 90, 0.06);
        }
        .menu-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.4rem;
            padding-top: 1.2rem;
            border-top: 2px dashed rgba(180, 160, 130, 0.3);
        }
        .menu-stats .stat {
            text-align: center;
        }
        .menu-stats .stat .num {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gold-dark);
        }
        .menu-stats .stat .num.green {
            color: var(--grass-dark);
        }
        .menu-stats .stat .lbl {
            font-size: 0.65rem;
            color: var(--ink-dim);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* -------- GAME SCREEN -------- */
        .game-screen {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #2a1f10;
        }
        .scene {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 255, 200, 0.08), transparent 55%),
                linear-gradient(175deg, var(--soil-light) 0%, var(--soil) 50%, var(--soil-dark) 100%);
            overflow: hidden;
        }
        .scene::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.25;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.4) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(100, 60, 20, 0.3) 1px, transparent 1.5px);
            background-size: 28px 28px, 36px 36px;
            background-position: 0 0, 14px 18px;
        }

        /* grass edges */
        .grass-edge {
            position: absolute;
            left: 0;
            right: 0;
            height: 10%;
            z-index: 1;
            pointer-events: none;
        }
        .grass-edge.top {
            top: 0;
            background: linear-gradient(180deg, var(--grass-light), var(--grass));
            clip-path: polygon(0 0, 100% 0, 100% 55%, 96% 100%, 92% 50%, 88% 100%, 84% 50%, 80% 100%, 76% 50%, 72% 100%, 68% 50%, 64% 100%, 60% 50%, 56% 100%, 52% 50%, 48% 100%, 44% 50%, 40% 100%, 36% 50%, 32% 100%, 28% 50%, 24% 100%, 20% 50%, 16% 100%, 12% 50%, 8% 100%, 4% 50%, 0 100%);
        }
        .grass-edge.bottom {
            bottom: 0;
            background: linear-gradient(0deg, var(--grass-light), var(--grass));
            clip-path: polygon(0 100%, 100% 100%, 100% 45%, 96% 0, 92% 50%, 88% 0, 84% 50%, 80% 0, 76% 50%, 72% 0, 68% 50%, 64% 0, 60% 50%, 56% 0, 52% 50%, 48% 0, 44% 50%, 40% 0, 36% 50%, 32% 0, 28% 50%, 24% 0, 20% 50%, 16% 0, 12% 50%, 8% 0, 4% 50%, 0 0);
        }

        /* pond */
        .pond {
            position: absolute;
            border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
            background: linear-gradient(180deg, #8fd8f0, #4a9ab8);
            border: 4px solid #d8b878;
            box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.20);
            z-index: 2;
            pointer-events: none;
        }
        .pond .lily {
            position: absolute;
            width: 16px;
            height: 9px;
            background: var(--grass);
            border-radius: 50%;
            opacity: 0.8;
        }
        .pond .ripple {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            animation: rippleAnim 3.4s ease-out infinite;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            0% {
                width: 6px;
                height: 6px;
                opacity: 0.8;
            }
            100% {
                width: 40px;
                height: 40px;
                opacity: 0;
            }
        }

        /* farm patch */
        .farm-patch {
            position: absolute;
            padding: 8px;
            border-radius: 14px;
            background: rgba(80, 50, 20, 0.30);
            border: 3px solid var(--wood-dark);
            z-index: 2;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .farm-patch .fp-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .fp-tile {
            width: 15vw;
            max-width: 56px;
            aspect-ratio: 1/1;
            border-radius: 8px;
            background: #8a5a2e;
            border: 2px solid #6b431f;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.20);
        }
        .fp-tile:active {
            transform: scale(0.94);
        }
        .fp-tile .fpicon {
            font-size: 1.4rem;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }
        .fp-tile.ready {
            background: #7a9a3f;
            animation: pulseGlow 1.2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(100, 200, 80, 0.3);
        }
        @keyframes pulseGlow {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 12px rgba(100, 200, 80, 0.25);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 24px rgba(100, 200, 80, 0.5);
            }
        }
        .fp-tile .fp-bar {
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: 10%;
            height: 4px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.30);
            overflow: hidden;
        }
        .fp-tile .fp-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #b0e8a0, #7ad06a);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* -------- HOTSPOT -------- */
        .hotspot {
            position: absolute;
            transform: translate(-50%, -100%);
            cursor: pointer;
            transition: filter 0.2s, transform 0.15s;
            z-index: 3;
            touch-action: manipulation;
        }
        .hotspot:active {
            transform: translate(-50%, -100%) scale(0.94);
        }
        .hotspot svg {
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.25));
            transition: filter 0.2s;
        }
        .hotspot:hover svg {
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.30));
        }
        .hotspot.locked {
            filter: grayscale(0.5) brightness(0.85) saturate(0.5);
        }
        .hotspot.locked:hover svg {
            filter: grayscale(0.5) brightness(0.85) saturate(0.5);
        }
        .hotspot .hp-tag {
            position: absolute;
            left: 50%;
            bottom: 100%;
            transform: translateX(-50%);
            margin-bottom: 4px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.5rem;
            font-weight: 700;
            color: #fff;
            background: rgba(30, 18, 8, 0.70);
            border-radius: 8px;
            padding: 2px 8px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .hotspot:hover .hp-tag,
        .hotspot:active .hp-tag {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);
        }
        .hotspot.energy-low {
            opacity: 0.55;
        }
        .hotspot.decor {
            cursor: pointer;
        }

        /* -------- Monster -------- */
        .monster-hotspot {
            position: absolute;
            transform: translate(-50%, -100%);
            cursor: pointer;
            z-index: 3;
            touch-action: manipulation;
            text-align: center;
            transition: transform 0.15s;
        }
        .monster-hotspot:active {
            transform: translate(-50%, -100%) scale(0.94);
        }
        .monster-hotspot .monster-icon {
            font-size: 3.2rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.30));
            display: block;
            margin-bottom: 2px;
        }
        .monster-hotspot .monster-hp-bar {
            width: 60px;
            height: 5px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            margin: 2px auto 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .monster-hotspot .monster-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #e74c3c, #f1c40f);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .monster-hotspot .monster-name {
            font-size: 0.6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            background: rgba(0, 0, 0, 0.4);
            padding: 1px 6px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 2px;
            backdrop-filter: blur(2px);
        }
        .monster-hotspot.boss .monster-icon {
            font-size: 4rem;
        }
        .monster-hotspot.boss .monster-hp-bar {
            width: 90px;
            height: 7px;
        }
        .monster-hotspot.boss .monster-name {
            font-size: 0.75rem;
            background: rgba(180, 30, 30, 0.6);
        }
        .monster-hotspot.dead {
            opacity: 0.5;
            pointer-events: none;
        }

        /* -------- Villager -------- */
        .villager-pos {
            position: absolute;
            transform: translate(-50%, -100%);
            transition: left 0.55s cubic-bezier(0.34, 1.0, 0.64, 1), top 0.55s cubic-bezier(0.34, 1.0, 0.64, 1);
            z-index: 6;
            pointer-events: none;
        }
        .villager-pos.face-left .villager-svg {
            transform: scaleX(-1);
        }
        .villager-svg {
            display: block;
            overflow: visible;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.30));
        }
        .villager-pos:not(.moving) .villager-body {
            animation: idleBob 1.8s ease-in-out infinite;
        }
        .villager-pos.moving .villager-body {
            animation: walkBob 0.3s ease-in-out infinite;
        }
        @keyframes idleBob {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-2px);
            }
        }
        @keyframes walkBob {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }
        .tool-bubble {
            opacity: 0;
            transition: opacity 0.2s ease;
            font-size: 14px;
        }
        .villager-pos.act .tool-bubble {
            opacity: 1;
        }
        .villager-pos.act-swing .arm-right {
            animation: swingArm 0.3s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: top center;
        }
        .villager-pos.act-dig .arm-left,
        .villager-pos.act-dig .arm-right {
            animation: digArms 0.38s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: top center;
        }
        .villager-pos.act-water .arm-right {
            animation: waterTilt 0.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: top center;
        }
        .villager-pos.act-bend .villager-body {
            animation: bendDown 0.5s ease-in-out infinite;
        }
        .villager-pos.act-attack .arm-right {
            animation: attackArm 0.25s ease-in-out 2;
            transform-box: fill-box;
            transform-origin: top center;
        }
        @keyframes attackArm {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-60deg) scaleX(1.2);
            }
        }
        @keyframes swingArm {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-48deg);
            }
        }
        @keyframes digArms {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(32deg);
            }
        }
        @keyframes waterTilt {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-28deg);
            }
        }
        @keyframes bendDown {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(4px);
            }
        }

        /* -------- HUD -------- */
        .hud-topright {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            pointer-events: none;
        }
        .hud-topright>* {
            pointer-events: auto;
        }
        .hud-pill {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(20, 12, 4, 0.60);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0.2rem 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
            letter-spacing: 0.2px;
        }
        .hud-pill.gold {
            color: var(--gold);
        }
        .hud-energybar {
            width: 56px;
            height: 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.20);
            overflow: hidden;
            flex-shrink: 0;
        }
        .hud-energyfill {
            height: 100%;
            background: linear-gradient(90deg, #f5c842, #e8a030);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .hud-iconrow {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }
        .hud-icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(20, 12, 4, 0.55);
            border: 1.5px solid rgba(255, 255, 255, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #fff;
            backdrop-filter: blur(4px);
            transition: transform 0.12s, background 0.2s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .hud-icon-btn:active {
            transform: scale(0.92);
        }
        .hud-icon-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: 0.55rem;
            font-weight: 800;
            border-radius: 10px;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 2px 6px rgba(217, 74, 90, 0.4);
        }

        .hud-topleft {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }
        .hud-topleft>* {
            pointer-events: auto;
        }
        .hud-xp {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(20, 12, 4, 0.55);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 0.2rem 0.6rem;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .hud-xp .xp-bar {
            width: 68px;
            height: 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.20);
            overflow: hidden;
        }
        .hud-xp .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #8ad07a, #4a9a5a);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .hud-xp .xp-lbl {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        /* -------- HOTBAR -------- */
        .hotbar {
            position: absolute;
            left: 50%;
            bottom: 60px;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 5px;
            background: rgba(20, 12, 4, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 5px 8px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }
        .hotbar .slot {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 250, 240, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: auto;
            transition: background 0.2s;
        }
        .hotbar .slot .sicon2 {
            font-size: 1.1rem;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));

            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);

        .toast-hint {
            position: absolute;
            left: 50%;
            top: 14px;
            transform: translateX(-50%);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            pointer-events: none;
            animation: hintIn 0.3s ease;
        }
        @keyframes hintIn {
            0% {
                transform: translateX(-50%) translateY(-10px);
                opacity: 0;
            }
            100% {
                transform: translateX(-50%) translateY(0);
                opacity: 1;

            position: fixed;

            font-family: 'Quicksand', sans-serif;

            color: var(--gold);
        }
        .floatpop.bad {

            position: fixed;
            left: 50%;
            top: 16px;
            transform: translateX(-50%);

            background: var(--panel);
            border: 2px solid var(--line);
            border-radius: 16px;

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: toastIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2), toastOut 0.3s ease 2.4s forwards;

        @keyframes toastIn {
            0% {
                transform: translate(-50%, -20px);

            100% {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        @keyframes toastOut {

                transform: translate(-50%, -12px);

                { id: 'item-fertilizer', name: 'Phân bón tốc độ', icon: '🧪', desc: 'Dùng để cây chín ngay lập tức (dùng 1 lần).',
                    cost: 15, kind: 'consumable', flag: 'fertilizer' },
            ];

            // ZONES
            var ZONES = {

                },

                        { id: 'wolf', name: 'Sói', icon: '🐺', hp: 20, maxHp: 20, rewardCoins: 10, rewardXp: 5 },

                    ],
                    boss: null,

                },
                mountain: {
                    name: 'Núi',

                    monsters: [
                        { id: 'golem', name: 'Golem', icon: '🗿', hp: 40, maxHp: 40, rewardCoins: 20, rewardXp: 10 },
                        { id: 'dragon', name: 'Rồng non', icon: '🐉', hp: 60, maxHp: 60, rewardCoins: 30, rewardXp: 15 }
                    ],
                    boss: null,
                    hasFarm: false,
                    hasResources: false
                },
                dungeon: {
                    name: 'Hang động',

                    boss: { id: 'boss', name: 'Boss Quỷ', icon: '👹', hp: 120, maxHp: 120, rewardCoins: 100,

            var SPOTS = {
                idle: { x: 50, y: 80 },
                tree: { x: 22, y: 46 },
                stone: { x: 70, y: 70 },
                gold: { x: 78, y: 50 },
                dig: { x: 58, y: 56 },
                farm: { x: 15, y: 24 },
                monster1: { x: 30, y: 35 },
                monster2: { x: 70, y: 30 },
                boss: { x: 50, y: 25 },
            };

            var ACTION_TOOL = { chop: '🪓', stone: '⛏️', gold: '⛏️', dig: '🗺️' };
            var ACTION_CLASS = { chop: 'act-swing', stone: 'act-swing', gold: 'act-swing', dig: 'act-dig' };

            // ========== STATE ==========
            var STORE_KEY = 'little-village-save';

            function initMonsterState() {
                var m = {};
                Object.keys(ZONES).forEach(function(zoneKey) {
                    var zone = ZONES[zoneKey];
                    zone.monsters.forEach(function(mon) {
                        m[zoneKey + '-' + mon.id] = { hp: mon.maxHp, maxHp: mon.maxHp, alive: true,
                            respawnTimer: null };
                    });
                    if (zone.boss) {
                        m[zoneKey + '-boss'] = { hp: zone.boss.maxHp, maxHp: zone.boss.maxHp, alive: true,
                            respawnTimer: null };
                    }
                });
                return m;
            }

            function defaultState() {
                return {
                    coins: 30,
                    energy: 50,
                    maxEnergy: 50,
                    level: 1,
                    xp: 0,
                    xpToNext: 100,
                    resources: { wood: 0, stone: 0, gold_ore: 0, wheat: 0 },
                    items: { pickaxe: false, wateringCan: false, fertilizer: 0 },
                    buildings: {
                        house: { level: 1 },
                        farm: { level: 1 },
                        mine: { level: 0 },
                        shop: { level: 1 },
                        land: { level: 0 },
                    },
                    plots: [{ state: 'empty' }, { state: 'empty' }],
                    quests: {},
                    stats: { totalWood: 0, totalWheat: 0, mapFragments: 0, mineUnlocked: 0, toolsBought: 0 },
                    day: 1,
                    monsters: initMonsterState(),
                };
            }

            function loadState() {
                try {
                    var raw = localStorage.getItem(STORE_KEY);
                    if (raw) {
                        var parsed = JSON.parse(raw);
                        var def = defaultState();
                        if (!parsed.monsters) parsed.monsters = def.monsters;
                        return Object.assign(def, parsed);
                    }
                } catch (e) {}
                return defaultState();
            }

            function saveState() {
                try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
                broadcastState();
            }

            function broadcastState() {
                try {
                    window.parent.postMessage({
                        type: 'state-update',
                        data: {
                            type: 'play-to-win',
                            coins: state.coins,
                            resources: Object.keys(state.resources).map(function(k) {
                                return { id: k, quantity: state.resources[k], maxCapacity: RES_DEF[k].cap };
                            }),
                            quests: QUEST_DEFS.map(function(q) {
                                return { id: q.id, progress: questProgress(q), target: q.target,
                                    claimed: !!state.quests[q.id] };
                            }),
                            buildings: Object.keys(state.buildings).map(function(k) {
                                return { id: k, level: state.buildings[k].level };
                            }),
                        }
                    }, '*');
                } catch (e) {}
            }

            function sendQuit() { try { window.parent.postMessage({ type: 'quit' }, '*'); } catch (e) {} }

            window.addEventListener('message', function(e) {
                if (!e.data || typeof e.data !== 'object') return;
                if (e.data.type === 'init' && e.data.data) {
                    state = Object.assign(defaultState(), e.data.data);
                    if (screen === 'playing') renderPlaying();
                }
            });

            var state = loadState();
            var screen = 'menu';
            var openPanelName = null;
            var optionsSubTab = 'build';
            var clockMinutes = 6 * 60;
            var root = document.getElementById('root');
            var tickInterval = null;
            var currentZone = 'village';
            var actionBusy = false;
            var charTimers = [];

            function clearCharTimers() { charTimers.forEach(clearTimeout);
                charTimers = []; }

            function render() { if (screen === 'menu') return renderMenu(); if (screen === 'playing') return renderPlaying(); }

            // ========== MENU ==========
            function renderMenu() {
                stopTick();
                var hasSave = state.coins > 30 || state.level > 1 || Object.keys(state.quests).length > 0;
                root.innerHTML =
                    '<div class="screen">' +
                    '<div class="card-glow anim-pop">' +
                    '<span class="hero-icon">🏡</span>' +
                    '<h1>LÀNG NHỎ CỦA TÔI</h1>' +
                    '<p class="sub">Xây dựng làng, chiến đấu với quái vật, thu thập tài nguyên và chinh phục boss!</p>' +
                    '<button id="btn-play" class="glow-btn primary">▶ ' + (hasSave ? 'Tiếp tục chơi' : 'Bắt đầu') +
                    '</button>' +
                    (hasSave ? '<button id="btn-reset" class="glow-btn danger" style="margin-top:0.5rem;font-size:0.8rem;">♻️ Chơi lại từ đầu</button>' :
                        '') +
                    '<div class="menu-stats">' +
                    '<div class="stat"><div class="num">🪙 ' + state.coins + '</div><div class="lbl">Xu hiện có</div></div>' +
                    '<div class="stat"><div class="num green">Lv.' + state.level + '</div><div class="lbl">Cấp độ</div></div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
                document.getElementById('btn-play').onclick = function() { screen = 'playing';
                    renderPlaying();
                    startTick(); };
                var resetBtn = document.getElementById('btn-reset');
                if (resetBtn) resetBtn.onclick = function() { state = defaultState();
                    saveState();
                    render(); };
            }

            // ========== TICK ==========
            function startTick() {
                stopTick();
                tickInterval = setInterval(function() {
                    var changed = false;
                    clockMinutes += 4;
                    if (clockMinutes >= 26 * 60) { clockMinutes = 6 * 60;
                        state.day = (state.day || 1) + 1; }
                    updateClock();
                    if (state.energy < state.maxEnergy) {
                        state._energyAcc = (state._energyAcc || 0) + 1;
                        if (state._energyAcc >= 4) { state._energyAcc = 0;
                            state.energy = Math.min(state.maxEnergy, state.energy + 1);
                            changed = true; }
                    }
                    state.plots.forEach(function(p) {
                        if (p.state === 'growing') {
                            p.remaining = Math.max(0, p.remaining - 1000);
                            if (p.remaining <= 0) { p.state = 'ready'; }
                            changed = true;
                        }
                    });
                    Object.keys(state.monsters).forEach(function(key) {
                        var m = state.monsters[key];
                        if (!m.alive && m.respawnTimer === null) {
                            m.respawnTimer = setTimeout(function() {
                                m.alive = true;
                                m.hp = m.maxHp;
                                m.respawnTimer = null;
                                if (screen === 'playing' && currentZone === key.split('-')[0]) {
                                    renderZoneScene();
                                }
                                saveState();
                            }, 5000);
                        }
                    });
                    if (changed && screen === 'playing') {
                        updateHud();
                        if (openPanelName === null) renderZoneScene();
                    }
                }, 1000);
            }

            function stopTick() { if (tickInterval) { clearInterval(tickInterval);
                    tickInterval = null; } }

            function formatClock() {
                var h24 = Math.floor(clockMinutes / 60) % 24,
                    m = clockMinutes % 60;
                var ampm = h24 >= 12 ? 'ch' : 'sa';
                var h12 = h24 % 12;
                if (h12 === 0) h12 = 12;
                return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
            }

            function updateClock() {
                var c = document.getElementById('hud-clock');
                if (c) c.textContent = formatClock();
                var d = document.getElementById('hud-day');
                if (d) d.textContent = 'Ngày ' + (state.day || 1);
            }

            // ========== PLAYING ==========
            function renderPlaying() {
                clearCharTimers();
                root.innerHTML =
                    '<div class="game-screen">' +
                    '<div class="scene" id="scene">' +
                    '<div class="grass-edge top"></div>' +
                    '<div class="grass-edge bottom"></div>' +
                    '<div class="pond" id="sc-pond" style="left:82%;top:74%;width:20%;height:20%;"></div>' +
                    '<div class="farm-patch" id="sc-farm" style="left:2%;top:8%;"></div>' +
                    '<div id="sc-hotspots"></div>' +
                    '<div id="monster-container"></div>' +
                    '<div class="villager-pos" id="villager-pos" style="left:' + SPOTS.idle.x + '%;top:' + SPOTS.idle.y +
                    '%;">' + VILLAGER_SVG + '</div>' +
                    '</div>' +

                    '<div class="hud-topleft">' +
                    '<div class="hud-xp"><span class="xp-lbl">Lv.' + state.level + '</span>' +
                    '<div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:' + (state.xp / state.xpToNext *
                        100) + '%;"></div></div>' +
                    '</div>' +
                    '</div>' +

                    '<div class="hud-topright">' +
                    '<div class="hud-pill">🕐 <span id="hud-clock">' + formatClock() + '</span> · <span id="hud-day">Ngày ' + (
                        state.day || 1) + '</span></div>' +
                    '<div class="hud-pill gold">🪙 <span id="hud-coins">' + state.coins + '</span></div>' +
                    '<div class="hud-pill">⚡ <span id="hud-energy">' + Math.floor(state.energy) + '</span>/<span id="hud-maxenergy">' +
                    state.maxEnergy + '</span>' +
                    '<div class="hud-energybar"><div class="hud-energyfill" id="energy-fill" style="width:' + (state
                        .energy / state.maxEnergy * 100) + '%;"></div></div>' +
                    '</div>' +
                    '<div class="hud-iconrow">' +
                    '<button class="hud-icon-btn" id="btn-open-quest" title="Nhiệm vụ">📜<span class="badge hidden" id="quest-badge">0</span></button>' +
                    '<button class="hud-icon-btn" id="btn-open-options" title="Tùy chọn">☰</button>' +
                    '</div>' +
                    '</div>' +

                    '<div class="hotbar">' +
                    Object.keys(RES_DEF).map(function(k) {
                        var d = RES_DEF[k];
                        return '<div class="slot"><span class="sicon2">' + d.icon +
                            '</span><span class="sqty font-mono" id="hb-' + k + '">' + state.resources[k] +
                            '</span></div>';
                    }).join('') +
                    '</div>' +

                    '<div class="zone-nav" id="zone-nav">' +
                    Object.keys(ZONES).map(function(key) {
                        var z = ZONES[key];
                        return '<button class="zone-btn' + (key === currentZone ? ' active' : '') +
                            '" data-zone="' + key + '">' +
                            '<span class="zicon">' + z.icon + '</span>' +
                            '<span class="zlabel">' + z.name + '</span>' +
                            '</button>';
                    }).join('') +
                    '</div>' +
                    '</div>';

                document.getElementById('btn-open-quest').onclick = function() { openPanel('quest'); };
                document.getElementById('btn-open-options').onclick = function() { openPanel('options'); };
                document.getElementById('scene').onclick = onSceneClick;

                document.querySelectorAll('.zone-btn').forEach(function(btn) {
                    btn.onclick = function() {
                        var zone = btn.dataset.zone;
                        if (zone && zone !== currentZone) {
                            currentZone = zone;
                            renderPlaying();
                            renderZoneScene();
                            updateHud();
                        }
                    };
                });

                renderZoneScene();
                updateQuestBadge();
            }

            function updateHud() {
                var c = document.getElementById('hud-coins');
                if (c) c.textContent = state.coins;
                var e = document.getElementById('hud-energy');
                if (e) e.textContent = Math.floor(state.energy);
                var me = document.getElementById('hud-maxenergy');
                if (me) me.textContent = state.maxEnergy;
                var ef = document.getElementById('energy-fill');
                if (ef) ef.style.width = (state.energy / state.maxEnergy * 100) + '%';
                var xf = document.getElementById('xp-fill');
                if (xf) xf.style.width = (state.xp / state.xpToNext * 100) + '%';
                var xl = document.querySelector('.hud-xp .xp-lbl');
                if (xl) xl.textContent = 'Lv.' + state.level;
                Object.keys(RES_DEF).forEach(function(k) {
                    var el = document.getElementById('hb-' + k);
                    if (el) el.textContent = state.resources[k];
                });
                updateClock();
                updateQuestBadge();
            }

            function updateQuestBadge() {
                var n = 0;
                QUEST_DEFS.forEach(function(q) { if (!state.quests[q.id] && questProgress(q) >= q.target) n++; });
                var b = document.getElementById('quest-badge');
                if (b) { if (n > 0) { b.textContent = n;
                        b.classList.remove('hidden'); } else { b.classList.add('hidden'); } }
            }

            // ========== RENDER ZONE SCENE ==========
            function renderZoneScene() {
                var zone = ZONES[currentZone];
                if (!zone) return;

                var farmEl = document.getElementById('sc-farm');
                if (farmEl) {
                    if (zone.hasFarm && state.buildings.farm.level >= 1) {
                        farmEl.style.display = 'block';
                        renderFarmPatch();
                    } else {
                        farmEl.style.display = 'none';
                    }
                }

                var hs = document.getElementById('sc-hotspots');
                if (zone.hasResources && currentZone === 'village') {
                    hs.style.display = 'block';
                    renderVillageHotspots(hs);
                } else {
                    hs.style.display = 'none';
                }

                renderMonsters(zone);
            }

            function renderVillageHotspots(hs) {
                var html = '';
                var energyLowChop = state.energy < ACTIONS.chop.energy;
                html += '<div class="hotspot' + (energyLowChop ? ' energy-low' : '') + '" data-chop="1" style="left:' + SPOTS
                    .tree.x + '%;top:' + SPOTS.tree.y + '%;">' +
                    '<span class="hp-tag">🪓 Chặt cây (⚡' + ACTIONS.chop.energy + ')</span>' +

                    '<circle cx="24" cy="55" r="17" fill="#5aa06c"/>' +
                    '<circle cx="66" cy="55" r="17" fill="#5aa06c"/>' +
                    '</svg></div>';

                var mineUnlocked = state.buildings.mine.level >= 1;
                var stoneLocked = !mineUnlocked || !state.items.pickaxe;
                html += '<div class="hotspot' + (stoneLocked ? ' locked' : (state.energy < ACTIONS.stone.energy ?
                    ' energy-low' : '')) + '" data-stone="1" style="left:' + SPOTS.stone.x + '%;top:' + SPOTS.stone.y +
                    '%;">' +
                    '<span class="hp-tag">' + (stoneLocked ? '🔒 Cần Hầm mỏ + Cuốc chim' : '🪨 Khai đá (⚡' + ACTIONS
                    .stone.energy + ')') + '</span>' +
                    '<svg viewBox="0 0 70 50" width="56" height="40"><ellipse cx="35" cy="38" rx="30" ry="10" fill="#a89f8a"/><circle cx="22" cy="26" r="14" fill="#948a75"/><circle cx="46" cy="22" r="17" fill="#a89f8a"/><circle cx="55" cy="34" r="10" fill="#8b8270"/></svg>' +
                    '</div>';

                var goldLocked = !mineUnlocked || !state.items.pickaxe;
                html += '<div class="hotspot' + (goldLocked ? ' locked' : (state.energy < ACTIONS.gold.energy ?

                    '<svg viewBox="0 0 60 46" width="48" height="36"><ellipse cx="30" cy="36" rx="26" ry="8" fill="#8b8270"/><circle cx="20" cy="22" r="13" fill="#9c927a"/><circle cx="40" cy="20" r="15" fill="#a89f8a"/><circle cx="18" cy="18" r="2.4" fill="#ffd166"/><circle cx="34" cy="14" r="2" fill="#ffd166"/><circle cx="42" cy="24" r="2.2" fill="#ffd166"/></svg>' +
                    '</div>';

                html += '<div class="hotspot' + (state.energy < ACTIONS.dig.energy ? ' energy-low' : '') + '" data-dig="1" style="left:' +
                    SPOTS.dig.x + '%;top:' + SPOTS.dig.y + '%;">' +
                    '<span class="hp-tag">🗺️ Đào kho báu (⚡' + ACTIONS.dig.energy + ')</span>' +

                    '</div>';

                html += '<div class="hotspot decor" data-openbuild="house" style="left:88%;top:16%;"><span class="hp-tag">Nhà ở Lv.' +

            // SVG helpers
            function houseSvg(level) {
                var chimney = level >= 4 ? '<rect x="40" y="6" width="8" height="14" fill="#7a4f2a"/>' : '';
                var floor2 = level >= 3 ?
                    '<rect x="14" y="14" width="36" height="16" fill="#f3ecd6" stroke="#7a4f2a" stroke-width="2"/>' : '';
                var windows = level >= 2 ?
                    '<rect x="18" y="34" width="8" height="8" fill="#eaf6ff" stroke="#7a4f2a"/><rect x="38" y="34" width="8" height="8" fill="#eaf6ff" stroke="#7a4f2a"/>' :
                    '';
                var flowers = level >= 5 ?
                    '<rect x="12" y="46" width="10" height="4" fill="#d1495b"/><rect x="42" y="46" width="10" height="4" fill="#e0a72e"/>' :
                    '';
                return '<svg viewBox="0 0 64 60" width="50" height="46">' + chimney +
                    '<polygon points="6,30 32,8 58,30" fill="#a9713f"/>' + floor2 +
                    '<rect x="14" y="30" width="36" height="20" fill="#fffaf0" stroke="#7a4f2a" stroke-width="2"/>' +
                    windows + '<rect x="27" y="38" width="10" height="12" fill="#7a4f2a"/>' + flowers + '</svg>';
            }

            function shopSvg(level) {
                var goods = level >= 2 ?
                    '<circle cx="20" cy="42" r="4" fill="#e0a72e"/><circle cx="30" cy="42" r="4" fill="#d1495b"/><circle cx="40" cy="42" r="4" fill="#5aa06c"/>' :
                    '<circle cx="30" cy="42" r="4" fill="#e0a72e"/>';
                var n = level >= 3 ? 5 : 3;
                var stripes = '';
                var sw = 50 / n;
                for (var i = 0; i < n; i++) {
                    stripes += '<rect x="' + (5 + i * sw) + '" y="14" width="' + sw + '" height="8" fill="' + (i % 2 ===
                        0 ? '#d1495b' : '#fffaf0') + '"/>';
