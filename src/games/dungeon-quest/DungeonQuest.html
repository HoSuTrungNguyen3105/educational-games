<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hầm Ngục Bí Ẩn</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF7EE;--ink:#20283A;--card:#FFFFFF;--line:#E7D9BE;--teal:#1B998B;--orange:#E4572E;--yellow:#F4B942;--purple:#B58AFF;--dark:#170F28;--darkMid:#2E1F4A;--gold:#F4B942;--red:#E4572E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--dark);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;background:#fff;border-bottom:1px solid rgba(0,0,0,.06);flex-wrap:wrap;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{font-size:32px}
.header-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:var(--purple)}
.header-stats{display:flex;align-items:center;gap:20px;font-size:14px;color:rgba(32,40,58,.7);font-family:'Nunito',sans-serif;flex-wrap:wrap}
.header-stats span{display:flex;align-items:center;gap:4px}
.header-stats b{color:var(--ink);font-family:'JetBrains Mono',monospace}
.btn-quit{font-family:'Poppins',sans-serif;font-size:13px;border:1.5px solid rgba(181,138,255,.4);border-radius:16px;padding:8px 16px;color:var(--purple);background:transparent;cursor:pointer;transition:opacity .15s}
.btn-quit:hover{opacity:.8}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px 24px;gap:20px;overflow-y:auto;background:radial-gradient(120% 140% at 50% 0%,var(--darkMid) 0%,var(--dark) 60%)}
.bars-row{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar-card{flex:1;padding:16px;border-radius:16px;background:var(--card);box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--line)}
.bar-card.shake{animation:shakeHit .4s ease}
.bar-label{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label.right{justify-content:flex-end}
.bar-label-text{font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;color:var(--ink)}
.bar-label-icon{font-size:24px}
.bar-hp{width:100%;height:12px;background:rgba(32,40,58,.1);border-radius:6px;overflow:hidden}
.bar-hp-fill{height:100%;border-radius:6px;transition:width .5s ease}
.bar-hp-fill.hero{background:var(--teal)}
.bar-hp-fill.monster{background:var(--orange);margin-left:auto}
.sword-icon{font-size:32px;color:rgba(255,255,255,.6)}
.monster-display{text-align:center}
.monster-emoji{font-size:80px;animation:popIn .4s ease}
.monster-emoji.key-bump{animation:popIn .3s ease}
.question-card{width:100%;max-width:560px;padding:24px;border-radius:16px;background:var(--card);box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--line)}
.question-label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;color:#8A7C63;letter-spacing:.5px}
.question-text{font-family:'Poppins',sans-serif;font-weight:600;font-size:18px;line-height:1.5;color:var(--ink);margin:8px 0 24px}
.options{display:flex;flex-direction:column;gap:12px}
.option-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 20px;border-radius:16px;border:2px solid rgba(32,40,58,.12);background:var(--card);font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .2s}
.option-btn:hover:not(:disabled){border-color:rgba(139,111,241,.5)}
.option-btn.correct{border-color:var(--teal);background:rgba(27,153,139,.1)}
.option-btn.wrong{border-color:var(--orange);background:rgba(228,87,46,.1)}
.option-btn:disabled{cursor:default}
.option-btn.dimmed{opacity:.5}
.opt-letter{width:32px;height:32px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;flex-shrink:0}
.option-btn.correct .opt-letter{border-color:var(--teal);color:var(--teal)}
.option-btn.wrong .opt-letter{border-color:var(--orange);color:var(--orange)}
.option-mark{margin-left:auto;font-size:16px;flex-shrink:0}
.result-msg{text-align:center;margin-top:16px;font-family:'Poppins',sans-serif;font-weight:600;font-size:15px}
.result-msg.win{color:var(--teal)}
.result-msg.lose{color:var(--orange)}
.explain-box{margin-top:16px;padding:12px 16px;background:rgba(244,185,66,.1);border:1px solid rgba(244,185,66,.4);border-radius:12px;font-size:13px;line-height:1.6;color:var(--ink)}
.explain-label{font-weight:600;color:#8a6a10}
/* Attack Options */
.attack-panel{width:100%;max-width:560px;margin-top:8px}
.attack-label{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--purple);margin-bottom:12px;text-align:center}
.attack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.attack-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:2px solid rgba(181,138,255,.25);background:rgba(255,255,255,.06);cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif;text-align:center}
.attack-btn:hover{border-color:var(--purple);background:rgba(181,138,255,.12);transform:translateY(-2px)}
.attack-btn:active{transform:scale(.96)}
.attack-icon{font-size:28px}
.attack-name{font-weight:700;font-size:12px;color:#fff}
.attack-desc{font-size:10px;color:rgba(255,255,255,.6);line-height:1.3}
.attack-btn.critical{border-color:rgba(228,87,46,.4)}
.attack-btn.critical:hover{border-color:var(--red);background:rgba(228,87,46,.15)}
.attack-btn.heal{border-color:rgba(27,153,139,.4)}
.attack-btn.heal:hover{border-color:var(--teal);background:rgba(27,153,139,.15)}
.attack-btn.guard{border-color:rgba(244,185,66,.4)}
.attack-btn.guard:hover{border-color:var(--gold);background:rgba(244,185,66,.15)}
.attack-btn.flash{border-color:rgba(139,111,241,.4)}
.attack-btn.flash:hover{border-color:var(--purple);background:rgba(139,111,241,.15)}
.attack-btn.ultimate{border-color:rgba(255,215,0,.5);background:rgba(255,215,0,.08)}
.attack-btn.ultimate:hover{border-color:#FFD700;background:rgba(255,215,0,.2)}
/* Floating damage numbers */
.float-text{position:fixed;pointer-events:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:24px;z-index:100;animation:floatUp .8s ease-out forwards}
.float-text.damage{color:var(--red)}
.float-text.heal{color:var(--teal)}
.float-text.shield{color:var(--gold)}
.float-text.bonus{color:var(--purple)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
@keyframes shakeHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 8px rgba(181,138,255,.3)}50%{box-shadow:0 0 20px rgba(181,138,255,.6)}}
.hero-shield{animation:pulseGlow 1.5s ease infinite}
@media(max-width:640px){
  .header{padding:8px 12px}
  .header-title{font-size:16px}
  .game-area{padding:12px 12px 16px;gap:14px}
  .bar-card{padding:12px}
  .monster-emoji{font-size:56px}
  .question-card{padding:16px}
  .question-text{font-size:15px}
  .option-btn{padding:10px 14px;font-size:13px}
  .attack-grid{grid-template-columns:repeat(2,1fr)}
  .attack-btn{padding:10px 6px}
}
</style>
</head>
<body>
<div id="api_submit"></div>
<div class="header">
  <div class="header-left">
    <span class="header-icon">🗡️</span>
    <span class="header-title">HẦM NGỤC BÍ ẨN</span>
  </div>
  <div class="header-stats">
    <span>Phòng: <b id="gameCode">---</b></span>
    <span>📋 <span id="progressLabel">Chặng: 0/0</span></span>
    <span style="color:#4CAF7D">⏱ <span id="timerDisplay">0s</span></span>
    <span>💰 <b id="coinDisplay">0</b></span>
    <span>⭐ Điểm: <b id="scoreDisplay">0</b></span>
  </div>
  <button class="btn-quit" id="btnQuit">Thoát</button>
</div>

<div class="game-area">
  <div class="bars-row">
    <div class="bar-card" id="heroBarCard">
      <div class="bar-label">
        <span class="bar-label-icon">🛡️</span>
        <span class="bar-label-text">Anh hùng</span>
      </div>
      <div class="bar-hp"><div class="bar-hp-fill hero" id="heroHpBar" style="width:100%"></div></div>
    </div>
    <span class="sword-icon">⚔️</span>
    <div class="bar-card" id="monsterBarCard">
      <div class="bar-label right">
        <span class="bar-label-text">Quái vật</span>
        <span class="bar-label-icon" id="monsterBarIcon">👹</span>
      </div>
      <div class="bar-hp"><div class="bar-hp-fill monster" id="monsterHpBar" style="width:100%"></div></div>
    </div>
  </div>

  <div class="monster-display">
    <div class="monster-emoji" id="monsterEmoji">👹</div>
  </div>

  <div class="question-card">
    <span class="question-label" id="questionLabel">Trả lời đúng để tung đòn chí mạng</span>
    <p class="question-text" id="questionText">Đang tải câu hỏi...</p>
    <div class="options" id="optionsContainer"></div>
    <div id="resultArea"></div>
  </div>

  <div class="attack-panel" id="attackPanel" style="display:none">
    <p class="attack-label">⚔️ Chọn cách tấn công</p>
    <div class="attack-grid" id="attackGrid"></div>
  </div>
</div>

<script>
(function(){
var MONSTERS=["\u{1F409}","\u{1F479}","\u{1F9DF}","\u{1F982}","\u{1F987}","\u{1F40D}","\u{1F47B}","\u{1F577}\uFE0F"];
var LETTERS=["A","B","C","D"];

/* ── Attack Definitions ── */
var ATTACKS=[
  {id:"slash",icon:"\u2694\uFE0F",name:"Chém thường",desc:"Tiêu diệt quái vật, không có hiệu ứng đặc biệt",cls:""},
  {id:"critical",icon:"\u{1F4A5}",name:"Đòn chí mạng",desc:"+50 điểm, -5 HP (rủi ro)",cls:"critical"},
  {id:"heal",icon:"\u{2764}\uFE0F",name:"Hồi phục",desc:"Tiêu diệt + hồi 25 HP",cls:"heal"},
  {id:"guard",icon:"\u{1F6E1}\uFE0F",name:"Phòng thủ",desc:"Chắn 100% sát thương lượt sau",cls:"guard"},
  {id:"flash",icon:"\u{26A1}",name:"Tốc biến",desc:"Tiêu diệt + lượt sau +5s",cls:"flash"},
  {id:"ultimate",icon:"\u{1F525}",name:"Bùng nổ",desc:"+100 điểm, -10 HP (rủi ro lớn)",cls:"ultimate"}
];

/* ── State ── */
var questions=[],currentIndex=0,startTime=0,answered=false;
var score=0,correctCount=0,heroHp=100,monsterHp=100;
var timerInterval=null,timeLeft=0;
var flashTimeout=null;
var shieldActive=false,timeBonusNext=0;
var pendingCorrect=false,pendingQ=null,pendingBtns=null,pendingOptionId=null;
var userCoins=0;
var currentGameId=null;

function broadcastState(){
  try{window.parent.postMessage({type:'state-update',data:{type:'play-to-win',coins:userCoins+score}},'*');}catch(e){}
}

/* ── DOM refs ── */
var heroBarCard=document.getElementById("heroBarCard");
var monsterBarCard=document.getElementById("monsterBarCard");
var heroHpBar=document.getElementById("heroHpBar");
var monsterHpBar=document.getElementById("monsterHpBar");
var monsterBarIcon=document.getElementById("monsterBarIcon");
var monsterEmoji=document.getElementById("monsterEmoji");
var questionText=document.getElementById("questionText");
var questionLabel=document.getElementById("questionLabel");
var optionsContainer=document.getElementById("optionsContainer");
var resultArea=document.getElementById("resultArea");
var progressLabel=document.getElementById("progressLabel");
var timerDisplay=document.getElementById("timerDisplay");
var scoreDisplay=document.getElementById("scoreDisplay");
var attackPanel=document.getElementById("attackPanel");
var attackGrid=document.getElementById("attackGrid");

function timerColor(pct){return pct>50?"#4CAF7D":pct>20?"#F4B942":"#E4572E"}

function updateBars(){
  heroHpBar.style.width=heroHp+"%";
  monsterHpBar.style.width=monsterHp+"%";
  heroBarCard.classList.remove("shake");
  monsterBarCard.classList.remove("shake");
  heroBarCard.classList.toggle("hero-shield",shieldActive);
}

function flash(type){
  if(type==="hero")heroBarCard.classList.add("shake");
  else if(type==="monster")monsterBarCard.classList.add("shake");
  clearTimeout(flashTimeout);
  flashTimeout=setTimeout(function(){
    heroBarCard.classList.remove("shake");
    monsterBarCard.classList.remove("shake");
  },400);
}

function floatText(txt,cls){
  var el=document.createElement("div");
  el.className="float-text "+cls;
  el.textContent=txt;
  el.style.left=Math.round(window.innerWidth/2-40+Math.random()*80)+"px";
  el.style.top=Math.round(window.innerHeight/2-20)+"px";
  document.body.appendChild(el);
  setTimeout(function(){el.remove()},900);
}

function getMonster(){return MONSTERS[currentIndex%MONSTERS.length]}

function renderQuestion(){
  if(currentIndex>=questions.length){endGame();return}
  answered=false;
  pendingCorrect=false;
  var q=questions[currentIndex];
  timeLeft=q.timeLimit||15;
  if(timeBonusNext>0){timeLeft+=timeBonusNext;timeBonusNext=0}
  monsterHp=100;
  resultArea.innerHTML="";
  attackPanel.style.display="none";
  attackGrid.innerHTML="";
  questionLabel.textContent="Trả lời đúng để tung đòn chí mạng";

  monsterEmoji.textContent=getMonster();
  monsterEmoji.classList.remove("key-bump");
  void monsterEmoji.offsetWidth;
  monsterEmoji.classList.add("key-bump");
  monsterBarIcon.textContent=getMonster();
  progressLabel.textContent="Chặng: "+(currentIndex+1)+"/"+questions.length;
  questionText.textContent=q.content;

  updateBars();
  updateTimer();
  startTimer();
  renderOptions(q);
}

function renderOptions(q){
  optionsContainer.innerHTML="";
  for(var i=0;i<q.options.length;i++){
    (function(opt,idx){
      var btn=document.createElement("button");
      btn.className="option-btn";
      btn.innerHTML='<span class="opt-letter">'+LETTERS[idx]+'</span><span>'+opt.content+'</span>';
      btn.onclick=function(){handleAnswer(opt.id)};
      optionsContainer.appendChild(btn);
    })(q.options[i],i);
  }
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){clearInterval(timerInterval);if(!answered)handleAnswer(null)}
  },1000);
}

function updateTimer(){
  var q=questions[currentIndex];
  var tl=q?q.timeLimit:15;
  var pct=Math.max((timeLeft/tl)*100,0);
  timerDisplay.textContent=timeLeft+"s";
  timerDisplay.parentElement.style.color=timerColor(pct);
}

/* ── Handle Answer ── */
function handleAnswer(optionId){
  if(answered)return;
  answered=true;
  clearInterval(timerInterval);

  var q=questions[currentIndex];
  var btns=Array.from(optionsContainer.querySelectorAll(".option-btn"));
  btns.forEach(function(b){b.disabled=true});

  function finishCheck(isCorrect,correctAnswerId){
    btns.forEach(function(b,idx){
      var opt=q.options[idx];
      if(!opt)return;
      if(opt.id===correctAnswerId)b.classList.add("correct");
      if(opt.id===optionId&&!isCorrect)b.classList.add("wrong");
      if(opt.id!==correctAnswerId&&opt.id!==optionId)b.classList.add("dimmed");
      if(opt.id===correctAnswerId){
        var mark=document.createElement("span");
        mark.className="option-mark";
        mark.textContent="\u2694\uFE0F";
        b.appendChild(mark);
      }
    });

    if(isCorrect){
      flash("monster");
      pendingCorrect=true;
      pendingQ=q;
      pendingBtns=btns;
      pendingOptionId=optionId;
      showAttackOptions(q);
    }else{
      var dmg=shieldActive?0:20;
      if(shieldActive){floatText("Shield!","\u{1F6E1}\uFE0F");shieldActive=false}
      heroHp=Math.max(0,heroHp-dmg);
      if(dmg>0)floatText("-"+dmg,"damage");
      flash("hero");
      correctCount+=0;
      scoreDisplay.textContent=score;
      document.getElementById("coinDisplay").textContent=userCoins+score;
      broadcastState();
      updateBars();
      showResult(false,q,optionId,correctAnswerId);
    }
  }

  if(optionId!==null&&typeof window.apiSubmitAnswer==="function"){
    window.apiSubmitAnswer(q.id,optionId).then(function(response){
      var res = response && response.data ? response.data : response;
      finishCheck(res.correct===true||res.correct==="true",res.correctAnswer||q.correctAnswer);
    }).catch(function(){finishCheck(false,q.correctAnswer)});
  }else{
    finishCheck(optionId!==null&&optionId===q.correctAnswer,q.correctAnswer);
  }
}

/* ── Show Attack Options ── */
function showAttackOptions(q){
  questionLabel.textContent="⚔️ Chọn cách tấn công!";
  questionText.textContent="";
  optionsContainer.innerHTML="";
  resultArea.innerHTML="";
  attackPanel.style.display="block";
  attackGrid.innerHTML="";

  ATTACKS.forEach(function(atk){
    var btn=document.createElement("button");
    btn.className="attack-btn "+atk.cls;
    btn.innerHTML='<span class="attack-icon">'+atk.icon+'</span><span class="attack-name">'+atk.name+'</span><span class="attack-desc">'+atk.desc+'</span>';
    btn.onclick=function(){applyAttack(atk,q)};
    attackGrid.appendChild(btn);
  });
}

/* ── Apply Attack Effect ── */
function applyAttack(atk,q){
  var basePoints=q.points||100;
  var timeBonus=Math.round((timeLeft/(q.timeLimit||15))*40);
  var earned=basePoints+timeBonus;

  attackPanel.style.display="none";
  attackGrid.innerHTML="";

  switch(atk.id){
    case"slash":
      monsterHp=0;
      floatText("\u2694\uFE0F"+earned,"bonus");
      score+=earned;
      break;
    case"critical":
      monsterHp=0;
      earned+=50;
      heroHp=Math.max(0,heroHp-5);
      floatText("+50 crit!","\u{1F4A5}");
      floatText("-5 HP","damage");
      score+=earned;
      break;
    case"heal":
      monsterHp=0;
      heroHp=Math.min(100,heroHp+25);
      floatText("+25 HP","heal");
      score+=earned;
      break;
    case"guard":
      monsterHp=0;
      shieldActive=true;
      heroBarCard.classList.add("hero-shield");
      floatText("Shield ON!","\u{1F6E1}\uFE0F");
      score+=earned;
      break;
    case"flash":
      monsterHp=0;
      timeBonusNext=5;
      floatText("+5s","\u{26A1}");
      score+=earned;
      break;
    case"ultimate":
      monsterHp=0;
      earned+=100;
      heroHp=Math.max(0,heroHp-10);
      floatText("+100 ULT!","\u{1F525}");
      floatText("-10 HP","damage");
      score+=earned;
      break;
  }

  correctCount++;
  scoreDisplay.textContent=score;
  document.getElementById("coinDisplay").textContent=userCoins+score;
  broadcastState();
  updateBars();
  if(window.GameTaskBridge)GameTaskBridge.emit('ANSWER_CORRECT',{gameId:currentGameId});
  showResult(true,q,pendingOptionId,q.correctAnswer);
}

/* ── Show Result ── */
function showResult(isCorrect,q,optionId,correctAnswerId){
  var msgClass=isCorrect?"win":"lose";
  var msgText=isCorrect?"H\u1EA1 g\u1EE1c qu\u00E1i v\u1EADt! \uD83C\uDF89":"Qu\u00E1i v\u1EADt ph\u1EA3n \u0111\u00E1n, m\u1EA5t m\u00E1u r\u1ED3i!";
  if(shieldActive&&isCorrect)msgText+=" \u{1F6E1}\uFE0F Shield đang active!";
  var msgHtml='<p class="result-msg '+msgClass+'">'+msgText+'</p>';
  if(q.explanation){
    msgHtml+='<div class="explain-box"><span class="explain-label">\uD83D\uDCA1 Gi\u1EA3i th\u00EDch:</span> '+q.explanation+'</div>';
  }
  resultArea.innerHTML=msgHtml;
  setTimeout(function(){
    if(currentIndex+1<questions.length){currentIndex++;renderQuestion()}
    else endGame();
  },1400);
}

function endGame(){
  clearInterval(timerInterval);
  var timeUsed=Math.round((Date.now()-startTime)/1000);
  parent.postMessage({type:"game-over",data:{score:score,correct:correctCount,timeUsed:timeUsed,totalCoins:userCoins+score}},"*");
}

function handleMessage(e){
  if(!e.data||typeof e.data!=="object")return;
  if(e.data.type==="init"){
    var d=e.data.data||{};
    questions=d.questions||[];
    startTime=Date.now();
    score=0;correctCount=0;heroHp=100;monsterHp=100;
    currentIndex=0;shieldActive=false;timeBonusNext=0;
    userCoins=d.coins||0;
    scoreDisplay.textContent="0";
    document.getElementById("coinDisplay").textContent=userCoins;
    document.getElementById("gameCode").textContent=d.gameId||"";
    currentGameId=d.gameId||null;
    renderQuestion();
    if(window.GameTaskBridge)GameTaskBridge.emit('GAME_PLAYED',{gameId:currentGameId});
  }
}

document.getElementById("btnQuit").onclick=function(){
  parent.postMessage({type:"quit"},"*");
};

window.addEventListener("message",handleMessage);
parent.postMessage({type:"ready"},"*");
})();
</script>
</body>
</html>
