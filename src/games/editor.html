<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Trình chỉnh sửa game — Lớp Học Vui</title>
<style>
:root{--navy:#1D2E4A;--purple:#6C3BF5;--purple2:#5227D6;--bg:#F4F2FF;--line:#E3DEF8;--ink:#23223F;--mute:#6B6890;--ok:#12A07C;--bad:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;padding-bottom:88px}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:18px;line-height:1.1}
.brand small{display:block;font-weight:600;font-size:12px;color:#B8C4DC}
#saved{font-size:13px;font-weight:700;color:#7FF0C6;white-space:nowrap}
#saved.warn{color:#FFC98A}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top) + 56px);background:var(--bg);z-index:15}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--purple);border-color:var(--purple);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(60,40,140,.06)}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#6C3BF5,#8B5CF6);color:#fff}
.hero .ic{font-size:44px;line-height:1}
.hero h2{font-size:20px;line-height:1.1}
.hero p{font-size:14px;opacity:.9;margin-top:2px}
h3{font-size:16px;margin-bottom:8px}
.help{font-size:13px;color:var(--mute);margin-top:2px}
.field{padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0;padding-top:2px}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.val{color:var(--purple);font-weight:800;font-size:17px;min-width:44px;text-align:right}
input[type=range]{width:100%;accent-color:var(--purple);margin-top:6px;height:28px}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.badge{flex:0 0 auto;background:#EDE8FF;color:var(--purple2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.badge.bad{background:#FFE3E3;color:var(--bad)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:center}
.in{font:inherit;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;flex:1 1 90px;background:#fff;color:var(--ink)}
.in:focus{outline:none;border-color:var(--purple)}
.in.em{flex:0 0 58px;text-align:center;font-size:20px;padding:5px 4px}
.in.ltr{flex:0 0 52px;text-align:center;font-weight:800;text-transform:uppercase}
.in.clr{flex:0 0 52px;padding:2px;height:40px;cursor:pointer}
.in.wide{flex:2 1 140px}
.del{flex:0 0 auto;width:36px;height:36px;border:0;border-radius:10px;background:#FFF0F0;color:var(--bad);font-size:16px;font-weight:800;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:#EDE8FF;color:var(--purple2)}
.btn.pri{background:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purple2)}
.btn.grn{background:var(--ok);color:#fff}
.btn.gray{background:#F0EFF7;color:var(--mute)}
.btn:focus-visible,.tab:focus-visible,.del:focus-visible,summary:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
details.card>summary{cursor:pointer;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--mute)}
details[open].card>summary::after{content:"▴"}
details.card .inner{margin-top:10px}
select.in{flex:1 1 200px}
.tierrow{display:flex;gap:6px;align-items:center}
.tierrow .n{flex:0 0 46px;font-weight:800;color:var(--mute);font-size:14px}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.steps code,.note code{background:#EFEBFF;border-radius:6px;padding:1px 6px;font-size:13px}
.note{background:#FFF8E6;border:2px solid #FFE1A3;border-radius:14px;padding:10px 12px;font-size:14px}
textarea{width:100%;height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:12px;padding:10px;background:#FAF9FF;color:var(--ink);resize:vertical}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;justify-content:center;z-index:30}
#bar .btn{flex:1;max-width:280px;padding:13px 10px;font-size:15px}
#bar .btn[disabled]{opacity:.4;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
  <div class="brand">🛠️ Trình chỉnh sửa game<small>Lớp Học Vui</small></div>
  <div id="saved">✓ Đã lưu nháp</div>
</header>
<nav id="tabs" aria-label="Chọn game"></nav>
<main id="panel"></main>
<div id="bar">
  <button class="btn pri" id="btnPreview">👁 Xem thử</button>
  <button class="btn grn" id="btnDl">⬇ Tải config.js</button>
</div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".js,.json,.txt" hidden>

<script>
(function(){
const $=id=>document.getElementById(id);
const FILES={thienthach:'thien-thach-so.html',wordrush:'word-rush.html',comay:'co-may-bi-an.html',bongbay:'bong-bay-vui.html',bechon:'be-chon-dung.html'};
const META=[
  {k:'thienthach',icon:'🚀',name:'Thiên Thạch Số',desc:'Game Toán vũ trụ: bắn thiên thạch mang đáp án đúng.'},
  {k:'wordrush',icon:'🦊',name:'Word Rush',desc:'Chạy đua từ vựng tiếng Anh. Bạn tự thêm, sửa, xóa từ.'},
  {k:'comay',icon:'⚙️',name:'Cỗ Máy Bí Ẩn',desc:'Game suy luận tìm quy luật. Chỉnh độ khó và số ca chơi.'},
  {k:'bongbay',icon:'🎈',name:'Bóng Bay Vui',desc:'Chạm bong bóng đúng: số, đếm, chữ cái, màu sắc.'},
  {k:'bechon',icon:'🐻',name:'Bé Chọn Đúng',desc:'Game cực dễ cho bé nhỏ: con vật, trái cây, đếm, màu.'},
  {k:'export',icon:'📦',name:'Xuất & đăng',desc:''}
];
const TIER_DESC={1:'Mức 1 · Cộng đơn giản',2:'Mức 2 · Nhân hoặc trừ',3:'Mức 3 · Hai bước (nhân rồi cộng/trừ)',4:'Mức 4 · Cộng rồi nhân, bình phương',5:'Mức 5 · Bình phương nâng cao',6:'Mức 6 · Luật chữ số (rất khó)'};

/* ---------- dữ liệu mặc định (khớp với các game) ---------- */
const D=()=>JSON.parse(JSON.stringify({
  thienthach:{lives:3,levelEvery:5,speed:1,numScale:1},
  wordrush:{lives:3,levelEvery:6,speed:1,words:{
    fruit:[['🍎','apple','quả táo'],['🍌','banana','quả chuối'],['🍇','grape','quả nho'],['🍓','strawberry','dâu tây'],['🍊','orange','quả cam'],['🍉','watermelon','dưa hấu'],['🍍','pineapple','quả dứa'],['🍒','cherry','anh đào'],['🥭','mango','quả xoài'],['🥥','coconut','quả dừa'],['🍋','lemon','quả chanh'],['🍑','peach','quả đào']].map(w=>({e:w[0],en:w[1],vi:w[2]})),
    animal:[['🐶','dog','con chó'],['🐱','cat','con mèo'],['🐘','elephant','con voi'],['🦁','lion','sư tử'],['🐵','monkey','con khỉ'],['🐰','rabbit','con thỏ'],['🐟','fish','con cá'],['🐦','bird','con chim'],['🐮','cow','con bò'],['🐷','pig','con lợn'],['🐢','turtle','con rùa'],['🦒','giraffe','hươu cao cổ'],['🐯','tiger','con hổ'],['🐼','panda','gấu trúc']].map(w=>({e:w[0],en:w[1],vi:w[2]})),
    object:[['📚','book','quyển sách'],['✏️','pencil','bút chì'],['🎒','backpack','cái cặp'],['⏰','clock','đồng hồ'],['🏠','house','ngôi nhà'],['🚗','car','ô tô'],['⚽','ball','quả bóng'],['🚲','bicycle','xe đạp'],['☂️','umbrella','cái ô'],['🌙','moon','mặt trăng'],['⭐','star','ngôi sao'],['🔑','key','chìa khóa'],['🎈','balloon','bóng bay'],['🎁','gift','món quà']].map(w=>({e:w[0],en:w[1],vi:w[2]}))
  }},
  comay:{maxTests:5,tiers:[1,2,2,3,3,4,5,6]},
  bongbay:{totalQ:10,maxNum:10,hintSec:12,hintAfter:2,speed:1,
    letters:[['A','Áo','👕'],['B','Bóng','⚽'],['C','Cá','🐟'],['D','Dưa hấu','🍉'],['E','Em bé','👶'],['G','Gà','🐔'],['H','Hoa','🌸'],['K','Kem','🍦'],['L','Lá','🍃'],['M','Mèo','🐱'],['N','Nón','👒'],['O','Ong','🐝'],['S','Sao','⭐'],['T','Táo','🍎'],['V','Voi','🐘'],['X','Xe','🚗']].map(x=>({l:x[0],w:x[1],e:x[2]})),
    colors:[['đỏ','#FF5A5F'],['xanh dương','#3B82F6'],['xanh lá','#22C55E'],['vàng','#FACC15'],['cam','#FB923C'],['hồng','#F472B6'],['tím','#A855F7']].map(x=>({n:x[0],c:x[1]})),
    counters:['🍎','🐥','⭐','🐟','🚗','🌸','🎈','🍓'],
    praise:['Giỏi quá!','Tuyệt vời!','Đúng rồi!','Hoan hô!','Bé thật thông minh!','Siêu quá!'],
    retry:['Ồ, thử lại nhé!','Gần đúng rồi, cố lên!','Bé thử bong bóng khác nào!']},
  bechon:{totalQ:8,easyQ:4,
    animals:[['🐶','con chó'],['🐱','con mèo'],['🐔','con gà'],['🦆','con vịt'],['🐮','con bò'],['🐷','con heo'],['🐘','con voi'],['🐟','con cá'],['🐰','con thỏ'],['🐵','con khỉ'],['🐢','con rùa'],['🦁','con sư tử']].map(x=>({e:x[0],n:x[1]})),
    fruits:[['🍎','quả táo'],['🍌','quả chuối'],['🍇','chùm nho'],['🍊','quả cam'],['🍉','quả dưa hấu'],['🍓','quả dâu'],['🍍','quả dứa'],['🥭','quả xoài']].map(x=>({e:x[0],n:x[1]})),
    colors:[['đỏ','#FF5A5F'],['xanh dương','#3B82F6'],['xanh lá','#22C55E'],['vàng','#FACC15'],['cam','#FB923C'],['hồng','#F472B6'],['tím','#A855F7']].map(x=>({n:x[0],c:x[1]})),
    counters:[['🍎','quả táo'],['🐥','chú gà con'],['⭐','ngôi sao'],['🐟','con cá'],['🚗','chiếc xe'],['🌸','bông hoa'],['🎈','quả bóng']].map(x=>({e:x[0],n:x[1]})),
    praise:['Giỏi quá!','Đúng rồi!','Tuyệt vời!','Hoan hô!','Bé thông minh quá!','Siêu quá!'],
    retry:['Ồ, bé thử hình khác nhé!','Gần đúng rồi, cố lên!','Chưa phải rồi, thử lại nào!']}
}));

/* ---------- lưu trữ ---------- */
let storeOK=true;
try{localStorage.setItem('eg_t','1');localStorage.removeItem('eg_t')}catch(e){storeOK=false}
function merge(def,sv){
  if(!sv||typeof sv!=='object')return def;
  Object.keys(def).forEach(g=>{
    const a=def[g],b=sv[g];
    if(!b||typeof b!=='object')return;
    Object.keys(a).forEach(k=>{
      if(k==='words'&&b.words&&typeof b.words==='object'){
        Object.keys(a.words).forEach(t=>{if(Array.isArray(b.words[t]))a.words[t]=b.words[t]});
      }else if(b[k]!==undefined&&Array.isArray(a[k])===Array.isArray(b[k])&&typeof a[k]===typeof b[k])a[k]=b[k];
    });
  });
  return def;
}
function load(){try{return JSON.parse(localStorage.getItem('eg_draft'))}catch(e){return null}}
let cfg=merge(D(),load());
let tab=(function(){try{return localStorage.getItem('eg_tab')}catch(e){return null}})()||'thienthach';
if(!META.some(m=>m.k===tab))tab='thienthach';

let timer=null;
function changed(){
  const s=$('saved');s.textContent='… đang lưu';s.classList.remove('warn');
  clearTimeout(timer);
  timer=setTimeout(()=>{
    if(save()){s.textContent='✓ Đã lưu nháp';s.classList.remove('warn')}
    else{s.textContent='⚠ Không lưu được nháp';s.classList.add('warn')}
    const ta=$('jsonBox');if(ta)ta.value=toJS();
  },300);
}
function save(){if(!storeOK)return false;try{localStorage.setItem('eg_draft',JSON.stringify(cfg));return true}catch(e){return false}}
function toJS(){return '// Tạo bởi Trình chỉnh sửa game — Lớp Học Vui\n// Đặt file này cùng thư mục với các file game.\nwindow.EG_CONFIG='+JSON.stringify(cfg,null,2)+';\n'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

/* ---------- helper dựng giao diện ---------- */
function h(tag,props){
  const e=document.createElement(tag);
  if(props)for(const k in props){
    const v=props[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled')e[k]=v;
    else e.setAttribute(k,v);
  }
  for(let i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});
  }
  return e;
}
function numField(obj,key,o){
  const fmt=o.fmt||(v=>String(v));
  const val=h('span',{class:'val'},fmt(obj[key]));
  const r=h('input',{type:'range',min:o.min,max:o.max,step:o.step||1,value:obj[key],'aria-label':o.label,
    oninput:()=>{obj[key]=+r.value;val.textContent=fmt(obj[key]);changed()}});
  return h('div',{class:'field'},
    h('div',{class:'frow'},h('span',null,o.label),val),
    o.help?h('div',{class:'help'},o.help):null,r);
}
function listEditor(o){
  const arr=o.arr;
  const badge=h('span',{class:'badge'});
  const rows=h('div',{class:'rows'});
  function upd(){
    const bad=arr.length<o.min;
    badge.textContent=arr.length+' mục'+(bad?' · cần ≥ '+o.min:'');
    badge.classList.toggle('bad',bad);
  }
  function draw(){
    rows.innerHTML='';
    arr.forEach((it,i)=>{
      const row=h('div',{class:'row'});
      o.fields.forEach(f=>{
        const cur=o.str?it:it[f.key];
        const inp=h('input',{type:f.type||'text',value:cur==null?'':cur,placeholder:f.ph||'','aria-label':f.ph||f.key||'giá trị',class:'in '+(f.cls||''),
          oninput:()=>{const v=inp.value;if(o.str)arr[i]=v;else it[f.key]=v;changed()}});
        row.append(inp);
      });
      row.append(h('button',{class:'del',title:'Xóa dòng này','aria-label':'Xóa dòng',onclick:()=>{arr.splice(i,1);draw();changed()}},'✕'));
      rows.append(row);
    });
    upd();
  }
  draw();
  const card=h('div',{class:o.inDetails?'':'card'},
    h('div',{class:'lhead'},h('div',null,h('h3',{style:'margin:0'},o.title),o.help?h('div',{class:'help'},o.help):null),badge),
    rows,
    h('div',{class:'acts'},
      h('button',{class:'btn',onclick:()=>{arr.push(o.make());draw();changed();const l=rows.lastElementChild;if(l){const i=l.querySelector('input');if(i)i.focus()}}},'＋ Thêm'),
      h('button',{class:'btn gray',onclick:()=>{if(confirm('Đặt lại danh sách này về mẫu ban đầu?')){arr.splice(0,arr.length,...o.reset());draw();changed()}}},'↺ Về mẫu')
    ));
  return card;
}
function hero(m){return h('div',{class:'card hero'},h('div',{class:'ic'},m.icon),h('div',null,h('h2',null,m.name),h('p',null,m.desc)))}
const x1=v=>'×'+(+v).toFixed(1);

/* ---------- các bảng chỉnh sửa ---------- */
function panelThienThach(){
  const c=cfg.thienthach,m=META[0];
  return [hero(m),h('div',{class:'card'},
    h('h3',null,'Luật chơi'),
    numField(c,'lives',{label:'Số mạng (trái tim)',min:1,max:5,help:'Bé càng nhỏ nên để nhiều mạng.'}),
    numField(c,'levelEvery',{label:'Lên cấp sau mỗi … câu đúng',min:3,max:10}),
    numField(c,'speed',{label:'Tốc độ thiên thạch rơi',min:.5,max:2,step:.1,fmt:x1,help:'×0.5 là rất chậm, ×1 là bình thường, ×2 là rất nhanh.'}),
    numField(c,'numScale',{label:'Độ lớn của các con số',min:.5,max:2,step:.1,fmt:x1,help:'Thấp hơn: số nhỏ, dễ tính. Cao hơn: số lớn hơn.'})
  )];
}
function panelWordRush(){
  const c=cfg.wordrush,m=META[1];
  const mk=(key,title,open)=>{
    const d=h('details',{class:'card'});
    if(open)d.setAttribute('open','');
    d.append(h('summary',null,title));
    d.append(h('div',{class:'inner'},listEditor({
      inDetails:true,title:'Danh sách từ',help:'Nên có ít nhất 6 từ. Từ dài trên 10 chữ sẽ bị thu nhỏ trong game.',arr:c.words[key],min:3,
      fields:[{key:'e',ph:'🍎',cls:'em'},{key:'en',ph:'English',cls:'wide'},{key:'vi',ph:'Nghĩa tiếng Việt',cls:'wide'}],
      make:()=>({e:'',en:'',vi:''}),reset:()=>D().wordrush.words[key]
    })));
    return d;
  };
  return [hero(m),h('div',{class:'card'},
    h('h3',null,'Luật chơi'),
    numField(c,'lives',{label:'Số mạng (trái tim)',min:1,max:5}),
    numField(c,'levelEvery',{label:'Lên cấp sau mỗi … câu đúng',min:3,max:12}),
    numField(c,'speed',{label:'Tốc độ chạy',min:.5,max:1.6,step:.1,fmt:x1,help:'Bé nhỏ nên để ×0.6–0.8.'})
  ),mk('fruit','🍎 Chủ đề Trái cây',true),mk('animal','🐘 Chủ đề Động vật'),mk('object','🎒 Chủ đề Đồ vật'),
  h('div',{class:'note'},'Chủ đề ',h('b',null,'Tổng hợp'),' tự động gộp cả ba danh sách trên.')];
}
function panelCoMay(){
  const c=cfg.comay,m=META[2];
  const tiers=c.tiers;
  const box=h('div',{class:'rows'});
  const badge=h('span',{class:'badge'});
  function draw(){
    box.innerHTML='';
    tiers.forEach((t,i)=>{
      const sel=h('select',{class:'in','aria-label':'Mức của ca '+(i+1),onchange:()=>{tiers[i]=+sel.value;changed()}});
      for(let k=1;k<=6;k++){const o=h('option',{value:k},TIER_DESC[k]);if(k===t)o.selected=true;sel.append(o)}
      box.append(h('div',{class:'tierrow'},h('span',{class:'n'},'Ca '+(i+1)),sel,
        h('button',{class:'del','aria-label':'Xóa ca',onclick:()=>{if(tiers.length<=1){toast('Cần ít nhất 1 ca');return}tiers.splice(i,1);draw();changed()}},'✕')));
    });
    badge.textContent=tiers.length+' ca';
  }
  draw();
  const preset=(name,arr)=>h('button',{class:'btn',onclick:()=>{tiers.splice(0,tiers.length,...arr);draw();changed()}},name);
  return [hero(m),h('div',{class:'card'},
    h('h3',null,'Luật chơi'),
    numField(c,'maxTests',{label:'Số lần thử máy mỗi ca',min:3,max:8,help:'Nhiều lần thử thì dễ hơn.'})
  ),h('div',{class:'card'},
    h('div',{class:'lhead'},h('div',null,h('h3',{style:'margin:0'},'Các ca chơi và độ khó'),h('div',{class:'help'},'Mỗi ca là một cỗ máy. Số ca = số dòng bên dưới.')),badge),
    box,
    h('div',{class:'acts'},
      h('button',{class:'btn',onclick:()=>{tiers.push(3);draw();changed()}},'＋ Thêm ca'),
      preset('Dễ',[1,1,1,2,2,2]),preset('Chuẩn',[1,2,2,3,3,4,5,6]),preset('Khó',[3,3,4,4,5,5,6,6])
    ))];
}
function panelBongBay(){
  const c=cfg.bongbay,m=META[3];
  return [hero(m),h('div',{class:'card'},
    h('h3',null,'Luật chơi'),
    numField(c,'totalQ',{label:'Số câu mỗi lượt',min:5,max:20}),
    numField(c,'maxNum',{label:'Số lớn nhất ở chủ đề "Số"',min:4,max:10,help:'Ví dụ 5: bé chỉ học số từ 1 đến 5.'}),
    numField(c,'speed',{label:'Tốc độ bong bóng bay',min:.5,max:2,step:.1,fmt:x1}),
    numField(c,'hintAfter',{label:'Gợi ý sau khi chạm sai … lần',min:1,max:4}),
    numField(c,'hintSec',{label:'Gợi ý nếu bé chưa chạm sau … giây',min:5,max:30,fmt:v=>v+'s'})
  ),
  listEditor({title:'🔤 Chữ cái',help:'Chữ cái, từ ví dụ và hình. Cần ít nhất 4 chữ.',arr:c.letters,min:4,
    fields:[{key:'l',ph:'A',cls:'ltr'},{key:'w',ph:'Từ ví dụ',cls:'wide'},{key:'e',ph:'👕',cls:'em'}],
    make:()=>({l:'',w:'',e:''}),reset:()=>D().bongbay.letters}),
  listEditor({title:'🌈 Màu sắc',help:'Tên màu và màu hiển thị. Cần ít nhất 4 màu.',arr:c.colors,min:4,
    fields:[{key:'n',ph:'Tên màu',cls:'wide'},{key:'c',ph:'',type:'color',cls:'clr'}],
    make:()=>({n:'',c:'#FF5A5F'}),reset:()=>D().bongbay.colors}),
  listEditor({title:'🍎 Hình để đếm',help:'Mỗi ô một biểu tượng emoji.',arr:c.counters,min:1,str:true,
    fields:[{ph:'😀',cls:'em'}],make:()=>'',reset:()=>D().bongbay.counters}),
  listEditor({title:'🎉 Lời khen',help:'Gấu nói khi bé chọn đúng.',arr:c.praise,min:1,str:true,
    fields:[{ph:'Giỏi quá!',cls:'wide'}],make:()=>'',reset:()=>D().bongbay.praise}),
  listEditor({title:'💪 Lời động viên',help:'Gấu nói khi bé chọn sai.',arr:c.retry,min:1,str:true,
    fields:[{ph:'Thử lại nhé!',cls:'wide'}],make:()=>'',reset:()=>D().bongbay.retry})];
}
function panelBeChon(){
  const c=cfg.bechon,m=META[4];
  const pair=(title,help,key,min,ph)=>listEditor({title,help,arr:c[key],min,
    fields:[{key:'e',ph:'🐶',cls:'em'},{key:'n',ph:ph,cls:'wide'}],make:()=>({e:'',n:''}),reset:()=>D().bechon[key]});
  return [hero(m),h('div',{class:'card'},
    h('h3',null,'Luật chơi'),
    numField(c,'totalQ',{label:'Số câu mỗi lượt',min:4,max:16}),
    numField(c,'easyQ',{label:'Số câu đầu chỉ có 2 lựa chọn',min:0,max:8,help:'Đặt 0 nếu muốn luôn có 3 lựa chọn.'})
  ),
  pair('🐶 Con vật','Emoji và tên (có "con"). Cần ít nhất 3.','animals',3,'con chó'),
  pair('🍎 Trái cây','Emoji và tên (có "quả"). Cần ít nhất 3.','fruits',3,'quả táo'),
  listEditor({title:'🌈 Màu sắc',help:'Tên màu và màu hiển thị. Cần ít nhất 3.',arr:c.colors,min:3,
    fields:[{key:'n',ph:'Tên màu',cls:'wide'},{key:'c',ph:'',type:'color',cls:'clr'}],
    make:()=>({n:'',c:'#FF5A5F'}),reset:()=>D().bechon.colors}),
  pair('🔢 Hình để đếm','Emoji và tên vật (ví dụ "quả táo").','counters',1,'quả táo'),
  listEditor({title:'🎉 Lời khen',help:'Gấu nói trước tên vật, ví dụ "Giỏi quá! Đó là con mèo".',arr:c.praise,min:1,str:true,
    fields:[{ph:'Giỏi quá!',cls:'wide'}],make:()=>'',reset:()=>D().bechon.praise}),
  listEditor({title:'💪 Lời động viên',arr:c.retry,min:1,str:true,
    fields:[{ph:'Thử lại nhé!',cls:'wide'}],make:()=>'',reset:()=>D().bechon.retry})];
}
function panelExport(){
  const ta=h('textarea',{id:'jsonBox',readonly:'',value:toJS(),'aria-label':'Nội dung config.js'});
  ta.value=toJS();
  return [h('div',{class:'card hero'},h('div',{class:'ic'},'📦'),h('div',null,h('h2',null,'Xuất & đăng lên web'),h('p',null,'Áp dụng chỉnh sửa cho tất cả học sinh.'))),
    h('div',{class:'card'},
      h('h3',null,'Các bước đăng'),
      h('ol',{class:'steps'},
        h('li',{html:'Bấm <b>Tải config.js</b> (hoặc <b>Sao chép</b> bên dưới).'}),
        h('li',{html:'Đặt file <code>config.js</code> vào <b>cùng thư mục</b> với các file game trong repo <code>educational-games</code>.'}),
        h('li',{html:'Commit và push. GitHub Pages cập nhật sau khoảng 1–2 phút.'}),
        h('li',{html:'Mở game trên điện thoại, tải lại trang để thấy thay đổi.'})
      ),
      h('div',{class:'acts'},
        h('button',{class:'btn grn',onclick:download},'⬇ Tải config.js'),
        h('button',{class:'btn pri',onclick:copy},'📋 Sao chép')
      )),
    h('div',{class:'note',html:'<b>Xem thử</b> chỉ hoạt động khi trang này và các file game nằm cùng thư mục, cùng tên miền. Bản nháp lưu trong trình duyệt của bạn nên <b>học sinh không thấy</b> cho đến khi bạn đăng <code>config.js</code>.'+(storeOK?'':'<br><br><b>⚠ Trình duyệt đang chặn lưu nháp.</b> Hãy mở trang bằng trình duyệt thường (không ẩn danh) để dùng nút Xem thử.')}),
    h('div',{class:'card'},
      h('h3',null,'Sao lưu & khôi phục'),
      h('div',{class:'acts'},
        h('button',{class:'btn',onclick:()=>$('fileIn').click()},'📂 Nhập từ file config.js'),
        h('button',{class:'btn gray',onclick:resetGame},'↺ Đặt lại game đang chọn'),
        h('button',{class:'btn gray',onclick:resetAll},'⚠ Đặt lại tất cả')
      )),
    h('details',{class:'card'},h('summary',null,'Xem nội dung config.js'),h('div',{class:'inner'},ta))];
}

/* ---------- hành động ---------- */
function download(){
  const b=new Blob([toJS()],{type:'text/javascript;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='config.js';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  toast('Đã tải config.js');
}
function copy(){
  const t=toJS();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép'),fallback)}else fallback();
  function fallback(){const ta=$('jsonBox');if(!ta)return;ta.select();try{document.execCommand('copy');toast('Đã sao chép')}catch(e){toast('Hãy chọn và sao chép thủ công')}}
}
function importText(txt){
  try{
    let s=txt.trim();
    const i=s.indexOf('EG_CONFIG');
    if(i>=0){s=s.slice(s.indexOf('=',i)+1);s=s.slice(0,s.lastIndexOf('}')+1)}
    const j=JSON.parse(s);
    cfg=merge(D(),j);save();render();toast('Đã nhập cấu hình');
  }catch(e){toast('File không hợp lệ')}
}
function resetGame(){
  if(!FILES[tab]){toast('Hãy chọn một game trước');return}
  if(confirm('Đặt lại toàn bộ cài đặt của game này?')){cfg[tab]=D()[tab];save();render();toast('Đã đặt lại')}
}
function resetAll(){
  if(confirm('Đặt lại TẤT CẢ game về mặc định?')){cfg=D();save();render();toast('Đã đặt lại tất cả')}
}
function preview(){
  if(!FILES[tab])return;
  if(!save()&&storeOK===false)toast('Trình duyệt chặn lưu nháp, xem thử sẽ dùng mặc định');
  window.open(FILES[tab]+'?preview=1','_blank');
}

/* ---------- render ---------- */
function renderTabs(){
  const t=$('tabs');t.innerHTML='';
  META.forEach(m=>{
    const b=h('button',{class:'tab'+(m.k===tab?' on':''),onclick:()=>{tab=m.k;try{localStorage.setItem('eg_tab',tab)}catch(e){}render();window.scrollTo({top:0})}},m.icon+' '+m.name);
    if(m.k===tab){b.setAttribute('aria-current','page')}
    t.append(b);
  });
  const on=t.querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function render(){
  renderTabs();
  const p=$('panel');p.innerHTML='';
  const fn={thienthach:panelThienThach,wordrush:panelWordRush,comay:panelCoMay,bongbay:panelBongBay,bechon:panelBeChon,export:panelExport}[tab];
  fn().forEach(n=>p.append(n));
  const pv=$('btnPreview');pv.disabled=!FILES[tab];
  pv.textContent=FILES[tab]?'👁 Xem thử':'👁 Chọn game';
}
$('btnPreview').onclick=preview;
$('btnDl').onclick=download;
$('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f);e.target.value='';
});
if(!storeOK){$('saved').textContent='⚠ Không lưu được nháp';$('saved').classList.add('warn')}
render();
})();
</script>
