<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maths Racing – Đua Toán Học</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: #0b1a2e;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      touch-action: manipulation;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* ===== SCREENS ===== */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== START SCREEN ===== */
    #start-screen {
      background: radial-gradient(circle at 20% 30%, #1b3b5c, #0b1a2e 80%);
    }
    #start-screen .logo {
      font-size: clamp(3.5rem, 12vw, 6rem);
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    #start-screen h1 {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 8vw, 4.2rem);
      color: #fff;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #start-screen h1 span {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #start-screen .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .play-btn {
      margin-top: 32px;
      padding: 14px 52px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 60px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0b1a2e;
      box-shadow: 0 8px 30px rgba(251, 191, 36, 0.4);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
    }
    .play-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
    }
    .best-display {
      margin-top: 18px;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      font-weight: 700;
    }
    .best-display b {
      color: #fbbf24;
      font-size: 1.1rem;
    }

    /* ===== GAME SCREEN ===== */
    #game-screen {
      background: #0b1a2e;
    }

    /* ---- HUD ---- */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(11, 26, 46, 0.7);
      backdrop-filter: blur(6px);
      z-index: 50;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #fff;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: clamp(0.7rem, 2vw, 0.95rem);
    }
    .hud-item .icon {
      font-size: 1.1em;
    }
    .hud-score {
      color: #fbbf24;
      font-size: 1.2em;
    }
    .hud-hearts {
      letter-spacing: 2px;
    }
    .heart {
      color: #ef4444;
      transition: opacity 0.3s;
    }
    .heart.lost {
      opacity: 0.2;
    }
    .hud-combo {
      color: #fbbf24;
      min-width: 40px;
      text-align: right;
    }
    .hud-level {
      background: rgba(255,255,255,0.08);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    /* ---- GAME AREA ---- */
    .game-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 45%, #86efac 45%, #4ade80 100%);
    }
    /* hiệu ứng nền động (mây, đường) sẽ được thêm bằng JS */

    /* ---- Runner ---- */
    .runner {
      position: absolute;
      left: 12%;
      bottom: 45%;
      transform: translateY(50%);
      z-index: 15;
      font-size: clamp(2.8rem, 9vw, 4.2rem);
      transition: bottom 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      will-change: bottom;
    }
    .runner.lane-up   { bottom: 58%; }
    .runner.lane-mid  { bottom: 45%; }
    .runner.lane-down { bottom: 32%; }

    .runner.jumping {
      animation: jumpArc 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes jumpArc {
      0%   { transform: translateY(50%) scale(1); }
      40%  { transform: translateY(-80px) scale(1.08); }
      100% { transform: translateY(50%) scale(1); }
    }

    .runner.shielded::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(27, 153, 139, 0.7);
      box-shadow: 0 0 20px rgba(27, 153, 139, 0.5);
      animation: shieldPulse 1s ease-in-out infinite;
    }
    @keyframes shieldPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    .runner.double-score {
      filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.8));
    }
    .runner.double-score::before {
      content: '✖2';
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      background: #fbbf24;
      color: #0b1a2e;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .runner.hit-flash {
      animation: flashRed 0.35s ease-out;
    }
    @keyframes flashRed {
      0%, 100% { filter: none; }
      30% { filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.9)); }
    }

    /* ---- Obstacles ---- */
    .obstacle {
      position: absolute;
      z-index: 5;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .obstacle-small  { width: clamp(28px,5vw,40px); height: clamp(28px,5vw,40px); }
    .obstacle-medium { width: clamp(32px,6vw,48px); height: clamp(40px,8vw,56px); }
    .obstacle-large  { width: clamp(40px,7vw,56px); height: clamp(40px,7vw,56px); }

    /* ---- Coins ---- */
    .coin {
      position: absolute;
      z-index: 5;
      width: clamp(24px,4.5vw,32px);
      height: clamp(24px,4.5vw,32px);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fcd34d, #f59e0b);
      border: 2px solid #d97706;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(12px,2.5vw,18px);
      font-weight: 800;
      color: #0b1a2e;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.5);
      animation: coinSpin 1.2s linear infinite;
    }
    @keyframes coinSpin {
      0%, 100% { transform: translateY(50%) scaleX(1); }
      50% { transform: translateY(50%) scaleX(0.2); }
    }

    /* ---- Powerups ---- */
    .powerup {
      position: absolute;
      z-index: 5;
      width: clamp(30px,5.5vw,42px);
      height: clamp(30px,5.5vw,42px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(16px,3.5vw,24px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: powerupBob 1s ease-in-out infinite;
      border: 2px solid rgba(255,255,255,0.3);
    }
    @keyframes powerupBob {
      0%, 100% { transform: translateY(50%) translateY(0); }
      50% { transform: translateY(50%) translateY(-8px); }
    }
    .powerup.shield-pu {
      background: linear-gradient(135deg, #2dd4bf, #0d9488);
    }
    .powerup.double-pu {
      background: linear-gradient(135deg, #fb923c, #ea580c);
    }

    /* ---- Clouds & decor ---- */
    .cloud {
      position: absolute;
      z-index: 1;
      opacity: 0.7;
      font-size: clamp(2rem, 6vw, 4rem);
      filter: blur(0.5px);
      pointer-events: none;
    }

    /* ---- Speed lines ---- */
    .speed-line {
      position: absolute;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      z-index: 2;
      border-radius: 4px;
      pointer-events: none;
    }

    /* ---- Road & ground stripes ---- */
    .road-line {
      position: absolute;
      height: 4px;
      width: 60px;
      background: rgba(255, 255, 255, 0.3);
      bottom: 45%;
      border-radius: 4px;
      z-index: 1;
    }
    .ground-stripe {
      position: absolute;
      height: 3px;
      background: rgba(0, 0, 0, 0.08);
      bottom: 44.5%;
      border-radius: 2px;
      z-index: 1;
    }

    /* ---- Math Overlay ---- */
    .math-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 26, 46, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 80;
    }
    .math-overlay.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .math-box {
      background: #fff;
      border-radius: 28px;
      padding: clamp(20px, 5vw, 36px);
      max-width: min(92%, 380px);
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .math-box h3 {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: #0d9488;
      margin-bottom: 6px;
    }
    .math-box .equation {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: #0b1a2e;
      margin: 12px 0 18px;
    }
    .math-options {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .math-opt {
      width: clamp(60px, 16vw, 80px);
      height: clamp(52px, 12vw, 68px);
      border: 3px solid #e5e7eb;
      border-radius: 16px;
      background: #f3f4f6;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #0b1a2e;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.05);
    }
    .math-opt:active {
      transform: scale(0.92);
    }
    .math-opt.correct {
      background: #10b981;
      border-color: #10b981;
      color: #fff;
      animation: popCorrect 0.4s;
    }
    .math-opt.wrong {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
      animation: shake 0.3s;
    }
    @keyframes popCorrect {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* ---- Combo popup ---- */
    .combo-popup {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      color: #fbbf24;
      text-shadow: 0 4px 20px rgba(251,191,36,0.5);
      z-index: 75;
      pointer-events: none;
      animation: comboPop 0.8s ease-out forwards;
    }
    @keyframes comboPop {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 0; transform: translate(-50%, -80%) scale(1.4); }
    }

    /* ---- Controls ---- */
    .controls {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      z-index: 60;
      padding: 0 12px;
    }
    .ctrl-btn {
      width: clamp(60px, 16vw, 80px);
      height: clamp(60px, 16vw, 80px);
      border-radius: 20px;
      border: none;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s, box-shadow 0.15s;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      touch-action: manipulation;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .ctrl-btn:active {
      transform: scale(0.92);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }
    .ctrl-btn.left { background: rgba(59, 130, 246, 0.35); }
    .ctrl-btn.jump { background: rgba(16, 185, 129, 0.5); }
    .ctrl-btn.right { background: rgba(59, 130, 246, 0.35); }

    /* ---- Pause overlay ---- */
    .pause-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 26, 46, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
    }
    .pause-overlay.active {
      display: flex;
    }
    .pause-box {
      background: #fff;
      border-radius: 24px;
      padding: 32px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: popIn 0.3s ease;
    }
    .pause-box h2 {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: #0b1a2e;
    }
    .pause-box p {
      color: #6b7280;
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .pause-btn {
      margin-top: 16px;
      padding: 10px 32px;
      border: none;
      border-radius: 40px;
      background: #0d9488;
      color: #fff;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .pause-btn:active {
      transform: scale(0.95);
    }

    /* ===== GAME OVER SCREEN ===== */
    #gameover-screen {
      background: radial-gradient(circle at 30% 40%, #1e3a5f, #0b1a2e 90%);
    }
    #gameover-screen .go-icon {
      font-size: clamp(3.5rem, 12vw, 6rem);
      margin-bottom: 6px;
    }
    #gameover-screen h2 {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.6rem);
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .go-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 16px;
      max-width: 400px;
      width: 100%;
    }
    .go-stat {
      flex: 1 1 100px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      padding: 12px 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .go-stat .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.5);
    }
    .go-stat .val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #fbbf24;
    }
    .go-stat .val.best {
      color: #34d399;
    }
    .new-best {
      color: #34d399;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 2px;
      display: none;
    }
    .go-actions {
      display: flex;
      gap: 14px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .go-btn {
      padding: 12px 32px;
      border: none;
      border-radius: 40px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .go-btn:active {
      transform: scale(0.95);
    }
    .go-btn.restart {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0b1a2e;
    }
    .go-btn.quit {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 768px) {
      .controls {
        bottom: 24px;
        gap: 20px;
      }
      .ctrl-btn {
        width: 80px;
        height: 80px;
      }
      .hud {
        padding: 12px 24px;
      }
    }
    @media (max-width: 480px) {
      .controls {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
  (function() {
    'use strict';

    // ===== CONSTANTS & STATE =====
    const MAX_HP = 3;
    const BASE_SPEED = 2.5;
    const LANE_POSITIONS = [58, 45, 32];
    const LANE_BOTTOMS = { 58: '58%', 45: '45%', 32: '32%' };

    let SCORE = 0;
    let BEST = parseInt(localStorage.getItem('maths-racing-best') || '0', 10);
    let HP = MAX_HP;
    let COMBO = 0;
    let DISTANCE = 0;
    let LEVEL = 1;
    let SPEED = BASE_SPEED;
    let IS_JUMPING = false;
    let IS_ALIVE = false;
    let IS_PAUSED = false;
    let RUNNER_LANE = 1; // 0=up, 1=mid, 2=down
    let GAME_START_TIME = 0;
    let TIME_USED = 0;

    let HAS_SHIELD = false;
    let HAS_DOUBLE = false;
    let SHIELD_TIMER = 0;
    let DOUBLE_TIMER = 0;

    // Spawn timers
    let LAST_MATH_TIME = 0;
    const MATH_INTERVAL = 8000;
    let LAST_SPAWN = 0;
    let SPAWN_INTERVAL = 1200;
    let LAST_COIN = 0;
    const COIN_INTERVAL = 1800;
    let LAST_POWERUP = 0;
    const POWERUP_INTERVAL = 12000;
    let LAST_CLOUD = 0;
    const CLOUD_INTERVAL = 2000;
    let LAST_ROAD = 0;
    const ROAD_INTERVAL = 400;
    let LAST_SPEED_LINE = 0;
    const SPEED_LINE_INTERVAL = 150;

    let OBSTACLES = [];
    let COINS = [];
    let POWERUPS = [];

    let GAME_AREA, RUNNER_EL, MATH_OVERLAY, MATH_EQUATION, MATH_OPTIONS;
    let frameId = null;
    let lastFrameTime = 0;
    let mathData = null;

    // ===== DOM refs =====
    const root = document.getElementById('root');

    // ===== UTILITY =====
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ===== MATH GENERATOR =====
    function generateMath() {
      const ops = ['+', '-', '*'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let a, b, ans;
      switch (op) {
        case '+':
          a = Math.floor(Math.random() * 20) + 2;
          b = Math.floor(Math.random() * 15) + 2;
          ans = a + b;
          break;
        case '-':
          a = Math.floor(Math.random() * 20) + 10;
          b = Math.floor(Math.random() * 10) + 1;
          ans = a - b;
          break;
        case '*':
          a = Math.floor(Math.random() * 10) + 2;
          b = Math.floor(Math.random() * 10) + 2;
          ans = a * b;
          break;
      }
      const opts = [ans];
      while (opts.length < 3) {
        const off = Math.floor(Math.random() * 11) - 5;
        if (off !== 0 && !opts.includes(ans + off)) opts.push(ans + off);
      }
      shuffleArray(opts);
      return { eq: `${a} ${op} ${b} = ?`, opts, ans };
    }

    // ===== MATH OVERLAY =====
    function showMath() {
      if (!IS_ALIVE || IS_PAUSED) return;
      mathData = generateMath();
      MATH_EQUATION.textContent = mathData.eq;
      MATH_OPTIONS.innerHTML = '';
      mathData.opts.forEach(v => {
        const btn = document.createElement('button');
        btn.className = 'math-opt';
        btn.textContent = v;
        btn.onclick = () => answerMath(v, btn);
        MATH_OPTIONS.appendChild(btn);
      });
      IS_PAUSED = true;
      MATH_OVERLAY.classList.add('active');
    }

    function answerMath(val, btn) {
      if (!mathData) return;
      const correct = val === mathData.ans;
      if (correct) {
        btn.classList.add('correct');
        SCORE += 100 * (1 + COMBO);
        COMBO++;
        SPEED = BASE_SPEED * 1.3;
        setTimeout(() => { if (IS_ALIVE) SPEED = BASE_SPEED; }, 1500);
        showCombo();
      } else {
        btn.classList.add('wrong');
        COMBO = 0;
        SPEED = BASE_SPEED * 0.6;
        setTimeout(() => { if (IS_ALIVE) SPEED = BASE_SPEED; }, 1500);
        document.querySelectorAll('.math-opt').forEach(o => {
          if (parseInt(o.textContent) === mathData.ans) o.classList.add('correct');
        });
      }
      updateHUD();
      setTimeout(() => {
        MATH_OVERLAY.classList.remove('active');
        IS_PAUSED = false;
        mathData = null;
        LAST_MATH_TIME = Date.now();
      }, correct ? 500 : 800);
    }

    function showCombo() {
      if (COMBO < 2) return;
      const el = document.createElement('div');
      el.className = 'combo-popup';
      el.textContent = `${COMBO}x COMBO!`;
      GAME_AREA.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    // ===== SPAWN FUNCTIONS =====
    function spawnObstacle() {
      const lane = LANE_POSITIONS[Math.floor(Math.random() * 3)];
      const types = ['small', 'medium', 'large'];
      const type = types[Math.floor(Math.random() * 3)];
      const colors = ['#ef4444', '#dc2626', '#b91c1c', '#f97316', '#ea580c'];
      const el = document.createElement('div');
      el.className = `obstacle obstacle-${type}`;
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.right = '-60px';
      el.style.bottom = LANE_BOTTOMS[lane];
      el.style.transform = 'translateY(50%)';
      el.dataset.lane = lane;
      el.dataset.type = type;
      GAME_AREA.appendChild(el);
      OBSTACLES.push({ el, x: window.innerWidth + 60, lane, type, speed: SPEED * 1.2 });
    }

    function spawnCoin() {
      const lane = LANE_POSITIONS[Math.floor(Math.random() * 3)];
      const el = document.createElement('div');
      el.className = 'coin';
      el.textContent = '₿';
      el.style.right = '-40px';
      el.style.bottom = LANE_BOTTOMS[lane];
      el.style.transform = 'translateY(50%)';
      el.dataset.lane = lane;
      GAME_AREA.appendChild(el);
      COINS.push({ el, x: window.innerWidth + 40, lane, speed: SPEED });
    }

    function spawnPowerup() {
      const lane = LANE_POSITIONS[Math.floor(Math.random() * 3)];
      const isShield = Math.random() < 0.5;
      const el = document.createElement('div');
      el.className = `powerup ${isShield ? 'shield-pu' : 'double-pu'}`;
      el.textContent = isShield ? '🛡️' : '✖️';
      el.style.right = '-40px';
      el.style.bottom = LANE_BOTTOMS[lane];
      el.style.transform = 'translateY(50%)';
      el.dataset.lane = lane;
      el.dataset.type = isShield ? 'shield' : 'double';
      GAME_AREA.appendChild(el);
      POWERUPS.push({ el, x: window.innerWidth + 40, lane, type: isShield ? 'shield' : 'double', speed: SPEED });
    }

    function spawnCloud() {
      const el = document.createElement('div');
      el.className = 'cloud';
      const clouds = ['☁️', '⛅', '☁️', '🌤️'];
      el.textContent = clouds[Math.floor(Math.random() * clouds.length)];
      el.style.left = Math.random() * 80 + '%';
      el.style.top = Math.random() * 30 + '%';
      el.style.fontSize = `clamp(1.5rem, ${Math.random() * 2 + 2}vw, 3.5rem)`;
      el.dataset.speed = (Math.random() * 0.5 + 0.3).toFixed(2);
      GAME_AREA.appendChild(el);
      setTimeout(() => el.remove(), 15000);
    }

    function spawnSpeedLine() {
      const el = document.createElement('div');
      el.className = 'speed-line';
      el.style.width = (40 + Math.random() * 80) + 'px';
      el.style.right = '-100px';
      el.style.bottom = (40 + Math.random() * 20) + '%';
      el.style.opacity = (0.15 + Math.random() * 0.25).toFixed(2);
      el.dataset.speed = SPEED * 3;
      GAME_AREA.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function spawnRoadLine() {
      const el = document.createElement('div');
      el.className = 'road-line';
      el.style.right = '-70px';
      GAME_AREA.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    function spawnGroundStripe() {
      const el = document.createElement('div');
      el.className = 'ground-stripe';
      el.style.right = '-65px';
      el.style.width = (40 + Math.random() * 50) + 'px';
      GAME_AREA.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    // ===== COLLISION =====
    function checkCollision(a, b) {
      return a.left < b.right && a.right > b.left &&
             a.top < b.bottom && a.bottom > b.top;
    }

    function hitObstacle() {
      if (HAS_SHIELD) {
        HAS_SHIELD = false;
        SHIELD_TIMER = 0;
        RUNNER_EL.classList.remove('shielded');
        showFloatingText('🛡️ Blocked!');
        return;
      }
      HP--;
      COMBO = 0;
      RUNNER_EL.classList.add('hit-flash');
      setTimeout(() => RUNNER_EL.classList.remove('hit-flash'), 350);
      updateHUD();
      if (HP <= 0) gameOver();
    }

    function showFloatingText(text) {
      const el = document.createElement('div');
      el.className = 'combo-popup';
      el.textContent = text;
      GAME_AREA.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    // ===== HUD =====
    function updateHUD() {
      const heartsEl = document.querySelector('.hud-hearts');
      let h = '';
      for (let i = 0; i < MAX_HP; i++) {
        h += `<span class="heart${i < HP ? '' : ' lost'}">❤️</span>`;
      }
      heartsEl.innerHTML = h;
      document.querySelector('.hud-score').textContent = SCORE;
      document.querySelector('.hud-dist').textContent = Math.floor(DISTANCE) + 'm';
      document.querySelector('.hud-combo').textContent = COMBO > 0 ? COMBO + 'x' : '';
      document.querySelector('.hud-level').textContent = `Lv.${LEVEL}`;
    }

    // ===== GAME OVER =====
    function gameOver() {
      IS_ALIVE = false;
      TIME_USED = Math.floor((Date.now() - GAME_START_TIME) / 1000);
      let isNew = false;
      if (SCORE > BEST) {
        BEST = SCORE;
        isNew = true;
        localStorage.setItem('maths-racing-best', '' + BEST);
      }
      showGameOver(SCORE, TIME_USED, isNew);
      window.parent.postMessage({ type: 'game-over', data: { score: SCORE, timeUsed: TIME_USED } }, '*');
    }

    function showGameOver(score, time, isNew) {
      document.getElementById('game-screen').classList.add('hidden');
      const go = document.getElementById('gameover-screen');
      go.classList.remove('hidden');
      go.querySelector('.final-score').textContent = score;
      go.querySelector('.final-dist').textContent = Math.floor(DISTANCE) + 'm';
      go.querySelector('.final-time').textContent = time + 's';
      go.querySelector('.final-best').textContent = BEST;
      const nb = go.querySelector('.new-best');
      nb.style.display = isNew ? 'block' : 'none';
    }

    // ===== START GAME =====
    function startGame() {
      // Reset state
      SCORE = 0;
      HP = MAX_HP;
      COMBO = 0;
      DISTANCE = 0;
      LEVEL = 1;
      SPEED = BASE_SPEED;
      IS_ALIVE = true;
      IS_PAUSED = false;
      RUNNER_LANE = 1;
      HAS_SHIELD = false;
      HAS_DOUBLE = false;
      SHIELD_TIMER = 0;
      DOUBLE_TIMER = 0;
      GAME_START_TIME = Date.now();
      LAST_MATH_TIME = Date.now();
      LAST_SPAWN = Date.now();
      LAST_POWERUP = Date.now();
      LAST_CLOUD = Date.now();
      LAST_ROAD = Date.now();
      LAST_SPEED_LINE = Date.now();
      LAST_COIN = Date.now();
      OBSTACLES = [];
      COINS = [];
      POWERUPS = [];

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      GAME_AREA = document.querySelector('.game-area');
      RUNNER_EL = document.querySelector('.runner');
      MATH_OVERLAY = document.querySelector('.math-overlay');
      MATH_EQUATION = document.querySelector('.equation');
      MATH_OPTIONS = document.querySelector('.math-options');

      // Clear dynamic elements
      GAME_AREA.querySelectorAll('.obstacle, .coin, .powerup, .cloud, .speed-line, .road-line, .ground-stripe, .combo-popup')
        .forEach(el => el.remove());

      RUNNER_EL.className = 'runner lane-mid';
      updateHUD();

      if (frameId) cancelAnimationFrame(frameId);
      lastFrameTime = 0;
      frameId = requestAnimationFrame(gameLoop);
    }

    // ===== GAME LOOP =====
    function gameLoop(ts) {
      if (!IS_ALIVE) return;
      if (!lastFrameTime) lastFrameTime = ts;
      let dt = (ts - lastFrameTime) / 1000;
      lastFrameTime = ts;
      if (dt > 0.1) dt = 0.1;
      if (IS_PAUSED) {
        frameId = requestAnimationFrame(gameLoop);
        return;
      }

      const now = Date.now();
      DISTANCE += SPEED * dt * 15;
      const newLevel = Math.floor(DISTANCE / 500) + 1;
      if (newLevel > LEVEL) {
        LEVEL = newLevel;
        const base = 2.5 + LEVEL * 0.3;
        SPEED = base;
        SPAWN_INTERVAL = Math.max(400, 1200 - LEVEL * 80);
      }

      const timeFactor = dt * 60;

      // Spawn obstacles
      if (now - LAST_SPAWN > SPAWN_INTERVAL) {
        spawnObstacle();
        LAST_SPAWN = now;
      }

      // Spawn coins
      if (now - LAST_COIN > COIN_INTERVAL && Math.random() < 0.5) {
        spawnCoin();
        LAST_COIN = now;
      }

      // Spawn powerups
      if (now - LAST_POWERUP > POWERUP_INTERVAL) {
        if (Math.random() < 0.35) spawnPowerup();
        LAST_POWERUP = now;
      }

      // Math challenge
      if (now - LAST_MATH_TIME > MATH_INTERVAL) {
        showMath();
        LAST_MATH_TIME = now + MATH_INTERVAL;
      }

      // Clouds
      if (now - LAST_CLOUD > CLOUD_INTERVAL) {
        spawnCloud();
        LAST_CLOUD = now;
      }

      // Road lines
      if (now - LAST_ROAD > ROAD_INTERVAL) {
        spawnRoadLine();
        spawnGroundStripe();
        LAST_ROAD = now;
      }

      // Speed lines
      if (SPEED > 3 && now - LAST_SPEED_LINE > SPEED_LINE_INTERVAL) {
        spawnSpeedLine();
        LAST_SPEED_LINE = now;
      }

      // ---- Move & Collision: Obstacles ----
      for (let i = OBSTACLES.length - 1; i >= 0; i--) {
        const ob = OBSTACLES[i];
        ob.x -= ob.speed * timeFactor;
        ob.el.style.right = (window.innerWidth - ob.x) + 'px';
        if (ob.x < -80) {
          ob.el.remove();
          OBSTACLES.splice(i, 1);
          continue;
        }
        const rRect = RUNNER_EL.getBoundingClientRect();
        const oRect = ob.el.getBoundingClientRect();
        if (checkCollision(rRect, oRect)) {
          ob.el.remove();
          OBSTACLES.splice(i, 1);
          hitObstacle();
        }
      }

      // ---- Coins ----
      for (let i = COINS.length - 1; i >= 0; i--) {
        const c = COINS[i];
        c.x -= c.speed * timeFactor;
        c.el.style.right = (window.innerWidth - c.x) + 'px';
        if (c.x < -40) {
          c.el.remove();
          COINS.splice(i, 1);
          continue;
        }
        const rRect = RUNNER_EL.getBoundingClientRect();
        const cRect = c.el.getBoundingClientRect();
        if (checkCollision(rRect, cRect)) {
          SCORE += 10;
          c.el.style.transition = 'transform 0.2s, opacity 0.2s';
          c.el.style.transform = 'translateY(50%) scale(1.5)';
          c.el.style.opacity = '0';
          setTimeout(() => c.el.remove(), 200);
          COINS.splice(i, 1);
          updateHUD();
        }
      }

      // ---- Powerups ----
      for (let i = POWERUPS.length - 1; i >= 0; i--) {
        const p = POWERUPS[i];
        p.x -= p.speed * timeFactor;
        p.el.style.right = (window.innerWidth - p.x) + 'px';
        if (p.x < -50) {
          p.el.remove();
          POWERUPS.splice(i, 1);
          continue;
        }
        const rRect = RUNNER_EL.getBoundingClientRect();
        const pRect = p.el.getBoundingClientRect();
        if (checkCollision(rRect, pRect)) {
          if (p.type === 'shield') {
            HAS_SHIELD = true;
            SHIELD_TIMER = Date.now();
            RUNNER_EL.classList.add('shielded');
            showFloatingText('🛡️ Shield!');
          } else {
            HAS_DOUBLE = true;
            DOUBLE_TIMER = Date.now();
            RUNNER_EL.classList.add('double-score');
            showFloatingText('✖️ Double Score!');
          }
          p.el.style.transition = 'transform 0.2s, opacity 0.2s';
          p.el.style.transform = 'translateY(50%) scale(1.5)';
          p.el.style.opacity = '0';
          setTimeout(() => p.el.remove(), 200);
          POWERUPS.splice(i, 1);
        }
      }

      // ---- Move clouds ----
      document.querySelectorAll('.cloud').forEach(cl => {
        const speed = parseFloat(cl.dataset.speed) || 0.3;
        const left = parseFloat(cl.style.left) || 0;
        cl.style.left = (left - speed * dt * 10) + '%';
      });

      // ---- Move speed lines ----
      document.querySelectorAll('.speed-line').forEach(sl => {
        const sp = parseFloat(sl.dataset.speed) || 3;
        const right = parseFloat(sl.style.right) || 0;
        sl.style.right = (right + sp * timeFactor) + 'px';
      });

      // ---- Move road lines & stripes ----
      document.querySelectorAll('.road-line, .ground-stripe').forEach(el => {
        const right = parseFloat(el.style.right) || 0;
        el.style.right = (right + SPEED * timeFactor * 1.2) + 'px';
      });

      // ---- Powerup timers ----
      if (HAS_SHIELD && Date.now() - SHIELD_TIMER > 8000) {
        HAS_SHIELD = false;
        RUNNER_EL.classList.remove('shielded');
      }
      if (HAS_DOUBLE && Date.now() - DOUBLE_TIMER > 5000) {
        HAS_DOUBLE = false;
        RUNNER_EL.classList.remove('double-score');
      }

      updateHUD();
      frameId = requestAnimationFrame(gameLoop);
    }

    // ===== CONTROLS =====
    function moveRunner(dir) {
      if (!IS_ALIVE || IS_PAUSED) return;
      RUNNER_LANE = Math.max(0, Math.min(2, RUNNER_LANE + dir));
      const laneClass = ['lane-up', 'lane-mid', 'lane-down'][RUNNER_LANE];
      RUNNER_EL.className = `runner ${laneClass}`;
    }

    function doJump() {
      if (!IS_ALIVE || IS_PAUSED || IS_JUMPING) return;
      IS_JUMPING = true;
      RUNNER_EL.classList.add('jumping');
      setTimeout(() => {
        IS_JUMPING = false;
        RUNNER_EL.classList.remove('jumping');
      }, 500);
    }

    function togglePause() {
      if (!IS_ALIVE) return;
      IS_PAUSED = !IS_PAUSED;
      const po = document.querySelector('.pause-overlay');
      if (IS_PAUSED) po.classList.add('active');
      else po.classList.remove('active');
    }

    function quitGame() {
      IS_ALIVE = false;
      TIME_USED = Math.floor((Date.now() - GAME_START_TIME) / 1000);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      document.querySelector('.best-display').innerHTML = `Best: <b>${BEST}</b>`;
      window.parent.postMessage({ type: 'quit' }, '*');
    }

    // ===== RENDER =====
    function render() {
      root.innerHTML = `
        <!-- START SCREEN -->
        <div id="start-screen" class="screen">
          <div class="logo">🏃</div>
          <h1>MATHS<br><span>RACING</span></h1>
          <div class="subtitle">Chạy, né & giải toán</div>
          <button class="play-btn" id="play-btn">▶ PLAY</button>
          <div class="best-display">Best: <b>${BEST}</b></div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen hidden">
          <div class="game-area">
            <div class="runner lane-mid">🏃</div>
          </div>
          <div class="hud">
            <div class="hud-item hud-hearts">❤️❤️❤️</div>
            <div class="hud-item hud-score">0</div>
            <div class="hud-item hud-combo"></div>
            <div class="hud-item hud-dist">0m</div>
            <div class="hud-item hud-level">Lv.1</div>
          </div>
          <div class="math-overlay">
            <div class="math-box">
              <h3>🧠 GIẢI TOÁN – TĂNG TỐC</h3>
              <div class="equation"></div>
              <div class="math-options"></div>
            </div>
          </div>
          <div class="pause-overlay">
            <div class="pause-box">
              <h2>⏸ PAUSED</h2>
              <p>Nghỉ một chút nhé!</p>
              <button class="pause-btn" id="resume-btn">▶ Tiếp tục</button>
            </div>
          </div>
          <div class="controls">
            <button class="ctrl-btn left" id="btn-left">◀</button>
            <button class="ctrl-btn jump" id="btn-jump">⬆</button>
            <button class="ctrl-btn right" id="btn-right">▶</button>
          </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameover-screen" class="screen hidden">
          <div class="go-icon">😵</div>
          <h2>GAME OVER</h2>
          <div class="go-stats">
            <div class="go-stat"><div class="label">Điểm</div><div class="val final-score">0</div></div>
            <div class="go-stat"><div class="label">Khoảng cách</div><div class="val final-dist">0m</div></div>
            <div class="go-stat"><div class="label">Thời gian</div><div class="val final-time">0s</div></div>
            <div class="go-stat"><div class="label">Best</div><div class="val final-best">0</div>
              <div class="new-best">🎉 NEW BEST!</div>
            </div>
          </div>
          <div class="go-actions">
            <button class="go-btn restart" id="restart-btn">🔄 Chơi lại</button>
            <button class="go-btn quit" id="quit-btn">← Menu</button>
          </div>
        </div>
      `;

      // Bind events
      document.getElementById('play-btn').addEventListener('click', startGame);
      document.getElementById('restart-btn').addEventListener('click', startGame);
      document.getElementById('quit-btn').addEventListener('click', quitGame);
      document.getElementById('resume-btn').addEventListener('click', togglePause);

      const leftBtn = document.getElementById('btn-left');
      const jumpBtn = document.getElementById('btn-jump');
      const rightBtn = document.getElementById('btn-right');

      leftBtn.addEventListener('touchstart', e => { e.preventDefault(); moveRunner(-1); });
      leftBtn.addEventListener('mousedown', e => { e.preventDefault(); moveRunner(-1); });
      jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); doJump(); });
      jumpBtn.addEventListener('mousedown', e => { e.preventDefault(); doJump(); });
      rightBtn.addEventListener('touchstart', e => { e.preventDefault(); moveRunner(1); });
      rightBtn.addEventListener('mousedown', e => { e.preventDefault(); moveRunner(1); });

      // Keyboard
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') moveRunner(-1);
        if (e.key === 'ArrowRight' || e.key === 'd') moveRunner(1);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') doJump();
        if (e.key === 'Escape' || e.key === 'p') togglePause();
      });

      // PostMessage init
      window.addEventListener('message', ev => {
        if (ev.data && ev.data.type === 'init') {
          // Có thể nhận config nếu cần
        }
      });
      window.parent.postMessage({ type: 'init' }, '*');
    }

    render();
  })();
</script>
</body>
</html>
