<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Find The Number - 100 Màn</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

        :root {
            --paper: #FBF7EE;
            --ink: #20283A;
            --card: #FFFFFF;
            --line: #E7D9BE;
            --teal: #1B998B;
            --orange: #E4572E;
            --yellow: #F4B942;
            --ticket: #E4572E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .font-display {
            font-family: 'Poppins', sans-serif;
        }
        .font-body {
            font-family: 'Nunito', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .bg-paper {
            background: var(--paper);
        }

        .note-card {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 4px 0 var(--line), 0 8px 24px rgba(32, 40, 58, 0.06);
        }

        .dash-rule {
            border-top: 2px dashed var(--line);
        }

        @keyframes pop {
            0% {
                transform: scale(0.85);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .anim-pop {
            animation: pop 0.25s ease-out;
        }

        @keyframes flash-correct {
            0% {
                background: #1B998B44;
            }
            100% {
                background: transparent;
            }
        }
        .flash-correct {
            animation: flash-correct 0.5s ease-out;
        }

        @keyframes flash-wrong {
            0% {
                background: #E4572E44;
            }
            100% {
                background: transparent;
            }
        }
        .flash-wrong {
            animation: flash-wrong 0.4s ease-out;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .hidden {
            display: none !important;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .menu-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 16px;
            font-size: 1.125rem;
            font-weight: 700;
            border: 2px solid;
            transition: box-shadow 0.15s ease;
            background: none;
        }
        .menu-btn:hover {
            box-shadow: 0 6px 16px rgba(32, 40, 58, 0.12);
        }

        .diff-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            border: 2px solid;
            text-align: left;
            transition: box-shadow 0.15s ease;
            background: none;
        }
        .diff-btn:hover {
            box-shadow: 0 6px 16px rgba(32, 40, 58, 0.12);
        }

        .back-link {
            margin-top: 1.5rem;
            background: none;
            border: none;
            font-size: 0.875rem;
            color: rgba(32, 40, 58, 0.5);
            font-family: 'Poppins', sans-serif;
        }
        .back-link:hover {
            color: var(--ink);
        }

        header.app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            background: white;
            border-bottom: 1px solid rgba(32, 40, 58, 0.1);
            flex-wrap: wrap;
        }

        .quit-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 0.875rem;
            color: var(--ticket);
            border: 1px solid rgba(228, 87, 46, 0.4);
            border-radius: 16px;
            padding: 0.5rem 1rem;
            background: none;
            transition: background 0.15s ease;
        }
        .quit-btn:hover {
            background: rgba(228, 87, 46, 0.05);
        }

        .action-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.875rem;
            border: 2px solid;
            transition: box-shadow 0.15s ease;
            background: none;
        }
        .action-btn:hover {
            box-shadow: 0 4px 12px rgba(32, 40, 58, 0.1);
        }

        .buttons-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-block {
            text-align: center;
        }
        .stat-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .stat-label {
            font-family: 'Nunito', sans-serif;
            font-size: 0.75rem;
            color: rgba(32, 40, 58, 0.5);
        }

        .target-display {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, #1B998B15, #F4B94215);
            border: 2px solid var(--line);
        }

        .target-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3rem;
            height: 3rem;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.4rem;
            background: #FFFBF2;
            border: 2px solid var(--line);
            transition: all 0.3s ease;
        }
        .target-badge.found {
            background: var(--teal);
            border-color: var(--teal);
            color: white;
            text-decoration: line-through;
            opacity: 0.8;
        }

        .number-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: min(90vw, 480px);
        }

        .num-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            border-radius: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            background: #FFFBF2;
            border: 2px solid var(--line);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }
        .num-cell:active {
            transform: scale(0.94);
            box-shadow: 0 2px 4px rgba(32, 40, 58, 0.1);
        }
        .num-cell.correct {
            background: #1B998B;
            border-color: #1B998B;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(27, 153, 139, 0.3);
            pointer-events: none;
        }
        .num-cell.wrong {
            background: #E4572E;
            border-color: #E4572E;
            color: white;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-4px);
            }
            40% {
                transform: translateX(4px);
            }
            60% {
                transform: translateX(-3px);
            }
            80% {
                transform: translateX(2px);
            }
        }

        .timer-bar {
            width: 100%;
            max-width: min(90vw, 480px);
            height: 8px;
            border-radius: 4px;
            background: var(--line);
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.1s linear, background 0.3s ease;
        }

        .combo-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            background: #F4B94220;
            color: #E4572E;
            border: 1px solid #F4B942;
        }

        .score-popup {
            position: fixed;
            pointer-events: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            color: #1B998B;
            z-index: 100;
            animation: score-fly 0.8s ease-out forwards;
        }
        .score-popup.wrong-pop {
            color: #E4572E;
        }

        @keyframes score-fly {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.3);
            }
        }

        @media (min-width: 640px) {
            .number-grid {
                gap: 10px;
                max-width: 480px;
            }
            .num-cell {
                border-radius: 16px;
            }
        }

        .pause-overlay {
            position: fixed;
            inset: 0;
            background: rgba(251, 247, 238, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(4px);
        }
        .pause-card {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 24px;
            padding: 2.5rem;
            text-align: center;
            max-width: 28rem;
            width: 90%;
            box-shadow: 0 4px 0 var(--line), 0 8px 24px rgba(32, 40, 58, 0.06);
        }

        .level-complete-overlay {
            position: fixed;
            inset: 0;
            background: rgba(251, 247, 238, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 60;
            backdrop-filter: blur(4px);
        }
        .level-complete-card {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 24px;
            padding: 2.5rem;
            text-align: center;
            max-width: 28rem;
            width: 90%;
            box-shadow: 0 4px 0 var(--line), 0 8px 24px rgba(32, 40, 58, 0.06);
            animation: pop 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        (function() {
            'use strict';

            // ---------- API giả lập (localStorage) ----------
            const ProgressAPI = {
                getLevel: function() {
                    return new Promise(function(resolve) {
                        try {
                            var level = parseInt(localStorage.getItem('ftn_level'), 10);
                            resolve(level > 0 ? level : 1);
                        } catch (e) {
                            resolve(1);
                        }
                    });
                },
                setLevel: function(level) {
                    return new Promise(function(resolve) {
                        try {
                            localStorage.setItem('ftn_level', String(level));
                        } catch (e) {}
                        resolve();
                    });
                },
                clear: function() {
                    return new Promise(function(resolve) {
                        try {
                            localStorage.removeItem('ftn_level');
                        } catch (e) {}
                        resolve();
                    });
                }
            };

            // ---------- Constants ----------
            var MAX_LEVEL = 100;
            var MAX_TARGETS = 10;
            var BASE_TIMER = 30;
            var TIME_BONUS = 2;
            var TIME_PENALTY = 2;
            var COINS_PER_LEVEL = 10;

            function addStars(amount) {
                if (amount <= 0) return;
                userStars += amount;
                updateStarUI();
            }

            function exchangeStars() {
                if (userStars <= 0) return;
                try {
                    parent.postMessage({ type: 'exchange-stars', data: {} }, '*');
                } catch (e) {}
                showScorePopup('Đang đổi sao...', false);
            }

            function handleExchangeResult(data) {
                if (data && data.success) {
                    userCoins = data.coins;
                    userStars = data.stars;
                    updateStarUI();
                    updateCoinUI();
                    showScorePopup('+' + (data.exchanged || 0) + ' xu', false);
                    // Disable all exchange buttons
                    var btns = ['btn-exchange', 'btn-exchange-menu', 'btn-exchange-over'];
                    btns.forEach(function(id) {
                        var b = document.getElementById(id);
                        if (b) b.disabled = true;
                    });
                }
            }

            function updateStarUI() {
                var el = document.getElementById('star-display');
                if (el) el.textContent = userStars;
                var menuEl = document.getElementById('star-display-menu');
                if (menuEl) menuEl.textContent = userStars;
                var exchangeBtn = document.getElementById('btn-exchange');
                if (exchangeBtn) exchangeBtn.disabled = userStars <= 0;
                var exchangeBtnMenu = document.getElementById('btn-exchange-menu');
                if (exchangeBtnMenu) exchangeBtnMenu.disabled = userStars <= 0;
            }

            function updateCoinUI() {
                var el = document.getElementById('coin-display');
                if (el) el.textContent = userCoins;
                var menuEl = document.getElementById('coin-display-menu');
                if (menuEl) menuEl.textContent = userCoins;
            }

            function syncProgressToBackend(level) {
                if (!apiBase || !authToken || !gameId) return;
                try {
                    parent.postMessage({ type: 'save-loadout', data: { loadout: { level: level, score: state.score } } }, '*');
                } catch (e) {}
            }

            // ---------- Listen for init from parent ----------
            window.addEventListener('message', function(e) {
                if (!e.data || typeof e.data !== 'object') return;
                if (e.data.type === 'init') {
                    var d = e.data.data || {};
                    apiBase = d.apiBase || '';
                    authToken = d.authToken || null;
                    gameId = d.gameId || null;
                    userCoins = d.userCoins || d.coins || 0;
                    userStars = d.userStars || d.stars || 0;
                    if (d.loadout && typeof d.loadout === 'object') {
                        var savedLevel = parseInt(d.loadout.level, 10);
                        if (savedLevel > 0 && savedLevel <= MAX_LEVEL) {
                            state.level = savedLevel;
                        }
                        if (d.loadout.score) state.score = d.loadout.score;
                        if (d.loadout.stars) userStars = d.loadout.stars;
                    }
                    updateCoinUI();
                    updateStarUI();
                }
                if (e.data.type === 'coins-added') {
                    var cd = e.data.data || {};
                    if (cd.success && typeof cd.coins === 'number') {
                        userCoins = cd.coins;
                        updateCoinUI();
                    }
                }
                if (e.data.type === 'exchange-stars-result') {
                    handleExchangeResult(e.data.data || {});
                }
            });

            // ---------- State ----------
            var apiBase = '';
            var authToken = null;
            var gameId = null;
            var userCoins = 0;
            var userStars = 0;
            var STAR_TO_COIN_RATE = 5; // 1 sao = 5 xu

            var state = {
                screen: 'menu', // 'menu' | 'playing' | 'gameover'
                level: 1,
                targetNumbers: [], // mảng các số cần tìm trong màn hiện tại
                foundTargets: [], // mảng boolean tương ứng
                numbers: [], // mảng các số hiển thị trên lưới
                score: 0,
                combo: 0,
                maxCombo: 0,
                timer: BASE_TIMER,
                maxTimer: BASE_TIMER,
                paused: false,
                gameOver: false,
                correctCount: 0,
                wrongCount: 0,
                timeUsed: 0,
                isTransitioning: false, // đang chờ chuyển màn
            };

            var timerInterval = null;
            var transitionTimeout = null;
            var root = document.getElementById('root');

            // ---------- Utility ----------
            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var tmp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = tmp;
                }
                return arr;
            }

            function getGridSize(level) {
                // Tăng dần kích thước lưới theo level
                if (level <= 3) return { cols: 3, rows: 3 };
                if (level <= 6) return { cols: 4, rows: 4 };
                if (level <= 9) return { cols: 5, rows: 5 };
                if (level <= 15) return { cols: 6, rows: 6 };
                return { cols: 7, rows: 7 }; // từ màn 16 trở đi tối đa 7x7
            }

            function generateLevel(level) {
                var numTargets = Math.min(level, MAX_TARGETS);
                var gridSize = getGridSize(level);
                var totalCells = gridSize.cols * gridSize.rows;

                // Tạo target numbers ngẫu nhiên không trùng nhau (giá trị từ 1 đến 99)
                var targets = [];
                while (targets.length < numTargets) {
                    var n = Math.floor(Math.random() * 99) + 1;
                    if (targets.indexOf(n) === -1) {
                        targets.push(n);
                    }
                }

                // Tạo mảng numbers bao gồm targets và các số ngẫu nhiên khác
                var nums = targets.slice();
                while (nums.length < totalCells) {
                    var m = Math.floor(Math.random() * 99) + 1;
                    if (nums.indexOf(m) === -1) {
                        nums.push(m);
                    }
                }
                nums = shuffle(nums);

                state.targetNumbers = targets;
                state.foundTargets = targets.map(function() { return false; });
                state.numbers = nums;
                state.timer = BASE_TIMER;
                state.maxTimer = BASE_TIMER;
                state.combo = 0; // reset combo mỗi màn? có thể giữ combo xuyên màn, nhưng reset cho công bằng
                state.isTransitioning = false;
            }

            function startTimer() {
                stopTimer();
                timerInterval = setInterval(function() {
                    if (state.paused || state.gameOver || state.isTransitioning) return;
                    state.timer = Math.max(0, state.timer - 0.1);
                    state.timeUsed += 0.1;
                    if (state.timer <= 0) {
                        state.timer = 0;
                        endGame();
                    }
                    updateTimerUI();
                }, 100);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function endGame() {
                state.gameOver = true;
                stopTimer();
                if (transitionTimeout) {
                    clearTimeout(transitionTimeout);
                    transitionTimeout = null;
                }
                syncProgressToBackend(state.level);
                ProgressAPI.setLevel(state.level).then(function() {
                    state.screen = 'gameover';
                    render();
                });
            }

            function handleNumberClick(num, idx) {
                if (state.paused || state.gameOver || state.isTransitioning) return;

                // Kiểm tra xem số này có phải là target chưa tìm thấy không
                var targetIndex = state.targetNumbers.indexOf(num);
                if (targetIndex !== -1 && !state.foundTargets[targetIndex]) {
                    // Tìm đúng
                    state.foundTargets[targetIndex] = true;
                    state.correctCount++;
                    state.combo++;
                    if (state.combo > state.maxCombo) state.maxCombo = state.combo;

                    var bonus = 100 + (state.combo - 1) * 25;
                    state.score += bonus;
                    state.timer = Math.min(state.maxTimer, state.timer + TIME_BONUS);

                    // Award star per correct find
                    addStars(1);

                    showScorePopup('+' + bonus, false);
                    var cellEl = document.querySelector('[data-idx="' + idx + '"]');
                    if (cellEl) {
                        cellEl.classList.add('correct');
                        cellEl.disabled = true;
                    }

                    // Kiểm tra hoàn thành màn
                    var allFound = state.foundTargets.every(function(v) { return v; });
                    if (allFound) {
                        completeLevel();
                    } else {
                        renderTargetBadges();
                        updateStatsUI();
                    }
                } else {
                    // Bấm sai (hoặc số đã tìm thấy rồi)
                    if (targetIndex !== -1 && state.foundTargets[targetIndex]) {
                        // Đã tìm thấy rồi, coi như sai nhẹ? Không trừ nhiều, có thể chỉ rung nhẹ
                        return;
                    }
                    state.combo = 0;
                    state.wrongCount++;
                    state.timer = Math.max(0, state.timer - TIME_PENALTY);
                    showScorePopup('-' + TIME_PENALTY + 's', true);
                    var wrongEl = document.querySelector('[data-idx="' + idx + '"]');
                    if (wrongEl) {
                        wrongEl.classList.add('wrong');
                        setTimeout(function() {
                            wrongEl.classList.remove('wrong');
                        }, 500);
                    }
                    if (state.timer <= 0) {
                        state.timer = 0;
                        endGame();
                    } else {
                        updateTimerUI();
                        updateStatsUI();
                    }
                }
            }

            function completeLevel() {
                state.isTransitioning = true;
                stopTimer();

                // Award stars for completing level
                addStars(5);
                syncProgressToBackend(state.level);

                // Hiển thị overlay hoàn thành màn
                showLevelCompleteOverlay();

                // Lưu level mới (level + 1) vào API
                var nextLevel = state.level + 1;
                if (nextLevel > MAX_LEVEL) {
                    // Đã hoàn thành tất cả 100 màn
                    ProgressAPI.setLevel(MAX_LEVEL).then(function() {
                        // Có thể hiển thị màn chúc mừng đặc biệt
                        setTimeout(function() {
                            state.screen = 'gameover';
                            state.gameOver = true;
                            state.isTransitioning = false;
                            render();
                        }, 1500);
                    });
                } else {
                    ProgressAPI.setLevel(nextLevel).then(function() {
                        // Chờ 1.5 giây rồi chuyển màn
                        transitionTimeout = setTimeout(function() {
                            state.level = nextLevel;
                            state.score += 500; // thưởng hoàn thành màn
                            state.isTransitioning = false;
                            generateLevel(state.level);
                            startTimer();
                            hideLevelCompleteOverlay();
                            renderPlaying();
                        }, 1500);
                    });
                }
            }

            function showLevelCompleteOverlay() {
                var overlay = document.createElement('div');
                overlay.className = 'level-complete-overlay';
                overlay.id = 'level-complete-overlay';
                overlay.innerHTML =
                    '<div class="level-complete-card">' +
                    '<div style="font-size:3.75rem; margin-bottom:1rem;">🎉</div>' +
                    '<h2 class="font-display" style="font-size:1.75rem; margin-bottom:0.5rem;">Màn ' + state.level + ' hoàn thành!</h2>' +
                    '<p class="font-body" style="color:rgba(32,40,58,0.6); margin-bottom:1rem;">+500 điểm thưởng</p>' +
                    '<p class="font-body" style="font-size:0.875rem; color:rgba(32,40,58,0.5);">Đang chuyển màn tiếp theo...</p>' +
                    '</div>';
                document.body.appendChild(overlay);
            }

            function hideLevelCompleteOverlay() {
                var overlay = document.getElementById('level-complete-overlay');
                if (overlay) overlay.remove();
            }

            function showScorePopup(text, isWrong) {
                var popup = document.createElement('div');
                popup.className = 'score-popup' + (isWrong ? ' wrong-pop' : '');
                popup.textContent = text;
                popup.style.left = (window.innerWidth / 2 - 30) + 'px';
                popup.style.top = (window.innerHeight / 2 - 20) + 'px';
                document.body.appendChild(popup);
                setTimeout(function() {
                    popup.remove();
                }, 800);
            }

            // ---------- Rendering ----------
            function render() {
                if (state.screen === 'menu') return renderMenu();
                if (state.screen === 'playing') return renderPlaying();
                if (state.screen === 'gameover') return renderGameOver();
            }

            function renderMenu() {
                ProgressAPI.getLevel().then(function(savedLevel) {
                    state.level = savedLevel;
                    var continueBtnHtml = '';
                    if (savedLevel > 1) {
                        continueBtnHtml =
                            '<button id="btn-continue" class="menu-btn font-display" style="border-color:#1B998B; color:#1B998B; background:#1B998B10; margin-bottom:0.75rem;">▶ Tiếp tục màn ' +
                            savedLevel + '</button>';
                    }
                    root.innerHTML =
                        '<div class="screen bg-paper">' +
                        '<div class="anim-pop note-card" style="padding:2.5rem; max-width:28rem; width:100%; text-align:center;">' +
                        '<div style="font-size:3.75rem; margin-bottom:1rem;">🔍</div>' +
                        '<h1 class="font-display" style="font-size:1.875rem; margin:0 0 0.5rem;">' +
                        '<span style="color:#1B998B">TÌM</span> <span style="color:#E4572E">SỐ</span>' +
                        '</h1>' +
                        '<p class="font-body" style="color:rgba(32,40,58,0.6); margin-bottom:2rem;">100 màn thử thách, tìm đủ số để qua màn!</p>' +
                        '<div style="display:flex; flex-direction:column; gap:0.75rem;">' +
                        continueBtnHtml +
                        '<button id="btn-new-game" class="menu-btn font-display" style="border-color:#E4572E; color:#E4572E; background:#E4572E10;">🔄 Chơi mới từ đầu</button>' +
                        '</div>' +
                        '<div class="dash-rule" style="margin-top:2rem; padding-top:1.25rem;">' +
                        '<p class="font-display" style="font-size:0.875rem; color:rgba(32,40,58,0.5); margin-bottom:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">Tiến trình</p>' +
                        '<div style="display:flex; justify-content:center; gap:1.5rem; flex-wrap:wrap;">' +
                        '<div class="stat-block"><div class="stat-num" style="color:#F4B942">🏆 ' + savedLevel + '/100</div><div class="stat-label">Màn hiện tại</div></div>' +
                        '<div class="stat-block"><div class="stat-num" style="color:#F4B942">🌟 <span id="star-display-menu">' + userStars + '</span></div><div class="stat-label">Sao</div></div>' +
                        '<div class="stat-block"><div class="stat-num" style="color:#F4B942">🪙 <span id="coin-display-menu">' + userCoins + '</span></div><div class="stat-label">Xu hiện có</div></div>' +
                        '</div>' +
                        '<div style="margin-top:1rem;">' +
                        '<button id="btn-exchange-menu" class="menu-btn font-display" style="border-color:#F4B942; color:#F4B942; background:#F4B94210; font-size:0.9rem;"' +
                        (userStars <= 0 ? ' disabled' : '') + '>🌟 Đổi ' + userStars + ' sao → ' + (userStars * STAR_TO_COIN_RATE) + ' xu</button>' +
                        '<p style="font-size:0.75rem; color:rgba(32,40,58,0.4); margin-top:0.5rem;">Tỷ lệ: 1 sao = ' + STAR_TO_COIN_RATE + ' xu</p>' +
                        '</div>' +
                        '</div>' +
                        '</div>' +
                        '</div>';

                    var btnContinue = document.getElementById('btn-continue');
                    if (btnContinue) {
                        btnContinue.onclick = function() {
                            startGameFromLevel(savedLevel);
                        };
                    }
                    document.getElementById('btn-new-game').onclick = function() {
                        ProgressAPI.clear().then(function() {
                            startGameFromLevel(1);
                        });
                    };
                    var exchangeBtnMenu = document.getElementById('btn-exchange-menu');
                    if (exchangeBtnMenu) {
                        exchangeBtnMenu.onclick = function() {
                            exchangeStars();
                            // Re-render menu to update star/coin display
                            renderMenu();
                        };
                    }
                });
            }

            function startGameFromLevel(level) {
                state.level = level;
                state.score = 0;
                state.maxCombo = 0;
                state.correctCount = 0;
                state.wrongCount = 0;
                state.timeUsed = 0;
                state.gameOver = false;
                state.paused = false;
                state.screen = 'playing';
                generateLevel(level);
                startTimer();
                renderPlaying();
            }

            function renderPlaying() {
                var gridSize = getGridSize(state.level);
                var cols = gridSize.cols;
                var rows = gridSize.rows;

                // Tạo HTML cho các ô số
                var numbersHtml = '';
                for (var i = 0; i < state.numbers.length; i++) {
                    var n = state.numbers[i];
                    var isFound = false;
                    // Kiểm tra xem ô này có phải target đã tìm thấy không
                    var targetIdx = state.targetNumbers.indexOf(n);
                    if (targetIdx !== -1 && state.foundTargets[targetIdx]) {
                        isFound = true;
                    }
                    var fontSize = state.numbers.length > 36 ? 'clamp(0.8rem, 2.5vw, 1.1rem)' :
                        'clamp(1rem, 3vw, 1.4rem)';
                    var extraClass = isFound ? ' correct' : '';
                    var disabledAttr = isFound ? ' disabled' : '';
                    numbersHtml += '<button class="num-cell' + extraClass + '" data-idx="' + i + '" data-num="' + n +
                        '" style="font-size:' + fontSize + ';"' + disabledAttr + '>' + n + '</button>';
                }

                // Tạo HTML cho target badges
                var targetsHtml = '';
                for (var j = 0; j < state.targetNumbers.length; j++) {
                    var foundClass = state.foundTargets[j] ? ' found' : '';
                    targetsHtml += '<span class="target-badge' + foundClass + '">' + state.targetNumbers[j] + '</span>';
                }

                var comboHtml = state.combo > 1 ?
                    '<span class="combo-badge">🔥 ×' + state.combo + '</span>' :
                    '';

                root.innerHTML =
                    '<div class="bg-paper" style="flex:1; display:flex; flex-direction:column;">' +
                    '<header class="app-header">' +
                    '<div style="display:flex; align-items:center; gap:0.75rem;">' +
                    '<span style="font-size:1.875rem;">🔍</span>' +
                    '<h1 class="font-display" style="font-size:1.25rem; color:#1B998B; margin:0;">TÌM SỐ</h1>' +
                    '</div>' +
                    '<div class="font-body" style="display:flex; align-items:center; gap:1.25rem; font-size:0.875rem; color:rgba(32,40,58,0.7); flex-wrap:wrap;">' +
                    '<span class="font-mono">Màn ' + state.level + '/' + MAX_LEVEL + '</span>' +
                    '<span>⭐ ' + state.score + '</span>' +
                    '<span>🌟 <span id="star-display">' + userStars + '</span></span>' +
                    '<span>🪙 <span id="coin-display">' + userCoins + '</span></span>' +
                    '<button id="btn-exchange" class="action-btn" style="border-color:#F4B942; color:#F4B942; font-size:0.75rem; padding:0.25rem 0.75rem; border-radius:12px;"' +
                    (userStars <= 0 ? ' disabled' : '') + '>Đổi sao → xu</button>' +
                    '<span>🎯 ' + state.foundTargets.filter(function(v) { return v; }).length + '/' + state
                    .targetNumbers.length + '</span>' +
                    '</div>' +
                    '<button id="btn-pause" class="quit-btn" style="color:var(--ink); border-color:rgba(32,40,58,0.2);">⏸ Tạm dừng</button>' +
                    '<button id="btn-quit" class="quit-btn">Thoát</button>' +
                    '</header>' +

                    '<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1rem; gap:1rem;">' +

                    '<div class="target-display anim-pop">' +
                    '<span class="font-body" style="font-size:1rem; color:rgba(32,40,58,0.6); margin-right:0.5rem;">TÌM:</span>' +
                    targetsHtml +
                    comboHtml +
                    '</div>' +

                    '<div class="timer-bar">' +
                    '<div class="timer-fill" style="width:' + (state.timer / state.maxTimer * 100) + '%; background:' +
                    (state.timer > 15 ? '#1B998B' : state.timer > 5 ? '#F4B942' : '#E4572E') + ';"></div>' +
                    '</div>' +
                    '<div class="font-mono" style="font-size:0.8rem; color:rgba(32,40,58,0.5); margin-top:-0.5rem;">' +
                    state.timer.toFixed(1) + 's</div>' +

                    '<div class="number-grid" style="grid-template-columns:repeat(' + cols + ', 1fr);">' +
                    numbersHtml +
                    '</div>' +

                    '<div style="display:flex; gap:1rem; align-items:center; justify-content:center; margin-top:0.5rem;">' +
                    '<div class="stat-block"><div class="stat-num font-mono" style="color:#1B998B; font-size:1.1rem;">' +
                    state.correctCount + '</div><div class="stat-label">Đúng</div></div>' +
                    '<div class="stat-block"><div class="stat-num font-mono" style="color:#E4572E; font-size:1.1rem;">' +
                    state.wrongCount + '</div><div class="stat-label">Sai</div></div>' +
                    '<div class="stat-block"><div class="stat-num font-mono" style="color:#F4B942; font-size:1.1rem;">' +
                    state.maxCombo + '</div><div class="stat-label">Combo max</div></div>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +

                    '<div id="pause-overlay" class="pause-overlay hidden">' +
                    '<div class="pause-card anim-pop">' +
                    '<div style="font-size:3rem; margin-bottom:1rem;">⏸</div>' +
                    '<h2 class="font-display" style="font-size:1.5rem; margin-bottom:0.5rem;">Tạm dừng</h2>' +
                    '<p class="font-body" style="color:rgba(32,40,58,0.6); margin-bottom:1.5rem;">Màn ' + state.level +
                    ' - Điểm: <strong>' + state.score + '</strong></p>' +
                    '<div style="display:flex; flex-direction:column; gap:0.75rem;">' +
                    '<button id="btn-resume" class="menu-btn font-display" style="border-color:#1B998B; color:#1B998B; background:#1B998B10;">▶ Tiếp tục</button>' +
                    '<button id="btn-restart-pause" class="menu-btn font-display" style="border-color:#F4B942; color:#F4B942; background:#F4B94210;">🔄 Chơi lại màn này</button>' +
                    '<button id="btn-quit-pause" class="menu-btn font-display" style="border-color:#E4572E; color:#E4572E; background:#E4572E10;">🏠 Thoát</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>';

                // Gán sự kiện click cho các ô số
                root.querySelectorAll('.num-cell').forEach(function(btn) {
                    btn.onclick = function() {
                        handleNumberClick(parseInt(btn.dataset.num, 10), parseInt(btn.dataset.idx, 10));
                    };
                });

                // Gán sự kiện cho các nút điều khiển
                document.getElementById('btn-pause').onclick = function() {
                    state.paused = true;
                    document.getElementById('pause-overlay').classList.remove('hidden');
                };
                document.getElementById('btn-quit').onclick = function() {
                    stopTimer();
                    ProgressAPI.setLevel(state.level).then(function() {
                        state.screen = 'menu';
                        render();
                    });
                };
                var exchangeBtn = document.getElementById('btn-exchange');
                if (exchangeBtn) {
                    exchangeBtn.onclick = function() { exchangeStars(); };
                }
                document.getElementById('btn-resume').onclick = function() {
                    state.paused = false;
                    document.getElementById('pause-overlay').classList.add('hidden');
                };
                document.getElementById('btn-restart-pause').onclick = function() {
                    document.getElementById('pause-overlay').classList.add('hidden');
                    state.paused = false;
                    // Reset màn hiện tại
                    state.score = 0;
                    state.maxCombo = 0;
                    state.correctCount = 0;
                    state.wrongCount = 0;
                    state.timeUsed = 0;
                    generateLevel(state.level);
                    startTimer();
                    renderPlaying();
                };
                document.getElementById('btn-quit-pause').onclick = function() {
                    document.getElementById('pause-overlay').classList.add('hidden');
                    stopTimer();
                    ProgressAPI.setLevel(state.level).then(function() {
                        state.screen = 'menu';
                        render();
                    });
                };
            }

            function updateTimerUI() {
                var timerFill = document.querySelector('.timer-fill');
                if (timerFill) {
                    var pct = (state.timer / state.maxTimer) * 100;
                    timerFill.style.width = pct + '%';
                    timerFill.style.background = state.timer > 15 ? '#1B998B' : state.timer > 5 ? '#F4B942' : '#E4572E';
                }
                var timerText = document.querySelector('.font-mono');
                if (timerText && timerText.textContent.indexOf('s') > -1) {
                    timerText.textContent = state.timer.toFixed(1) + 's';
                }
            }

            function updateStatsUI() {
                // Cập nhật số đã tìm / tổng
                var foundCount = state.foundTargets.filter(function(v) { return v; }).length;
                var statSpans = document.querySelectorAll('header.app-header span');
                for (var i = 0; i < statSpans.length; i++) {
                    if (statSpans[i].textContent.indexOf('🎯') === 0) {
                        statSpans[i].textContent = '🎯 ' + foundCount + '/' + state.targetNumbers.length;
                        break;
                    }
                }
                // Cập nhật điểm
                for (var j = 0; j < statSpans.length; j++) {
                    if (statSpans[j].textContent.indexOf('⭐') === 0) {
                        statSpans[j].textContent = '⭐ ' + state.score;
                        break;
                    }
                }
                // Cập nhật combo badge (nếu có)
                var comboEl = document.querySelector('.combo-badge');
                if (state.combo > 1) {
                    if (comboEl) {
                        comboEl.textContent = '🔥 ×' + state.combo;
                    }
                } else if (comboEl) {
                    comboEl.remove();
                }
                // Cập nhật target badges
                renderTargetBadges();
            }

            function renderTargetBadges() {
                var targetDisplay = document.querySelector('.target-display');
                if (!targetDisplay) return;
                var badges = targetDisplay.querySelectorAll('.target-badge');
                for (var i = 0; i < badges.length; i++) {
                    var idx = parseInt(badges[i].dataset.targetIndex, 10);
                    if (state.foundTargets[idx]) {
                        badges[i].classList.add('found');
                    } else {
                        badges[i].classList.remove('found');
                    }
                }
            }

            function renderGameOver() {
                var isMaxLevel = state.level >= MAX_LEVEL && state.gameOver && !state.isTransitioning;
                var title = isMaxLevel ? 'Chúc mừng! Bạn đã hoàn thành tất cả 100 màn!' : 'Hết giờ!';
                var icon = isMaxLevel ? '🏆' : '⏱️';

                root.innerHTML =
                    '<div class="screen bg-paper">' +
                    '<div class="anim-pop note-card" style="padding:2.5rem; max-width:28rem; width:100%; text-align:center;">' +
                    '<div style="font-size:3.75rem; margin-bottom:1rem;">' + icon + '</div>' +
                    '<h2 class="font-display" style="font-size:1.5rem; margin:0 0 0.25rem;">' + title + '</h2>' +
                    '<p class="font-body" style="color:rgba(32,40,58,0.6); margin-bottom:1.5rem;">Màn đã đạt: <strong>' +
                    state.level + '/' + MAX_LEVEL + '</strong></p>' +
                    '<div class="dash-rule" style="padding-top:1.25rem; margin:1rem 0;">' +
                    '<div style="display:flex; justify-content:center; gap:2rem; flex-wrap:wrap;">' +
                    '<div class="stat-block"><div class="stat-num" style="color:#1B998B;">' + state.score +
                    '</div><div class="stat-label">Điểm</div></div>' +
                    '<div class="stat-block"><div class="stat-num" style="color:#1B998B;">' + state.correctCount +
                    '</div><div class="stat-label">Đúng</div></div>' +
                    '<div class="stat-block"><div class="stat-num" style="color:#E4572E;">' + state.wrongCount +
                    '</div><div class="stat-label">Sai</div></div>' +
                    '<div class="stat-block"><div class="stat-num" style="color:#F4B942;">' + state.maxCombo +
                    '</div><div class="stat-label">Combo max</div></div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="dash-rule" style="padding-top:1rem; margin-bottom:1.25rem;">' +
                    '<p class="font-body" style="font-size:0.875rem; color:rgba(32,40,58,0.5);">Thời gian chơi: ' +
                    state.timeUsed.toFixed(1) + 's</p>' +
                    '<div style="margin-top:0.75rem; display:flex; justify-content:center; gap:1.5rem;">' +
                    '<span style="font-size:0.875rem; color:#F4B942; font-weight:600;">🌟 ' + userStars + ' sao</span>' +
                    '<span style="font-size:0.875rem; color:#8A7C63;">🪙 ' + userCoins + ' xu</span>' +
                    '</div>' +
                    '<button id="btn-exchange-over" class="menu-btn font-display" style="border-color:#F4B942; color:#F4B942; background:#F4B94210; font-size:0.875rem; margin-top:0.75rem; padding:0.6rem 1rem;"' +
                    (userStars <= 0 ? ' disabled' : '') + '>🌟 Đổi ' + userStars + ' sao → ' + (userStars * STAR_TO_COIN_RATE) + ' xu</button>' +
                    '</div>' +
                    '<div style="display:flex; flex-direction:column; gap:0.75rem;">' +
                    '<button id="btn-retry" class="menu-btn font-display" style="border-color:#1B998B; color:#1B998B; background:#1B998B10;">🔄 Thử lại màn này</button>' +
                    '<button id="btn-home" class="menu-btn font-display" style="border-color:#8A7C6344; color:#8A7C63; background:#8A7C6308;">🏠 Menu</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>';

                document.getElementById('btn-retry').onclick = function() {
                    state.gameOver = false;
                    state.screen = 'playing';
                    state.score = 0;
                    state.maxCombo = 0;
                    state.correctCount = 0;
                    state.wrongCount = 0;
                    state.timeUsed = 0;
                    generateLevel(state.level);
                    startTimer();
                    renderPlaying();
                };
                document.getElementById('btn-home').onclick = function() {
                    state.screen = 'menu';
                    render();
                };
                var exchangeBtnOver = document.getElementById('btn-exchange-over');
                if (exchangeBtnOver) {
                    exchangeBtnOver.onclick = function() {
                        exchangeStars();
                        renderGameOver();
                    };
                }
            }

            // ---------- Khởi động ----------
            render();
            parent.postMessage({ type: 'ready' }, '*');
        })();
    </script>
</body>
</html>
