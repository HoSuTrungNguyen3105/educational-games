<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Master</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --bg: #f0f4f8;
    --panel: #ffffff;
    --ink: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;
    --board-bg: #e6eef5;
    --cell-bg: #ffffff;
    --shadow: 0 10px 30px -5px rgba(30,41,59,0.15);
    --shadow-sm: 0 4px 12px -2px rgba(30,41,59,0.08);
    --radius: 20px;
    --teal: #2dd4bf;
    --coral: #fb7185;
    --sun: #fbbf24;
    --lavender: #a78bfa;
    --mint: #34d399;
    --sky: #60a5fa;
    --peach: #fb923c;
    --ghost-cell: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  #root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
  }

  .hidden { display: none !important; }

  .font-display { font-family: 'Inter', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn {
    width: 100%;
    padding: 0.9rem 1rem;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);
    color: #fff;
    box-shadow: 0 8px 20px -4px rgba(13,148,136,0.35);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-secondary {
    background: #fff0f0;
    color: #e11d48;
    border: 1.5px solid #fecdd3;
  }
  .btn-secondary:hover { background: #ffe4e6; }
  .btn-amber {
    background: #fffbeb;
    color: #b45309;
    border: 1.5px solid #fde68a;
  }
  .btn-amber:hover { background: #fef3c7; }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .header-left {
    display: flex; align-items: center; gap: 0.5rem;
  }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--teal), var(--sky));
    display: grid; place-items: center;
    font-size: 1.1rem; color: #fff;
    box-shadow: 0 4px 10px -2px rgba(13,148,136,0.3);
  }
  .app-title {
    font-size: 1.05rem; font-weight: 800; margin: 0;
    background: linear-gradient(90deg, #0f766e, #0ea5e9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-info {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
  }
  .stat-pill {
    display: flex; align-items: center; gap: 0.35rem;
    padding: 0.3rem 0.65rem;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; font-weight: 700;
    color: var(--muted);
  }
  .stat-pill .val { color: var(--ink); font-size: 0.9rem; }
  .stat-pill.score .val { color: #e11d48; }
  .stat-pill.combo .val { color: #d97706; }
  .stat-pill.time .val { color: #0f766e; }

  .header-actions { display: flex; gap: 0.4rem; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: #f1f5f9; border: 1px solid var(--line);
    font-size: 1rem; color: var(--muted);
    transition: all 0.15s ease;
  }
  .icon-btn:hover { background: #e2e8f0; color: var(--ink); }

  .game-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.5rem;
    gap: 0.6rem;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .board-wrap {
    position: relative;
    padding: 6px;
    background: var(--board-bg);
    border-radius: 16px;
    box-shadow: inset 0 2px 8px rgba(30,41,59,0.06);
    flex-shrink: 0;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: min(88vw, 380px);
    height: min(88vw, 380px);
    gap: 2px;
  }

  .cell {
    width: 100%; height: 100%;
    border-radius: 4px;
    background: var(--cell-bg);
    border: none; padding: 0; margin: 0;
    position: relative;
    min-width: 0; min-height: 0;
    transition: transform 0.15s ease;
    outline: none;
    flex-shrink: 0;
  }
  .cell:focus-visible { box-shadow: inset 0 0 0 2px var(--teal); }

  .cell.recent {
    animation: placePop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes placePop {
    0% { transform: scale(0.5); opacity: 0.6; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes clearFlash {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.1); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }
  .anim-clear {
    animation: clearFlash 0.4s cubic-bezier(0.4,0,0.2,1) forwards;
    z-index: 2;
  }

  .tray-wrap {
    width: 100%;
    flex-shrink: 0;
  }
  .guide-text {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
    min-height: 1.25rem;
  }
  .tray {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 0.6rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    min-height: 96px;
  }

  .tray-slot {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 14px;
    cursor: grab;
    transition: all 0.2s ease;
    border: 2px solid transparent;
    background: #f8fafc;
    min-height: 84px;
    touch-action: none;
    position: relative;
  }
  .tray-slot.empty {
    opacity: 0.25;
    pointer-events: none;
    background: transparent;
  }
  .tray-slot.selected {
    border-color: var(--teal);
    background: rgba(45,212,191,0.08);
    box-shadow: 0 0 0 4px rgba(45,212,191,0.15);
    transform: translateY(-2px);
  }
  .tray-slot:not(.empty):hover {
    background: #f1f5f9;
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }
  .tray-slot:active { cursor: grabbing; }

  .tray-block {
    display: grid;
    gap: 1.5px;
    pointer-events: none;
  }
  .tray-cell {
    width: var(--ghost-cell); height: var(--ghost-cell);
    border-radius: 2.5px;
    flex-shrink: 0;
  }
  .tray-cell.empty { background: transparent !important; }

  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    opacity: 0.95;
    display: grid;
    gap: 1.5px;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.25));
    top: 0; left: 0;
    will-change: transform;
    contain: layout style paint;
    width: max-content;
    height: max-content;
    grid-auto-rows: var(--ghost-cell);
  }
  .drag-ghost .ghost-cell {
    width: var(--ghost-cell); height: var(--ghost-cell);
    border-radius: 2.5px;
    flex-shrink: 0;
  }
  .drag-ghost .ghost-cell.empty { background: transparent !important; }

  .score-popup {
    position: absolute;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--sun);
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    animation: scoreFloat 0.9s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes scoreFloat {
    0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -44px) scale(1.3); opacity: 0; }
  }

  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
    animation: particleFly 0.7s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .overlay-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2rem;
    max-width: 26rem;
    width: 100%;
    text-align: center;
    animation: popUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popUp {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .big-emoji { font-size: 3.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .overlay-title { font-size: 1.6rem; font-weight: 800; margin: 0 0 0.25rem; }
  .overlay-sub { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin: 1.25rem 0;
    padding: 1.25rem 0;
    border-top: 1.5px dashed var(--line);
    border-bottom: 1.5px dashed var(--line);
  }
  .stat-item { text-align: center; }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem; font-weight: 700;
  }
  .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }

  .menu-btn { margin-bottom: 0.65rem; }

  .back-link {
    margin-top: 1rem;
    background: none; border: none;
    font-size: 0.85rem; color: var(--muted);
    font-weight: 600;
  }
  .back-link:hover { color: var(--ink); }

  .help-list {
    text-align: left;
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }
  .help-list p { margin: 0.35rem 0; }
  .help-list strong { color: var(--ink); }

  @media (max-height: 700px) {
    :root { --ghost-cell: 12px; }
    .board { width: min(82vw, 340px); height: min(82vw, 340px); }
    .tray { min-height: 82px; }
  }
  @media (max-width: 380px) {
    .board { width: min(92vw, 360px); height: min(92vw, 360px); }
    .app-title { font-size: 0.95rem; }
    .stat-pill { padding: 0.25rem 0.5rem; font-size: 0.7rem; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  const ROWS = 10, COLS = 10;
  const COLORS = ['#2dd4bf','#fb7185','#fbbf24','#a78bfa','#34d399','#60a5fa','#fb923c'];

  const SHAPES = [
    { cells: [[0,0]] },
    { cells: [[0,0],[0,1]] },
    { cells: [[0,0],[1,0]] },
    { cells: [[0,0],[0,1],[0,2]] },
    { cells: [[0,0],[1,0],[2,0]] },
    { cells: [[0,0],[0,1],[0,2],[0,3]] },
    { cells: [[0,0],[1,0],[2,0],[3,0]] },
    { cells: [[0,0],[0,1],[1,0],[1,1]] },
    { cells: [[0,0],[1,0],[1,1]] },
    { cells: [[0,1],[1,0],[1,1]] },
    { cells: [[0,0],[0,1],[1,1]] },
    { cells: [[0,0],[0,1],[1,0]] },
    { cells: [[0,0],[0,1],[0,2],[1,1]] },
    { cells: [[1,0],[1,1],[1,2],[0,1]] },
    { cells: [[0,0],[1,0],[2,0],[1,1]] },
    { cells: [[0,1],[1,0],[1,1],[2,1]] },
    { cells: [[0,0],[1,0],[2,0],[2,1]] },
    { cells: [[0,1],[1,1],[2,0],[2,1]] },
    { cells: [[0,0],[0,1],[1,1],[2,1]] },
    { cells: [[0,0],[0,1],[1,0],[2,0]] },
    { cells: [[0,0],[0,1],[0,2],[1,0],[1,2]] },
    { cells: [[0,0],[1,0],[1,1],[1,2],[2,0]] },
    { cells: [[0,1],[1,0],[1,1],[1,2],[2,1]] },
  ];

  function randomShape() {
    const def = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    return { cells: def.cells.map(c => [c[0], c[1]]), color };
  }

  function createBoard() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  function canPlace(board, shape, ar, ac) {
    for (let i = 0; i < shape.cells.length; i++) {
      const r = ar + shape.cells[i][0], c = ac + shape.cells[i][1];
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      if (board[r][c] !== null) return false;
    }
    return true;
  }

  function placeBlock(board, shape, ar, ac) {
    for (let i = 0; i < shape.cells.length; i++) {
      board[ar + shape.cells[i][0]][ac + shape.cells[i][1]] = shape.color;
    }
  }

  function findFullLines(board) {
    const rows = [], cols = [];
    for (let r = 0; r < ROWS; r++) {
      let full = true;
      for (let c = 0; c < COLS; c++) { if (!board[r][c]) { full = false; break; } }
      if (full) rows.push(r);
    }
    for (let c = 0; c < COLS; c++) {
      let full = true;
      for (let r = 0; r < ROWS; r++) { if (!board[r][c]) { full = false; break; } }
      if (full) cols.push(c);
    }
    return { rows, cols };
  }

  function clearLines(board, lines) {
    for (const r of lines.rows) for (let c = 0; c < COLS; c++) board[r][c] = null;
    for (const c of lines.cols) for (let r = 0; r < ROWS; r++) board[r][c] = null;
  }

  function canAnyFit(board, tray) {
    for (const shape of tray) {
      if (!shape) continue;
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (canPlace(board, shape, r, c)) return true;
    }
    return false;
  }

  const state = {
    screen: 'menu',
    board: createBoard(),
    tray: [null, null, null],
    selectedSlot: -1,
    score: 0,
    combo: 0,
    paused: false,
    gameOver: false,
    gameStartTime: 0,
    timeUsed: 0,
    bestScore: 0,
    playerName: '',
    gameId: '',
    totalLinesCleared: 0,
    clearing: false,
    recentCells: new Set(),
  };

  function loadBest() {
    try {
      const v = localStorage.getItem('block-master-best');
      state.bestScore = v ? parseInt(v, 10) || 0 : 0;
    } catch(e) {}
  }
  function saveBest() {
    try {
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('block-master-best', String(state.score));
      }
    } catch(e) {}
  }

  function generateTray() {
    state.tray = [randomShape(), randomShape(), randomShape()];
  }
  function refillTray() {
    for (let i = 0; i < 3; i++) if (!state.tray[i]) state.tray[i] = randomShape();
    let attempts = 0;
    while (!canAnyFit(state.board, state.tray) && attempts < 10) {
      state.tray = [randomShape(), randomShape(), randomShape()];
      attempts++;
    }
  }

  function checkGameOver() {
    return !canAnyFit(state.board, state.tray);
  }

  function calcScore(lines, combo, cellsPlaced) {
    const totalLines = lines.rows.length + lines.cols.length;
    if (totalLines === 0) return cellsPlaced * 10;
    let lineScore = 0;
    for (let i = 0; i < totalLines; i++) lineScore += 100 + (i * 50);
    const cross = (lines.rows.length > 0 && lines.cols.length > 0) ? 30 : 0;
    const mult = Math.min(combo, 4);
    return (cellsPlaced * 10 + lineScore + cross) * mult;
  }

  const root = document.getElementById('root');

  function render() {
    if (state.screen === 'menu') return renderMenu();
    if (state.screen === 'gameover') return renderGameOver();
    return renderGame();
  }

  function renderMenu() {
    root.innerHTML = `
      <div class="screen">
        <div class="card" style="padding:2.5rem 2rem; max-width:24rem; width:100%; text-align:center;">
          <div class="big-emoji">🧱</div>
          <h1 class="font-display overlay-title" style="font-size:1.9rem;">
            <span style="color:#0f766e">BLOCK</span> <span style="color:#e11d48">MASTER</span>
          </h1>
          <p class="overlay-sub">Siêu Puzzle — Thử thách tư duy!</p>
          <div class="font-mono" style="font-size:0.85rem; color:var(--muted); margin-bottom:1.75rem;">
            🏆 Kỷ lục: <strong style="color:var(--ink)">${state.bestScore}</strong>
          </div>
          <div style="display:flex; flex-direction:column; gap:0.65rem;">
            <button id="btn-play" class="btn btn-primary menu-btn">▶ CHƠI NGAY</button>
            <button id="btn-help" class="btn btn-secondary menu-btn">📖 HƯỚNG DẪN</button>
          </div>
        </div>
      </div>`;
    document.getElementById('btn-play').onclick = startGame;
    document.getElementById('btn-help').onclick = showHelp;
  }

  function showHelp() {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `
      <div class="overlay-card">
        <div class="big-emoji">📖</div>
        <h2 class="overlay-title" style="color:#0f766e;">HƯỚNG DẪN</h2>
        <div class="help-list">
          <p>🧱 <strong>Chọn block</strong> từ khay bên dưới, rồi <strong>nhấp ô</strong> trên lưới để đặt.</p>
          <p>🖱️ <strong>Kéo thả:</strong> Giữ block rồi thả lên lưới để đặt nhanh hơn.</p>
          <p>📏 <strong>Xóa dòng/cột:</strong> Hàng hoặc cột đầy sẽ biến mất, nhận điểm!</p>
          <p>🔥 <strong>Combo:</strong> Xóa liên tiếp → nhân điểm x2, x3, x4!</p>
          <p>⭐ <strong>Điểm:</strong> 10/ô + thưởng hàng/cột + nhân combo.</p>
          <p>🚫 <strong>Game Over:</strong> Khi cả 3 block đều không đặt được.</p>
          <p>⏸️ Nhấn <strong>TẠM DỪNG</strong> để nghỉ ngơi bất cứ lúc nào.</p>
        </div>
        <button id="btn-close-help" class="btn btn-primary menu-btn">ĐÃ HIỂU</button>
      </div>`;
    document.body.appendChild(ov);
    document.getElementById('btn-close-help').onclick = () => ov.remove();
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
  }

  function startGame() {
    state.screen = 'playing';
    state.board = createBoard();
    state.selectedSlot = -1;
    state.score = 0;
    state.combo = 0;
    state.paused = false;
    state.gameOver = false;
    state.gameStartTime = Date.now();
    state.timeUsed = 0;
    state.totalLinesCleared = 0;
    state.clearing = false;
    state.recentCells.clear();
    generateTray();
    render();
  }

  function renderGame() {
    const cellsHtml = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const color = state.board[r][c];
        const key = `${r},${c}`;
        const recent = state.recentCells.has(key) ? ' recent' : '';
        cellsHtml.push(`<button class="cell${recent}" data-r="${r}" data-c="${c}" style="background:${color || 'var(--cell-bg)'};"></button>`);
      }
    }

    const trayHtml = state.tray.map((shape, i) => {
      const cls = 'tray-slot' + (!shape ? ' empty' : '') + (state.selectedSlot === i ? ' selected' : '');
      let inner = '';
      if (shape) {
        let maxR = 0, maxC = 0;
        for (const [rr, cc] of shape.cells) {
          if (rr > maxR) maxR = rr; if (cc > maxC) maxC = cc;
        }
        inner = `<div class="tray-block" style="grid-template-columns:repeat(${maxC+1},var(--ghost-cell));">`;
        for (let rr = 0; rr <= maxR; rr++) {
          for (let cc = 0; cc <= maxC; cc++) {
            const filled = shape.cells.some(d => d[0]===rr && d[1]===cc);
            inner += `<div class="tray-cell${filled?'':' empty'}"${filled?` style="background:${shape.color}"`:''}></div>`;
          }
        }
        inner += '</div>';
      }
      return `<div class="${cls}" data-slot="${i}">${inner}</div>`;
    }).join('');

    const elapsed = state.paused ? state.timeUsed : Math.floor((Date.now() - state.gameStartTime) / 1000);
    const mm = Math.floor(elapsed/60), ss = elapsed%60;
    const timeStr = `${mm<10?'0':''}${mm}:${ss<10?'0':''}${ss}`;

    root.innerHTML = `
      <div style="flex:1; display:flex; flex-direction:column;">
        <header class="app-header">
          <div class="header-left">
            <div class="logo-icon">🧱</div>
            <div class="app-title">BLOCK MASTER</div>
          </div>
          <div class="header-info">
            <div class="stat-pill score"><span>⭐</span><span class="val" id="hd-score">${state.score}</span></div>
            <div class="stat-pill time"><span>⏱️</span><span class="val" id="hd-time">${timeStr}</span></div>
            <div class="stat-pill combo"><span>🔥</span><span class="val" id="hd-combo">${state.combo>0?'x'+Math.min(state.combo,4):'-'}</span></div>
          </div>
          <div class="header-actions">
            <button id="btn-pause" class="icon-btn" title="Tạm dừng">⏸</button>
            <button id="btn-quit-game" class="icon-btn" title="Thoát">✕</button>
          </div>
        </header>
        <div class="game-area">
          <div class="board-wrap">
            <div class="board" id="board">${cellsHtml.join('')}</div>
          </div>
          <div class="tray-wrap">
            <div class="guide-text" id="guide">${state.selectedSlot>=0 ? 'Nhấp ô trên lưới hoặc kéo thả để đặt block' : 'Chọn block bên dưới rồi đặt lên lưới'}</div>
            <div class="tray" id="tray">${trayHtml}</div>
          </div>
        </div>
      </div>`;

    bindEvents();
    if (state.paused) showPause();
  }

  function bindEvents() {
    const boardEl = document.getElementById('board');
    if (!boardEl) return;
    const cells = boardEl.querySelectorAll('.cell');
    cells.forEach(cell => {
      cell.addEventListener('click', onCellClick);
    });

    const slots = document.querySelectorAll('.tray-slot:not(.empty)');
    slots.forEach(slot => {
      slot.addEventListener('touchstart', e => {
        if (state.clearing || state.paused || state.gameOver) return;
        e.preventDefault();
        const idx = parseInt(slot.dataset.slot, 10);
        if (!state.tray[idx]) return;
        startDrag(e, idx);
      }, { passive: false });

      slot.addEventListener('mousedown', e => {
        if (state.clearing || state.paused || state.gameOver) return;
        const idx = parseInt(slot.dataset.slot, 10);
        if (!state.tray[idx]) return;
        startDrag(e, idx);
      });

      slot.addEventListener('click', e => {
        if (state.clearing || state.paused || state.gameOver) return;
        if (e.defaultPrevented) return;
        const idx = parseInt(slot.dataset.slot, 10);
        if (!state.tray[idx]) return;
        state.selectedSlot = state.selectedSlot === idx ? -1 : idx;
        updateGuide();
        document.querySelectorAll('.tray-slot').forEach((s, si) => s.classList.toggle('selected', si === state.selectedSlot));
      });
    });

    document.getElementById('btn-pause').onclick = () => {
      if (state.clearing) return;
      state.timeUsed = Math.floor((Date.now() - state.gameStartTime) / 1000);
      state.paused = true;
      render();
    };
    document.getElementById('btn-quit-game').onclick = () => {
      sendQuit();
      state.screen = 'menu';
      render();
    };
  }

  function updateGuide() {
    const el = document.getElementById('guide');
    if (el) el.textContent = state.selectedSlot >= 0 ? 'Nhấp ô trên lưới hoặc kéo thả để đặt block' : 'Chọn block bên dưới rồi đặt lên lưới';
  }

  const drag = { active: false, slotIdx: -1, shape: null, ghost: null, row: -1, col: -1, moved: false, raf: null };

  function getPos(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function startDrag(e, idx) {
    if (state.clearing || state.paused || state.gameOver) return;
    const shape = state.tray[idx];
    if (!shape) return;
    const pos = getPos(e);
    drag.active = true;
    drag.slotIdx = idx;
    drag.shape = shape;
    drag.moved = false;

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    let maxR = 0, maxC = 0;
    for (const [rr, cc] of shape.cells) { if (rr > maxR) maxR = rr; if (cc > maxC) maxC = cc; }
    ghost.style.gridTemplateColumns = `repeat(${maxC+1}, var(--ghost-cell))`;
    for (let rr = 0; rr <= maxR; rr++) {
      for (let cc = 0; cc <= maxC; cc++) {
        const filled = shape.cells.some(d => d[0]===rr && d[1]===cc);
        const cell = document.createElement('div');
        cell.className = 'ghost-cell' + (filled ? '' : ' empty');
        if (filled) cell.style.background = shape.color;
        ghost.appendChild(cell);
      }
    }
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    moveGhost(pos.x, pos.y);

    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd, { passive: false });
  }

  function onDragMove(e) {
    if (!drag.active) return;
    e.preventDefault();
    drag.moved = true;
    const pos = getPos(e);
    if (drag.raf) cancelAnimationFrame(drag.raf);
    drag.raf = requestAnimationFrame(() => moveGhost(pos.x, pos.y));
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
  }

  function onDragEnd(e) {
    if (!drag.active) return;
    const pos = getPos(e);

    const boardEl = document.getElementById('board');
    if (boardEl) {
      const rect = boardEl.getBoundingClientRect();
      const x = pos.x - rect.left;
      const y = pos.y - rect.top;
      const col = Math.floor(x / (rect.width / COLS));
      const row = Math.floor(y / (rect.height / ROWS));
      if (row >= 0 && row < ROWS && col >= 0 && col < COLS && drag.shape) {
        if (canPlace(state.board, drag.shape, row, col)) {
          doPlace(row, col, drag.shape, drag.slotIdx);
        } else if (!drag.moved) {
          toggleSlotSelect(drag.slotIdx);
        }
      } else if (!drag.moved) {
        toggleSlotSelect(drag.slotIdx);
      }
    } else if (!drag.moved) {
      toggleSlotSelect(drag.slotIdx);
    }

    cleanupDrag();
  }

  function toggleSlotSelect(idx) {
    state.selectedSlot = state.selectedSlot === idx ? -1 : idx;
    updateGuide();
    document.querySelectorAll('.tray-slot').forEach((s, si) => s.classList.toggle('selected', si === state.selectedSlot));
  }

  function cleanupDrag() {
    if (drag.ghost) { drag.ghost.remove(); drag.ghost = null; }
    if (drag.raf) { cancelAnimationFrame(drag.raf); drag.raf = null; }
    drag.active = false; drag.slotIdx = -1; drag.shape = null; drag.row = -1; drag.col = -1;
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend', onDragEnd);
  }

  function onCellClick(e) {
    if (state.clearing || state.paused || state.gameOver) return;
    const r = parseInt(e.currentTarget.dataset.r, 10);
    const c = parseInt(e.currentTarget.dataset.c, 10);
    if (state.selectedSlot < 0 || !state.tray[state.selectedSlot]) return;
    const shape = state.tray[state.selectedSlot];
    if (!canPlace(state.board, shape, r, c)) return;
    doPlace(r, c, shape, state.selectedSlot);
  }

  function doPlace(r, c, shape, slotIdx) {
    placeBlock(state.board, shape, r, c);
    state.tray[slotIdx] = null;
    state.selectedSlot = -1;

    state.recentCells.clear();
    for (const [dr, dc] of shape.cells) state.recentCells.add(`${r+dr},${c+dc}`);

    const lines = findFullLines(state.board);
    const total = lines.rows.length + lines.cols.length;

    if (total > 0) {
      state.combo++;
      const pts = calcScore(lines, state.combo, shape.cells.length);
      state.score += pts;
      state.totalLinesCleared += total;
      highlightAndClear(lines, pts, r, c);
    } else {
      state.combo = 0;
      afterPlace();
    }
  }

  function highlightAndClear(lines, pts, r, c) {
    state.clearing = true;
    showScorePopup(r, c, '+' + pts);
    updateHeader();

    const cells = document.querySelectorAll('.cell');
    const clearedSet = new Set();
    lines.rows.forEach(row => {
      for (let col = 0; col < COLS; col++) {
        cells[row * COLS + col].classList.add('anim-clear');
        clearedSet.add(`${row},${col}`);
      }
    });
    lines.cols.forEach(col => {
      for (let row = 0; row < ROWS; row++) {
        cells[row * COLS + col].classList.add('anim-clear');
        clearedSet.add(`${row},${col}`);
      }
    });

    spawnParticles(clearedSet, cells);

    setTimeout(() => {
      clearLines(state.board, lines);
      state.recentCells.clear();
      state.clearing = false;
      afterPlace();
    }, 420);
  }

  function spawnParticles(clearedSet, cells) {
    const boardEl = document.getElementById('board');
    if (!boardEl) return;
    const bRect = boardEl.getBoundingClientRect();
    clearedSet.forEach(key => {
      const [r, c] = key.split(',').map(Number);
      const cell = cells[r * COLS + c];
      if (!cell) return;
      const rect = cell.getBoundingClientRect();
      const cx = rect.left - bRect.left + rect.width / 2;
      const cy = rect.top - bRect.top + rect.height / 2;
      const color = state.board[r][c] || '#fbbf24';
      for (let i = 0; i < 3; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.background = color;
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = 20 + Math.random() * 30;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        boardEl.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    });
  }

  function afterPlace() {
    refillTray();
    state.recentCells.clear();
    if (checkGameOver()) {
      endGame();
      return;
    }
    render();
  }

  function showScorePopup(r, c, text) {
    const boardEl = document.getElementById('board');
    if (!boardEl) return;
    const bw = boardEl.offsetWidth, bh = boardEl.offsetHeight;
    const cw = bw / COLS, ch = bh / ROWS;
    const popup = document.createElement('div');
    popup.className = 'score-popup';
    popup.textContent = text;
    popup.style.left = (c * cw + cw / 2) + 'px';
    popup.style.top = (r * ch + ch / 2 - 10) + 'px';
    boardEl.appendChild(popup);
    setTimeout(() => popup.remove(), 900);
  }

  function updateHeader() {
    const se = document.getElementById('hd-score');
    if (se) se.textContent = state.score;
    const sc = document.getElementById('hd-combo');
    if (sc) sc.textContent = state.combo > 0 ? 'x' + Math.min(state.combo, 4) : '-';
  }

  function showPause() {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.id = 'pause-overlay';
    ov.innerHTML = `
      <div class="overlay-card">
        <div class="big-emoji">⏸️</div>
        <h2 class="overlay-title" style="color:#b45309;">TẠM DỪNG</h2>
        <p class="overlay-sub">Điểm hiện tại: <strong style="color:#e11d48;">${state.score}</strong></p>
        <div style="display:flex; flex-direction:column; gap:0.65rem;">
          <button id="btn-resume" class="btn btn-primary menu-btn">▶ TIẾP TỤC</button>
          <button id="btn-restart-p" class="btn btn-amber menu-btn">🔄 CHƠI LẠI</button>
          <button id="btn-quit-p" class="btn btn-secondary menu-btn">🚪 THOÁT</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    document.getElementById('btn-resume').onclick = () => {
      ov.remove();
      state.paused = false;
      state.gameStartTime = Date.now() - state.timeUsed * 1000;
      render();
    };
    document.getElementById('btn-restart-p').onclick = () => { ov.remove(); startGame(); };
    document.getElementById('btn-quit-p').onclick = () => { ov.remove(); sendQuit(); state.screen = 'menu'; render(); };
  }

  function endGame() {
    state.gameOver = true;
    state.timeUsed = Math.floor((Date.now() - state.gameStartTime) / 1000);
    saveBest();
    sendGameOver();
    state.screen = 'gameover';
    render();
  }

  function renderGameOver() {
    const isNew = state.score > 0 && state.score >= state.bestScore;
    const mm = Math.floor(state.timeUsed/60), ss = state.timeUsed%60;
    const timeStr = `${mm<10?'0':''}${mm}:${ss<10?'0':''}${ss}`;
    root.innerHTML = `
      <div class="screen">
        <div class="card" style="padding:2.5rem 2rem; max-width:24rem; width:100%; text-align:center;">
          <div class="big-emoji">${isNew ? '🏆' : '💥'}</div>
          <h2 class="overlay-title" style="color:#e11d48;">GAME OVER</h2>
          <p class="overlay-sub">${isNew ? '🎉 Kỷ lục mới!' : 'Thử lại nhé!'}</p>
          <div class="stats-row">
            <div class="stat-item">
              <div class="stat-value" style="color:#e11d48;">${state.score}</div>
              <div class="stat-label">Điểm</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" style="color:#b45309;">${state.bestScore}</div>
              <div class="stat-label">Kỷ lục</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" style="color:#0f766e;">${timeStr}</div>
              <div class="stat-label">Thời gian</div>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:0.65rem;">
            <button id="btn-restart" class="btn btn-primary menu-btn">🔄 CHƠI LẠI</button>
            <button id="btn-quit-go" class="btn btn-secondary menu-btn">🚪 THOÁT</button>
          </div>
        </div>
      </div>`;
    document.getElementById('btn-restart').onclick = startGame;
    document.getElementById('btn-quit-go').onclick = () => { sendQuit(); state.screen = 'menu'; render(); };
  }

  function tickTimer() {
    if (state.screen === 'playing' && !state.paused && !state.gameOver) {
      const el = document.getElementById('hd-time');
      if (el) {
        const s = Math.floor((Date.now() - state.gameStartTime) / 1000);
        const m = Math.floor(s/60), ss = s%60;
        el.textContent = `${m<10?'0':''}${m}:${ss<10?'0':''}${ss}`;
      }
    }
    requestAnimationFrame(tickTimer);
  }

  window.addEventListener('message', function(ev) {
    try {
      const msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
      if (msg && msg.type === 'init' && msg.data) {
        state.gameId = msg.data.gameId || '';
        state.playerName = msg.data.playerName || '';
      }
    } catch(e) {}
  });

  function sendGameOver() {
    try {
      window.parent.postMessage({ type: 'game-over', data: { score: state.score, timeUsed: state.timeUsed } }, '*');
    } catch(e) {}
  }
  function sendQuit() {
    try { window.parent.postMessage({ type: 'quit' }, '*'); } catch(e) {}
  }

  loadBest();
  render();
  requestAnimationFrame(tickTimer);

})();
</script>
</body>
</html>
