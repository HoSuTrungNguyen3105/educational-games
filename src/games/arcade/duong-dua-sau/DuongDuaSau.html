<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đường Đua Sâu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF7EE;--ink:#20283A;--card:#FFF;--line:#E7D9BE;--teal:#1B998B;--orange:#E4572E;--yellow:#F4B942;--gold:#F4B942;--t1:#8fa0c0;--t2:#1B998B;--t3:#4C8DFF;--t4:#8B6FF1;--t5:#F4B942;--t6:#E4572E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--paper);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--ink);color:#fff;flex-shrink:0;height:50px;z-index:10}
.header .title{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.header .snail-icon{font-size:22px}
.header .stats{display:flex;align-items:center;gap:10px;margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.header .stat{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:20px}
.header .stat.coin{background:rgba(244,185,66,.18);color:var(--gold)}
.header .stat.streak{background:rgba(228,87,46,.18);color:#ff9a7a;display:none}
.header .stat.streak.show{display:flex}
.header .stat .label{opacity:.7;font-size:11px}.header .stat .value{font-weight:600}
.btn-shop{background:linear-gradient(135deg,var(--gold),#e6a800);color:var(--ink);border:none;padding:5px 14px;border-radius:16px;font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:transform .15s}
.btn-quit{background:var(--orange);color:#fff;border:none;padding:5px 14px;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:transform .15s}
.btn-shop:hover,.btn-quit:hover{transform:scale(1.05)}
.main{flex:1;display:grid;grid-template-columns:1.6fr 1fr;min-height:0}
.race-track{background:radial-gradient(120px 60px at 85% 12%,rgba(255,255,255,.35),transparent 70%),radial-gradient(70px 34px at 65% 8%,rgba(255,255,255,.28),transparent 70%),linear-gradient(180deg,#7FD858 0%,#4CAF50 35%,#2E7D32 100%);padding:18px 16px 10px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.race-track::before{content:'☀️';position:absolute;top:8px;right:38px;font-size:26px;opacity:.9}
.race-track::after{content:'';position:absolute;right:0;top:0;bottom:0;width:28px;background:repeating-conic-gradient(#fff 0% 25%,#222 0% 50%) 0 0/14px 14px;opacity:.7;box-shadow:-4px 0 12px rgba(0,0,0,.15)}
.track-label{font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;color:rgba(255,255,255,.92);margin-bottom:10px;text-align:center;letter-spacing:1.5px;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.lanes{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px;min-height:0;overflow-y:auto;position:relative;z-index:1}
.lane{display:flex;align-items:center;gap:8px;position:relative;height:18%;min-height:44px;border-bottom:1px dashed rgba(255,255,255,.15)}
.lane:last-child{border-bottom:none}
.lane.is-player{background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border-radius:8px;padding:0 6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.lane-label{width:36px;text-align:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.7);flex-shrink:0}
.lane.is-player .lane-label{color:var(--yellow)}
.player-badge{display:none;font-size:9px;font-weight:700;background:var(--yellow);color:var(--ink);padding:1px 5px;border-radius:4px;position:absolute;top:1px;left:46px;font-family:'Poppins',sans-serif;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.lane.is-player .player-badge{display:block}
.snail-wrapper{position:absolute;left:0;top:50%;transform:translateY(-50%);transition:left .8s cubic-bezier(.4,0,.2,1);z-index:2}
.snail-wrapper svg{display:block;animation:wiggle .55s infinite ease-in-out;transform-origin:50% 90%}
@keyframes wiggle{50%{transform:scaleY(.93) scaleX(1.05)}}
.snail-wrapper::before{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);height:6px;width:0;border-radius:5px;opacity:0;transition:width .3s,opacity .3s;pointer-events:none}
.boost-t1::before{width:14px;opacity:.55;background:linear-gradient(90deg,transparent,var(--t1))}
.boost-t2::before{width:20px;opacity:.65;background:linear-gradient(90deg,transparent,var(--t2));box-shadow:0 0 8px var(--t2)}
.boost-t3::before{width:26px;opacity:.7;background:linear-gradient(90deg,transparent,var(--t3));box-shadow:0 0 10px var(--t3)}
.boost-t4::before{width:32px;opacity:.75;background:linear-gradient(90deg,transparent,var(--t4));box-shadow:0 0 12px var(--t4);animation:trailPulse 1s ease-in-out infinite}
.boost-t5::before{width:40px;opacity:.85;background:linear-gradient(90deg,transparent,var(--t5));box-shadow:0 0 16px var(--t5);animation:trailPulse .7s ease-in-out infinite}
.boost-t6::before{width:50px;opacity:.9;background:linear-gradient(90deg,transparent,var(--t6),var(--t5));box-shadow:0 0 20px var(--t6);animation:trailPulse .5s ease-in-out infinite}
@keyframes trailPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.lane-name{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;font-weight:600;color:rgba(255,255,255,.55);font-family:'Poppins',sans-serif}
.question-panel{display:flex;flex-direction:column;padding:16px 18px;gap:12px;overflow-y:auto;background:var(--paper)}
.badge-challenge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold),#e6a800);color:var(--ink);font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;align-self:flex-start;box-shadow:0 2px 8px rgba(244,185,66,.3)}
.question-card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--line);flex:1;display:flex;flex-direction:column}
.question-text{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:10px;flex:1}
.option-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.option-btn:hover:not(:disabled){border-color:var(--teal);background:#f0faf8;transform:translateX(2px)}
.option-btn .opt-letter{width:28px;height:28px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;flex-shrink:0}
.option-btn.correct{border-color:#4CAF50;background:#e8f5e9}.option-btn.correct .opt-letter{background:#4CAF50;color:#fff}
.option-btn.wrong{border-color:var(--orange);background:#fbe9e7}.option-btn.wrong .opt-letter{background:var(--orange);color:#fff}
.option-btn:disabled{cursor:default;opacity:.85}
.explanation{margin-top:12px;padding:10px 14px;background:#f0f9ff;border-left:3px solid var(--teal);border-radius:6px;font-size:13px;line-height:1.5;animation:fadeSlideIn .3s ease}
.coin-toast{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#b5860a;background:rgba(244,185,66,.14);border:1px solid rgba(244,185,66,.35);border-radius:8px;padding:6px 10px;display:none;animation:fadeSlideIn .3s ease}
.coin-toast.show{display:block}
.next-btn{margin-top:12px;padding:10px 24px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:transform .15s;align-self:flex-end}
.next-btn:hover{transform:scale(1.03)}
.timer-section{display:flex;align-items:center;gap:10px}
.timer-bar-wrap{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.timer-bar{height:100%;border-radius:4px;transition:width .3s linear,background .3s;background:var(--teal)}
.timer-text{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;min-width:28px;text-align:right}
.overlay{display:none;position:fixed;inset:0;background:rgba(32,40,58,.85);z-index:100;justify-content:center;align-items:center}
.overlay.active{display:flex}
.overlay-card{background:var(--card);border-radius:20px;padding:36px 44px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3);max-width:380px;width:90%;animation:popIn .4s ease}
.overlay-card h2{font-family:'Poppins',sans-serif;font-size:22px;margin-bottom:8px}
.overlay-card .final-score{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;color:var(--gold);margin:12px 0}
.overlay-card .final-time{font-size:14px;color:#888;margin-bottom:8px}
.overlay-card .final-coins{font-size:13.5px;color:#b5860a;font-weight:700;margin-bottom:20px}
.overlay-card .btn-back{padding:10px 28px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
/* SHOP */
.shop-overlay{display:none;position:fixed;inset:0;background:rgba(32,40,58,.72);z-index:200;justify-content:center;align-items:center;padding:20px}
.shop-overlay.show{display:flex;animation:fadeSlideIn .2s ease}
.shop-panel{width:100%;max-width:660px;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:20px;padding:22px 22px 26px;box-shadow:0 24px 70px rgba(0,0,0,.4);border:1px solid var(--line)}
.shop-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.shop-title{font-family:'Poppins',sans-serif;font-size:19px;font-weight:800}
.shop-coins{font-family:'JetBrains Mono',monospace;font-size:13.5px;background:rgba(244,185,66,.18);color:#b5860a;border:1px solid rgba(244,185,66,.4);border-radius:10px;padding:6px 12px;font-weight:700}
.shop-close{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:14px}
.shop-close:hover{border-color:var(--orange);color:var(--orange)}
.shop-tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.shop-tab{font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;padding:8px 18px;border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:none;background:#f1ebda;color:#8a8065;cursor:pointer;transition:all .2s}
.shop-tab.active{color:var(--ink);background:var(--card);border-color:var(--gold)}
.shop-equipped{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#7a7154;margin-bottom:14px;padding:8px 12px;background:#f1ebda;border:1px solid var(--line);border-radius:8px}
.shop-equipped b{color:var(--ink)}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.shop-grid{grid-template-columns:1fr}}
.shop-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.shop-item.equipped{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,185,66,.35),0 6px 18px rgba(244,185,66,.18)}
.shop-preview{width:48px;height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.shop-icon{font-size:26px;margin-bottom:2px}
.shop-name{font-weight:800;font-size:14px;font-family:'Poppins',sans-serif}
.shop-desc{font-size:11.5px;color:#8a8065;line-height:1.4;min-height:30px}
.shop-stat{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);font-weight:700;margin-bottom:6px}
.shop-buy-btn{width:100%;font-family:'Poppins',sans-serif;font-size:12.5px;padding:9px 10px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--gold),#e6a800);color:var(--ink);font-weight:700;cursor:pointer;transition:all .2s}
.shop-buy-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(244,185,66,.35)}
.shop-buy-btn:disabled{cursor:default;background:#e9e2cf;color:#a89f86}
.pk{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:6px}
.pk i{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .15s}
.pk i:hover{transform:scale(1.2)}
.pk input{width:36px;height:28px;border:none;background:none;cursor:pointer;padding:0}
@media(max-width:700px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.race-track{min-height:180px;padding:10px 10px 8px}.lane-label{width:28px;font-size:8px}.question-text{font-size:13px}.option-btn{font-size:12px;padding:9px 10px}.header .title{font-size:12px}.header .stat{padding:2px 7px;font-size:11px}}
</style>
</head>
<body>
<div id="api_submit"></div>
<div class="header">
  <span class="snail-icon">🐛</span>
  <span class="title">ĐƯỜNG ĐUA SÂU</span>
  <div class="stats">
    <div class="stat streak" id="streakStat"><span>🔥</span><span class="value" id="streakValue">0</span></div>
    <div class="stat coin"><span class="label">Xu</span><span class="value" id="coinDisplay">0</span></div>
    <div class="stat"><span class="label">Câu</span><span class="value" id="questionCounter">0/0</span></div>
    <div class="stat"><span class="label">Điểm</span><span class="value" id="scoreDisplay">0</span></div>
    <button class="btn-shop" id="btnShop">🛒 Cửa Hàng</button>
    <button class="btn-quit" id="btnQuit">Thoát</button>
  </div>
</div>
<div class="main">
  <div class="race-track">
    <div class="track-label">🏁 ĐƯỜNG ĐUA 🏁</div>
    <div class="lanes" id="lanes"></div>
  </div>
  <div class="question-panel">
    <div class="badge-challenge">⭐ Câu hỏi thử thách</div>
    <div class="timer-section">
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <span class="timer-text" id="timerText">0s</span>
    </div>
    <div class="question-card">
      <div class="question-text" id="questionText">Đang tải câu hỏi...</div>
      <div class="options" id="optionsContainer"></div>
      <div id="explanationArea"></div>
      <div class="coin-toast" id="coinToast"></div>
      <button class="next-btn" id="nextBtn" style="display:none">Câu tiếp theo →</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2>🏆 Kết quả cuộc đua</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-time" id="finalTime">Thời gian: 0s</div>
    <div class="final-coins" id="finalCoins">Xu kiếm được: 0</div>
    <button class="btn-back" id="btnBack">Trở về</button>
  </div>
</div>
<div class="shop-overlay" id="shopOverlay">
  <div class="shop-panel">
    <div class="shop-header">
      <div class="shop-title">🛒 Cửa Hàng Sâu</div>
      <div class="shop-coins">💰 <span id="shopCoinVal">0</span> xu</div>
      <button class="shop-close" id="shopClose">✕</button>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab active" id="tabSkin">Màu Sắc</button>
      <button class="shop-tab" id="tabShape">Kiểu Dáng</button>
      <button class="shop-tab" id="tabBoost">Hoả Tốc</button>
    </div>
    <div class="shop-equipped" id="shopEquippedLine"></div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>

<script>
(function(){
const LANE_COLORS=["#FF6F91","#4C8DFF","#F4B942","#4CAF7D","#8B6FF1","#E88CFF","#FFB347","#87CEEB"];

/* ---------- Hình con sâu: màu (c) + kiểu dáng (shape) ---------- */
const WORM_SVG=(c,hi1,hi2,shape)=>{
  hi1=hi1||'rgba(255,255,255,0.32)';hi2=hi2||'rgba(255,255,255,0.45)';shape=shape||'cat';
  const ol='stroke="rgba(0,0,0,.25)" stroke-width="1.5"';
  const ey=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#20283A" stroke-width="1.4"/><circle cx="${x+r*.3}" cy="${y+r*.1}" r="${r*.5}" fill="#20283A"/>`;
  const sg=(x,y,r,i)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${ol}/><ellipse cx="${x-r*.2}" cy="${y-r*.4}" rx="${r*.5}" ry="${r*.25}" fill="${i%2?hi1:hi2}"/>`;
  const head=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${ol}/><ellipse cx="${x-r*.2}" cy="${y-r*.55}" rx="${r*.5}" ry="${r*.22}" fill="${hi2}"/>${ey(x-r*.1,y-r*.15,r*.28)}${ey(x+r*.5,y-r*.15,r*.28)}<path d="M${x-r*.1} ${y+r*.45}q${r*.35} ${r*.35} ${r*.75} 0" stroke="#20283A" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  const ant=(x,y)=>`<path d="M${x-4} ${y-10}q-3-6 0-11M${x+3} ${y-10}q4-5 1-11" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="${x-4}" cy="${y-22}" r="2.4" fill="${hi1}" stroke="${c}"/><circle cx="${x+4}" cy="${y-22}" r="2.4" fill="${hi1}" stroke="${c}"/>`;
  const S=[[9,36,7],[19,33,8],[30,36,8.5],[41,33,9]];
  const cat=S.map((s,i)=>sg(s[0],s[1],s[2],i)).join('');
  let b;
  if(shape==='fat')b=`<ellipse cx="28" cy="33" rx="25" ry="14" fill="${c}" ${ol}/>`+[14,24,34].map(x=>`<path d="M${x} 21q-5 12 0 24" stroke="${hi1}" stroke-width="3" fill="none"/>`).join('')+head(50,30,12)+ant(50,30);
  else if(shape==='long')b=`<path d="M5 38Q13 20 25 34T46 32" stroke="${c}" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M5 38Q13 20 25 34T46 32" stroke="${hi1}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="0.1 9"/>`+head(51,29,10);
  else if(shape==='dragon')b=cat+S.map(s=>`<path d="M${s[0]-4} ${s[1]-s[2]+2}L${s[0]} ${s[1]-s[2]-7}L${s[0]+4} ${s[1]-s[2]+2}z" fill="${hi1}" ${ol}/>`).join('')+`<path d="M44 22L42 9 50 20zM54 21L58 9 59 23z" fill="${hi2}" ${ol}/>`+head(51,30,11);
  else if(shape==='hat')b=cat+head(51,30,11)+`<path d="M44 21L52 3 60 21z" fill="#F4B942" ${ol}/><path d="M47 15h10M49 10h6" stroke="#E4572E" stroke-width="2"/><circle cx="52" cy="3" r="2.8" fill="#E4572E"/>`;
  else b=cat+head(51,30,11)+ant(51,30);
  return `<svg width="48" height="38" viewBox="0 0 64 50" fill="none"><ellipse cx="32" cy="45" rx="26" ry="3.5" fill="rgba(29,46,74,0.12)"/>${b}</svg>`;
};

/* ---------- Dữ liệu cửa hàng ---------- */
const SKINS=[
  {id:'pink',name:'Hồng Phấn',price:0,c:'#FF6F91',hi1:'rgba(255,255,255,.32)',hi2:'rgba(255,255,255,.45)',desc:'Sắc màu khởi đầu, dịu dàng và quen thuộc.'},
  {id:'jade',name:'Ngọc Bích',price:30,c:'#1B998B',hi1:'rgba(255,255,255,.3)',hi2:'rgba(255,255,255,.5)',desc:'Xanh ngọc mát mắt, nổi bật trên cỏ xanh.'},
  {id:'gold',name:'Hoàng Kim',price:70,c:'#F4B942',hi1:'rgba(255,255,255,.4)',hi2:'rgba(255,255,255,.6)',desc:'Ánh vàng lấp lánh dưới nắng đường đua.'},
  {id:'sapphire',name:'Lam Ngọc',price:120,c:'#4C8DFF',hi1:'rgba(255,255,255,.32)',hi2:'rgba(255,255,255,.5)',desc:'Xanh lam sâu thẳm như đại dương.'},
  {id:'violet',name:'Tím Huyền Bí',price:180,c:'#8B6FF1',hi1:'rgba(255,255,255,.3)',hi2:'rgba(255,255,255,.5)',desc:'Sắc tím huyền ảo, cuốn hút mọi ánh nhìn.'},
  {id:'rainbow',name:'Cầu Vồng Ánh Kim',price:300,c:'#FF6F91',hi1:'#F4B942',hi2:'#1B998B',desc:'Ba sắc màu hoà quyện, biểu tượng nhà vô địch.'}
];
const SHAPES=[
  {id:'cat',name:'Sâu Bướm',price:0,desc:'Dáng sâu bốn đốt quen thuộc, râu cong dễ thương.'},
  {id:'fat',name:'Sâu Béo Ú',price:30,desc:'Thân tròn mũm mĩm với sọc ngang.'},
  {id:'long',name:'Sâu Uốn Lượn',price:60,desc:'Thân dài uốn lượn như sóng.'},
  {id:'dragon',name:'Sâu Rồng Con',price:100,desc:'Gai lưng và sừng nhỏ trông thật oai.'},
  {id:'hat',name:'Sâu Mũ Tiệc',price:150,desc:'Đội nón tiệc lấp lánh, lúc nào cũng ăn mừng.'}
];
const BOOSTS=[
  {id:'normal',name:'Nhớt Thường',icon:'🐛',price:0,mult:1,tier:0,desc:'Tốc độ tiêu chuẩn của mọi chú sâu.'},
  {id:'shoes',name:'Giày Tốc Độ',icon:'👟',price:30,mult:1.15,tier:1,desc:'Đôi giày nhỏ giúp từng bước nhanh hơn.'},
  {id:'wind',name:'Cánh Gió Xoáy',icon:'🌀',price:70,mult:1.3,tier:2,desc:'Luồng gió xoáy đẩy chú sâu lướt nhanh.'},
  {id:'rocket',name:'Tên Lửa Mini',icon:'🚀',price:130,mult:1.5,tier:3,desc:'Bùng nổ tốc độ sau mỗi câu trả lời đúng.'},
  {id:'lightning',name:'Thần Tốc Chớp Nhoáng',icon:'⚡',price:220,mult:1.75,tier:4,desc:'Nhanh như tia chớp, bỏ xa đối thủ.'},
  {id:'cosmic',name:'Siêu Tốc Vũ Trụ',icon:'🌌',price:350,mult:2,tier:5,desc:'Sức mạnh vũ trụ, tốc độ tối thượng.'}
];
const SHAPE_IDS=SHAPES.map(s=>s.id);
const PRESETS=['#FF6F91','#E4572E','#F4B942','#8BC34A','#1B998B','#4C8DFF','#8B6FF1','#E88CFF','#20283A','#FFFFFF'];
const loadout={ownedSkins:['pink'],ownedBoosts:['normal'],ownedShapes:['cat'],equippedSkin:'pink',equippedBoost:'normal',equippedShape:'cat',customColor:'#FF6F91'};
let currentShopTab='skin';
let userCoins=0;

let questions=[],score=0,currentIndex=0,timerInterval=null,timeLeft=0,totalPoints=0,startTime=0,answered=false;
let botScores=[],laneCount=0,myName='Bạn',playersList=[];
let playerDistance=0,streak=0,sessionCoins=0;

const lanesEl=document.getElementById('lanes');
const questionCounter=document.getElementById('questionCounter');
const scoreDisplay=document.getElementById('scoreDisplay');
const coinDisplay=document.getElementById('coinDisplay');
const streakStat=document.getElementById('streakStat');
const streakValue=document.getElementById('streakValue');
const timerBar=document.getElementById('timerBar');
const timerText=document.getElementById('timerText');
const questionText=document.getElementById('questionText');
const optionsContainer=document.getElementById('optionsContainer');
const explanationArea=document.getElementById('explanationArea');
const coinToast=document.getElementById('coinToast');
const nextBtn=document.getElementById('nextBtn');
const overlay=document.getElementById('overlay');
const finalScore=document.getElementById('finalScore');
const finalTime=document.getElementById('finalTime');
const finalCoins=document.getElementById('finalCoins');
const shopOverlay=document.getElementById('shopOverlay');
const shopGrid=document.getElementById('shopGrid');
const shopCoinVal=document.getElementById('shopCoinVal');
const shopEquippedLine=document.getElementById('shopEquippedLine');

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function findItem(type,id){
  if(type==='skin'&&id==='custom')return{id:'custom',name:'Màu Tuỳ Chỉnh',c:loadout.customColor,hi1:'rgba(255,255,255,.32)',hi2:'rgba(255,255,255,.45)'};
  const list=type==='skin'?SKINS:type==='shape'?SHAPES:BOOSTS;
  return list.find(i=>i.id===id)||list[0];
}

/* Mỗi người chơi một con sâu, mỗi con một màu và một kiểu dáng khác nhau */
function buildLanes(){
  lanesEl.innerHTML='';
  const others=(playersList||[]).filter(n=>n&&n!==myName).slice(0,7);
  const roster=[{name:myName,me:true},...others.map(n=>({name:n}))];
  if(roster.length>8)roster.length=8;
  laneCount=roster.length;
  botScores=new Array(Math.max(0,laneCount-1)).fill(0);
  const mySkin=findItem('skin',loadout.equippedSkin);
  const pal=LANE_COLORS.filter(x=>x.toLowerCase()!==String(mySkin.c).toLowerCase());
  roster.forEach((r,i)=>{
    const color=r.me?mySkin.c:pal[(i-1)%pal.length];
    const hi1=r.me?mySkin.hi1:undefined,hi2=r.me?mySkin.hi2:undefined;
    const shape=r.me?loadout.equippedShape:SHAPE_IDS[i%SHAPE_IDS.length];
    const boostTier=r.me?findItem('boost',loadout.equippedBoost).tier:0;
    const lane=document.createElement('div');
    lane.className='lane'+(r.me?' is-player':'');
    lane.innerHTML=`
      ${r.me?'<span class="player-badge">BẠN</span>':''}
      <div class="snail-wrapper${boostTier?' boost-t'+boostTier:''}" id="snail-${i}" style="left:0">${WORM_SVG(color,hi1,hi2,shape)}</div>
      <span class="lane-label">${r.me?'YOU':escapeHtml(String(r.name).split(' ').pop())}</span>
      <span class="lane-name">${escapeHtml(r.name)}</span>`;
    lanesEl.appendChild(lane);
  });
}

function updateSnails(){
  const maxScore=totalPoints||1;
  for(let i=0;i<laneCount;i++){
    const el=document.getElementById('snail-'+i);
    if(!el)continue;
    const s=i===0?playerDistance:(botScores[i-1]||0);
    el.style.left=Math.min((s/maxScore)*92,98)+'%';
  }
}

function advanceOthers(){
  for(let i=1;i<laneCount;i++){
    if(Math.random()<0.35) continue;
    const pts=questions[currentIndex]?questions[currentIndex].points:10;
    botScores[i-1]+=Math.round(pts*(0.5+Math.random()*0.6));
  }
}

function shuffleOptions(q){
  const opts=q.options.slice();
  for(let i=opts.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [opts[i],opts[j]]=[opts[j],opts[i]];
  }
  return opts;
}

function renderQuestion(){
  if(currentIndex>=questions.length){endGame();return}
  answered=false;
  const q=questions[currentIndex];
  const shuffled=shuffleOptions(q);
  const letters=['A','B','C','D'];
  questionText.textContent=q.content;
  optionsContainer.innerHTML='';
  explanationArea.innerHTML='';
  coinToast.className='coin-toast';coinToast.textContent='';
  nextBtn.style.display='none';
  questionCounter.textContent=(currentIndex+1)+'/'+questions.length;
  shuffled.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML=`<span class="opt-letter">${letters[i]}</span><span>${opt.content}</span>`;
    btn.onclick=()=>selectAnswer(opt.id,q,shuffled);
    optionsContainer.appendChild(btn);
  });
  timeLeft=q.timeLimit||15;
  updateTimer();
  startTimer(q);
}

function startTimer(q){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){clearInterval(timerInterval);if(!answered)selectAnswer(null,q,null);}
  },1000);
}

function updateTimer(){
  const q=questions[currentIndex];
  const tl=q?q.timeLimit:15;
  const pct=Math.max((timeLeft/tl)*100,0);
  timerBar.style.width=pct+'%';
  timerText.textContent=timeLeft+'s';
  if(pct>60)timerBar.style.background='#1B998B';
  else if(pct>30)timerBar.style.background='#F4B942';
  else timerBar.style.background='#E4572E';
}

function selectAnswer(answerId,q,shuffled){
  if(answered)return;
  answered=true;
  clearInterval(timerInterval);
  const btns=Array.from(optionsContainer.querySelectorAll('.option-btn'));
  btns.forEach(b=>b.disabled=true);
  if(answerId!==null && typeof window.apiSubmitAnswer==='function'){
    window.apiSubmitAnswer(q.id,answerId)
    .then(raw=>{
      var res=raw&&raw.data?raw.data:raw;
      showResult(res.correct,res.points,q,answerId,shuffled,btns,res.correctAnswer);
    })
    .catch(()=>{
      showResult(false,0,q,answerId,shuffled,btns,null);
    });
  } else {
    showResult(false,0,q,answerId,shuffled,btns,null);
  }
}

function grantCoins(amount){
  if(amount<=0)return;
  userCoins+=amount;sessionCoins+=amount;
  coinDisplay.textContent=userCoins;
  if(shopOverlay.classList.contains('show'))shopCoinVal.textContent=userCoins;
  try{window.parent.postMessage({type:'state-update',data:{type:'play-to-win',coins:userCoins}},'*');}catch(e){}
  try{window.parent.postMessage({type:'add-coins',data:{amount:amount}},'*');}catch(e){}
}

function showResult(isCorrect,earnedPoints,q,answerId,shuffled,btns,correctAnswerId){
  btns.forEach((b,idx)=>{
    const opt=shuffled?shuffled[idx]:q.options[idx];
    if(opt){
      if(opt.id===correctAnswerId)b.classList.add('correct');
      if(opt.id===answerId&&!isCorrect)b.classList.add('wrong');
    }
  });
  if(isCorrect){
    const tl=q.timeLimit||15;
    const timeBonus=Math.round((timeLeft/tl)*40);
    const gained=earnedPoints+timeBonus;
    score+=gained;
    scoreDisplay.textContent=score;
    const boost=findItem('boost',loadout.equippedBoost);
    playerDistance+=gained*boost.mult;
    streak++;
    streakValue.textContent=streak;
    streakStat.classList.toggle('show',streak>=2);
    let coinGain=5+Math.round((timeLeft/tl)*5);
    let streakBonus=0;
    if(streak>=3){streakBonus=5;}
    if(streak>=6){streakBonus=10;}
    const totalCoinGain=coinGain+streakBonus;
    grantCoins(totalCoinGain);
    coinToast.className='coin-toast show';
    coinToast.textContent='💰 +'+totalCoinGain+' xu'+(streakBonus>0?' (gồm '+streakBonus+' xu chuỗi thắng 🔥)':'')+(boost.mult>1?' · Hoả tốc x'+boost.mult:'');
  }else{
    streak=0;
    streakValue.textContent=0;
    streakStat.classList.remove('show');
  }
  if(q.explanation){
    explanationArea.innerHTML='<div class="explanation">💡 '+q.explanation+'</div>';
  }
  advanceOthers();
  updateSnails();
  nextBtn.style.display='inline-block';
  nextBtn.textContent=currentIndex>=questions.length-1?'Kết quả →':'Câu tiếp theo →';
}

nextBtn.onclick=()=>{currentIndex++;renderQuestion()};
document.getElementById('btnQuit').onclick=()=>{parent.postMessage({type:'quit'},'*')};
document.getElementById('btnBack').onclick=()=>{parent.postMessage({type:'quit'},'*')};

function endGame(){
  clearInterval(timerInterval);
  const timeUsed=Math.round((Date.now()-startTime)/1000);
  finalScore.textContent=score+' điểm';
  finalTime.textContent='Thời gian: '+timeUsed+' giây';
  finalCoins.textContent='Xu kiếm được: '+sessionCoins;
  overlay.classList.add('active');
  setTimeout(()=>{parent.postMessage({type:'game-over',data:{score,timeUsed,totalCoins:userCoins}},'*')},1300);
}

/* ---------- Cửa hàng ---------- */
function ownedList(t){return t==='skin'?loadout.ownedSkins:t==='shape'?loadout.ownedShapes:loadout.ownedBoosts}
function isOwned(t,id){return ownedList(t).indexOf(id)!==-1}
function isEquipped(t,id){return(t==='skin'?loadout.equippedSkin:t==='shape'?loadout.equippedShape:loadout.equippedBoost)===id}
function saveLoadout(){try{window.parent.postMessage({type:'loadout-update',data:JSON.parse(JSON.stringify(loadout))},'*')}catch(e){}}
function spendCoins(amount){
  userCoins=Math.max(0,userCoins-amount);
  coinDisplay.textContent=userCoins;
  try{window.parent.postMessage({type:'state-update',data:{type:'play-to-win',coins:userCoins}},'*');}catch(e){}
  try{window.parent.postMessage({type:'add-coins',data:{amount:-amount}},'*');}catch(e){}
}
function applyPlayerVisual(){
  const el=document.getElementById('snail-0');
  if(!el)return;
  const s=findItem('skin',loadout.equippedSkin),b=findItem('boost',loadout.equippedBoost);
  el.innerHTML=WORM_SVG(s.c,s.hi1,s.hi2,loadout.equippedShape);
  el.className='snail-wrapper'+(b.tier?' boost-t'+b.tier:'');
}
function equipItem(t,id){
  if(t==='skin')loadout.equippedSkin=id;else if(t==='shape')loadout.equippedShape=id;else loadout.equippedBoost=id;
  applyPlayerVisual();saveLoadout();renderShopGrid(currentShopTab);
}
function buyItem(t,id){
  const it=findItem(t,id);
  if(!it||userCoins<it.price)return;
  if(it.price>0)spendCoins(it.price);
  ownedList(t).push(id);
  equipItem(t,id);
}
function eqLine(){shopEquippedLine.innerHTML='Đang dùng: <b>'+findItem('skin',loadout.equippedSkin).name+'</b> · <b>'+findItem('shape',loadout.equippedShape).name+'</b> · <b>'+findItem('boost',loadout.equippedBoost).name+'</b>'}
function renderShopGrid(tab){
  currentShopTab=tab;
  ['Skin','Shape','Boost'].forEach(k=>document.getElementById('tab'+k).classList.toggle('active',k.toLowerCase()===tab));
  shopCoinVal.textContent=userCoins;shopGrid.innerHTML='';
  const sk=findItem('skin',loadout.equippedSkin);
  if(tab==='skin'){
    const cc=document.createElement('div');
    cc.className='shop-item'+(loadout.equippedSkin==='custom'?' equipped':'');cc.style.gridColumn='1/-1';
    const pv=()=>WORM_SVG(loadout.customColor,undefined,undefined,loadout.equippedShape);
    cc.innerHTML='<span class="shop-name">Màu Tuỳ Chỉnh (miễn phí)</span><div class="shop-preview">'+pv()+'</div><span class="shop-desc">Chọn một màu có sẵn hoặc tự pha màu bạn thích.</span><div class="pk">'+PRESETS.map(p=>'<i data-c="'+p+'" style="background:'+p+'"></i>').join('')+'<input type="color" value="'+loadout.customColor+'"></div>';
    cc.querySelectorAll('i').forEach(i=>i.onclick=()=>{loadout.customColor=i.dataset.c;equipItem('skin','custom')});
    const inp=cc.querySelector('input');
    inp.oninput=()=>{loadout.customColor=inp.value;loadout.equippedSkin='custom';applyPlayerVisual();cc.querySelector('.shop-preview').innerHTML=pv();cc.classList.add('equipped');eqLine()};
    inp.onchange=saveLoadout;
    shopGrid.appendChild(cc);
  }
  (tab==='skin'?SKINS:tab==='shape'?SHAPES:BOOSTS).forEach(item=>{
    const owned=isOwned(tab,item.id),eq=isEquipped(tab,item.id),card=document.createElement('div');
    card.className='shop-item'+(eq?' equipped':'');
    const lab=eq?'Đang dùng':owned?'Trang bị':userCoins>=item.price?'Mua — '+item.price+' xu':'Không đủ xu';
    const dis=eq||(!owned&&userCoins<item.price);
    const stat=tab==='skin'?'Đổi màu thân sâu':tab==='shape'?'Đổi kiểu dáng':'Tốc độ x'+item.mult;
    const pv=tab==='skin'?'<div class="shop-preview">'+WORM_SVG(item.c,item.hi1,item.hi2,loadout.equippedShape)+'</div>':tab==='shape'?'<div class="shop-preview">'+WORM_SVG(sk.c,sk.hi1,sk.hi2,item.id)+'</div>':'<span class="shop-icon">'+item.icon+'</span>';
    card.innerHTML=pv+'<span class="shop-name">'+item.name+'</span><span class="shop-desc">'+item.desc+'</span><span class="shop-stat">'+stat+'</span><button class="shop-buy-btn"'+(dis?' disabled':'')+'>'+lab+'</button>';
    card.querySelector('button').onclick=()=>{owned?equipItem(tab,item.id):buyItem(tab,item.id)};
    shopGrid.appendChild(card);
  });
  eqLine();
}
function openShop(){shopOverlay.classList.add('show');renderShopGrid(currentShopTab)}
function closeShop(){shopOverlay.classList.remove('show')}
document.getElementById('btnShop').onclick=openShop;
document.getElementById('shopClose').onclick=closeShop;
shopOverlay.addEventListener('click',e=>{if(e.target===shopOverlay)closeShop()});
document.getElementById('tabSkin').onclick=()=>renderShopGrid('skin');
document.getElementById('tabShape').onclick=()=>renderShopGrid('shape');
document.getElementById('tabBoost').onclick=()=>renderShopGrid('boost');

buildLanes();

window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  if(e.data.type==='init'){
    const d=e.data.data;
    myName=d.playerName||'Bạn';
    playersList=Array.isArray(d.players)?d.players.filter(Boolean):[];
    if(playersList.length===0)playersList=[myName];
    playersList=[myName,...playersList.filter(n=>n!==myName)];
    questions=d.questions||[];
    totalPoints=questions.reduce((a,q)=>a+(q.points||10),0);
    startTime=Date.now();
    score=0;currentIndex=0;playerDistance=0;streak=0;sessionCoins=0;
    scoreDisplay.textContent='0';
    streakValue.textContent='0';streakStat.classList.remove('show');
    userCoins=d.coins||0;
    if(d.loadout&&typeof d.loadout==='object'){
      loadout.ownedSkins=Array.isArray(d.loadout.ownedSkins)&&d.loadout.ownedSkins.length?d.loadout.ownedSkins:['pink'];
      loadout.ownedBoosts=Array.isArray(d.loadout.ownedBoosts)&&d.loadout.ownedBoosts.length?d.loadout.ownedBoosts:['normal'];
      loadout.ownedShapes=Array.isArray(d.loadout.ownedShapes)&&d.loadout.ownedShapes.length?d.loadout.ownedShapes:['cat'];
      loadout.equippedSkin=d.loadout.equippedSkin||'pink';
      loadout.equippedBoost=d.loadout.equippedBoost||'normal';
      loadout.equippedShape=d.loadout.equippedShape||'cat';
      loadout.customColor=d.loadout.customColor||'#FF6F91';
    }
    coinDisplay.textContent=userCoins;
    overlay.classList.remove('active');
    buildLanes();
    applyPlayerVisual();
    updateSnails();
    renderQuestion();
  }
});

parent.postMessage({type:'ready'},'*');
})();
</script>
</body>
</html>
