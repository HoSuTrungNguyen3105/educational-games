<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>happy farm</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--purple:#8a2fb8;--purple-d:#4f1a75;--gold:#ffc83a;--gold-d:#e08f12;--ink:#3a1750;--cream:#fff4dc;--safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3f4;font-family:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;touch-action:none;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}

#hud{position:fixed;top:calc(var(–safet) + 12px);left:12px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none}
#lvl{position:relative;width:112px;height:34px;flex:none}
#lvl .star{position:absolute;left:-6px;top:-8px;font-size:44px;line-height:1;color:#ffc83a;-webkit-text-stroke:2px #c9780a;text-shadow:0 3px 0 #c9780a;z-index:2}
#lvl .bar{position:absolute;left:18px;right:0;top:3px;bottom:3px;background:#2b0f45;border:3px solid #a259d6;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#lvl .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#ffe27a,#f5a623);transition:width .3s}
#lvl .bar b{position:relative;color:#fff;font-weight:400;font-size:20px;text-shadow:0 2px 0 #2b0f45}
#cash{position:relative;flex:1;max-width:190px;height:36px;background:#f6e7c8;border:3px solid #b98b52;border-radius:8px;display:flex;align-items:center;justify-content:center;padding-left:26px}
#cash .bill{position:absolute;left:-8px;top:-8px;font-size:34px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
#cash b{font-weight:400;font-size:22px;color:#7b1e2b}
.orb{pointer-events:auto;margin-left:auto;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d37cff,#7b25b0 70%);border:3px solid #fff;box-shadow:0 4px 0 #4a136e,0 0 0 3px #7b25b0;font-size:26px;color:#fff;line-height:1}
.side{position:fixed;left:10px;width:64px;height:68px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:30px;line-height:1}
.side em{font-style:normal;font-size:13px;letter-spacing:.2px}
#mapBtn{top:calc(var(–safet) + 128px);background:linear-gradient(#c978f2,#8a2fb8);border:3px solid #fff;box-shadow:0 4px 0 #4a136e;color:#fff}
#ffBtn{top:calc(var(–safet) + 128px);left:auto;right:10px;background:linear-gradient(#4fd0ff,#1b7be6);border:3px solid #fff;box-shadow:0 4px 0 #0c4aa0;color:#fff}
#ffBtn.on{background:linear-gradient(#ffd861,#f19a14);box-shadow:0 4px 0 #a15d00}

#toast{position:fixed;left:50%;top:calc(var(–safet) + 74px);transform:translate(-50%,-14px);max-width:86vw;background:rgba(43,15,69,.94);color:#fff;border:2px solid var(–gold);border-radius:14px;padding:9px 16px;font-size:17px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

#nav{position:fixed;left:0;right:0;bottom:0;height:calc(80px + var(–safeb));padding-bottom:var(–safeb);display:flex;background:linear-gradient(#a143cf,#661d94);border-top:5px solid #f0a81c;box-shadow:0 -4px 0 #7b3a00;z-index:20}
.tab{position:relative;flex:1;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-left:2px solid rgba(40,8,70,.35);color:#fff}
.tab:first-child{border-left:0}
.tab i{font-style:normal;width:46px;height:42px;border-radius:12px;background:linear-gradient(#ffd86b,#f2a31b);border:3px solid #fff3c4;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 3px 0 #b36a00;color:#000}
.tab em{font-style:normal;font-size:12px;text-shadow:0 2px 0 #3d0f5c}
.tab.active i{background:linear-gradient(#9dffa0,#35c53f);box-shadow:0 3px 0 #1c7a22}
.tab.big{flex:1.25}
.tab.big i{width:62px;height:58px;margin-top:-34px;font-size:38px;background:linear-gradient(#e49aff,#a233d6);border:4px solid #ffc83a;box-shadow:0 4px 0 #5b1580}
.tab.big em{font-size:17px;color:#ffd24d;-webkit-text-stroke:.6px #7a3a00;text-shadow:0 2px 0 #7a3a00}
.tab.big.active i{background:linear-gradient(#9dffa0,#35c53f)}
.tab u{position:absolute;top:6px;right:calc(50% - 38px);min-width:22px;height:22px;border-radius:11px;background:#e5342f;border:2px solid #fff;color:#fff;font-size:13px;text-decoration:none;display:none;align-items:center;justify-content:center;padding:0 4px}
.tab u.show{display:flex}

#sheet{position:fixed;left:8px;right:8px;bottom:calc(86px + var(–safeb));max-height:46vh;background:#5b2083;border:4px solid #f0a81c;border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.25);transform:translateY(130%);transition:transform .24s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;z-index:15;max-width:560px;margin:0 auto}
#sheet.open{transform:none}
#sheetHead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;color:#fff}
#sheetTitle{font-weight:400;font-size:22px;text-shadow:0 2px 0 #2b0f45}
#sheetClose{width:34px;height:34px;border-radius:50%;background:#e5342f;color:#fff;font-size:17px;border:2px solid #fff}
#sheetBody{overflow-y:auto;touch-action:pan-y;padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:var(–cream);border-radius:14px;padding:9px 10px;border-bottom:4px solid #d9bd86}
.row .ico{flex:none;width:46px;height:46px;border-radius:12px;background:#ffe3a0;display:flex;align-items:center;justify-content:center;font-size:28px}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .txt b{font-weight:400;font-size:18px;line-height:1.15}
.row .txt span{font-size:13px;color:#7a5a86;font-family:system-ui,sans-serif;font-weight:600;line-height:1.3}
.prog{height:9px;border-radius:5px;background:#e6d3a5;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(#7cf06f,#2fb83a)}
.act{flex:none;min-width:92px;padding:7px 10px;border-radius:12px;background:linear-gradient(#5fe36b,#26b533);border-bottom:4px solid #167a20;color:#fff;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.act small{font-size:14px;color:#fff6b8}
.act.gold{background:linear-gradient(#ffd861,#f2a31b);border-bottom-color:#a45f00}
.act.off{background:#b9a9c4;border-bottom-color:#8c7b98;color:#efe7f5;opacity:.9}
.act.off small{color:#efe7f5}
.map3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.map3 button{aspect-ratio:1.15;border-radius:14px;background:var(–cream);border-bottom:4px solid #d9bd86;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;gap:2px}
.map3 button span{font-size:13px;color:var(–ink)}
.map3 button.lock{opacity:.55}
.hint{color:#e8d6f5;font-size:14px;text-align:center;font-family:system-ui,sans-serif;font-weight:600;padding:2px 6px}
</style>

</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="lvl"><span class="star">★</span><div class="bar"><i id="xp"></i><b id="lvnum">1</b></div></div>
  <div id="cash"><span class="bill">💵</span><b id="money">0</b></div>
  <button id="menuBtn" class="orb" aria-label="Menu">☰</button>
</div>
<button id="mapBtn" class="side"><span>🗺️</span><em>Map</em></button>
<button id="ffBtn" class="side"><span>⏩</span><em id="ffx">x1</em></button>
<div id="toast"></div>

<div id="sheet">
  <div id="sheetHead"><b id="sheetTitle"></b><button id="sheetClose" aria-label="Close">✕</button></div>
  <div id="sheetBody"></div>
</div>

<nav id="nav">
  <button class="tab" data-tab="shop"><i>🛒</i><em>Shop</em></button>
  <button class="tab big" data-tab="build"><i>🏠</i><em>Build</em></button>
  <button class="tab" data-tab="quest"><i>🎮</i><em>Quests</em><u id="bq"></u></button>
  <button class="tab" data-tab="stock"><i>📦</i><em>Storage</em></button>
  <button class="tab" data-tab="team"><i>👥</i><em>Farmers</em><u id="bt"></u></button>
</nav>

<script>
'use strict';
/* ============================== Constants & helpers ============================== */
const TW = 100, TH = 50, GW = 16, GH = 18;
const LANE = [0.5, 5.5, 10.5, 15.5];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = n => { n = Math.floor(n); if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M'; return n.toLocaleString('en-US'); };
function P(x, y, z) { return [(x - y) * TW / 2, (x + y) * TH / 2 - (z || 0)]; }

function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function mix(h1, h2, t) { const a = hex2rgb(h1), b = hex2rgb(h2); return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')'; }
function pal(h) { return { t: mix(h, '#ffffff', .12), l: mix(h, '#000000', .14), r: mix(h, '#000000', .3) }; }

/* ============================== Data ============================== */
const ZDEF = [
  { id: 'pond',    c: 0, r: 0, name: 'Fish Pond',       icon: '🐟', item: '🐟', cost: 4500,  val: 40,  rate: .14, up: 2000, lz: 56 },
  { id: 'wheat',   c: 1, r: 0, name: 'Wheat Field', icon: '🌾', item: '🌾', cost: 0,     val: 5,   rate: .35, up: 60,   lz: 56 },
  { id: 'bee',     c: 2, r: 0, name: 'Bee Garden',    icon: '🍯', item: '🍯', cost: 30000, val: 130, rate: .08, up: 13000, lz: 56 },
  { id: 'coop',    c: 0, r: 1, name: 'Chicken Coop',   icon: '🐔', item: '🥚', cost: 0,     val: 9,   rate: .22, up: 140,  lz: 60 },
  { id: 'wh',      c: 1, r: 1, name: 'Warehouse',     icon: '📦', kind: 'wh',     cost: 0, lz: 70 },
  { id: 'orchard', c: 2, r: 1, name: 'Apple Orchard',    icon: '🍎', item: '🍎', cost: 400,   val: 14,  rate: .2,  up: 180,  lz: 104 },
  { id: 'pig',     c: 0, r: 2, name: 'Pig Farm',    icon: '🐖', item: '🥓', cost: 12000, val: 70,  rate: .1,  up: 5400, lz: 56 },
  { id: 'cow',     c: 1, r: 2, name: 'Dairy Pasture',  icon: '🐄', item: '🥛', cost: 1500,  val: 24,  rate: .16, up: 680,  lz: 56 },
  { id: 'market',  c: 2, r: 2, name: 'Market',         icon: '🏪', kind: 'market', cost: 0, lz: 76 },
];
const ZD = {}, ZGRID = [[], [], []];
ZDEF.forEach(d => { d.x0 = 1 + 5 * d.c; d.y0 = 1 + 5 * d.r; d.reserved = 0; ZD[d.id] = d; ZGRID[d.r][d.c] = d; });
const PRODUCERS = ZDEF.filter(d => !d.kind);
const MAXLV = 12;

const SHIRTS = ['#e5483f', '#3b8be8', '#f2b632', '#43b86a', '#a15bd6', '#ee7aa8', '#2fb3b8', '#ef8a2e'];
const HATS = ['#d93a32', '#f3d36b', '#ffffff', '#3d6fd6', '#f3d36b', '#d93a32', '#ffffff', '#3d6fd6'];

const QDEF = [
  { k: 'harv', t: 'Harvest Crops', unit: 'items', base: 20, mul: 2.4, rew: t => t * 4 },
  { k: 'sold', t: 'Sell at the Market',     unit: 'items', base: 15, mul: 2.5, rew: t => t * 8 },
  { k: 'earn', t: 'Earn Money',          unit: '$',   base: 300, mul: 3,  rew: t => Math.round(t * .3) },
];

/* ============================== State ============================== */
const SAVE_KEY = 'nongtrai_v1';
function defaultState() {
  const zones = {};
  ZDEF.forEach(d => { zones[d.id] = { u: d.cost === 0, lv: 1, prog: 0, ready: 0 }; });
  return { money: 300, xp: 0, lv: 1, speed: 1, farmers: 2, upg: { speed: 1, carry: 1, wh: 1, market: 1 }, stock: {}, stats: { harv: 0, sold: 0, earn: 0 }, qt: { harv: 0, sold: 0, earn: 0 }, zones };
}
function loadState() {
  const s = defaultState();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      ['money', 'xp', 'lv', 'speed', 'farmers'].forEach(k => { if (typeof j[k] === 'number') s[k] = j[k]; });
      Object.assign(s.upg, j.upg || {}); Object.assign(s.stats, j.stats || {}); Object.assign(s.qt, j.qt || {}); Object.assign(s.stock, j.stock || {});
      ZDEF.forEach(d => { if (j.zones && j.zones[d.id]) Object.assign(s.zones[d.id], j.zones[d.id]); });
    }
  } catch (e) {}
  return s;
}
let S = loadState();
function saveState() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

const capOf = z => 6 + 4 * z.lv;
const rateOf = (d, z) => d.rate * (1 + .4 * (z.lv - 1));
const upCost = (d, z) => Math.round(d.up * Math.pow(1.75, z.lv - 1));
const whCap = () => 40 + 30 * (S.upg.wh - 1);
const whCost = () => Math.round(80 * Math.pow(1.8, S.upg.wh - 1));
const mkMult = () => 1 + .12 * (S.upg.market - 1);
const mkCost = () => Math.round(120 * Math.pow(1.9, S.upg.market - 1));
const farmerSpeed = () => 2.0 + .3 * (S.upg.speed - 1);
const spdCost = () => Math.round(150 * Math.pow(2, S.upg.speed - 1));
const carryCap = () => 4 + 2 * S.upg.carry;
const carryCost = () => Math.round(100 * Math.pow(1.9, S.upg.carry - 1));
const hireCost = () => Math.round(120 * Math.pow(1.7, S.farmers - 2));
const totalStock = () => Object.values(S.stock).reduce((a, b) => a + b, 0);
const qTarget = q => Math.round(q.base * Math.pow(q.mul, S.qt[q.k]));
const xpNeed = () => Math.round(40 * Math.pow(S.lv, 1.7));
const claimable = () => QDEF.filter(q => S.stats[q.k] >= qTarget(q)).length;

/* ============================== Canvas & camera ============================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize); resize();

const BOUNDS = { minX: -GH * TW / 2, maxX: GW * TW / 2, minY: 0, maxY: (GW + GH) * TH / 2 };
const cam = { x: 0, y: 380, z: window.innerWidth < 520 ? .62 : .85, tx: null, ty: null, tz: null };
function clampCam() {
  cam.z = clamp(cam.z, .38, 1.6);
  cam.x = clamp(cam.x, BOUNDS.minX + 260, BOUNDS.maxX - 260);
  cam.y = clamp(cam.y, 80, BOUNDS.maxY - 80);
}
const toScreen = (ix, iy) => [(ix - cam.x) * cam.z + W / 2, (iy - cam.y) * cam.z + H / 2];
function screenToTile(sx, sy) {
  const ix = (sx - W / 2) / cam.z + cam.x, iy = (sy - H / 2) / cam.z + cam.y;
  return [(ix / (TW / 2) + iy / (TH / 2)) / 2, (iy / (TH / 2) - ix / (TW / 2)) / 2];
}
function focusZone(id, zoom, sheetOpen) {
  const d = ZD[id]; const [ix, iy] = P(d.x0 + 2, d.y0 + 2, 20);
  cam.tz = zoom || Math.max(cam.z, .75);
  cam.tx = ix; cam.ty = iy + (sheetOpen ? (H * .17) / cam.tz : 0);
}

/* ============================== Basic drawing ============================== */
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw || 1.5; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function box(x, y, w, d, h, z, c) {
  z = z || 0;
  const a = P(x, y, z + h), b = P(x + w, y, z + h), cc = P(x + w, y + d, z + h), dd = P(x, y + d, z + h);
  const b0 = P(x + w, y, z), c0 = P(x + w, y + d, z), d0 = P(x, y + d, z);
  const o = 'rgba(35,12,55,.28)';
  poly([b, cc, c0, b0], c.r, o); poly([dd, cc, c0, d0], c.l, o); poly([a, b, cc, dd], c.t, o);
}
function ell(x, y, rx, ry, fill, stroke, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw || 1.5; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function rrect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw || 1.5; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function line(x1, y1, x2, y2, col, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.stroke(); }
const FONT = '"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif';

/* ============================== Ground ============================== */
function zoneAt(i, j) {
  if (i < 1 || j < 1 || i > 14 || j > 14) return null;
  if ((i - 1) % 5 > 3 || (j - 1) % 5 > 3) return null;
  return ZGRID[Math.floor((j - 1) / 5)][Math.floor((i - 1) / 5)];
}
function floorColor(d, i, j) {
  const k = (i + j) % 2;
  const lx = i - d.x0, ly = j - d.y0;
  switch (d.id) {
    case 'wh': return k ? '#8f8399' : '#988ca2';
    case 'wheat': return (j % 2) ? '#8b5b35' : '#7e512e';
    case 'coop': return k ? '#f0d17d' : '#e9c76c';
    case 'orchard': return k ? '#6cc050' : '#64b84a';
    case 'cow': return k ? '#90db67' : '#87d35e';
    case 'pig': return k ? '#b58257' : '#a9774c';
    case 'bee': return k ? '#a6e475' : '#9cdd6a';
    case 'pond': return (lx >= 1 && lx < 3 && ly >= 1 && ly < 3) ? null : (k ? '#f2dfa8' : '#ead79b');
    case 'market': return k ? '#ddb77d' : '#d3ad73';
  }
  return '#80d05a';
}
let TIME = 0;
function drawGround() {
  const t = 30;
  poly([P(GW, 0), P(GW, GH), P(GW, GH, -t), P(GW, 0, -t)], '#946239', 'rgba(35,12,55,.3)');
  poly([P(0, GH), P(GW, GH), P(GW, GH, -t), P(0, GH, -t)], '#b0794a', 'rgba(35,12,55,.3)');
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const pts = [P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)];
    let col;
    if (j >= 16) col = '#4d4c58';
    else {
      const d = zoneAt(i, j);
      if (!d) col = (i + j) % 2 ? '#e7d6af' : '#dfcca4';
      else if (!S.zones[d.id].u) col = (i + j) % 2 ? '#b8e29c' : '#b0dc94';
      else {
        col = floorColor(d, i, j);
        if (col === null) { // pond water
          const w = Math.sin(TIME * 1.6 + i * 1.3 + j * .9) * .5 + .5;
          col = mix('#43aee8', '#6cc9f5', w * .6);
          poly(pts, col, col, 1);
          const c = P(i + .5, j + .5);
          line(c[0] - 9 + w * 4, c[1], c[0] + 3 + w * 4, c[1], 'rgba(255,255,255,.55)', 2);
          continue;
        }
      }
    }
    poly(pts, col, col, 1);
    if (j >= 16 && i % 2 === 0 && j === 16) { // road markings
      line(...P(i + .2, 17), ...P(i + .8, 17), '#f5f2e8', 3);
    }
  }
  // dashed outline for locked zones
  ZDEF.forEach(d => {
    if (S.zones[d.id].u) return;
    ctx.setLineDash([12, 9]);
    poly([P(d.x0, d.y0), P(d.x0 + 4, d.y0), P(d.x0 + 4, d.y0 + 4), P(d.x0, d.y0 + 4)], null, 'rgba(255,255,255,.9)', 3);
    ctx.setLineDash([]);

        box(cx, cy, 2.43, .8, 14, 0, pal('#9b6a3a'));
        const GC = ['#e8332e', '#f5c63c', '#7bd85a', '#ff8a2a', '#c78bff', '#ffffff'];
        GC.forEach((g, i) => box(cx + .15 + i * .38, cy + .2, .26, .4, 8, 14, pal(g)));
        box(cx, cy + .88, .08, .08, 36, 0, WOOD); box(cx + 2.35, cy + .88, .08, .08, 36, 0, WOOD);

function drawFloaters() {

const clouds = [{ x: .1, y: .12, s: 1 }, { x: .6, y: .3, s: .8 }, { x: .35, y: .58, s: 1.2 }, { x: .85, y: .75, s: .9 }];
function drawSky(dt) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#79c9f0'); g.addColorStop(1, '#d9f3ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

function render(dt) {

/* ============================== Game logic ============================== */
function addXp(n) {
  S.xp += n;
  while (S.xp >= xpNeed()) { S.xp -= xpNeed(); S.lv++; const b = 100 * S.lv; S.money += b; toast('⭐ Level up ' + S.lv + '! Bonus $' + fmt(b)); }
}
function update(dt) {
  PRODUCERS.forEach(d => {
    const z = S.zones[d.id]; if (!z.u) return;
    const cp = capOf(z);
    if (z.ready < cp) {
      z.prog += rateOf(d, z) * dt;
      if (z.prog >= 1) { const k = Math.floor(z.prog), add = Math.min(k, cp - z.ready); z.ready += add; z.prog -= k; if (z.ready >= cp) z.prog = 0; }
    } else z.prog = 0;
  });
  syncFarmers(); syncAnimals();
  farmers.forEach(f => updateFarmer(f, dt));
  updateTruck(dt); updateAnimals(dt);
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += dt; if (floaters[i].t > 1.4) floaters.splice(i, 1); }
}

}

/* ============================== Controls: drag, pinch, tap ============================== */
const ptrs = new Map(); let downInfo = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam.tx = cam.ty = cam.tz = null;
  if (ptrs.size === 1) downInfo = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; if (downInfo) downInfo.moved = true; }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    if (downInfo && Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y) > 8) downInfo.moved = true;
    if (downInfo && downInfo.moved) { cam.x -= dx / cam.z; cam.y -= dy / cam.z; clampCam(); }
  } else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()]; cam.z = pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d; clampCam();
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (downInfo && !downInfo.moved && e.type === 'pointerup' && performance.now() - downInfo.t < 600) onTap(e.clientX, e.clientY);
  if (ptrs.size === 0) downInfo = null;
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); cam.tx = cam.ty = cam.tz = null; cam.z *= Math.exp(-e.deltaY * .001); clampCam(); }, { passive: false });
function onTap(x, y) {
  for (const h of labelHits) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return tapZone(h.id, x, y);
  const [gx, gy] = screenToTile(x, y);
  const d = zoneAt(Math.floor(gx), Math.floor(gy));
  if (d) tapZone(d.id, x, y, gx, gy); else closeSheet();
}
function tapZone(id, x, y, gx, gy) {
  const d = ZD[id];
  if (id === 'wh' && gx !== undefined && S.zones.wh.u) {
    const lx = gx - d.x0, ly = gy - d.y0;
    if (lx > .8 && lx < 2.8 && ly > 1.5 && ly < 3.3) { openSheet('team'); return; }
  }
  openSheet('zone', id); focusZone(id, Math.max(cam.z, .7), true);
}

/* ============================== Loop ============================== */
let last = performance.now(), hudT = 0, saveT = 0;
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  const dt = rdt * S.speed; TIME += rdt;
  update(dt);
  if (cam.tx !== null) {
    const k = 1 - Math.pow(.0008, rdt);
    cam.x = lerp(cam.x, cam.tx, k); cam.y = lerp(cam.y, cam.ty, k); cam.z = lerp(cam.z, cam.tz, k);
    if (Math.abs(cam.x - cam.tx) < .5 && Math.abs(cam.y - cam.ty) < .5 && Math.abs(cam.z - cam.tz) < .004) cam.tx = cam.ty = cam.tz = null;
  }
  clampCam();
  render(rdt);
  hudT += rdt; if (hudT > .25) { hudT = 0; updateHud(); renderSheet(false); }
  saveT += rdt; if (saveT > 5) { saveT = 0; saveState(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);
if (document.fonts && document.fonts.load) document.fonts.load('20px "Lilita One"').catch(() => {});
syncFarmers(); syncAnimals(); updateHud();
setTimeout(() => toast('Drag to move · Pinch to zoom · Tap a zone to upgrade'), 600);
requestAnimationFrame(frame);
</script>
