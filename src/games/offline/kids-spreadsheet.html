<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book1 - Excel</title>
<style>
:root{--g:#217346;--gd:#185c37;--ga:#217346;--rb:#f3f3f3;--bd:#d4d4d4;--tx:#262626;--cbg:#fff;--cfg:#000;--grid:#d9d9d9;--hbg:#e6e6e6;--hfg:#444;--hsel:#d2d2d2;--hline:#ababab;--hline2:#c6c6c6;--pbg:#fff;--hov:#e1e1e1}
.dark{--rb:#2d2d2d;--bd:#444;--tx:#e6e6e6;--cbg:#1e1e1e;--cfg:#e8e8e8;--grid:#383838;--hbg:#2b2b2b;--hfg:#bbb;--hsel:#404040;--hline:#555;--hline2:#454545;--pbg:#383838;--hov:#444;--ga:#5bd19a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{font:12px "Segoe UI",Calibri,Carlito,system-ui,-apple-system,sans-serif;color:var(--tx);background:var(--cbg);user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
svg{display:block}
#app{display:flex;flex-direction:column;height:100%}

#title{height:30px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;flex:none}
.qat{display:flex;gap:2px;padding-left:8px;width:200px}
.qat button{width:26px;height:26px;display:grid;place-items:center;border-radius:2px}
.qat svg{width:16px;height:16px}
.qat button:hover,.wc button:hover{background:rgba(255,255,255,.18)}
.ttl{font-size:12px;text-align:center;white-space:nowrap}
.wc{display:flex;width:200px;justify-content:flex-end}
.wc button{width:46px;height:30px;font-size:13px}
.wc .x:hover{background:#e81123}

#tabs{height:28px;background:var(--g);display:flex;align-items:flex-end;flex:none;color:#fff;overflow:hidden}
.tab{height:28px;padding:0 12px;font-size:12px;color:#fff;white-space:nowrap;flex:none}
.tab.file{background:var(--gd);padding:0 20px;margin-right:4px}
.tab.file:hover{background:#134a2c}
.tab:hover:not(.on):not(.file){background:rgba(255,255,255,.15)}
.tab.on{background:var(--rb);color:var(--ga)}
.tell{margin-left:auto;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;color:#fff;font-size:12px}
.tell input{background:transparent;border:0;outline:0;color:#fff;width:200px;font:inherit}
.tell input::placeholder{color:rgba(255,255,255,.85)}
.tell svg{width:14px;height:14px}
.share{height:22px;margin:0 10px 3px 4px;padding:0 12px;border:1px solid rgba(255,255,255,.7);border-radius:2px;color:#fff}

#ribbon{background:var(--rb);border-bottom:1px solid var(--bd);height:94px;display:flex;padding:3px 4px 0;overflow-x:auto;overflow-y:hidden;flex:none}
#ribbon.hide{display:none}
.grp{display:flex;flex-direction:column;padding:0 5px;border-right:1px solid var(--bd);flex:none}
.gc{flex:1;display:flex;gap:2px;align-items:flex-start;padding-top:2px}
.gl{height:18px;text-align:center;font-size:11px;color:var(--hfg);white-space:nowrap}
.col{display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:1px;align-items:center}
.bb{min-width:46px;height:68px;display:flex;flex-direction:column;align-items:center;padding:3px 5px;gap:3px;text-align:center;font-size:11px;line-height:1.15;border:1px solid transparent;border-radius:2px;max-width:92px}
.bb svg{width:32px;height:32px;flex:none}
.sb{height:22px;display:flex;align-items:center;gap:5px;padding:0 5px;font-size:11px;white-space:nowrap;border:1px solid transparent;border-radius:2px}
.sb svg{width:16px;height:16px;flex:none}
.ib{width:24px;height:22px;display:grid;place-items:center;border:1px solid transparent;border-radius:2px;font-size:13px}
.bb:hover,.sb:hover,.ib:hover{background:var(--hov);border-color:var(--hline2)}
.bb.on,.sb.on,.ib.on{background:#c6dccf;border-color:#8fb9a2}
.dark .bb.on,.dark .sb.on,.dark .ib.on{background:#245c40}
#ribbon select{height:22px;font-size:12px;border:1px solid var(--hline2);background:var(--pbg);color:var(--tx);border-radius:0}
.ckl{display:flex;align-items:center;gap:5px;font-size:11px;height:22px;white-space:nowrap}
.clr{position:relative;width:34px;height:22px;display:grid;place-items:center;border:1px solid transparent}
.clr:hover{background:var(--hov);border-color:var(--hline2)}
.clr span{font-weight:700;font-size:13px;line-height:13px}
.clr i{display:block;width:14px;height:3px;background:#c00}
.clr input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:default}

#fbar{height:24px;display:flex;align-items:center;background:var(--cbg);border-bottom:1px solid var(--bd);flex:none}
#nb{width:92px;height:22px;border:1px solid var(--hline2);margin:0 4px;padding:0 4px;font:12px "Segoe UI",Calibri,sans-serif;background:var(--pbg);color:var(--tx);outline:0}
#nb:focus{border-color:var(--g)}
.fbtn{display:flex;align-items:center;gap:8px;padding:0 8px;color:#888;font-size:13px;border-left:1px solid var(--bd);height:100%}
.fbtn .fx{font-style:italic;font-family:Georgia,serif;color:var(--hfg)}
#fi{flex:1;height:22px;border:1px solid var(--hline2);border-left:0;padding:0 6px;font:13px Calibri,Carlito,"Segoe UI",sans-serif;background:var(--pbg);color:var(--tx);outline:0;min-width:0}

#gw{position:relative;flex:1;min-height:0;background:var(--cbg);--hw:40px;--hh:20px;--hfs:13px;--rhpx:20px;--cw:64px;--pad:3px}
#corner{position:absolute;left:0;top:0;width:var(--hw);height:var(--hh);background:var(--hbg);border-right:1px solid var(--hline);border-bottom:1px solid var(--hline);z-index:3}
#corner:after{content:"";position:absolute;right:3px;bottom:3px;border:solid transparent;border-width:0 0 9px 9px;border-bottom-color:#b4b4b4}
#ch{position:absolute;left:var(--hw);top:0;right:0;height:var(--hh);overflow:hidden;background:var(--hbg);border-bottom:1px solid var(--hline)}
#colin{display:flex;height:100%;will-change:transform}
#colin div{flex:none;display:grid;place-items:center;border-right:1px solid var(--hline2);color:var(--hfg);font-size:var(--hfs);font-family:Calibri,Carlito,"Segoe UI",sans-serif}
#colin div.sel{background:var(--hsel);color:var(--ga);border-bottom:2px solid var(--g)}
#rh{position:absolute;left:0;top:var(--hh);bottom:0;width:var(--hw);overflow:hidden;background:var(--hbg);border-right:1px solid var(--hline)}
#rowin{position:relative;will-change:transform}
#rowin div{position:absolute;left:0;width:100%;height:var(--rhpx);display:grid;place-items:center;border-bottom:1px solid var(--hline2);color:var(--hfg);font-size:var(--hfs);font-family:Calibri,Carlito,"Segoe UI",sans-serif}
#rowin div.sel{background:var(--hsel);color:var(--ga);border-right:2px solid var(--g)}
#sc{position:absolute;left:var(--hw);top:var(--hh);right:0;bottom:0;overflow:scroll;background:var(--cbg)}
#sizer{position:relative}
#rows{position:absolute;inset:0;color:var(--cfg);overflow:hidden}
.r{position:absolute;left:0;width:100%;height:var(--rhpx);border-bottom:1px solid var(--grid);background:linear-gradient(to left,var(--grid) 1px,transparent 1px) 0 0/var(--cw) 100% repeat-x}
.nogrid .r{background:none;border-bottom-color:transparent}
.t{position:absolute;top:0;white-space:pre;padding:0 var(--pad);line-height:calc(var(--rhpx) - 1px)}
.t.clip{overflow:hidden}
.t.rt{text-align:right}
.fill{position:absolute;top:0;height:100%}
#sel{position:absolute;border:2px solid var(--g);pointer-events:none;z-index:2}
#sel:after{content:"";position:absolute;right:-5px;bottom:-5px;width:6px;height:6px;background:var(--g);border:1px solid var(--cbg)}

#stabs{height:26px;background:var(--rb);border-top:1px solid var(--bd);display:flex;align-items:stretch;flex:none;overflow:hidden}
.nav{display:flex;align-items:center;padding:0 4px;gap:2px;flex:none}
.nav button{width:18px;height:18px;color:#777;font-size:9px;border-radius:2px}
.nav button:hover{background:var(--hov)}
#tlist{display:flex;overflow:hidden;max-width:calc(100% - 140px)}
.st{flex:none;max-width:150px;padding:0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;border-right:1px solid var(--bd);color:var(--tx)}
.st:hover:not(.on){background:var(--hov)}
.st.on{background:var(--cbg);color:var(--ga);font-weight:600;border-bottom:2px solid var(--g)}
.st input{width:100px;font:inherit;border:1px solid var(--g);outline:0;padding:0 2px;background:var(--pbg);color:var(--tx)}
#tadd{width:26px;display:grid;place-items:center;font-size:18px;color:#666;flex:none}
#tadd:hover{background:var(--hov)}

#status{height:22px;background:var(--g);color:#fff;display:flex;align-items:center;padding:0 8px;gap:14px;font-size:12px;flex:none}
#status .sp{flex:1}
#prog{opacity:.85}
.vw{display:flex;gap:2px}
.vw span{width:22px;height:18px;display:grid;place-items:center}
.vw span:first-child{background:rgba(255,255,255,.28)}
.vw i{display:block;width:12px;height:10px;border:1px solid #fff}
.zm{display:flex;align-items:center;gap:6px}
.zm button{font-size:16px;line-height:14px;width:16px;color:#fff}
#zr{-webkit-appearance:none;appearance:none;width:100px;height:2px;background:rgba(255,255,255,.75);outline:0;margin:0}
#zr::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:14px;background:#fff;border:1px solid #777}
#zr::-moz-range-thumb{width:6px;height:14px;background:#fff;border:1px solid #777;border-radius:0}
#zp{width:36px;text-align:right}

#ovl{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center}
#ovl.ml{pointer-events:none;align-items:flex-start;justify-content:flex-end;padding:140px 30px}
.dlg{pointer-events:auto;background:var(--pbg);color:var(--tx);border:1px solid #6d6d6d;box-shadow:0 6px 24px rgba(0,0,0,.35);min-width:340px;max-width:92vw}
.dh{display:flex;justify-content:space-between;align-items:center;height:30px;padding-left:10px;background:var(--pbg);font-size:12px}
.dx{width:46px;height:30px;font-size:13px}
.dx:hover{background:#e81123;color:#fff}
.db{padding:6px 14px 12px;font-size:12px}
.db p{margin:0 0 8px}
.db textarea{width:100%;height:220px;resize:vertical;font:13px Calibri,Carlito,sans-serif;border:1px solid #999;padding:4px;background:var(--pbg);color:var(--tx)}
.db input[type=text]{width:100%;height:23px;border:1px solid #999;padding:0 4px;background:var(--pbg);color:var(--tx);font:12px "Segoe UI",sans-serif}
.db select{width:100%;border:1px solid #999;background:var(--pbg);color:var(--tx);font:13px Calibri,Carlito,sans-serif}
.db label{display:flex;align-items:center;gap:6px;margin-top:8px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 14px}
.df button{min-width:78px;height:24px;border:1px solid #adadad;background:#e1e1e1;color:#222}
.df button:hover{background:#e5f1fb;border-color:#0078d7}
.df button.pri{border:2px solid #0078d7}
.big{width:560px}
.fres{color:#a33;min-height:16px;margin-top:6px}
.ctx{position:fixed;z-index:60;background:var(--pbg);border:1px solid #c6c6c6;box-shadow:2px 3px 6px rgba(0,0,0,.3);padding:2px;min-width:160px}
.ctx div{padding:5px 26px}
.ctx div:hover{background:var(--hov)}
.ctx div.dis{color:#999;pointer-events:none}

#bs{position:fixed;left:0;right:0;top:30px;bottom:0;z-index:30;display:flex;background:var(--cbg)}
#bs nav{width:230px;background:var(--gd);color:#fff;display:flex;flex-direction:column;padding-top:6px}
#bs nav button{text-align:left;padding:12px 28px;font-size:14px}
#bs nav button:hover{background:rgba(255,255,255,.14)}
#bs nav .back{font-size:20px;padding:6px 20px 14px}
#bs section{flex:1;padding:36px 50px;overflow:auto}
#bs h1{font-weight:300;font-size:30px;margin:0 0 20px}
#bs p{color:var(--hfg);max-width:520px;line-height:1.5}
.cards{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
.card{width:190px;padding:16px;border:1px solid var(--bd);background:var(--rb);text-align:left;font-size:13px;line-height:1.4}
.card b{display:block;font-size:14px;margin-bottom:4px;color:var(--ga)}
.card:hover{border-color:var(--g);background:var(--hov)}
#drop{position:fixed;inset:0;z-index:70;border:3px dashed var(--g);background:rgba(33,115,70,.12);display:grid;place-items:center;font-size:20px;color:var(--g);pointer-events:none}
@media(max-width:820px){.tell,.share,.qat,.wc{display:none}#title{justify-content:center}.zm #zr{width:60px}#prog{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="title">
    <div class="qat">
      <button data-act="save" title="Lưu (Ctrl+S)"><svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="2" fill="#fff"/><rect x="9" y="4" width="14" height="9" fill="#217346"/><rect x="9" y="18" width="14" height="10" fill="#cfe3d8"/></svg></button>
      <button title="Hoàn tác"><svg viewBox="0 0 32 32"><path d="M6 14h14a7 7 0 010 14h-6M6 14l7-7M6 14l7 7" fill="none" stroke="#fff" stroke-width="3"/></svg></button>
      <button title="Làm lại"><svg viewBox="0 0 32 32"><path d="M26 14H12a7 7 0 000 14h6M26 14l-7-7M26 14l-7 7" fill="none" stroke="#fff" stroke-width="3"/></svg></button>
    </div>
    <div class="ttl">Book1 - Excel</div>
    <div class="wc"><button>&#8212;</button><button>&#9633;</button><button class="x">&#10005;</button></div>
  </div>
  <div id="tabs">
    <button class="tab file" data-tab="file">Tệp</button>
    <button class="tab on" data-tab="home">Trang đầu</button>
    <button class="tab" data-tab="insert">Chèn</button>
    <button class="tab" data-tab="layout">Bố trí Trang</button>
    <button class="tab" data-tab="formulas">Công thức</button>
    <button class="tab" data-tab="data">Dữ liệu</button>
    <button class="tab" data-tab="review">Xem lại</button>
    <button class="tab" data-tab="view">Xem</button>
    <div class="tell"><svg viewBox="0 0 32 32"><path d="M16 3a9 9 0 00-5 16.5V24h10v-4.5A9 9 0 0016 3zM12 27h8" fill="none" stroke="#fff" stroke-width="2.4"/></svg><input id="tellme" placeholder="Cho tôi biết bạn muốn làm gì..."></div>
    <button class="share">Chia sẻ</button>
  </div>
  <div id="ribbon"></div>
  <div id="fbar">
    <input id="nb" value="A1" spellcheck="false" autocomplete="off">
    <div class="fbtn"><span>&#10005;</span><span>&#10003;</span><span class="fx">fx</span></div>
    <input id="fi" readonly spellcheck="false">
  </div>
  <div id="gw">
    <div id="corner"></div>
    <div id="ch"><div id="colin"></div></div>
    <div id="rh"><div id="rowin"></div></div>
    <div id="sc"><div id="sizer"><div id="rows"></div><div id="sel"></div></div></div>
  </div>
  <div id="stabs">
    <div class="nav"><button id="tl" title="Cuộn trái (chuột phải: danh sách)">&#9664;</button><button id="tr" title="Cuộn phải (chuột phải: danh sách)">&#9654;</button></div>
    <div id="tlist"></div>
    <button id="tadd" title="Trang tính mới">+</button>
  </div>
  <div id="status">
    <span id="stmsg">Sẵn sàng</span>
    <span id="prog"></span>
    <span class="sp"></span>
    <div class="vw"><span><i></i></span><span><i style="border-style:dashed"></i></span><span><i style="border-width:1px 1px 1px 3px"></i></span></div>
    <div class="zm"><button id="zout">&#8722;</button><input id="zr" type="range" min="25" max="200" step="5" value="100"><button id="zin">+</button><span id="zp">100%</span></div>
  </div>
</div>

<div id="bs" hidden>
  <nav>
    <button class="back" data-bs="close" title="Quay lại">&#10229;</button>
    <button data-bs="new">Mới</button>
    <button data-bs="open">Mở</button>
    <button data-bs="save">Lưu</button>
    <button data-bs="paste">Dán văn bản</button>
    <button data-bs="close">Đóng</button>
  </nav>
  <section>
    <h1>Mở</h1>
    <p>Chọn tệp truyện để thêm vào sổ làm việc. Mỗi tệp (hoặc mỗi chương nếu bật tự tách chương) sẽ thành một trang tính ở thanh tab phía dưới. Bạn cũng có thể kéo thả tệp vào cửa sổ.</p>
    <div class="cards">
      <button class="card" data-bs="open"><b>Duyệt tệp</b>.txt .docx .epub .html .xlsx .csv và thư viện .json</button>
      <button class="card" data-bs="paste"><b>Dán văn bản</b>Dán nội dung truyện từ clipboard</button>
      <button class="card" data-bs="save"><b>Lưu thư viện</b>Xuất toàn bộ truyện và vị trí đang đọc ra tệp .json</button>
    </div>
  </section>
</div>
<input type="file" id="fp" multiple hidden accept=".txt,.md,.log,.docx,.epub,.html,.htm,.xhtml,.xlsx,.xls,.csv,.tsv,.json">

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const NCOLS=300,K=1024;
const S={sheets:[],active:0,zoom:1,fontPt:11,fam:'Calibri',bold:false,italic:false,color:'',grid:true,head:true,fbar:true,split:true,boss:-1,speed:3,tab:'home'};
let D={rh:20,cw:64,fs:14.7};
const sc=$('#sc'),sizer=$('#sizer'),rowsEl=$('#rows'),selEl=$('#sel'),colin=$('#colin'),rowin=$('#rowin'),gw=$('#gw');
const cx=document.createElement('canvas').getContext('2d');
const colName=i=>{let s='';for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};
const FF=()=>`"${S.fam}", Carlito, "Segoe UI", Arial, sans-serif`;
const cur=()=>S.sheets[S.active];

/* favicon */
(()=>{const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='#217346'/><path d='M9 8l14 16M23 8L9 24' stroke='white' stroke-width='3.6'/></svg>");document.head.appendChild(l)})();

/* ---------- sheets ---------- */
const mkText=(name,paras)=>({type:'text',name,paras,lines:[],lineP:[],pf:[],key:'',selR:0,selC:0,topL:0,left:0,topP:0,selP:0});
const mkGrid=name=>({type:'grid',name,cells:new Map(),maxRow:0,selR:0,selC:0,topL:0,left:0});
const nRows=sh=>Math.max(1000,(sh.type==='text'?sh.lines.length:sh.maxRow)+300);
function cellObj(sh,r,c){return sh.type==='grid'?sh.cells.get(r*K+c):null}
function cellText(sh,r,c){if(sh.type==='text')return c===0?(sh.lines[r]||''):'';const o=cellObj(sh,r,c);return o?o.v:''}
function cellFormula(sh,r,c){const o=cellObj(sh,r,c);return o&&o.f?'='+o.f:cellText(sh,r,c)}

function sanitize(n){return String(n||'').replace(/[\[\]:*?\/\\]/g,' ').replace(/\s+/g,' ').trim().slice(0,31)}
function uniq(name,ignore){
  let base=sanitize(name)||'Sheet',n=base,i=2;
  const has=x=>S.sheets.some(s=>s!==ignore&&s.name.toLowerCase()===x.toLowerCase());
  while(has(n)){const suf=' ('+i++ +')';n=base.slice(0,31-suf.length)+suf}
  return n;
}
function addSheet(sh){S.sheets.push(sh);return S.sheets.length-1}

function fakeSheet(){
  const sh=mkGrid('Sheet1');sh.isFake=true;
  const put=(r,c,v,o)=>{sh.cells.set(r*K+c,Object.assign({v:String(v)},o));sh.maxRow=Math.max(sh.maxRow,r)};
  const fmt=n=>n.toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1});
  put(0,0,'BÁO CÁO DOANH THU QUÝ 3/2026',{b:1});
  put(1,0,'Đơn vị tính: triệu đồng',{i:1,color:'#777'});
  ['Mặt hàng','Tháng 7','Tháng 8','Tháng 9','Tổng','Mục tiêu','% KH'].forEach((h,c)=>put(3,c,h,{b:1,fill:'#217346',color:'#fff',num:c>0}));
  const items=['Laptop','Chuột','Bàn phím','Màn hình','Tai nghe','Ổ cứng','Webcam','Cáp sạc'];
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const tot=[0,0,0,0,0];
  items.forEach((n,i)=>{

/* ---------- wrap ---------- */
function ensureWrap(sh){
  if(sh.type!=='text')return;
  const cw=sc.clientWidth||window.innerWidth-60;
  const maxW=Math.max(160,Math.floor(cw/S.zoom-16));
  const key=[S.fontPt,S.fam,S.bold,S.italic,maxW].join('|');
  if(sh.key===key)return;
  // anchors from old layout
  let tp=sh.topP,toff=0,sp=sh.selP,soff=0;
  if(sh.lines.length){
    const ti=clamp(Math.floor(sh.topL),0,sh.lines.length-1);tp=sh.lineP[ti];toff=ti-sh.pf[tp];
    if(sh.selR<sh.lines.length){sp=sh.lineP[sh.selR];soff=sh.selR-sh.pf[sp]}else{sp=sh.selP;soff=0}
  }
  cx.font=`${S.italic?'italic ':''}${S.bold?'700 ':'400 '}${S.fontPt*4/3}px ${FF()}`;
  const cache=new Map(),mw=w=>{let v=cache.get(w);if(v===undefined){v=cx.measureText(w).width;cache.set(w,v)}return v};
  const sw=mw(' '),L=[],P=[],F=new Int32Array(sh.paras.length);
  sh.paras.forEach((p,pi)=>{
    F[pi]=L.length;
    if(!p){L.push('');P.push(pi);return}
    let line='',lw=0;
    const push=()=>{L.push(line);P.push(pi);line='';lw=0};
    for(const w of p.split(' ')){
      if(!w)continue;
      const ww=mw(w);
      if(line&&lw+sw+ww<=maxW){line+=' '+w;lw+=sw+ww;continue}
      if(line)push();
      if(ww<=maxW){line=w;lw=ww;continue}
      for(const ch of w){const c=mw(ch);if(line&&lw+c>maxW)push();line+=ch;lw+=c}
    }
    if(line)push();
  });
  sh.lines=L;sh.lineP=P;sh.pf=F;sh.key=key;
  const lim=p=>(p+1<F.length?F[p+1]:L.length)-1;
  if(F.length){
    tp=clamp(tp,0,F.length-1);sp=clamp(sp,0,F.length-1);
    sh.topL=Math.min(F[tp]+toff,lim(tp));
    sh.selR=Math.min(F[sp]+soff,lim(sp));
    sh.selP=sp;sh.topP=tp;
  }
}

function rowContent(sh,r,c0,c1){

function findNext(dir){

function decode(buf){

function htmlToText(html){

const RE_CH=/^(chương|chuong|chapter)\s+(\d+|[ivxlcdm]+|nhất|một|hai|ba|bốn|tư|năm|sáu|bảy|tám|chín|mười|trăm)(?![\p{L}\p{N}])|^(tập|phần|quyển|hồi|volume|vol\.?|book)\s+(\d+|[ivxlc]+)(?![\p{L}\p{N}])|^第.{1,9}[章回节節话話]|^(mở đầu|lời nói đầu|lời tựa|ngoại truyện|phiên ngoại|prologue|epilogue|番外)(?![\p{L}\p{N}])/iu;
const isCh=p=>p&&p.length<=100&&RE_CH.test(p);
function splitChapters(paras){
  const idx=[];paras.forEach((p,i)=>{if(isCh(p))idx.push(i)});
  if(idx.length<2)return null;
  const trim=a=>{let s=0,e=a.length;while(s<e&&!a[s])s++;while(e>s&&!a[e-1])e--;return a.slice(s,e)};
  const out=[],toc=[];let intro=paras.slice(0,idx[0]);
  const smallIntro=intro.filter(Boolean).length<6;
  if(!smallIntro)out.push({title:'Giới thiệu',paras:trim(intro)});
  idx.forEach((s,k)=>{
    let chunk=paras.slice(s,k+1<idx.length?idx[k+1]:paras.length);
    if(k===0&&smallIntro)chunk=intro.concat(chunk);
    chunk=trim(chunk);
    const body=chunk.filter(Boolean).length-1;
    if(body<1&&!(k===0&&smallIntro)){toc.push(paras[s]);return}
    out.push({title:paras[s],paras:chunk});
  });
  if(toc.length>=3)out.unshift({title:'Mục lục',paras:toc});

}
function addText(base,text){

  if(['xlsx','xls','xlsm','ods'].includes(ext)){await lib('xlsx');return importGrid(XLSX.read(await f.arrayBuffer(),{type:'array'}))}
  if(['csv','tsv'].includes(ext)){await lib('xlsx');return importGrid(XLSX.read(decode(await f.arrayBuffer()),{type:'string'}))}
  if(ext==='docx'){await lib('mammoth');const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return addText(base,r.value)}

function importGrid(wb){
  const made=[];
  wb.SheetNames.forEach(name=>{
    const ws=wb.Sheets[name],sh=mkGrid(uniq(name));
    for(const k in ws){
      if(k[0]==='!')continue;const a=XLSX.utils.decode_cell(k);
      if(a.c>=NCOLS||a.r>200000)continue;const c=ws[k];
      const v=c.w!==undefined?c.w:(c.v===undefined?'':String(c.v));if(v==='')continue;
      sh.cells.set(a.r*K+a.c,{v,num:c.t==='n'||undefined,f:c.f});sh.maxRow=Math.max(sh.maxRow,a.r);
    }

async function importEpub(f,base){
  await lib('jszip');const zip=await JSZip.loadAsync(await f.arrayBuffer());
  const P=s=>new DOMParser().parseFromString(s,'application/xml');
  const rf=P(await zip.file('META-INF/container.xml').async('string')).querySelector('rootfile').getAttribute('full-path');
  const opf=P(await zip.file(rf).async('string')),dir=rf.includes('/')?rf.replace(/[^/]*$/,''):'';
  const man={};opf.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
  const made=[];let n=0;
  for(const ir of opf.querySelectorAll('spine > itemref')){
    const href=man[ir.getAttribute('idref')];if(!href)continue;
    const path=decodeURIComponent(new URL('http://x/'+dir+href).pathname.slice(1));
    const file=zip.file(path)||zip.file(href);if(!file)continue;
    const html=await file.async('string');
    const d=new DOMParser().parseFromString(html,'text/html');
    const h=d.querySelector('h1,h2,h3'),paras=clean(htmlToText(html));
    if(paras.join('').length<30)continue;
    n++;
    const title=(h&&h.textContent.trim())||paras[0].slice(0,40)||base+' '+n;
    if(paras[0]===title&&paras.length>1)paras.shift();
    paras.unshift(title);
    made.push(addSheet(mkText(uniq(title),paras)));
  }
  if(!made.length)throw new Error('Không tìm thấy nội dung trong tệp EPUB.');
  return made;
}
function importJSON(t){
  const d=JSON.parse(t);if(!d||!Array.isArray(d.sheets))throw new Error('Tệp .json không phải thư viện hợp lệ.');

    return addSheet(sh);
  });
}

const ACT={
  paste:dlgPaste,import:pick,save:exportLib,find:dlgFind,
  copy:()=>{const sh=cur();try{navigator.clipboard.writeText(cellText(sh,sh.selR,sh.selC)).catch(()=>{})}catch(e){}},
  bold:()=>{S.bold=!S.bold;syncRibbon();relayout()},italic:()=>{S.italic=!S.italic;syncRibbon();relayout()},
  colorreset:()=>{S.color='';syncRibbon();layout();render()},
  zoom100:()=>setZoom(1),auto:()=>toggleAuto(),dark:()=>{document.body.classList.toggle('dark');syncRibbon()}
};
const CHG={
  family:e=>{S.fam=e.value;relayout()},size:e=>{S.fontPt=+e.value;relayout()},
  color:e=>{S.color=e.value;syncRibbon();layout();render()},
  split:e=>S.split=e.checked,
  gridlines:e=>{S.grid=e.checked;layout();render()},headings:e=>{S.head=e.checked;relayout()},
  fbar:e=>{S.fbar=e.checked;$('#fbar').style.display=S.fbar?'':'none'},
  speed:e=>S.speed=+e.value
};
$('#ribbon').addEventListener('click',e=>{const a=e.target.closest('button[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a)});
$('#ribbon').addEventListener('input',e=>{const a=e.target.dataset.act;if(a==='color')CHG.color(e.target)});
$('#ribbon').addEventListener('change',e=>{const a=e.target.dataset.act;if(a&&CHG[a]&&a!=='color'){CHG[a](e.target);if(e.target.tagName==='SELECT')e.target.blur()}});
document.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
document.querySelectorAll('.qat [data-act]').forEach(b=>b.onclick=()=>ACT[b.dataset.act]&&ACT[b.dataset.act]());
$('#tellme').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.target.blur();dlgFind()}if(e.key==='Escape')e.target.blur()});

/* ---------- backstage ---------- */
function openBS(){$('#bs').hidden=false}
function closeBS(){$('#bs').hidden=true}
$('#bs').addEventListener('click',e=>{
  const b=e.target.closest('[data-bs]');if(!b)return;const a=b.dataset.bs;
  if(a==='close')closeBS();
  else if(a==='open'){closeBS();pick()}
  else if(a==='paste'){closeBS();dlgPaste()}
  else if(a==='save'){exportLib()}
  else if(a==='new'){closeBS();$('#tadd').click()}
});

/* ---------- zoom ---------- */
function setZoom(z){
  S.zoom=clamp(Math.round(z*20)/20,.25,2);
  $('#zr').value=Math.round(S.zoom*100);$('#zp').textContent=Math.round(S.zoom*100)+'%';
  relayout();
}
$('#zr').oninput=e=>setZoom(e.target.value/100);
$('#zin').onclick=()=>setZoom(S.zoom+.1);$('#zout').onclick=()=>setZoom(S.zoom-.1);
sc.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(S.zoom+(e.deltaY<0?.1:-.1))}},{passive:false});

/* ---------- auto scroll ---------- */
let auto=0;
function toggleAuto(on){
  if(on===undefined)on=!auto;
  if(!on){if(auto)cancelAnimationFrame(auto);auto=0;syncRibbon();return}
  let last=performance.now(),pos=sc.scrollTop;
  const step=t=>{
    const dt=Math.min(100,t-last);last=t;
    if(Math.abs(sc.scrollTop-Math.round(pos))>2)pos=sc.scrollTop;
    pos+=S.speed*15*dt/1000;sc.scrollTop=pos;
    if(sc.scrollTop<Math.floor(pos)-1){toggleAuto(false);return}
    auto=requestAnimationFrame(step);
  };
  auto=requestAnimationFrame(step);syncRibbon();
}

/* ---------- boss key ---------- */
function panic(){
  toggleAuto(false);closeBS();closeDialog();closeCtx();
  const f=S.sheets.findIndex(s=>s.isFake);
  if(f<0)return;
  if(S.active!==f){
    S.boss=S.active;const fk=S.sheets[f];fk.selR=0;fk.selC=0;fk.topL=0;fk.left=0;
    if(S.tab!=='home'){setTab('home')}
    activate(f);
  }else if(S.boss>=0&&S.sheets[S.boss]){activate(S.boss);S.boss=-1}
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const inField=e.target.matches('input,textarea,select');
  const ctrl=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){
    if(inField){e.target.blur();return}
    if(!$('#bs').hidden){closeBS();return}
    if(dlg){closeDialog();return}
    panic();return;
  }
  if(ctrl&&e.key.toLowerCase()==='f'){e.preventDefault();dlgFind();return}
  if(ctrl&&e.key.toLowerCase()==='s'){e.preventDefault();exportLib();return}
  if(ctrl&&e.key.toLowerCase()==='o'){e.preventDefault();pick();return}
  if(inField||dlg||!$('#bs').hidden)return;
  const sh=cur(),pg=Math.max(1,Math.floor(sc.clientHeight/D.rh)-1);
  const page=d=>{sc.scrollTop+=d*pg*D.rh;selectCell(sh.selR+d*pg,sh.selC,false)};
  if(ctrl&&e.key==='PageDown'){e.preventDefault();if(S.active<S.sheets.length-1)activate(S.active+1);return}
  if(ctrl&&e.key==='PageUp'){e.preventDefault();if(S.active>0)activate(S.active-1);return}
  if(ctrl&&e.key==='Home'){e.preventDefault();selectCell(0,0);sc.scrollTop=0;sc.scrollLeft=0;return}
  if(ctrl&&e.key==='End'){e.preventDefault();const last=sh.type==='text'?sh.lines.length-1:sh.maxRow;jumpTo(Math.max(0,last),0);return}
  if(ctrl&&(e.key==='='||e.key==='+')){e.preventDefault();setZoom(S.zoom+.1);return}
  if(ctrl&&e.key==='-'){e.preventDefault();setZoom(S.zoom-.1);return}
  switch(e.key){
    case 'ArrowDown':case 'Enter':selectCell(sh.selR+(e.shiftKey&&e.key==='Enter'?-1:1),sh.selC);break;
    case 'ArrowUp':selectCell(sh.selR-1,sh.selC);break;
    case 'ArrowLeft':selectCell(sh.selR,sh.selC-1);break;
    case 'ArrowRight':selectCell(sh.selR,sh.selC+1);break;
    case 'Tab':selectCell(sh.selR,sh.selC+(e.shiftKey?-1:1));break;
    case 'PageDown':page(1);break;
    case 'PageUp':page(-1);break;
    case ' ':page(e.shiftKey?-1:1);break;
    case 'Home':selectCell(sh.selR,0);break;
    default:return;
  }
  e.preventDefault();
});

/* ---------- resize ---------- */
let rt=0,lw=0;
new ResizeObserver(()=>{
  clearTimeout(rt);rt=setTimeout(()=>{if(sc.clientWidth!==lw){lw=sc.clientWidth;relayout()}else render()},120);
}).observe(sc);

/* ---------- tự lưu tiến độ ----------
 * Trước đây truyện đã nhập chỉ sống trong bộ nhớ: tải lại trang hay thoát game
 * là mất sạch. App là SPA nên `pagehide` của game cũng không chạy khi rời trang
 * → đăng ký thêm __gqFlush / event "gq:flush" (FLUSH_BRIDGE trong
 * src/pages/OfflineGamePage.jsx) để ghi trước khi thoát.
 * Sheet1 báo cáo (isFake) và 'Hướng dẫn' (isGuide) không lưu vì luôn được dựng lại lúc khởi động. */
const RK='bang-tinh-lib-v1';
let dirty=false, saveBroken=false;
function serializeSheet(s){
  return s.type==='grid'
    ?{name:s.name,type:'grid',cells:[...s.cells].map(([k,v])=>[Math.floor(k/K),k%K,v]),selR:s.selR,selC:s.selC,topL:s.topL,left:s.left}
    :{name:s.name,type:'text',paras:s.paras,topP:s.topP,selP:s.selP,selR:s.selR,topL:s.topL,left:s.left};
}
function saveRun(){
  if(saveBroken)return;
  const user=S.sheets.filter(s=>!s.isFake&&!s.isGuide);
  try{
    localStorage.setItem(RK,JSON.stringify({v:1,at:Date.now(),active:cur().name,sheets:user.map(serializeSheet)}));
    dirty=false;
  }catch(e){saveBroken=true;} // hết dung lượng localStorage: ngừng tự lưu, không phá trải nghiệm
}
function loadRun(){
  try{const s=JSON.parse(localStorage.getItem(RK)||'null');return s&&s.v===1&&Array.isArray(s.sheets)&&s.sheets.length?s:null}catch(e){return null}
}
function restoreSheet(d){
  let sh;
  if(d.type==='grid'){
    sh=mkGrid(uniq(d.name));
    (d.cells||[]).forEach(([r,c,o])=>{sh.cells.set(r*K+c,o);sh.maxRow=Math.max(sh.maxRow,r)});
  }else{
    sh=mkText(uniq(d.name),d.paras||[]);
    sh.topP=d.topP||0;sh.selP=d.selP||0;
  }
  sh.selR=d.selR|0;sh.selC=d.selC|0;sh.topL=d.topL||0;sh.left=d.left||0;
  return sh;
}
window.__gqFlush=saveRun;
addEventListener('gq:flush',saveRun);
addEventListener('pagehide',saveRun);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun()});
setInterval(()=>{if(dirty)saveRun()},4000);

/* ---------- init ---------- */
const savedLib=loadRun();
S.sheets.push(fakeSheet(),guideSheet());
if(savedLib)savedLib.sheets.filter(d=>d.name!=='Hướng dẫn').forEach(d=>S.sheets.push(restoreSheet(d)));
setTab('home');renderTabs();
activate(Math.max(1,S.sheets.findIndex(s=>s.name===(savedLib&&savedLib.active))));lw=sc.clientWidth;
if(savedLib)$('#stmsg').textContent='Đã mở lại thư viện đã lưu';
</script>
