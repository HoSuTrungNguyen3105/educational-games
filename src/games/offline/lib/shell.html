<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Góc Giải Trí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    /*__EG_TOKENS__*/

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: var(--body);
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 28px 28px;
      min-height: 100vh;
    }

    #app {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 60px
    }

    button {
      font-family: inherit;
      color: inherit;
      cursor: pointer
    }

    h1,
    h2,
    h3 {
      font-family: var(--head);
      margin: 0;
      line-height: 1.1
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .logo {
      font-family: var(--head);
      font-weight: 800;
      font-size: 30px;
      letter-spacing: -.5px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .logo i {
      font-style: normal;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(-6deg)
    }

    .me {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .lvl {
      font-family: var(--head);
      font-weight: 800;
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 17px
    }

    .xp {
      width: 130px;
      height: 16px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--card);
      overflow: hidden
    }

    .xp i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--mint);
      transition: width .6s cubic-bezier(.2, .9, .3, 1.2)
    }

    .snd {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 3px solid var(--ink);
      background: var(--card);
      font-size: 18px
    }

    .hero {
      display: flex;
      gap: 18px;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      margin: 6px 0 20px
    }

    .hero h2 {
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 800;
      letter-spacing: -1px;
      max-width: 14ch
    }

    .hero p {
      margin: 0;
      max-width: 34ch;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink2)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px
    }

    .tile {
      text-align: left;
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 190px;
      position: relative;
      transition: transform .12s, box-shadow .12s;
      background: var(--card)
    }

    .tile:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--ink)
    }

    .tile:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink)
    }

    .tile .ic {
      font-size: 44px;
      line-height: 1
    }

    .tile h3 {
      font-size: 26px;
      font-weight: 800
    }

    .tile p {
      margin: 0;
      font-size: 14px;
      line-height: 1.45
    }

    .tile .meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700
    }

    .tag {
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 3px 11px;
      font-size: 12px;
      font-weight: 700
    }

    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 26px;
      align-items: center
    }

    .badges b {
      font-family: var(--head);
      font-size: 20px;
      margin-right: 4px
    }

    .bd {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 700;
      background: var(--card)
    }

    .bd.off {
      opacity: .38;
      filter: grayscale(1);
      border-style: dashed
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px
    }

    .back {
      border: 3px solid var(--ink);
      background: var(--card);
      border-radius: 14px;
      padding: 8px 14px;
      font-weight: 700;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .bar h2 {
      font-size: 28px;
      font-weight: 800
    }

    .stage {
      max-width: 640px;
      margin: 0 auto
    }

    .panel {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow)
    }

    .center {
      text-align: center
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 14px
    }

    .btn {
      border: 3px solid var(--ink);
      background: var(--sun);
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .1s, box-shadow .1s
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--ink)
    }

    .btn.alt,
    .btn.ghost {
      background: var(--card)
    }

    .btn.sky {
      background: var(--sky);
      color: #fff
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 16px
    }

    .hud span {
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      padding: 5px 12px
    }

    .tbar {
      height: 14px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--card);
      overflow: hidden;
      margin-bottom: 14px
    }

    .tbar i {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--tomato);
      transition: width .1s linear
    }

    .qbox {
      background: var(--ink);
      color: #fff;
      border-radius: 20px;
      padding: 22px 16px;
      text-align: center;
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(34px, 9vw, 56px);
      margin-bottom: 14px;
      min-height: 96px;
      display: grid;
      place-items: center
    }

    .qbox.txt {
      font-size: clamp(20px, 4.6vw, 26px);
      font-weight: 600;
      line-height: 1.3;
      font-family: var(--body);
      text-align: left;
      place-items: center start;
      padding: 18px
    }

    .qbox small {
      display: block;
      font-size: 14px;
      font-weight: 500;
      opacity: .75;
      margin-top: 4px;
      font-family: var(--body)
    }

    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .opts.one {
      grid-template-columns: 1fr
    }

    .opt {
      border: 3px solid var(--ink);
      background: var(--card);
      border-radius: 16px;
      padding: 16px 10px;
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(22px, 5vw, 30px);
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .1s, background .15s
    }

    .opts.one .opt {
      font-family: var(--body);
      font-weight: 600;
      font-size: 17px;
      text-align: left;
      padding: 14px 16px
    }

    .opt:active {
      transform: translate(3px, 3px)
    }

    .opt.ok {
      background: var(--ok);
      color: #fff
    }

    .opt.bad {
      background: var(--bad);
      color: #fff;
      animation: shake .3s
    }

    .opt.gone {
      opacity: .25;
      pointer-events: none
    }

    @keyframes shake {
      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    .explain {
      margin-top: 14px;
      background: var(--bg);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.5
    }

    .pop {
      animation: pop .35s
    }

    @keyframes pop {
      0% {
        transform: scale(.8)
      }

      60% {
        transform: scale(1.08)
      }

      100% {
        transform: scale(1)
      }
    }

    /* Bàn 2048 — 4x4, quả gộp theo cấp. */
    .b48 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      width: min(88vw, 380px);
      margin: 12px auto 0;
      padding: 8px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: var(--bg);
      box-shadow: var(--shadow);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none
    }

    .t48 {
      display: grid;
      place-items: center;
      aspect-ratio: 1/1;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 2px 2px 0 var(--ink);
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(22px, 7vw, 38px);
      line-height: 1
    }

    .t48:empty {
      border-style: dashed;
      background: transparent;
      box-shadow: none;
      opacity: .4
    }

    .t48.n {
      animation: pop .22s
    }

    .mem {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px
    }

    .mc {
      perspective: 700px;
      aspect-ratio: 1/1.05;
      border: 0;
      background: none;
      padding: 0
    }

    .mc .in {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .35s
    }

    .mc.flip .in {
      transform: rotateY(180deg)
    }

    .mc .f,
    .mc .b {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 3px solid var(--ink);
      border-radius: 14px;
      display: grid;
      place-items: center;
      padding: 4px;
      text-align: center
    }

    .mc .f {
      background: var(--lilac);
      font-size: 28px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .mc .b {
      transform: rotateY(180deg);
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(14px, 3.6vw, 20px);
      line-height: 1.1;
      word-break: break-word
    }

    .mc .b.en {
      background: #cfe4ff
    }

    .mc .b.vi {
      background: #c6f3e6
    }

    .mc.done .b {
      background: var(--ok);
      color: #fff
    }

    .slots {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 6px 0 18px
    }

    .slot {
      width: 46px;
      height: 56px;
      border: 3px dashed var(--ink);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: var(--head);
      font-weight: 800;
      font-size: 28px;
      background: var(--card);
      padding: 0
    }

    .slot.fill {
      border-style: solid;
      background: var(--sun);
      box-shadow: 2px 2px 0 var(--ink)
    }

    .slots.win .slot {
      background: var(--ok);
      color: #fff
    }

    .slots.err {
      animation: shake .35s
    }

    .tiles {
      display: flex;
      gap: 9px;
      justify-content: center;
      flex-wrap: wrap
    }

    .tl {
      width: 52px;
      height: 58px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--card);
      font-family: var(--head);
      font-weight: 800;
      font-size: 28px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .tl:disabled {
      opacity: .2;
      box-shadow: none
    }

    canvas {
      display: block;
      margin: 0 auto;
      border: 3px solid var(--ink);
      border-radius: 16px;
      touch-action: none;
      background: var(--card);
      max-width: 100%
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
      justify-content: center;
      margin-top: 14px
    }

    .dpad button {
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      font-size: 22px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .dpad button:active {
      transform: translate(2px, 2px)
    }

    .dpad .u {
      grid-column: 2
    }

    .dpad .l {
      grid-row: 2;
      grid-column: 1
    }

    .dpad .d {
      grid-row: 2;
      grid-column: 2
    }

    .dpad .r {
      grid-row: 2;
      grid-column: 3
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--ink2);
      margin: 10px 0 0
    }

    #modal {
      position: fixed;
      inset: 0;
      background: rgba(29, 46, 74, .6);
      display: none;
      place-items: center;
      padding: 18px;
      z-index: 20
    }

    #modal.on {
      display: grid
    }

    .result {
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: pop .4s
    }

    .result h2 {
      font-size: 34px;
      font-weight: 800
    }

    .big {
      font-family: var(--head);
      font-weight: 800;
      font-size: 64px;
      line-height: 1;
      margin: 8px 0
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .stats span {
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 700;
      font-size: 14px
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 120px);
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 700;
      z-index: 30;
      transition: transform .4s;
      max-width: 90vw;
      text-align: center
    }

    #toast.on {
      transform: translate(-50%, 0)
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    button:focus-visible {
      outline: 4px solid var(--sky);
      outline-offset: 2px
    }

    /* ============================================================
       KHUNG MỞ ĐẦU DÙNG CHUNG
       Mọi game một màn đều mở bằng cùng một tấm thiệp: icon, tên,
       luật chơi ngắn và 3 mức nhịp độ. Nhờ vậy người chơi không phải
       học lại cách vào game ở từng trò.
       ============================================================ */
    .intro {
      text-align: center;
      padding: 24px 18px 20px
    }

    .intro-ic {
      width: 86px;
      height: 86px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      font-size: 46px;
      line-height: 1;
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 24px;
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(-4deg)
    }

    .intro h2 {
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 800
    }

    .intro > p {
      margin: 8px auto 0;
      max-width: 36ch;
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink2)
    }

    .intro-steps {
      margin: 12px auto 0;
      padding: 0 0 0 20px;
      max-width: 350px;
      text-align: left;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--ink2)
    }

    .intro-steps li + li {
      margin-top: 2px
    }

    .intro-best {
      margin: 12px 0 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink2)
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px
    }

    .mode {
      display: grid;
      justify-items: center;
      gap: 2px;
      padding: 10px 4px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--ink);
      font-family: var(--head);
      transition: transform .1s, box-shadow .1s, background .15s
    }

    .mode i {
      font-style: normal;
      font-size: 22px;
      line-height: 1
    }

    .mode b {
      font-size: 14px;
      line-height: 1.15
    }

    .mode em {
      font-style: normal;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.2;
      opacity: .62
    }

    .mode.sel {
      background: var(--sun)
    }

    .mode:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink)
    }

    /* ============================================================
       BÀN CHƠI DÙNG CHUNG
       Cùng một kiểu ô, chữ, đèn báo và thanh tiến trình để 17 game
       trông như các màn của MỘT bộ game, không phải 17 sản phẩm rời.
       ============================================================ */
    .board {
      display: grid;
      grid-template-columns: repeat(var(--n, 3), 1fr);
      gap: 8px;
      margin: 8px 0
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      padding: 4px;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--ink);
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(20px, 6vw, 30px);
      line-height: 1;
      transition: background .12s, transform .08s, box-shadow .08s, opacity .12s
    }

    .cell:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink)
    }

    .cell .ic {
      font-size: clamp(20px, 5.4vw, 30px);
      line-height: 1
    }

    .cell .num {
      position: absolute;
      right: 5px;
      bottom: 3px;
      padding: 0 6px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 12px;
      line-height: 1.35
    }

    .cell.ok,
    .cell.found {
      background: var(--ok);
      color: #fff
    }

    .cell.bad {
      background: var(--bad);
      color: #fff;
      animation: shake .3s
    }

    .cell.lit {
      background: var(--sun);
      animation: pop .25s
    }

    .cell.dim {
      opacity: .32
    }

    .cell.blank {
      opacity: .18;
      box-shadow: none
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 8px 0
    }

    .chip {
      padding: 3px 10px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--card);
      font-size: 12px;
      font-weight: 700
    }

    .chip.on {
      background: var(--sun)
    }

    .chip.done {
      background: var(--ok);
      color: #fff
    }

    .hearts {
      letter-spacing: 2px
    }

    .prompt {
      margin: 6px 0 10px;
      text-align: center;
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(24px, 6.4vw, 34px);
      line-height: 1.15
    }

    .prompt small {
      display: block;
      margin-top: 3px;
      font-family: var(--body);
      font-size: 13px;
      font-weight: 600;
      opacity: .65
    }

    .pattern-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 10px 0
    }

    .pcell {
      display: grid;
      place-items: center;
      min-width: 52px;
      min-height: 58px;
      padding: 2px 6px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(22px, 6vw, 30px);
      line-height: 1
    }

    .pcell.missing {
      background: var(--sun);
      border-style: dashed
    }

    .rhythm {
      position: relative;
      height: 64px;
      margin: 14px 0;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 3px 3px 0 var(--ink)
    }

    .rhythm .zone {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: var(--zw, 24%);
      transform: translateX(-50%);
      background: rgba(34, 181, 115, .3);
      border-left: 2px solid var(--ink);
      border-right: 2px solid var(--ink)
    }

    .rhythm .center {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: var(--ok);
      opacity: .75
    }

    .rhythm .marker {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 0;
      width: 8px;
      border-radius: 999px;
      background: var(--ink);
      will-change: transform
    }

    .simon {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 360px;
      margin: 12px auto 0
    }

    .pd {
      aspect-ratio: 1.3 / 1;
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      color: #fff;
      font-size: 34px;
      opacity: .72;
      transition: transform .08s, opacity .08s, filter .08s
    }

    .pd.on {
      opacity: 1;
      filter: brightness(1.25);
      transform: scale(1.03)
    }

    .wordgrid {
      display: grid;
      gap: 6px;
      max-width: 420px;
      margin: 10px auto 0
    }

    .wl {
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(18px, 5vw, 26px)
    }

    .wl.sel {
      background: var(--sun)
    }

    .wl.found {
      background: var(--ok);
      color: #fff
    }

    .wl.bad {
      background: var(--bad);
      color: #fff
    }

    .chests {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 2px 0 10px;
      font-size: 20px
    }

    .chests span {
      opacity: .28;
      filter: grayscale(1)
    }

    .chests span.open {
      opacity: 1;
      filter: none
    }

    .clue {
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 2.5px dashed var(--ink);
      border-radius: 14px;
      background: var(--paper);
      font-size: 14px;
      line-height: 1.5;
      text-align: center
    }

    .big-signal {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 210px;
      padding: 16px;
      border: 3px solid var(--ink);
      border-radius: 22px;
      background: var(--sky);
      box-shadow: var(--shadow);
      color: #fff;
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(26px, 7vw, 40px);
      line-height: 1.15;
      transition: background .15s
    }

    .big-signal.go {
      background: var(--ok)
    }

    .big-signal.stop {
      background: var(--bad)
    }

    .stat-line {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
      font-size: 13px;
      font-weight: 700
    }

    .stat-line span {
      padding: 3px 10px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--card)
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 6px 0 2px
    }

    .dots i {
      width: 9px;
      height: 9px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--card)
    }

    .dots i.on {
      background: var(--ok)
    }

    @media (max-height: 720px) {
      .intro {
        padding: 16px 14px
      }

      .intro-ic {
        width: 66px;
        height: 66px;
        font-size: 34px;
        margin-bottom: 8px
      }

      .intro-steps {
        font-size: 12.5px;
        line-height: 1.45
      }

      .mode em {
        display: none
      }

      .cell {
        border-width: 2.5px
      }

      .big-signal {
        min-height: 160px
      }
    }

    /* ============================================================
       CHẾ ĐỘ 1 GAME (body.single)
       File offline chỉ chơi 1 game, không có sảnh. Thanh `.top`
       (logo + cấp + XP + âm thanh) là header của SẢNH nên thừa —
       nó chiếm ~80px và đẩy game xuống, buộc người chơi phải cuộn.
       Ẩn đi và nới lỏng padding để game nằm sát mép trên, vào là chơi.
       ============================================================ */
    body.single .top {
      display: none
    }

    body.single #app {
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px))
    }

    /* Thanh tiêu đề còn lại (nút "Về sảnh" + tên game) gọn lại */
    body.single .bar {
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: nowrap
    }

    body.single .bar h2 {
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    body.single .back {
      padding: 6px 11px;
      font-size: 14px;
      white-space: nowrap;
      flex: none
    }

    /* Bỏ khoảng trắng cuối trang: #app có padding-bottom 60px dư thừa */
    body.single .badges,
    body.single .hint {
      margin-top: 8px
    }

    /* Màn hình thấp (mobile ngang / desktop nhỏ): bỏ bớt khoảng đệm dọc
       để phần lớn game vừa 1 màn hình, không phải cuộn xuống. */
    @media (max-height: 720px) {
      body.single .qbox {
        min-height: 64px;
        margin-bottom: 10px;
        padding: 14px 12px;
        font-size: clamp(26px, 7vw, 42px)
      }

      body.single .opt {
        padding: 11px 8px;
        font-size: clamp(19px, 4.4vw, 26px)
      }

      body.single .opts {
        gap: 9px
      }

      body.single .explain {
        margin-top: 9px;
        padding: 9px 11px
      }

      body.single .row {
        margin-top: 9px
      }

      body.single .dpad {
        margin-top: 9px;
        grid-template-rows: repeat(2, 48px)
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="top">
      <div class="logo"><i>🎮</i>Góc Giải Trí</div>
      <div class="me">
        <span class="lvl" id="lvl">Cấp 1</span>
        <div class="xp" title="Kinh nghiệm"><i id="xpb"></i></div>
        <button class="snd" id="snd" aria-label="Bật tắt âm thanh">🔊</button>
      </div>
    </div>
    <div id="hub"></div>
    <div id="game" hidden>
      <div class="bar"><button class="back" id="back">← Về sảnh</button>
        <h2 id="gt"></h2>
      </div>
      <div class="stage" id="stage"></div>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast"></div>
