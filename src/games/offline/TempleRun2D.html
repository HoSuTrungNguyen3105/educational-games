<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃 Temple Run - Góc nhìn thứ nhất 2D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #0f0f2a, #1a1a3e);
            padding: 15px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 40px #0f346066;
            border: 1px solid #2a3a6a;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #0a0a1a;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            width: 960px;
            height: 540px;
            cursor: pointer;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 0 8px;
            color: #f0e6d0;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-box {
            background: #0f0f2a;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 24px;
            border: 2px solid #f1c40f;
            box-shadow: 0 0 20px #f1c40f44;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .coin-box {
            background: #0f0f2a;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 20px;
            border: 2px solid #f39c12;
            box-shadow: 0 0 20px #f39c1244;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #2a2a4a;
            border: none;
            color: #f0e6d0;
            font-weight: bold;
            font-size: 16px;
            padding: 7px 20px;
            border-radius: 40px;
            border-bottom: 4px solid #f1c40f;
            transition: 0.08s linear;
            cursor: pointer;
            box-shadow: 0 4px 0 #0b0b1a;
        }
        .btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }
        .btn-restart {
            background: #4a2a3a;
            border-bottom-color: #e74c3c;
        }
        .key-hint {
            display: flex;
            gap: 10px;
            background: #0f0f2a80;
            padding: 5px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid #4a5a7a;
            font-size: 14px;
        }
        .key-hint kbd {
            background: #2a2a4a;
            padding: 2px 10px;
            border-radius: 10px;
            color: #f7d44a;
            font-weight: bold;
        }
        @media (max-width: 1000px) {
            canvas { width: 100%; height: auto; aspect-ratio: 960/540; }
            .game-wrapper { padding: 10px; }
            .info-panel { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div class="info-panel">
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <div class="score-box">🏆 <span id="scoreDisplay">0</span></div>
            <div class="coin-box">🪙 <span id="coinDisplay">0</span></div>
        </div>
        <div class="controls">
            <div class="key-hint">
                <kbd>⬆️</kbd> <kbd>⬇️</kbd> <kbd>⬅️</kbd> <kbd>➡️</kbd>
            </div>
            <button class="btn btn-restart" id="restartBtn">🔄 Chạy lại</button>
        </div>
    </div>
</div>
<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const coinSpan = document.getElementById('coinDisplay');

        const W = 960, H = 540;
        const GROUND_Y = 480;
        const PLAYER_W = 28, PLAYER_H = 44;

        // === CẤU HÌNH GÓC NHÌN THỨ NHẤT (GIẢ 3D) ===
        // Điểm biến mất (vanishing point) ở trung tâm
        const VANISH_X = W / 2;
        const VANISH_Y = 200;
        const LANE_WIDTH = 70;
        const LANE_OFFSET = 0;

        // 3 làn đường với hiệu ứng phối cảnh
        const LANES = [
            { x: VANISH_X - LANE_WIDTH, scale: 0.6 },
            { x: VANISH_X, scale: 0.9 },
            { x: VANISH_X + LANE_WIDTH, scale: 0.6 }
        ];

        let gameOver = false;
        let score = 0;
        let coins = 0;
        let frame = 0;
        let speed = 4.0;
        const BASE_SPEED = 4.0;

        // Nhân vật (ở dưới cùng màn hình)
        const player = {
            lane: 1,        // 0: trái, 1: giữa, 2: phải
            targetX: VANISH_X,
            currentX: VANISH_X,
            y: GROUND_Y - PLAYER_H,
            w: PLAYER_W,
            h: PLAYER_H,
            vy: 0,
            gravity: 0.7,
            jumpPower: -13,
            isOnGround: true,
            sliding: false,
            slideTimer: 0,
            invincible: 0,
        };

        // Các vật thể trên đường
        let obstacles = [];
        let coinItems = [];
        let particles = [];
        let roadMarkers = [];

        // === KHỞI TẠO ===
        function resetGame() {
            gameOver = false;
            score = 0;
            coins = 0;
            frame = 0;
            speed = BASE_SPEED;
            obstacles = [];
            coinItems = [];
            particles = [];
            player.lane = 1;
            player.targetX = VANISH_X;
            player.currentX = VANISH_X;
            player.y = GROUND_Y - PLAYER_H;
            player.vy = 0;
            player.isOnGround = true;
            player.sliding = false;
            player.slideTimer = 0;
            player.invincible = 0;
            updateDisplay();
            initRoadMarkers();
        }

        function initRoadMarkers() {
            roadMarkers = [];
            for (let i = 0; i < 30; i++) {
                roadMarkers.push({
                    z: i * 30,
                    lane: i % 3,
                    offset: (i % 3 - 1) * 70,
                });
            }
        }

        function updateDisplay() {
            scoreSpan.textContent = Math.floor(score);
            coinSpan.textContent = coins;
        }

        // === TÍNH TOÁN PHỐI CẢNH ===
        function getProjectedPos(z, laneOffset) {
            // z: khoảng cách từ người chơi (0 = tại người chơi, càng lớn càng xa)
            const perspective = 1 / (1 + z / 1200);
            const x = VANISH_X + laneOffset * perspective;
            const y = VANISH_Y + (GROUND_Y - VANISH_Y) * perspective;
            const scale = perspective;
            return { x, y, scale };
        }

        // === SPAWN OBSTACLE ===
        function spawnObstacle() {
            const type = Math.floor(Math.random() * 3);
            const lane = Math.floor(Math.random() * 3);
            const laneOffset = (lane - 1) * LANE_WIDTH;
            const z = 300 + Math.random() * 400;
            let w, h, color;

            if (type === 0) { w = 30; h = 18; color = '#e67e22'; } // thấp - nhảy
            else if (type === 1) { w = 30; h = 32; color = '#8e44ad'; } // cao - trượt
            else { w = 18; h = 40; color = '#c0392b'; } // cột - né

            obstacles.push({
                z: z,
                lane: lane,
                laneOffset: laneOffset,
                w: w,
                h: h,
                type: type,
                color: color,
                passed: false,
                active: true
            });
        }

        // === SPAWN COINS ===
        function spawnCoins() {
            const count = 3 + Math.floor(Math.random() * 3);
            const lane = Math.floor(Math.random() * 3);
            const laneOffset = (lane - 1) * LANE_WIDTH;
            const startZ = 200 + Math.random() * 300;
            for (let i = 0; i < count; i++) {
                coinItems.push({
                    z: startZ + i * 35,
                    lane: lane,
                    laneOffset: laneOffset,
                    radius: 12,
                    collected: false,
                    bobOffset: Math.random() * Math.PI * 2
                });
            }
        }

        // === HIỆU ỨNG ===
        function addParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const vel = 2 + Math.random() * 4;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * vel,
                    vy: Math.sin(angle) * vel - 1,
                    life: 30 + Math.random() * 30,
                    maxLife: 60,
                    radius: 3 + Math.random() * 4,
                    color: color,
                });
            }
        }

        // === ĐIỀU KHIỂN ===
        function playerJump() {
            if (gameOver) return;
            if (player.isOnGround && !player.sliding) {
                player.vy = player.jumpPower;
                player.isOnGround = false;
                addParticles(player.currentX, GROUND_Y, '#d4a017', 6);
            }
        }

        function playerSlide() {
            if (gameOver) return;
            if (player.isOnGround && !player.sliding) {
                player.sliding = true;
                player.slideTimer = 18;
                player.h = PLAYER_H * 0.55;
                player.y = GROUND_Y - player.h;
            }
        }

        function moveLeft() {
            if (gameOver) return;
            if (player.lane > 0) {
                player.lane--;
                player.targetX = VANISH_X + (player.lane - 1) * LANE_WIDTH;
            }
        }

        function moveRight() {
            if (gameOver) return;
            if (player.lane < 2) {
                player.lane++;
                player.targetX = VANISH_X + (player.lane - 1) * LANE_WIDTH;
            }
        }

        // === CẬP NHẬT ===
        function update() {
            if (gameOver) return;

            frame++;
            speed = BASE_SPEED + Math.floor(score / 200) * 0.4;
            if (speed > 10) speed = 10;

            // Di chuyển ngang mượt
            const diff = player.targetX - player.currentX;
            if (Math.abs(diff) > 0.3) {
                player.currentX += Math.sign(diff) * Math.min(Math.abs(diff), 3.0);
            } else {
                player.currentX = player.targetX;
            }

            // Trọng lực
            if (!player.isOnGround) {
                player.vy += player.gravity;
                player.y += player.vy;
                if (player.y >= GROUND_Y - player.h) {
                    player.y = GROUND_Y - player.h;
                    player.vy = 0;
                    player.isOnGround = true;
                }
            }

            // Trượt
            if (player.sliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) {
                    player.sliding = false;
                    player.h = PLAYER_H;
                    player.y = GROUND_Y - player.h;
                }
            }

            if (player.invincible > 0) player.invincible--;

            // Spawn
            const spawnRate = Math.max(50 - Math.floor(score / 80), 25);
            if (frame % spawnRate === 0) {
                spawnObstacle();
                if (Math.random() < 0.25) spawnObstacle();
            }
            if (frame % 30 === 0 && Math.random() < 0.4) {
                spawnCoins();
            }

            // Cập nhật vật cản (dịch chuyển về phía người chơi)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const ob = obstacles[i];
                ob.z -= speed * 1.2;

                if (ob.z < -50) {
                    obstacles.splice(i, 1);
                    continue;
                }

                // Tính điểm
                if (!ob.passed && ob.z < 0) {
                    ob.passed = true;
                    score += 8;
                    updateDisplay();
                }

                // Va chạm (chỉ khi vật ở gần người chơi)
                if (player.invincible === 0 && Math.abs(ob.z) < 40) {
                    const proj = getProjectedPos(ob.z, ob.laneOffset);
                    const px = player.currentX - player.w/2 + 4;
                    const py = player.y + 4;
                    const pw = player.w - 8;
                    const ph = player.h - 8;

                    const ox = proj.x - ob.w/2 + 4;
                    const oy = proj.y - ob.h/2 + 4;
                    const ow = ob.w - 8;
                    const oh = ob.h - 8;

                    // Kiểm tra va chạm với tỉ lệ scale
                    const scale = proj.scale;
                    if (px < ox + ow * scale && px + pw > ox &&
                        py < oy + oh * scale && py + ph > oy) {
                        gameOver = true;
                        addParticles(player.currentX, player.y + player.h/2, '#e74c3c', 30);
                        return;
                    }
                }
            }

            // Cập nhật đồng xu
            for (let i = coinItems.length - 1; i >= 0; i--) {
                const coin = coinItems[i];
                coin.z -= speed * 1.2;
                coin.bobOffset += 0.05;

                if (coin.z < -30) {
                    coinItems.splice(i, 1);
                    continue;
                }

                if (!coin.collected && Math.abs(coin.z) < 30) {
                    const proj = getProjectedPos(coin.z, coin.laneOffset);
                    const dx = proj.x - player.currentX;
                    const dy = (proj.y + Math.sin(coin.bobOffset) * 4) - (player.y + player.h/2);
                    if (Math.abs(dx) < 35 && Math.abs(dy) < 35) {
                        coin.collected = true;
                        coins++;
                        updateDisplay();
                        addParticles(proj.x, proj.y, '#f1c40f', 15);
                        if (coins % 8 === 0) {
                            player.invincible = 100;
                            addParticles(player.currentX, player.y, '#00ff88', 25);
                        }
                        coinItems.splice(i, 1);
                    }
                }
            }

            // Cập nhật hạt
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Điểm thời gian
            if (frame % 3 === 0) {
                score += 0.5;
                updateDisplay();
            }
        }

        // === VẼ ===
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // === NỀN ===
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0a2a');
            grad.addColorStop(0.4, '#1a2a5a');
            grad.addColorStop(0.7, '#2a3a6a');
            grad.addColorStop(1, '#1a1a3a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // === VẼ ĐƯỜNG (PHỐI CẢNH) ===
            // Đường chạy (dạng đường hầm)
            for (let z = 0; z < 800; z += 8) {
                const p = getProjectedPos(z, 0);
                const width = 200 * p.scale;
                const alpha = 0.1 + 0.4 * p.scale;
                ctx.fillStyle = `rgba(60, 40, 30, ${alpha * 0.5})`;
                ctx.fillRect(p.x - width/2, p.y, width, 4);
            }

            // Vạch kẻ đường (3 làn)
            for (let lane = -1; lane <= 1; lane++) {
                for (let z = 0; z < 600; z += 40) {
                    const p = getProjectedPos(z, lane * LANE_WIDTH);
                    const width = 4 * p.scale;
                    const alpha = 0.3 + 0.5 * p.scale;
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                    ctx.fillRect(p.x - width/2, p.y, width, 6 * p.scale);
                }
            }

            // Đường viền
            for (let side = -1; side <= 1; side += 2) {
                for (let z = 0; z < 500; z += 15) {
                    const p = getProjectedPos(z, side * 130);
                    const width = 3 * p.scale;
                    const alpha = 0.2 + 0.4 * p.scale;
                    ctx.fillStyle = `rgba(200, 150, 100, ${alpha * 0.3})`;
                    ctx.fillRect(p.x - width/2, p.y, width, 6 * p.scale);
                }
            }

            // === VẼ ĐỒNG XU ===
            for (const coin of coinItems) {
                if (coin.collected) continue;
                const p = getProjectedPos(coin.z, coin.laneOffset);
                const r = coin.radius * p.scale;
                const y = p.y + Math.sin(coin.bobOffset) * 4 * p.scale;
                if (r < 2) continue;

                const grad2 = ctx.createRadialGradient(p.x - 2, y - 2, 1, p.x, y, r + 3);
                grad2.addColorStop(0, '#f1c40f');
                grad2.addColorStop(0.6, '#f39c12');
                grad2.addColorStop(1, '#d4a017');
                ctx.shadowColor = '#f1c40f66';
                ctx.shadowBlur = 15 * p.scale;
                ctx.beginPath();
                ctx.arc(p.x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#b8860b';
                ctx.font = `${Math.max(8, r)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('¢', p.x, y + 1);
            }

            // === VẼ VẬT CẢN ===
            for (const ob of obstacles) {
                const p = getProjectedPos(ob.z, ob.laneOffset);
                const scale = p.scale;
                if (scale < 0.05) continue;

                const w = ob.w * scale;
                const h = ob.h * scale;
                const x = p.x - w/2;
                const y = p.y - h/2;

                ctx.shadowColor = ob.color + '88';
                ctx.shadowBlur = 15 * scale;
                ctx.shadowOffsetY = 3 * scale;
                ctx.fillStyle = ob.color;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 3 * scale);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fillRect(x + w * 0.1, y + h * 0.1, w * 0.8, h * 0.15);
            }

            // === VẼ NHÂN VẬT (góc nhìn từ sau lưng) ===
            const px = player.currentX - player.w/2;
            const py = player.y;

            // Bóng đổ
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 8;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(player.currentX, GROUND_Y + 2, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Hiệu ứng bất tử
            if (player.invincible > 0 && Math.floor(frame / 6) % 2 === 0) {
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 40;
            }

            // Thân
            const grad3 = ctx.createLinearGradient(px, py, px + player.w, py + player.h);
            grad3.addColorStop(0, '#f39c12');
            grad3.addColorStop(0.5, '#e67e22');
            grad3.addColorStop(1, '#d35400');
            ctx.shadowColor = '#b85e0a88';
            ctx.shadowBlur = 16;
            ctx.shadowOffsetY = 4;
            ctx.fillStyle = grad3;
            ctx.beginPath();
            ctx.roundRect(px, py, player.w, player.h, 6);
            ctx.fill();

            // Đầu (nhìn từ sau)
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(px + player.w/2, py - 4, 13, 0, Math.PI * 2);
            ctx.fill();

            // Tóc (mũ)
            ctx.fillStyle = '#d35400';
            ctx.beginPath();
            ctx.arc(px + player.w/2 - 2, py - 10, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.arc(px + player.w/2 + 2, py - 10, 8, 0, Math.PI * 2);
            ctx.fill();

            // Khăn quàng bay
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#e74c3c';
            const flutter = Math.sin(frame * 0.1) * 3;
            ctx.fillRect(px - 4 + flutter, py + 6, player.w + 8, 5);
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(px - 6 + flutter * 1.5, py + 10, 6, 14);

            // Chân
            if (player.isOnGround && !player.sliding) {
                ctx.shadowBlur = 2;
                ctx.fillStyle = '#2c3e50';
                const step = Math.floor(frame / 5) % 2;
                ctx.fillRect(px + 2 + (step * 8), py + player.h - 4, 8, 4);
                ctx.fillRect(px + player.w - 10 - (step * 8), py + player.h - 4, 8, 4);
            }

            ctx.shadowBlur = 0;

            // === HIỆU ỨNG HẠT ===
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // === GAME OVER ===
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, W, H);
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#e74c3c';
                ctx.font = 'bold 64px Arial';
                ctx.fillStyle = '#f1c40f';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💀 GAME OVER', W/2, 190);
                ctx.shadowBlur = 0;
                ctx.font = '24px Arial';
                ctx.fillStyle = '#ecf0f1';
                ctx.fillText('Nhấn "Chạy lại" hoặc phím R', W/2, 260);
                ctx.font = '30px Arial';
                ctx.fillStyle = '#f1c40f';
                ctx.fillText(`Điểm: ${Math.floor(score)}`, W/2, 330);
                ctx.fillStyle = '#f39c12';
                ctx.fillText(`🪙 ${coins}`, W/2 + 200, 330);
            }

            // === UI ===
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '14px monospace';
            ctx.fillText(`⚡ ${speed.toFixed(1)}`, 16, 28);
            if (player.invincible > 0) {
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('🛡️ BẤT TỬ', 16, 52);
            }

            // Chỉ báo làn đường
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            for (let i = 0; i < 3; i++) {
                const x = 80 + i * 40;
                const y = H - 30;
                ctx.fillStyle = (i === player.lane) ? 'rgba(241, 196, 15, 0.4)' : 'rgba(255,255,255,0.1)';
                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = (i === player.lane) ? '#f1c40f' : 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Polyfill
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // === GAME LOOP ===
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // === SỰ KIỆN ===
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'r', 'R'].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowUp' || e.key === ' ') playerJump();
            else if (e.key === 'ArrowDown') playerSlide();
            else if (e.key === 'ArrowLeft') moveLeft();
            else if (e.key === 'ArrowRight') moveRight();
            else if (e.key === 'r' || e.key === 'R') resetGame();
        });

        document.getElementById('restartBtn').addEventListener('click', resetGame);

        canvas.addEventListener('click', (e) => {
            if (gameOver) { resetGame(); return; }
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * W;
            if (x < W/3) moveLeft();
            else if (x > W*2/3) moveRight();
            else playerJump();
        });

        // Touch support
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartX = (touch.clientX - rect.left) / rect.width * W;
            touchStartY = (touch.clientY - rect.top) / rect.height * H;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameOver) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = (touch.clientX - rect.left) / rect.width * W;
            const y = (touch.clientY - rect.top) / rect.height * H;
            const dx = x - touchStartX;
            const dy = y - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight();
                else if (dx < -30) moveLeft();
            } else {
                if (dy < -30) playerJump();
                else if (dy > 30) playerSlide();
            }
            touchStartX = x;
            touchStartY = y;
        });

        // === BẮT ĐẦU ===
        resetGame();
        gameLoop();
        console.log('🏃 Temple Run - Góc nhìn thứ nhất 2D (giả 3D)');
        console.log('⬆️ Nhảy | ⬇️ Trượt | ⬅️➡️ Đổi làn | Thu thập xu để bất tử!');
    })();
</script>
