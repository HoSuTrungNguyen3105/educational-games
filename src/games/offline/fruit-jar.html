<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><script id="gq-kit">/* gq-kit.js — Bộ nâng cấp dùng chung cho game dọc:
   · Màn chọn độ khó 4 mức (Dễ / Trung bình / Khó / Siêu khó) — cùng một giao diện cho mọi game
   · Độ khó thật: nhịp game (setTimeout/setInterval/rAF/performance.now/Date.now) co giãn theo mức,
     điểm & XP nhân hệ số (game dạng "single"), số mạng / giây mỗi câu / màn khởi đầu (mcengine)
   · Pháo hoa khi kết thúc ván, nút "Change difficulty", nhãn độ khó luôn hiện trên đầu màn hình
   MODE được build thay: 'single' (game sinh từ shell) hoặc 'standalone' (game viết tay). */
(() => {
  if (window.GQ) return;
  const MODE = 'standalone';
  const TIERS = [
    { k: 'easy',   n: 'Easy',         e: '🌱', c: '#22b573', s: .75, m: 1,   lives: 5, secs: 35, lvl0: 1, d: 'Slow, extra lives — take it easy' },
    { k: 'mid',    n: 'Normal', e: '🔥', c: '#f4b942', s: 1,   m: 1.5, lives: 3, secs: 25, lvl0: 1, d: 'Balanced pace' },
    { k: 'hard',   n: 'Hard',        e: '⚡', c: '#e4572e', s: 1.3, m: 2,   lives: 3, secs: 18, lvl0: 2, d: 'Faster, less thinking time' },
    { k: 'insane', n: 'Insane',   e: '💀', c: '#8b5cf6', s: 1.7, m: 3,   lives: 2, secs: 12, lvl0: 3, d: 'Very fast, no room for mistakes' },
  ];
  const G = { t: TIERS[1], i: 1, locked: MODE === 'standalone', q: [] };

  /* ---- Co giãn thời gian theo độ khó ---- */
  const oT = window.setTimeout.bind(window), oC = window.clearTimeout.bind(window);
  const oR = window.requestAnimationFrame.bind(window), oP = performance.now.bind(performance), oD = Date.now;
  const cp = { o: 0 }, cd = { o: 0 };
  const sc = (raw, c) => raw * G.t.s + c.o;
  function setTier(i) {
    const r = oP(), d = oD(), a = sc(r, cp), b = sc(d, cd);
    G.i = i; G.t = TIERS[i];
    cp.o = a - r * G.t.s; cd.o = b - d * G.t.s;
  }
  performance.now = () => sc(oP(), cp);
  Date.now = () => sc(oD(), cd);
  window.requestAnimationFrame = cb => {
    if (G.locked) { G.q.push(cb); return 0; }
    return oR(ts => cb(sc(ts, cp)));
  };
  window.setTimeout = (f, ms, ...a) => typeof f === 'function' ? oT(f, (ms || 0) / G.t.s, ...a) : oT(f, ms);
  const IV = {}; let ivn = 1e9;
  window.setInterval = (f, ms, ...a) => {
    if (typeof f !== 'function') return 0;
    const id = ++ivn, run = () => { IV[id] = oT(() => { if (!(id in IV)) return; if (!G.locked) f(...a); if (id in IV) run(); }, Math.max(0, (ms || 0) / G.t.s)); };
    IV[id] = 0; run(); return id;
  };
  const oCI = window.clearInterval.bind(window);
  window.clearInterval = id => { if (id > 1e9) { oC(IV[id]); delete IV[id]; } else oCI(id); };

  window.GQ = {
    tiers: TIERS, set: setTier,
    get tier() { return G.t; }, get idx() { return G.i; },
    get s() { return G.t.s; }, get m() { return G.t.m; },
    get lives() { return G.t.lives; }, get secs() { return G.t.secs; }, get lvl0() { return G.t.lvl0; },
  };

  /* ---- Tiện ích ---- */
  const $el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
  const KEY = 'gq_diff:' + (location.pathname.split('/').pop() || 'game');
  const quit = () => {
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'quit', data: {} }, '*'); return; } } catch (e) { /* ignore */ }
    try { location.href = '/'; } catch (e) { /* ignore */ }
  };
  let actx;
  const tone = (f) => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = 'triangle'; g.gain.value = .06; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .15); o.stop(actx.currentTime + .15); } catch (e) { /* ignore */ } };

  function pill() {
    let p = document.querySelector('.gq-tier');
    if (!p) { p = $el('<div class="gq-tier"></div>'); document.body.appendChild(p); }
    p.textContent = G.t.e + ' ' + G.t.n; p.style.setProperty('--c', G.t.c);
  }

  /* ---- Màn chọn độ khó (giống hệt nhau ở mọi game) ---- */
  function pick(meta, go) {
    let last = 1;
    try { const v = +localStorage.getItem(KEY); if (v >= 0 && v < 4) last = v; } catch (e) { /* ignore */ }
    const chip = t => MODE === 'single' ? `×${t.m} points` : `speed ×${t.s}`;
    const box = $el(`<div id="gqp"><button class="gqp-x" aria-label="Exit">←</button>
      <div class="gqp-box"><div class="gqp-ic">${meta.icon || '🎮'}</div><h1>${meta.name}</h1>
      <p>Pick a difficulty to start</p>
      <div class="gqp-list">${TIERS.map((t, i) => `<button class="gqd${i === last ? ' last' : ''}" data-i="${i}" style="--c:${t.c}">
        <i>${t.e}</i><span><b>${t.n}</b><em>${t.d}</em></span><u>${chip(t)}</u></button>`).join('')}</div>
      <small>Higher difficulty, faster pace — bigger rewards 🏆</small></div></div>`);
    box.querySelector('.gqp-x').onclick = quit;
    box.querySelector('.gqp-list').onclick = e => {
      const b = e.target.closest('.gqd'); if (!b) return;
      const i = +b.dataset.i; tone(380 + i * 120);
      try { localStorage.setItem(KEY, i); } catch (er) { /* ignore */ }
      setTier(i); box.remove(); pill();
      if (G.locked) { G.locked = false; G.q.splice(0).forEach(cb => window.requestAnimationFrame(cb)); }
      go && go();
    };
    document.body.appendChild(box);
    setTimeout(() => { try { box.querySelector('.last').focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
  }

  /* ---- Pháo hoa ---- */
  function boom() {
    const em = ['🎉', '⭐', '✨', '🎊', '🍓', '💫'];
    for (let i = 0; i < 34; i++) {
      const s = $el(`<span class="gq-conf">${em[i % em.length]}</span>`);
      s.style.cssText = `left:${Math.random() * 100}vw;--dx:${(Math.random() * 160 - 80) | 0}px;animation-delay:${(Math.random() * .5).toFixed(2)}s;font-size:${16 + (Math.random() * 18 | 0)}px`;
      document.body.appendChild(s); oT(() => s.remove(), 2800);
    }
  }

  /* ---- Gắn vào game ---- */
  if (MODE === 'single') {
    const o = window.startSingleGame, f = window.finish;
    window.startSingleGame = cfg => {
      const go = () => { o(cfg); pill(); };
      if (document.body) pick({ name: cfg.name, icon: cfg.icon }, go);
      else document.addEventListener('DOMContentLoaded', () => pick({ name: cfg.name, icon: cfg.icon }, go));
    };
    window.finish = function (opt) {
      const t = G.t, m = t.m;
      const r = f.call(this, Object.assign({}, opt, {
        score: Math.round((opt.score || 0) * m), xp: Math.round((opt.xp || 0) * m),
        lines: [`${t.e} ${t.n} ×${m}`].concat(opt.lines || []),
      }));
      boom();
      const row = document.querySelector('#modal .row');
      if (row) { const b = $el('<button class="btn alt ghost" id="gq-chg">🎚️ Change difficulty</button>'); b.onclick = () => location.reload(); row.appendChild(b); }
      return r;
    };
  } else {
    const start = () => {
      const t = (document.title || 'Game').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
      const ic = (document.title.match(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/u) || ['🎮'])[0];
      document.documentElement.classList.add('gq-sa');
      pick({ name: t, icon: ic });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  }
})();
</script>

<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="box"><small>Score</small><b id="score">0</b></div>
  <div class="box next"><small>Next</small><span id="next"></span></div>

</div>

  <div id="evo" aria-label="Fruit evolution order"></div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

const FR = [
  { e: '🫐', c: '#a9b8ff', p: 'Blueberry' }, { e: '🍓', c: '#ff9aab' }, { e: '🍇', c: '#c9a8f5' },
  { e: '🍊', c: '#ffbd7a' }, { e: '🍎', c: '#ff8585' }, { e: '🍐', c: '#dcef8d' },
  { e: '🍑', c: '#ffc9b0' }, { e: '🍍', c: '#ffe680' }, { e: '🍈', c: '#c4f0a0' }, { e: '🍉', c: '#7edc98' }
];
const RF = [0.045, 0.058, 0.072, 0.087, 0.102, 0.12, 0.14, 0.16, 0.185, 0.21];
const SC = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880];
const TIPS = ['Look far away for 20 seconds to rest your eyes.', 'Take a sip of water.', 'Stretch your arms up high.',
  'Great job! Rest your hands for a moment, then play again.', 'Breathe in deeply, then breathe out slowly.'];

/* ---- sound ---- */
let ac = null, soundOn = true;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function note(f, d = 0.9, v = 0.13, type = 'sine') {
  if (!ac || !soundOn) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
}
$('snd').onclick = e => { initAudio(); soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔇'; };

/* ---- layout ---- */
let W, H, DPR, L, R, TOP, B, JW, JH, S = 0, DANGER;
const bodies = [], parts = [], floats = [];
const rad = l => JW * RF[l];
function layout() {
  const oL = L, oB = B, oS = S;
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  JW = Math.min(W - 24, 420);
  B = H - 84 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0);
  JH = Math.min(JW * 1.5, B - 135);
  TOP = B - JH; L = (W - JW) / 2; R = L + JW; S = JW / 360; DANGER = TOP + JH * 0.13;
  if (oS && bodies.length) {
    const k = S / oS;
    bodies.forEach(b => { b.x = L + (b.x - oL) * k; b.y = B - (oB - b.y) * k; b.r = rad(b.l); b.vx *= k; b.vy *= k; });
  }
}

/* ---- state ---- */
const SKEY = 'hu-trai-cay-v1';
const loadBest = () => { try { const o = JSON.parse(localStorage.getItem(SKEY)); return (o && o.best) || 0; } catch (e) { return 0; } };
const saveBest = v => { try { localStorage.setItem(SKEY, JSON.stringify({ best: v })); } catch (e) {} };
let score = 0, best = loadBest(), nextL = 0, cd = 0, aimX = 0, over = false, dangerT = 0, shakeCd = 0, dropped = 0, curL = 0;
function randLevel() { return pick([0, 0, 0, 1, 1, 2, 3]); }
function setNext() {
  const n = $('next'); n.textContent = FR[nextL].e; n.style.background = FR[nextL].c;
}
function reset() {
  bodies.length = 0; parts.length = 0; floats.length = 0;
  score = 0; over = false; dangerT = 0; cd = 0.3; dropped = 0;
  curL = randLevel(); nextL = randLevel(); setNext();
  $('score').textContent = 0; $('over').classList.remove('show'); aimX = W / 2;
}
function addScore(n) {
  score += n; $('score').textContent = score;
  if (score > best) { best = score; $('best').textContent = best; saveBest(best); }
}
function showPop(t) {
  const p = $('pop'); p.textContent = t; p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
  clearTimeout(showPop.t); showPop.t = setTimeout(() => p.classList.remove('show'), 1200);
}

/* ---- drop fruit ---- */
function drop() {
  if (over || cd > 0) return;
  const r = rad(curL);
  const x = Math.max(L + r, Math.min(R - r, aimX));
  bodies.push({ x, y: TOP - r - 6, vx: 0, vy: 160 * S, l: curL, r, landed: false, age: 0, pop: 0, dead: false });
  note(SC[curL] / 2, 0.35, 0.08, 'triangle');
  curL = nextL; nextL = randLevel(); setNext();
  cd = 0.55;
  if (++dropped === 3) $('hint').classList.add('hide');
}

/* ---- physics ---- */
const G = 1500;
function collide(a, b, merges) {
  const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
  if (Math.abs(dx) > min || Math.abs(dy) > min) return;
  const d = Math.hypot(dx, dy);
  if (d >= min || d < 1e-4) return;
  const nx = dx / d, ny = dy / d, ov = min - d;
  const ma = a.r * a.r, mb = b.r * b.r, tm = ma + mb;
  a.x -= nx * ov * mb / tm; a.y -= ny * ov * mb / tm;
  b.x += nx * ov * ma / tm; b.y += ny * ov * ma / tm;
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv < 0) {
    const inv = 1 / ma + 1 / mb, j = -(1.08) * rv / inv;
    a.vx -= j * nx / ma; a.vy -= j * ny / ma; b.vx += j * nx / mb; b.vy += j * ny / mb;
    const tx = -ny, ty = nx, vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty, jt = -vt * 0.12 / inv;
    a.vx -= jt * tx / ma; a.vy -= jt * ty / ma; b.vx += jt * tx / mb; b.vy += jt * ty / mb;
  }
  a.landed = b.landed = true;
  if (a.l === b.l && !a.dead && !b.dead) merges.push([a, b]);
}
function step(dt) {
  const sub = 4, h = dt / sub, merges = [], g = G * S;
  for (let s = 0; s < sub; s++) {
    for (const b of bodies) {
      b.vy += g * h; b.x += b.vx * h; b.y += b.vy * h; b.vx *= 0.9994; b.vy *= 0.9994;
      if (b.x - b.r < L) { b.x = L + b.r; if (b.vx < 0) b.vx *= -0.15; b.landed = true; }
      if (b.x + b.r > R) { b.x = R - b.r; if (b.vx > 0) b.vx *= -0.15; b.landed = true; }
      if (b.y + b.r > B) { b.y = B - b.r; if (b.vy > 0) b.vy *= -0.1; b.vx *= 0.985; b.landed = true; }
    }
    for (let it = 0; it < 2; it++)
      for (let i = 0; i < bodies.length; i++)
        for (let j = i + 1; j < bodies.length; j++) collide(bodies[i], bodies[j], merges);
  }
  for (const [a, b] of merges) {
    if (a.dead || b.dead) continue;
    a.dead = b.dead = true;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (a.l === FR.length - 1) {
      addScore(500); showPop('Mega watermelon! +500');
      note(SC[9], 1.6, 0.16); note(SC[7], 1.6, 0.12); note(SC[5], 1.6, 0.1);
      burst(mx, my, FR[9].c, 26); floats.push({ x: mx, y: my, t: '+500', life: 1.2 });
    } else {
      const nl = a.l + 1, pts = (nl) * 10;
      bodies.push({ x: mx, y: my, vx: (a.vx + b.vx) / 2, vy: (a.vy + b.vy) / 2, l: nl, r: rad(nl), landed: true, age: 1, pop: 1, dead: false });
      addScore(pts); burst(mx, my, FR[nl].c, 10); floats.push({ x: mx, y: my, t: '+' + pts, life: 1 });
      note(SC[nl], 1.0, 0.14); if (nl >= 5) note(SC[nl - 2], 1.2, 0.08);
      if (nl === 9) showPop('Watermelon! 🍉');
    }
  }
  for (let i = bodies.length - 1; i >= 0; i--) if (bodies[i].dead) bodies.splice(i, 1);
}
function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), v = rand(60, 220) * S;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 1, c, r: rand(2, 5) });
  }
}

/* ---- update ---- */
let shakeTxt = '';
function update(dt) {
  if (cd > 0) cd -= dt;
  if (shakeCd > 0) {
    shakeCd -= dt;
    const t = shakeCd > 0 ? 'Shake jar ' + Math.ceil(shakeCd) : 'Shake jar';
    if (t !== shakeTxt) { $('shake').textContent = t; $('shake').disabled = shakeCd > 0; shakeTxt = t; }
  }
  if (!over) {
    step(dt);
    let danger = false;
    for (const b of bodies) {
      b.age += dt; if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 4);
      if (b.landed && b.age > 0.9 && b.y - b.r < DANGER && Math.hypot(b.vx, b.vy) < 30 * S) danger = true;
    }
    dangerT = danger ? dangerT + dt : Math.max(0, dangerT - dt * 2);
    if (dangerT > 2.6) endGame();
  }
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * S * dt; p.life -= dt * 1.7; });
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  floats.forEach(f => { f.y -= 40 * dt; f.life -= dt * 1.2; });
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].life <= 0) floats.splice(i, 1);
}
function endGame() {
  over = true; $('finalScore').textContent = score + ' points'; $('tip').textContent = pick(TIPS);
  $('over').classList.add('show'); note(SC[2], 1.5, 0.1); note(SC[0], 2, 0.1);
}

/* ---- draw ---- */
function drawFruit(x, y, l, r, scale = 1, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.35, FR[l].c); g.addColorStop(1, FR[l].c);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = `${r * 1.35}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(FR[l].e, 0, r * 0.06);
  ctx.restore();
}
function jarPath() {
  const rr = 14;
  ctx.beginPath(); ctx.moveTo(L, TOP); ctx.lineTo(L, B - rr); ctx.arcTo(L, B, L + rr, B, rr);
  ctx.lineTo(R - rr, B); ctx.arcTo(R, B, R, B - rr, rr); ctx.lineTo(R, TOP);
}
let T = 0;
function draw() {
  ctx.clearRect(0, 0, W, H);
  // back glass
  jarPath(); ctx.lineTo(L, TOP); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  // warning line
  const warn = dangerT > 0;
  ctx.save(); ctx.setLineDash([10, 9]); ctx.lineWidth = 3;
  ctx.strokeStyle = warn ? `rgba(255,107,143,${0.5 + 0.5 * Math.sin(T * 10)})` : 'rgba(58,47,91,.18)';
  ctx.beginPath(); ctx.moveTo(L + 6, DANGER); ctx.lineTo(R - 6, DANGER); ctx.stroke(); ctx.restore();
  // aim line and held fruit
  if (!over) {
    const r = rad(curL), x = Math.max(L + r, Math.min(R - r, aimX));
    if (cd <= 0) {
      ctx.save(); ctx.setLineDash([3, 9]); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(58,47,91,.28)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, TOP - 6); ctx.lineTo(x, B); ctx.stroke(); ctx.restore();
    }
    drawFruit(x, TOP - r - 6, curL, r, 1, cd > 0 ? Math.max(0, 1 - cd / 0.55) : 1);
  }
  bodies.forEach(b => drawFruit(b.x, b.y, b.l, b.r, 1 + 0.2 * b.pop));
  // front glass rim
  jarPath(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 6; ctx.stroke();
  ctx.strokeStyle = 'rgba(183,156,245,.55)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(L + 14, TOP + 30); ctx.lineTo(L + 14, TOP + JH * 0.45); ctx.stroke();
  // particles
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life + .5, 0, 6.283); ctx.fill(); });
  ctx.globalAlpha = 1;
  ctx.font = '800 22px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  floats.forEach(f => {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life)); ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(f.t, f.x, f.y);
    ctx.fillStyle = '#ff6b8f'; ctx.fillText(f.t, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

/* ---- controls ---- */
const setAim = e => { aimX = e.clientX; };
cv.addEventListener('pointerdown', e => { initAudio(); setAim(e); });
cv.addEventListener('pointermove', setAim);
cv.addEventListener('pointerup', e => { setAim(e); drop(); });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') aimX -= 24; if (e.key === 'ArrowRight') aimX += 24;
  if (e.key === ' ') { e.preventDefault(); drop(); }
});
$('shake').onclick = () => {
  initAudio(); if (over || shakeCd > 0) return;
  bodies.forEach(b => { b.vy = -rand(220, 460) * S; b.vx = rand(-140, 140) * S; b.landed = false; b.age = 0; });
  note(SC[4], 0.5, 0.08, 'triangle'); shakeCd = 5;
};
$('again').onclick = () => { initAudio(); reset(); };
window.addEventListener('resize', layout);

/* evolution bar */
$('evo').innerHTML = FR.map((f, i) => `<i>${f.e}</i>${i < FR.length - 1 ? '<u>›</u>' : ''}`).join('');

layout(); reset();
let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; T += dt;
  update(dt); draw(); requestAnimationFrame(loop);
})(last);
})();
</script>

<button id="homeBackBtn" type="button" aria-label="Back to home" title="Back to home">
  <span aria-hidden="true">&#8592;</span>
</button>
<script>
  // Shared button for all offline games: post a message to React (OfflineGamePage)
  // to return home. When opening the .html file directly it navigates itself.
  (function () {
    var btn = document.getElementById("homeBackBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "quit", data: {} }, "*");
          return;
        }
      } catch (e) { /* fall back to self-navigation */ }
      try { window.location.href = "/"; } catch (e) { /* ignore */ }
    });
  })();
</script>
