<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Góc Giải Trí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    /* ============================================================================
   tokens.css — NGUỒN SỰ THẬT DUY NHẤT về màu + font của game offline.
   Được nạp 2 nơi:
     · scripts/build-offline-games.mjs chèn vào <style> của lib/shell.html
       → 17 game sinh tự động dùng đúng biến này.
     · OfflineGamePage.jsx đọc bằng ?raw rồi tiêm vào <head> của MỌI game
       (kể cả game viết tay) → chạy trong app là cùng một bộ màu/font.
   Vì vậy file này CHỈ được chứa: biến :root, class .gq-*, và #homeBackBtn.
   Không viết selector trần (body, h1, .btn…) — tiêm vào game viết tay sẽ đè
   lên nền/tông màu riêng của chúng và làm hỏng theme.
   ========================================================================== */

:root {
  /* Bảng màu lấy từ ứng dụng (index.html + src/index.css) để game không lệch
     khỏi phần còn lại của trang khi nằm trong khung iframe. */
  --ink: #1d2e4a;
  --ink2: #16233a;
  --paper: #fff6e7;
  --card: #fffbf2;
  --bg: #fff3de;
  --stage: #fff6e7;
  --line: #e6dcc4;
  --sun: #f4b942;
  --gold: #f4b942;
  --tomato: #e4572e;
  --ticket: #e4572e;
  --mint: #1b998b;
  --teal: #1b998b;
  --accent: #1b998b;
  --onaccent: #ffffff;
  --sky: #4b9dff;
  --lilac: #8b5cf6;
  --purple: #8b5cf6;
  --pink: #ff6f91;
  --ok: #22b573;
  --bad: #f0483e;
  --shadow: 4px 4px 0 var(--ink);

  /* Font: Baloo 2 có weight 800 (shell + đa số game viết tay đang dùng),
     Be Vietnam Pro cho chữ thường — thống nhất toàn bộ thư mục offline. */
  --head: "Baloo 2", "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}

/* Nút "về trang chủ" mà mọi game tự đặt ở góc trên-trái. Trong app thì React
   đã vẽ nút riêng nên CSS .gq-embedded ẩn cái này đi (xem OfflineGamePage). */
.gq-home-btn,
#homeBackBtn {
  position: fixed;
  z-index: 2147483000;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-family: var(--head);
  font-size: 20px;
  font-weight: 800;
  line-height: 1;
  color: var(--ink);
  background: var(--card);
  border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink), 0 8px 14px rgba(0, 0, 0, .22);
  transition: transform .12s, box-shadow .12s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.gq-home-btn:hover,
#homeBackBtn:hover {
  filter: brightness(1.06);
}

.gq-home-btn:active,
#homeBackBtn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink), 0 3px 6px rgba(0, 0, 0, .22);
}

.gq-home-btn:focus-visible,
#homeBackBtn:focus-visible {
  outline: 3px solid var(--sky);
  outline-offset: 2px;
}

/* HUD / panel / toast dùng chung cho game viết tay chưa có style riêng. */
.gq-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  padding: 5px 12px;
  font-family: var(--body);
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
}

.gq-panel {
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: 22px;
  padding: 20px;
  box-shadow: var(--shadow);
  color: var(--ink);
  font-family: var(--body);
}

.gq-btn {
  font-family: var(--head);
  font-weight: 800;
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 12px 20px;
  font-size: 16px;
  color: var(--ink);
  background: var(--sun);
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  transition: transform .1s, box-shadow .1s;
}

.gq-btn:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}

.gq-btn.alt {
  background: var(--card);
}

/* Nút "chơi lại" của game nằm cùng góc với nút của app → game nào tự đặt
   #back thì dời xuống dưới --gq-topbar (56px) để không đè lên nhau. */
:root {
  --gq-topbar: 56px;
  --gq-home-offset: calc(var(--gq-topbar) + 8px);
}

@media (prefers-reduced-motion:reduce) {

  .gq-home-btn,
  #homeBackBtn,
  .gq-btn {
    transition: none;
  }
}

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: var(--body);
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 28px 28px;
      min-height: 100vh;
    }

    #app {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 60px
    }

    button {
      font-family: inherit;
      color: inherit;
      cursor: pointer
    }

    h1,
    h2,
    h3 {
      font-family: var(--head);
      margin: 0;
      line-height: 1.1
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .logo {
      font-family: var(--head);
      font-weight: 800;
      font-size: 30px;
      letter-spacing: -.5px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .logo i {
      font-style: normal;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(-6deg)
    }

    .me {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .lvl {
      font-family: var(--head);
      font-weight: 800;
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 17px
    }

    .xp {
      width: 130px;
      height: 16px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--card);
      overflow: hidden
    }

    .xp i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--mint);
      transition: width .6s cubic-bezier(.2, .9, .3, 1.2)
    }

    .snd {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 3px solid var(--ink);
      background: var(--card);
      font-size: 18px
    }

    .hero {
      display: flex;
      gap: 18px;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      margin: 6px 0 20px
    }

    .hero h2 {
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 800;
      letter-spacing: -1px;
      max-width: 14ch
    }

    .hero p {
      margin: 0;
      max-width: 34ch;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink2)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px
    }

    .tile {
      text-align: left;
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 190px;
      position: relative;
      transition: transform .12s, box-shadow .12s;
      background: var(--card)
    }

    .tile:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--ink)
    }

    .tile:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink)
    }

    .tile .ic {
      font-size: 44px;
      line-height: 1
    }

    .tile h3 {
      font-size: 26px;
      font-weight: 800
    }

    .tile p {
      margin: 0;
      font-size: 14px;
      line-height: 1.45
    }

    .tile .meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700
    }

    .tag {
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 3px 11px;
      font-size: 12px;
      font-weight: 700
    }

    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 26px;
      align-items: center
    }

    .badges b {
      font-family: var(--head);
      font-size: 20px;
      margin-right: 4px
    }

    .bd {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 700;
      background: var(--card)
    }

    .bd.off {
      opacity: .38;
      filter: grayscale(1);
      border-style: dashed
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px
    }

    .back {
      border: 3px solid var(--ink);
      background: var(--card);
      border-radius: 14px;
      padding: 8px 14px;
      font-weight: 700;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .bar h2 {
      font-size: 28px;
      font-weight: 800
    }

    .stage {
      max-width: 640px;
      margin: 0 auto
    }

    .panel {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow)
    }

    .center {
      text-align: center
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 14px
    }

    .btn {
      border: 3px solid var(--ink);
      background: var(--sun);
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .1s, box-shadow .1s
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--ink)
    }

    .btn.alt,
    .btn.ghost {
      background: var(--card)
    }

    .btn.sky {
      background: var(--sky);
      color: #fff
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 16px
    }

    .hud span {
      background: var(--card);
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      padding: 5px 12px
    }

    .tbar {
      height: 14px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--card);
      overflow: hidden;
      margin-bottom: 14px
    }

    .tbar i {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--tomato);
      transition: width .1s linear
    }

    .qbox {
      background: var(--ink);
      color: #fff;
      border-radius: 20px;
      padding: 22px 16px;
      text-align: center;
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(34px, 9vw, 56px);
      margin-bottom: 14px;
      min-height: 96px;
      display: grid;
      place-items: center
    }

    .qbox.txt {
      font-size: clamp(20px, 4.6vw, 26px);
      font-weight: 600;
      line-height: 1.3;
      font-family: var(--body);
      text-align: left;
      place-items: center start;
      padding: 18px
    }

    .qbox small {
      display: block;
      font-size: 14px;
      font-weight: 500;
      opacity: .75;
      margin-top: 4px;
      font-family: var(--body)
    }

    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .opts.one {
      grid-template-columns: 1fr
    }

    .opt {
      border: 3px solid var(--ink);
      background: var(--card);
      border-radius: 16px;
      padding: 16px 10px;
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(22px, 5vw, 30px);
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .1s, background .15s
    }

    .opts.one .opt {
      font-family: var(--body);
      font-weight: 600;
      font-size: 17px;
      text-align: left;
      padding: 14px 16px
    }

    .opt:active {
      transform: translate(3px, 3px)
    }

    .opt.ok {
      background: var(--ok);
      color: #fff
    }

    .opt.bad {
      background: var(--bad);
      color: #fff;
      animation: shake .3s
    }

    .opt.gone {
      opacity: .25;
      pointer-events: none
    }

    @keyframes shake {
      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    .explain {
      margin-top: 14px;
      background: var(--bg);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.5
    }

    .pop {
      animation: pop .35s
    }

    @keyframes pop {
      0% {
        transform: scale(.8)
      }

      60% {
        transform: scale(1.08)
      }

      100% {
        transform: scale(1)
      }
    }

    .mem {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px
    }

    .mc {
      perspective: 700px;
      aspect-ratio: 1/1.05;
      border: 0;
      background: none;
      padding: 0
    }

    .mc .in {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .35s
    }

    .mc.flip .in {
      transform: rotateY(180deg)
    }

    .mc .f,
    .mc .b {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 3px solid var(--ink);
      border-radius: 14px;
      display: grid;
      place-items: center;
      padding: 4px;
      text-align: center
    }

    .mc .f {
      background: var(--lilac);
      font-size: 28px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .mc .b {
      transform: rotateY(180deg);
      font-family: var(--head);
      font-weight: 800;
      font-size: clamp(14px, 3.6vw, 20px);
      line-height: 1.1;
      word-break: break-word
    }

    .mc .b.en {
      background: #cfe4ff
    }

    .mc .b.vi {
      background: #c6f3e6
    }

    .mc.done .b {
      background: var(--ok);
      color: #fff
    }

    .slots {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 6px 0 18px
    }

    .slot {
      width: 46px;
      height: 56px;
      border: 3px dashed var(--ink);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: var(--head);
      font-weight: 800;
      font-size: 28px;
      background: var(--card);
      padding: 0
    }

    .slot.fill {
      border-style: solid;
      background: var(--sun);
      box-shadow: 2px 2px 0 var(--ink)
    }

    .slots.win .slot {
      background: var(--ok);
      color: #fff
    }

    .slots.err {
      animation: shake .35s
    }

    .tiles {
      display: flex;
      gap: 9px;
      justify-content: center;
      flex-wrap: wrap
    }

    .tl {
      width: 52px;
      height: 58px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--card);
      font-family: var(--head);
      font-weight: 800;
      font-size: 28px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .tl:disabled {
      opacity: .2;
      box-shadow: none
    }

    canvas {
      display: block;
      margin: 0 auto;
      border: 3px solid var(--ink);
      border-radius: 16px;
      touch-action: none;
      background: var(--card);
      max-width: 100%
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
      justify-content: center;
      margin-top: 14px
    }

    .dpad button {
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      font-size: 22px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .dpad button:active {
      transform: translate(2px, 2px)
    }

    .dpad .u {
      grid-column: 2
    }

    .dpad .l {
      grid-row: 2;
      grid-column: 1
    }

    .dpad .d {
      grid-row: 2;
      grid-column: 2
    }

    .dpad .r {
      grid-row: 2;
      grid-column: 3
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--ink2);
      margin: 10px 0 0
    }

    #modal {
      position: fixed;
      inset: 0;
      background: rgba(29, 46, 74, .6);
      display: none;
      place-items: center;
      padding: 18px;
      z-index: 20
    }

    #modal.on {
      display: grid
    }

    .result {
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: pop .4s
    }

    .result h2 {
      font-size: 34px;
      font-weight: 800
    }

    .big {
      font-family: var(--head);
      font-weight: 800;
      font-size: 64px;
      line-height: 1;
      margin: 8px 0
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .stats span {
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 700;
      font-size: 14px
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 120px);
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 700;
      z-index: 30;
      transition: transform .4s;
      max-width: 90vw;
      text-align: center
    }

    #toast.on {
      transform: translate(-50%, 0)
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    button:focus-visible {
      outline: 4px solid var(--sky);
      outline-offset: 2px
    }

    /* ============================================================
       CHẾ ĐỘ 1 GAME (body.single)
       File offline chỉ chơi 1 game, không có sảnh. Thanh `.top`
       (logo + cấp + XP + âm thanh) là header của SẢNH nên thừa —
       nó chiếm ~80px và đẩy game xuống, buộc người chơi phải cuộn.
       Ẩn đi và nới lỏng padding để game nằm sát mép trên, vào là chơi.
       ============================================================ */
    body.single .top {
      display: none
    }

    body.single #app {
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px))
    }

    /* Thanh tiêu đề còn lại (nút "Về sảnh" + tên game) gọn lại */
    body.single .bar {
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: nowrap
    }

    body.single .bar h2 {
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    body.single .back {
      padding: 6px 11px;
      font-size: 14px;
      white-space: nowrap;
      flex: none
    }

    /* Bỏ khoảng trắng cuối trang: #app có padding-bottom 60px dư thừa */
    body.single .badges,
    body.single .hint {
      margin-top: 8px
    }

    /* Màn hình thấp (mobile ngang / desktop nhỏ): bỏ bớt khoảng đệm dọc
       để phần lớn game vừa 1 màn hình, không phải cuộn xuống. */
    @media (max-height: 720px) {
      body.single .qbox {
        min-height: 64px;
        margin-bottom: 10px;
        padding: 14px 12px;
        font-size: clamp(26px, 7vw, 42px)
      }

      body.single .opt {
        padding: 11px 8px;

    <!-- core.js: tiện ích, tiến độ localStorage, âm thanh, bộ đếm, canvas -->
    <script>
/* ============ Tiện ích ============ */
const $ = s => document.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const shuffle = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ============ Trạng thái người chơi (lưu localStorage) ============ */
const S = {
  xp: 0, games: 0, best: {}, flags: {},
  played: new Set(), unlocked: new Set()
};
const XP_PER_LVL = 120;
const lvl = () => Math.floor(S.xp / XP_PER_LVL) + 1;

/* ============ localStorage persistence ============ */
let _storageKey = '';

function _saveState() {
  if (!_storageKey) return;
  try {
    const data = {
      xp: S.xp, games: S.games, best: S.best, flags: S.flags,
      played: [...S.played], unlocked: [...S.unlocked]
    };
    localStorage.setItem(_storageKey, JSON.stringify(data));
  } catch (e) { /* quota exceeded hoặc private mode */ }
}

function _loadState() {
  if (!_storageKey) return;
  try {
    const raw = localStorage.getItem(_storageKey);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.xp === 'number') S.xp = data.xp;
    if (typeof data.games === 'number') S.games = data.games;
    if (data.best && typeof data.best === 'object') S.best = data.best;
    if (data.flags && typeof data.flags === 'object') S.flags = data.flags;
    if (Array.isArray(data.played)) S.played = new Set(data.played);
    if (Array.isArray(data.unlocked)) S.unlocked = new Set(data.unlocked);
  } catch (e) { /* parse error — bỏ qua */ }
}

const _runPrefix = 'offline_run_';
function saveOfflineRun(id, state) {
  if (!id || !state || typeof state !== 'object') throw new TypeError('Tiến độ game không hợp lệ');
  try {
    localStorage.setItem(_runPrefix + id, JSON.stringify({ version: 1, updatedAt: Date.now(), state }));
  } catch (e) {
    toast('Không thể lưu ván chơi trên thiết bị này.');
    console.error(`[offline] Không thể lưu tiến độ "${id}"`, e);
  }
}

function loadOfflineRun(id) {
  if (!id) return null;
  try {
    const raw = localStorage.getItem(_runPrefix + id);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (saved?.version !== 1 || !saved.state || typeof saved.state !== 'object') {
      localStorage.removeItem(_runPrefix + id);
      return null;
    }
    return saved.state;
  } catch (e) {
    toast('Không thể đọc tiến độ đã lưu.');
    console.error(`[offline] Không thể đọc tiến độ "${id}"`, e);
    return null;
  }
}

function clearOfflineRun(id) {
  if (!id) return;
  try {
    localStorage.removeItem(_runPrefix + id);
  } catch (e) {
    toast('Không thể xóa tiến độ trên thiết bị này.');
    console.error(`[offline] Không thể xóa tiến độ "${id}"`, e);
  }
}

/* ============ Âm thanh ============ */
let soundOn = true, actx;

function beep(f, d = .12, type = 'sine', v = .07) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.stop(actx.currentTime + d);
  } catch (e) { /* ignore */ }
}

const sfx = {
  ok()  { beep(660, .1); setTimeout(() => beep(880, .14), 90); },
  bad() { beep(150, .25, 'sawtooth', .05); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i * 110)); },
  tick(){ beep(520, .05, 'square', .03); },
  flap(){ beep(420, .07, 'triangle', .05); }
};

/* Nút tắt/bật âm thanh — tự kết nối khi DOM sẵn sàng */
function _bindSoundBtn() {
  const btn = $('#snd');
  if (btn) btn.onclick = () => { soundOn = !soundOn; btn.textContent = soundOn ? '🔊' : '🔇'; };
}

/* ============ Bộ hẹn giờ & phím ============ */
const T = {
  ids: [], ints: [], stops: [],
  set(fn, ms)  { const id = setTimeout(fn, ms);  this.ids.push(id);   return id; },
  int(fn, ms)  { const id = setInterval(fn, ms); this.ints.push(id);  return id; },
  loop(fn) {
    let last = performance.now(), run = true;
    const step = t => {
      if (!run) return;
      const dt = Math.min(.05, (t - last) / 1000);
      last = t; fn(dt);
      if (run) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    this.stops.push(() => { run = false; });
  },
  clear() {
    this.ids.forEach(clearTimeout);
    this.ints.forEach(clearInterval);
    this.stops.forEach(f => f());
    this.ids = []; this.ints = []; this.stops = [];
  }
};

let onKey = null;
window.addEventListener('keydown', e => { if (onKey) onKey(e); });

function cleanup() {
  T.clear();
  onKey = null;
  const stage = $('#stage');
  if (stage) { stage.onclick = null; stage.ontouchstart = null; }
  try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
}

/* ============ Canvas helper ============ */
function fitCanvas(cv, w, h) {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(w * d);
  cv.height = Math.round(h * d);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  const c = cv.getContext('2d');
  c.setTransform(d, 0, 0, d, 0, 0);
  return c;
}

/* ============ Toast thông báo ============ */
let _toastT;
function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ============ Huy hiệu ============ */
// Mảng BADGES được từng file khai báo bổ sung qua initCore({ badges })
// File này khai báo set mặc định hợp nhất cho tất cả game
let BADGES = [];

function checkBadges() {
  BADGES.forEach(b => {
    if (!S.unlocked.has(b.id) && b.ok()) {
      S.unlocked.add(b.id);
      setTimeout(() => toast(`${b.i} Huy hiệu mới: ${b.n}`), 900);
    }
  });
}

/* ============ XP & Cấp ============ */
function renderMe() {
  const lvlEl = $('#lvl'), xpEl = $('#xpb');
  if (lvlEl) lvlEl.textContent = 'Hạng ' + lvl();
  if (xpEl)  xpEl.style.width  = ((S.xp % XP_PER_LVL) / XP_PER_LVL * 100) + '%';
}

/* ============ Sinh câu hỏi toán ============ */
function genMath(level) {
  let a, b, c, text, ans;
  if (level === 0) {
    if (rnd(0, 1)) { a = rnd(2, 20); b = rnd(1, 20); text = `${a} + ${b}`; ans = a + b; }
    else           { a = rnd(5, 25); b = rnd(1, a);  text = `${a} − ${b}`; ans = a - b; }
  } else if (level === 1) {
    const t = rnd(0, 3);
    if      (t === 0) { a = rnd(2, 10); b = rnd(2, 10); text = `${a} × ${b}`; ans = a * b; }
    else if (t === 1) { a = rnd(20, 99); b = rnd(10, 60); text = `${a} + ${b}`; ans = a + b; }
    else if (t === 2) { a = rnd(40, 99); b = rnd(10, a);  text = `${a} − ${b}`; ans = a - b; }
    else              { b = rnd(2, 9); ans = rnd(2, 10); a = b * ans; text = `${a} ÷ ${b}`; }
  } else {
    const t = rnd(0, 3);
    if      (t === 0) { a = rnd(6, 15);  b = rnd(3, 12); text = `${a} × ${b}`; ans = a * b; }
    else if (t === 1) { b = rnd(3, 12); ans = rnd(4, 15); a = b * ans; text = `${a} ÷ ${b}`; }
    else if (t === 2) { a = rnd(2, 20); b = rnd(2, 9); c = rnd(2, 9); text = `${a} + ${b} × ${c}`; ans = a + b * c; }
    else {
      a = rnd(2, 9); b = rnd(2, 9); c = rnd(1, 20);
      text = `${a} × ${b} − ${c}`; ans = a * b - c;
      if (ans < 0) { text = `${a} × ${b} + ${c}`; ans = a * b + c; }
    }
  }
  return { text, ans };
}

function makeOpts(ans, n) {
  const set = new Set([ans]);
  const spread = Math.max(3, Math.round(Math.abs(ans) * .2));
  let guard = 0;
  while (set.size < n && guard++ < 200) {
    const v = ans + rnd(1, spread) * (rnd(0, 1) ? 1 : -1);
    if (v >= 0) set.add(v);
  }
  let k = 1;
  while (set.size < n) set.add(ans + k++);
  return shuffle([...set]);
}

/* ============ Trắc nghiệm dùng chung (Đồng hồ, Quy luật) ============ */
function runMC(root, cfg) {
  let i = 0, score = 0, right = 0, streak = 0, time = cfg.secs, done = false, cur;
  function show() {
    cur = cfg.make(i); done = false; time = cfg.secs;
    root.innerHTML = `<div class="hud"><span>Câu <b>${i + 1}/${cfg.count}</b></span><span>⭐ <b>${score}</b></span><span>🔥 ${streak}</span></div>
      <div class="tbar"><i id="tb"></i></div>
      <div class="qbox">${cur.html}</div>
      <div class="opts" id="o">${cur.opts.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
      <div id="ex"></div><div class="row" id="nx"></div>`;
    if (cur.after) cur.after();
  }
  function answer(k) {
    if (done) return; done = true;
    const btns = [...root.querySelectorAll('.opt')],
          ci   = cur.opts.findIndex(o => String(o) === String(cur.ans));
    btns[ci].classList.add('ok');
    if (k === ci) { right++; streak++; score += 10 + Math.ceil(time) + (streak >= 3 ? 5 : 0); sfx.ok(); }
    else          { streak = 0; sfx.bad(); if (k >= 0) btns[k].classList.add('bad'); }
    $('#ex').innerHTML = `<div class="explain">💡 ${k === -1 ? 'Hết giờ! ' : ''}${cur.exp}</div>`;
    $('#nx').innerHTML = `<button class="btn" data-next="1">${i < cfg.count - 1 ? 'Câu tiếp theo' : 'Xem kết quả'}</button>`;
  }
  root.onclick = e => {
    const o = e.target.closest('.opt'), n = e.target.closest('[data-next]');
    if (o) answer(+o.dataset.k);
    else if (n) {
      i++;
      if (i < cfg.count) show();
      else {
        cfg.onEnd && cfg.onEnd(right);
        finish({ id: cfg.id, score, xp: Math.round(score / 4), lines: [`Đúng ${right}/${cfg.count} câu`], replay: cfg.replay });
      }
    }
  };
  T.int(() => {
    if (done) return;
    time -= .1;
    const tb = $('#tb');
    if (tb) tb.style.width = Math.max(0, time / cfg.secs * 100) + '%';
    if (time <= 0) answer(-1);
  }, 100);
  show();
}

/* ============ finish() — kết thúc ván ============ */
/**
 * Gọi khi một ván kết thúc.
 * @param {{ id, score, xp, lines, replay, details? }} opts
 */
function finish({ id, score, xp = 0, lines, replay, details = {} }) {
  cleanup();

  // Cập nhật state client ngay (không chờ mạng)
  const before = lvl();
  S.xp   += xp;
  S.games++;
  S.played.add(id);
  const isBest = score > (S.best[id] || 0);
  if (isBest) S.best[id] = score;
  checkBadges();
  renderMe();
  _saveState(); // ← Lưu tiến độ vào localStorage
  const up = lvl() > before;
  sfx.win();

  $('#modal').innerHTML = `<div class="panel result">
    <h2>${up ? 'Lên cấp ' + lvl() + '!' : 'Hoàn thành!'}</h2>
    <div class="big">${score}</div>
    <div class="stats">
      ${isBest ? '<span>🏆 Kỷ lục mới</span>' : ''}
      ${lines.map(l => `<span>${l}</span>`).join('')}
      <span>+${xp} XP</span>
    </div>
    <div class="row">
      <button class="btn" id="again">Chơi lại</button>
      <button class="btn alt ghost" id="home">Về sảnh</button>
    </div>
  </div>`;
  $('#modal').classList.add('on');

  $('#again').onclick = () => { $('#modal').classList.remove('on'); openGame(id); };
  $('#home').onclick  = () => { $('#modal').classList.remove('on'); renderHub(); };

  clearOfflineRun(id);
}

/* ============ renderHub & openGame (được override bởi mỗi file) ============ */
// Các hàm này được khai báo ở đây nhưng thực sự được gán lại trong initCore()
// khi mỗi file HTML gọi initCore({ games, hubTitle, hubDesc, badges })
let _GAMES = [];

function renderHub() {
  cleanup();
  $('#game').hidden = true;
  $('#hub').hidden  = false;
  $('#modal').classList.remove('on');
  const grid = _GAMES.map(g => {
    // Hỗ trợ cả style game1 (color field) và game2/3 (c field với orb)
    const usesOrb = !!g.icon && !g.color;
    if (usesOrb) {
      return `<button class="tile" data-g="${g.id}" style="--c:${g.c}">
        <span class="orb">${g.icon}</span>
        <h3>${g.name}</h3>
        <p>${g.desc}</p>
        <span class="meta"><span class="tag">${g.tag}</span><span>${S.best[g.id] ? 'Kỷ lục ' + S.best[g.id] : 'Chưa chơi'}</span></span>
      </button>`;
    }
    return `<button class="tile" data-g="${g.id}" style="background:${g.color}">
      <span class="ic">${g.icon}</span>

    </button>`;
  }).join('');

  const badgesHtml = BADGES.map(b =>
    `<span class="bd ${S.unlocked.has(b.id) ? '' : 'off'}">${b.i} ${b.n}</span>`
  ).join('');

  $('#hub').innerHTML = `
    <div class="hero">
      <h2 id="hub-title"></h2>

function openGame(id) {

/* ============ initCore — điểm khởi động của mỗi file ============ */

    <script>

//
// File HTML sinh ra gọi startSingleGame({ id, name, icon, storageKey, mount, badges }).

      window.parent.postMessage({ type: "quit", data: {} }, "*");
    }
  } catch (e) { /* ignore */ }
  // Đứng riêng (mở file trực tiếp) → quay về trang chủ ứng dụng
  if (!window.parent || window.parent === window) {
    try { window.location.href = "/"; } catch (e) { /* ignore */ }
  }
}

/**
 * core.js gọi renderHub() khi người chơi bấm "Về sảnh" ở màn kết quả.
 * Ở chế độ 1-game không có sảnh nên chỉ cần ra khỏi game.

/**

 * @param {object} cfg

 * @param {Function} cfg.mount     hàm nhận `root` để dựng game
 * @param {Array}   cfg.badges     huy hiệu

function startSingleGame(cfg) {

  BADGES = cfg.badges || [];
  _GAMES = [{ id, name: cfg.name, icon: cfg.icon, fn: mount }];

  // Đánh dấu chế độ 1-game để CSS ẩn thanh header của sảnh (xem shell.html).

/** Lưu tiến độ ngay khi đóng tab (bổ sung cho lần ghi trong game). */

window.addEventListener("pagehide", () => { if (typeof _saveState === "function") _saveState(); });

    <!-- Game: clock — nội dung riêng của file này -->
    <script id="gq-kit">/* gq-kit.js — Bộ nâng cấp dùng chung cho game dọc:
   · Màn chọn độ khó 4 mức (Dễ / Trung bình / Khó / Siêu khó) — cùng một giao diện cho mọi game
   · Độ khó thật: nhịp game (setTimeout/setInterval/rAF/performance.now/Date.now) co giãn theo mức,
     điểm & XP nhân hệ số (game dạng "single"), số mạng / giây mỗi câu / màn khởi đầu (mcengine)
   · Pháo hoa khi kết thúc ván, nút "Đổi độ khó", nhãn độ khó luôn hiện trên đầu màn hình
   MODE được build thay: 'single' (game sinh từ shell) hoặc 'standalone' (game viết tay). */
(() => {
  if (window.GQ) return;
  const MODE = 'single';
  const TIERS = [
    { k: 'easy',   n: 'Dễ',         e: '🌱', c: '#22b573', s: .75, m: 1,   lives: 5, secs: 35, lvl0: 1, d: 'Chậm rãi, nhiều mạng — thoải mái làm quen' },
    { k: 'mid',    n: 'Trung bình', e: '🔥', c: '#f4b942', s: 1,   m: 1.5, lives: 3, secs: 25, lvl0: 1, d: 'Nhịp độ chuẩn, vừa sức chơi' },
    { k: 'hard',   n: 'Khó',        e: '⚡', c: '#e4572e', s: 1.3, m: 2,   lives: 3, secs: 18, lvl0: 2, d: 'Nhanh hơn, ít thời gian suy nghĩ' },
    { k: 'insane', n: 'Siêu khó',   e: '💀', c: '#8b5cf6', s: 1.7, m: 3,   lives: 2, secs: 12, lvl0: 3, d: 'Cực nhanh, ít sai sót — dành cho cao thủ' },
  ];
  const G = { t: TIERS[1], i: 1, locked: MODE === 'standalone', q: [] };

  /* ---- Co giãn thời gian theo độ khó ---- */
  const oT = window.setTimeout.bind(window), oC = window.clearTimeout.bind(window);
  const oR = window.requestAnimationFrame.bind(window), oP = performance.now.bind(performance), oD = Date.now;
  const cp = { o: 0 }, cd = { o: 0 };
  const sc = (raw, c) => raw * G.t.s + c.o;
  function setTier(i) {
    const r = oP(), d = oD(), a = sc(r, cp), b = sc(d, cd);
    G.i = i; G.t = TIERS[i];
    cp.o = a - r * G.t.s; cd.o = b - d * G.t.s;
  }
  performance.now = () => sc(oP(), cp);
  Date.now = () => sc(oD(), cd);
  window.requestAnimationFrame = cb => {
    if (G.locked) { G.q.push(cb); return 0; }
    return oR(ts => cb(sc(ts, cp)));
  };
  window.setTimeout = (f, ms, ...a) => typeof f === 'function' ? oT(f, (ms || 0) / G.t.s, ...a) : oT(f, ms);
  const IV = {}; let ivn = 1e9;
  window.setInterval = (f, ms, ...a) => {
    if (typeof f !== 'function') return 0;
    const id = ++ivn, run = () => { IV[id] = oT(() => { if (!(id in IV)) return; if (!G.locked) f(...a); if (id in IV) run(); }, Math.max(0, (ms || 0) / G.t.s)); };
    IV[id] = 0; run(); return id;
  };
  const oCI = window.clearInterval.bind(window);
  window.clearInterval = id => { if (id > 1e9) { oC(IV[id]); delete IV[id]; } else oCI(id); };

  window.GQ = {
    tiers: TIERS, set: setTier,
    get tier() { return G.t; }, get idx() { return G.i; },
    get s() { return G.t.s; }, get m() { return G.t.m; },
    get lives() { return G.t.lives; }, get secs() { return G.t.secs; }, get lvl0() { return G.t.lvl0; },
  };

  /* ---- Tiện ích ---- */
  const $el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
  const KEY = 'gq_diff:' + (location.pathname.split('/').pop() || 'game');
  const quit = () => {
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'quit', data: {} }, '*'); return; } } catch (e) { /* ignore */ }
    try { location.href = '/'; } catch (e) { /* ignore */ }
  };
  let actx;
  const tone = (f) => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = 'triangle'; g.gain.value = .06; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .15); o.stop(actx.currentTime + .15); } catch (e) { /* ignore */ } };

  function pill() {
    let p = document.querySelector('.gq-tier');
    if (!p) { p = $el('<div class="gq-tier"></div>'); document.body.appendChild(p); }
    p.textContent = G.t.e + ' ' + G.t.n; p.style.setProperty('--c', G.t.c);
  }

  /* ---- Màn chọn độ khó (giống hệt nhau ở mọi game) ---- */
  function pick(meta, go) {
    let last = 1;
    try { const v = +localStorage.getItem(KEY); if (v >= 0 && v < 4) last = v; } catch (e) { /* ignore */ }
    const chip = t => MODE === 'single' ? `×${t.m} điểm` : `tốc độ ×${t.s}`;
    const box = $el(`<div id="gqp"><button class="gqp-x" aria-label="Thoát">←</button>
      <div class="gqp-box"><div class="gqp-ic">${meta.icon || '🎮'}</div><h1>${meta.name}</h1>
      <p>Chọn độ khó để bắt đầu</p>
      <div class="gqp-list">${TIERS.map((t, i) => `<button class="gqd${i === last ? ' last' : ''}" data-i="${i}" style="--c:${t.c}">
        <i>${t.e}</i><span><b>${t.n}</b><em>${t.d}</em></span><u>${chip(t)}</u></button>`).join('')}</div>
      <small>Độ khó càng cao, nhịp chơi càng gấp — thưởng càng lớn 🏆</small></div></div>`);
    box.querySelector('.gqp-x').onclick = quit;
    box.querySelector('.gqp-list').onclick = e => {
      const b = e.target.closest('.gqd'); if (!b) return;
      const i = +b.dataset.i; tone(380 + i * 120);
      try { localStorage.setItem(KEY, i); } catch (er) { /* ignore */ }
      setTier(i); box.remove(); pill();
      if (G.locked) { G.locked = false; G.q.splice(0).forEach(cb => window.requestAnimationFrame(cb)); }
      go && go();
    };
    document.body.appendChild(box);
    setTimeout(() => { try { box.querySelector('.last').focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
  }

  /* ---- Pháo hoa ---- */
  function boom() {
    const em = ['🎉', '⭐', '✨', '🎊', '🍓', '💫'];
    for (let i = 0; i < 34; i++) {
      const s = $el(`<span class="gq-conf">${em[i % em.length]}</span>`);
      s.style.cssText = `left:${Math.random() * 100}vw;--dx:${(Math.random() * 160 - 80) | 0}px;animation-delay:${(Math.random() * .5).toFixed(2)}s;font-size:${16 + (Math.random() * 18 | 0)}px`;
      document.body.appendChild(s); oT(() => s.remove(), 2800);
    }
  }

  /* ---- Gắn vào game ---- */
  if (MODE === 'single') {
    const o = window.startSingleGame, f = window.finish;
    window.startSingleGame = cfg => {
      const go = () => { o(cfg); pill(); };
      if (document.body) pick({ name: cfg.name, icon: cfg.icon }, go);
      else document.addEventListener('DOMContentLoaded', () => pick({ name: cfg.name, icon: cfg.icon }, go));
    };
    window.finish = function (opt) {
      const t = G.t, m = t.m;
      const r = f.call(this, Object.assign({}, opt, {
        score: Math.round((opt.score || 0) * m), xp: Math.round((opt.xp || 0) * m),
        lines: [`${t.e} ${t.n} ×${m}`].concat(opt.lines || []),
      }));
      boom();
      const row = document.querySelector('#modal .row');
      if (row) { const b = $el('<button class="btn alt ghost" id="gq-chg">🎚️ Đổi độ khó</button>'); b.onclick = () => location.reload(); row.appendChild(b); }
      return r;
    };
  } else {
    const start = () => {
      const t = (document.title || 'Trò chơi').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
      const ic = (document.title.match(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/u) || ['🎮'])[0];
      document.documentElement.classList.add('gq-sa');
      pick({ name: t, icon: ic });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  }
})();
</script>
<script>
// src/games/src/clock.js — Phản Xạ Chớp Nhoáng

    function clockGame(root) {
      const id = 'clock';
      let saved = loadOfflineRun(id);

      function fresh() {
        clearOfflineRun(id);
        return { round: 0, score: 0, falseStarts: 0, reactions: [], phase: 'ready', waitLeft: 0, goElapsed: 0 };
      }

      function intro() {
        root.innerHTML = `<div class="panel center"><h2>Phản Xạ Chớp Nhoáng</h2>
          <p class="hint">Chờ màn hình chuyển xanh rồi chạm ngay. Chơi 5 lượt, càng nhanh càng tốt!</p>
          <button class="btn" data-start="1">Bắt đầu chơi</button></div>`;
        root.onclick = e => { if (e.target.closest('[data-start]')) start(fresh()); };
      }

      function start(game) {
        T.clear();
        let readyAt = game.phase === 'go' ? Date.now() : 0;
        let ticks = 0;
        function save() {
          const state = { ...game };
          saveOfflineRun(id, state);
        }
        function paint() {
          const waiting = game.phase === 'wait';
          const go = game.phase === 'go';
          root.innerHTML = `<div class="hud"><span>🏁 Lượt <b>${game.round}/5</b></span><span>⭐ <b>${game.score}</b></span><span>⚠️ Chạm sớm: ${game.falseStarts}</span></div>
            <button class="btn" data-action="tap" style="width:100%;min-height:220px;font-size:clamp(26px,7vw,42px);background:${go ? 'var(--lime)' : 'var(--sky)'};color:#0b2227">
              <span id="signal">${go ? 'CHẠM NGAY!' : waiting ? 'ĐỢI TÍN HIỆU…' : 'CHẠM ĐỂ BẮT ĐẦU'}</span>
            </button>
            <p class="hint" id="note">${go ? 'Nhanh!' : waiting ? 'Đừng chạm vội!' : 'Sẵn sàng?'}</p>`;
        }
        function beginWait() {
          game.phase = 'wait';
          game.waitLeft = rnd(8, 24) / 10;
          game.goElapsed = 0;
          readyAt = 0;
          save();
          paint();
        }
        root.onclick = e => {
          if (!e.target.closest('[data-action="tap"]')) return;
          if (game.phase === 'ready') {
            beginWait();
          } else if (game.phase === 'wait') {
            game.falseStarts++;
            game.waitLeft = rnd(10, 28) / 10;
            sfx.bad();
            save();
            const note = root.querySelector('#note');
            if (note) note.textContent = 'Quá sớm! Chờ tín hiệu xanh.';
          } else if (game.phase === 'go') {
            const reaction = Math.max(0, Date.now() - readyAt);
            game.reactions.push(reaction);
            game.score += Math.max(0, 1000 - reaction);
            game.round++;
            sfx.ok();
            if (game.round >= 5) {
              T.clear();
              clearOfflineRun(id);
              S.flags.clock = true;
              const average = Math.round(game.reactions.reduce((a, b) => a + b, 0) / game.reactions.length);
              finish({
                id, score: game.score, xp: 0,
                lines: [`Điểm: ${game.score}`, `Phản xạ trung bình: ${average} mili giây`],
                replay: clockGame, details: { reactions: game.reactions, falseStarts: game.falseStarts }
              });
              return;
            }
            beginWait();
          }
        };
        if (game.phase === 'go') readyAt = Date.now() - (game.goElapsed || 0);
        paint();
        save();
        T.int(() => {
          ticks++;
          if (game.phase === 'wait') {
            game.waitLeft -= .1;
            if (game.waitLeft <= 0) {
              game.phase = 'go';
              game.goElapsed = 0;
              readyAt = Date.now();
              sfx.tick();
              paint();
              save();
            } else {
              const signal = root.querySelector('#signal');
              if (signal && ticks % 5 === 0) signal.textContent = `ĐỢI... ${Math.ceil(game.waitLeft)}`;
              if (ticks % 5 === 0) save();
            }
          } else if (game.phase === 'go') {
            game.goElapsed = (game.goElapsed || 0) + 100;
            if (ticks % 5 === 0) save();
          }
        }, 100);
      }

      if (saved && Number.isInteger(saved.round) && saved.round >= 0 && saved.round < 5 && Array.isArray(saved.reactions)) {
        start(saved);
      } else intro();
    }

startSingleGame({
  id: 'clock',
  name: 'Chạm Đúng Nhịp',
  icon: '🚦',
  storageKey: 'offline_clock',
