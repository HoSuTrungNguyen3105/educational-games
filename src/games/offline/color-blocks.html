<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><script id="gq-kit">/* gq-kit.js — Bộ nâng cấp dùng chung cho game dọc:
   · Màn chọn độ khó 4 mức (Dễ / Trung bình / Khó / Siêu khó) — cùng một giao diện cho mọi game
   · Độ khó thật: nhịp game (setTimeout/setInterval/rAF/performance.now/Date.now) co giãn theo mức,
     điểm & XP nhân hệ số (game dạng "single"), số mạng / giây mỗi câu / màn khởi đầu (mcengine)
   · Pháo hoa khi kết thúc ván, nút "Change difficulty", nhãn độ khó luôn hiện trên đầu màn hình
   MODE được build thay: 'single' (game sinh từ shell) hoặc 'standalone' (game viết tay). */
(() => {
  if (window.GQ) return;
  const MODE = 'standalone';
  const TIERS = [
    { k: 'easy',   n: 'Easy',         e: '🌱', c: '#22b573', s: .75, m: 1,   lives: 5, secs: 35, lvl0: 1, d: 'Slow, extra lives — take it easy' },
    { k: 'mid',    n: 'Normal', e: '🔥', c: '#f4b942', s: 1,   m: 1.5, lives: 3, secs: 25, lvl0: 1, d: 'Balanced pace' },
    { k: 'hard',   n: 'Hard',        e: '⚡', c: '#e4572e', s: 1.3, m: 2,   lives: 3, secs: 18, lvl0: 2, d: 'Faster, less thinking time' },
    { k: 'insane', n: 'Insane',   e: '💀', c: '#8b5cf6', s: 1.7, m: 3,   lives: 2, secs: 12, lvl0: 3, d: 'Very fast, no room for mistakes' },
  ];
  const G = { t: TIERS[1], i: 1, locked: MODE === 'standalone', q: [] };

  /* ---- Co giãn thời gian theo độ khó ---- */
  const oT = window.setTimeout.bind(window), oC = window.clearTimeout.bind(window);
  const oR = window.requestAnimationFrame.bind(window), oP = performance.now.bind(performance), oD = Date.now;
  const cp = { o: 0 }, cd = { o: 0 };
  const sc = (raw, c) => raw * G.t.s + c.o;
  function setTier(i) {
    const r = oP(), d = oD(), a = sc(r, cp), b = sc(d, cd);
    G.i = i; G.t = TIERS[i];
    cp.o = a - r * G.t.s; cd.o = b - d * G.t.s;
  }
  performance.now = () => sc(oP(), cp);
  Date.now = () => sc(oD(), cd);
  window.requestAnimationFrame = cb => {
    if (G.locked) { G.q.push(cb); return 0; }
    return oR(ts => cb(sc(ts, cp)));
  };
  window.setTimeout = (f, ms, ...a) => typeof f === 'function' ? oT(f, (ms || 0) / G.t.s, ...a) : oT(f, ms);
  const IV = {}; let ivn = 1e9;
  window.setInterval = (f, ms, ...a) => {
    if (typeof f !== 'function') return 0;
    const id = ++ivn, run = () => { IV[id] = oT(() => { if (!(id in IV)) return; if (!G.locked) f(...a); if (id in IV) run(); }, Math.max(0, (ms || 0) / G.t.s)); };
    IV[id] = 0; run(); return id;
  };
  const oCI = window.clearInterval.bind(window);
  window.clearInterval = id => { if (id > 1e9) { oC(IV[id]); delete IV[id]; } else oCI(id); };

  window.GQ = {
    tiers: TIERS, set: setTier,
    get tier() { return G.t; }, get idx() { return G.i; },
    get s() { return G.t.s; }, get m() { return G.t.m; },
    get lives() { return G.t.lives; }, get secs() { return G.t.secs; }, get lvl0() { return G.t.lvl0; },
  };

  /* ---- Tiện ích ---- */
  const $el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
  const KEY = 'gq_diff:' + (location.pathname.split('/').pop() || 'game');
  const quit = () => {
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'quit', data: {} }, '*'); return; } } catch (e) { /* ignore */ }
    try { location.href = '/'; } catch (e) { /* ignore */ }
  };
  let actx;
  const tone = (f) => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = 'triangle'; g.gain.value = .06; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .15); o.stop(actx.currentTime + .15); } catch (e) { /* ignore */ } };

  function pill() {
    let p = document.querySelector('.gq-tier');
    if (!p) { p = $el('<div class="gq-tier"></div>'); document.body.appendChild(p); }
    p.textContent = G.t.e + ' ' + G.t.n; p.style.setProperty('--c', G.t.c);
  }

  /* ---- Màn chọn độ khó (giống hệt nhau ở mọi game) ---- */
  function pick(meta, go) {
    let last = 1;
    try { const v = +localStorage.getItem(KEY); if (v >= 0 && v < 4) last = v; } catch (e) { /* ignore */ }
    const chip = t => MODE === 'single' ? `×${t.m} points` : `speed ×${t.s}`;
    const box = $el(`<div id="gqp"><button class="gqp-x" aria-label="Exit">←</button>
      <div class="gqp-box"><div class="gqp-ic">${meta.icon || '🎮'}</div><h1>${meta.name}</h1>
      <p>Pick a difficulty to start</p>
      <div class="gqp-list">${TIERS.map((t, i) => `<button class="gqd${i === last ? ' last' : ''}" data-i="${i}" style="--c:${t.c}">
        <i>${t.e}</i><span><b>${t.n}</b><em>${t.d}</em></span><u>${chip(t)}</u></button>`).join('')}</div>
      <small>Higher difficulty, faster pace — bigger rewards 🏆</small></div></div>`);
    box.querySelector('.gqp-x').onclick = quit;
    box.querySelector('.gqp-list').onclick = e => {
      const b = e.target.closest('.gqd'); if (!b) return;
      const i = +b.dataset.i; tone(380 + i * 120);
      try { localStorage.setItem(KEY, i); } catch (er) { /* ignore */ }
      setTier(i); box.remove(); pill();
      if (G.locked) { G.locked = false; G.q.splice(0).forEach(cb => window.requestAnimationFrame(cb)); }
      go && go();
    };
    document.body.appendChild(box);
    setTimeout(() => { try { box.querySelector('.last').focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
  }

  /* ---- Pháo hoa ---- */
  function boom() {
    const em = ['🎉', '⭐', '✨', '🎊', '🍓', '💫'];
    for (let i = 0; i < 34; i++) {
      const s = $el(`<span class="gq-conf">${em[i % em.length]}</span>`);
      s.style.cssText = `left:${Math.random() * 100}vw;--dx:${(Math.random() * 160 - 80) | 0}px;animation-delay:${(Math.random() * .5).toFixed(2)}s;font-size:${16 + (Math.random() * 18 | 0)}px`;
      document.body.appendChild(s); oT(() => s.remove(), 2800);
    }
  }

  /* ---- Gắn vào game ---- */
  if (MODE === 'single') {
    const o = window.startSingleGame, f = window.finish;
    window.startSingleGame = cfg => {
      const go = () => { o(cfg); pill(); };
      if (document.body) pick({ name: cfg.name, icon: cfg.icon }, go);
      else document.addEventListener('DOMContentLoaded', () => pick({ name: cfg.name, icon: cfg.icon }, go));
    };
    window.finish = function (opt) {
      const t = G.t, m = t.m;
      const r = f.call(this, Object.assign({}, opt, {
        score: Math.round((opt.score || 0) * m), xp: Math.round((opt.xp || 0) * m),
        lines: [`${t.e} ${t.n} ×${m}`].concat(opt.lines || []),
      }));
      boom();
      const row = document.querySelector('#modal .row');
      if (row) { const b = $el('<button class="btn alt ghost" id="gq-chg">🎚️ Change difficulty</button>'); b.onclick = () => location.reload(); row.appendChild(b); }
      return r;
    };
  } else {
    const start = () => {
      const t = (document.title || 'Game').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
      const ic = (document.title.match(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/u) || ['🎮'])[0];
      document.documentElement.classList.add('gq-sa');
      pick({ name: t, icon: ic });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  }
})();
</script>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const N = 8;

/* ---------- Save ---------- */
const KEY = 'xep-khoi-v1'; let mem = null;
const load = () => { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {} return mem ? JSON.parse(mem) : {}; };
const S = Object.assign({ best: 0, games: 0, lines: 0, maxCombo: 0, sfx: true, save: null }, load());
const persist = () => { const s = JSON.stringify(S); try { localStorage.setItem(KEY, s); } catch (e) { mem = s; } };

/* ---------- Blocks ---------- */
const SHAPES = [
  ['X'], ['XX'], ['XXX'], ['XXXX'], ['XXXXX'], ['X', 'X'], ['X', 'X', 'X'], ['X', 'X', 'X', 'X'], ['X', 'X', 'X', 'X', 'X'],
  ['XX', 'XX'], ['XXX', 'XXX', 'XXX'], ['XXX', 'XXX'], ['XX', 'XX', 'XX'],
  ['X.', 'XX'], ['.X', 'XX'], ['XX', 'X.'], ['XX', '.X'],
  ['X..', 'X..', 'XXX'], ['..X', '..X', 'XXX'], ['XXX', 'X..', 'X..'], ['XXX', '..X', '..X'],
  ['XXX', '.X.'], ['.X.', 'XXX'], ['X.', 'XX', 'X.'], ['.X', 'XX', '.X'],
  ['XX.', '.XX'], ['.XX', 'XX.'], ['.X', 'XX', 'X.'], ['X.', 'XX', '.X']
].map(rows => { const cells = []; rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'X') cells.push([y, x]); })); return { rows, cells, h: rows.length, w: rows[0].length }; });
const COLORS = ['#ff5d73', '#ff9f43', '#ffd93d', '#4cd964', '#2dd4bf', '#4dabf7', '#9775fa', '#f06595'];

function tone(f, d = .15, v = .1, type = 'sine', delay = 0, slide = 0) {

  place: () => { tone(200, .12, .12, 'triangle', 0, -60); tone(300, .1, .06, 'sine', .03); },
  bad: () => tone(160, .15, .08, 'sawtooth', 0, -50),
  clear: (n, c) => { for (let i = 0; i < Math.min(5, n + 2); i++) tone(520 * Math.pow(1.122, i * 2 + Math.min(c, 5)), .25, .1, 'triangle', i * .06); },
  over: () => [330, 262, 196].forEach((f, i) => tone(f, .4, .12, 'sawtooth', i * .2)),
  best: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .4, .1, 'triangle', i * .1))

const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- State ---------- */
let grid, tray, score = 0, combo = 0, noClear = 0, over = false, newBest = false;
let drag = null, parts = [], cellFx = [], floats = [], shake = 0, flashLines = [];

function newGame() {
  grid = Array.from({ length: N }, () => Array(N).fill(-1)); score = 0; combo = 0; noClear = 0; over = false; newBest = false; parts = []; cellFx = []; floats = [];

function persistGame() { S.save = over ? null : { grid, tray: tray.map(t => t && { s: t.s, c: t.c }), score, combo, noClear }; persist(); }
function restore(sv) { grid = sv.grid; tray = sv.tray.map(t => t && { s: t.s, c: t.c }); score = sv.score; combo = sv.combo || 0; noClear = sv.noClear || 0; over = false; hudUpdate(); }

/* ---------- Fair block generation ---------- */
const occupied = () => grid.reduce((a, r) => a + r.filter(v => v >= 0).length, 0);
function canPlace(sh, gy, gx) { return SHAPES[sh].cells.every(([y, x]) => { const r = gy + y, c = gx + x; return r >= 0 && c >= 0 && r < N && c < N && grid[r][c] < 0; }); }

function genTray() {

}

/* ---------- Layout ---------- */
function resize() {

  const top = ($('top').offsetHeight || 96) + 4;
  cell = Math.floor(Math.min((W - 24) / N, (H - top - 150) / N, 78)); cell = Math.max(cell, 26);
  bx = Math.round((W - cell * N) / 2); by = Math.round(top + 8 + Math.max(0, (H - top - 150 - cell * N) / 3));

/* ---------- Draw blocks ---------- */

  ctx.strokeStyle = shade(col, -.45); ctx.lineWidth = 1.2; rr(x + p + g, y + p + g, q - 2 * g, q - 2 * g, s * .2); ctx.stroke(); ctx.globalAlpha = 1;
}

/* ---------- Place block ---------- */
function anchor() {
  const sh = SHAPES[tray[drag.i].s], off = cell * 2.0, tx = drag.x - sh.w * cell / 2, ty = drag.y - off - sh.h * cell / 2;
  return { gx: Math.round((tx - bx) / cell), gy: Math.round((ty - by) / cell), px: tx, py: ty };
}
function linesIf(sh, gy, gx) {
  const g2 = grid.map(r => r.slice()); SHAPES[sh].cells.forEach(([y, x]) => { g2[gy + y][gx + x] = 99; });
  const rows = [], cols = []; for (let i = 0; i < N; i++) { if (g2[i].every(v => v >= 0)) rows.push(i); if (g2.every(r => r[i] >= 0)) cols.push(i); } return { rows, cols };

function place(i, gy, gx) {

    set.forEach(k => { grid[(k / N) | 0][k % N] = -1; });

    sfx.clear(L, combo); vib(L > 1 ? 40 : 20); shake = Math.min(14, 3 + L * 2.5);
    const words = L >= 4 ? 'LEGENDARY!' : L === 3 ? 'AMAZING!' : L === 2 ? 'GREAT!' : combo >= 3 ? 'COMBO STREAK!' : '';
    floats.push({ x: bx + cell * N / 2, y: by + cell * N * .42, t: '+' + bonus, s: 1, life: 1.2, c: '#fff' });
    if (words) floats.push({ x: bx + cell * N / 2, y: by + cell * N * .28, t: words, s: 1.25, life: 1.4, c: '#ffd84a' });
    if (combo >= 2) floats.push({ x: bx + cell * N / 2, y: by + cell * N * .58, t: 'Combo x' + combo, s: .9, life: 1.2, c: '#ff9be8' });

  const c = $('combo'); c.textContent = combo >= 2 ? `🔥 Combo x${combo}` : ''; c.classList.toggle('on', combo >= 2);
  const s = $('score'); s.classList.add('b'); setTimeout(() => s.classList.remove('b'), 130);

/* ---------- Input ---------- */
cv.addEventListener('pointerdown', e => {

});

/* ---------- Menu ---------- */
function showStart() {

  $('start').classList.add('show');
}
$('contBtn').onclick = () => { audio(); restore(S.save); $('start').classList.remove('show'); };
$('newBtn').onclick = () => { audio(); newGame(); $('start').classList.remove('show'); };
$('againBtn').onclick = () => { audio(); $('over').classList.remove('show'); newGame(); };
$('menuBtn').onclick = () => { audio(); $('sndBtn').textContent = '🔊 Sound: ' + (S.sfx ? 'On' : 'Off'); $('menu').classList.add('show'); };
$('resumeBtn').onclick = () => $('menu').classList.remove('show');
$('restartBtn').onclick = () => { $('menu').classList.remove('show'); S.save = null; newGame(); };
$('sndBtn').onclick = () => { S.sfx = !S.sfx; persist(); $('sndBtn').textContent = '🔊 Sound: ' + (S.sfx ? 'On' : 'Off'); };

/* ---------- Draw & loop ---------- */
function draw(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ctx.save(); if (shake > .2) { ctx.translate(rand(-shake, shake), rand(-shake, shake)); shake *= .88; }

  if (prev) {
    ctx.fillStyle = 'rgba(255,255,255,.22)'; prev.l.rows.forEach(r => { rr(bx, by + r * cell, cell * N, cell, 8); ctx.fill(); }); prev.l.cols.forEach(c => { rr(bx + c * cell, by, cell, cell * N, 8); ctx.fill(); });

  if (prev) SHAPES[prev.t.s].cells.forEach(([y, x]) => block(bx + (prev.a.gx + x) * cell, by + (prev.a.gy + y) * cell, cell, COLORS[prev.t.c], .5));

if (S.save && S.save.grid) restore(S.save);

</script>

<script>
  // Shared button for all offline games: post a message to React (OfflineGamePage)
