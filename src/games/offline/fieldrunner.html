      eyes(r,5,-1,4);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(0,-3);ctx.moveTo(8,-8);ctx.lineTo(-1,-3);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-6,r*.5);for(let i=0;i<4;i++){ctx.lineTo(-6+i*4+2,r*.8);ctx.lineTo(-6+i*4+4,r*.5);}ctx.fill();break;}
    case 'titan':{
      ctx.fillStyle='rgba(160,60,255,.28)';ctx.beginPath();ctx.arc(0,0,r+10+Math.sin(a*5)*3,0,7);ctx.fill();
      feet(r,bob,a);blob(r,d.col,.25);
      ctx.fillStyle='#b9a3ff';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*r*.38-5,-r*.8);ctx.lineTo(i*r*.38,-r*1.4+Math.abs(i)*5);ctx.lineTo(i*r*.38+5,-r*.8);ctx.closePath();ctx.fill();ctx.stroke();}
      ctx.fillStyle=rg(0,r*.35,1,9,[[0,'#fff'],[.5,'#c86bff'],[1,'rgba(200,107,255,0)']]);ctx.beginPath();ctx.arc(0,r*.35,8+Math.sin(a*8)*1.5,0,7);ctx.fill();
      ctx.fillStyle='#ffdd55';ctx.fillRect(-9,-r*.3,6,4);ctx.fillRect(3,-r*.3,6,4);break;}
    /* --- trên không --- */
    case 'plane':case 'bomber':{
      ctx.fillStyle=lg(0,-14,0,14,[[0,lighten(d.col,.3)],[1,d.col]]);
      ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-4,-15);ctx.lineTo(-10,-13);ctx.lineTo(-4,0);ctx.lineTo(-10,13);ctx.lineTo(-4,15);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#4aa8ff';ctx.beginPath();ctx.ellipse(6,0,4,2.6,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#e03a3a';ctx.fillRect(-13,-3,6,6);
      if(t==='bomber'){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-2,7,3.2,0,7);ctx.arc(-2,-7,3.2,0,7);ctx.fill();}break;}
    case 'bat':{
      const w=Math.sin(a*14);ctx.fillStyle=d.col;
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-6,-14-w*6,-16,-8-w*8);ctx.quadraticCurveTo(-9,-4,-6,0);ctx.quadraticCurveTo(-9,4,-16,8+w*8);ctx.quadraticCurveTo(-6,14+w*6,0,0);ctx.fill();ctx.stroke();
      blob(r*.8,'#8a62b0');ctx.fillStyle='#ff5a5a';ctx.beginPath();ctx.arc(3,-1,1.6,0,7);ctx.arc(-1,-1,1.6,0,7);ctx.fill();
      ctx.fillStyle='#8a62b0';ctx.beginPath();ctx.moveTo(-3,-r*.7);ctx.lineTo(-2,-r-3);ctx.lineTo(0,-r*.7);ctx.moveTo(1,-r*.7);ctx.lineTo(3,-r-3);ctx.lineTo(4,-r*.6);ctx.fill();break;}
    case 'dragon':{
      const w=Math.sin(a*7);
      ctx.fillStyle='#a8302a';ctx.beginPath();ctx.moveTo(-4,0);ctx.quadraticCurveTo(-10,-30-w*10,-34,-24-w*14);ctx.quadraticCurveTo(-20,-10,-14,2);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-4,0);ctx.quadraticCurveTo(-10,30+w*10,-34,24+w*14);ctx.quadraticCurveTo(-20,10,-14,-2);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.strokeStyle=d.col;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,0);ctx.quadraticCurveTo(-26,Math.sin(a*5)*8,-40,Math.sin(a*5+1)*10);ctx.stroke();ctx.strokeStyle=INK;ctx.lineWidth=2;
      ctx.fillStyle=lg(0,-16,0,16,[[0,'#f06a58'],[1,'#a8302a']]);ctx.beginPath();ctx.ellipse(0,0,19,11,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.ellipse(1,4,14,5,0,0,7);ctx.fill();
      ctx.fillStyle=d.col;ctx.beginPath();ctx.ellipse(20,-2,9,7,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffdd55';ctx.beginPath();ctx.moveTo(18,-8);ctx.lineTo(20,-15);ctx.lineTo(23,-8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(22,-4,2.5,0,7);ctx.fill();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(23,-4,1.2,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,150,40,'+(.5+.3*Math.sin(a*12))+')';ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(36,-3);ctx.lineTo(34,2);ctx.fill();break;}
    default:blob(r,d.col);eyes(r);
  }
  ctx.filter='none';
  // khiên
  if(e.shieldMax&&e.shield>0){
    ctx.strokeStyle='rgba(120,200,255,'+(0.35+0.5*e.shield/e.shieldMax)+')';ctx.lineWidth=3;
    ctx.fillStyle='rgba(120,200,255,.12)';ctx.beginPath();ctx.arc(0,0,r+6,0,7);ctx.fill();ctx.stroke();
  }
  let ri=0;
  for(const dot of e.dots){ctx.strokeStyle=dot.color;ctx.lineWidth=2;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(0,0,r+4+ri*3,0,7);ctx.stroke();ri++;}
  ctx.globalAlpha=d.stealth?.55:1;
  if(e.slowT>0){ctx.strokeStyle='#8be8f5';ctx.fillStyle='rgba(140,232,245,.22)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r+3,0,7);ctx.fill();ctx.stroke();}
  if(e.haste>1){ctx.strokeStyle='rgba(120,170,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r-6,-4);ctx.lineTo(-r-14,-4);ctx.moveTo(-r-6,4);ctx.lineTo(-r-14,4);ctx.stroke();}
  ctx.restore();
  // thanh máu
  const w=Math.max(18,r*2+6),x=e.x-w/2,y=e.y-r-(d.air?14:10);
  ctx.fillStyle=INK;rr(x-1.5,y-1.5,w+3,7,3);ctx.fill();
  ctx.fillStyle='#e04a4a';rr(x,y,w,4,2);ctx.fill();
  const pct=clamp(e.hp/e.max,0,1);ctx.fillStyle=pct>.5?'#4de04d':pct>.25?'#ffd93b':'#ff7a3a';
  if(pct>0){rr(x,y,Math.max(3,w*pct),4,2);ctx.fill();}
  if(e.shieldMax&&e.shield>0){ctx.fillStyle='#0a2a4a';ctx.fillRect(x-1,y+6,w+2,4);ctx.fillStyle='#4aa8ff';ctx.fillRect(x,y+7,w*clamp(e.shield/e.shieldMax,0,1),2);}
}

function jag(x1,y1,x2,y2,amp){
  const n=Math.max(3,Math.floor(Math.hypot(x2-x1,y2-y1)/14));ctx.beginPath();ctx.moveTo(x1,y1);
  for(let i=1;i<n;i++){const u=i/n;ctx.lineTo(x1+(x2-x1)*u+(Math.random()-.5)*amp,y1+(y2-y1)*u+(Math.random()-.5)*amp);}
  ctx.lineTo(x2,y2);
}
function draw(){
  ctx.drawImage(bg,0,0);
  drawPath();drawGates();
  if(build&&hover){
    const [hc,hr]=hover,bad=canPlace(hc,hr),T=TYPES[build];
    ctx.fillStyle=bad?'rgba(220,40,40,.4)':'rgba(255,255,255,.4)';rr(hc*CS+2,hr*CS+2,CS-4,CS-4,6);ctx.fill();
    ctx.strokeStyle=bad?'rgba(220,40,40,.9)':'rgba(255,255,255,.95)';ctx.lineWidth=2;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.arc(hc*CS+CS/2,hr*CS+CS/2,T.range*CS,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=.6;drawTower({type:build,lvl:1,ang:0},hc*CS+CS/2,hr*CS+CS/2,gtime,false);ctx.globalAlpha=1;
  }
  towers.slice().sort((a,b)=>a.y-b.y).forEach(t=>{
    drawTower(t,t.x,t.y,gtime,false);
    if(t.bD>0){ctx.strokeStyle='rgba(53,208,160,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y-24,3.5,0,7);ctx.stroke();ctx.fillStyle='#35d0a0';ctx.fillRect(t.x-1,t.y-28,2,8);}
    if(t===sel){
      ctx.strokeStyle='#ffd93b';ctx.lineWidth=3.5;rr(t.x-20,t.y-20,40,40,9);ctx.stroke();
      const R=t.type==='radar'?(t.rangeNow||TYPES.radar.range*CS):stat(t).range;
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(t.x,t.y,R,0,7);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.stroke();ctx.setLineDash([]);
    }
  });
  for(const e of enemies)if(!e.def.air)drawEnemy(e);
  for(const p of projs){
    if(p.mortar){
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x,p.y,5,2.5,0,0,7);ctx.fill();
      ctx.fillStyle='#444';ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y-p.z,6,0,7);ctx.fill();ctx.stroke();continue;}
    if(p.kind==='missile'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang||0);ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=1.5;rr(-6,-2.5,12,5,2);ctx.fill();ctx.stroke();ctx.fillStyle=p.c;ctx.beginPath();ctx.moveTo(6,-2.5);ctx.lineTo(10,0);ctx.lineTo(6,2.5);ctx.fill();ctx.restore();continue;}
    if(p.kind==='cannon'){ctx.fillStyle='#2a2a30';ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#ffb36b';ctx.beginPath();ctx.arc(p.x-1.5,p.y-1.5,2,0,7);ctx.fill();continue;}
    if(p.kind==='frost'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang||0);ctx.fillStyle='#d6f6ff';ctx.strokeStyle='#58d3e8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-3,-3);ctx.lineTo(-3,3);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();continue;}
    if(p.kind==='gun'){ctx.strokeStyle='#ffe27a';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-Math.cos(p.ang||0)*9,p.y-Math.sin(p.ang||0)*9);ctx.stroke();continue;}
    ctx.fillStyle=p.c;ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.stroke();
  }
  for(const e of enemies)if(e.def.air)drawEnemy(e);
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.4+.6*p.life/p.max),0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const f of fx){
    if(f.k==='beam'){ctx.strokeStyle=f.c;ctx.globalAlpha=f.life/.15;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.k==='bolt'){ctx.shadowColor=f.c;ctx.shadowBlur=12;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.globalAlpha=clamp(f.life/.2,0,1);jag(f.x1,f.y1,f.x2,f.y2,14);ctx.stroke();ctx.strokeStyle=f.c;ctx.lineWidth=5;ctx.globalAlpha*=.45;jag(f.x1,f.y1,f.x2,f.y2,14);ctx.stroke();ctx.globalAlpha=1;ctx.shadowBlur=0;}
    else if(f.k==='laser'){ctx.shadowColor=f.c;ctx.shadowBlur=14;ctx.strokeStyle=f.c;ctx.lineWidth=f.w*1.6;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=f.w*.6;ctx.globalAlpha=1;ctx.stroke();ctx.shadowBlur=0;}
    else if(f.k==='rail'){const a=clamp(f.life/(f.thin?.18:.4),0,1);ctx.shadowColor=f.c;ctx.shadowBlur=16;ctx.strokeStyle=f.c;ctx.lineWidth=(f.thin?3:12)*a;ctx.globalAlpha=.6*a;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=(f.thin?1.5:4)*a;ctx.globalAlpha=a;ctx.stroke();ctx.globalAlpha=1;ctx.shadowBlur=0;}
    else if(f.k==='boom'){const u=1-f.life/.35;ctx.fillStyle=rg(f.x,f.y,2,f.r*(.6+u*.5),[[0,'rgba(255,240,170,'+(1-u)+')'],[.5,'rgba(255,150,40,'+(.7*(1-u))+')'],[1,'rgba(255,80,20,0)']]);ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.6+u*.5),0,7);ctx.fill();}
    else if(f.k==='ring'){const u=1-f.life/.5;ctx.strokeStyle=f.c;ctx.globalAlpha=clamp(1-u,0,1);ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.3+u*.7),0,7);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.k==='txt'){ctx.fillStyle=f.c||'#ffe55c';ctx.strokeStyle=INK;ctx.lineWidth=3.5;ctx.font='800 14px Baloo 2,Segoe UI,sans-serif';ctx.textAlign='center';ctx.globalAlpha=Math.min(1,f.life*2);
      ctx.strokeText(f.t,f.x,f.y-(.8-f.life)*30);ctx.fillText(f.t,f.x,f.y-(.8-f.life)*30);ctx.globalAlpha=1;}
    else if(f.k==='flash'){ctx.fillStyle='rgba(255,0,0,'+(f.life/.35*.28)+')';ctx.fillRect(0,0,CW,CH);}
    else if(f.k==='heal'){ctx.fillStyle='rgba(120,255,140,'+(f.life/.4*.6)+')';ctx.beginPath();ctx.arc(f.x,f.y,14+(.4-f.life)*20,0,7);ctx.fill();}
    else if(f.k==='target'){ctx.strokeStyle='rgba(255,70,50,'+(.5+.4*Math.sin(f.life*20))+')';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(f.x-14,f.y);ctx.lineTo(f.x+14,f.y);ctx.moveTo(f.x,f.y-14);ctx.lineTo(f.x,f.y+14);ctx.stroke();}
    else if(f.k==='frostwave'){const u=1-f.life/.9;ctx.fillStyle='rgba(150,230,255,'+(.35*(1-u))+')';ctx.fillRect(0,0,CW,CH);ctx.strokeStyle='rgba(200,245,255,'+(1-u)+')';ctx.lineWidth=8;ctx.beginPath();ctx.arc(CW/2,CH/2,u*CW*.7,0,7);ctx.stroke();}
  }
  for(const s of strikes){ // tên lửa rơi từ trên
    const u=clamp(1-s.t/.5,0,1);if(u<=0||s.t<0)continue;
    ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.save();ctx.translate(s.x,s.y-(1-u)*260);ctx.rotate(Math.PI/2);rr(-9,-3.5,18,7,3);ctx.fill();ctx.stroke();ctx.fillStyle='#ff5a3a';ctx.beginPath();ctx.moveTo(9,-3.5);ctx.lineTo(15,0);ctx.lineTo(9,3.5);ctx.fill();ctx.restore();
  }
  if(aim&&hover){
    const x=hover[0]*CS+CS/2,y=hover[1]*CS+CS/2;
    ctx.strokeStyle='rgba(255,70,50,.9)';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(x,y,90,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);ctx.moveTo(x,y-12);ctx.lineTo(x,y+12);ctx.stroke();
  }
}

/* ================= GIAO DIỆN ================= */
function updUI(){
  $('lives').textContent=lives;$('money').textContent=money;$('wave').textContent=wave;$('total').textContent=TOTAL;
  document.querySelectorAll('.tw').forEach(b=>b.classList.toggle('poor',money<TYPES[b.dataset.t].cost));
  for(const [id,k] of [['skStrike','strike'],['skFreeze','freeze']]){
    const s=skill[k],b=$(id);b.disabled=s.cd>0;b.querySelector('.cd').style.width=(s.cd/s.max*100)+'%';
  }
  if(sel)showInfo();
}
function pulse(id){const el=$(id);el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}
let msgT;
function showMsg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity=0,1800);}
function showPreview(){
  const el=$('preview');if(wave>=TOTAL){el.innerHTML='';return;}
  const q=makeWave(wave+1),cnt={};q.forEach(s=>cnt[s.t]=(cnt[s.t]||0)+1);
  el.innerHTML='<b style="font-family:var(--gc-head)">Đợt '+(wave+1)+':</b>'+Object.entries(cnt).map(([k,v])=>'<span class="pv" title="'+EDEF[k].n+'">'+EDEF[k].ic+'×'+v+'</span>').join('');
}
function upCost(t){return Math.round(TYPES[t.type].cost*.8*t.lvl);}
function showInfo(){
  const el=$('info');
  if(sel){
    const T=TYPES[sel.type],S=stat(sel);
    let extra='';
    if(T.support){
      extra='<br>⚡ +'+Math.round((.22+.08*(sel.lvl-1))*100)+'% sát thương · +'+Math.round((.1+.04*(sel.lvl-1))*100)+'% tầm<br>👁 Lộ diện kẻ tàng hình';
      el.innerHTML='<b>'+T.name+'</b> – cấp '+sel.lvl+'/'+MAXLV+'<br>Tầm hỗ trợ: '+((TYPES.radar.range+.25*(sel.lvl-1)).toFixed(1))+' ô'+extra;
    }else{
      if(T.burnDps)extra+='<br>🔥 Cháy: '+Math.round(T.burnDps*(1+.6*(sel.lvl-1)))+'/giây';
      if(T.poisonDps)extra+='<br>☠ Độc: '+Math.round(T.poisonDps*(1+.6*(sel.lvl-1)))+'/giây';
      if(T.chain)extra+='<br>⚡ Lan sang '+(T.chain+Math.floor(sel.lvl/2))+' mục tiêu';
      if(T.pierce)extra+='<br>🗡 Xuyên giáp';
      if(T.splash)extra+='<br>💥 Nổ lan '+Math.round(T.splash*(1+.06*(sel.lvl-1)))+'px';
      if(T.slow)extra+='<br>❄ Làm chậm '+Math.round((1-Math.max(.18,T.slow-.07*(sel.lvl-1)))*100)+'%';
      if(T.laser)extra+='<br>🔴 Càng bắn lâu càng mạnh (tối đa x4.4)';
      if(T.rail)extra+='<br>➖ Xuyên mọi kẻ địch trên đường bắn';
      if(sel.bD>0)extra+='<br>📡 Buff radar: +'+Math.round(sel.bD*100)+'% sát thương';
      const dps=T.laser?S.dmg:T.rail||T.hit||T.mortar?S.dmg/S.rate:S.dmg/S.rate;
      el.innerHTML='<b>'+T.name+'</b> – cấp '+sel.lvl+'/'+MAXLV+'<br>'+(T.laser?'DPS: ':'Sát thương: ')+S.dmg.toFixed(0)+(T.laser?'/giây':'')+' | Tầm: '+(S.range/CS).toFixed(1)+' ô'+(T.laser?'':'<br>Tốc độ bắn: '+(1/S.rate).toFixed(1)+'/giây')+extra;
    }
    el.innerHTML+='<div class="row">'+(sel.lvl<MAXLV?'<button class="btn mint" id="up" '+(money<upCost(sel)?'disabled':'')+'>⬆ Nâng cấp ('+upCost(sel)+'💰)</button>':'<span>⭐ Đã tối đa</span>')
      +(T.support?'':'<button class="btn alt" id="mode">🎯 '+MODES[sel.mode||0]+'</button>')
      +'<button class="btn red" id="sell">Bán (+'+Math.round(sel.spent*.7)+')</button></div>';
    const u=$('up');if(u)u.onclick=()=>{const c=upCost(sel);if(money>=c&&sel.lvl<MAXLV){pay(c);sel.spent+=c;sel.lvl++;particles(sel.x,sel.y,14,'#ffd93b',120,.6,3);fx.push({k:'ring',x:sel.x,y:sel.y,life:.5,c:'#ffd93b',r:40});}};
    const md=$('mode');if(md)md.onclick=()=>{sel.mode=((sel.mode||0)+1)%3;showInfo();};
    $('sell').onclick=()=>{earn(Math.round(sel.spent*.7));blocked[sel.c][sel.r]=false;towers=towers.filter(t=>t!==sel);sel=null;setDist(bfs(blocked));updUI();showInfo();};
  }else if(build){
    const T=TYPES[build];
    el.innerHTML='<b>'+T.name+'</b> – '+T.cost+'💰<br>'+T.desc+'<br>Nhấn vào cánh đồng để đặt. Chuột phải / Esc để hủy.';
  }else if(aim){
    el.innerHTML='<b>🚀 Không kích</b><br>Chạm vào khu vực muốn ném bom (sát thương 260 × 6 quả, xuyên giáp).';
  }else{
    el.innerHTML='Chọn một loại vũ khí rồi nhấn vào cánh đồng để xây. Địch đi vòng quanh tháp – hãy xây mê cung để kéo dài đường đi! Nhấn vào tháp để nâng cấp (tối đa '+MAXLV+' sao) hoặc bán.';
  }
}
function buildBar(){
  const box=$('towers');box.innerHTML='';
  Object.entries(TYPES).forEach(([k,T],i)=>{
    const b=document.createElement('button');b.className='tw';b.dataset.t=k;
    b.innerHTML='<canvas width="88" height="88"></canvas><div class="tx"><b>'+T.name+'</b><span>'+T.cost+' 💰 <span class="k">['+KEYS[i]+']</span></span></div>';
    b.title=T.desc;
    b.onclick=()=>pickBuild(k);box.appendChild(b);
    // icon vẽ từ chính hàm vẽ tháp
    const ic=b.querySelector('canvas'),old=ctx;ctx=ic.getContext('2d');ctx.scale(88/44,88/44);
    ctx.clearRect(0,0,44,44);ctx.save();ctx.translate(0,0);drawTower({type:k,lvl:1,ang:0},22,21,0,true);ctx.restore();ctx=old;
  });
}
function pickBuild(k){
  build=build===k?null:k;sel=null;aim=null;$('skStrike').classList.remove('aim');
  document.querySelectorAll('.tw').forEach(b=>b.classList.toggle('sel',b.dataset.t===build));
  showInfo();
}
function clearPick(){build=null;sel=null;aim=null;$('skStrike').classList.remove('aim');document.querySelectorAll('.tw').forEach(b=>b.classList.remove('sel'));showInfo();}
function mpos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height];}
cv.addEventListener('mousemove',e=>{const [x,y]=mpos(e);hover=[Math.floor(x/CS),Math.floor(y/CS)];});
cv.addEventListener('mouseleave',()=>hover=null);
cv.addEventListener('contextmenu',e=>{e.preventDefault();clearPick();});
cv.addEventListener('click',e=>{
  if(over||!started)return;
  const [x,y]=mpos(e),c=Math.floor(x/CS),r=Math.floor(y/CS);hover=[c,r];
  if(aim){castStrike(c*CS+CS/2,r*CS+CS/2);showInfo();return;}
  const t=towers.find(t=>t.c===c&&t.r===r);
  if(t){sel=t;build=null;document.querySelectorAll('.tw').forEach(b=>b.classList.remove('sel'));showInfo();return;}
  if(build){
    const T=TYPES[build];
    if(money<T.cost){showMsg(HOSTED?'Không đủ xu trong túi tiền!':'Không đủ tiền!');return;}
    const bad=canPlace(c,r);
    if(bad){showMsg(bad);return;}
    pay(T.cost);blocked[c][r]=true;setDist(bfs(blocked));
    towers.push({c,r,x:c*CS+CS/2,y:r*CS+CS/2,type:build,lvl:1,cd:0,ang:0,spent:T.cost,mode:0,rec:0});
    particles(c*CS+CS/2,r*CS+CS/2,10,'#e8dcc0',90,.45,3);
    updUI();
  }else{sel=null;showInfo();}
});
function toggleStrike(){
  if(skill.strike.cd>0){showMsg('Không kích đang hồi chiêu');return;}
  aim=aim?null:true;build=null;sel=null;$('skStrike').classList.toggle('aim',!!aim);
  document.querySelectorAll('.tw').forEach(b=>b.classList.remove('sel'));showInfo();
}
addEventListener('keydown',e=>{
  if(!started||document.getElementById('gc-start'))return;
  const k=KEYS.indexOf(e.key);
  if(k>=0&&k<Object.keys(TYPES).length)pickBuild(Object.keys(TYPES)[k]);
  if(e.key==='Escape')clearPick();
  if(e.key===' '){e.preventDefault();startWave();}
  if(e.key==='q'||e.key==='Q')toggleStrike();
  if(e.key==='e'||e.key==='E')castFreeze();
});
$('go').onclick=startWave;
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'⏸';};
$('speed').onclick=()=>{speed=speed%3+1;$('speed').textContent='x'+speed;};
$('restart').onclick=()=>{if(confirm('Chơi lại từ đầu ở độ khó '+GC.diff.label+'?'))reset();};
$('skStrike').onclick=toggleStrike;
$('skFreeze').onclick=castFreeze;
$('homeBackBtn').onclick=GC.quit;

function fit(){
  const f=$('field'),cs=getComputedStyle(f);
  const aw=f.clientWidth-12,ah=f.clientHeight-12;
  const w=Math.max(280,Math.min(aw,ah*CW/CH));
  cv.style.width=w+'px';cv.style.height=(w*CH/CW)+'px';
}
addEventListener('resize',fit);

/* ================= KHỞI ĐỘNG ================= */
function init(){
  const i=GC.i;
  D={
    lives:GC.by(30,20,12,6),
    money:GC.by(350,220,160,110),
    hp:GC.by(.75,1,1.3,1.7),
    spd:GC.by(.92,1,1.08,1.16),
    rw:GC.by(1.25,1,.9,.8),
    bonus:GC.by(1.3,1,.85,.7)
  };
  TOTAL=GC.by(20,25,30,35);
  started=true;
  $('chipSlot').innerHTML=GC.chip();
  buildBar();makeBg();reset();fit();
  let last=performance.now();
  function loop(now){
    let dt=Math.min(.1,(now-last)/1000)*speed;last=now;
    while(dt>0){const s=Math.min(dt,.025);update(s);dt-=s;}
    for(const k in skill){}
    if(Math.floor(now/100)!==init.t){init.t=Math.floor(now/100);updSkills();}
    draw();requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
function updSkills(){for(const [id,k] of [['skStrike','strike'],['skFreeze','freeze']]){const s=skill[k],b=$(id);b.disabled=s.cd>0&&!over?true:false;b.querySelector('.cd').style.width=(s.cd/s.max*100)+'%';}}

// nền tạm trong lúc chọn độ khó
D={lives:20,money:200,hp:1,spd:1,rw:1,bonus:1};makeBg();buildBar();fit();
ctx.drawImage(bg,0,0);
GC.start({
  id:'fieldrunner',name:'Phòng thủ cánh đồng',icon:'🌾',
  desc:'Xây tháp, dựng mê cung và ngăn kẻ địch tràn vào cánh đồng. 12 loại vũ khí, 20+ loại lính và 2 kỹ năng hỗ trợ.',
  levels:[
    '20 đợt · 30 mạng · 350💰 · địch yếu & chậm',
    '25 đợt · 20 mạng · 220💰 · cân bằng',
    '30 đợt · 12 mạng · 160💰 · địch trâu & nhanh',
    '35 đợt · 6 mạng · 110💰 · địch cực trâu, thưởng ít'
  ],
  onStart:init
});
})();
</script>
