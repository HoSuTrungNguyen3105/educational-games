    <script>
/* =====================================================
   render-background.js · nền cánh đồng, đường đi, cổng,
   ánh sáng môi trường (mây, phấn hoa, lá bay)
   ===================================================== */

/* ---------- Các hàm vẽ cơ bản dùng chung ---------- */

/** Hình chữ nhật bo góc */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** Gradient tuyến tính từ danh sách mốc màu */
function lg(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(s => g.addColorStop(s[0], s[1]));
  return g;
}

/** Gradient tròn từ danh sách mốc màu */
function rg(x, y, r0, r1, stops) {
  const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach(s => g.addColorStop(s[0], s[1]));
  return g;
}

/** Đường zig-zag (dùng cho tia sét) */
function jag(x1, y1, x2, y2, amp) {
  const n = Math.max(3, Math.floor(Math.hypot(x2 - x1, y2 - y1) / 14));

  ctx.beginPath();
  ctx.moveTo(x1, y1);

  for (let i = 1; i < n; i++) {
    const u = i / n;
    ctx.lineTo(
      x1 + (x2 - x1) * u + (Math.random() - 0.5) * amp,
      y1 + (y2 - y1) * u + (Math.random() - 0.5) * amp
    );
  }

  ctx.lineTo(x2, y2);
}

/* =====================================================
   NỀN TĨNH (vẽ một lần vào canvas phụ)
   ===================================================== */
let bg;          // nền cỏ
let lightLayer;  // lớp ánh sáng / bóng mờ phủ lên trên cùng

function makeBg() {
  bg = document.createElement('canvas');
  bg.width = CW;
  bg.height = CH;

  const g = bg.getContext('2d');
  const rand = seededRandom(12345);

  /** Ô địa hình (đá/nước/cây/nhà) — không rải cỏ dại, hoa, nấm lên trên */
  const onProp = (x, y) => {
    const c = (x / CS) | 0;
    const r = (y / CS) | 0;
    return !!(blocked && blocked[c] && blocked[c][r]);
  };

  /* ----- Ô cỏ caro nhẹ + đốm màu ----- */
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      g.fillStyle = (c + r) % 2 ? PAL.grass[0] : PAL.grass[1];
      g.fillRect(c * CS, r * CS, CS, CS);
    }
  }

  for (let i = 0; i < 90; i++) {
    const x = rand() * CW;
    const y = rand() * CH;
    const r = 18 + rand() * 40;

    g.fillStyle = rand() < 0.5 ? 'rgba(255,255,170,.07)' : 'rgba(30,90,30,.08)';
    g.beginPath();
    g.ellipse(x, y, r, r * 0.6, rand() * 3, 0, 7);
    g.fill();
  }

  /* ----- Cỏ dại ----- */
  for (let i = 0; i < 320; i++) {
    const x = rand() * CW;
    const y = rand() * CH;
    if (onProp(x, y)) continue;

    g.strokeStyle = rand() < 0.5 ? '#58a041' : '#8ed86c';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x - 2, y - 5);
    g.moveTo(x, y);
    g.lineTo(x + 2, y - 6);
    g.moveTo(x, y);
    g.lineTo(x, y - 7);
    g.stroke();
  }

  /* ----- Hoa ----- */
  const colors = ['#ffffff', '#ffd93b', '#ff8fb3', '#b9a3ff'];

  for (let i = 0; i < 90; i++) {
    const x = rand() * CW;
    const y = rand() * CH;
    if (onProp(x, y)) continue;

    g.fillStyle = colors[(rand() * 4) | 0];
    for (let k = 0; k < 5; k++) {
      g.beginPath();
      g.arc(x + Math.cos(k * 1.256) * 2.4, y + Math.sin(k * 1.256) * 2.4, 1.7, 0, 7);
      g.fill();
    }

    g.fillStyle = '#ffb300';
    g.beginPath();
    g.arc(x, y, 1.3, 0, 7);
    g.fill();
  }

  /* ----- Đá nhỏ ----- */
  for (let i = 0; i < 34; i++) {
    const x = rand() * CW;
    const y = rand() * CH;
    if (onProp(x, y)) continue;

    g.fillStyle = 'rgba(0,0,0,.15)';
    g.beginPath();
    g.ellipse(x + 1, y + 2, 5, 2.5, 0, 0, 7);
    g.fill();

    g.fillStyle = lg2(g, x, y - 3, x, y + 3, '#c9cec6', '#9aa098');
    g.beginPath();
    g.ellipse(x, y, 4.5, 3, 0, 0, 7);
    g.fill();

    g.strokeStyle = 'rgba(0,0,0,.35)';
    g.lineWidth = 1;
    g.stroke();
  }

  /* ----- Bụi cây & nấm ----- */
  for (let i = 0; i < 26; i++) {
    const x = rand() * CW;
    const y = rand() * CH;
    if (!onProp(x, y)) drawBush(g, x, y, 7 + rand() * 6);
  }

  for (let i = 0; i < 16; i++) {
    const x = rand() * CW;
    const y = rand() * CH;
    if (!onProp(x, y)) drawMushroom(g, x, y);
  }

  /* ----- Địa hình của màn (cây, đá, ao, sông, rào, nhà kho) ----- */
  drawTerrain(g);

  /* ----- Hàng cây viền trên & dưới bản đồ ----- */
  for (let x = 14; x < CW; x += 38 + rand() * 26) {
    drawTree(g, x, 8 + rand() * 6, 0.9 + rand() * 0.4);
  }
  for (let x = 20; x < CW; x += 38 + rand() * 26) {
    drawTree(g, x, CH - 10 - rand() * 6, 0.9 + rand() * 0.4);
  }

  /* ----- Lớp ánh sáng phủ ----- */
  makeLightLayer();
}

/** Gradient tuyến tính trên ngữ cảnh g bất kỳ */
function lg2(g, x0, y0, x1, y1, a, b) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, a);
  gr.addColorStop(1, b);
  return gr;
}

function drawBush(g, x, y, r) {
  g.fillStyle = 'rgba(0,0,0,.16)';
  g.beginPath();
  g.ellipse(x + 2, y + r * 0.6, r * 1.3, r * 0.5, 0, 0, 7);
  g.fill();

  const cols = ['#3f9a3a', '#4fb046', '#5fc656'];
  for (let k = 0; k < 3; k++) {
    g.fillStyle = cols[k];
    g.beginPath();
    g.arc(x + (k - 1) * r * 0.7, y - k * 0.8, r * (0.85 - k * 0.1), 0, 7);
    g.fill();
  }

  g.strokeStyle = 'rgba(20,70,20,.55)';
  g.lineWidth = 1;
  g.beginPath();
  g.arc(x - r * 0.7, y, r * 0.85, 0.2, 5.8);
  g.stroke();
}

function drawMushroom(g, x, y) {
  g.fillStyle = '#f4ead2';
  g.fillRect(x - 1.2, y, 2.4, 4);

  g.fillStyle = '#e04a3a';
  g.beginPath();
  g.arc(x, y, 4, Math.PI, 0);
  g.closePath();
  g.fill();

  g.fillStyle = '#fff';
  g.beginPath();
  g.arc(x - 1.5, y - 1.6, 0.9, 0, 7);
  g.arc(x + 1.6, y - 2, 0.7, 0, 7);
  g.fill();
}

function drawTree(g, x, y, s) {
  g.fillStyle = 'rgba(0,0,0,.2)';
  g.beginPath();
  g.ellipse(x + 3, y + 12 * s, 17 * s, 6 * s, 0, 0, 7);
  g.fill();

  g.fillStyle = '#7a4f2a';
  g.fillRect(x - 3 * s, y, 6 * s, 14 * s);

  const tones = ['#2f8a3a', '#3fa047', '#58bf55'];
  const spots = [[-9, 0, 12], [9, 1, 12], [0, -9, 14]];

  spots.forEach((p, i) => {
    g.fillStyle = tones[i];
    g.beginPath();
    g.arc(x + p[0] * s, y + p[1] * s, p[2] * s, 0, 7);
    g.fill();
  });

  g.fillStyle = 'rgba(255,255,200,.22)';
  g.beginPath();
  g.arc(x - 3 * s, y - 13 * s, 6 * s, 0, 7);
  g.fill();
}

/** Lớp ánh sáng: nắng ấm từ trên-trái và tối dần ở rìa */
function makeLightLayer() {
  lightLayer = document.createElement('canvas');
  lightLayer.width = CW;
  lightLayer.height = CH;

  const g = lightLayer.getContext('2d');

  // Màu riêng của từng cánh đồng (hoàng hôn, mùa gặt…)
  if (PAL.wash) {
    g.fillStyle = PAL.wash;
    g.fillRect(0, 0, CW, CH);
  }

  const sun = g.createRadialGradient(CW * 0.2, -40, 20, CW * 0.2, -40, CW * 0.9);
  sun.addColorStop(0, 'rgba(255,240,170,.28)');
  sun.addColorStop(1, 'rgba(255,240,170,0)');
  g.fillStyle = sun;
  g.fillRect(0, 0, CW, CH);

  const vg = g.createRadialGradient(CW / 2, CH / 2, CH * 0.35, CW / 2, CH / 2, CH * 1.0);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,40,20,.34)');
  g.fillStyle = vg;
  g.fillRect(0, 0, CW, CH);
}

/* =====================================================
   ĐƯỜNG ĐI (vẽ mỗi khung vì người chơi xây mê cung)
   ===================================================== */
function strokePath() {
  ctx.beginPath();
  pathPts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
}

function drawPath() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Bóng đổ
  strokePath();
  ctx.strokeStyle = 'rgba(40,25,5,.28)';
  ctx.lineWidth = 38;
  ctx.stroke();

  // Viền đất tối
  strokePath();
  ctx.strokeStyle = PAL.soil[0];
  ctx.lineWidth = 34;
  ctx.stroke();

  // Viền sáng
  strokePath();
  ctx.strokeStyle = PAL.soil[1];
  ctx.lineWidth = 30;
  ctx.stroke();

  // Mặt đường
  strokePath();
  ctx.strokeStyle = PAL.soil[2];
  ctx.lineWidth = 26;
  ctx.stroke();

  // Lòng đường sáng hơn
  strokePath();
  ctx.strokeStyle = PAL.soil[3];
  ctx.lineWidth = 16;
  ctx.stroke();

  // Sỏi nhỏ rải trên đường
  ctx.setLineDash([1, 11]);
  strokePath();
  ctx.strokeStyle = 'rgba(120,85,40,.55)';
  ctx.lineWidth = 9;
  ctx.stroke();

  ctx.lineDashOffset = -5;
  strokePath();
  ctx.strokeStyle = 'rgba(255,255,255,.4)';
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.lineDashOffset = 0;
  ctx.setLineDash([]);

  // Mũi tên chỉ hướng chạy dọc đường
  ctx.fillStyle = 'rgba(255,255,255,.6)';

  const off = (gtime * 40) % 80;
  let acc = 0;

  for (let i = 1; i < pathPts.length; i++) {
    const a = pathPts[i - 1];
    const b = pathPts[i];
    const l = Math.hypot(b[0] - a[0], b[1] - a[1]);

    if (!l) continue;

    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);

    for (let s = (80 - ((acc + off) % 80)) % 80; s < l; s += 80) {
      const x = a[0] + Math.cos(ang) * s;
      const y = a[1] + Math.sin(ang) * s;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(5, 0);
      ctx.lineTo(-3, -4);
      ctx.lineTo(-3, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    acc += l;
  }
}

/* =====================================================
   CỔNG VÀO / CỔNG RA
   ===================================================== */
function drawGates() {
  const pulse = 0.5 + 0.5 * Math.sin(gtime * 3);

  /* ----- Cổng vào (chuồng gỗ đỏ) ----- */
  ctx.save();
  ctx.translate(0, SR * CS);

  // Vầng sáng cảnh báo
  ctx.fillStyle = rg(CS / 2, CS / 2, 4, 44, [
    [0, 'rgba(255,90,70,' + (0.25 + pulse * 0.2) + ')'],
    [1, 'rgba(255,90,70,0)']
  ]);
  ctx.beginPath();
  ctx.arc(CS / 2, CS / 2, 44, 0, 7);
  ctx.fill();

  ctx.fillStyle = lg(0, 0, 0, CS, [[0, '#e8625a'], [1, '#a83a33']]);
  rr(-6, -4, CS - 2, CS + 8, 6);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Vạch gỗ
  ctx.strokeStyle = 'rgba(0,0,0,.25)';
  ctx.lineWidth = 1.5;
  for (let y = 6; y < CS + 4; y += 8) {
    ctx.beginPath();
    ctx.moveTo(-3, y - 4);
    ctx.lineTo(CS - 6, y - 4);
    ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.font = '800 11px Baloo 2,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('VÀO', CS / 2 - 6, CS / 2 + 4);
  ctx.restore();

  /* ----- Cổng ra (ruộng xanh) ----- */
  ctx.save();
  ctx.translate(GOALC * CS, GR * CS);

  ctx.fillStyle = rg(CS / 2, CS / 2, 4, 46, [
    [0, 'rgba(80,170,255,' + (0.25 + pulse * 0.2) + ')'],
    [1, 'rgba(80,170,255,0)']
  ]);
  ctx.beginPath();
  ctx.arc(CS / 2, CS / 2, 46, 0, 7);
  ctx.fill();

  ctx.fillStyle = lg(0, 0, 0, CS, [[0, '#5aaaff'], [1, '#2f6fd0']]);
  rr(4, -4, CS + 8, CS + 8, 6);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = '800 11px Baloo 2,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('RA', CS / 2 + 4, CS / 2 + 4);
  ctx.restore();
}

/* =====================================================
   MÔI TRƯỜNG: bóng mây, phấn hoa, lá bay
   ===================================================== */
const ambient = [];

(function initAmbient() {
  const rand = seededRandom(777);

  for (let i = 0; i < 26; i++) {
    ambient.push({
      x: rand() * CW,
      y: rand() * CH,
      s: 1 + rand() * 2,
      sp: 8 + rand() * 14,
      ph: rand() * 6.28,
      leaf: rand() < 0.35
    });
  }
})();

const clouds = [
  { x: 120, y: 180, w: 190, h: 70, sp: 6 },
  { x: 560, y: 420, w: 240, h: 85, sp: 4 },
  { x: 820, y: 90,  w: 170, h: 60, sp: 8 }
];

/** Bóng mây trôi trên cánh đồng */
function drawClouds(dt) {
  ctx.fillStyle = 'rgba(20,50,30,.07)';

  for (const c of clouds) {
    c.x += c.sp * dt;
    if (c.x - c.w > CW) c.x = -c.w;

    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w, c.h, 0, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w * 0.5, c.y + c.h * 0.2, c.w * 0.6, c.h * 0.7, 0, 0, 7);
    ctx.fill();
  }
}

/** Phấn hoa / lá lơ lửng */
function drawAmbient(dt) {
  for (const a of ambient) {
    a.x += a.sp * dt;
    a.y += Math.sin(gtime * 1.4 + a.ph) * 6 * dt;

    if (a.x > CW + 10) a.x = -10;

    if (a.leaf) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(gtime * 1.5 + a.ph);
      ctx.fillStyle = 'rgba(120,200,70,.75)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 3.4, 1.6, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(255,255,210,.7)';
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.s * 0.8, 0, 7);
      ctx.fill();
    }
  }
}

    <!-- js/render-terrain.js -->
    <script>
/* =====================================================
   render-terrain.js · vẽ địa hình của màn chơi lên nền tĩnh
   (cây, đá, nước, hàng rào, nhà kho, ruộng cày, khóm hoa)
   ===================================================== */

/** Ô (c,r) có đúng loại k không — ra ngoài bản đồ coi như ô trống */
function kAt(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS || !kinds) return '.';
  return kinds[c][r];
}

const isK = (c, r, k) => kAt(c, r) === k;

/** Duyệt mọi ô mang loại k */
function eachKind(k, fn) {
  if (!kinds) return;

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      if (kinds[c][r] === k) fn(c, r);
    }
  }
}

/** Số ngẫu nhiên cố định theo ô — nền vẽ lại vẫn giống nhau */
function cellRand(c, r, i) {
  const rand = seededRandom(c * 73856093 ^ r * 19349663 ^ (i || 0) * 83492791);
  return rand();
}

/* =====================================================
   NƯỚC (ao, sông) — các ô ghép thành một khối bo tròn, không lộ mạch
   ===================================================== */
function waterCellPath(path, c, r) {
  const x = c * CS - 2, y = r * CS - 2, s = CS + 4;

  if (path.roundRect) path.roundRect(x, y, s, s, 16);
  else path.rect(x, y, s, s);
}

function drawWater(g) {
  const path = new Path2D();
  let any = false;

  eachKind('w', (c, r) => {
    waterCellPath(path, c, r);
    any = true;
  });

  if (!any) return;

  // Bờ cát/đất quanh mặt nước
  g.lineJoin = 'round';
  g.strokeStyle = '#b79b62';
  g.lineWidth = 11;
  g.stroke(path);

  // Mặt nước: tô một lần cho toàn khối → không có đường nối giữa các ô
  const grad = g.createLinearGradient(0, 0, CW * 0.3, CH);
  grad.addColorStop(0, PAL.water[0]);
  grad.addColorStop(1, PAL.water[1]);

  g.save();
  g.fillStyle = grad;
  g.fill(path);
  g.clip(path);

  // Đáy tối dần về phía dưới + bóng sát mép
  const deep = g.createLinearGradient(0, 0, 0, CH);
  deep.addColorStop(0, 'rgba(255,255,255,.25)');
  deep.addColorStop(1, 'rgba(10,60,90,.28)');
  g.fillStyle = deep;
  g.fillRect(0, 0, CW, CH);

  g.strokeStyle = 'rgba(12,60,90,.4)';
  g.lineWidth = 7;
  g.stroke(path);

  // Gợn sóng + lá sen
  eachKind('w', (c, r) => {
    const x = c * CS, y = r * CS;

    if (cellRand(c, r, 1) < 0.6) {
      g.strokeStyle = 'rgba(255,255,255,.5)';
      g.lineWidth = 1.8;
      const sy = y + 8 + cellRand(c, r, 2) * 20;
      g.beginPath();
      g.moveTo(x + 6, sy);
      g.quadraticCurveTo(x + CS / 2, sy - 4, x + CS - 6, sy);
      g.stroke();
    }

    if (cellRand(c, r, 3) < 0.25) {
      g.fillStyle = '#4fae4a';
      g.beginPath();
      g.ellipse(x + CS * 0.5, y + CS * 0.55, 8, 5, 0.4, 0, 7);
      g.fill();

      g.fillStyle = '#ff9fc0';
      g.beginPath();
      g.arc(x + CS * 0.5, y + CS * 0.5, 2.6, 0, 7);
      g.fill();
    }
  });

  g.restore();

  // Lau sậy mọc trên bờ, phía trên khối nước
  eachKind('w', (c, r) => {
    if (isK(c, r - 1, 'w') || cellRand(c, r, 4) > 0.5) return;

    const x = c * CS + 6 + cellRand(c, r, 5) * (CS - 12);
    const y = r * CS - 4;

    g.strokeStyle = '#3f8a3a';
    g.lineWidth = 1.8;
    for (let i = -1; i <= 1; i++) {
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + i * 4, y - 9, x + i * 7, y - 16);
      g.stroke();
    }
  });
}

/* =====================================================
   CẦU GỖ (ô 'j': địch đi qua, không xây được)
   ===================================================== */
function drawBridges(g) {
  eachKind('j', (c, r) => {
    const x = c * CS, y = r * CS;

    g.fillStyle = '#8a5a3a';
    g.fillRect(x, y, CS, CS);

    g.fillStyle = '#b1854f';
    for (let i = 0; i < 4; i++) {
      g.fillRect(x + 2, y + 2 + i * 10, CS - 4, 7);
    }

    g.strokeStyle = 'rgba(28,27,58,.75)';
    g.lineWidth = 2;
    g.strokeRect(x + 0.5, y + 0.5, CS - 1, CS - 1);

    g.fillStyle = '#6a4428';
    g.fillRect(x - 3, y + 3, 5, CS - 6);
    g.fillRect(x + CS - 2, y + 3, 5, CS - 6);
  });
}

/* =====================================================
   RUỘNG CÀY ('o') & KHÓM HOA ('x') — ô đẹp, vẫn xây được
   ===================================================== */
function drawFields(g) {
  eachKind('o', (c, r) => {
    const x = c * CS, y = r * CS;

    g.fillStyle = PAL.soil[2];
    g.fillRect(x, y, CS, CS);

    g.fillStyle = 'rgba(90,60,25,.35)';
    for (let i = 0; i < 4; i++) g.fillRect(x, y + 3 + i * 10, CS, 4);

    // luống đất nổi
    g.fillStyle = 'rgba(255,235,190,.25)';
    for (let i = 0; i < 4; i++) g.fillRect(x, y + 2 + i * 10, CS, 1.4);
  });

  const cols = ['#ffffff', '#ffd93b', '#ff8fb3', '#b9a3ff'];

  eachKind('x', (c, r) => {
    for (let i = 0; i < 7; i++) {
      const x = c * CS + 5 + cellRand(c, r, 10 + i) * (CS - 10);
      const y = r * CS + 6 + cellRand(c, r, 40 + i) * (CS - 12);

      g.fillStyle = cols[(cellRand(c, r, 70 + i) * 4) | 0];
      for (let k = 0; k < 5; k++) {
        g.beginPath();
        g.arc(x + Math.cos(k * 1.256) * 2.6, y + Math.sin(k * 1.256) * 2.6, 1.8, 0, 7);
        g.fill();
      }

      g.fillStyle = '#ffb300';
      g.beginPath();
      g.arc(x, y, 1.4, 0, 7);
      g.fill();
    }
  });
}

/* =====================================================
   ĐÁ ('r') — cụm 2-3 hòn
   ===================================================== */
function drawRocks(g) {
  eachKind('r', (c, r) => {
    const cx = c * CS + CS / 2;
    const cy = r * CS + CS / 2;

    g.fillStyle = 'rgba(0,0,0,.22)';
    g.beginPath();
    g.ellipse(cx + 2, cy + 10, 17, 6, 0, 0, 7);
    g.fill();

    const n = 2 + ((cellRand(c, r, 1) * 2) | 0);

    for (let i = 0; i < n; i++) {
      const ox = (cellRand(c, r, 100 + i) - 0.5) * 20;
      const oy = (cellRand(c, r, 200 + i) - 0.5) * 12;
      const rx = 8 + cellRand(c, r, 300 + i) * 7;

      const gr = g.createLinearGradient(cx + ox, cy + oy - rx, cx + ox, cy + oy + rx);
      gr.addColorStop(0, '#d3d8cf');
      gr.addColorStop(1, '#8d938c');
      g.fillStyle = gr;

      g.beginPath();
      g.ellipse(cx + ox, cy + oy, rx, rx * 0.72, cellRand(c, r, 400 + i) * 3, 0, 7);
      g.fill();

      g.strokeStyle = 'rgba(28,27,58,.5)';
      g.lineWidth = 1.6;
      g.stroke();

      g.fillStyle = 'rgba(255,255,255,.4)';
      g.beginPath();
      g.ellipse(cx + ox - rx * 0.3, cy + oy - rx * 0.35, rx * 0.35, rx * 0.16, -0.5, 0, 7);
      g.fill();
    }

    // Rêu dưới chân đá
    if (cellRand(c, r, 2) < 0.6) {
      g.fillStyle = 'rgba(60,150,70,.5)';
      g.beginPath();
      g.ellipse(cx - 6, cy + 11, 7, 2.5, 0, 0, 7);
      g.fill();
    }
  });
}

/* =====================================================
   HÀNG RÀO ('f') — ray gỗ nối theo dải ngang/dọc
   ===================================================== */
function drawFences(g) {
  eachKind('f', (c, r) => {
    const x = c * CS, y = r * CS;
    const horiz = isK(c - 1, r, 'f') || isK(c + 1, r, 'f');
    const vert = isK(c, r - 1, 'f') || isK(c, r + 1, 'f');

    g.save();
    g.translate(x + CS / 2, y + CS / 2);
    if (!horiz && vert) g.rotate(Math.PI / 2);

    // bóng đổ
    g.fillStyle = 'rgba(0,0,0,.2)';
    g.fillRect(-CS / 2 + 3, 6, CS - 6, 4);

    const wood = g.createLinearGradient(0, -12, 0, 8);
    wood.addColorStop(0, '#c99a5f');
    wood.addColorStop(1, '#8a5f31');
    g.fillStyle = wood;
    g.strokeStyle = 'rgba(28,27,58,.8)';
    g.lineWidth = 1.6;

    // 2 thanh ngang
    for (const oy of [-8, 1]) {
      g.beginPath();
      g.rect(-CS / 2 + 1, oy, CS - 2, 5);
      g.fill();
      g.stroke();
    }

    // cột rào
    for (const ox of [-CS / 2 + 3, CS / 2 - 8]) {
      g.beginPath();
      g.rect(ox, -13, 5, 20);
      g.fill();
      g.stroke();
    }

    g.restore();
  });
}

/* =====================================================
   ĐỐNG CỎ KHÔ ('h')
   ===================================================== */
function drawHay(g) {
  eachKind('h', (c, r) => {
    const cx = c * CS + CS / 2;
    const cy = r * CS + CS / 2 + 3;

    g.fillStyle = 'rgba(0,0,0,.22)';
    g.beginPath();
    g.ellipse(cx + 2, cy + 9, 15, 5, 0, 0, 7);
    g.fill();

    const gr = g.createLinearGradient(cx, cy - 14, cx, cy + 10);
    gr.addColorStop(0, '#f2d98a');
    gr.addColorStop(1, '#c2a24a');
    g.fillStyle = gr;
    g.beginPath();
    g.ellipse(cx, cy, 14, 12, 0, 0, 7);
    g.fill();
    g.strokeStyle = 'rgba(28,27,58,.7)';
    g.lineWidth = 2;
    g.stroke();

    // sợi cỏ & dây buộc
    g.strokeStyle = 'rgba(150,115,40,.7)';
    g.lineWidth = 1.2;
    for (let i = -1; i <= 1; i++) {
      g.beginPath();
      g.ellipse(cx, cy + i * 5, 13, 4, 0, 3.3, 6.1);
      g.stroke();
    }

    g.strokeStyle = '#6a4a20';
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(cx, cy, 14, 12, 0, 0, 7);
    g.moveTo(cx - 5, cy - 11);
    g.lineTo(cx - 5, cy + 11);
    g.moveTo(cx + 5, cy - 11);
    g.lineTo(cx + 5, cy + 11);
    g.stroke();
  });
}

/* =====================================================
   NHÀ KHO / NHÀ Ở / GIẾNG ('b') — tự chọn kiểu theo kích thước khối
   ===================================================== */
function drawBuildings(g) {
  if (!kinds) return;

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      if (kinds[c][r] !== 'b') continue;
      if (isK(c - 1, r, 'b') || isK(c, r - 1, 'b')) continue;   // không phải góc trên-trái

      let w = 1;
      while (isK(c + w, r, 'b')) w++;

      let h = 1;
      let grow = true;
      while (grow && r + h < ROWS) {
        grow = true;
        for (let i = 0; i < w; i++) if (!isK(c + i, r + h, 'b')) grow = false;
        if (grow) h++;
      }

      drawBuilding(g, c * CS, r * CS, w * CS, h * CS, w * h);
    }
  }
}

function drawBuilding(g, x, y, w, h, area) {
  const ink = 'rgba(28,27,58,.85)';

  g.fillStyle = 'rgba(0,0,0,.24)';
  g.beginPath();
  g.ellipse(x + w / 2 + 4, y + h - 2, w * 0.62, h * 0.2, 0, 0, 7);
  g.fill();

  /* ----- Silo / giếng: khối nhỏ ----- */
  if (area <= 2) {
    const cx = x + w / 2;
    const rx = w * 0.34;

    const gr = g.createLinearGradient(cx - rx, 0, cx + rx, 0);
    gr.addColorStop(0, '#9aa4b0');
    gr.addColorStop(0.45, '#e6ecf2');
    gr.addColorStop(1, '#8c96a2');
    g.fillStyle = gr;
    g.beginPath();
    g.rect(cx - rx, y + 10, rx * 2, h - 14);
    g.fill();
    g.strokeStyle = ink;
    g.lineWidth = 2.4;
    g.stroke();

    g.fillStyle = '#c0392b';
    g.beginPath();
    g.moveTo(cx - rx - 3, y + 11);
    g.lineTo(cx, y - 6);
    g.lineTo(cx + rx + 3, y + 11);
    g.closePath();
    g.fill();
    g.stroke();

    g.strokeStyle = 'rgba(28,27,58,.35)';
    g.lineWidth = 1.4;
    for (let i = 1; i < 4; i++) {
      g.beginPath();
      g.moveTo(cx - rx, y + 12 + i * (h - 16) / 4);
      g.lineTo(cx + rx, y + 12 + i * (h - 16) / 4);
      g.stroke();
    }
    return;
  }

  const roofH = Math.min(18, h * 0.4);
  const bodyY = y + roofH;
  const bodyH = h - roofH;

  /* ----- Thân nhà ----- */
  const wall = g.createLinearGradient(x, bodyY, x, bodyY + bodyH);

  const barn = w >= 3 * CS;
  if (barn) {
    wall.addColorStop(0, '#e8625a');
    wall.addColorStop(1, '#a8382f');
  } else {
    wall.addColorStop(0, '#f4ead2');
    wall.addColorStop(1, '#d9c9a6');
  }

  g.fillStyle = wall;
  g.beginPath();
  g.rect(x + 2, bodyY, w - 4, bodyH - 3);
  g.fill();
  g.strokeStyle = ink;
  g.lineWidth = 2.6;
  g.stroke();

  /* ----- Mái ----- */
  const roof = g.createLinearGradient(x, y, x, bodyY);
  roof.addColorStop(0, barn ? '#8a2b26' : '#b7623f');
  roof.addColorStop(1, barn ? '#c0463c' : '#8a452b');
  g.fillStyle = roof;
  g.beginPath();

  if (barn) {
    // mái gambrel (nhà kho)
    const my = y + roofH * 0.35;
    g.moveTo(x - 3, bodyY);
    g.lineTo(x + 3, my);
    g.lineTo(x + w * 0.5, y - 2);
    g.lineTo(x + w - 3, my);
    g.lineTo(x + w + 3, bodyY);
  } else {
    g.moveTo(x - 4, bodyY);
    g.lineTo(x + w / 2, y - 3);
    g.lineTo(x + w + 4, bodyY);
  }

  g.closePath();
  g.fill();
  g.stroke();

  /* ----- Cửa, sổ, vạch gỗ ----- */
  if (barn) {
    g.fillStyle = '#f6efdc';
    g.beginPath();
    g.rect(x + w * 0.5 - 9, bodyY + bodyH - 22, 18, 22);
    g.fill();
    g.stroke();

    g.strokeStyle = 'rgba(28,27,58,.5)';
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(x + w * 0.5 - 9, bodyY + bodyH - 14);
    g.lineTo(x + w * 0.5 + 9, bodyY + bodyH - 6);
    g.moveTo(x + w * 0.5 + 9, bodyY + bodyH - 14);
    g.lineTo(x + w * 0.5 - 9, bodyY + bodyH - 6);
    g.stroke();
  } else {
    g.fillStyle = '#6a4428';
    g.beginPath();
    g.rect(x + w * 0.5 - 6, bodyY + bodyH - 18, 12, 18);
    g.fill();
    g.strokeStyle = ink;
    g.lineWidth = 2;
    g.stroke();

    g.fillStyle = '#bfe8ff';
    for (const wx of [x + w * 0.22, x + w * 0.66]) {
      g.beginPath();
      g.rect(wx, bodyY + 6, 11, 11);
      g.fill();
      g.stroke();
    }
  }

  // vạch gỗ dọc thân nhà kho
  if (barn) {
    g.strokeStyle = 'rgba(0,0,0,.18)';
    g.lineWidth = 1.4;
    for (let vx = x + 8; vx < x + w - 6; vx += 8) {
      g.beginPath();
      g.moveTo(vx, bodyY + 2);
      g.lineTo(vx, bodyY + bodyH - 4);
      g.stroke();
    }
  }

  // ống khói
  if (!barn && h >= 2 * CS) {
    g.fillStyle = '#8a452b';
    g.strokeStyle = ink;
    g.lineWidth = 2;
    g.beginPath();
    g.rect(x + w * 0.72, y - 8, 8, 16);
    g.fill();
    g.stroke();
  }
}

/* =====================================================
   CÂY CỐI ('t')
   ===================================================== */
function drawMapTrees(g) {
  eachKind('t', (c, r) => {
    const x = c * CS + CS / 2 + (cellRand(c, r, 1) - 0.5) * 10;
    const y = r * CS + CS / 2 + (cellRand(c, r, 2) - 0.5) * 8;
    const s = 0.85 + cellRand(c, r, 3) * 0.4;

    if (cellRand(c, r, 4) < 0.22) {
      drawBush(g, x, y + 4, 9 + cellRand(c, r, 5) * 4);
    } else {
      drawTree(g, x, y - 2, s);
    }

    // cây ăn quả: thêm vài quả đỏ
    if (cellRand(c, r, 6) < 0.35) {
      g.fillStyle = '#e0453a';
      for (let i = 0; i < 3; i++) {
        const a = cellRand(c, r, 60 + i) * 6.283;
        g.beginPath();
        g.arc(x + Math.cos(a) * 9 * s, y - 10 * s + Math.sin(a) * 7 * s, 2.2, 0, 7);
        g.fill();
      }
    }
  });
}

/** Vẽ toàn bộ địa hình của màn đang chọn lên canvas nền */
function drawTerrain(g) {
  if (!kinds) return;

  drawFields(g);
  drawWater(g);
  drawBridges(g);
  drawFences(g);
  drawRocks(g);
  drawHay(g);
  drawMapTrees(g);
  drawBuildings(g);
}

    <script>
/* =====================================================
   render-towers.js · vẽ tháp (thân, nòng, sao cấp)
   Dùng cả cho cánh đồng lẫn icon trong thanh chọn tháp.
   ===================================================== */

/** Vẽ đế đá của tháp */
function drawTowerBase(t, x, y, lvl, time, icon) {
  const T = TYPES[t.type];

  // Bóng đổ mềm
  if (!icon) {
    ctx.fillStyle = rg(x + 3, y + 9, 4, 24, [
      [0, 'rgba(0,0,0,.38)'],
      [1, 'rgba(0,0,0,0)']
    ]);
    ctx.beginPath();
    ctx.ellipse(x + 3, y + 9, 24, 14, 0, 0, 7);
    ctx.fill();
  }

  // Hào quang cấp 5
  if (lvl >= 5 && !icon) {
    const a = 0.35 + 0.25 * Math.sin(time * 5);
    ctx.fillStyle = rg(x, y, 6, 30, [
      [0, 'rgba(255,217,59,' + a + ')'],
      [1, 'rgba(255,217,59,0)']
    ]);
    ctx.beginPath();
    ctx.arc(x, y, 30, 0, 7);
    ctx.fill();
  }

  // Đế đá
  ctx.fillStyle = lg(x, y - 17, x, y + 17, [[0, '#b9c1ca'], [1, '#5a626c']]);
  rr(x - 17, y - 17, 34, 34, 8);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Mép sáng phía trên
  ctx.fillStyle = 'rgba(255,255,255,.32)';
  rr(x - 14, y - 14, 28, 6, 3);
  ctx.fill();

  // Đinh tán
  ctx.fillStyle = '#3d434a';
  for (const [bx, by] of [[-12, -12], [12, -12], [-12, 12], [12, 12]]) {
    ctx.beginPath();
    ctx.arc(x + bx, y + by, 1.7, 0, 7);
    ctx.fill();
  }

  // Viền kim loại theo cấp
  if (lvl >= 3) {
    ctx.strokeStyle = lvl >= 5 ? '#ffd93b' : '#e8c24a';
    ctx.lineWidth = 2;
    rr(x - 14.5, y - 14.5, 29, 29, 6);
    ctx.stroke();
  }

  // Vòng màu theo loại tháp
  ctx.fillStyle = lg(x - 11, y - 11, x + 11, y + 11, [
    [0, lighten(T.color, 0.4)],
    [1, darken(T.color, 0.1)]
  ]);
  ctx.beginPath();
  ctx.arc(x, y, 11, 0, 7);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Điểm sáng bóng
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath();
  ctx.ellipse(x - 4, y - 5, 4, 2.2, -0.6, 0, 7);
  ctx.fill();
}

/** Vẽ nòng / thân vũ khí xoay theo hướng ngắm */
function drawTowerWeapon(t, lvl, time, icon) {
  const metal = lg(0, -6, 0, 6, [[0, '#7a828e'], [0.5, '#3a4048'], [1, '#252a30']]);

  ctx.lineWidth = 1.8;
  ctx.strokeStyle = INK;

  const rec = icon ? 0 : (t.rec || 0) * 3;
  const ang = t.ang || 0;

  switch (t.type) {

    case 'gun': {
      ctx.fillStyle = metal;
      const ys = lvl >= 3 ? [-7, -1.5, 4] : [-5, 1];

      ys.forEach(yy => {
        ctx.fillRect(3, yy, 17 + Math.min(lvl, 4), 3.4);
        ctx.strokeRect(3, yy, 17 + Math.min(lvl, 4), 3.4);
      });

      ctx.fillStyle = '#ffe27a';
      if (rec > 1.2) ys.forEach(yy => ctx.fillRect(21 + lvl, yy, 5, 3.4));
      break;
    }

    case 'cannon': {
      ctx.fillStyle = metal;
      rr(0, -6, 19, 12, 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#e8923a';
      ctx.fillRect(5, -6, 3, 12);
      ctx.fillRect(12, -6, 3, 12);

      ctx.fillStyle = '#111';
      rr(17, -7.5, 6, 15, 2);
      ctx.fill();
      break;
    }

    case 'frost': {
      for (let k = 0; k < 3; k++) {
        ctx.save();
        ctx.rotate(k * 1.047);
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(16, 0);
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = '#8ad8f0';
        ctx.stroke();
        ctx.restore();
      }

      ctx.beginPath();
      ctx.moveTo(22, 0);
      ctx.lineTo(8, -7);
      ctx.lineTo(2, 0);
      ctx.lineTo(8, 7);
      ctx.closePath();
      ctx.fillStyle = lg(2, 0, 22, 0, [[0, '#bff4ff'], [1, '#ffffff']]);
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1.8;
      ctx.stroke();
      break;
    }

    case 'sniper': {
      ctx.fillStyle = metal;
      ctx.fillRect(0, -2.3, 27, 4.6);
      ctx.strokeRect(0, -2.3, 27, 4.6);

      ctx.fillStyle = '#e8d0ff';
      ctx.fillRect(10, -6, 8, 3.5);
      ctx.strokeRect(10, -6, 8, 3.5);

      ctx.fillStyle = '#a45bd6';
      ctx.fillRect(25, -3.4, 4, 6.8);
      break;
    }

    case 'flame': {
      ctx.fillStyle = '#8a3020';
      rr(-3, -8, 14, 16, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffb36b';
      ctx.fillRect(1, -5, 6, 3);

      ctx.fillStyle = metal;
      ctx.fillRect(10, -3, 12, 6);
      ctx.strokeRect(10, -3, 12, 6);

      const f = 6 + Math.sin(time * 30) * 2;

      ctx.fillStyle = '#ff9a3c';
      ctx.beginPath();
      ctx.moveTo(22, -3);
      ctx.lineTo(22 + f, 0);
      ctx.lineTo(22, 3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffe27a';
      ctx.beginPath();
      ctx.moveTo(22, -1.6);
      ctx.lineTo(22 + f * 0.6, 0);
      ctx.lineTo(22, 1.6);
      ctx.closePath();
      ctx.fill();
      break;
    }

    case 'tesla': {
      ctx.rotate(-ang);   // cuộn sét không xoay theo mục tiêu

      ctx.fillStyle = '#555d66';
      ctx.fillRect(-3, -3, 6, 12);
      ctx.strokeRect(-3, -3, 6, 12);

      ctx.fillStyle = rg(0, -8, 1, 9, [[0, '#fff'], [0.4, '#f2e14c'], [1, '#c9a800']]);
      ctx.beginPath();
      ctx.arc(0, -8, 8, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#fff9c0';
      ctx.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) {
        const a = time * 6 + k * 2.1;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 8, -8 + Math.sin(a) * 8);
        ctx.lineTo(Math.cos(a + 0.3) * 13, -8 + Math.sin(a + 0.3) * 13);
        ctx.stroke();
      }
      break;
    }

    case 'poison': {
      ctx.fillStyle = metal;
      ctx.fillRect(6, -3, 14, 6);
      ctx.strokeRect(6, -3, 14, 6);

      ctx.fillStyle = rg(-1, 0, 1, 9, [[0, '#c9ff9a'], [1, '#4a9a2a']]);
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, 7);
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath();
      ctx.arc(-2 + Math.sin(time * 4) * 1.5, -2, 1.5, 0, 7);
      ctx.arc(2, 1 + Math.cos(time * 5) * 1, 1.1, 0, 7);
      ctx.fill();

      ctx.fillStyle = '#2a5a12';
      ctx.fillRect(19, -4, 3, 8);
      break;
    }

    case 'missile': {
      ctx.fillStyle = '#6a2a4a';
      rr(-3, -9, 22, 18, 3);
      ctx.fill();
      ctx.stroke();

      [-5.5, 0, 5.5].forEach(yy => {
        ctx.fillStyle = '#fff';
        ctx.fillRect(2, yy - 1.6, 14, 3.2);

        ctx.fillStyle = '#ff5fa2';
        ctx.beginPath();
        ctx.moveTo(16, yy - 1.8);
        ctx.lineTo(21, yy);
        ctx.lineTo(16, yy + 1.8);
        ctx.fill();
      });
      break;
    }

    case 'laser': {
      ctx.fillStyle = metal;
      rr(-2, -8, 14, 16, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#2b2f36';
      ctx.fillRect(10, -3.2, 12, 6.4);
      ctx.strokeRect(10, -3.2, 12, 6.4);

      const gl = 0.6 + 0.4 * Math.sin(time * 9);
      ctx.fillStyle = rg(24, 0, 1, 8, [
        [0, '#fff'],
        [0.4, 'rgba(255,59,107,' + gl + ')'],
        [1, 'rgba(255,59,107,0)']
      ]);
      ctx.beginPath();
      ctx.arc(24, 0, 8, 0, 7);
      ctx.fill();

      ctx.fillStyle = '#ff3b6b';
      ctx.beginPath();
      ctx.arc(4, 0, 3, 0, 7);
      ctx.fill();
      break;
    }

    case 'rail': {
      ctx.fillStyle = metal;
      rr(-4, -8, 12, 16, 3);
      ctx.fill();
      ctx.stroke();

      [-4, 1.6].forEach(yy => {
        ctx.fillStyle = '#38404a';
        ctx.fillRect(4, yy, 26, 2.6);
        ctx.strokeRect(4, yy, 26, 2.6);
      });

      const gl = icon ? 0.7 : Math.max(0, 1 - (t.cd / (stat(t).rate || 1))) * 0.9 + 0.1;
      ctx.strokeStyle = 'rgba(70,224,255,' + gl + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(28, 0);
      ctx.stroke();

      ctx.fillStyle = '#46e0ff';
      ctx.fillRect(-1, -2, 4, 4);
      break;
    }

    case 'mortar': {
      ctx.fillStyle = '#6b7448';
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = metal;
      ctx.beginPath();
      ctx.moveTo(2, -7);
      ctx.lineTo(18, -5.5);
      ctx.lineTo(18, 5.5);
      ctx.lineTo(2, 7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.ellipse(18, 0, 2.5, 5.5, 0, 0, 7);
      ctx.fill();

      ctx.fillStyle = '#d6c95a';
      ctx.fillRect(7, -6, 3, 12);
      break;
    }

    case 'radar': {
      ctx.fillStyle = '#e8fff6';
      ctx.beginPath();
      ctx.ellipse(2, 0, 5, 12, 0, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#35d0a0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.lineTo(10, 0);
      ctx.stroke();

      ctx.fillStyle = '#ff5a5a';
      ctx.beginPath();
      ctx.arc(10, 0, 2, 0, 7);
      ctx.fill();
      break;
    }
  }
}

/** Vẽ một tháp tại (x,y). icon=true khi vẽ icon nhỏ ở thanh chọn. */
function drawTower(t, x, y, time, icon) {
  const lvl = t.lvl || 1;
  const ang = icon ? -0.5 : (t.ang || 0);

  ctx.save();

  drawTowerBase(t, x, y, lvl, time, icon);

  // Chuyển hệ tọa độ vào tâm tháp rồi xoay theo hướng ngắm
  ctx.translate(x, y);
  ctx.rotate(t.type === 'radar' ? time * 1.6 : ang);

  const rec = icon ? 0 : (t.rec || 0) * 3;
  ctx.translate(-rec, 0);

  drawTowerWeapon({ type: t.type, lvl: lvl, cd: t.cd, rec: t.rec, ang: ang }, lvl, time, icon);

  ctx.restore();

  // Sao hiển thị cấp
  ctx.fillStyle = '#ffd93b';
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1;

  for (let i = 0; i < lvl; i++) {
    ctx.beginPath();
    ctx.arc(x - (lvl - 1) * 4 + i * 8, y + 15, 2.9, 0, 7);
    ctx.fill();
    ctx.stroke();
  }
}

    <script>
/* =====================================================
   render-enemies.js · vẽ kẻ địch, hào quang tinh anh,
   thanh máu
   ===================================================== */

/* ---------- Bộ phận dùng lại cho nhiều kẻ địch ---------- */

/** Thân tròn có đổ bóng sáng */
function blob(r, col, hl = 0.4) {
  ctx.fillStyle = rg(-r * 0.3, -r * 0.35, r * 0.1, r * 1.1, [
    [0, lighten(col, hl)],
    [1, col]
  ]);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, 7);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.stroke();
}

/** Cặp mắt */
function eyes(r, dx = 3, dy = -2, s = 3) {
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(dx, dy, s, 0, 7);
  ctx.arc(dx - s * 1.9, dy, s, 0, 7);
  ctx.fill();

  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(dx + 1, dy, s * 0.5, 0, 7);
  ctx.arc(dx - s * 1.9 + 1, dy, s * 0.5, 0, 7);
  ctx.fill();
}

/** Đôi chân bước */
function feet(r, bob, anim) {
  const s = Math.sin(anim * 10);

  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath();
  ctx.ellipse(-r * 0.4 + s * 2, r * 0.85, r * 0.35, r * 0.2, 0, 0, 7);
  ctx.ellipse(r * 0.4 - s * 2, r * 0.85, r * 0.35, r * 0.2, 0, 0, 7);
  ctx.fill();
}

/* =====================================================
   HÌNH DÁNG TỪNG LOẠI KẺ ĐỊCH
   ===================================================== */
function drawEnemyBody(e, a, bob) {
  const d = e.def;
  const r = d.r;
  const t = e.type;

  switch (t) {

    case 'grunt':
      feet(r, bob, a);
      blob(r, d.col);

      ctx.fillStyle = '#4a7a2a';
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r, 3.4, 6.0);
      ctx.fill();

      eyes(r);
      break;

    case 'runner':
      // Vệt tốc độ
      ctx.strokeStyle = 'rgba(255,255,255,.7)';
      ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(-r - 4, i * 4);
        ctx.lineTo(-r - 14, i * 4);
        ctx.stroke();
      }

      ctx.strokeStyle = INK;
      feet(r, bob, a * 1.6);
      blob(r, d.col);

      // Băng đô
      ctx.fillStyle = '#e03a3a';
      ctx.fillRect(-r, -r * 0.5, r * 2, 3);
      ctx.fillRect(-r - 5, -r * 0.5 + 1, 6, 3);

      eyes(r, 3, 0, 2.6);
      break;

    case 'mini':
      feet(r, bob, a);
      blob(r, d.col);
      eyes(r, 2, -1, 2);
      break;

    case 'tank':
      // Xích
      ctx.fillStyle = '#2a2a30';
      rr(-r - 1, -r * 0.95, r * 2 + 2, r * 0.5, 3);
      ctx.fill();
      ctx.stroke();
      rr(-r - 1, r * 0.45, r * 2 + 2, r * 0.5, 3);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#6a6a72';
      for (let i = -3; i <= 3; i++) {
        const o = (a * 6 + i * 5) % 5;
        ctx.fillRect(i * r * 0.28 - o * 0.3, -r * 0.8, 2, 3);
        ctx.fillRect(i * r * 0.28 - o * 0.3, r * 0.6, 2, 3);
      }

      // Thân xe
      ctx.fillStyle = lg(0, -r * 0.7, 0, r * 0.7, [[0, lighten(d.col, 0.35)], [1, d.col]]);
      rr(-r * 0.85, -r * 0.62, r * 1.7, r * 1.24, 5);
      ctx.fill();
      ctx.stroke();

      // Tháp pháo
      ctx.fillStyle = lg(0, -r * 0.4, 0, r * 0.4, [[0, '#a07a5a'], [1, '#6a4a30']]);
      ctx.beginPath();
      ctx.arc(-1, 0, r * 0.5, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#2a2a30';
      ctx.fillRect(0, -3, r + 4, 6);
      ctx.strokeRect(0, -3, r + 4, 6);
      break;

    case 'armored':
      feet(r, bob, a);
      blob(r, d.col);

      ctx.fillStyle = lg(0, -r, 0, 0, [[0, '#d5dde6'], [1, '#8c99a6']]);
      ctx.beginPath();
      ctx.arc(0, -r * 0.1, r * 1.02, 3.3, 6.12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-r * 0.5, -r * 0.55, 1.4, 0, 7);
      ctx.arc(r * 0.5, -r * 0.55, 1.4, 0, 7);
      ctx.fill();

      eyes(r, 3, 2, 2.6);
      break;

    case 'shielded':
      feet(r, bob, a);
      blob(r, d.col);
      eyes(r);

      ctx.fillStyle = '#e8f6ff';
      ctx.fillRect(-r * 0.9, -1, r * 0.3, r * 0.8);
      break;

    case 'healer':
      feet(r, bob, a);
      blob(r, d.col);

      // Chữ thập y tế
      ctx.fillStyle = '#fff';
      ctx.fillRect(-2, -1, 4, 10);
      ctx.fillRect(-5, 2, 10, 4);

      // Vầng sáng trên đầu
      ctx.strokeStyle = '#ffe27a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, -r - 3, r * 0.6, 3, 0, 0, 7);
      ctx.stroke();

      eyes(r, 3, -4, 2.4);
      break;

    case 'splitter':
      feet(r, bob, a);
      blob(r, d.col);

      ctx.fillStyle = lighten(d.col, 0.3);
      ctx.beginPath();
      ctx.arc(-r * 0.7, -r * 0.7, r * 0.35, 0, 7);
      ctx.arc(r * 0.7, -r * 0.7, r * 0.35, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#5a3010';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.6, r * 0.1);
      ctx.lineTo(0, r * 0.5);
      ctx.lineTo(r * 0.6, r * 0.1);
      ctx.moveTo(0, r * 0.5);
      ctx.lineTo(0, r * 0.95);
      ctx.stroke();

      eyes(r, 3, -3, 2.6);
      break;

    case 'berserk': {
      const fl = 0.5 + 0.5 * Math.sin(a * 14);

      ctx.fillStyle = 'rgba(255,120,40,' + (0.3 + 0.2 * fl) + ')';
      ctx.beginPath();
      ctx.arc(0, 0, r + 7, 0, 7);
      ctx.fill();

      feet(r, bob, a * 1.3);
      blob(r, d.col);

      // Sừng lửa
      ctx.fillStyle = '#ffe27a';
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.5);
      ctx.lineTo(-r - 5, -r - 7);
      ctx.lineTo(-r * 0.3, -r * 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(r * 0.8, -r * 0.5);
      ctx.lineTo(r + 5, -r - 7);
      ctx.lineTo(r * 0.3, -r * 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      eyes(r, 3, -1, 2.8);

      // Lông mày giận dữ
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(-7, -6);
      ctx.lineTo(0, -3);
      ctx.moveTo(5, -6);
      ctx.lineTo(-1, -3);
      ctx.stroke();
      break;
    }

    case 'ghost':
      ctx.fillStyle = rg(0, -r * 0.4, 2, r * 1.3, [[0, '#ffffff'], [1, d.col]]);
      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI, 0);
      for (let i = 0; i < 4; i++) {
        const x = r - i * r * 0.5;
        ctx.quadraticCurveTo(x - r * 0.12, r * 1.15 + Math.sin(a * 8 + i) * 2, x - r * 0.5, r * 0.7);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.ellipse(-3, -2, 2, 3, 0, 0, 7);
      ctx.ellipse(4, -2, 2, 3, 0, 0, 7);
      ctx.fill();
      break;

    case 'ninja':
      // Khăn bay
      ctx.strokeStyle = '#d33';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.2);
      ctx.quadraticCurveTo(-r - 8, -r * 0.5 + Math.sin(a * 12) * 3, -r - 14, -r * 0.1 + Math.sin(a * 12 + 1) * 3);
      ctx.stroke();
      ctx.strokeStyle = INK;

      feet(r, bob, a * 1.5);
      blob(r, d.col, 0.3);

      ctx.fillStyle = '#f2d0a8';
      ctx.fillRect(-r * 0.8, -r * 0.45, r * 1.6, r * 0.45);

      ctx.fillStyle = '#d33';
      ctx.fillRect(-r, -r * 0.55, r * 2, 3);

      ctx.fillStyle = INK;
      ctx.fillRect(1, -r * 0.35, 2.5, 3);
      ctx.fillRect(-4, -r * 0.35, 2.5, 3);
      break;

    case 'knight':
      feet(r, bob, a);
      blob(r, d.col, 0.5);

      // Mũ giáp
      ctx.fillStyle = lg(0, -r, 0, 0, [[0, '#e0e6ee'], [1, '#8a94a2']]);
      ctx.beginPath();
      ctx.arc(0, -r * 0.15, r * 1.04, 3.2, 6.22);
      ctx.lineTo(r, r * 0.2);
      ctx.lineTo(-r, r * 0.2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = INK;
      ctx.fillRect(-r * 0.65, -r * 0.35, r * 1.3, 3);

      // Lông mũ đỏ
      ctx.fillStyle = '#e23a3a';
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(-8, -r - 10, -12, -r - 3 + Math.sin(a * 8) * 2);
      ctx.lineTo(-2, -r + 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Khiên
      ctx.fillStyle = lg(0, 0, 0, r, [[0, '#4a7ab8'], [1, '#2a4a88']]);
      ctx.beginPath();
      ctx.moveTo(r * 0.3, -r * 0.2);
      ctx.lineTo(r * 1.2, -r * 0.2);
      ctx.lineTo(r * 1.2, r * 0.4);
      ctx.lineTo(r * 0.75, r * 0.9);
      ctx.lineTo(r * 0.3, r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffd93b';
      ctx.fillRect(r * 0.7, -r * 0.1, 3, r * 0.7);
      break;

    case 'wizard':
      feet(r, bob, a);

      // Áo choàng
      ctx.fillStyle = lg(0, -r, 0, r, [[0, '#8a78f0'], [1, '#3f2fa8']]);
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.6);
      ctx.lineTo(r * 1.05, r * 0.9);
      ctx.lineTo(-r * 1.05, r * 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Mặt
      ctx.fillStyle = '#f2d0a8';
      ctx.beginPath();
      ctx.arc(0, -r * 0.5, r * 0.5, 0, 7);
      ctx.fill();
      ctx.stroke();
      eyes(r, 2, -r * 0.5, 1.8);

      // Nón
      ctx.fillStyle = '#3f2fa8';
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.7);
      ctx.lineTo(0, -r * 2);
      ctx.lineTo(r * 0.8, -r * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffd93b';
      ctx.beginPath();
      ctx.arc(0, -r * 1.25, 1.8, 0, 7);
      ctx.fill();

      // Gậy phép
      ctx.strokeStyle = '#8a5a30';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(r * 0.9, r * 0.8);
      ctx.lineTo(r * 0.9, -r * 0.6);
      ctx.stroke();

      ctx.fillStyle = rg(r * 0.9, -r * 0.8, 1, 7, [
        [0, '#fff'],
        [0.5, '#77aaff'],
        [1, 'rgba(120,170,255,0)']
      ]);
      ctx.beginPath();
      ctx.arc(r * 0.9, -r * 0.8, 6 + Math.sin(a * 8), 0, 7);
      ctx.fill();

      // Vòng phép tăng tốc
      ctx.strokeStyle = 'rgba(120,170,255,.35)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, r + 10 + Math.sin(a * 6) * 2, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);
      break;

    case 'summoner':
      feet(r, bob, a);

      ctx.fillStyle = lg(0, -r, 0, r, [[0, '#a0408a'], [1, '#401838']]);
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 1.1, r);
      ctx.lineTo(-r * 1.1, r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#f0e8e0';
      ctx.beginPath();
      ctx.arc(0, -r * 0.55, r * 0.48, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(-3, -r * 0.6, 2, 0, 7);
      ctx.arc(3, -r * 0.6, 2, 0, 7);
      ctx.fill();

      // Quả cầu ma quay quanh
      for (let i = 0; i < 3; i++) {
        const aa = a * 5 + i * 2.094;
        ctx.fillStyle = '#d65cc0';
        ctx.beginPath();
        ctx.arc(Math.cos(aa) * (r + 8), Math.sin(aa) * (r * 0.6) - 2, 3.4, 0, 7);
        ctx.fill();
        ctx.stroke();
      }
      break;

    case 'golem':
      ctx.fillStyle = lg(0, -r, 0, r, [[0, '#b4bac4'], [1, '#6a707a']]);

      rr(-r * 0.9, -r * 0.4, r * 1.8, r * 1.3, 6);
      ctx.fill();
      ctx.stroke();

      rr(-r * 0.6, -r, r * 1.2, r * 0.85, 5);
      ctx.fill();
      ctx.stroke();

      rr(-r * 1.25, -r * 0.3 + Math.sin(a * 8) * 2, r * 0.5, r * 0.9, 4);
      ctx.fill();
      ctx.stroke();

      rr(r * 0.75, -r * 0.3 - Math.sin(a * 8) * 2, r * 0.5, r * 0.9, 4);
      ctx.fill();
      ctx.stroke();

      // Rêu
      ctx.fillStyle = '#6aa84a';
      ctx.beginPath();
      ctx.arc(-r * 0.5, -r * 0.35, 3, 0, 7);
      ctx.arc(r * 0.4, r * 0.2, 3.5, 0, 7);
      ctx.fill();

      // Mắt cam
      ctx.fillStyle = '#ff9a3c';
      ctx.fillRect(-r * 0.4, -r * 0.7, 5, 4);
      ctx.fillRect(r * 0.1, -r * 0.7, 5, 4);

      // Vết nứt
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-r * 0.3, r * 0.2);
      ctx.lineTo(0, r * 0.5);
      ctx.lineTo(r * 0.3, r * 0.3);
      ctx.stroke();
      break;

    case 'boss':
      ctx.fillStyle = 'rgba(255,60,40,.25)';
      ctx.beginPath();
      ctx.arc(0, 0, r + 8 + Math.sin(a * 6) * 2, 0, 7);
      ctx.fill();

      feet(r, bob, a);
      blob(r, d.col);

      // Vương miện
      ctx.fillStyle = '#ffd93b';
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, -r * 0.75);
      ctx.lineTo(-r * 0.7, -r * 1.35);
      ctx.lineTo(-r * 0.3, -r * 1.0);
      ctx.lineTo(0, -r * 1.45);
      ctx.lineTo(r * 0.3, -r * 1.0);
      ctx.lineTo(r * 0.7, -r * 1.35);
      ctx.lineTo(r * 0.7, -r * 0.75);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      eyes(r, 5, -1, 4);

      ctx.strokeStyle = INK;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-10, -8);
      ctx.lineTo(0, -3);
      ctx.moveTo(8, -8);
      ctx.lineTo(-1, -3);
      ctx.stroke();

      // Răng
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(-6, r * 0.5);
      for (let i = 0; i < 4; i++) {
        ctx.lineTo(-6 + i * 4 + 2, r * 0.8);
        ctx.lineTo(-6 + i * 4 + 4, r * 0.5);
      }
      ctx.fill();
      break;

    case 'titan':
      ctx.fillStyle = 'rgba(160,60,255,.28)';
      ctx.beginPath();
      ctx.arc(0, 0, r + 10 + Math.sin(a * 5) * 3, 0, 7);
      ctx.fill();

      feet(r, bob, a);
      blob(r, d.col, 0.25);

      // Gai tinh thể
      ctx.fillStyle = '#b9a3ff';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * r * 0.38 - 5, -r * 0.8);
        ctx.lineTo(i * r * 0.38, -r * 1.4 + Math.abs(i) * 5);
        ctx.lineTo(i * r * 0.38 + 5, -r * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Lõi năng lượng
      ctx.fillStyle = rg(0, r * 0.35, 1, 9, [
        [0, '#fff'],
        [0.5, '#c86bff'],
        [1, 'rgba(200,107,255,0)']
      ]);
      ctx.beginPath();
      ctx.arc(0, r * 0.35, 8 + Math.sin(a * 8) * 1.5, 0, 7);
      ctx.fill();

      ctx.fillStyle = '#ffdd55';
      ctx.fillRect(-9, -r * 0.3, 6, 4);
      ctx.fillRect(3, -r * 0.3, 6, 4);
      break;

    /* ----- MỚI ----- */

    case 'juggernaut':
      // Xích hạng nặng
      ctx.fillStyle = '#23252b';
      rr(-r - 2, -r * 0.95, r * 2 + 4, r * 0.55, 4);
      ctx.fill();
      ctx.stroke();
      rr(-r - 2, r * 0.4, r * 2 + 4, r * 0.55, 4);
      ctx.fill();
      ctx.stroke();

      // Thân thép nhiều lớp
      ctx.fillStyle = lg(0, -r * 0.8, 0, r * 0.8, [[0, '#8a93a2'], [1, '#3e4552']]);
      rr(-r * 0.95, -r * 0.7, r * 1.9, r * 1.4, 6);
      ctx.fill();
      ctx.stroke();

      // Tấm giáp phụ
      ctx.fillStyle = '#6a7384';
      rr(-r * 0.7, -r * 0.5, r * 1.1, r, 4);
      ctx.fill();
      ctx.stroke();

      // Đinh tán
      ctx.fillStyle = '#c9ced8';
      for (const [px, py] of [[-0.5, -0.35], [0.1, -0.35], [-0.5, 0.35], [0.1, 0.35]]) {
        ctx.beginPath();
        ctx.arc(r * px, r * py, 1.6, 0, 7);
        ctx.fill();
      }

      // Hai nòng pháo
      ctx.fillStyle = '#1f2228';
      ctx.fillRect(r * 0.3, -r * 0.35, r + 5, 5);
      ctx.strokeRect(r * 0.3, -r * 0.35, r + 5, 5);
      ctx.fillRect(r * 0.3, r * 0.1, r + 5, 5);
      ctx.strokeRect(r * 0.3, r * 0.1, r + 5, 5);

      // Đèn đỏ nhấp nháy
      ctx.fillStyle = (Math.sin(a * 10) > 0) ? '#ff4a3a' : '#7a1f18';
      ctx.beginPath();
      ctx.arc(-r * 0.6, 0, 2.4, 0, 7);
      ctx.fill();
      break;

    case 'phoenix': {
      const w = Math.sin(a * 9);

      // Đuôi lửa
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = ['#ff3a1a', '#ff9a2a', '#ffe07a'][i];
        ctx.lineWidth = 6 - i * 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.quadraticCurveTo(-24, (i - 1) * 7 + Math.sin(a * 6 + i) * 6, -42 - i * 3, (i - 1) * 10 + Math.sin(a * 5 + i) * 8);
        ctx.stroke();
      }
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;

      // Cánh
      ctx.fillStyle = lg(0, -26, 0, 0, [[0, '#ffb347'], [1, '#e8482a']]);
      ctx.beginPath();
      ctx.moveTo(-2, 0);
      ctx.quadraticCurveTo(-4, -22 - w * 8, -22, -22 - w * 12);
      ctx.quadraticCurveTo(-14, -8, -10, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-2, 0);
      ctx.quadraticCurveTo(-4, 22 + w * 8, -22, 22 + w * 12);
      ctx.quadraticCurveTo(-14, 8, -10, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Thân
      ctx.fillStyle = rg(2, -3, 2, 16, [[0, '#fff2b0'], [1, '#ff7a2a']]);
      ctx.beginPath();
      ctx.ellipse(2, 0, 14, 8, 0, 0, 7);
      ctx.fill();
      ctx.stroke();

      // Đầu & mỏ
      ctx.fillStyle = '#ffd36a';
      ctx.beginPath();
      ctx.arc(14, -2, 6, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff6a1a';
      ctx.beginPath();
      ctx.moveTo(19, -3);
      ctx.lineTo(26, -1);
      ctx.lineTo(19, 1);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(15, -4, 1.4, 0, 7);
      ctx.fill();

      // Mào lửa
      ctx.fillStyle = '#ff4a1a';
      ctx.beginPath();
      ctx.moveTo(10, -7);
      ctx.lineTo(12, -14 + Math.sin(a * 12) * 2);
      ctx.lineTo(15, -7);
      ctx.fill();

      // Đã hồi sinh: tro tàn lấp lánh
      if (e.revived) {
        ctx.fillStyle = 'rgba(255,230,160,.8)';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(Math.cos(a * 4 + i * 1.6) * 20, Math.sin(a * 4 + i * 1.6) * 14, 1.6, 0, 7);
          ctx.fill();
        }
      }
      break;
    }

    case 'warlock':
      feet(r, bob, a);

      // Áo choàng tím đen
      ctx.fillStyle = lg(0, -r, 0, r, [[0, '#5a3fb8'], [1, '#1c1244']]);
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.7);
      ctx.lineTo(r * 1.15, r);
      ctx.lineTo(-r * 1.15, r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Mũ trùm
      ctx.fillStyle = '#241555';
      ctx.beginPath();
      ctx.arc(0, -r * 0.5, r * 0.62, Math.PI, 0);
      ctx.lineTo(r * 0.5, -r * 0.1);
      ctx.lineTo(-r * 0.5, -r * 0.1);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Đôi mắt phát sáng trong bóng tối
      ctx.fillStyle = '#ff5af0';
      ctx.beginPath();
      ctx.arc(-3, -r * 0.35, 1.8, 0, 7);
      ctx.arc(3, -r * 0.35, 1.8, 0, 7);
      ctx.fill();

      // Quả cầu pha lê lơ lửng
      ctx.fillStyle = rg(r * 1.1, -r * 0.3 + Math.sin(a * 6) * 2, 1, 8, [
        [0, '#fff'],
        [0.5, '#b07bff'],
        [1, 'rgba(176,123,255,0)']
      ]);
      ctx.beginPath();
      ctx.arc(r * 1.1, -r * 0.3 + Math.sin(a * 6) * 2, 7, 0, 7);
      ctx.fill();

      // Vòng ma pháp
      ctx.strokeStyle = 'rgba(176,123,255,.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([2, 5]);
      ctx.beginPath();
      ctx.arc(0, 0, r + 8 + Math.sin(a * 5) * 2, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);
      break;

    case 'reaper':
      // Áo choàng rách tả tơi
      ctx.fillStyle = lg(0, -r, 0, r * 1.4, [[0, '#4a4a64'], [1, '#14141f']]);
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.9);
      ctx.lineTo(r * 1.1, r * 0.4);
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(r * 1.1 - i * r * 0.5, r * 1.1 + Math.sin(a * 9 + i) * 3);
        ctx.lineTo(r * 0.85 - i * r * 0.5, r * 0.6);
      }
      ctx.lineTo(-r * 1.1, r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Mặt sọ
      ctx.fillStyle = '#e8e4da';
      ctx.beginPath();
      ctx.arc(0, -r * 0.45, r * 0.5, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.ellipse(-3, -r * 0.5, 2, 2.6, 0, 0, 7);
      ctx.ellipse(3, -r * 0.5, 2, 2.6, 0, 0, 7);
      ctx.fill();

      // Lưỡi hái
      ctx.strokeStyle = '#6a4a2a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(r * 1.0, r * 1.0);
      ctx.lineTo(r * 1.0, -r * 1.1);
      ctx.stroke();

      ctx.strokeStyle = '#cfd6e0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(r * 0.5, -r * 1.1, r * 0.55, -0.2, 2.9);
      ctx.stroke();
      break;

    /* ----- Trên không ----- */

    case 'plane':
    case 'bomber':
      ctx.fillStyle = lg(0, -14, 0, 14, [[0, lighten(d.col, 0.3)], [1, d.col]]);
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-4, -15);
      ctx.lineTo(-10, -13);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-10, 13);
      ctx.lineTo(-4, 15);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Buồng lái
      ctx.fillStyle = '#4aa8ff';
      ctx.beginPath();
      ctx.ellipse(6, 0, 4, 2.6, 0, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#e03a3a';
      ctx.fillRect(-13, -3, 6, 6);

      if (t === 'bomber') {
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(-2, 7, 3.2, 0, 7);
        ctx.arc(-2, -7, 3.2, 0, 7);
        ctx.fill();
      }
      break;

    case 'bat': {
      const w = Math.sin(a * 14);

      ctx.fillStyle = d.col;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-6, -14 - w * 6, -16, -8 - w * 8);
      ctx.quadraticCurveTo(-9, -4, -6, 0);
      ctx.quadraticCurveTo(-9, 4, -16, 8 + w * 8);
      ctx.quadraticCurveTo(-6, 14 + w * 6, 0, 0);
      ctx.fill();
      ctx.stroke();

      blob(r * 0.8, '#8a62b0');

      ctx.fillStyle = '#ff5a5a';
      ctx.beginPath();
      ctx.arc(3, -1, 1.6, 0, 7);
      ctx.arc(-1, -1, 1.6, 0, 7);
      ctx.fill();

      // Tai nhọn
      ctx.fillStyle = '#8a62b0';
      ctx.beginPath();
      ctx.moveTo(-3, -r * 0.7);
      ctx.lineTo(-2, -r - 3);
      ctx.lineTo(0, -r * 0.7);
      ctx.moveTo(1, -r * 0.7);
      ctx.lineTo(3, -r - 3);
      ctx.lineTo(4, -r * 0.6);
      ctx.fill();
      break;
    }

    case 'dragon': {
      const w = Math.sin(a * 7);

      // Cánh
      ctx.fillStyle = '#a8302a';
      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.quadraticCurveTo(-10, -30 - w * 10, -34, -24 - w * 14);
      ctx.quadraticCurveTo(-20, -10, -14, 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.quadraticCurveTo(-10, 30 + w * 10, -34, 24 + w * 14);
      ctx.quadraticCurveTo(-20, 10, -14, -2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Đuôi
      ctx.strokeStyle = d.col;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-10, 0);
      ctx.quadraticCurveTo(-26, Math.sin(a * 5) * 8, -40, Math.sin(a * 5 + 1) * 10);
      ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;

      // Thân
      ctx.fillStyle = lg(0, -16, 0, 16, [[0, '#f06a58'], [1, '#a8302a']]);
      ctx.beginPath();
      ctx.ellipse(0, 0, 19, 11, 0, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffd9a0';
      ctx.beginPath();
      ctx.ellipse(1, 4, 14, 5, 0, 0, 7);
      ctx.fill();

      // Đầu
      ctx.fillStyle = d.col;
      ctx.beginPath();
      ctx.ellipse(20, -2, 9, 7, 0, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffdd55';
      ctx.beginPath();
      ctx.moveTo(18, -8);
      ctx.lineTo(20, -15);
      ctx.lineTo(23, -8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(22, -4, 2.5, 0, 7);
      ctx.fill();

      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(23, -4, 1.2, 0, 7);
      ctx.fill();

      // Hơi lửa
      ctx.fillStyle = 'rgba(255,150,40,' + (0.5 + 0.3 * Math.sin(a * 12)) + ')';
      ctx.beginPath();
      ctx.moveTo(28, 0);
      ctx.lineTo(36, -3);
      ctx.lineTo(34, 2);
      ctx.fill();
      break;
    }

    default:
      blob(r, d.col);
      eyes(r);
  }
}

/* =====================================================
   HÀO QUANG TINH ANH (vẽ phía sau thân)
   ===================================================== */
function drawEliteAura(e) {
  const r = e.def.r;
  const pulse = 0.5 + 0.5 * Math.sin(e.anim * 4 + gtime * 3);

  ctx.fillStyle = rg(0, 0, r * 0.4, r + 16, [
    [0, 'rgba(255,215,70,' + (0.28 + pulse * 0.18) + ')'],
    [1, 'rgba(255,215,70,0)']
  ]);
  ctx.beginPath();
  ctx.arc(0, 0, r + 16, 0, 7);
  ctx.fill();

  // Vòng chấm vàng xoay quanh
  ctx.strokeStyle = 'rgba(255,205,50,.9)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 5]);
  ctx.lineDashOffset = -gtime * 20;
  ctx.beginPath();
  ctx.arc(0, 0, r + 8, 0, 7);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineDashOffset = 0;
}

/* =====================================================
   VẼ MỘT KẺ ĐỊCH HOÀN CHỈNH
   ===================================================== */
function drawEnemy(e) {
  const d = e.def;
  const r = d.r;
  const bob = Math.sin(e.anim * 10) * 1.5;

  ctx.save();
  ctx.translate(e.x, e.y);

  /* ----- Bóng đổ ----- */
  if (!d.air) {
    ctx.fillStyle = rg(0, r * 0.85, 1, r, [
      [0, 'rgba(0,0,0,.34)'],
      [1, 'rgba(0,0,0,0)']
    ]);
    ctx.beginPath();
    ctx.ellipse(0, r * 0.85, r * 1.05, r * 0.4, 0, 0, 7);
    ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.ellipse(6, r + 16, r * 0.9, r * 0.3, 0, 0, 7);
    ctx.fill();
  }

  if (e.elite) drawEliteAura(e);

  if (d.stealth) ctx.globalAlpha = 0.55;
  if (e.hurt > 0) ctx.filter = 'brightness(1.7)';

  ctx.translate(0, d.air ? Math.sin(e.anim * 6) * 2 : bob * 0.6);
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;

  drawEnemyBody(e, e.anim, bob);

  ctx.filter = 'none';

  /* ----- Khiên năng lượng ----- */
  if (e.shieldMax && e.shield > 0) {
    ctx.strokeStyle = 'rgba(120,200,255,' + (0.35 + 0.5 * e.shield / e.shieldMax) + ')';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(120,200,255,.12)';
    ctx.beginPath();
    ctx.arc(0, 0, r + 6, 0, 7);
    ctx.fill();
    ctx.stroke();
  }

  /* ----- Vòng cháy / độc ----- */
  let ri = 0;
  for (const dot of e.dots) {
    ctx.strokeStyle = dot.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(0, 0, r + 4 + ri * 3, 0, 7);
    ctx.stroke();
    ri++;
  }
  ctx.globalAlpha = d.stealth ? 0.55 : 1;

  /* ----- Bị làm chậm ----- */
  if (e.slowT > 0) {
    ctx.strokeStyle = '#8be8f5';
    ctx.fillStyle = 'rgba(140,232,245,.22)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r + 3, 0, 7);
    ctx.fill();
    ctx.stroke();
  }

  /* ----- Được tăng tốc ----- */
  if (e.haste > 1) {
    ctx.strokeStyle = 'rgba(120,170,255,.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r - 6, -4);
    ctx.lineTo(-r - 14, -4);
    ctx.moveTo(-r - 6, 4);
    ctx.lineTo(-r - 14, 4);
    ctx.stroke();
  }

  ctx.restore();

  drawEnemyBar(e);
}

/** Thanh máu (và khiên) phía trên đầu kẻ địch */
function drawEnemyBar(e) {
  const d = e.def;
  const r = d.r;

  const w = Math.max(18, r * 2 + 6);
  const x = e.x - w / 2;
  const y = e.y - r - (d.air ? 14 : 10);

  // Viền
  ctx.fillStyle = INK;
  rr(x - 1.5, y - 1.5, w + 3, 7, 3);
  ctx.fill();

  // Nền đỏ
  ctx.fillStyle = '#e04a4a';
  rr(x, y, w, 4, 2);
  ctx.fill();

  // Máu còn lại
  const pct = clamp(e.hp / e.max, 0, 1);
  ctx.fillStyle = pct > 0.5 ? '#4de04d' : pct > 0.25 ? '#ffd93b' : '#ff7a3a';
  if (pct > 0) {
    rr(x, y, Math.max(3, w * pct), 4, 2);
    ctx.fill();
  }

  // Khiên
  if (e.shieldMax && e.shield > 0) {
    ctx.fillStyle = '#0a2a4a';
    ctx.fillRect(x - 1, y + 6, w + 2, 4);
    ctx.fillStyle = '#4aa8ff';
    ctx.fillRect(x, y + 7, w * clamp(e.shield / e.shieldMax, 0, 1), 2);
  }

  // Ngôi sao tinh anh
  if (e.elite) {
    ctx.fillStyle = '#ffd93b';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    ctx.font = '800 12px Baloo 2,Segoe UI,sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('★', x + w / 2, y - 3);
    ctx.fillText('★', x + w / 2, y - 3);
  }
}

    <script>
/* =====================================================
   render.js · vẽ toàn cảnh mỗi khung hình
   ===================================================== */

/** Vẽ khung xem trước khi đặt tháp */
function drawPlacementGhost() {
  if (!build || !hover) return;

  const [hc, hr] = hover;
  const bad = canPlace(hc, hr);
  const T = TYPES[build];

  ctx.fillStyle = bad ? 'rgba(220,40,40,.4)' : 'rgba(255,255,255,.4)';
  rr(hc * CS + 2, hr * CS + 2, CS - 4, CS - 4, 6);
  ctx.fill();

  ctx.strokeStyle = bad ? 'rgba(220,40,40,.9)' : 'rgba(255,255,255,.95)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.arc(hc * CS + CS / 2, hr * CS + CS / 2, T.range * CS, 0, 7);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalAlpha = 0.6;
  drawTower({ type: build, lvl: 1, ang: 0 }, hc * CS + CS / 2, hr * CS + CS / 2, gtime, false);
  ctx.globalAlpha = 1;
}

/** Vẽ các tháp (sắp theo y để tháp phía sau bị che đúng) */
function drawTowers() {
  towers.slice().sort((a, b) => a.y - b.y).forEach(t => {
    drawTower(t, t.x, t.y, gtime, false);

    // Dấu hiệu được radar buff
    if (t.bD > 0) {
      ctx.strokeStyle = 'rgba(53,208,160,.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(t.x, t.y - 24, 3.5, 0, 7);
      ctx.stroke();

      ctx.fillStyle = '#35d0a0';
      ctx.fillRect(t.x - 1, t.y - 28, 2, 8);
    }

    // Tháp đang chọn: khung vàng + tầm bắn
    if (t === sel) {
      ctx.strokeStyle = '#ffd93b';
      ctx.lineWidth = 3.5;
      rr(t.x - 20, t.y - 20, 40, 40, 9);
      ctx.stroke();

      const R = t.type === 'radar' ? (t.rangeNow || TYPES.radar.range * CS) : stat(t).range;

      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath();
      ctx.arc(t.x, t.y, R, 0, 7);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });
}

/** Vẽ đạn bay */
function drawProjectiles() {
  for (const p of projs) {

    // Đạn cối
    if (p.mortar) {
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 5, 2.5, 0, 0, 7);
      ctx.fill();

      ctx.fillStyle = '#444';
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y - p.z, 6, 0, 7);
      ctx.fill();
      ctx.stroke();
      continue;
    }

    // Tên lửa
    if (p.kind === 'missile') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.ang || 0);

      // Ngọn lửa phụt phía sau
      ctx.fillStyle = 'rgba(255,170,60,.85)';
      ctx.beginPath();
      ctx.moveTo(-6, -2);
      ctx.lineTo(-13 - Math.random() * 3, 0);
      ctx.lineTo(-6, 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1.5;
      rr(-6, -2.5, 12, 5, 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.moveTo(6, -2.5);
      ctx.lineTo(10, 0);
      ctx.lineTo(6, 2.5);
      ctx.fill();
      ctx.restore();
      continue;
    }

    // Đạn pháo
    if (p.kind === 'cannon') {
      ctx.fillStyle = '#2a2a30';
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffb36b';
      ctx.beginPath();
      ctx.arc(p.x - 1.5, p.y - 1.5, 2, 0, 7);
      ctx.fill();
      continue;
    }

    // Mảnh băng
    if (p.kind === 'frost') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.ang || 0);

      ctx.fillStyle = '#d6f6ff';
      ctx.strokeStyle = '#58d3e8';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(6, 0);
      ctx.lineTo(-3, -3);
      ctx.lineTo(-3, 3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      continue;
    }

    // Đạn súng máy (vạch sáng)
    if (p.kind === 'gun') {
      const dx = Math.cos(p.ang || 0);
      const dy = Math.sin(p.ang || 0);

      ctx.strokeStyle = 'rgba(255,226,122,.35)';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - dx * 14, p.y - dy * 14);
      ctx.stroke();

      ctx.strokeStyle = '#fff3b0';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - dx * 9, p.y - dy * 9);
      ctx.stroke();
      continue;
    }

    // Đạn thường (độc, lửa...)
    ctx.fillStyle = p.c;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, 7);
    ctx.fill();
    ctx.stroke();
  }
}

/** Vẽ các hiệu ứng ngắn (tia, nổ, vòng sóng, chữ bay...) */
function drawEffects() {
  for (const f of fx) {

    if (f.k === 'beam') {
      ctx.strokeStyle = f.c;
      ctx.globalAlpha = f.life / 0.15;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();
      ctx.globalAlpha = 1;

    } else if (f.k === 'bolt') {
      ctx.shadowColor = f.c;
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.globalAlpha = clamp(f.life / 0.2, 0, 1);
      jag(f.x1, f.y1, f.x2, f.y2, 14);
      ctx.stroke();

      ctx.strokeStyle = f.c;
      ctx.lineWidth = 5;
      ctx.globalAlpha *= 0.45;
      jag(f.x1, f.y1, f.x2, f.y2, 14);
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

    } else if (f.k === 'laser') {
      ctx.shadowColor = f.c;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = f.c;
      ctx.lineWidth = f.w * 1.6;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = f.w * 0.6;
      ctx.globalAlpha = 1;
      ctx.stroke();
      ctx.shadowBlur = 0;

    } else if (f.k === 'rail') {
      const a = clamp(f.life / (f.thin ? 0.18 : 0.4), 0, 1);

      ctx.shadowColor = f.c;
      ctx.shadowBlur = 16;
      ctx.strokeStyle = f.c;
      ctx.lineWidth = (f.thin ? 3 : 12) * a;
      ctx.globalAlpha = 0.6 * a;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = (f.thin ? 1.5 : 4) * a;
      ctx.globalAlpha = a;
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

    } else if (f.k === 'muzzle') {
      // Chớp lửa đầu nòng
      const u = clamp(f.life / 0.18, 0, 1);
      ctx.fillStyle = rg(f.x, f.y, 1, f.r, [
        [0, 'rgba(255,255,255,' + u + ')'],
        [0.4, f.c],
        [1, 'rgba(255,200,80,0)']
      ]);
      ctx.globalAlpha = u;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 7);
      ctx.fill();
      ctx.globalAlpha = 1;

    } else if (f.k === 'boom') {
      const u = 1 - f.life / 0.35;
      ctx.fillStyle = rg(f.x, f.y, 2, f.r * (0.6 + u * 0.5), [
        [0, 'rgba(255,240,170,' + (1 - u) + ')'],
        [0.5, 'rgba(255,150,40,' + (0.7 * (1 - u)) + ')'],
        [1, 'rgba(255,80,20,0)']
      ]);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.6 + u * 0.5), 0, 7);
      ctx.fill();

      // Vòng sóng xung kích
      ctx.strokeStyle = 'rgba(255,230,160,' + (0.8 * (1 - u)) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.4 + u * 0.9), 0, 7);
      ctx.stroke();

    } else if (f.k === 'ring') {
      const u = 1 - f.life / 0.5;
      ctx.strokeStyle = f.c;
      ctx.globalAlpha = clamp(1 - u, 0, 1);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.3 + u * 0.7), 0, 7);
      ctx.stroke();
      ctx.globalAlpha = 1;

    } else if (f.k === 'txt') {
      ctx.fillStyle = f.c || '#ffe55c';
      ctx.strokeStyle = INK;
      ctx.lineWidth = 3.5;
      ctx.font = '800 14px Baloo 2,Segoe UI,sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, f.life * 2);
      ctx.strokeText(f.t, f.x, f.y - (0.8 - f.life) * 30);
      ctx.fillText(f.t, f.x, f.y - (0.8 - f.life) * 30);
      ctx.globalAlpha = 1;

    } else if (f.k === 'flash') {
      ctx.fillStyle = 'rgba(255,0,0,' + (f.life / 0.35 * 0.28) + ')';
      ctx.fillRect(-20, -20, CW + 40, CH + 40);

    } else if (f.k === 'heal') {
      ctx.fillStyle = 'rgba(120,255,140,' + (f.life / 0.4 * 0.6) + ')';
      ctx.beginPath();
      ctx.arc(f.x, f.y, 14 + (0.4 - f.life) * 20, 0, 7);
      ctx.fill();

    } else if (f.k === 'target') {
      ctx.strokeStyle = 'rgba(255,70,50,' + (0.5 + 0.4 * Math.sin(f.life * 20)) + ')';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.moveTo(f.x - 14, f.y);
      ctx.lineTo(f.x + 14, f.y);
      ctx.moveTo(f.x, f.y - 14);
      ctx.lineTo(f.x, f.y + 14);
      ctx.stroke();

    } else if (f.k === 'frostwave') {
      const u = 1 - f.life / 0.9;
      ctx.fillStyle = 'rgba(150,230,255,' + (0.35 * (1 - u)) + ')';
      ctx.fillRect(-20, -20, CW + 40, CH + 40);

      ctx.strokeStyle = 'rgba(200,245,255,' + (1 - u) + ')';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(CW / 2, CH / 2, u * CW * 0.7, 0, 7);
      ctx.stroke();
    }
  }
}

/** Vẽ tên lửa không kích đang rơi từ trên xuống */
function drawStrikes() {
  for (const s of strikes) {
    const u = clamp(1 - s.t / 0.5, 0, 1);
    if (u <= 0 || s.t < 0) continue;

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;

    ctx.save();
    ctx.translate(s.x, s.y - (1 - u) * 260);
    ctx.rotate(Math.PI / 2);

    // Đuôi lửa
    ctx.fillStyle = 'rgba(255,160,50,.8)';
    ctx.beginPath();
    ctx.moveTo(-9, -3);
    ctx.lineTo(-20, 0);
    ctx.lineTo(-9, 3);
    ctx.fill();

    ctx.fillStyle = '#fff';
    rr(-9, -3.5, 18, 7, 3);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ff5a3a';
    ctx.beginPath();
    ctx.moveTo(9, -3.5);
    ctx.lineTo(15, 0);
    ctx.lineTo(9, 3.5);
    ctx.fill();
    ctx.restore();
  }
}

/** Vòng ngắm không kích theo chuột */
function drawAim() {
  if (!aim || !hover) return;

  const x = hover[0] * CS + CS / 2;
  const y = hover[1] * CS + CS / 2;

  ctx.strokeStyle = 'rgba(255,70,50,.9)';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.arc(x, y, 90, 0, 7);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.moveTo(x - 12, y);
  ctx.lineTo(x + 12, y);
  ctx.moveTo(x, y - 12);
  ctx.lineTo(x, y + 12);
  ctx.stroke();
}

/** Vẽ mọi thứ. dt là thời gian thật của khung hình (0 khi tạm dừng). */
function draw(dt) {
  ctx.save();

  // Rung màn hình khi có vụ nổ lớn
  if (shake > 0.2) {
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  ctx.drawImage(bg, 0, 0);
  if (gfx) drawClouds(dt);
  drawPath();
  drawGates();

  drawPlacementGhost();
  drawTowers();

  // Kẻ địch mặt đất → đạn → kẻ địch bay (để máy bay luôn ở trên)
  for (const e of enemies) if (!e.def.air) drawEnemy(e);
  drawProjectiles();
  for (const e of enemies) if (e.def.air) drawEnemy(e);

  // Hạt
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.s * (0.4 + 0.6 * p.life / p.max), 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawEffects();
  drawStrikes();
  drawAim();
  if (gfx) drawAmbient(dt);

  ctx.restore();

  // Lớp ánh sáng / bóng mờ phủ lên cùng (không rung theo màn hình)
  ctx.drawImage(lightLayer, 0, 0);
}
