<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phòng thủ cánh đồng</title>
<!--GC:KIT-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== GC KIT · giao diện chung "Góc Giải Trí" (neo-brutalist) ===== */
:root{
  --gc-ink:#1c1b3a;--gc-paper:#fbf8ef;--gc-line:#e6e0cc;
  --gc-sun:#ffc93c;--gc-tomato:#ff6b57;--gc-mint:#2fc9a5;--gc-sky:#4b9dff;--gc-lilac:#a184ff;
  --gc-ok:#22b573;--gc-bad:#f0483e;
  --gc-shadow:4px 4px 0 var(--gc-ink);
  --gc-head:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
  --gc-body:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;
}
.gc-start,.gc-start *,.gc-modal,.gc-modal *,.gc-pill,.gc-btn,.gc-back{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ---- nút chung ---- */
.gc-btn{font-family:var(--gc-head);font-weight:800;font-size:18px;line-height:1.1;color:var(--gc-ink);cursor:pointer;
  border:3px solid var(--gc-ink);background:var(--gc-sun);border-radius:14px;padding:11px 20px;box-shadow:3px 3px 0 var(--gc-ink);
  transition:transform .1s,box-shadow .1s;user-select:none;-webkit-user-select:none}
.gc-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--gc-ink)}
.gc-btn.alt{background:#fff}.gc-btn.sky{background:var(--gc-sky);color:#fff}.gc-btn.mint{background:var(--gc-mint)}
.gc-btn.sm{font-size:15px;padding:7px 13px;border-radius:12px}
.gc-btn:focus-visible,.gc-lv:focus-visible,.gc-back:focus-visible{outline:4px solid var(--gc-sky);outline-offset:2px}

/* ---- nút thoát thống nhất (đè lên #homeBackBtn có sẵn của từng game) ---- */
#homeBackBtn,.gc-back{position:fixed;z-index:2147483000;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);
  width:42px;height:42px;padding:0;border-radius:14px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--gc-head);font-size:22px;font-weight:800;line-height:1;color:var(--gc-ink);
  background:#fff;border:3px solid var(--gc-ink);box-shadow:3px 3px 0 var(--gc-ink);transition:transform .1s,box-shadow .1s}
#homeBackBtn:hover,.gc-back:hover{filter:none;background:#fff7d6}
#homeBackBtn:active,.gc-back:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--gc-ink)}

/* ---- viên thuốc (pill) hiển thị độ khó / thông số ---- */
.gc-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--gc-head);font-weight:800;font-size:14px;line-height:1;
  padding:5px 11px;border:2.5px solid var(--gc-ink);border-radius:999px;background:#fff;color:var(--gc-ink);white-space:nowrap}
.gc-d0{background:var(--gc-mint)}.gc-d1{background:var(--gc-sun)}.gc-d2{background:var(--gc-tomato)}.gc-d3{background:var(--gc-lilac)}
/* HUD thống nhất cho các game đứng riêng */
.gc-hudbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gc-hudbar .gc-pill{box-shadow:2px 2px 0 var(--gc-ink)}
/* chip độ khó nổi (dùng khi game không có thanh tiêu đề) */
.gc-chip{position:fixed;z-index:2147482500;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 12px);pointer-events:none}

/* ---- màn chọn độ khó ---- */
.gc-start{position:fixed;inset:0;z-index:2147482000;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:62px 14px calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--gc-body);color:var(--gc-ink);
  background-color:var(--gc-paper);
  background-image:linear-gradient(var(--gc-line) 1px,transparent 1px),linear-gradient(90deg,var(--gc-line) 1px,transparent 1px);
  background-size:28px 28px;-webkit-overflow-scrolling:touch}
.gc-start.out{animation:gcOut .25s forwards}
@keyframes gcOut{to{opacity:0;transform:scale(1.03)}}
.gc-card{width:100%;max-width:460px;margin:auto;background:#fff;border:3px solid var(--gc-ink);border-radius:24px;box-shadow:var(--gc-shadow);
  padding:20px 16px 18px;text-align:center;animation:gcPop .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes gcPop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
.gc-ico{display:grid;place-items:center;width:68px;height:68px;margin:-46px auto 8px;font-size:36px;background:var(--gc-sun);
  border:3px solid var(--gc-ink);border-radius:20px;box-shadow:3px 3px 0 var(--gc-ink);transform:rotate(-6deg)}
.gc-title{margin:0;font-family:var(--gc-head);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.3px}
.gc-desc{margin:8px 4px 0;font-size:14px;line-height:1.45;color:#4b4a6a}
.gc-h{margin:16px 0 8px;font-family:var(--gc-head);font-weight:800;font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:#6a6990}
.gc-levels{display:grid;gap:9px}
.gc-lv{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;color:var(--gc-ink);cursor:pointer;
  background:#fff;border:3px solid var(--gc-ink);border-radius:16px;padding:9px 12px;box-shadow:2px 2px 0 var(--gc-ink);transition:transform .1s,box-shadow .1s,background .15s}
.gc-lv .e{flex:none;display:grid;place-items:center;width:42px;height:42px;font-size:22px;border:2.5px solid var(--gc-ink);border-radius:13px;background:var(--c)}
.gc-lv .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gc-lv .t b{font-family:var(--gc-head);font-weight:800;font-size:19px;line-height:1.05;display:flex;align-items:center;gap:8px}
.gc-lv .t small{font-size:12.5px;line-height:1.3;color:#55547a}
.gc-lv .pips{display:inline-flex;gap:3px}
.gc-lv .pips i{width:8px;height:8px;border:2px solid var(--gc-ink);border-radius:50%;background:#fff}
.gc-lv .pips i.on{background:var(--c)}
.gc-lv .bst{flex:none;align-self:flex-start;font-size:12px;font-weight:700;color:#55547a;white-space:nowrap}
.gc-lv[aria-checked=true]{background:color-mix(in srgb,var(--c) 22%,#fff);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--gc-ink)}
.gc-lv[aria-checked=true] .e::after{content:"";}
.gc-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.gc-actions .gc-btn{width:100%;font-size:21px;padding:13px 18px}
.gc-actions .gc-resume{font-size:16px;padding:10px 14px}
.gc-note{margin:10px 0 0;font-size:12px;color:#6a6990}
@media (max-height:640px){.gc-start{padding-top:56px}.gc-ico{width:56px;height:56px;font-size:30px;margin-top:-40px}.gc-title{font-size:25px}.gc-lv{padding:6px 10px}.gc-lv .e{width:36px;height:36px;font-size:19px}.gc-h{margin:10px 0 6px}}

/* ---- hộp kết quả thống nhất ---- */
.gc-modal{position:fixed;inset:0;z-index:2147482600;display:grid;place-items:center;padding:16px;background:rgba(28,27,58,.6);font-family:var(--gc-body);color:var(--gc-ink)}
.gc-panel{width:100%;max-width:400px;max-height:100%;overflow:auto;background:#fff;border:3px solid var(--gc-ink);border-radius:22px;padding:20px;box-shadow:var(--gc-shadow);text-align:center;animation:gcPop .4s}
.gc-panel h2{margin:0;font-family:var(--gc-head);font-weight:800;font-size:32px;line-height:1.05}
.gc-big{font-family:var(--gc-head);font-weight:800;font-size:60px;line-height:1;margin:8px 0}
.gc-stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.gc-stats span{background:var(--gc-paper);border:2.5px solid var(--gc-ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.gc-panel .gc-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.gc-panel .gc-row .gc-btn{font-size:16px;padding:10px 16px}
@media (prefers-reduced-motion:reduce){.gc-card,.gc-panel,.gc-start.out{animation:none!important}.gc-lv,.gc-btn{transition:none!important}}
</style>
<script>
/* ===== GC KIT · logic dùng chung: chọn độ khó, kỷ lục theo độ khó, hộp kết quả ===== */
(function () {
  'use strict';
  if (window.GC) return;

  var LV = [
    { i: 0, key: 'easy',   label: 'Dễ',         emoji: '🌱', color: 'var(--gc-mint)' },
    { i: 1, key: 'normal', label: 'Trung bình', emoji: '🌤️', color: 'var(--gc-sun)' },
    { i: 2, key: 'hard',   label: 'Khó',        emoji: '🔥', color: 'var(--gc-tomato)' },
    { i: 3, key: 'insane', label: 'Siêu khó',   emoji: '💀', color: 'var(--gc-lilac)' }
  ];
  var DEFAULT_LEVEL_TEXT = ['Thong thả, ít áp lực', 'Cân bằng, vừa sức', 'Nhanh hơn, ít sai sót', 'Thử thách cực đại'];

  function ls(op, k, v) {
    try { return op === 'get' ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; }
  }
  function ss(op, k, v) {
    try { return op === 'get' ? sessionStorage.getItem(k) : op === 'del' ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) { return null; }
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var GC = window.GC = {
    levels: LV,
    id: 'game',
    diff: LV[1],
    /** Độ khó hiện tại: 0 dễ · 1 trung bình · 2 khó · 3 siêu khó */
    get i() { return GC.diff.i; },
    /** GC.by(a,b,c,d) hoặc GC.by([a,b,c,d]) → giá trị theo độ khó đang chọn */
    by: function (a, b, c, d) {
      var arr = Array.isArray(a) ? a : [a, b, c, d];
      return arr[GC.diff.i];
    },
    setDiff: function (i) { GC.diff = LV[Math.max(0, Math.min(3, i | 0))]; },
    esc: esc,

    best: {
      key: function (id, i) { return 'gc:' + id + ':best:' + LV[i == null ? GC.diff.i : i].key; },
      get: function (id, i) { return +ls('get', GC.best.key(id || GC.id, i)) || 0; },
      /** Lưu nếu cao hơn. Trả về true nếu là kỷ lục mới. */
      set: function (id, score, i) {
        id = id || GC.id; score = +score || 0;
        if (score > GC.best.get(id, i)) { ls('set', GC.best.key(id, i), score); return true; }
        return false;
      },
      /** Với game tính theo "thấp hơn là tốt hơn" (thời gian, số bước). */
      setLow: function (id, score, i) {
        id = id || GC.id; score = +score || 0;
        var cur = GC.best.get(id, i);
        if (score > 0 && (!cur || score < cur)) { ls('set', GC.best.key(id, i), score); return true; }
        return false;
      }
    },

    /** HTML pill độ khó: "🔥 Khó" */
    chip: function () {
      return '<span class="gc-pill gc-d' + GC.diff.i + '" title="Độ khó">' + GC.diff.emoji + ' ' + GC.diff.label + '</span>';
    },
    /** Gắn chip độ khó nổi ở góc phải trên (cho game không có thanh tiêu đề). */
    mountChip: function () {
      var el = document.querySelector('.gc-chip');
      if (!el) { el = document.createElement('div'); el.className = 'gc-chip'; document.body.appendChild(el); }
      el.innerHTML = GC.chip();
      return el;
    },

    /** Thoát về danh sách game (báo cho React host) hoặc về trang chủ nếu mở riêng. */
    quit: function () {
      try {
        if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'quit', data: {} }, '*'); return; }
      } catch (e) { /* ignore */ }
      try { window.location.href = '/'; } catch (e) { /* ignore */ }
    },

    /** Chơi lại CÙNG độ khó: nạp lại trang và tự bắt đầu, bỏ qua màn chọn. */
    again: function () {
      ss('set', 'gc:auto:' + GC.id, String(GC.diff.i));
      location.reload();
    },
    /** Quay lại màn chọn độ khó. */
    change: function () {
      ss('del', 'gc:auto:' + GC.id);
      location.reload();
    },

    /**
     * Hiện màn chọn độ khó. cfg:
     *  id, name, icon, desc,
     *  levels: [4 chuỗi mô tả riêng cho từng độ khó],
     *  resume: { i, text } (tuỳ chọn — có ván đang dở ở độ khó i),
     *  onStart(diff), onResume(diff)
     */
    start: function (cfg) {
      GC.id = cfg.id || 'game';
      var texts = cfg.levels || DEFAULT_LEVEL_TEXT;
      var last = ls('get', 'gc:' + GC.id + ':diff');
      var sel = last != null && last !== '' && +last >= 0 && +last <= 3 ? +last : 1;

      function launch(i, resumed) {
        GC.setDiff(i);
        ls('set', 'gc:' + GC.id + ':diff', String(i));
        var el = document.getElementById('gc-start');
        if (el) { el.classList.add('out'); setTimeout(function () { el.remove(); }, 240); }
        document.removeEventListener('keydown', onKey, true);
        if (resumed && cfg.onResume) cfg.onResume(GC.diff); else if (cfg.onStart) cfg.onStart(GC.diff);
      }

      // Chơi lại cùng độ khó: bỏ qua màn chọn
      var auto = ss('get', 'gc:auto:' + GC.id);
      if (auto != null && auto !== '') {
        ss('del', 'gc:auto:' + GC.id);
        GC.setDiff(+auto);
        if (cfg.onStart) { cfg.onStart(GC.diff); return; }
      }

      var hasBack = !!document.getElementById('homeBackBtn');
      var root = document.createElement('div');
      root.className = 'gc-start'; root.id = 'gc-start';
      root.setAttribute('role', 'dialog'); root.setAttribute('aria-label', 'Chọn độ khó — ' + (cfg.name || ''));
      root.innerHTML =
        (hasBack ? '' : '<button class="gc-back" type="button" aria-label="Về sảnh">←</button>') +
        '<div class="gc-card">' +
          '<div class="gc-ico">' + esc(cfg.icon || '🎮') + '</div>' +
          '<h1 class="gc-title">' + esc(cfg.name || 'Trò chơi') + '</h1>' +
          (cfg.desc ? '<p class="gc-desc">' + esc(cfg.desc) + '</p>' : '') +
          '<div class="gc-h">Chọn độ khó</div>' +
          '<div class="gc-levels" role="radiogroup" aria-label="Độ khó">' +
          LV.map(function (l) {
            var b = GC.best.get(GC.id, l.i);
            return '<button type="button" class="gc-lv" role="radio" data-i="' + l.i + '" style="--c:' + l.color + '">' +
              '<span class="e">' + l.emoji + '</span>' +
              '<span class="t"><b>' + l.label + '<span class="pips">' +
              [0, 1, 2, 3].map(function (k) { return '<i' + (k <= l.i ? ' class="on"' : '') + '></i>'; }).join('') +
              '</span></b><small>' + esc(texts[l.i] || '') + '</small></span>' +
              (b ? '<span class="bst">🏆 ' + b + '</span>' : '') + '</button>';
          }).join('') +
          '</div>' +
          '<div class="gc-actions">' +
            '<button type="button" class="gc-btn gc-go">▶ Bắt đầu</button>' +
            (cfg.resume ? '<button type="button" class="gc-btn alt gc-resume">⏯ Tiếp tục ván đang chơi · ' +
              LV[cfg.resume.i].emoji + ' ' + LV[cfg.resume.i].label + '</button>' : '') +
          '</div>' +
        '</div>';
      document.body.appendChild(root);

      var btns = [].slice.call(root.querySelectorAll('.gc-lv'));
      function paint() { btns.forEach(function (b) { b.setAttribute('aria-checked', String(+b.dataset.i === sel)); }); }
      paint();
      btns.forEach(function (b) {
        b.onclick = function () { sel = +b.dataset.i; paint(); };
        b.ondblclick = function () { launch(sel, false); };
      });
      root.querySelector('.gc-go').onclick = function () { launch(sel, false); };
      var rs = root.querySelector('.gc-resume');
      if (rs) rs.onclick = function () { launch(cfg.resume.i, true); };
      var bk = root.querySelector('.gc-back');
      if (bk) bk.onclick = GC.quit;

      function onKey(e) {
        if (!document.getElementById('gc-start')) return;
        if (e.key >= '1' && e.key <= '4') { sel = +e.key - 1; paint(); e.preventDefault(); e.stopPropagation(); }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { sel = Math.max(0, sel - 1); paint(); e.preventDefault(); e.stopPropagation(); }
        else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { sel = Math.min(3, sel + 1); paint(); e.preventDefault(); e.stopPropagation(); }
        else if (e.key === 'Enter') { launch(sel, false); e.preventDefault(); e.stopPropagation(); }
        else if (e.key === 'Escape') { GC.quit(); }
      }
      document.addEventListener('keydown', onKey, true);
      var go = root.querySelector('.gc-go'); try { go.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    },

    /**
     * Hộp kết quả thống nhất cho game đứng riêng. cfg:
     *  title, score, lines:[], win:boolean, low:boolean(thấp hơn = tốt hơn),
     *  onAgain (mặc định GC.again), onChange (mặc định GC.change), onHome (mặc định GC.quit)
     */
    result: function (cfg) {
      var isBest = cfg.score != null && (cfg.low ? GC.best.setLow(GC.id, cfg.score) : GC.best.set(GC.id, cfg.score));
      var prev = document.getElementById('gc-modal'); if (prev) prev.remove();
      var m = document.createElement('div');
      m.className = 'gc-modal'; m.id = 'gc-modal';
      m.innerHTML = '<div class="gc-panel" role="dialog">' +
        '<h2>' + esc(cfg.title || (cfg.win ? 'Chiến thắng! 🎉' : 'Hoàn thành!')) + '</h2>' +
        '<div style="margin-top:8px">' + GC.chip() + '</div>' +
        (cfg.score != null ? '<div class="gc-big">' + esc(cfg.score) + '</div>' : '') +
        '<div class="gc-stats">' + (isBest ? '<span>🏆 Kỷ lục mới</span>' : '') +
        (cfg.lines || []).map(function (l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</div>' +
        '<div class="gc-row"><button class="gc-btn" data-a="again">Chơi lại</button>' +
        '<button class="gc-btn alt" data-a="change">Đổi độ khó</button>' +
        '<button class="gc-btn alt" data-a="home">Về sảnh</button></div></div>';
      document.body.appendChild(m);
      m.onclick = function (e) {
        var b = e.target.closest('[data-a]'); if (!b) return;
        var a = b.dataset.a;
        if (a === 'again') (cfg.onAgain || GC.again)();
        else if (a === 'change') (cfg.onChange || GC.change)();
        else (cfg.onHome || GC.quit)();
      };
      return m;
    }
  };
})();
</script>
<!--/GC:KIT-->
<style>
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--gc-ink);font-family:var(--gc-body);
    background-color:var(--gc-paper);background-image:linear-gradient(var(--gc-line) 1px,transparent 1px),linear-gradient(90deg,var(--gc-line) 1px,transparent 1px);background-size:28px 28px}
  #app{display:flex;flex-direction:column;height:100%;align-items:center}
  button{font-family:var(--gc-head);cursor:pointer}
  #top{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 10px 8px 60px;
    background:#fff;border-bottom:3px solid var(--gc-ink)}
  .stat{display:inline-flex;align-items:center;gap:6px;background:var(--gc-paper);border:2.5px solid var(--gc-ink);border-radius:12px;padding:4px 11px;
    font-family:var(--gc-head);font-weight:800;font-size:17px;box-shadow:2px 2px 0 var(--gc-ink);white-space:nowrap}
  .stat.pulse{animation:pulse .35s}
  @keyframes pulse{50%{transform:scale(1.15);background:#fff1c2}}
  #preview{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;flex-basis:100%;overflow-x:auto;justify-content:center;font-size:12px;padding:0 2px 2px;scrollbar-width:none}#preview::-webkit-scrollbar{display:none}
  #preview .pv{flex:none;display:inline-flex;align-items:center;gap:2px;background:#fff;border:2px solid var(--gc-ink);border-radius:999px;padding:1px 8px 1px 5px;font-weight:700}
  .btn{padding:7px 14px;border-radius:14px;background:var(--gc-sun);color:var(--gc-ink);font-weight:800;font-size:15px;border:3px solid var(--gc-ink);
    box-shadow:3px 3px 0 var(--gc-ink);transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--gc-ink)}
  .btn.alt{background:#fff}.btn.red{background:var(--gc-bad);color:#fff}.btn.mint{background:var(--gc-mint)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  #field{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:6px}
  canvas#c{display:block;touch-action:none;cursor:crosshair;border:3px solid var(--gc-ink);border-radius:16px;box-shadow:var(--gc-shadow);background:#7cc05a}

  @media (max-width:760px){
    #top{gap:5px;padding:6px 8px 6px 56px}.stat{font-size:14px;padding:3px 8px}.btn{font-size:13px;padding:5px 10px}#top .gc-pill{font-size:12px;padding:3px 8px}
    #bottom{flex-direction:column;align-items:stretch;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
    #side{max-width:none;min-width:0;flex-direction:row}#info{max-height:78px;font-size:12px;padding:5px 8px}#skills{flex-direction:column;width:128px;flex:none}.sk{font-size:12px;padding:4px 6px}
    #towers{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;justify-content:flex-start;padding-bottom:5px}.tw{flex:none;width:122px}
    #preview{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat" id="stLives">❤️ <span id="lives">20</span></div>

</div>

<button id="homeBackBtn" type="button" aria-label="Về sảnh">←</button>

<script>
(()=>{
'use strict';
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const CW=960,CH=600,CS=40,COLS=24,ROWS=15,SR=7,GOALC=COLS-1,GR=7;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
const MAXLV=5;
let D,TOTAL=25;

/* ================= THÁP / VŨ KHÍ ================= */
const TYPES={
  gun:    {name:'Súng máy',  cost:50, range:3.0,dmg:7, rate:.3, color:'#4a90d9',air:true, ground:true,desc:'Bắn nhanh, đánh cả trên không. Cấp cao thành 3 nòng.'},
  cannon: {name:'Pháo',      cost:100,range:3.4,dmg:30,rate:1.3,color:'#e8923a',air:false,ground:true,splash:60,desc:'Nổ lan, chỉ bắn mặt đất.'},
  frost:  {name:'Tháp băng', cost:80, range:2.8,dmg:3, rate:.7, color:'#58d3e8',air:true, ground:true,slow:.5,desc:'Làm chậm kẻ địch. Cấp cao đóng băng mạnh hơn.'},
  sniper: {name:'Bắn tỉa',   cost:150,range:7.0,dmg:65,rate:1.8,color:'#a45bd6',air:true, ground:true,hit:true,pierce:true,desc:'Tầm xa, xuyên giáp, bắn trúng ngay.'},
  flame:  {name:'Phun lửa',  cost:120,range:2.3,dmg:6, rate:.15,color:'#ff6a2b',air:false,ground:true,burnDps:12,desc:'Thiêu đốt, gây cháy liên tục.'},
  tesla:  {name:'Tháp sét',  cost:180,range:3.2,dmg:22,rate:.9, color:'#f2e14c',air:true, ground:true,chain:3,desc:'Sét lan sang nhiều mục tiêu.'},
  poison: {name:'Tháp độc',  cost:140,range:3.0,dmg:5, rate:.5, color:'#7ad04a',air:false,ground:true,poisonDps:10,desc:'Đầu độc, sát thương theo thời gian.'},
  missile:{name:'Tên lửa',   cost:200,range:5.0,dmg:55,rate:1.6,color:'#ff5fa2',air:true, ground:true,splash:70,pierce:true,desc:'Chống không, nổ lan, xuyên giáp.'},
  laser:  {name:'Tia laser', cost:260,range:4.2,dmg:22,rate:.05,color:'#ff3b6b',air:true, ground:true,laser:true,pierce:true,desc:'Tia liên tục, càng bắn lâu vào một mục tiêu càng mạnh.'},
  rail:   {name:'Điện từ',   cost:350,range:8.5,dmg:160,rate:3.0,color:'#46e0ff',air:true,ground:true,rail:true,pierce:true,desc:'Phát bắn xuyên thẳng hàng, xuyên giáp. Cực mạnh.'},
  mortar: {name:'Cối',       cost:220,range:8.0,dmg:85,rate:2.4,color:'#9aa86a',air:false,ground:true,splash:80,mortar:true,minR:2.2,desc:'Tầm cực xa, nổ lan rộng, chỉ bắn mặt đất.'},
  radar:  {name:'Radar',     cost:160,range:3.2,dmg:0, rate:1,  color:'#35d0a0',air:false,ground:false,support:true,desc:'Tăng sát thương & tầm bắn tháp gần đó, lộ diện kẻ tàng hình.'}
};
const KEYS=['1','2','3','4','5','6','7','8','9','0','-','='];

/* ================= LÍNH ĐỊCH ================= */
const EDEF={
  grunt:   {n:'Lính',   ic:'🧟',hp:40, sp:55, rw:5,  col:'#6cbf4a',r:11},
  runner:  {n:'Chạy',   ic:'🏃',hp:26, sp:105,rw:6,  col:'#f0d03a',r:9},
  tank:    {n:'Xe tăng',ic:'🚜',hp:240,sp:34, rw:14, col:'#8a5a3a',r:15},
  plane:   {n:'Máy bay',ic:'✈️',hp:70, sp:75, rw:9,  col:'#e8e8f2',r:12,air:true},
  boss:    {n:'Trùm',   ic:'👹',hp:1800,sp:28,rw:150,col:'#c0392b',r:20,dmg:5},
  armored: {n:'Giáp',   ic:'🪖',hp:170,sp:45, rw:16, col:'#6a7a88',r:14,armor:6},
  shielded:{n:'Khiên',  ic:'🔰',hp:110,sp:50, rw:14, col:'#4a7ab8',r:13,shield:120},
  healer:  {n:'Y tá',   ic:'💊',hp:100,sp:50, rw:20, col:'#e05fc8',r:12,heal:true},
  bomber:  {n:'Ném bom',ic:'💣',hp:110,sp:90, rw:14, col:'#9a6ac0',r:13,air:true,dmg:2},
  splitter:{n:'Phân thân',ic:'🧬',hp:160,sp:48,rw:12,col:'#c07a3a',r:16,split:'mini'},
  berserk: {n:'Cuồng nộ',ic:'😡',hp:200,sp:45,rw:22, col:'#e03a3a',r:14,berserk:true},
  ghost:   {n:'Ma',     ic:'👻',hp:90, sp:75, rw:16, col:'#a0d8e8',r:12,stealth:true},
  mini:    {n:'Con',    ic:'🐛',hp:18, sp:80, rw:2,  col:'#c07a3a',r:7},
  /* --- MỚI --- */
  bat:     {n:'Dơi',    ic:'🦇',hp:34, sp:120,rw:7,  col:'#6b4a8a',r:9, air:true},
  ninja:   {n:'Ninja',  ic:'🥷',hp:120,sp:95, rw:20, col:'#2e2e48',r:11,evade:.3},
  knight:  {n:'Hiệp sĩ',ic:'🤺',hp:340,sp:38, rw:26, col:'#aeb8c6',r:15,armor:10},
  wizard:  {n:'Pháp sư',ic:'🧙',hp:130,sp:46, rw:24, col:'#6a58d8',r:12,haste:true},
  summoner:{n:'Triệu hồi',ic:'🧛',hp:260,sp:36,rw:34,col:'#7a2a66',r:14,summon:true},
  golem:   {n:'Golem',  ic:'🗿',hp:1000,sp:24,rw:70, col:'#8a8f98',r:19,dmg:2,armor:8},
  dragon:  {n:'Rồng',   ic:'🐉',hp:3200,sp:40,rw:220,col:'#d94a3a',r:24,air:true,dmg:8},
  titan:   {n:'Titan',  ic:'👺',hp:7500,sp:22,rw:500,col:'#4a2f6a',r:26,dmg:10,armor:5}
};

/* ---------- trạng thái ---------- */
let blocked,towers,enemies,projs,fx,parts,dist,pathPts=[],pendingSpawns=[];
let money,lives,wave,spawnQ,spawnT,paused,speed=1,over,sel=null,build=null,hover=null,waveActive,gtime=0,aim=null,kills=0,started=false;
let skill={strike:{cd:0,max:40},freeze:{cd:0,max:55}};
let strikes=[];

/* ---------- TÚI TIỀN = XU TÀI KHOẢN ----------
   Game mở trong app (iframe) thì host React giữ ví: localStorage là bản đọc
   ngay khi vào game (không chờ mạng), API /auth/me/coins cập nhật số xu thật.
   Mỗi lần nhận/thu tiền trong game chỉ báo CHÊNH LỆCH cho host → host cộng dồn
   và gửi một lần; mất mạng thì host giữ lại, có wifi là gửi bù vào tài khoản.
   Mở file .html trực tiếp (không có host) → giữ tiền theo độ khó như cũ. */
const HOSTED = !!(window.parent && window.parent !== window);
const WKEY = 'gq_coin_wallet_v1';

function walletCoins() {
  try { return Math.max(0, Number(JSON.parse(localStorage.getItem(WKEY) || '{}').coins) || 0); }
  catch (e) { return 0; }
}
function purseShift(d) {
  money = Math.max(0, money + d);
  if (HOSTED) { try { window.parent.postMessage({ type: 'gq:walletDelta', data: { amount: d } }, '*'); } catch (e) {} }
  updUI();
}
/** Nhận tiền (thưởng diệt địch, thưởng đợt, bán trụ) → xu tài khoản tăng theo. */
function earn(d) { if (d > 0) { purseShift(d); pulse('stMoney'); } }
/** Trả tiền (xây trụ, nâng cấp) → trừ thẳng vào xu tài khoản. */
function pay(d) { if (d > 0) purseShift(-d); }

addEventListener('message', function (ev) {
  const m = ev && ev.data;
  if (!m || m.type !== 'gq:wallet') return;
  money = Math.max(0, Number(m.coins) || 0);
  updUI();
});
if (HOSTED) { try { window.parent.postMessage({ type: 'gq:walletGet', data: {} }, '*'); } catch (e) {} }

function reset(){
  blocked=Array.from({length:COLS},()=>Array(ROWS).fill(false));
  towers=[];enemies=[];projs=[];fx=[];parts=[];pendingSpawns=[];strikes=[];
  money=HOSTED?walletCoins():D.money;lives=D.lives;wave=0;spawnQ=[];spawnT=0;waveActive=false;paused=false;over=false;sel=null;build=null;aim=null;kills=0;
  skill.strike.cd=0;skill.freeze.cd=0;
  setDist(bfs(blocked));
  $('go').textContent='▶ Bắt đầu đợt 1';$('go').disabled=false;
  $('pause').textContent='⏸';
  document.querySelectorAll('.tw').forEach(b=>b.classList.remove('sel'));
  const m=document.getElementById('gc-modal');if(m)m.remove();
  updUI();showInfo();showPreview();
}

/* ---------- tìm đường ---------- */
function bfs(blk){
  const d=new Array(COLS*ROWS).fill(Infinity);
  const q=[GOALC+GR*COLS];d[q[0]]=0;
  for(let i=0;i<q.length;i++){
    const cur=q[i],c=cur%COLS,r=(cur/COLS)|0;
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=c+dc,nr=r+dr;
      if(nc<0||nr<0||nc>=COLS||nr>=ROWS||blk[nc][nr])continue;
      const k=nc+nr*COLS;if(d[k]!==Infinity)continue;
      d[k]=d[cur]+1;q.push(k);
    }
  }
  return d;
}
function setDist(d){
  dist=d;pathPts=[[0,SR*CS+CS/2]];
  let c=0,r=SR,g=0;
  while(!(c===GOALC&&r===GR)&&g++<400){
    pathPts.push([c*CS+CS/2,r*CS+CS/2]);
    let best=null,bd=dist[c+r*COLS];
    for(const [dc,dr] of [[1,0],[0,1],[0,-1],[-1,0]]){
      const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;
      const dd=dist[nc+nr*COLS];if(dd<bd){bd=dd;best=[nc,nr];}
    }
    if(!best)break;[c,r]=best;
  }
  pathPts.push([GOALC*CS+CS/2,GR*CS+CS/2],[CW,GR*CS+CS/2]);
}
const cellOf=(x,y)=>[clamp(Math.floor(x/CS),0,COLS-1),clamp(Math.floor(y/CS),0,ROWS-1)];
function canPlace(c,r){
  if(c<0||r<0||c>=COLS||r>=ROWS)return 'Ngoài bản đồ';
  if(blocked[c][r])return 'Ô đã có tháp';
  if((c===0&&r===SR)||(c===GOALC&&r===GR))return 'Không thể xây ở cổng';
  blocked[c][r]=true;
  const d=bfs(blocked);
  let ok=d[0+SR*COLS]!==Infinity,why='Không được chặn kín đường đi';
  if(ok){
    for(const e of enemies){
      if(e.def.air)continue;
      const [ec,er]=cellOf(e.x,e.y);
      if(e.x>=0&&((ec===c&&er===r)||(e.tx!==undefined&&cellOf(e.tx,e.ty).join()===c+','+r))){ok=false;why='Có kẻ địch ở ô này';break;}
      if(e.x>=0&&d[ec+er*COLS]===Infinity){ok=false;why='Sẽ nhốt kẻ địch';break;}
    }
  }
  blocked[c][r]=false;
  return ok?null:why;
}

/* ---------- đợt địch ---------- */
function makeWave(n){
  const q=[];const hpM=(1+0.17*(n-1)+0.004*n*n)*D.hp;
  const add=(t,k,gap)=>{k=Math.max(0,Math.floor(k));for(let i=0;i<k;i++)q.push({t,hpM,gap});};
  add('grunt',Math.min(5+n*2,38),.7);
  if(n>=3)add('runner',Math.min(n*1.3,26),.45);
  if(n>=5)add('tank',(n-3)/2,1.4);
  if(n>=4&&n%3===1)add('plane',3+n/3,.8);
  if(n>=6)add('armored',(n-4)/2,1.2);
  if(n>=7&&n%2===1)add('bat',3+n/3,.35);
  if(n>=8)add('shielded',(n-6)/2,1.3);
  if(n>=9)add('ninja',(n-7)/2.2,.8);
  if(n>=10&&n%4===2)add('bomber',1+n/6,1.2);
  if(n>=11)add('healer',1+(n-10)/4,2.0);
  if(n>=12)add('knight',(n-9)/3,1.5);
  if(n>=13&&n%3===1)add('splitter',2+(n-12)/3,1.5);
  if(n>=14)add('wizard',1+(n-14)/4,1.8);
  if(n>=15)add('berserk',(n-13)/2,1.2);
  if(n>=16)add('summoner',1+(n-16)/5,2.2);
  if(n>=18)add('ghost',1+(n-17)/3,1.0);
  if(n>=19&&n%3===1)add('golem',1+(n-19)/6,3);
  if(n>=15&&n%10===5)add('dragon',1+Math.floor(n/20),4);
  if(n%10===0&&n!==TOTAL)add('boss',1+(n>=20?1:0)+(n>=30?1:0),3);
  if(n===TOTAL){add('titan',1,3);add('boss',2,3);add('dragon',1,4);}
  for(let i=q.length-1;i>0;i--){if(Math.random()<.4){const j=Math.max(0,i-Math.floor(Math.random()*6));[q[i],q[j]]=[q[j],q[i]];}}
  return q;
}
function startWave(){
  if(waveActive||over||wave>=TOTAL||!started)return;
  wave++;waveActive=true;spawnQ=makeWave(wave);spawnT=0;
  $('go').disabled=true;updUI();showPreview();
  showMsg('🌊 Đợt '+wave+' bắt đầu!');
}
function mkEnemy(type,hp,x,y){
  const def=EDEF[type];
  const e={def,type,hp,max:hp,x,y,slowT:0,slowF:1,rem:1e9,id:Math.random(),dots:[],anim:Math.random()*6,vx:0,vy:0,haste:1};
  if(def.air&&y==null)e.y=40+Math.random()*(CH-80);
  if(def.shield){e.shield=def.shield*D.hp;e.shieldMax=e.shield;e.shieldT=0;}
  if(def.heal)e.healCd=1;
  if(def.summon)e.sumCd=3;
  return e;
}
function spawn(s){
  const def=EDEF[s.t];
  const e=mkEnemy(s.t,def.hp*s.hpM,-20,SR*CS+CS/2);
  if(def.air)e.y=40+Math.random()*(CH-80);
  enemies.push(e);
}

/* ---------- logic địch ---------- */
function pickNext(e){
  if(e.x<0){e.tx=CS/2;e.ty=SR*CS+CS/2;return;}
  const [c,r]=cellOf(e.x,e.y);
  const here=dist[c+r*COLS];
  if(here===0){e.tx=CW+30;e.ty=e.y;e.exiting=true;return;}
  let best=null,bd=here;
  for(const [dc,dr] of [[1,0],[0,1],[0,-1],[-1,0]]){
    const nc=c+dc,nr=r+dr;
    if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;
    const d=dist[nc+nr*COLS];
    if(d<bd){bd=d;best=[nc,nr];}
  }
  if(best){e.tx=best[0]*CS+CS/2;e.ty=best[1]*CS+CS/2;}
}
function leak(e){
  e.dead=true;lives-=(e.def.dmg||1);
  fx.push({k:'flash',life:.35});
  pulse('stLives');
  if(lives<=0){lives=0;endGame(false);}
  updUI();
}
function stepEnemy(e,dt){
  if(e.slowT>0)e.slowT-=dt;
  if(e.shieldMax){
    if(e.shieldT>0)e.shieldT-=dt;
    else if(e.shield<e.shieldMax)e.shield=Math.min(e.shieldMax,e.shield+e.shieldMax*0.1*dt);
  }
  if(e.def.heal){
    e.healCd-=dt;
    if(e.healCd<=0){
      e.healCd=1.5;
      for(const o of enemies){
        if(o===e||o.dead)continue;
        if(Math.hypot(o.x-e.x,o.y-e.y)<110&&o.hp<o.max){
          o.hp=Math.min(o.max,o.hp+o.max*0.08);
          fx.push({k:'heal',x:o.x,y:o.y,life:.4});
        }
      }
    }
  }
  if(e.def.summon){
    e.sumCd-=dt;
    if(e.sumCd<=0&&e.x>20){
      e.sumCd=4.5;
      if(enemies.length+pendingSpawns.length<140){
        for(let i=0;i<2;i++){const hp=Math.max(EDEF.mini.hp,e.max*.12);
          const m=mkEnemy('mini',hp,e.x+(i?10:-10),e.y);m.rem=e.rem;pendingSpawns.push(m);}
        fx.push({k:'ring',x:e.x,y:e.y,life:.5,c:'#c34aa8',r:34});
      }
    }
  }
  let spd=e.def.sp*D.spd*e.haste;
  if(e.def.berserk)spd*=(1+(1-clamp(e.hp/e.max,0,1))*1.2);
  e.anim+=dt*spd/50;
  const ox=e.x,oy=e.y;
  let mv=spd*(e.slowT>0?e.slowF:1)*dt;
  if(e.def.air){e.x+=mv;e.rem=CW+20-e.x;if(e.x>CW+20)leak(e);e.vx=(e.x-ox)/dt;e.vy=0;return;}
  let guard=0;
  while(mv>0&&guard++<6){
    if(e.tx===undefined)pickNext(e);
    if(e.tx===undefined)break;
    const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);
    if(d<=mv){e.x=e.tx;e.y=e.ty;mv-=d;e.tx=undefined;if(e.exiting){leak(e);return;}}
    else{e.x+=dx/d*mv;e.y+=dy/d*mv;mv=0;}
  }
  e.vx=(e.x-ox)/dt;e.vy=(e.y-oy)/dt;
  if(e.x>=0){const [c,r]=cellOf(e.x,e.y);e.rem=dist[c+r*COLS]*CS;}else e.rem=1e8;
}

/* ---------- tháp ---------- */
function stat(t){
  const T=TYPES[t.type],l=t.lvl-1;
  return {range:(T.range+.2*l)*CS*(1+(t.bR||0)),dmg:T.dmg*(1+.8*l)*(1+(t.bD||0)),rate:T.rate*Math.pow(.92,l)};
}
function particles(x,y,n,c,sp,life,size){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random());
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*(.6+Math.random()*.6),max:life,s:size*(.6+Math.random()*.8),c});}
}
function killEnemy(e){
  if(e.dead)return;
  e.dead=true;kills++;
  const rw=Math.round(e.def.rw*D.rw);
  earn(rw);
  fx.push({k:'txt',x:e.x,y:e.y-10,life:.8,t:'+'+rw});
  particles(e.x,e.y,e.def.r>=14?16:9,e.def.col,e.def.r>=14?140:90,.55,3.2);
  if(e.def.r>=19)fx.push({k:'ring',x:e.x,y:e.y,life:.5,c:'#fff',r:60});
  if(e.def.split){
    const cdef=EDEF[e.def.split];
    const chp=Math.max(cdef.hp,e.max*0.35);
    for(let i=0;i<2;i++){const m=mkEnemy(e.def.split,chp,e.x+(i?12:-12),e.y);m.rem=e.rem;pendingSpawns.push(m);}
  }
}
function applyDamage(e,d,opts={}){
  if(e.dead||d<=0)return 0;
  if(e.def.evade&&!opts.dot&&Math.random()<e.def.evade){fx.push({k:'txt',x:e.x,y:e.y-14,life:.5,t:'né!',c:'#bfe8ff'});return 0;}
  if(e.def.armor&&!opts.pierce)d=Math.max(1,d-e.def.armor);
  if(e.shield>0){
    const ab=Math.min(e.shield,d);
    e.shield-=ab;d-=ab;e.shieldT=3;
    if(e.shield<0.5)e.shield=0;
  }
  e.hp-=d;e.hurt=.08;
  if(e.hp<=0)killEnemy(e);
  return d;
}
function applyDot(e,type,dps,t){
  if(e.dead)return;
  let d=e.dots.find(x=>x.type===type);
  if(d){d.t=Math.max(d.t,t);d.dps=Math.max(d.dps,dps);}
  else e.dots.push({type,dps,t,color:type==='burn'?'#ff8844':'#7ad04a'});
}
function pickTarget(t,T,S){
  let tg=null,sc=0;
  for(const e of enemies){
    if(e.dead||e.x<0)continue;
    if(e.def.air?!T.air:!T.ground)continue;
    const dd=Math.hypot(e.x-t.x,e.y-t.y);
    if(dd>S.range)continue;
    if(T.minR&&dd<T.minR*CS)continue;
    if(e.def.stealth&&dd>2.5*CS&&!t.det)continue;
    let s;
    if(t.mode===1)s=e.hp+(e.shield||0);        // mạnh nhất
    else if(t.mode===2)s=-dd;                  // gần nhất
    else s=-e.rem;                             // đầu tiên
    if(!tg||s>sc){tg=e;sc=s;}
  }
  return tg;
}
const MODES=['Đầu tiên','Mạnh nhất','Gần nhất'];
function updateTowers(dt){
  /* buff từ radar */
  for(const t of towers){t.bD=0;t.bR=0;t.det=false;}
  for(const r of towers){
    if(r.type!=='radar')continue;
    const rng=(TYPES.radar.range+.25*(r.lvl-1))*CS,bd=.22+.08*(r.lvl-1),br=.1+.04*(r.lvl-1);
    r.rangeNow=rng;
    for(const t of towers){
      if(t===r||t.type==='radar')continue;
      if(Math.hypot(t.x-r.x,t.y-r.y)<=rng){t.bD=Math.max(t.bD,bd);t.bR=Math.max(t.bR,br);t.det=true;}
    }
  }
  for(const t of towers){
    const T=TYPES[t.type];
    if(T.support)continue;
    const S=stat(t);
    t.cd-=dt;t.rec=Math.max(0,(t.rec||0)-dt*6);
    const tg=pickTarget(t,T,S);
    if(!tg){t.ramp=0;t.lock=null;t.firing=false;continue;}
    t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);
    if(T.laser){
      if(t.lock!==tg.id){t.lock=tg.id;t.ramp=0;}
      t.ramp=Math.min(3.4,(t.ramp||0)+dt*.9);
      t.firing=true;
      applyDamage(tg,S.dmg*(1+t.ramp)*dt*(T.rate>0?1:1)/(1)*1,{pierce:true,dot:true});
      fx.push({k:'laser',x1:t.x+Math.cos(t.ang)*16,y1:t.y+Math.sin(t.ang)*16,x2:tg.x,y2:tg.y,life:.06,c:T.color,w:2+t.ramp});
      if(Math.random()<.5)particles(tg.x,tg.y,1,'#ffd0da',60,.3,2);
      continue;
    }
    if(t.cd>0)continue;
    t.cd=S.rate;t.rec=1;
    if(T.rail){
      const ex=t.x+Math.cos(t.ang)*S.range,ey=t.y+Math.sin(t.ang)*S.range;
      const sx=t.x+Math.cos(t.ang)*16,sy=t.y+Math.sin(t.ang)*16;
      let n=0;
      for(const e of enemies){
        if(e.dead||e.x<0)continue;
        if(e.def.air?!T.air:!T.ground)continue;
        if(distSeg(e.x,e.y,sx,sy,ex,ey)<=e.def.r+8){applyDamage(e,S.dmg,{pierce:true});n++;
          particles(e.x,e.y,5,'#bff4ff',130,.35,2.6);}
      }
      fx.push({k:'rail',x1:sx,y1:sy,x2:ex,y2:ey,life:.4,c:T.color});
      particles(sx,sy,10,'#bff4ff',160,.3,2.5);
    }else if(T.chain){
      let cur=tg;const hits=[tg];
      const chain=T.chain+Math.floor(t.lvl/2);
      applyDamage(tg,S.dmg,{pierce:T.pierce});
      fx.push({k:'bolt',x1:t.x,y1:t.y-6,x2:tg.x,y2:tg.y,life:.2,c:T.color});
      for(let i=1;i<chain;i++){
        let nx=null,nd=100;
        for(const e of enemies){
          if(e.dead||hits.includes(e))continue;
          if(e.def.air?!T.air:!T.ground)continue;
          const d2=Math.hypot(e.x-cur.x,e.y-cur.y);
          if(d2<nd){nd=d2;nx=e;}
        }
        if(!nx)break;
        applyDamage(nx,S.dmg*0.7,{pierce:T.pierce});
        fx.push({k:'bolt',x1:cur.x,y1:cur.y,x2:nx.x,y2:nx.y,life:.2,c:T.color});
        hits.push(nx);cur=nx;
      }
    }else if(T.hit){
      applyDamage(tg,S.dmg,{pierce:T.pierce});
      fx.push({k:'rail',x1:t.x+Math.cos(t.ang)*20,y1:t.y+Math.sin(t.ang)*20,x2:tg.x,y2:tg.y,life:.18,c:'#e8c8ff',thin:1});
      particles(tg.x,tg.y,5,'#e8c8ff',90,.3,2.2);
    }else if(T.mortar){
      const sp=230,dd=Math.hypot(tg.x-t.x,tg.y-t.y),tt=dd/sp;
      projs.push({x:t.x,y:t.y,sx:t.x,sy:t.y,tx:tg.x+tg.vx*tt,ty:tg.y+tg.vy*tt,mortar:true,sp,dmg:S.dmg,splash:T.splash*(1+.06*(t.lvl-1)),c:T.color,r:6,pierce:T.pierce,t:0,dur:Math.max(.35,tt)});
      particles(t.x+Math.cos(t.ang)*16,t.y+Math.sin(t.ang)*16,5,'#d0d0d0',60,.4,3);
    }else{
      const shots=(t.type==='gun'&&t.lvl>=3)?2:1;
      for(let i=0;i<shots;i++){
        projs.push({x:t.x+Math.cos(t.ang)*14,y:t.y+Math.sin(t.ang)*14,tg,sp:T.splash?260:(T.slow||T.poisonDps?380:500),dmg:S.dmg,splash:T.splash?T.splash*(1+.06*(t.lvl-1)):0,slow:T.slow?Math.max(.18,T.slow-.07*(t.lvl-1)):0,
          burn:T.burnDps?T.burnDps*(1+.6*(t.lvl-1)):0,poison:T.poisonDps?T.poisonDps*(1+.6*(t.lvl-1)):0,c:T.color,r:T.splash?6:3,pierce:T.pierce,kind:t.type,off:i?6:0});
      }
      if(t.type==='flame')particles(t.x+Math.cos(t.ang)*18,t.y+Math.sin(t.ang)*18,3,'#ffa040',80,.3,3.5);
    }
  }
}
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let u=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;u=clamp(u,0,1);
  return Math.hypot(px-(x1+u*dx),py-(y1+u*dy));
}
function explode(x,y,R,dmg,pierce,opts={}){
  fx.push({k:'boom',x,y,r:R,life:.35});
  particles(x,y,12,'#ffb44a',150,.5,3.5);particles(x,y,6,'#555',70,.7,5);
  for(const e of enemies)if(!e.dead&&!e.def.air&&Math.hypot(e.x-x,e.y-y)<=R+e.def.r*.5){
    applyDamage(e,dmg,{pierce});
    if(opts.burn)applyDot(e,'burn',opts.burn,2.5);
    if(opts.poison)applyDot(e,'poison',opts.poison,4);
    if(opts.slow&&!e.dead){e.slowT=1.6;e.slowF=opts.slow;}
  }
}
function updateProjs(dt){
  for(const p of projs){
    if(p.mortar){
      p.t+=dt;const u=Math.min(1,p.t/p.dur);
      p.x=p.sx+(p.tx-p.sx)*u;p.y=p.sy+(p.ty-p.sy)*u;p.z=Math.sin(u*Math.PI)*46;
      if(u>=1){p.dead=true;explode(p.tx,p.ty,p.splash,p.dmg,p.pierce);}
      continue;
    }
    const tg=p.tg;
    if(tg.dead){p.dead=true;continue;}
    const dx=tg.x-p.x,dy=tg.y-p.y,d=Math.hypot(dx,dy),m=p.sp*dt;
    p.ang=Math.atan2(dy,dx);
    if(p.kind==='missile'&&Math.random()<.9)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,life:.35,max:.35,s:3,c:'#c8c8d0'});
    if(p.kind==='flame')parts.push({x:p.x,y:p.y,vx:0,vy:-12,life:.25,max:.25,s:4,c:'#ff9a3c'});
    if(d<=m+tg.def.r*.6){
      p.dead=true;
      if(p.splash)explode(tg.x,tg.y,p.splash,p.dmg,p.pierce,{burn:p.burn,poison:p.poison,slow:p.slow});
      else{
        applyDamage(tg,p.dmg,{pierce:p.pierce});
        if(p.burn)applyDot(tg,'burn',p.burn,2.5);
        if(p.poison)applyDot(tg,'poison',p.poison,4);
        if(p.slow&&!tg.dead){tg.slowT=1.6;tg.slowF=p.slow;}
        if(p.kind==='frost'){fx.push({k:'ring',x:tg.x,y:tg.y,life:.3,c:'#9eeaff',r:20});}
        particles(tg.x,tg.y,3,p.c,60,.25,2);
      }
    }else{p.x+=dx/d*m;p.y+=dy/d*m;}
  }
}
/* ---------- kỹ năng ---------- */
function castStrike(x,y){
  if(skill.strike.cd>0||over)return;
  skill.strike.cd=skill.strike.max;aim=null;$('skStrike').classList.remove('aim');
  for(let i=0;i<6;i++)strikes.push({t:.5+i*.16,x:x+(Math.random()-.5)*130,y:y+(Math.random()-.5)*90});
  fx.push({k:'target',x,y,life:1.4,r:90});
  showMsg('🚀 Không kích đang tới!');
}
function castFreeze(){
  if(skill.freeze.cd>0||over)return;
  skill.freeze.cd=skill.freeze.max;
  for(const e of enemies){if(!e.dead){e.slowT=Math.max(e.slowT,3.5);e.slowF=.12;}}
  fx.push({k:'frostwave',life:.9});
  showMsg('❄️ Cả bầy bị đóng băng!');
}
function updateStrikes(dt){
  for(const s of strikes){
    s.t-=dt;
    if(s.t<=0&&!s.done){s.done=true;
      explode(s.x,s.y,75,260,true);
      for(const e of enemies)if(!e.dead&&e.def.air&&Math.hypot(e.x-s.x,e.y-s.y)<55)applyDamage(e,260,{pierce:true});
      fx.push({k:'ring',x:s.x,y:s.y,life:.4,c:'#ffd27a',r:75});
    }
  }
  strikes=strikes.filter(s=>!s.done);
}

function update(dt){
  if(over||paused)return;
  gtime+=dt;
  for(const k in skill)skill[k].cd=Math.max(0,skill[k].cd-dt);
  if(spawnQ.length){
    spawnT-=dt;
    if(spawnT<=0){const s=spawnQ.shift();spawn(s);spawnT=s.gap;}
  }
  for(const e of enemies)e.haste=1;
  for(const e of enemies)if(!e.dead&&e.def.haste)for(const o of enemies)if(o!==e&&!o.dead&&Math.hypot(o.x-e.x,o.y-e.y)<130)o.haste=Math.max(o.haste,1.35);
  for(const e of enemies){if(!e.dead){stepEnemy(e,dt);if(e.hurt>0)e.hurt-=dt;}}
  for(const e of enemies){
    if(e.dead||!e.dots.length)continue;
    for(let i=e.dots.length-1;i>=0;i--){
      const d=e.dots[i];
      d.t-=dt;
      if(d.t<=0){e.dots.splice(i,1);continue;}
      applyDamage(e,d.dps*dt,{dot:true});
      if(Math.random()<dt*10)parts.push({x:e.x+(Math.random()-.5)*8,y:e.y-4,vx:0,vy:-25,life:.4,max:.4,s:2.4,c:d.color});
      if(e.dead)break;
    }
  }
  updateTowers(dt);updateProjs(dt);updateStrikes(dt);
  enemies=enemies.filter(e=>!e.dead);projs=projs.filter(p=>!p.dead);
  if(pendingSpawns.length){enemies.push(...pendingSpawns);pendingSpawns=[];}
  for(const f of fx)f.life-=dt;fx=fx.filter(f=>f.life>0);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;}
  parts=parts.filter(p=>p.life>0);if(parts.length>600)parts.splice(0,parts.length-600);
  if(waveActive&&!spawnQ.length&&!enemies.length){
    waveActive=false;
    if(wave>=TOTAL){endGame(true);return;}
    const bonus=Math.round((20+wave*3)*D.bonus);earn(bonus);showMsg('✅ Xong đợt '+wave+'! Thưởng +'+bonus+' 💰');
    $('go').disabled=false;$('go').textContent='▶ Bắt đầu đợt '+(wave+1);updUI();showPreview();
  }
}
function endGame(win){
  if(over)return;
  over=true;
  const mult=[1,1.5,2,3][GC.i];
  const score=Math.round((wave*100+lives*20+kills*2+(win?600:0))*mult);
  setTimeout(()=>GC.result({win,title:win?'🏆 Chiến thắng!':'💥 Thua rồi!',score,
    lines:[win?'Giữ vững '+TOTAL+' đợt':'Cầm cự đến đợt '+wave+'/'+TOTAL,'Hạ '+kills+' địch','❤️ còn '+lives]}),650);
}

/* ================= VẼ ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lg(x0,y0,x1,y1,st){const g=ctx.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
function rg(x,y,r0,r1,st){const g=ctx.createRadialGradient(x,y,r0,x,y,r1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
const INK='#1c1b3a';

/* nền tĩnh vẽ sẵn */
let bg;
function makeBg(){
  bg=document.createElement('canvas');bg.width=CW;bg.height=CH;const g=bg.getContext('2d');
  let seed=12345;const rand=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    g.fillStyle=(c+r)%2?'#74b852':'#7cc25a';g.fillRect(c*CS,r*CS,CS,CS);
  }
  const vg=g.createRadialGradient(CW/2,CH/2,CH*.3,CW/2,CH/2,CH*.95);vg.addColorStop(0,'rgba(255,255,200,.10)');vg.addColorStop(1,'rgba(20,60,20,.28)');
  g.fillStyle=vg;g.fillRect(0,0,CW,CH);
  for(let i=0;i<260;i++){ // cỏ
    const x=rand()*CW,y=rand()*CH;g.strokeStyle=rand()<.5?'#5aa043':'#8ad66a';g.lineWidth=1.4;
    g.beginPath();g.moveTo(x,y);g.lineTo(x-2,y-5);g.moveTo(x,y);g.lineTo(x+2,y-6);g.stroke();
  }
  const fl=['#fff','#ffd93b','#ff8fb3','#b9a3ff'];
  for(let i=0;i<70;i++){ // hoa
    const x=rand()*CW,y=rand()*CH;g.fillStyle=fl[(rand()*4)|0];
    for(let k=0;k<5;k++){g.beginPath();g.arc(x+Math.cos(k*1.256)*2.4,y+Math.sin(k*1.256)*2.4,1.7,0,7);g.fill();}
    g.fillStyle='#ffb300';g.beginPath();g.arc(x,y,1.3,0,7);g.fill();
  }
  for(let i=0;i<30;i++){ // đá nhỏ
    const x=rand()*CW,y=rand()*CH;g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.ellipse(x+1,y+2,5,2.5,0,0,7);g.fill();
    g.fillStyle='#b3b8b0';g.beginPath();g.ellipse(x,y,4.5,3,0,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.stroke();
  }
}

function drawPath(){
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();pathPts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle='rgba(90,60,20,.55)';ctx.lineWidth=32;ctx.stroke();
  ctx.strokeStyle='#d7b57a';ctx.lineWidth=27;ctx.stroke();
  ctx.strokeStyle='#e6c88f';ctx.lineWidth=18;ctx.stroke();
  ctx.setLineDash([2,16]);ctx.strokeStyle='rgba(120,80,30,.5)';ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
  /* mũi tên chạy dọc đường */
  ctx.fillStyle='rgba(255,255,255,.55)';
  const off=(gtime*40)%80;
  let acc=0;
  for(let i=1;i<pathPts.length;i++){
    const a=pathPts[i-1],b=pathPts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(!l)continue;
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    for(let s=(80-((acc+off)%80))%80;s<l;s+=80){
      const x=a[0]+Math.cos(ang)*s,y=a[1]+Math.sin(ang)*s;
      ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(-3,-4);ctx.lineTo(-3,4);ctx.closePath();ctx.fill();ctx.restore();
    }
    acc+=l;
  }
}
function drawGates(){
  // cổng vào (chuồng gỗ) & ruộng ra
  ctx.save();ctx.translate(0,SR*CS);
  ctx.fillStyle=lg(0,0,0,CS,[[0,'#d9534a'],[1,'#a83a33']]);rr(-6,-4,CS-2,CS+8,6);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='800 11px Baloo 2,sans-serif';ctx.textAlign='center';ctx.fillText('VÀO',CS/2-6,CS/2+4);
  ctx.restore();
  ctx.save();ctx.translate(GOALC*CS,GR*CS);
  ctx.fillStyle=lg(0,0,0,CS,[[0,'#4aa0ff'],[1,'#2f6fd0']]);rr(4,-4,CS+8,CS+8,6);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='800 11px Baloo 2,sans-serif';ctx.textAlign='center';ctx.fillText('RA',CS/2+4,CS/2+4);
  ctx.restore();
}

/* ---- thân tháp & nòng ---- */
function drawTower(t,x,y,time,icon){
  const T=TYPES[t.type],lvl=t.lvl||1,ang=icon?-.5:(t.ang||0);
  ctx.save();
  if(!icon){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+3,y+8,18,12,0,0,7);ctx.fill();}
  // đế đá
  ctx.fillStyle=lg(x,y-17,x,y+17,[[0,'#aab2bb'],[1,'#626a74']]);rr(x-17,y-17,34,34,8);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.28)';rr(x-14,y-14,28,6,3);ctx.fill();
  ctx.fillStyle='#3d434a';for(const [bx,by] of [[-12,-12],[12,-12],[-12,12],[12,12]]){ctx.beginPath();ctx.arc(x+bx,y+by,1.7,0,7);ctx.fill();}
  if(lvl>=3){ctx.strokeStyle=lvl>=5?'#ffd93b':'#e8c24a';ctx.lineWidth=2;rr(x-14.5,y-14.5,29,29,6);ctx.stroke();}
  if(lvl>=5&&!icon){
    const a=.35+.25*Math.sin(time*5);ctx.fillStyle=rg(x,y,6,26,[[0,'rgba(255,217,59,'+a+')'],[1,'rgba(255,217,59,0)']]);ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.fill();
  }
  // vòng màu loại tháp
  ctx.fillStyle=lg(x-11,y-11,x+11,y+11,[[0,lighten(T.color,.35)],[1,T.color]]);ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
  ctx.translate(x,y);
  if(t.type==='radar'){ctx.rotate(time*1.6);}else ctx.rotate(ang);
  const rec=icon?0:(t.rec||0)*3;
  ctx.translate(-rec,0);
  ctx.lineWidth=1.8;ctx.strokeStyle=INK;
  const metal=lg(0,-6,0,6,[[0,'#6c7480'],[.5,'#3a4048'],[1,'#252a30']]);
  switch(t.type){
    case 'gun':{
      ctx.fillStyle=metal;
      const ys=lvl>=3?[-7,-1.5,4]:[-5,1];
      ys.forEach(yy=>{ctx.fillRect(3,yy,17+Math.min(lvl,4),3.4);ctx.strokeRect(3,yy,17+Math.min(lvl,4),3.4);});
      ctx.fillStyle='#ffe27a';if(rec>1.2)ys.forEach(yy=>ctx.fillRect(21+lvl,yy,5,3.4));
      break;}
    case 'cannon':{
      ctx.fillStyle=metal;rr(0,-6,19,12,2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#e8923a';ctx.fillRect(5,-6,3,12);ctx.fillRect(12,-6,3,12);
      ctx.fillStyle='#111';rr(17,-7.5,6,15,2);ctx.fill();
      break;}
    case 'frost':{
      ctx.fillStyle='#e8fbff';ctx.strokeStyle=INK;
      for(let k=0;k<3;k++){ctx.save();ctx.rotate(k*1.047);ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.lineTo(16,0);ctx.lineWidth=2.4;ctx.strokeStyle='#8ad8f0';ctx.stroke();ctx.restore();}
      ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(8,-7);ctx.lineTo(2,0);ctx.lineTo(8,7);ctx.closePath();ctx.fillStyle=lg(2,0,22,0,[[0,'#bff4ff'],[1,'#ffffff']]);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.stroke();
      break;}
    case 'sniper':{
      ctx.fillStyle=metal;ctx.fillRect(0,-2.3,27,4.6);ctx.strokeRect(0,-2.3,27,4.6);
      ctx.fillStyle='#e8d0ff';ctx.fillRect(10,-6,8,3.5);ctx.strokeRect(10,-6,8,3.5);
      ctx.fillStyle='#a45bd6';ctx.fillRect(25,-3.4,4,6.8);
      break;}
    case 'flame':{
      ctx.fillStyle='#8a3020';rr(-3,-8,14,16,4);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffb36b';ctx.fillRect(1,-5,6,3);
      ctx.fillStyle=metal;ctx.fillRect(10,-3,12,6);ctx.strokeRect(10,-3,12,6);
      const f=6+Math.sin(time*30)*2;ctx.fillStyle='#ff9a3c';ctx.beginPath();ctx.moveTo(22,-3);ctx.lineTo(22+f,0);ctx.lineTo(22,3);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.moveTo(22,-1.6);ctx.lineTo(22+f*.6,0);ctx.lineTo(22,1.6);ctx.closePath();ctx.fill();
      break;}
    case 'tesla':{
      ctx.rotate(-ang);
      ctx.fillStyle='#555d66';ctx.fillRect(-3,-3,6,12);ctx.strokeRect(-3,-3,6,12);
      ctx.fillStyle=rg(0,-8,1,9,[[0,'#fff'],[.4,'#f2e14c'],[1,'#c9a800']]);ctx.beginPath();ctx.arc(0,-8,8,0,7);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#fff9c0';ctx.lineWidth=1.4;
      for(let k=0;k<3;k++){const a=time*6+k*2.1;ctx.beginPath();ctx.moveTo(Math.cos(a)*8,-8+Math.sin(a)*8);ctx.lineTo(Math.cos(a+.3)*13,-8+Math.sin(a+.3)*13);ctx.stroke();}
      break;}
    case 'poison':{
      ctx.fillStyle=metal;ctx.fillRect(6,-3,14,6);ctx.strokeRect(6,-3,14,6);
      ctx.fillStyle=rg(-1,0,1,9,[[0,'#c9ff9a'],[1,'#4a9a2a']]);ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.strokeStyle=INK;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(-2+Math.sin(time*4)*1.5,-2,1.5,0,7);ctx.arc(2,1+Math.cos(time*5)*1,1.1,0,7);ctx.fill();
      ctx.fillStyle='#2a5a12';ctx.fillRect(19,-4,3,8);
      break;}
    case 'missile':{
      ctx.fillStyle='#6a2a4a';rr(-3,-9,22,18,3);ctx.fill();ctx.stroke();
      [-5.5,0,5.5].forEach(yy=>{ctx.fillStyle='#fff';ctx.fillRect(2,yy-1.6,14,3.2);ctx.fillStyle='#ff5fa2';ctx.beginPath();ctx.moveTo(16,yy-1.8);ctx.lineTo(21,yy);ctx.lineTo(16,yy+1.8);ctx.fill();});
      break;}
    case 'laser':{
      ctx.fillStyle=metal;rr(-2,-8,14,16,4);ctx.fill();ctx.stroke();
      ctx.fillStyle='#2b2f36';ctx.fillRect(10,-3.2,12,6.4);ctx.strokeRect(10,-3.2,12,6.4);
      const gl=.6+.4*Math.sin(time*9);
      ctx.fillStyle=rg(24,0,1,8,[[0,'#fff'],[.4,'rgba(255,59,107,'+gl+')'],[1,'rgba(255,59,107,0)']]);ctx.beginPath();ctx.arc(24,0,8,0,7);ctx.fill();
      ctx.fillStyle='#ff3b6b';ctx.beginPath();ctx.arc(4,0,3,0,7);ctx.fill();
      break;}
    case 'rail':{
      ctx.fillStyle=metal;rr(-4,-8,12,16,3);ctx.fill();ctx.stroke();
      [-4,1.6].forEach(yy=>{ctx.fillStyle='#38404a';ctx.fillRect(4,yy,26,2.6);ctx.strokeRect(4,yy,26,2.6);});
      const gl=icon?.7:Math.max(0,1-(t.cd/(stat(t).rate||1)))*.9+.1;
      ctx.strokeStyle='rgba(70,224,255,'+gl+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(28,0);ctx.stroke();
      ctx.fillStyle='#46e0ff';ctx.fillRect(-1,-2,4,4);
      break;}
    case 'mortar':{
      ctx.fillStyle='#6b7448';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=metal;ctx.beginPath();ctx.moveTo(2,-7);ctx.lineTo(18,-5.5);ctx.lineTo(18,5.5);ctx.lineTo(2,7);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(18,0,2.5,5.5,0,0,7);ctx.fill();
      ctx.fillStyle='#d6c95a';ctx.fillRect(7,-6,3,12);
      break;}
    case 'radar':{
      ctx.fillStyle='#e8fff6';ctx.beginPath();ctx.ellipse(2,0,5,12,0,0,7);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#35d0a0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(10,0);ctx.stroke();
      ctx.fillStyle='#ff5a5a';ctx.beginPath();ctx.arc(10,0,2,0,7);ctx.fill();
      break;}
  }
  ctx.restore();
  // sao cấp
  ctx.fillStyle='#ffd93b';ctx.strokeStyle=INK;ctx.lineWidth=1;
  for(let i=0;i<lvl;i++){ctx.beginPath();ctx.arc(x-(lvl-1)*4+i*8,y+15,2.9,0,7);ctx.fill();ctx.stroke();}
}
function lighten(hex,a){
  const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(v+(255-v)*a);return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}

/* ---- địch ---- */
function blob(r,col,hl=.4){
  ctx.fillStyle=rg(-r*.3,-r*.35,r*.1,r*1.1,[[0,lighten(col,hl)],[1,col]]);
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
}
function eyes(r,dx=3,dy=-2,s=3){
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(dx,dy,s,0,7);ctx.arc(dx-s*1.9,dy,s,0,7);ctx.fill();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(dx+1,dy,s*.5,0,7);ctx.arc(dx-s*1.9+1,dy,s*.5,0,7);ctx.fill();
}
function feet(r,bob,anim){
  const s=Math.sin(anim*10);
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.ellipse(-r*.4+s*2,r*.85,r*.35,r*.2,0,0,7);ctx.ellipse(r*.4-s*2,r*.85,r*.35,r*.2,0,0,7);ctx.fill();
}
function drawEnemy(e){
  const d=e.def,r=d.r,t=e.type,bob=Math.sin(e.anim*10)*1.5;
  ctx.save();ctx.translate(e.x,e.y);
  if(!d.air){ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,r*.85,r*.95,r*.36,0,0,7);ctx.fill();}
  else{ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(6,r+16,r*.9,r*.3,0,0,7);ctx.fill();}
  if(d.stealth)ctx.globalAlpha=.55;
  if(e.hurt>0)ctx.filter='brightness(1.7)';
  ctx.translate(0,d.air?Math.sin(e.anim*6)*2:bob*.6);
  ctx.lineWidth=2;ctx.strokeStyle=INK;
  const a=e.anim;
  switch(t){
    case 'grunt':feet(r,bob,a);blob(r,d.col);ctx.fillStyle='#4a7a2a';ctx.beginPath();ctx.arc(0,-r*.2,r,3.4,6.0);ctx.fill();eyes(r);break;
    case 'runner':{
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-r-4,i*4);ctx.lineTo(-r-14,i*4);ctx.stroke();}
      ctx.strokeStyle=INK;ctx.lineWidth=2;feet(r,bob,a*1.6);blob(r,d.col);
      ctx.fillStyle='#e03a3a';ctx.fillRect(-r,-r*.5,r*2,3);ctx.fillRect(-r-5,-r*.5+1,6,3);eyes(r,3,0,2.6);break;}
    case 'mini':feet(r,bob,a);blob(r,d.col);eyes(r,2,-1,2);break;
    case 'tank':{
      ctx.fillStyle='#2a2a30';rr(-r-1,-r*.95,r*2+2,r*.5,3);ctx.fill();ctx.stroke();rr(-r-1,r*.45,r*2+2,r*.5,3);ctx.fill();ctx.stroke();
      ctx.fillStyle='#6a6a72';for(let i=-3;i<=3;i++){const o=(a*6+i*5)%5;ctx.fillRect(i*r*.28-o*.3,-r*.8,2,3);ctx.fillRect(i*r*.28-o*.3,r*.6,2,3);}
      ctx.fillStyle=lg(0,-r*.7,0,r*.7,[[0,lighten(d.col,.35)],[1,d.col]]);rr(-r*.85,-r*.62,r*1.7,r*1.24,5);ctx.fill();ctx.stroke();
      ctx.fillStyle=lg(0,-r*.4,0,r*.4,[[0,'#a07a5a'],[1,'#6a4a30']]);ctx.beginPath();ctx.arc(-1,0,r*.5,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#2a2a30';ctx.fillRect(0,-3,r+4,6);ctx.strokeRect(0,-3,r+4,6);break;}
    case 'armored':feet(r,bob,a);blob(r,d.col);
      ctx.fillStyle=lg(0,-r,0,0,[[0,'#d5dde6'],[1,'#8c99a6']]);ctx.beginPath();ctx.arc(0,-r*.1,r*1.02,3.3,6.12);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*.5,-r*.55,1.4,0,7);ctx.arc(r*.5,-r*.55,1.4,0,7);ctx.fill();eyes(r,3,2,2.6);break;
    case 'shielded':feet(r,bob,a);blob(r,d.col);eyes(r);ctx.fillStyle='#e8f6ff';ctx.fillRect(-r*.9,-1,r*.3,r*.8);break;
    case 'healer':feet(r,bob,a);blob(r,d.col);ctx.fillStyle='#fff';ctx.fillRect(-2,-1,4,10);ctx.fillRect(-5,2,10,4);
      ctx.strokeStyle='#ffe27a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-r-3,r*.6,3,0,0,7);ctx.stroke();eyes(r,3,-4,2.4);break;
    case 'splitter':feet(r,bob,a);blob(r,d.col);ctx.fillStyle=lighten(d.col,.3);ctx.beginPath();ctx.arc(-r*.7,-r*.7,r*.35,0,7);ctx.arc(r*.7,-r*.7,r*.35,0,7);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#5a3010';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*.6,r*.1);ctx.lineTo(0,r*.5);ctx.lineTo(r*.6,r*.1);ctx.moveTo(0,r*.5);ctx.lineTo(0,r*.95);ctx.stroke();eyes(r,3,-3,2.6);break;

      ctx.fillStyle=rg(r*.9,-r*.8,1,7,[[0,'#fff'],[.5,'#7af'],[1,'rgba(120,170,255,0)']]);ctx.beginPath();ctx.arc(r*.9,-r*.8,6+Math.sin(a*8),0,7);ctx.fill();
      ctx.strokeStyle='rgba(120,170,255,.35)';ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(0,0,r+10+Math.sin(a*6)*2,0,7);ctx.stroke();ctx.setLineDash([]);break;}
