<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phòng thủ cánh đồng</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Giao diện -->

    <style>
/* =====================================================
   GC KIT · giao diện chung "Góc Giải Trí" (neo-brutalist)
   ===================================================== */

:root {
  --gc-ink: #1c1b3a;
  --gc-paper: #fbf8ef;
  --gc-line: #e6e0cc;

  --gc-sun: #ffc93c;
  --gc-tomato: #ff6b57;
  --gc-mint: #2fc9a5;
  --gc-sky: #4b9dff;
  --gc-lilac: #a184ff;

  --gc-ok: #22b573;
  --gc-bad: #f0483e;

  --gc-shadow: 4px 4px 0 var(--gc-ink);
  --gc-head: 'Baloo 2', 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --gc-body: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
}

.gc-start,
.gc-start *,
.gc-modal,
.gc-modal *,
.gc-pill,
.gc-btn,
.gc-back {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Nút chung ---------- */
.gc-btn {
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 18px;
  line-height: 1.1;
  color: var(--gc-ink);
  cursor: pointer;
  border: 3px solid var(--gc-ink);
  background: var(--gc-sun);
  border-radius: 14px;
  padding: 11px 20px;
  box-shadow: 3px 3px 0 var(--gc-ink);
  transition: transform .1s, box-shadow .1s;
  user-select: none;
  -webkit-user-select: none;
}

.gc-btn:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--gc-ink);
}

.gc-btn.alt { background: #fff; }
.gc-btn.sky { background: var(--gc-sky); color: #fff; }
.gc-btn.mint { background: var(--gc-mint); }

.gc-btn.sm {
  font-size: 15px;
  padding: 7px 13px;
  border-radius: 12px;
}

.gc-btn:focus-visible,
.gc-lv:focus-visible,
.gc-back:focus-visible {
  outline: 4px solid var(--gc-sky);
  outline-offset: 2px;
}

/* ---------- Nút thoát thống nhất ---------- */
#homeBackBtn,
.gc-back {
  position: fixed;
  z-index: 2147483000;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 14px;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-family: var(--gc-head);
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
  color: var(--gc-ink);
  background: #fff;
  border: 3px solid var(--gc-ink);
  box-shadow: 3px 3px 0 var(--gc-ink);
  transition: transform .1s, box-shadow .1s;
}

#homeBackBtn:hover,
.gc-back:hover {
  filter: none;
  background: #fff7d6;
}

#homeBackBtn:active,
.gc-back:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--gc-ink);
}

/* ---------- Viên thuốc (pill) ---------- */
.gc-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 14px;
  line-height: 1;
  padding: 5px 11px;
  border: 2.5px solid var(--gc-ink);
  border-radius: 999px;
  background: #fff;
  color: var(--gc-ink);
  white-space: nowrap;
}

.gc-d0 { background: var(--gc-mint); }
.gc-d1 { background: var(--gc-sun); }
.gc-d2 { background: var(--gc-tomato); }
.gc-d3 { background: var(--gc-lilac); }

.gc-hudbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.gc-hudbar .gc-pill {
  box-shadow: 2px 2px 0 var(--gc-ink);
}

.gc-chip {
  position: fixed;
  z-index: 2147482500;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 12px);
  pointer-events: none;
}

/* ---------- Màn chọn độ khó ---------- */
.gc-start {
  position: fixed;
  inset: 0;
  z-index: 2147482000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow: auto;
  padding: 62px 14px calc(18px + env(safe-area-inset-bottom, 0px));
  font-family: var(--gc-body);
  color: var(--gc-ink);
  background-color: var(--gc-paper);
  background-image:
    linear-gradient(var(--gc-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--gc-line) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-overflow-scrolling: touch;
}

.gc-start.out {
  animation: gcOut .25s forwards;
}

@keyframes gcOut {
  to { opacity: 0; transform: scale(1.03); }
}

.gc-card {
  width: 100%;
  max-width: 460px;
  margin: auto;
  background: #fff;
  border: 3px solid var(--gc-ink);
  border-radius: 24px;
  box-shadow: var(--gc-shadow);
  padding: 20px 16px 18px;
  text-align: center;
  animation: gcPop .4s cubic-bezier(.2, 1.2, .4, 1);
}

@keyframes gcPop {
  0%   { transform: scale(.88); opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}

.gc-ico {
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin: -46px auto 8px;
  font-size: 36px;
  background: var(--gc-sun);
  border: 3px solid var(--gc-ink);
  border-radius: 20px;
  box-shadow: 3px 3px 0 var(--gc-ink);
  transform: rotate(-6deg);
}

.gc-title {
  margin: 0;
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 30px;
  line-height: 1.05;
  letter-spacing: -.3px;
}

.gc-desc {
  margin: 8px 4px 0;
  font-size: 14px;
  line-height: 1.45;
  color: #4b4a6a;
}

.gc-h {
  margin: 16px 0 8px;
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: #6a6990;
}

.gc-levels {
  display: grid;
  gap: 9px;
}

.gc-lv {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  text-align: left;
  font-family: inherit;
  color: var(--gc-ink);
  cursor: pointer;
  background: #fff;
  border: 3px solid var(--gc-ink);
  border-radius: 16px;
  padding: 9px 12px;
  box-shadow: 2px 2px 0 var(--gc-ink);
  transition: transform .1s, box-shadow .1s, background .15s;
}

.gc-lv .e {
  flex: none;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  font-size: 22px;
  border: 2.5px solid var(--gc-ink);
  border-radius: 13px;
  background: var(--c);
}

.gc-lv .t {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.gc-lv .t b {
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 19px;
  line-height: 1.05;
  display: flex;
  align-items: center;
  gap: 8px;
}

.gc-lv .t small {
  font-size: 12.5px;
  line-height: 1.3;
  color: #55547a;
}

.gc-lv .pips {
  display: inline-flex;
  gap: 3px;
}

.gc-lv .pips i {
  width: 8px;
  height: 8px;
  border: 2px solid var(--gc-ink);
  border-radius: 50%;
  background: #fff;
}

.gc-lv .pips i.on {
  background: var(--c);
}

.gc-lv .bst {
  flex: none;
  align-self: flex-start;
  font-size: 12px;
  font-weight: 700;
  color: #55547a;
  white-space: nowrap;
}

.gc-lv[aria-checked=true] {
  background: color-mix(in srgb, var(--c) 22%, #fff);
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--gc-ink);
}

.gc-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

.gc-actions .gc-btn {
  width: 100%;
  font-size: 21px;
  padding: 13px 18px;
}

.gc-actions .gc-resume {
  font-size: 16px;
  padding: 10px 14px;
}

.gc-note {
  margin: 10px 0 0;
  font-size: 12px;
  color: #6a6990;
}

@media (max-height: 640px) {
  .gc-start { padding-top: 56px; }
  .gc-ico   { width: 56px; height: 56px; font-size: 30px; margin-top: -40px; }
  .gc-title { font-size: 25px; }
  .gc-lv    { padding: 6px 10px; }
  .gc-lv .e { width: 36px; height: 36px; font-size: 19px; }
  .gc-h     { margin: 10px 0 6px; }
}

/* ---------- Hộp kết quả ---------- */
.gc-modal {
  position: fixed;
  inset: 0;
  z-index: 2147482600;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(28, 27, 58, .6);
  font-family: var(--gc-body);
  color: var(--gc-ink);
}

.gc-panel {
  width: 100%;
  max-width: 400px;
  max-height: 100%;
  overflow: auto;
  background: #fff;
  border: 3px solid var(--gc-ink);
  border-radius: 22px;
  padding: 20px;
  box-shadow: var(--gc-shadow);
  text-align: center;
  animation: gcPop .4s;
}

.gc-panel h2 {
  margin: 0;
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 32px;
  line-height: 1.05;
}

.gc-big {
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 60px;
  line-height: 1;
  margin: 8px 0;
}

.gc-stats {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}

.gc-stats span {
  background: var(--gc-paper);
  border: 2.5px solid var(--gc-ink);
  border-radius: 999px;
  padding: 4px 12px;
  font-weight: 700;
  font-size: 14px;
}

.gc-panel .gc-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 14px;
}

.gc-panel .gc-row .gc-btn {
  font-size: 16px;
  padding: 10px 16px;
}

@media (prefers-reduced-motion: reduce) {
  .gc-card,
  .gc-panel,
  .gc-start.out {
    animation: none !important;
  }

  .gc-lv,
  .gc-btn {
    transition: none !important;
  }
}
    </style>

    <style>
/* =====================================================
   Phòng thủ cánh đồng · giao diện riêng của game
   ===================================================== */

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  color: var(--gc-ink);
  font-family: var(--gc-body);
  background-color: var(--gc-paper);
  background-image:
    linear-gradient(var(--gc-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--gc-line) 1px, transparent 1px);
  background-size: 28px 28px;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  align-items: center;
}

button {
  font-family: var(--gc-head);
  cursor: pointer;
}

/* ---------- HUD trên ---------- */
#top {
  position: relative;
  width: 100%;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 7px 10px 6px 60px;
  background: #fff;
  border-bottom: 3px solid var(--gc-ink);
}

.hud__l,
.hud__r {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.hud__c {
  flex: 1 1 auto;
  min-width: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

/* Xu · nhà còn mạng */
.hud__coin,
.hud__body {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--gc-paper);
  border: 2.5px solid var(--gc-ink);
  border-radius: 12px;
  padding: 3px 12px;
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 18px;
  line-height: 1.2;
  box-shadow: 2px 2px 0 var(--gc-ink);
  white-space: nowrap;
}

.hud__coin {
  border-radius: 999px;
  background: #fff3c6;
}

.hud__house {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hud__roof {
  width: 100%;
  max-width: 76px;
  height: 15px;
  margin-bottom: -2px;
  position: relative;
  z-index: 1;
}

.hud__body {
  min-width: 66px;
  justify-content: center;
  background: #fff;
}

/* Điểm · đợt · thanh tiến trình */
.hud__round {
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 13px;
  line-height: 1.1;
  color: #55547a;
  white-space: nowrap;
}

.hud__round b {
  font-size: 15px;
  color: var(--gc-ink);
}

.hud__score {
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 29px;
  line-height: 1;
  letter-spacing: -.5px;
}

.hud__meter {
  width: 100%;
  max-width: 250px;
  height: 9px;
  background: var(--gc-paper);
  border: 2px solid var(--gc-ink);
  border-radius: 999px;
  overflow: hidden;
}

.hud__meter i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gc-sky);
  border-radius: 999px;
  transition: width .25s;
}

/* Nút vuông nhỏ */
.hud__sq {
  width: 36px;
  height: 36px;
  padding: 0;
  display: grid;
  place-items: center;
  background: #fff;
  color: var(--gc-ink);
  border: 2.5px solid var(--gc-ink);
  border-radius: 11px;
  box-shadow: 2px 2px 0 var(--gc-ink);
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 15px;
  line-height: 1;
  transition: transform .1s, box-shadow .1s, background .15s;
}

.hud__sq:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--gc-ink);
}

.hud__sq.on {
  background: var(--gc-sun);
}

.hud__sq.danger {
  background: var(--gc-bad);
  color: #fff;
}

.hud__ctrl {
  display: flex;
  gap: 5px;
}

.pulse {
  animation: pulse .35s;
}

@keyframes pulse {
  50% { transform: scale(1.15); background: #fff1c2; }
}

/* Menu cài đặt (bánh răng) */
.hud__menu {
  position: absolute;
  z-index: 30;
  top: calc(100% + 8px);
  left: 58px;
  width: 264px;
  display: none;
  flex-direction: column;
  gap: 9px;
  padding: 12px;
  background: #fff;
  border: 3px solid var(--gc-ink);
  border-radius: 16px;
  box-shadow: var(--gc-shadow);
  font-family: var(--gc-body);
}

.hud__menu.open {
  display: flex;
}

.hud__menu h3 {
  margin: 0;
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 16px;
}

.hud__menu .sub {
  margin: -6px 0 0;
  font-size: 12px;
  color: #6a6990;
  line-height: 1.35;
}

.hud__menu .row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.hud__menu .btn {
  font-size: 13.5px;
  padding: 6px 11px;
}

.hud__menu .btn.sel {
  background: var(--gc-sun);
}

.hud__menu label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}

/* Xem trước đợt kế tiếp */
#preview {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: nowrap;
  flex-basis: 100%;
  overflow-x: auto;
  justify-content: center;
  font-size: 12px;
  padding: 0 2px 2px;
  scrollbar-width: none;
}

#preview::-webkit-scrollbar {
  display: none;
}

#preview .pv {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: #fff;
  border: 2px solid var(--gc-ink);
  border-radius: 999px;
  padding: 1px 8px 1px 5px;
  font-weight: 700;
}

/* Nhãn "tinh anh" trong phần xem trước */
#preview .pv.elite {
  background: linear-gradient(135deg, #fff2b8, #ffc93c);
}

/* ---------- Nút ---------- */
.btn {
  padding: 7px 14px;
  border-radius: 14px;
  background: var(--gc-sun);
  color: var(--gc-ink);
  font-weight: 800;
  font-size: 15px;
  border: 3px solid var(--gc-ink);
  box-shadow: 3px 3px 0 var(--gc-ink);
  transition: transform .1s, box-shadow .1s;
}

.btn:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--gc-ink);
}

.btn.alt  { background: #fff; }
.btn.red  { background: var(--gc-bad); color: #fff; }
.btn.mint { background: var(--gc-mint); }

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
  box-shadow: none;
}

/* ---------- Cánh đồng ---------- */
#field {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
}

canvas#c {
  display: block;
  touch-action: none;
  cursor: crosshair;
  border: 3px solid var(--gc-ink);
  border-radius: 16px;
  box-shadow: var(--gc-shadow);
  background: #7cc05a;
}

/* ---------- Thanh dưới ---------- */
#bottom {
  width: 100%;
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: stretch;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: #fff;
  border-top: 3px solid var(--gc-ink);
}

#towers {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: center;
  align-content: flex-start;
  max-width: 820px;
  max-height: 130px;
  overflow-y: auto;
  padding: 0 4px 4px 0;
}

.tw {
  width: 128px;
  border-radius: 14px;
  padding: 3px 6px 3px 3px;
  background: #fff;
  border: 3px solid var(--gc-ink);
  color: var(--gc-ink);
  text-align: left;
  box-shadow: 3px 3px 0 var(--gc-ink);
  transition: transform .1s, box-shadow .1s, background .15s;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 4px;
  line-height: 1.1;
}

.tw canvas {
  width: 40px;
  height: 40px;
  flex: none;
}

.tw .tx {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.tw b {
  font-weight: 800;
  font-size: 13px;
  white-space: nowrap;
}

.tw .tx span {
  font-family: var(--gc-body);
  font-size: 11.5px;
  font-weight: 700;
  opacity: .85;
  white-space: nowrap;
}

.tw:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--gc-ink);
}

.tw.sel {
  background: var(--gc-sun);
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--gc-ink);
}

.tw.poor {
  opacity: .5;
}

.tw .k {
  font-size: 10px;
  font-family: var(--gc-body);
  opacity: .6;
}

/* ---------- Khung thông tin & kỹ năng ---------- */
#side {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 210px;
  max-width: 300px;
}

#info {
  flex: 1;
  min-height: 70px;
  max-height: 96px;
  overflow: auto;
  background: var(--gc-paper);
  border: 3px solid var(--gc-ink);
  border-radius: 16px;
  padding: 7px 11px;
  font-size: 13px;
  line-height: 1.38;
  box-shadow: 3px 3px 0 var(--gc-ink);
}

#info b {
  font-family: var(--gc-head);
  font-weight: 800;
  font-size: 15px;
}

#info .row {
  display: flex;
  gap: 7px;
  margin-top: 6px;
  flex-wrap: wrap;
}

#info .btn {
  padding: 5px 10px;
  font-size: 13px;
}

#skills {
  display: flex;
  gap: 7px;
}

.sk {
  flex: 1;
  position: relative;
  overflow: hidden;
  font-size: 14px;
  padding: 6px 8px;
  line-height: 1.1;
}

.sk .cd {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 100%;
  width: 0;
  background: rgba(28, 27, 58, .22);
  pointer-events: none;
}

.sk.aim {

  <!-- Thứ tự nạp script rất quan trọng (các file dùng chung biến toàn cục) -->
    <!-- js/gc-kit.js -->
    <script>
/* =====================================================
   GC KIT · logic dùng chung
   Chọn độ khó, kỷ lục theo độ khó, hộp kết quả
   ===================================================== */
(function () {
  'use strict';

  if (window.GC) return;

  var LV = [
    { i: 0, key: 'easy',   label: 'Dễ',         emoji: '🌱',  color: 'var(--gc-mint)' },
    { i: 1, key: 'normal', label: 'Trung bình', emoji: '🌤️', color: 'var(--gc-sun)' },
    { i: 2, key: 'hard',   label: 'Khó',        emoji: '🔥',  color: 'var(--gc-tomato)' },
    { i: 3, key: 'insane', label: 'Siêu khó',   emoji: '💀',  color: 'var(--gc-lilac)' }
  ];

  var DEFAULT_LEVEL_TEXT = [
    'Thong thả, ít áp lực',
    'Cân bằng, vừa sức',
    'Nhanh hơn, ít sai sót',
    'Thử thách cực đại'
  ];

  /* ---------- Tiện ích lưu trữ (an toàn khi bị chặn storage) ---------- */
  function ls(op, k, v) {
    try {
      return op === 'get' ? localStorage.getItem(k) : localStorage.setItem(k, v);
    } catch (e) {
      return null;
    }
  }

  function ss(op, k, v) {
    try {
      if (op === 'get') return sessionStorage.getItem(k);
      if (op === 'del') return sessionStorage.removeItem(k);
      return sessionStorage.setItem(k, v);
    } catch (e) {
      return null;
    }
  }

  function esc(s) {
    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return map[c];
    });
  }

  var GC = window.GC = {
    levels: LV,
    id: 'game',
    diff: LV[1],

    /** Độ khó hiện tại: 0 dễ · 1 trung bình · 2 khó · 3 siêu khó */
    get i() {
      return GC.diff.i;
    },

    /** GC.by(a,b,c,d) hoặc GC.by([a,b,c,d]) → giá trị theo độ khó đang chọn */
    by: function (a, b, c, d) {
      var arr = Array.isArray(a) ? a : [a, b, c, d];
      return arr[GC.diff.i];
    },

    setDiff: function (i) {
      GC.diff = LV[Math.max(0, Math.min(3, i | 0))];
    },

    esc: esc,

    /* ---------- Kỷ lục theo độ khó ---------- */
    best: {
      key: function (id, i) {
        return 'gc:' + id + ':best:' + LV[i == null ? GC.diff.i : i].key;
      },

      get: function (id, i) {
        return +ls('get', GC.best.key(id || GC.id, i)) || 0;
      },

      /** Lưu nếu cao hơn. Trả về true nếu là kỷ lục mới. */
      set: function (id, score, i) {
        id = id || GC.id;
        score = +score || 0;

        if (score > GC.best.get(id, i)) {
          ls('set', GC.best.key(id, i), score);
          return true;
        }
        return false;
      },

      /** Với game tính theo "thấp hơn là tốt hơn" (thời gian, số bước). */
      setLow: function (id, score, i) {
        id = id || GC.id;
        score = +score || 0;

        var cur = GC.best.get(id, i);
        if (score > 0 && (!cur || score < cur)) {
          ls('set', GC.best.key(id, i), score);
          return true;
        }
        return false;
      }
    },

    /** HTML pill độ khó: "🔥 Khó" */
    chip: function () {
      return '<span class="gc-pill gc-d' + GC.diff.i + '" title="Độ khó">' +
        GC.diff.emoji + ' ' + GC.diff.label + '</span>';
    },

    /** Gắn chip độ khó nổi ở góc phải trên. */
    mountChip: function () {
      var el = document.querySelector('.gc-chip');
      if (!el) {
        el = document.createElement('div');
        el.className = 'gc-chip';
        document.body.appendChild(el);
      }
      el.innerHTML = GC.chip();
      return el;
    },

    /** Thoát về danh sách game (báo cho React host) hoặc về trang chủ nếu mở riêng. */
    quit: function () {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'quit', data: {} }, '*');
          return;
        }
      } catch (e) { /* bỏ qua */ }

      try {
        window.location.href = '/';
      } catch (e) { /* bỏ qua */ }
    },

    /** Chơi lại CÙNG độ khó: nạp lại trang và tự bắt đầu, bỏ qua màn chọn. */
    again: function () {
      ss('set', 'gc:auto:' + GC.id, String(GC.diff.i));
      location.reload();
    },

    /** Quay lại màn chọn độ khó. */
    change: function () {
      ss('del', 'gc:auto:' + GC.id);
      location.reload();
    },

    /**
     * Hiện màn chọn độ khó. cfg:
     *   id, name, icon, desc,
     *   levels: [4 chuỗi mô tả riêng cho từng độ khó],
     *   resume: { i, text } (tuỳ chọn),
     *   onStart(diff), onResume(diff)
     */
    start: function (cfg) {
      GC.id = cfg.id || 'game';

      var texts = cfg.levels || DEFAULT_LEVEL_TEXT;
      var last = ls('get', 'gc:' + GC.id + ':diff');
      var sel = (last != null && last !== '' && +last >= 0 && +last <= 3) ? +last : 1;

      function launch(i, resumed) {
        GC.setDiff(i);
        ls('set', 'gc:' + GC.id + ':diff', String(i));

        var el = document.getElementById('gc-start');
        if (el) {
          el.classList.add('out');
          setTimeout(function () { el.remove(); }, 240);
        }

        document.removeEventListener('keydown', onKey, true);

        if (resumed && cfg.onResume) cfg.onResume(GC.diff);
        else if (cfg.onStart) cfg.onStart(GC.diff);
      }

      /* Chơi lại cùng độ khó: bỏ qua màn chọn */
      var auto = ss('get', 'gc:auto:' + GC.id);
      if (auto != null && auto !== '') {
        ss('del', 'gc:auto:' + GC.id);
        GC.setDiff(+auto);
        if (cfg.onStart) {
          cfg.onStart(GC.diff);
          return;
        }
      }

      var hasBack = !!document.getElementById('homeBackBtn');
      var root = document.createElement('div');

      root.className = 'gc-start';
      root.id = 'gc-start';
      root.setAttribute('role', 'dialog');
      root.setAttribute('aria-label', 'Chọn độ khó — ' + (cfg.name || ''));

      var levelsHtml = LV.map(function (l) {
        var best = GC.best.get(GC.id, l.i);

        var pips = [0, 1, 2, 3].map(function (k) {
          return '<i' + (k <= l.i ? ' class="on"' : '') + '></i>';
        }).join('');

        return '' +
          '<button type="button" class="gc-lv" role="radio" data-i="' + l.i + '" style="--c:' + l.color + '">' +
            '<span class="e">' + l.emoji + '</span>' +
            '<span class="t">' +
              '<b>' + l.label + '<span class="pips">' + pips + '</span></b>' +
              '<small>' + esc(texts[l.i] || '') + '</small>' +
            '</span>' +
            (best ? '<span class="bst">🏆 ' + best + '</span>' : '') +
          '</button>';
      }).join('');

      root.innerHTML = '' +
        (hasBack ? '' : '<button class="gc-back" type="button" aria-label="Về sảnh">←</button>') +
        '<div class="gc-card">' +
          '<div class="gc-ico">' + esc(cfg.icon || '🎮') + '</div>' +
          '<h1 class="gc-title">' + esc(cfg.name || 'Trò chơi') + '</h1>' +
          (cfg.desc ? '<p class="gc-desc">' + esc(cfg.desc) + '</p>' : '') +
          '<div class="gc-h">Chọn độ khó</div>' +
          '<div class="gc-levels" role="radiogroup" aria-label="Độ khó">' + levelsHtml + '</div>' +
          '<div class="gc-actions">' +
            '<button type="button" class="gc-btn gc-go">▶ Bắt đầu</button>' +
            (cfg.resume
              ? '<button type="button" class="gc-btn alt gc-resume">⏯ Tiếp tục ván đang chơi · ' +
                LV[cfg.resume.i].emoji + ' ' + LV[cfg.resume.i].label + '</button>'
              : '') +
          '</div>' +
        '</div>';

      document.body.appendChild(root);

      var btns = [].slice.call(root.querySelectorAll('.gc-lv'));

      function paint() {
        btns.forEach(function (b) {
          b.setAttribute('aria-checked', String(+b.dataset.i === sel));
        });
      }
      paint();

      btns.forEach(function (b) {
        b.onclick = function () {
          sel = +b.dataset.i;
          paint();
        };
        b.ondblclick = function () {
          launch(sel, false);
        };
      });

      root.querySelector('.gc-go').onclick = function () {
        launch(sel, false);
      };

      var resumeBtn = root.querySelector('.gc-resume');
      if (resumeBtn) {
        resumeBtn.onclick = function () {
          launch(cfg.resume.i, true);
        };
      }

      var backBtn = root.querySelector('.gc-back');
      if (backBtn) backBtn.onclick = GC.quit;

      function onKey(e) {
        if (!document.getElementById('gc-start')) return;

        if (e.key >= '1' && e.key <= '4') {
          sel = +e.key - 1;
          paint();
          e.preventDefault();
          e.stopPropagation();
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
          sel = Math.max(0, sel - 1);
          paint();
          e.preventDefault();
          e.stopPropagation();
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
          sel = Math.min(3, sel + 1);
          paint();
          e.preventDefault();
          e.stopPropagation();
        } else if (e.key === 'Enter') {
          launch(sel, false);
          e.preventDefault();
          e.stopPropagation();
        } else if (e.key === 'Escape') {
          GC.quit();
        }
      }
      document.addEventListener('keydown', onKey, true);

      var go = root.querySelector('.gc-go');
      try {
        go.focus({ preventScroll: true });
      } catch (e) { /* bỏ qua */ }
    },

    /**
     * Hộp kết quả thống nhất. cfg:
     *   title, score, lines:[], win:boolean, low:boolean (thấp hơn = tốt hơn),
     *   onAgain, onChange, onHome
     */
    result: function (cfg) {
      var isBest = cfg.score != null &&
        (cfg.low ? GC.best.setLow(GC.id, cfg.score) : GC.best.set(GC.id, cfg.score));

      var prev = document.getElementById('gc-modal');
      if (prev) prev.remove();

      var modal = document.createElement('div');
      modal.className = 'gc-modal';
      modal.id = 'gc-modal';

      var lines = (cfg.lines || []).map(function (l) {
        return '<span>' + esc(l) + '</span>';
      }).join('');

      modal.innerHTML = '' +
        '<div class="gc-panel" role="dialog">' +
          '<h2>' + esc(cfg.title || (cfg.win ? 'Chiến thắng! 🎉' : 'Hoàn thành!')) + '</h2>' +
          '<div style="margin-top:8px">' + GC.chip() + '</div>' +
          (cfg.score != null ? '<div class="gc-big">' + esc(cfg.score) + '</div>' : '') +
          '<div class="gc-stats">' + (isBest ? '<span>🏆 Kỷ lục mới</span>' : '') + lines + '</div>' +
          '<div class="gc-row">' +
            '<button class="gc-btn" data-a="again">Chơi lại</button>' +
            '<button class="gc-btn alt" data-a="change">Đổi độ khó</button>' +
            '<button class="gc-btn alt" data-a="home">Về sảnh</button>' +
          '</div>' +
        '</div>';

      document.body.appendChild(modal);

      modal.onclick = function (e) {
        var b = e.target.closest('[data-a]');
        if (!b) return;

        var action = b.dataset.a;
        if (action === 'again') (cfg.onAgain || GC.again)();
        else if (action === 'change') (cfg.onChange || GC.change)();
        else (cfg.onHome || GC.quit)();
      };

      return modal;
    }
  };
})();
    </script>

  return Math.min(0.55, 0.08 + (n - HARD_WAVE) * 0.03);

/* =====================================================
   utils.js · hàm tiện ích dùng chung
   ===================================================== */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

/** Khoảng cách từ điểm (px,py) đến đoạn thẳng (x1,y1)-(x2,y2) */
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const l2 = dx * dx + dy * dy;

  let u = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  u = clamp(u, 0, 1);

  return Math.hypot(px - (x1 + u * dx), py - (y1 + u * dy));
}

/** Tọa độ ô từ tọa độ pixel */
function cellOf(x, y) {
  return [
    clamp(Math.floor(x / CS), 0, COLS - 1),
    clamp(Math.floor(y / CS), 0, ROWS - 1)
  ];
}

/** Làm sáng một màu hex, trả về chuỗi rgb() */
function lighten(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16;
  const g = (n >> 8) & 255;
  const b = n & 255;
  const f = v => Math.round(v + (255 - v) * a);
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}

/** Làm tối một màu hex, trả về chuỗi rgb() */
function darken(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16;
  const g = (n >> 8) & 255;
  const b = n & 255;
  const f = v => Math.round(v * (1 - a));
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}

/** Bộ số ngẫu nhiên cố định (để nền luôn giống nhau) */
function seededRandom(seed) {
  let s = seed;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
}

/* =====================================================
   TÚI TIỀN = XU TÀI KHOẢN
   Game mở trong app (iframe) thì host React giữ ví:
   localStorage là bản đọc ngay khi vào game (không chờ mạng),
   API /auth/me/coins cập nhật số xu thật.
   Mỗi lần nhận/thu tiền trong game chỉ báo CHÊNH LỆCH cho host
   → host cộng dồn và gửi một lần; mất mạng thì host giữ lại.
   Mở file .html trực tiếp (không có host) → giữ tiền theo độ khó.
   ===================================================== */
const HOSTED = !!(window.parent && window.parent !== window);
const WKEY = 'gq_coin_wallet_v1';

function walletCoins() {
  try {
    return Math.max(0, Number(JSON.parse(localStorage.getItem(WKEY) || '{}').coins) || 0);
  } catch (e) {
    return 0;
  }
}

function purseShift(d) {
  money = Math.max(0, money + d);

  if (HOSTED) {
    try {
      window.parent.postMessage({ type: 'gq:walletDelta', data: { amount: d } }, '*');
    } catch (e) { /* bỏ qua */ }
  }

  updUI();
}

/** Nhận tiền (thưởng diệt địch, thưởng đợt, bán trụ) → xu tài khoản tăng theo. */
function earn(d) {
  if (d > 0) {
    purseShift(d);
    pulse('stMoney');
  }
}

/** Trả tiền (xây trụ, nâng cấp) → trừ thẳng vào xu tài khoản. */
function pay(d) {
  if (d > 0) purseShift(-d);
}

addEventListener('message', function (ev) {
  const m = ev && ev.data;
  if (!m || m.type !== 'gq:wallet') return;

  money = Math.max(0, Number(m.coins) || 0);
  updUI();
});

if (HOSTED) {
  try {
    window.parent.postMessage({ type: 'gq:walletGet', data: {} }, '*');
  } catch (e) { /* bỏ qua */ }
}

/* =====================================================
   Đặt lại ván chơi
   ===================================================== */
function reset() {
  // Dựng lại lưới từ địa hình của màn (xoá hết tháp đã xây)
  applyLevel(level);

  towers = [];
  enemies = [];
  projs = [];
  fx = [];
  parts = [];
  pendingSpawns = [];
  strikes = [];

  money = HOSTED ? walletCoins() : D.money;
  lives = D.lives;
  wave = 0;
  spawnQ = [];
  spawnT = 0;
  waveActive = false;
  paused = false;
  over = false;
  sel = null;
  build = null;
  aim = null;
  kills = 0;
  shake = 0;
  waveSpawn = 0;
  waveDone = 0;

  skill.strike.cd = 0;
  skill.freeze.cd = 0;

  $('go').textContent = '▶ Bắt đầu đợt 1';
  $('go').disabled = false;
  $('pause').textContent = '⏸';
  $('speed').textContent = 'x' + speed;

  document.querySelectorAll('.tw').forEach(b => b.classList.remove('sel'));
  closeSettings();

  const modal = document.getElementById('gc-modal');
  if (modal) modal.remove();

  updUI();
  showInfo();
  showPreview();
}

/* Màu nhấn trên thẻ chọn màn */
const MAP_CHIPS = ['#8bc34a', '#f27ba8', '#4b9dff', '#ff9d4a', '#9aa8b8', '#5fbf8a', '#a184ff', '#ffc93c'];

/* =====================================================
   TIẾN ĐỘ MÀN (localStorage — offlineGameSync đẩy lên API)
   ===================================================== */
const MAPKEY = 'gc:fieldrunner:maps';
const AUTOKEY = 'gc:fieldrunner:map';   // sessionStorage: chơi lại đúng màn này

function mapsAll() {
  try {
    return JSON.parse(localStorage.getItem(MAPKEY) || '{}') || {};
  } catch (e) {
    return {};
  }
}

function mapRec(id) {
  return mapsAll()[id] || {};
}

function mapsSet(id, patch) {
  const all = mapsAll();
  all[id] = Object.assign({}, all[id], patch);

  try {
    localStorage.setItem(MAPKEY, JSON.stringify(all));
  } catch (e) { /* storage bị chặn */ }
}

/** Màn thứ i mở chưa: màn 1 luôn mở, màn sau cần thắng màn trước */
function mapUnlocked(i) {
  if (i <= 0) return true;
  return !!mapRec(LEVELS[i - 1].id).cleared;
}

function mapStars(id) {
  return mapRec(id).stars || 0;
}

function mapBest(id) {
  return mapRec(id).best || 0;
}

/** Số sao theo fraction mạng còn lại khi thắng */
function starsFor(livesLeft, livesMax) {
  const f = livesMax > 0 ? livesLeft / livesMax : 0;
  return f >= 0.9 ? 3 : f >= 0.6 ? 2 : 1;
}

/** Ghi kết quả; trả về { best, stars, isBest, unlockedNext } */
function commitMapResult(lv, res) {
  const rec = mapRec(lv.id);
  const isBest = res.score > (rec.best || 0);
  const idx = LEVELS.indexOf(lv);
  // Phải hỏi TRƯỚC khi ghi: mapUnlocked(idx+1) đọc đúng màn vừa thắng,
  // ghi xong rồi mới hỏi thì lúc nào cũng ra "đã mở".
  const nextWasLocked = !mapUnlocked(idx + 1);

  const patch = {
    best: Math.max(rec.best || 0, res.score),
    stars: Math.max(rec.stars || 0, res.stars),
    cleared: rec.cleared || res.win
  };

  mapsSet(lv.id, patch);

  return { isBest, stars: patch.stars, unlockedNext: res.win && nextWasLocked && idx + 1 < LEVELS.length };
}

function setAutoMap(id) {
  try { sessionStorage.setItem(AUTOKEY, id); } catch (e) { /* bỏ qua */ }
}

function clearAutoMap() {
  try { sessionStorage.removeItem(AUTOKEY); } catch (e) { /* bỏ qua */ }
}

function takeAutoMap() {
  let id = null;
  try {
    id = sessionStorage.getItem(AUTOKEY);
    if (id) sessionStorage.removeItem(AUTOKEY);
  } catch (e) { /* bỏ qua */ }

  const i = LEVELS.findIndex(l => l.id === id);
  return i >= 0 && mapUnlocked(i) ? LEVELS[i] : null;
}

/* =====================================================
   ÁP MÀN CHƠI VÀO LƯỚI
   ===================================================== */
let kinds;   // kind[c][r] = ký hiệu địa hình của ô
let levelIdx = 0;

function applyLevel(lv) {
  level = lv;
  levelIdx = LEVELS.indexOf(lv);

  SR = lv.sr;
  GR = lv.gr;

  kinds = Array.from({ length: COLS }, () => Array(ROWS).fill('.'));

  for (const [k, c0, r0, w, h] of lv.props) {
    for (let c = c0; c < c0 + w; c++) {
      for (let r = r0; r < r0 + h; r++) {
        if (c >= 0 && r >= 0 && c < COLS && r < ROWS) kinds[c][r] = k;
      }
    }
  }

  // Trả lại ô trống sát 2 cổng để địch kịp tràn vào / tràn ra
  kinds[0][SR] = '.';
  kinds[1][SR] = '.';
  kinds[GOALC][GR] = '.';
  kinds[GOALC - 1][GR] = '.';

  blocked = Array.from({ length: COLS }, () => Array(ROWS).fill(false));
  noBuild = Array.from({ length: COLS }, () => Array(ROWS).fill(false));

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const k = kinds[c][r];
      blocked[c][r] = BLOCK_KINDS.includes(k);
      noBuild[c][r] = blocked[c][r] || NOBUILD_KINDS.includes(k);
    }
  }

  PAL = Object.assign({
    grass: ['#72b650', '#7ac258'],
    soil: ['#8a6a38', '#b8935a', '#dcbc84', '#ecd29c'],
    water: ['#9fe3f5', '#3f9fd0'],
    wash: null
  }, lv.pal || {});

  setDist(bfs(blocked));
}

/* =====================================================
   MÀN HÌNH CHỌN CÁNH ĐỒNG
   ===================================================== */
let mapsRoot = null;
let mapsEsc = null;

function closeMapSelect() {
  if (mapsEsc) {
    document.removeEventListener('keydown', mapsEsc, true);
    mapsEsc = null;
  }
  if (mapsRoot) {
    mapsRoot.remove();
    mapsRoot = null;
  }
}

/** cfg: { onPick(level), onDiff, resume:boolean } */
function showMapSelect(cfg) {
  closeMapSelect();

  const all = mapsAll();
  const cleared = LEVELS.filter(l => all[l.id] && all[l.id].cleared).length;

  const root = document.createElement('div');
  root.className = 'fr-maps';
  root.id = 'fr-maps';
  root.setAttribute('role', 'dialog');
  root.setAttribute('aria-label', 'Chọn cánh đồng');

  const cards = LEVELS.map((lv, i) => {
    const rec = all[lv.id] || {};
    const open = mapUnlocked(i);
    const stars = rec.stars || 0;

    const pips = [1, 2, 3].map(n =>
      '<i class="' + (n <= stars ? 'on' : '') + '"' +
      ' aria-label="' + n + ' sao"></i>').join('');

    return '' +
      '<button type="button" class="fr-map' + (open ? '' : ' lock') + '" data-i="' + i + '"' +
        (open ? '' : ' aria-disabled="true"') + ' style="--c:' + MAP_CHIPS[i % MAP_CHIPS.length] + '">' +
        '<span class="no">' + (i + 1) + '</span>' +
        '<span class="e">' + lv.icon + '</span>' +
        '<span class="t">' +
          '<b>' + lv.name + '</b>' +
          '<small>' + (open ? lv.desc : 'Thắng màn trước để mở cánh đồng này') + '</small>' +
          '<span class="meta">🌊 ' + lv.waves + ' đợt · ⭐ ' + (rec.best || 0) + '</span>' +
        '</span>' +
        '<span class="pips">' + pips + '</span>' +
        (open ? '' : '<span class="lk">🔒</span>') +
      '</button>';
  }).join('');

  root.innerHTML = '' +
    '<div class="fr-maps__card">' +
      '<div class="fr-maps__head">' +
        '<h2>Chọn cánh đồng</h2>' +
        '<span class="gc-pill gc-d' + GC.diff.i + '">' + GC.diff.emoji + ' ' + GC.diff.label + '</span>' +
      '</div>' +
      '<p class="fr-maps__sub">Đã khai phá ' + cleared + '/' + LEVELS.length + ' cánh đồng · ' +
        'màn mới mở khi thắng màn trước</p>' +
      '<div class="fr-maps__grid">' + cards + '</div>' +
      '<div class="fr-maps__row">' +
        (cfg.onResume
          ? '<button type="button" class="gc-btn sm" data-a="resume">▶ Về ván đang chơi</button>'
          : '') +
        '<button type="button" class="gc-btn alt sm" data-a="diff">🎚 Đổi độ khó</button>' +
        '<button type="button" class="gc-btn alt sm" data-a="home">🏠 Về sảnh</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(root);
  mapsRoot = root;

  root.querySelectorAll('.fr-map').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.i;
      if (!mapUnlocked(i)) {
        b.classList.add('shake');
        setTimeout(() => b.classList.remove('shake'), 400);
        return;
      }
      closeMapSelect();
      cfg.onPick(LEVELS[i]);
    };
  });

  const resumeBtn = root.querySelector('[data-a="resume"]');
  if (resumeBtn) {
    resumeBtn.onclick = () => {
      closeMapSelect();
      cfg.onResume();
    };
  }

  // Esc = quay lại ván đang chơi (nếu có)
  if (cfg.onResume) {
    mapsEsc = function (e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeMapSelect();
        cfg.onResume();
      }
    };
    document.addEventListener('keydown', mapsEsc, true);
  }

  root.querySelector('[data-a="diff"]').onclick = () => {
    closeMapSelect();
    if (cfg.onDiff) cfg.onDiff();
    else GC.change();
  };
  root.querySelector('[data-a="home"]').onclick = GC.quit;
}

    <script>
/* =====================================================
   pathfinding.js · tìm đường & kiểm tra đặt tháp
   ===================================================== */

/** BFS lan từ cổng ra, trả về mảng khoảng cách của từng ô */
function bfs(blk) {
  const d = new Array(COLS * ROWS).fill(Infinity);
  const q = [GOALC + GR * COLS];
  d[q[0]] = 0;

  for (let i = 0; i < q.length; i++) {
    const cur = q[i];
    const c = cur % COLS;
    const r = (cur / COLS) | 0;

    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc;
      const nr = r + dr;

      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || blk[nc][nr]) continue;

      const k = nc + nr * COLS;
      if (d[k] !== Infinity) continue;

      d[k] = d[cur] + 1;
      q.push(k);
    }
  }
  return d;
}

/** Lưu bản đồ khoảng cách và dựng lại đường đi để vẽ */
function setDist(d) {
  dist = d;
  pathPts = [[0, SR * CS + CS / 2]];

  let c = 0;
  let r = SR;
  let guard = 0;

  while (!(c === GOALC && r === GR) && guard++ < 400) {
    pathPts.push([c * CS + CS / 2, r * CS + CS / 2]);

    let best = null;
    let bd = dist[c + r * COLS];

    for (const [dc, dr] of [[1, 0], [0, 1], [0, -1], [-1, 0]]) {
      const nc = c + dc;
      const nr = r + dr;

      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;

      const dd = dist[nc + nr * COLS];
      if (dd < bd) {
        bd = dd;
        best = [nc, nr];
      }
    }

    if (!best) break;
    [c, r] = best;
  }

  pathPts.push(
    [GOALC * CS + CS / 2, GR * CS + CS / 2],
    [CW, GR * CS + CS / 2]
  );
}

/** Kiểm tra có đặt được tháp ở ô (c,r) không. Trả về null nếu được, hoặc lý do. */
function canPlace(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return 'Ngoài bản đồ';
  if (towers.some(t => t.c === c && t.r === r)) return 'Ô đã có tháp';
  if ((c === 0 && r === SR) || (c === GOALC && r === GR)) return 'Không thể xây ở cổng';
  if (blocked[c][r]) return 'Chỗ này có vật cản';
  if (noBuild[c][r]) return 'Không xây được ở đây';

  blocked[c][r] = true;
  const d = bfs(blocked);

  let ok = d[0 + SR * COLS] !== Infinity;
  let why = 'Không được chặn kín đường đi';

  if (ok) {
    for (const e of enemies) {
      if (e.def.air) continue;

      const [ec, er] = cellOf(e.x, e.y);

      const onCell = ec === c && er === r;
      const headingThere = e.tx !== undefined && cellOf(e.tx, e.ty).join() === c + ',' + r;

      if (e.x >= 0 && (onCell || headingThere)) {
        ok = false;
        why = 'Có kẻ địch ở ô này';
        break;
      }

      if (e.x >= 0 && d[ec + er * COLS] === Infinity) {
        ok = false;
        why = 'Sẽ nhốt kẻ địch';
        break;
      }
    }
  }

  blocked[c][r] = false;
  return ok ? null : why;
}

/* =====================================================
   waves.js · tạo đợt địch, bắt đầu đợt
   ===================================================== */

/** Kẻ địch không bao giờ trở thành tinh anh (đã đủ mạnh rồi) */
const NO_ELITE = ['boss', 'titan', 'dragon', 'golem', 'mini'];

/** Dựng danh sách kẻ địch của đợt n */
function makeWave(n) {
  const q = [];

  // Máu tăng theo đợt; từ đợt HARD_WAVE tăng thêm một nấc nữa
  const hpM = (1 + 0.17 * (n - 1) + 0.004 * n * n) * D.hp * lateHpMul(n);

  const add = (t, k, gap) => {
    k = Math.max(0, Math.floor(k));
    for (let i = 0; i < k; i++) {
      q.push({ t, hpM, gap, wave: n });
    }
  };

  /* ----- Kẻ địch quen thuộc ----- */
  add('grunt', Math.min(5 + n * 2, 38), 0.7);

  if (n >= 3) add('runner', Math.min(n * 1.3, 26), 0.45);
  if (n >= 5) add('tank', (n - 3) / 2, 1.4);
  if (n >= 4 && n % 3 === 1) add('plane', 3 + n / 3, 0.8);
  if (n >= 6) add('armored', (n - 4) / 2, 1.2);
  if (n >= 7 && n % 2 === 1) add('bat', 3 + n / 3, 0.35);
  if (n >= 8) add('shielded', (n - 6) / 2, 1.3);
  if (n >= 9) add('ninja', (n - 7) / 2.2, 0.8);
  if (n >= 10 && n % 4 === 2) add('bomber', 1 + n / 6, 1.2);
  if (n >= 11) add('healer', 1 + (n - 10) / 4, 2.0);
  if (n >= 12) add('knight', (n - 9) / 3, 1.5);
  if (n >= 13 && n % 3 === 1) add('splitter', 2 + (n - 12) / 3, 1.5);
  if (n >= 14) add('wizard', 1 + (n - 14) / 4, 1.8);
  if (n >= 15) add('berserk', (n - 13) / 2, 1.2);
  if (n >= 16) add('summoner', 1 + (n - 16) / 5, 2.2);
  if (n >= 18) add('ghost', 1 + (n - 17) / 3, 1.0);
  if (n >= 19 && n % 3 === 1) add('golem', 1 + (n - 19) / 6, 3);
  if (n >= 15 && n % 10 === 5) add('dragon', 1 + Math.floor(n / 20), 4);

  /* ----- MỚI: kẻ địch hạng nặng từ đợt 12 trở đi ----- */
  if (n >= 12) add('juggernaut', 1 + (n - 12) / 3, 2.6);
  if (n >= 15 && n % 2 === 0) add('phoenix', 1 + (n - 15) / 5, 1.6);
  if (n >= 17) add('warlock', 1 + (n - 17) / 4, 2.2);
  if (n >= 22) add('reaper', 1 + (n - 22) / 3, 0.9);

  /* ----- Trùm ----- */
  if (n % 10 === 0 && n !== TOTAL) {
    add('boss', 1 + (n >= 20 ? 1 : 0) + (n >= 30 ? 1 : 0), 3);
  }

  /* ----- Đợt cuối ----- */
  if (n === TOTAL) {
    add('titan', 1, 3);
    add('boss', 2, 3);
    add('dragon', 1, 4);
  }

  /* ----- Biến một phần thành tinh anh (từ đợt HARD_WAVE) ----- */
  const chance = eliteChance(n);
  if (chance > 0) {
    for (const s of q) {
      if (!NO_ELITE.includes(s.t) && Math.random() < chance) {
        s.elite = true;
      }
    }
  }

  /* ----- Xáo trộn nhẹ thứ tự xuất hiện ----- */
  for (let i = q.length - 1; i > 0; i--) {
    if (Math.random() < 0.4) {
      const j = Math.max(0, i - Math.floor(Math.random() * 6));
      [q[i], q[j]] = [q[j], q[i]];
    }
  }

  return q;
}

/** Bắt đầu đợt kế tiếp */
function startWave() {
  if (waveActive || over || wave >= TOTAL || !started) return;

  wave++;
  waveActive = true;
  spawnQ = makeWave(wave);
  spawnT = 0;
  waveSpawn = spawnQ.length;
  waveDone = 0;

  $('go').disabled = true;
  updUI();
  showPreview();

  if (wave === HARD_WAVE) {
    showMsg('⚠️ Tinh anh xuất hiện! Kẻ địch mạnh hơn hẳn!');
  } else {
    showMsg('🌊 Đợt ' + wave + ' bắt đầu!');
  }
}

/* =====================================================
   enemies.js · tạo kẻ địch, di chuyển, nhận sát thương
   ===================================================== */

/** Tạo một kẻ địch */
function mkEnemy(type, hp, x, y) {
  const def = EDEF[type];

  const e = {
    def, type,
    hp, max: hp,
    x, y,
    slowT: 0, slowF: 1,
    rem: 1e9,
    id: Math.random(),
    dots: [],
    anim: Math.random() * 6,
    vx: 0, vy: 0,
    haste: 1
  };

  if (def.air && y == null) e.y = 40 + Math.random() * (CH - 80);

  if (def.shield) {
    e.shield = def.shield * D.hp;
    e.shieldMax = e.shield;
    e.shieldT = 0;
  }

  if (def.heal) e.healCd = 1;
  if (def.summon) e.sumCd = 3;
  if (def.warlock) e.curseCd = 2.5;

  return e;
}

/** Nâng một kẻ địch lên hạng tinh anh */
function makeElite(e, n) {
  e.elite = true;
  e.max *= ELITE.hpMul;
  e.hp = e.max;

  e.armorBonus = ELITE.baseArmor + Math.floor((n - HARD_WAVE) / ELITE.armorEvery);
  e.spdMul = ELITE.spdMul;
  e.rwMul = ELITE.rwMul;

  // Từ đợt aegisWave: có thêm khiên năng lượng
  if (n >= ELITE.aegisWave) {
    const sh = e.max * ELITE.aegisPct;
    e.shieldMax = Math.max(e.shieldMax || 0, sh);
    e.shield = e.shieldMax;
    e.shieldT = 0;
  }
}

/** Sinh kẻ địch từ hàng đợi của đợt */
function spawn(s) {
  const def = EDEF[s.t];
  const e = mkEnemy(s.t, def.hp * s.hpM, -20, SR * CS + CS / 2);

  if (def.air) e.y = 40 + Math.random() * (CH - 80);
  if (s.elite) makeElite(e, s.wave);

  enemies.push(e);
}

/** Chọn ô kế tiếp trên đường đi */
function pickNext(e) {
  if (e.x < 0) {
    e.tx = CS / 2;
    e.ty = SR * CS + CS / 2;
    return;
  }

  const [c, r] = cellOf(e.x, e.y);
  const here = dist[c + r * COLS];

  if (here === 0) {
    e.tx = CW + 30;
    e.ty = e.y;
    e.exiting = true;
    return;
  }

  let best = null;
  let bd = here;

  for (const [dc, dr] of [[1, 0], [0, 1], [0, -1], [-1, 0]]) {
    const nc = c + dc;
    const nr = r + dr;

    if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;

    const d = dist[nc + nr * COLS];
    if (d < bd) {
      bd = d;
      best = [nc, nr];
    }
  }

  if (best) {
    e.tx = best[0] * CS + CS / 2;
    e.ty = best[1] * CS + CS / 2;
  }
}

/** Kẻ địch lọt vào cánh đồng */
function leak(e) {
  e.dead = true;
  waveDone++;
  lives -= (e.def.dmg || 1);

  fx.push({ k: 'flash', life: 0.35 });
  if ((e.def.dmg || 1) >= 3) shake = Math.max(shake, 10);
  pulse('stLives');

  if (lives <= 0) {
    lives = 0;
    endGame(false);
  }
  updUI();
}

/** Cập nhật một kẻ địch trong khoảng dt giây */
function stepEnemy(e, dt) {
  if (e.slowT > 0) e.slowT -= dt;

  /* ----- Khiên tự hồi ----- */
  if (e.shieldMax) {
    if (e.shieldT > 0) {
      e.shieldT -= dt;
    } else if (e.shield < e.shieldMax) {
      e.shield = Math.min(e.shieldMax, e.shield + e.shieldMax * 0.1 * dt);
    }
  }

  /* ----- Y tá: hồi máu đồng đội ----- */
  if (e.def.heal) {
    e.healCd -= dt;
    if (e.healCd <= 0) {
      e.healCd = 1.5;
      for (const o of enemies) {
        if (o === e || o.dead) continue;
        if (Math.hypot(o.x - e.x, o.y - e.y) < 110 && o.hp < o.max) {
          o.hp = Math.min(o.max, o.hp + o.max * 0.08);
          fx.push({ k: 'heal', x: o.x, y: o.y, life: 0.4 });
        }
      }
    }
  }

  /* ----- Phù thủy đen: ban khiên cho đồng đội ----- */
  if (e.def.warlock) {
    e.curseCd -= dt;
    if (e.curseCd <= 0 && e.x > 0) {
      e.curseCd = 4;
      let n = 0;
      for (const o of enemies) {
        if (o === e || o.dead || o.def.warlock) continue;
        if (Math.hypot(o.x - e.x, o.y - e.y) > 140) continue;
        if (n >= 5) break;

        const sh = o.max * 0.2;
        o.shieldMax = Math.max(o.shieldMax || 0, sh);
        o.shield = Math.max(o.shield || 0, sh);
        o.shieldT = 0;
        fx.push({ k: 'ring', x: o.x, y: o.y, life: 0.5, c: '#8a6bff', r: 22 });
        n++;
      }
      if (n) fx.push({ k: 'ring', x: e.x, y: e.y, life: 0.6, c: '#5b3bd0', r: 56 });
    }
  }

  /* ----- Triệu hồi: gọi quân con ----- */
  if (e.def.summon) {
    e.sumCd -= dt;
    if (e.sumCd <= 0 && e.x > 20) {
      e.sumCd = 4.5;

      if (enemies.length + pendingSpawns.length < 140) {
        for (let i = 0; i < 2; i++) {
          const hp = Math.max(EDEF.mini.hp, e.max * 0.12);
          const m = mkEnemy('mini', hp, e.x + (i ? 10 : -10), e.y);
          m.rem = e.rem;
          pendingSpawns.push(m);
        }
        fx.push({ k: 'ring', x: e.x, y: e.y, life: 0.5, c: '#c34aa8', r: 34 });
      }
    }
  }

  /* ----- Tốc độ ----- */
  let spd = e.def.sp * D.spd * e.haste * (e.spdMul || 1);
  if (e.def.berserk) spd *= (1 + (1 - clamp(e.hp / e.max, 0, 1)) * 1.2);

  e.anim += dt * spd / 50;

  const ox = e.x;
  const oy = e.y;
  let mv = spd * (e.slowT > 0 ? e.slowF : 1) * dt;

  /* ----- Kẻ địch bay: đi thẳng ----- */
  if (e.def.air) {
    e.x += mv;
    e.rem = CW + 20 - e.x;
    if (e.x > CW + 20) leak(e);

    e.vx = (e.x - ox) / dt;
    e.vy = 0;
    return;
  }

  /* ----- Kẻ địch mặt đất: đi theo đường BFS ----- */
  let guard = 0;
  while (mv > 0 && guard++ < 6) {
    if (e.tx === undefined) pickNext(e);
    if (e.tx === undefined) break;

    const dx = e.tx - e.x;
    const dy = e.ty - e.y;
    const d = Math.hypot(dx, dy);

    if (d <= mv) {
      e.x = e.tx;
      e.y = e.ty;
      mv -= d;
      e.tx = undefined;

      if (e.exiting) {
        leak(e);
        return;
      }
    } else {
      e.x += dx / d * mv;
      e.y += dy / d * mv;
      mv = 0;
    }
  }

  e.vx = (e.x - ox) / dt;
  e.vy = (e.y - oy) / dt;

  if (e.x >= 0) {
    const [c, r] = cellOf(e.x, e.y);
    e.rem = dist[c + r * COLS] * CS;
  } else {
    e.rem = 1e8;
  }
}

/** Tạo hạt bụi / tia lửa */
function particles(x, y, n, c, sp, life, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283;
    const v = sp * (0.3 + Math.random());

    parts.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      life: life * (0.6 + Math.random() * 0.6),
      max: life,
      s: size * (0.6 + Math.random() * 0.8),
      c
    });
  }
}

/** Kẻ địch chết (hoặc hồi sinh nếu là phượng hoàng) */
function killEnemy(e) {
  if (e.dead) return;

  /* Phượng hoàng: hồi sinh một lần với 50% máu */
  if (e.def.revive && !e.revived) {
    e.revived = true;
    e.hp = e.max * 0.5;
    e.dots = [];
    e.slowT = 0;
    e.hurt = 0.2;

    fx.push({ k: 'ring', x: e.x, y: e.y, life: 0.7, c: '#ffb347', r: 70 });
    fx.push({ k: 'txt', x: e.x, y: e.y - 18, life: 0.9, t: 'Tái sinh!', c: '#ffb347' });
    particles(e.x, e.y, 22, '#ff9a3c', 170, 0.7, 3.6);
    return;
  }

  e.dead = true;
  kills++;
  waveDone++;

  const rw = Math.round(e.def.rw * D.rw * (e.rwMul || 1));
  earn(rw);

  fx.push({ k: 'txt', x: e.x, y: e.y - 10, life: 0.8, t: '+' + rw });
  particles(e.x, e.y, e.def.r >= 14 ? 16 : 9, e.def.col, e.def.r >= 14 ? 140 : 90, 0.55, 3.2);

  if (e.def.r >= 19) {
    fx.push({ k: 'ring', x: e.x, y: e.y, life: 0.5, c: '#fff', r: 60 });
    shake = Math.max(shake, 6);
  }

  if (e.elite) {
    fx.push({ k: 'ring', x: e.x, y: e.y, life: 0.5, c: '#ffd93b', r: 44 });
    particles(e.x, e.y, 8, '#ffd93b', 120, 0.6, 3);
  }

  /* Phân thân: tách thành 2 con */
  if (e.def.split) {
    const cdef = EDEF[e.def.split];
    const chp = Math.max(cdef.hp, e.max * 0.35);

    for (let i = 0; i < 2; i++) {
      const m = mkEnemy(e.def.split, chp, e.x + (i ? 12 : -12), e.y);
      m.rem = e.rem;
      pendingSpawns.push(m);
    }
  }
}

/** Gây sát thương lên kẻ địch. Trả về lượng sát thương thực tế. */
function applyDamage(e, d, opts = {}) {
  if (e.dead || d <= 0) return 0;

  /* Né đòn (ninja, tử thần) */
  if (e.def.evade && !opts.dot && Math.random() < e.def.evade) {
    fx.push({ k: 'txt', x: e.x, y: e.y - 14, life: 0.5, t: 'né!', c: '#bfe8ff' });
    return 0;
  }

  /* Giáp (giáp gốc + giáp tinh anh) */
  const armor = (e.def.armor || 0) + (e.armorBonus || 0);
  if (armor && !opts.pierce) d = Math.max(1, d - armor);

  /* Khiên hấp thụ trước */
  if (e.shield > 0) {
    const ab = Math.min(e.shield, d);
    e.shield -= ab;
    d -= ab;
    e.shieldT = 3;
    if (e.shield < 0.5) e.shield = 0;
  }

  e.hp -= d;
  e.hurt = 0.08;

  if (e.hp <= 0) killEnemy(e);
  return d;
}

/** Thêm hiệu ứng sát thương theo thời gian (cháy, độc) */
function applyDot(e, type, dps, t) {
  if (e.dead) return;

  const d = e.dots.find(x => x.type === type);

  if (d) {
    d.t = Math.max(d.t, t);
    d.dps = Math.max(d.dps, dps);
  } else {
    e.dots.push({
      type, dps, t,
      color: type === 'burn' ? '#ff8844' : '#7ad04a'
    });
  }
}

    <script>
/* =====================================================
   towers.js · chỉ số tháp, ngắm bắn, đạn, nổ
   ===================================================== */

/** Chỉ số hiện tại của tháp theo cấp và buff radar */
function stat(t) {
  const T = TYPES[t.type];
  const l = t.lvl - 1;

  return {
    range: (T.range + 0.2 * l) * CS * (1 + (t.bR || 0)),
    dmg: T.dmg * (1 + 0.8 * l) * (1 + (t.bD || 0)),
    rate: T.rate * Math.pow(0.92, l)
  };
}

/** Chọn mục tiêu cho tháp theo chế độ ngắm */
function pickTarget(t, T, S) {
  let tg = null;
  let sc = 0;

  for (const e of enemies) {
    if (e.dead || e.x < 0) continue;
    if (e.def.air ? !T.air : !T.ground) continue;

    const dd = Math.hypot(e.x - t.x, e.y - t.y);
    if (dd > S.range) continue;
    if (T.minR && dd < T.minR * CS) continue;
    if (e.def.stealth && dd > 2.5 * CS && !t.det) continue;

    let s;
    if (t.mode === 1) s = e.hp + (e.shield || 0);   // mạnh nhất
    else if (t.mode === 2) s = -dd;                 // gần nhất
    else s = -e.rem;                                // đầu tiên

    if (!tg || s > sc) {
      tg = e;
      sc = s;
    }
  }
  return tg;
}

/** Cập nhật buff radar rồi cho từng tháp bắn */
function updateTowers(dt) {
  /* ----- Buff từ radar ----- */
  for (const t of towers) {
    t.bD = 0;
    t.bR = 0;
    t.det = false;
  }

  for (const r of towers) {
    if (r.type !== 'radar') continue;

    const rng = (TYPES.radar.range + 0.25 * (r.lvl - 1)) * CS;
    const bd = 0.22 + 0.08 * (r.lvl - 1);
    const br = 0.1 + 0.04 * (r.lvl - 1);
    r.rangeNow = rng;

    for (const t of towers) {
      if (t === r || t.type === 'radar') continue;

      if (Math.hypot(t.x - r.x, t.y - r.y) <= rng) {
        t.bD = Math.max(t.bD, bd);
        t.bR = Math.max(t.bR, br);
        t.det = true;
      }
    }
  }

  /* ----- Bắn ----- */
  for (const t of towers) {
    const T = TYPES[t.type];
    if (T.support) continue;

    const S = stat(t);

    t.cd -= dt;
    t.rec = Math.max(0, (t.rec || 0) - dt * 6);

    const tg = pickTarget(t, T, S);

    if (!tg) {
      t.ramp = 0;
      t.lock = null;
      t.firing = false;
      continue;
    }

    t.ang = Math.atan2(tg.y - t.y, tg.x - t.x);

    /* Laser: bắn liên tục, mạnh dần */
    if (T.laser) {
      fireLaser(t, T, S, tg, dt);
      continue;
    }

    if (t.cd > 0) continue;

    t.cd = S.rate;
    t.rec = 1;

    if (T.rail) fireRail(t, T, S);
    else if (T.chain) fireChain(t, T, S, tg);
    else if (T.hit) fireSniper(t, T, S, tg);
    else if (T.mortar) fireMortar(t, T, S, tg);
    else fireProjectile(t, T, S, tg);
  }
}

/* ---------- Các kiểu bắn ---------- */

function fireLaser(t, T, S, tg, dt) {
  if (t.lock !== tg.id) {
    t.lock = tg.id;
    t.ramp = 0;
  }

  t.ramp = Math.min(3.4, (t.ramp || 0) + dt * 0.9);
  t.firing = true;

  applyDamage(tg, S.dmg * (1 + t.ramp) * dt, { pierce: true, dot: true });

  fx.push({
    k: 'laser',
    x1: t.x + Math.cos(t.ang) * 16,
    y1: t.y + Math.sin(t.ang) * 16,
    x2: tg.x,
    y2: tg.y,
    life: 0.06,
    c: T.color,
    w: 2 + t.ramp
  });

  if (Math.random() < 0.5) particles(tg.x, tg.y, 1, '#ffd0da', 60, 0.3, 2);
}

function fireRail(t, T, S) {
  const ex = t.x + Math.cos(t.ang) * S.range;
  const ey = t.y + Math.sin(t.ang) * S.range;
  const sx = t.x + Math.cos(t.ang) * 16;
  const sy = t.y + Math.sin(t.ang) * 16;

  for (const e of enemies) {
    if (e.dead || e.x < 0) continue;
    if (e.def.air ? !T.air : !T.ground) continue;

    if (distSeg(e.x, e.y, sx, sy, ex, ey) <= e.def.r + 8) {
      applyDamage(e, S.dmg, { pierce: true });
      particles(e.x, e.y, 5, '#bff4ff', 130, 0.35, 2.6);
    }
  }

  fx.push({ k: 'rail', x1: sx, y1: sy, x2: ex, y2: ey, life: 0.4, c: T.color });
  fx.push({ k: 'muzzle', x: sx, y: sy, life: 0.18, c: '#bff4ff', r: 20 });
  particles(sx, sy, 10, '#bff4ff', 160, 0.3, 2.5);
}

function fireChain(t, T, S, tg) {
  let cur = tg;
  const hits = [tg];
  const chain = T.chain + Math.floor(t.lvl / 2);

  applyDamage(tg, S.dmg, { pierce: T.pierce });
  fx.push({ k: 'bolt', x1: t.x, y1: t.y - 6, x2: tg.x, y2: tg.y, life: 0.2, c: T.color });

  for (let i = 1; i < chain; i++) {
    let next = null;
    let nd = 100;

    for (const e of enemies) {
      if (e.dead || hits.includes(e)) continue;
      if (e.def.air ? !T.air : !T.ground) continue;

      const d2 = Math.hypot(e.x - cur.x, e.y - cur.y);
      if (d2 < nd) {
        nd = d2;
        next = e;
      }
    }

    if (!next) break;

    applyDamage(next, S.dmg * 0.7, { pierce: T.pierce });
    fx.push({ k: 'bolt', x1: cur.x, y1: cur.y, x2: next.x, y2: next.y, life: 0.2, c: T.color });

    hits.push(next);
    cur = next;
  }
}

function fireSniper(t, T, S, tg) {
  applyDamage(tg, S.dmg, { pierce: T.pierce });

  fx.push({
    k: 'rail',
    x1: t.x + Math.cos(t.ang) * 20,
    y1: t.y + Math.sin(t.ang) * 20,
    x2: tg.x,
    y2: tg.y,
    life: 0.18,
    c: '#e8c8ff',
    thin: 1
  });

  particles(tg.x, tg.y, 5, '#e8c8ff', 90, 0.3, 2.2);
}

function fireMortar(t, T, S, tg) {
  const sp = 230;
  const dd = Math.hypot(tg.x - t.x, tg.y - t.y);
  const tt = dd / sp;

  projs.push({
    x: t.x, y: t.y,
    sx: t.x, sy: t.y,
    tx: tg.x + tg.vx * tt,
    ty: tg.y + tg.vy * tt,
    mortar: true,
    sp,
    dmg: S.dmg,
    splash: T.splash * (1 + 0.06 * (t.lvl - 1)),
    c: T.color,
    r: 6,
    pierce: T.pierce,
    t: 0,
    dur: Math.max(0.35, tt)
  });

  const mx = t.x + Math.cos(t.ang) * 16;
  const my = t.y + Math.sin(t.ang) * 16;
  fx.push({ k: 'muzzle', x: mx, y: my, life: 0.15, c: '#ffe9a0', r: 16 });
  particles(mx, my, 5, '#d0d0d0', 60, 0.4, 3);
}

function fireProjectile(t, T, S, tg) {
  const shots = (t.type === 'gun' && t.lvl >= 3) ? 2 : 1;
  const lv = t.lvl - 1;

  for (let i = 0; i < shots; i++) {
    projs.push({
      x: t.x + Math.cos(t.ang) * 14,
      y: t.y + Math.sin(t.ang) * 14,
      tg,
      sp: T.splash ? 260 : (T.slow || T.poisonDps ? 380 : 500),
      dmg: S.dmg,
      splash: T.splash ? T.splash * (1 + 0.06 * lv) : 0,
      slow: T.slow ? Math.max(0.18, T.slow - 0.07 * lv) : 0,
      burn: T.burnDps ? T.burnDps * (1 + 0.6 * lv) : 0,
      poison: T.poisonDps ? T.poisonDps * (1 + 0.6 * lv) : 0,
      c: T.color,
      r: T.splash ? 6 : 3,
      pierce: T.pierce,
      kind: t.type,
      off: i ? 6 : 0
    });
  }

  const mx = t.x + Math.cos(t.ang) * 20;
  const my = t.y + Math.sin(t.ang) * 20;

  if (t.type === 'flame') {
    particles(mx, my, 3, '#ffa040', 80, 0.3, 3.5);
  } else if (t.type !== 'frost' && t.type !== 'poison') {
    fx.push({ k: 'muzzle', x: mx, y: my, life: 0.1, c: '#fff1b0', r: t.type === 'cannon' ? 15 : 9 });
  }
}

/* ---------- Nổ lan ---------- */
function explode(x, y, R, dmg, pierce, opts = {}) {
  fx.push({ k: 'boom', x, y, r: R, life: 0.35 });
  particles(x, y, 12, '#ffb44a', 150, 0.5, 3.5);
  particles(x, y, 6, '#555', 70, 0.7, 5);

  if (R >= 70) shake = Math.max(shake, 3);

  for (const e of enemies) {

    if (opts.burn) applyDot(e, 'burn', opts.burn, 2.5);
    if (opts.poison) applyDot(e, 'poison', opts.poison, 4);
    if (opts.slow && !e.dead) {
      e.slowT = 1.6;
      e.slowF = opts.slow;
    }
  }
}

      parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.3, max: 0.3, s: 3, c: 'rgba(90,90,90,.7)' });
    }
    if (p.kind === 'frost' && Math.random() < 0.5) {
      parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.3, max: 0.3, s: 2.4, c: '#cfeeff' });
    }

    /* Trúng mục tiêu */
    if (d <= m + tg.def.r * 0.6) {
      p.dead = true;

      if (p.splash) {
        explode(tg.x, tg.y, p.splash, p.dmg, p.pierce, {
          burn: p.burn, poison: p.poison, slow: p.slow
        });
      } else {
        applyDamage(tg, p.dmg, { pierce: p.pierce });

        if (p.burn) applyDot(tg, 'burn', p.burn, 2.5);
        if (p.poison) applyDot(tg, 'poison', p.poison, 4);
        if (p.slow && !tg.dead) {
          tg.slowT = 1.6;
          tg.slowF = p.slow;
        }
        if (p.kind === 'frost') {
          fx.push({ k: 'ring', x: tg.x, y: tg.y, life: 0.3, c: '#9eeaff', r: 20 });
        }

        particles(tg.x, tg.y, 3, p.c, 60, 0.25, 2);
      }
    } else {
      p.x += dx / d * m;
      p.y += dy / d * m;
    }
  }
}

/* =====================================================

/** Gọi không kích tại (x,y): 6 quả bom rơi xuống khu vực */
function castStrike(x, y) {
  if (skill.strike.cd > 0 || over) return;

  skill.strike.cd = skill.strike.max;
  aim = null;
  $('skStrike').classList.remove('aim');

  for (let i = 0; i < 6; i++) {
    strikes.push({
      t: 0.5 + i * 0.16,
      x: x + (Math.random() - 0.5) * 130,
      y: y + (Math.random() - 0.5) * 90
    });
  }

  fx.push({ k: 'target', x, y, life: 1.4, r: 90 });
  showMsg('🚀 Không kích đang tới!');
}

/** Đóng băng toàn bộ kẻ địch trong vài giây */
function castFreeze() {
  if (skill.freeze.cd > 0 || over) return;

  skill.freeze.cd = skill.freeze.max;

  for (const e of enemies) {
    if (!e.dead) {
      e.slowT = Math.max(e.slowT, 3.5);
      e.slowF = 0.12;
    }
  }

  fx.push({ k: 'frostwave', life: 0.9 });
  showMsg('❄️ Cả bầy bị đóng băng!');
}

/** Cập nhật bom không kích đang rơi */
function updateStrikes(dt) {
  for (const s of strikes) {
    s.t -= dt;

    if (s.t <= 0 && !s.done) {
      s.done = true;

      explode(s.x, s.y, 75, 260, true);

      for (const e of enemies) {
        if (!e.dead && e.def.air && Math.hypot(e.x - s.x, e.y - s.y) < 55) {
          applyDamage(e, 260, { pierce: true });
        }
      }

      shake = Math.max(shake, 5);
      fx.push({ k: 'ring', x: s.x, y: s.y, life: 0.4, c: '#ffd27a', r: 75 });
    }
  }

  strikes = strikes.filter(s => !s.done);
}

/** Bật / tắt chế độ ngắm không kích */
function toggleStrike() {
  if (skill.strike.cd > 0) {
    showMsg('Không kích đang hồi chiêu');
    return;
  }

  aim = aim ? null : true;
  build = null;
  sel = null;

  $('skStrike').classList.toggle('aim', !!aim);
  document.querySelectorAll('.tw').forEach(b => b.classList.remove('sel'));
  showInfo();
}

    <script>
/* =====================================================
   game.js · vòng cập nhật chính & kết thúc ván
   ===================================================== */

/** Cập nhật toàn bộ thế giới trong dt giây */
function update(dt) {
  if (over || paused) return;

  gtime += dt;
  shake = Math.max(0, shake - dt * 30);

  for (const k in skill) {
    skill[k].cd = Math.max(0, skill[k].cd - dt);
  }

  /* ----- Sinh kẻ địch theo hàng đợi ----- */
  if (spawnQ.length) {
    spawnT -= dt;
    if (spawnT <= 0) {
      const s = spawnQ.shift();
      spawn(s);
      spawnT = s.gap;
    }
  }

  /* ----- Pháp sư tăng tốc đồng đội ----- */
  for (const e of enemies) e.haste = 1;

  for (const e of enemies) {
    if (e.dead || !e.def.haste) continue;

    for (const o of enemies) {
      if (o !== e && !o.dead && Math.hypot(o.x - e.x, o.y - e.y) < 130) {
        o.haste = Math.max(o.haste, 1.35);
      }
    }
  }

  /* ----- Di chuyển kẻ địch ----- */
  for (const e of enemies) {
    if (e.dead) continue;

    stepEnemy(e, dt);
    if (e.hurt > 0) e.hurt -= dt;
  }

  /* ----- Sát thương theo thời gian (cháy, độc) ----- */
  for (const e of enemies) {
    if (e.dead || !e.dots.length) continue;

    for (let i = e.dots.length - 1; i >= 0; i--) {
      const d = e.dots[i];
      d.t -= dt;

      if (d.t <= 0) {
        e.dots.splice(i, 1);
        continue;
      }

      applyDamage(e, d.dps * dt, { dot: true });

      if (Math.random() < dt * 10) {
        parts.push({
          x: e.x + (Math.random() - 0.5) * 8,
          y: e.y - 4,
          vx: 0, vy: -25,
          life: 0.4, max: 0.4, s: 2.4,
          c: d.color
        });
      }

      if (e.dead) break;
    }
  }

  updateTowers(dt);
  updateProjs(dt);
  updateStrikes(dt);

  /* ----- Dọn dẹp ----- */
  enemies = enemies.filter(e => !e.dead);
  projs = projs.filter(p => !p.dead);

  if (pendingSpawns.length) {
    enemies.push(...pendingSpawns);
    pendingSpawns = [];
  }

  for (const f of fx) f.life -= dt;
  fx = fx.filter(f => f.life > 0);

  for (const p of parts) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 600) parts.splice(0, parts.length - 600);

  /* ----- Hết đợt ----- */
  if (waveActive && !spawnQ.length && !enemies.length) {
    waveActive = false;

    if (wave >= TOTAL) {
      endGame(true);
      return;
    }

    const bonus = Math.round((20 + wave * 3) * D.bonus);
    earn(bonus);
    showMsg('✅ Xong đợt ' + wave + '! Thưởng +' + bonus + ' 💰');

    $('go').disabled = false;
    $('go').textContent = '▶ Bắt đầu đợt ' + (wave + 1);

    updUI();
    showPreview();
  }
}

/** Điểm đang có — HUD hiển thị liên tục và kết quả cuối ván dùng lại công thức này */
function scoreNow(win) {
  const mult = [1, 1.5, 2, 3][GC.i];
  return Math.round((wave * 100 + lives * 20 + kills * 2 + (win ? 600 : 0)) * mult);
}

/** Kết thúc ván chơi: lưu tiến độ màn và hiện hộp kết quả */
function endGame(win) {
  if (over) return;
  over = true;

  const score = scoreNow(win);
  const stars = win ? starsFor(lives, D.lives) : 0;
  const rec = commitMapResult(level, { win, score, stars });

  const lines = [
    win ? 'Giữ vững ' + TOTAL + ' đợt ở ' + level.name : 'Cầm cự đến đợt ' + wave + '/' + TOTAL,
    'Hạ ' + kills + ' địch',
    '❤️ còn ' + lives + ' mạng',
    win ? '⭐ ' + stars + '/3 sao' : '⭐ ' + mapStars(level.id) + '/3 sao tốt nhất'
  ];

  if (rec.unlockedNext) {
    const nx = LEVELS[levelIdx + 1];
    lines.push('🔓 Mở khoá cánh đồng ' + nx.icon + ' ' + nx.name);
  }

  setTimeout(() => {
    GC.result({
      win,
      title: win ? '🏆 ' + level.name + ' bình yên!' : '💥 ' + level.name + ' bị tràn!',
      score,
      lines,
      onAgain: playAgain,
      onChange: changeDifficulty
    });
  }, 650);
}

/** Chơi lại đúng màn này ở cùng độ khó */
function playAgain() {
  setAutoMap(level.id);
  GC.again();
}

/** Quay lại màn chọn độ khó */
function changeDifficulty() {
  clearAutoMap();
  GC.change();
}
