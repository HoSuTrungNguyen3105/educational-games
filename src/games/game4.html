<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Học Mà Chơi Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0c2a30;
            --panel: #15434b;
            --panel2: #1c5964;
            --edge: #2f8792;
            --text: #f3fffb;
            --mute: #9fd0cd;
            --amber: #ffc233;
            --coral: #ff6f59;
            --sky: #6ec6ff;
            --lime: #b7e34a;
            --violet: #b18cff;
            --dark: #0b2227;
            --ok: #3ddc84;
            --bad: #ff5d6c;
            --head: 'Baloo 2', 'Nunito', 'Segoe UI', system-ui, sans-serif;
            --body: 'Lexend', 'Segoe UI', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0
        }

        body {
            font-family: var(--body);
            color: var(--text);
            min-height: 100vh;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 1px 1px, rgba(159, 208, 205, .18) 1.2px, transparent 1.4px);
            background-size: 26px 26px;
        }

        #app {
            max-width: 1000px;
            margin: 0 auto;
            padding: 14px 14px 60px
        }

        button {
            font-family: inherit;
            color: inherit;
            cursor: pointer
        }

        h1,
        h2,
        h3 {
            font-family: var(--head);
            margin: 0;
            line-height: 1.1
        }

        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        .logo {
            font-family: var(--head);
            font-weight: 800;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .logo i {
            font-style: normal;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            background: var(--lime);
            border-radius: 14px;
            box-shadow: 0 4px 0 #7a9a1f;
            font-size: 22px;
            transform: rotate(-6deg)
        }

        .logo small {
            font-size: 13px;
            background: var(--coral);
            color: #fff;
            border-radius: 8px;
            padding: 2px 8px
        }

        .me {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .lvl {
            font-family: var(--head);
            font-weight: 800;
            background: var(--amber);
            color: var(--dark);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 17px
        }

        .xp {
            width: 120px;
            height: 14px;
            border-radius: 999px;
            background: var(--panel);
            overflow: hidden;
            border: 2px solid var(--edge)
        }

        .xp i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--lime);
            transition: width .6s
        }

        .snd {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--edge);
            background: var(--panel);
            font-size: 18px
        }

        .hero {
            margin: 6px 0 22px
        }

        .hero h2 {
            font-size: clamp(30px, 6vw, 54px);
            font-weight: 800;
            letter-spacing: -1px;
            max-width: 16ch
        }

        .hero p {
            margin: 10px 0 0;
            max-width: 46ch;
            color: var(--mute);
            line-height: 1.55;
            font-size: 15px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 16px
        }

        .tile {
            text-align: left;
            background: var(--panel);
            border: 3px solid var(--edge);
            border-radius: 24px;
            padding: 18px;
            display: grid;
            grid-template-columns: 78px 1fr;
            gap: 6px 14px;
            align-items: start;
            transition: transform .12s, border-color .12s
        }

        .tile:hover {
            transform: translateY(-3px);
            border-color: var(--c)
        }

        .tile:active {
            transform: translateY(1px)
        }

        .orb {
            width: 78px;
            height: 78px;
            border-radius: 24px;
            background: var(--c);
            display: grid;
            place-items: center;
            font-size: 38px;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .35);
            grid-row: span 2
        }

        .tile h3 {
            font-size: 24px;
            font-weight: 800;
            align-self: end
        }

        .tile p {
            margin: 0;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--mute);
            grid-column: 2
        }

        .tile .meta {
            grid-column: 1/-1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 8px;
            color: var(--mute)
        }

        .tag {
            background: var(--c);
            color: var(--dark);
            border-radius: 999px;
            padding: 3px 12px;
            font-weight: 700;
            font-size: 12px
        }

        .badges {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-top: 26px;
            align-items: center
        }

        .badges b {
            font-family: var(--head);
            font-size: 20px;
            margin-right: 4px
        }

        .bd {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px solid var(--amber);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 13px;
            background: var(--panel)
        }

        .bd.off {
            opacity: .35;
            filter: grayscale(1);
            border-style: dashed;
            border-color: var(--edge)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px
        }

        .back {
            border: 2px solid var(--edge);
            background: var(--panel);
            border-radius: 14px;
            padding: 8px 14px;
            font-weight: 500
        }

        .bar h2 {
            font-size: 28px;
            font-weight: 800
        }

        .stage {
            max-width: 640px;
            margin: 0 auto
        }

        .panel {
            background: var(--panel);
            border: 3px solid var(--edge);
            border-radius: 22px;
            padding: 20px
        }

        .center {
            text-align: center
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 14px
        }

        .btn {
            border: 0;
            background: var(--amber);
            color: var(--dark);
            border-radius: 16px;
            padding: 13px 22px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 5px 0 #b58610;
            transition: transform .08s, box-shadow .08s
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b58610
        }

        .btn.lime {
            background: var(--lime);
            box-shadow: 0 5px 0 #7a9a1f
        }

        .btn.lime:active {
            box-shadow: 0 1px 0 #7a9a1f
        }

        .btn.coral {
            background: var(--coral);
            box-shadow: 0 5px 0 #b03e2c
        }

        .btn.coral:active {
            box-shadow: 0 1px 0 #b03e2c
        }

        .btn.sky {
            background: var(--sky);
            box-shadow: 0 5px 0 #2f84b8
        }

        .btn.sky:active {
            box-shadow: 0 1px 0 #2f84b8
        }

        .btn.ghost {
            background: var(--panel2);
            color: var(--text);
            box-shadow: 0 5px 0 #0f3238
        }

        .btn:disabled {
            opacity: .4;
            pointer-events: none
        }

        .hud {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 15px
        }

        .hud span {
            background: var(--panel);
            border: 2px solid var(--edge);
            border-radius: 12px;
            padding: 5px 12px
        }

        .hint {
            text-align: center;
            font-size: 13px;
            color: var(--mute);
            margin: 10px 0 0;
            line-height: 1.5
        }

        canvas {
            display: block;
            margin: 0 auto;
            border: 3px solid var(--edge);
            border-radius: 18px;
            touch-action: none;
            max-width: 100%
        }

        .qbox {
            background: var(--panel2);
            border: 3px solid var(--edge);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px
        }

        .pill {
            display: inline-block;
            background: var(--panel2);
            border: 2px solid var(--amber);
            border-radius: 999px;
            padding: 6px 16px;
            font-weight: 500;
            font-size: 14px
        }

        .pop {
            animation: pop .35s
        }

        @keyframes pop {
            0% {
                transform: scale(.8)
            }

            60% {
                transform: scale(1.06)
            }

            100% {
                transform: scale(1)
            }
        }

        .shake {
            animation: shake .35s
        }

        @keyframes shake {
            25% {
                transform: translateX(-6px)
            }

            75% {
                transform: translateX(6px)
            }
        }

        /* trắc nghiệm chung */
        .tbar {
            height: 14px;
            border-radius: 999px;
            background: var(--panel);
            border: 2px solid var(--edge);
            overflow: hidden;
            margin-bottom: 12px
        }

        .tbar i {
            display: block;
            height: 100%;
            width: 100%;
            background: var(--coral);
            transition: width .1s linear
        }

        .opts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .opt {
            border: 0;
            background: var(--panel2);
            border-radius: 16px;
            padding: 16px 8px;
            font-family: var(--head);
            font-weight: 800;
            font-size: clamp(22px, 5.5vw, 30px);
            box-shadow: 0 5px 0 #0f3238;
            transition: transform .08s
        }

        .opt:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f3238
        }

        .opt.ok {
            background: var(--ok);
            color: #06331a
        }

        .opt.bad {
            background: var(--bad);
            color: #fff;
            animation: shake .3s
        }

        .explain {
            margin-top: 14px;
            background: var(--panel);
            border: 2px solid var(--amber);
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 14.5px;
            line-height: 1.55
        }

        .seq {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap
        }

        .chip {
            min-width: 50px;
            height: 58px;
            padding: 0 10px;
            border-radius: 14px;
            background: var(--panel);
            border: 3px solid var(--edge);
            display: grid;
            place-items: center;
            font-family: var(--head);
            font-weight: 800;
            font-size: 26px
        }

        .chip.q {
            background: var(--amber);
            color: var(--dark);
            border-color: var(--amber);
            animation: pop .5s infinite alternate
        }

        /* 2048 */
        .b48 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: min(100%, 420px);
            margin: 0 auto;
            padding: 8px;
            border-radius: 20px;
            background: #08191d;
            touch-action: none;
            user-select: none
        }

        .t48 {
            aspect-ratio: 1;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-family: var(--head);
            font-weight: 800;
            background: #123a41;
            position: relative;
            color: var(--dark)
        }

        .t48 small {
            position: absolute;
            bottom: 3px;
            font-size: 11px;
            font-family: var(--body);
            font-weight: 500;
            opacity: .7
        }

        .t48.n {
            animation: pop .22s
        }

        /* hóa học */
        .flask {
            min-height: 130px;
            border: 4px solid var(--sky);
            border-top: 0;
            border-radius: 0 0 46px 46px;
            padding: 12px 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-content: flex-end;
            background: linear-gradient(transparent 15%, rgba(110, 198, 255, .22));
            margin: 6px 14px 0
        }

        .atom {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-family: var(--head);
            font-weight: 800;
            font-size: 22px;
            border: 3px solid rgba(255, 255, 255, .75);
            padding: 0;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .3)
        }

        .atom.big {
            width: 62px;
            height: 62px;
            font-size: 24px
        }

        .atom:active {
            transform: translateY(3px)
        }

        /* simon */
        .simon {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: min(100%, 360px);
            margin: 0 auto
        }

        .pd {
            aspect-ratio: 1;
            border: 0;
            border-radius: 30px;
            font-size: 48px;
            opacity: .5;
            color: rgba(0, 0, 0, .45);
            transition: opacity .1s, transform .1s, filter .1s;
            box-shadow: 0 7px 0 rgba(0, 0, 0, .35)
        }

        .pd.on {
            opacity: 1;
            transform: scale(1.05);
            filter: brightness(1.25)
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(4, 20, 24, .8);
            display: none;
            place-items: center;
            padding: 18px;
            z-index: 20
        }

        #modal.on {
            display: grid
        }

        .result {
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: pop .4s
        }

        .result h2 {
            font-size: 34px;
            font-weight: 800
        }

        .big {
            font-family: var(--head);
            font-weight: 800;
            font-size: 66px;
            line-height: 1;
            margin: 8px 0;
            color: var(--amber)
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0
        }

        .stats span {
            background: var(--panel2);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 14px
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 120px);
            background: var(--amber);
            color: var(--dark);
            padding: 12px 20px;
            border-radius: 999px;
            font-weight: 700;
            z-index: 30;
            transition: transform .4s;
            max-width: 90vw;
            text-align: center
        }

        #toast.on {
            transform: translate(-50%, 0)
        }

        button:focus-visible {
            outline: 4px solid var(--sky);
            outline-offset: 2px
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

                <span class="lvl" id="lvl">Cấp 1</span>

    <!-- ① Cấu hình API — đặt trước khi load api.js -->
    <script>
        window.GAME_API_BASE = 'https://educational-games-lp4z.onrender.com';          /* VD: 'https://api.example.com' */

    <!-- noi dung cua api.js da duoc NHUNG truc tiep, vi iframe srcDoc khong
     tai duong dan tuong doi. -->
<script>
/**
 * api.js — Module giao tiếp với backend cho 16 mini-game
 *
 * Chức năng:
 *   - loadProfile()    : tải hồ sơ người chơi từ GET /api/mini/me
 *   - startSession()   : tạo session chống gian lận qua POST /api/mini/sessions
 *   - submitResult()   : gửi kết quả ván qua POST /api/mini/results (idempotent)
 *   - Hàng đợi offline : lưu vào localStorage khi mất mạng, gửi lại khi có mạng
 *
 * Cấu hình:
 *   Đặt BASE_URL và cách lấy token bằng cách gán window.GAME_API_BASE và
 *   window.GAME_API_TOKEN_FN trước khi load file này, hoặc để dùng default.
 *
 * Ví dụ cấu hình trong HTML:
 *   <script>
 *     window.GAME_API_BASE     = 'https://api.example.com';
 *     window.GAME_API_TOKEN_FN = () => localStorage.getItem('token');
 *   <\/script>
 *   <script src="api.js"><\/script>
 */

const GameAPI = (() => {
  /* ── Cấu hình ────────────────────────────────────────────────────────── */

  /** Base URL của backend. Gán qua window.GAME_API_BASE trước khi load. */
  const BASE = () =>
    (window.GAME_API_BASE || '').replace(/\/$/, '');

  /** Hàm lấy JWT token. Gán qua window.GAME_API_TOKEN_FN. */
  const getToken = () =>
    typeof window.GAME_API_TOKEN_FN === 'function'
      ? window.GAME_API_TOKEN_FN()
      : localStorage.getItem('token') || sessionStorage.getItem('token') || null;

  const OFFLINE_KEY   = 'miniGame_pendingResults';
  const SESSION_KEY   = 'miniGame_currentSession';

  /* ── Helpers HTTP ────────────────────────────────────────────────────── */

  function _headers() {
    const h = { 'Content-Type': 'application/json' };
    const tok = getToken();
    if (tok) h['Authorization'] = `Bearer ${tok}`;
    return h;
  }

  /** GET với auth */
  async function _get(path) {
    const res = await fetch(BASE() + path, { headers: _headers() });
    if (!res.ok) throw new Error(`GET ${path} → ${res.status}`);
    return res.json();
  }

  /** POST với auth */
  async function _post(path, body) {
    const res = await fetch(BASE() + path, {
      method:  'POST',
      headers: _headers(),
      body:    JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw Object.assign(new Error(err.msg || `POST ${path} → ${res.status}`), { status: res.status, body: err });
    }
    return res.json();
  }

  /* ── Session ─────────────────────────────────────────────────────────── */

  let _currentSession = null;  // { sessionId, game, startedAt }

  /** Gọi khi openGame(id) — tạo session anti-cheat trên server. */
  async function startSession(game) {
    if (!BASE()) return null;  // chưa cấu hình API
    const tok = getToken();
    if (!tok) return null;     // chưa đăng nhập

    try {
      const res = await _post('/api/mini/sessions', { game });
      _currentSession = { sessionId: res.data.sessionId, game, startedAt: res.data.startedAt };
      // Lưu vào sessionStorage để phục hồi nếu tab bị tải lại giữa chừng
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(_currentSession)); } catch { /* ignore */ }
      return _currentSession;
    } catch (e) {
      console.warn('[GameAPI] Không tạo được session:', e.message);
      _currentSession = null;
      return null;
    }
  }

  /** Khôi phục session từ sessionStorage (nếu tab bị reload) */
  function _restoreSession(game) {
    if (_currentSession?.game === game) return _currentSession;
    try {
      const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
      if (saved?.game === game) { _currentSession = saved; return saved; }
    } catch { /* ignore */ }
    return null;
  }

  /* ── Submit result ────────────────────────────────────────────────────── */

  /**
   * Gửi kết quả ván chơi. Tự động xử lý offline.
   *
   * @param {{ game: string, score: number, details?: object }} payload
   * @returns {object|null} response data từ server hoặc null nếu lỗi
   */
  async function submitResult({ game, score, details = {} }) {
    if (!BASE()) return null;
    const tok = getToken();
    if (!tok) return null;

    const session = _restoreSession(game);
    const sessionId = session?.sessionId ?? null;

    const body = { game, score, details };
    if (sessionId) body.sessionId = sessionId;

    try {
      const res = await _post('/api/mini/results', body);
      // Xóa session đã dùng
      _currentSession = null;
      try { sessionStorage.removeItem(SESSION_KEY); } catch { /* ignore */ }
      // Thử gửi hàng đợi offline
      _flushPendingResults();
      return res.data;
    } catch (e) {
      // Lỗi mạng → đưa vào hàng đợi
      if (!e.status || e.status >= 500) {
        _enqueuePending({ game, score, details, sessionId, queuedAt: new Date().toISOString() });
        _showOfflineToast();
      }
      // Lỗi 4xx (score vượt trần, session sai, ...) → không xếp hàng
      return null;
    }
  }

  /* ── Offline queue ────────────────────────────────────────────────────── */

  function _getPending() {
    try { return JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]'); }
    catch { return []; }
  }

  function _savePending(queue) {
    try { localStorage.setItem(OFFLINE_KEY, JSON.stringify(queue)); }
    catch { /* storage đầy hoặc không có */ }
  }

  function _enqueuePending(item) {
    const queue = _getPending();
    // Giới hạn 50 ván chờ gửi
    if (queue.length >= 50) queue.shift();
    queue.push(item);
    _savePending(queue);
  }

  /** Thử gửi lại tất cả kết quả còn trong hàng đợi. */
  async function _flushPendingResults() {
    if (!BASE() || !getToken()) return;
    const queue = _getPending();
    if (!queue.length) return;

    const remaining = [];
    for (const item of queue) {
      try {
        await _post('/api/mini/results', {
          sessionId: item.sessionId ?? undefined,
          game:      item.game,
          score:     item.score,
          details:   item.details ?? {},
        });
        // Gửi thành công → không giữ lại
      } catch (e) {
        if (!e.status || e.status >= 500) {
          remaining.push(item);  // lỗi mạng → giữ lại
        }
        // 4xx → bỏ luôn (sessionId hết hạn, score không hợp lệ...)
      }
    }
    _savePending(remaining);
  }

  function _showOfflineToast() {
    // toast() được khai báo trong game-core.js (cùng scope window)
    if (typeof toast === 'function') {
      toast('📶 Không có mạng — kết quả sẽ được gửi lại sau');
    }
  }

  /* ── Load profile ─────────────────────────────────────────────────────── */

  /**
   * Tải hồ sơ người chơi và nạp vào S (object trạng thái của game-core.js).
   * Gọi khi trang vừa tải xong.
   */
  async function loadProfile() {
    if (!BASE() || !getToken()) return null;
    try {
      const res = await _get('/api/mini/me');
      const p   = res.data;
      if (!p) return null;

      // Nạp vào S (game-core.js khai báo S ở global scope của script)
      if (typeof S !== 'undefined') {
        S.xp     = p.xp    ?? 0;
        S.best   = p.best  ?? {};
        S.played = new Set(p.played ?? []);
        S.unlocked = new Set((p.badges ?? []).map(b => b.id ?? b));
      }

      // Thử gửi lại kết quả còn trong hàng đợi offline
      _flushPendingResults();

      return p;
    } catch (e) {
      console.warn('[GameAPI] Không tải được hồ sơ:', e.message);
      return null;
    }
  }

  /* ── Public API ───────────────────────────────────────────────────────── */

  // Gắn vào online event để tự flush khi có lại mạng
  window.addEventListener('online', () => {
    _flushPendingResults();
  });

  return {
    loadProfile,
    startSession,
    submitResult,
    flushPending: _flushPendingResults,
    /** Dùng nội bộ bởi game-core.js (leaderboard) */
    _get,
  };
})();

    <!-- noi dung cua game-core.js da duoc NHUNG truc tiep, vi iframe srcDoc khong
     tai duong dan tuong doi. -->
<script>
/**
 * game-core.js — Thư viện dùng chung cho 3 bộ mini-game
 *
 * Bao gồm:
 *   - Tiện ích ($, rnd, shuffle)
 *   - Trạng thái người chơi (S)
 *   - Âm thanh (soundOn, beep, sfx)
 *   - Bộ hẹn giờ & phím (T, onKey, cleanup)
 *   - Toast thông báo
 *   - Huy hiệu (BADGES, checkBadges)
 *   - XP & cấp (lvl, renderMe)
 *   - Sinh câu hỏi toán (genMath, makeOpts)
 *   - Canvas helper (fitCanvas)
 *   - Trắc nghiệm dùng chung (runMC)
 *   - finish() — xử lý kết thúc ván + gọi API
 *   - renderHub(), openGame() — để từng file override sau khi include
 *
 * Cách dùng trong mỗi HTML:
 *   <script src="game-core.js"><\/script>
 *   <script>
 *     // Khai báo GAMES riêng của file
 *     const GAMES = [...];
 *     // Gọi khởi động
 *     initCore({ games: GAMES, hubTitle: '...', hubDesc: '...' });
 *   <\/script>
 */

/* ============ Tiện ích ============ */
const $ = s => document.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const shuffle = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ============ Trạng thái người chơi (lưu localStorage) ============ */
const S = {
  xp: 0, games: 0, best: {}, flags: {},
  played: new Set(), unlocked: new Set()
};
const XP_PER_LVL = 120;
const lvl = () => Math.floor(S.xp / XP_PER_LVL) + 1;

/* ============ localStorage persistence ============ */
let _storageKey = '';

function _saveState() {
  if (!_storageKey) return;
  try {
    const data = {
      xp: S.xp, games: S.games, best: S.best, flags: S.flags,
      played: [...S.played], unlocked: [...S.unlocked]
    };
    localStorage.setItem(_storageKey, JSON.stringify(data));
  } catch (e) { /* quota exceeded hoặc private mode */ }
}

function _loadState() {
  if (!_storageKey) return;
  try {
    const raw = localStorage.getItem(_storageKey);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.xp === 'number') S.xp = data.xp;
    if (typeof data.games === 'number') S.games = data.games;
    if (data.best && typeof data.best === 'object') S.best = data.best;
    if (data.flags && typeof data.flags === 'object') S.flags = data.flags;
    if (Array.isArray(data.played)) S.played = new Set(data.played);
    if (Array.isArray(data.unlocked)) S.unlocked = new Set(data.unlocked);
  } catch (e) { /* parse error — bỏ qua */ }
}

/* ============ Âm thanh ============ */
let soundOn = true, actx;

function beep(f, d = .12, type = 'sine', v = .07) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.stop(actx.currentTime + d);
  } catch (e) { /* ignore */ }
}

const sfx = {
  ok()  { beep(660, .1); setTimeout(() => beep(880, .14), 90); },
  bad() { beep(150, .25, 'sawtooth', .05); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i * 110)); },
  tick(){ beep(520, .05, 'square', .03); },
  flap(){ beep(420, .07, 'triangle', .05); }
};

/* Nút tắt/bật âm thanh — tự kết nối khi DOM sẵn sàng */
function _bindSoundBtn() {
  const btn = $('#snd');
  if (btn) btn.onclick = () => { soundOn = !soundOn; btn.textContent = soundOn ? '🔊' : '🔇'; };
}

/* ============ Bộ hẹn giờ & phím ============ */
const T = {
  ids: [], ints: [], stops: [],
  set(fn, ms)  { const id = setTimeout(fn, ms);  this.ids.push(id);   return id; },
  int(fn, ms)  { const id = setInterval(fn, ms); this.ints.push(id);  return id; },
  loop(fn) {
    let last = performance.now(), run = true;
    const step = t => {
      if (!run) return;
      const dt = Math.min(.05, (t - last) / 1000);
      last = t; fn(dt);
      if (run) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    this.stops.push(() => { run = false; });
  },
  clear() {
    this.ids.forEach(clearTimeout);
    this.ints.forEach(clearInterval);
    this.stops.forEach(f => f());
    this.ids = []; this.ints = []; this.stops = [];
  }
};

let onKey = null;
window.addEventListener('keydown', e => { if (onKey) onKey(e); });

function cleanup() {
  T.clear();
  onKey = null;
  const stage = $('#stage');
  if (stage) { stage.onclick = null; stage.ontouchstart = null; }
  try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
}

/* ============ Canvas helper ============ */
function fitCanvas(cv, w, h) {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(w * d);
  cv.height = Math.round(h * d);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  const c = cv.getContext('2d');
  c.setTransform(d, 0, 0, d, 0, 0);
  return c;
}

/* ============ Toast thông báo ============ */
let _toastT;
function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ============ Huy hiệu ============ */
// Mảng BADGES được từng file khai báo bổ sung qua initCore({ badges })
// File này khai báo set mặc định hợp nhất cho tất cả game
let BADGES = [];

function checkBadges() {
  BADGES.forEach(b => {
    if (!S.unlocked.has(b.id) && b.ok()) {
      S.unlocked.add(b.id);
      setTimeout(() => toast(`${b.i} Huy hiệu mới: ${b.n}`), 900);
    }
  });
}

/* ============ XP & Cấp ============ */
function renderMe() {
  const lvlEl = $('#lvl'), xpEl = $('#xpb');
  if (lvlEl) lvlEl.textContent = 'Cấp ' + lvl();
  if (xpEl)  xpEl.style.width  = ((S.xp % XP_PER_LVL) / XP_PER_LVL * 100) + '%';
}

/* ============ Sinh câu hỏi toán ============ */
function genMath(level) {
  let a, b, c, text, ans;
  if (level === 0) {
    if (rnd(0, 1)) { a = rnd(2, 20); b = rnd(1, 20); text = `${a} + ${b}`; ans = a + b; }
    else           { a = rnd(5, 25); b = rnd(1, a);  text = `${a} − ${b}`; ans = a - b; }
  } else if (level === 1) {
    const t = rnd(0, 3);
    if      (t === 0) { a = rnd(2, 10); b = rnd(2, 10); text = `${a} × ${b}`; ans = a * b; }
    else if (t === 1) { a = rnd(20, 99); b = rnd(10, 60); text = `${a} + ${b}`; ans = a + b; }
    else if (t === 2) { a = rnd(40, 99); b = rnd(10, a);  text = `${a} − ${b}`; ans = a - b; }
    else              { b = rnd(2, 9); ans = rnd(2, 10); a = b * ans; text = `${a} ÷ ${b}`; }
  } else {
    const t = rnd(0, 3);
    if      (t === 0) { a = rnd(6, 15);  b = rnd(3, 12); text = `${a} × ${b}`; ans = a * b; }
    else if (t === 1) { b = rnd(3, 12); ans = rnd(4, 15); a = b * ans; text = `${a} ÷ ${b}`; }
    else if (t === 2) { a = rnd(2, 20); b = rnd(2, 9); c = rnd(2, 9); text = `${a} + ${b} × ${c}`; ans = a + b * c; }
    else {
      a = rnd(2, 9); b = rnd(2, 9); c = rnd(1, 20);
      text = `${a} × ${b} − ${c}`; ans = a * b - c;
      if (ans < 0) { text = `${a} × ${b} + ${c}`; ans = a * b + c; }
    }
  }
  return { text, ans };
}

function makeOpts(ans, n) {
  const set = new Set([ans]);
  const spread = Math.max(3, Math.round(Math.abs(ans) * .2));
  let guard = 0;
  while (set.size < n && guard++ < 200) {
    const v = ans + rnd(1, spread) * (rnd(0, 1) ? 1 : -1);
    if (v >= 0) set.add(v);
  }
  let k = 1;
  while (set.size < n) set.add(ans + k++);
  return shuffle([...set]);
}

/* ============ Trắc nghiệm dùng chung (Đồng hồ, Quy luật) ============ */
function runMC(root, cfg) {
  let i = 0, score = 0, right = 0, streak = 0, time = cfg.secs, done = false, cur;
  function show() {
    cur = cfg.make(i); done = false; time = cfg.secs;
    root.innerHTML = `<div class="hud"><span>Câu <b>${i + 1}/${cfg.count}</b></span><span>⭐ <b>${score}</b></span><span>🔥 ${streak}</span></div>
      <div class="tbar"><i id="tb"></i></div>
      <div class="qbox">${cur.html}</div>
      <div class="opts" id="o">${cur.opts.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
      <div id="ex"></div><div class="row" id="nx"></div>`;
    if (cur.after) cur.after();
  }
  function answer(k) {
    if (done) return; done = true;
    const btns = [...root.querySelectorAll('.opt')],
          ci   = cur.opts.findIndex(o => String(o) === String(cur.ans));
    btns[ci].classList.add('ok');
    if (k === ci) { right++; streak++; score += 10 + Math.ceil(time) + (streak >= 3 ? 5 : 0); sfx.ok(); }
    else          { streak = 0; sfx.bad(); if (k >= 0) btns[k].classList.add('bad'); }
    $('#ex').innerHTML = `<div class="explain">💡 ${k === -1 ? 'Hết giờ! ' : ''}${cur.exp}</div>`;
    $('#nx').innerHTML = `<button class="btn" data-next="1">${i < cfg.count - 1 ? 'Câu tiếp theo' : 'Xem kết quả'}</button>`;
  }
  root.onclick = e => {
    const o = e.target.closest('.opt'), n = e.target.closest('[data-next]');
    if (o) answer(+o.dataset.k);
    else if (n) {
      i++;
      if (i < cfg.count) show();
      else {
        cfg.onEnd && cfg.onEnd(right);
        finish({ id: cfg.id, score, xp: Math.round(score / 4), lines: [`Đúng ${right}/${cfg.count} câu`], replay: cfg.replay });
      }
    }
  };
  T.int(() => {
    if (done) return;
    time -= .1;
    const tb = $('#tb');
    if (tb) tb.style.width = Math.max(0, time / cfg.secs * 100) + '%';
    if (time <= 0) answer(-1);
  }, 100);
  show();
}

/* ============ finish() — kết thúc ván & gọi API ============ */
/**
 * Gọi khi một ván kết thúc.
 * @param {{ id, score, xp, lines, replay, details? }} opts
 */
function finish({ id, score, xp, lines, replay, details = {} }) {
  cleanup();

  // Cập nhật state client ngay (không chờ mạng)
  const before = lvl();
  S.xp   += xp;
  S.games++;
  S.played.add(id);
  const isBest = score > (S.best[id] || 0);
  if (isBest) S.best[id] = score;
  checkBadges();
  renderMe();
  _saveState(); // ← Lưu tiến độ vào localStorage
  const up = lvl() > before;
  sfx.win();

  $('#modal').innerHTML = `<div class="panel result">
    <h2>${up ? 'Lên cấp ' + lvl() + '!' : 'Hoàn thành!'}</h2>
    <div class="big">${score}</div>
    <div class="stats">
      ${isBest ? '<span>🏆 Kỷ lục mới</span>' : ''}
      ${lines.map(l => `<span>${l}</span>`).join('')}
      <span>+${xp} XP</span>
    </div>
    <div class="row">
      <button class="btn" id="again">Chơi lại</button>
      <button class="btn alt ghost" id="home">Về sảnh</button>
    </div>
  </div>`;
  $('#modal').classList.add('on');

  $('#again').onclick = () => { $('#modal').classList.remove('on'); openGame(id); };
  $('#home').onclick  = () => { $('#modal').classList.remove('on'); renderHub(); };

  // Gửi kết quả lên server (không block UI)
  GameAPI.submitResult({ game: id, score, details }).then(serverData => {
    if (!serverData) return;
    // Cập nhật lại từ server (XP, cấp, huy hiệu)
    if (typeof serverData.totalXp === 'number') S.xp = serverData.totalXp;
    renderMe();
    _saveState();
    if (Array.isArray(serverData.newBadges)) {
      serverData.newBadges.forEach(b => {
        S.unlocked.add(b.id);
        setTimeout(() => toast(`${b.icon} Huy hiệu mới: ${b.name}`), 900);
      });
      _saveState();
    }
  }).catch(() => { /* lỗi mạng đã được xử lý trong api.js */ });
}

/* ============ renderHub & openGame (được override bởi mỗi file) ============ */
// Các hàm này được khai báo ở đây nhưng thực sự được gán lại trong initCore()
// khi mỗi file HTML gọi initCore({ games, hubTitle, hubDesc, badges })
let _GAMES = [];

function renderHub() {
  cleanup();
  $('#game').hidden = true;
  $('#hub').hidden  = false;
  $('#modal').classList.remove('on');
  const grid = _GAMES.map(g => {
    // Hỗ trợ cả style game1 (color field) và game2/3 (c field với orb)
    const usesOrb = !!g.icon && !g.color;
    if (usesOrb) {
      return `<button class="tile" data-g="${g.id}" style="--c:${g.c}">
        <span class="orb">${g.icon}</span>
        <h3>${g.name}</h3>
        <p>${g.desc}</p>
        <span class="meta"><span class="tag">${g.tag}</span><span>${S.best[g.id] ? 'Kỷ lục ' + S.best[g.id] : 'Chưa chơi'}</span></span>
      </button>`;
    }
    return `<button class="tile" data-g="${g.id}" style="background:${g.color}">
      <span class="ic">${g.icon}</span>
      <h3>${g.name}</h3>
      <p>${g.desc}</p>
      <span class="meta"><span class="tag">${g.tag}</span><span>${S.best[g.id] ? 'Kỷ lục ' + S.best[g.id] : 'Chưa chơi'}</span></span>
    </button>`;
  }).join('');

  const badgesHtml = BADGES.map(b =>
    `<span class="bd ${S.unlocked.has(b.id) ? '' : 'off'}">${b.i} ${b.n}</span>`
  ).join('');

  $('#hub').innerHTML = `
    <div class="hero">
      <h2 id="hub-title"></h2>
      <p id="hub-desc"></p>
    </div>
    <div class="grid">${grid}</div>
    ${_showLeaderboardBtn()}
    <div class="badges"><b>Huy hiệu</b>${badgesHtml}</div>`;

  // Điền lại title/desc từ biến đã lưu
  if ($('#hub-title')) $('#hub-title').textContent = _hubTitle;
  if ($('#hub-desc'))  $('#hub-desc').textContent  = _hubDesc;

  renderMe();
}

function openGame(id) {
  cleanup();
  const g = _GAMES.find(x => x.id === id);
  if (!g) return;
  $('#hub').hidden  = true;
  $('#game').hidden = false;
  $('#gt').textContent = g.name;
  $('#modal').classList.remove('on');
  g.fn($('#stage'));
  window.scrollTo(0, 0);
  // Báo server bắt đầu ván mới
  GameAPI.startSession(id);
}

/* ============ Bảng xếp hạng ============ */
function _showLeaderboardBtn() {
  return `<div style="margin:18px 0 0;text-align:center">
    <button class="btn ghost" id="lb-btn" style="font-size:14px">🏆 Bảng xếp hạng</button>
  </div>`;
}

function _openLeaderboard() {
  const modal = $('#modal');
  modal.innerHTML = `<div class="panel result" style="max-width:520px;text-align:left">
    <h2 style="margin-bottom:12px">🏆 Bảng xếp hạng</h2>
    <div id="lb-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
    <div id="lb-body" style="font-size:14px">Đang tải...</div>
    <div class="row"><button class="btn alt ghost" id="lb-close">Đóng</button></div>
  </div>`;
  modal.classList.add('on');
  $('#lb-close').onclick = () => modal.classList.remove('on');

  const tabs = [{ label: 'XP tổng', key: 'xp' }, ..._GAMES.map(g => ({ label: g.name.split(' ').slice(0, 2).join(' '), key: g.id }))];
  let activeKey = 'xp';

  function renderTabs() {
    $('#lb-tabs').innerHTML = tabs.map(t =>
      `<button class="btn ${t.key === activeKey ? '' : 'ghost'}" style="font-size:12px;padding:6px 12px" data-lb="${t.key}">${t.label}</button>`
    ).join('');
  }

  async function loadTab(key) {
    activeKey = key; renderTabs();
    $('#lb-body').innerHTML = 'Đang tải...';
    try {
      let rows;
      if (key === 'xp') {
        const r = await GameAPI._get('/api/mini/leaderboard/xp?limit=20');
        rows = (r.data || []).map((x, i) =>
          `<tr><td>${x.rank ?? i + 1}</td><td>${x.displayName}</td><td>${x.xp} XP</td><td>Cấp ${x.level}</td></tr>`
        );
      } else {
        const r = await GameAPI._get(`/api/mini/leaderboard/${key}?limit=20`);
        rows = (r.data || []).map((x, i) =>
          `<tr><td>${x.rank ?? i + 1}</td><td>${x.displayName}</td><td>${x.best} điểm</td><td></td></tr>`
        );
      }
      $('#lb-body').innerHTML = rows.length
        ? `<table style="width:100%;border-collapse:collapse">${rows.join('')}</table>`
        : '<p style="opacity:.6">Chưa có dữ liệu.</p>';
    } catch {
      $('#lb-body').innerHTML = '<p style="opacity:.6">Không thể tải bảng xếp hạng.</p>';
    }
  }

  $('#lb-tabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-lb]');
    if (btn) loadTab(btn.dataset.lb);
  });

  loadTab('xp');
}

/* ============ initCore — điểm khởi động của mỗi file ============ */
let _hubTitle = '', _hubDesc = '';

/**
 * Gọi một lần ở cuối mỗi file HTML, sau khi khai báo GAMES.
 *
 * @param {object} opts
 * @param {Array}  opts.games    — mảng GAMES của file đó
 * @param {string} opts.hubTitle — tiêu đề sảnh
 * @param {string} opts.hubDesc  — mô tả sảnh
 * @param {Array}  [opts.badges] — huy hiệu bổ sung (merge vào BADGES chung)
 */
function initCore({ games, hubTitle = '', hubDesc = '', badges = [], storageKey = '' }) {
  _GAMES    = games;
  _hubTitle = hubTitle;
  _hubDesc  = hubDesc;
  BADGES    = badges;
  _storageKey = storageKey || '';

  // Khôi phục tiến độ từ localStorage
  _loadState();

  _bindSoundBtn();

  // Kết nối hub click
  const hub = $('#hub');
  if (hub) hub.onclick = e => { const t = e.target.closest('[data-g]'); if (t) openGame(t.dataset.g); };
  const backBtn = $('#back');
  if (backBtn) backBtn.onclick = renderHub;

  // Nút leaderboard (gắn sau khi renderHub tạo ra)
  document.addEventListener('click', e => {
    if (e.target.closest('#lb-btn')) _openLeaderboard();
  });

  // Tải hồ sơ từ server rồi render sảnh
  GameAPI.loadProfile().then(() => renderHub()).catch(() => renderHub());
}
</script>

    <!-- GAME 4 — noi dung rieng cua tung file -->
    <script>
    /* ══════════════════════════════════════════════════════════════════════════
       TIẾN ĐỘ OFFLINE — lưu & khôi phục bằng localStorage
       ──────────────────────────────────────────────────────────────────────────
       Game này nằm hoàn toàn trong HTML nên không có API để hỏi "bạn chơi tới
       đâu". Vì vậy mọi thay đổi trong ván đều ghi xuống localStorage:
         • sau MỖI câu trả lời (đúng/sai, tăng/giảm mạng)
         • khi lên màn, khi trừ mạng
         • khi người chơi đóng tab (beforeunload)
       Khi mở lại game, hub hiện bảng "Tiến độ đang lưu" kèm nút Tiếp tục để
       nhảy thẳng vào đúng màn đang dở — kể cả khi tải lại trang.
       ══════════════════════════════════════════════════════════════════════ */

    const PROGRESS_KEY = 'hmc_game4_progress_v1';
    const PROGRESS_TTL = 30 * 24 * 60 * 60 * 1000; // bỏ qua tiến độ cũ hơn 30 ngày

    const HP = {
      data: null,

      /** Đọc tiến độ từ localStorage. Trả null nếu chưa có / hỏng / quá hạn. */
      read() {
        try {
          const raw = localStorage.getItem(PROGRESS_KEY);
          if (!raw) return null;
          const d = JSON.parse(raw);
          if (!d || typeof d !== 'object' || !d.game) return null;
          if (d.updatedAt && Date.now() - d.updatedAt > PROGRESS_TTL) { this.clear(); return null; }
          return d;
        } catch { return null; }
      },

      /** Đọc lại từ đĩa (dùng cho nút "Kiểm tra tiến độ"). */
      refresh() { this.data = this.read(); return this.data; },

      /** Ghi đè toàn bộ. */
      write(d) {
        d.updatedAt = Date.now();
        this.data = d;
        try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(d)); } catch (e) { /* private mode / đầy bộ nhớ đệm */ }
        return d;
      },

      /** Ghi đè một phần (merge vào tiến độ hiện tại). */
      save(patch) { return this.write({ ...(this.data || {}), ...patch }); },

      /** Xoá tiến độ (khi hoàn thành ván, hoặc người chơi bấm Xoá). */
      clear() {
        this.data = null;
        try { localStorage.removeItem(PROGRESS_KEY); } catch (e) { /* ignore */ }
      },

      /** "vừa xong" / "3 giờ trước" */
      ago() {
        if (!this.data?.updatedAt) return '';
        const m = Math.floor((Date.now() - this.data.updatedAt) / 60000);
        if (m < 1) return 'vừa xong';
        if (m < 60) return `${m} phút trước`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h} giờ trước`;
        return `${Math.floor(h / 24)} ngày trước`;
      },
    };

    /* ══════════════════════════════════════════════════════════════════════════
       BỘ CÂU HỎI
       ══════════════════════════════════════════════════════════════════════ */

    const WORDS = [
      ['apple', 'quả táo'], ['dog', 'con chó'], ['book', 'quyển sách'], ['sun', 'mặt trời'],
      ['bag', 'cái cặp'], ['car', 'ô tô'], ['fish', 'con cá'], ['bird', 'con chim'],
      ['milk', 'sữa'], ['tree', 'cây'], ['star', 'ngôi sao'], ['rain', 'mưa'],
      ['snow', 'tuyết'], ['cake', 'bánh'], ['duck', 'vịt'], ['moon', 'mặt trăng'],
      ['ship', 'con thuyền'], ['frog', 'con ếch'], ['lion', 'sư tử'], ['leaf', 'chiếc lá'],
      ['clock', 'đồng hồ'], ['desk', 'bàn học'], ['hand', 'bàn tay'], ['king', 'vua'],
    ];
    const COLORS = { 'Đỏ': '#ef4444', 'Xanh dương': '#3b82f6', 'Vàng': '#eab308', 'Xanh lá': '#22c55e', 'Tím': '#a855f7', 'Cam': '#f97316' };
    const RIDDLES = [
      ['Con gì có cổ dài nhất?', ['Hươu cao cổ', 'Cổ voi', 'Rắn', 'Cò'], 'Hươu cao cổ', 'Cổ hươu cao cổ dài hơn cả chiếc xe!'],
      ['1 + 1 bằng mấy?', ['1', '2', '3', '11'], '2', 'Hai.'],
      ['Sông nào dài nhất thế giới?', ['Amazon', 'Sông Nile', 'Sông Đà', 'Sông Hồng'], 'Amazon', 'Amazon dài hơn Nile.'],
      ['Mặt trời mọc từ hướng nào?', ['Đông', 'Tây', 'Bắc', 'Nam'], 'Đông', 'Mặt trời mọc ở hướng Đông.'],
      ['Tháng nào có ít ngày nhất?', ['Tháng 2', 'Tháng 1', 'Tháng 4', 'Tháng 6'], 'Tháng 2', 'Tháng 2 thường có 28 ngày.'],
      ['Cành cây nào to nhất?', ['Rễ', 'Cành', 'Lá', 'Hạt'], 'Rễ', 'Rễ cây to bằng thân hoặc hơn.'],
      ['Vịt con kêu gì?', ['Vít', 'Bíp', 'Kẹt', 'Héc'], 'Vít', 'Tiếng vịt con là “vít”.'],
      ['Hành tinh nào gần Mặt Trời nhất?', ['Trái Đất', 'Sao Thiên Vương', 'Sao Thủy', 'Sao Sao'], 'Sao Thủy', 'Sao Thủy là hành tinh gần Mặt Trời nhất.'],
      ['Cá sống ở đâu?', ['Dưới nước', 'Trên cây', 'Trên trời', 'Trong đất'], 'Dưới nước', 'Cá sống dưới nước.'],
      ['Ba số 2 cộng 2 số 2 bằng mấy?', ['4', '6', '8', '22'], '8', '2+2+2+2 = 8.'],
      ['Hình vuông có mấy cạnh?', ['3', '4', '5', '6'], '4', 'Hình vuông có 4 cạnh.'],
      ['Bạn nào giỏ toán nhất?', ['Tim', 'Cẩn', 'Lan', 'Mỹ'], 'Mỹ', 'Chơi cùng “Mỹ” ở trường học Việt Nam.'],
    ];
    const NAMES = ['An', 'Bình', 'Chi', 'Dũng', 'Giang', 'Hà', 'Huy', 'Lan', 'Mai', 'Nam', 'Phúc', 'Quân'];

    /** Xáo trộn ký tự, luôn khác với từ gốc (dài ≥ 3). */
    function scramble(word) {
      if (word.length < 3) return word;
      for (let i = 0; i < 12; i++) {
        const a = shuffle(word.split('')).join('');
        if (a !== word) return a;
      }
      return word.split('').reverse().join('');
    }

    /** Chọn 1 phần tử ngẫu nhiên. Tên riêng để không đụng hàm tiện ích của game-core. */
    function pickOne(arr) { return arr[rnd(0, arr.length - 1)]; }

    /** Lấy n phần tử ngẫu nhiên không trùng nhau. */
    function sample(arr, n) { return shuffle([...arr]).slice(0, n); }

    /** Sinh 3 đáp án sai cho 1 đáp án đúng. */
    function distractors(pool, right, n = 3) {
      return sample([...new Set(pool.filter(x => x !== right))], n);
    }

    /* ══════════════════════════════════════════════════════════════════════════
       CÁC MINI-GAME — mỗi game có make(level) trả về 1 câu hỏi
       ══════════════════════════════════════════════════════════════════════ */

    const MAKERS = {

      anagram(level) {
        const pool = WORDS.slice(0, Math.min(WORDS.length, 6 + level * 4));
        const [en, vi] = pickOne(pool);
        const all = WORDS.map(w => w[0]);
        const opts = shuffle([en, ...distractors(all, en)]);
        return {
          html: `<div style="font-size:11px;opacity:.7">XẾP LẠI TỪ</div>
                 <div style="font-size:34px;letter-spacing:8px;font-weight:800">${scramble(en)}</div>
                 <div style="font-size:14px;opacity:.85;margin-top:6px">Nghĩa: ${vi}</div>`,
          opts, ans: en,
          exp: `Từ đúng là <b>${en}</b> — ${vi}.`,
        };
      },

      stroop(level) {
        const names = Object.keys(COLORS);
        const say = pickOne(names);                              // chữ trong câu lệnh
        const wrong = names.filter(n => n !== say);
        const answerColor = pickOne(names);                      // màu cần tìm
        const grid = shuffle([answerColor, ...sample(wrong, 3)]);
        const idx = grid.indexOf(answerColor);
        return {
          html: `<div style="font-size:11px;opacity:.7">ĐUỔI MÀU</div>
                 <div style="font-size:22px;margin-top:8px">Chọn ô có màu
                   <b style="color:${COLORS[say]};text-shadow:0 0 6px ${COLORS[say]}">${say}</b></div>
                 <div style="font-size:12px;opacity:.6;margin-top:6px">Đọc CHỮ, đừng nhìn màu ô</div>`,
          opts: grid.map((_, i) => String(i + 1)),
          style: grid.map(g => `background:${COLORS[g]};color:#fff;border:0;font-size:20px;font-weight:900;height:74px`),
          ans: String(idx + 1),
          exp: `Ô <b>${idx + 1}</b> mới là màu <b>${answerColor}</b>.`,
        };
      },

      sumseq(level) {
        const kind = rnd(4);
        const step = rnd(2, 6 + level);
        const start = rnd(1, 20);
        let seq, ans, exp;
        if (kind === 0) {                      // cộng đều
          seq = [start, start + step, start + step * 2, start + step * 3];
          ans = start + step * 4;
          exp = `Mỗi số cộng thêm ${step}.`;
        } else if (kind === 1) {               // giảm đều
          seq = [20 + step * 3, 20 + step * 2, 20 + step, 20];
          ans = Math.max(0, 20 - step);
          exp = `Mỗi số trừ ${step}.`;
        } else if (kind === 2) {               // chính phương
          const b = rnd(2, 3 + level);
          seq = [b * b, (b + 1) * (b + 1), (b + 2) * (b + 2), (b + 3) * (b + 3)];
          ans = (b + 4) * (b + 4);
          exp = `Là các số chính phương liên tiếp từ ${b}.`;
        } else {                               // nhân 2
          seq = [2, 4, 8, 16];
          ans = 32;
          exp = 'Mỗi số nhân đôi.';
        }
        const wrong = distractors([ans - 1, ans + 1, ans + step, ans - step, ans + 10, ans - 10, ans + 2], String(ans)).map(Number);
        const opts = shuffle([String(ans), ...wrong.slice(0, 3).map(String)]);
        return {
          html: `<div style="font-size:11px;opacity:.7">CHUỖI SỐ</div>
                 <div style="font-size:28px;font-weight:800;margin-top:8px">${seq.join('  ·  ')}  ·  ?</div>
                 <div style="font-size:12px;opacity:.6;margin-top:6px">Điền số tiếp theo</div>`,
          opts, ans: String(ans), exp,
        };
      },

      compare(level) {
        const a = rnd(10, 99 * level), b = rnd(10, 99 * level);
        const who = pickOne(NAMES);
        const wantBigger = rnd(2) === 0;
        const pool = [a, b];
        const target = wantBigger ? Math.max(a, b) : Math.min(a, b);
        const ans = String(target);
        const opts = shuffle([ans, ...distractors([String(Math.max(10, target + rnd(1, 9))), String(Math.max(1, target - rnd(1, 9))), String(target + 10), String(Math.max(1, target - 10))], ans).slice(0, 3)]);
        return {
          html: `<div style="font-size:11px;opacity:.7">AI NHIỀU HƠN?</div>
                 <div style="font-size:22px;margin-top:8px">Trong <b>${pool.join(' và ')}</b>, số nào
                   ${wantBigger ? '<b>LỚN</b>' : '<b>NHỎ</b>'} hơn?</div>
                 <div style="font-size:12px;opacity:.6;margin-top:6px">Người chơi tên: ${who}</div>`,
          opts, ans,
          exp: `${target} là số ${wantBigger ? 'lớn nhất' : 'nhỏ nhất'} trong ${pool.join(' và ')}.`,
        };
      },

      riddle(level) {
        const [q, opts, ans, exp] = pickOne(RIDDLES);
        return {
          html: `<div style="font-size:11px;opacity:.7">ĐỐ VUI NHANH</div>
                 <div style="font-size:22px;margin-top:8px">${q}</div>`,
          opts: [...opts], ans, exp,
        };
      },

      shapecount(level) {
        const shape = pickOne(['🔺', '🔵', '🟨', '🟩', '🟥', '⬛', '🔶']);
        const total = rnd(5, 8 + level * 2);
        const oddAt = rnd(total);
        const noise = sample(['⭐', '❤️', '🌙', '⚡', '🎈', '🍀'].filter(s => s !== shape), 1)[0];
        const cells = shuffle(Array.from({ length: total }, (_, i) => (i === oddAt ? shape : noise)));
        const right = cells.filter(c => c === shape).length;
        const opts = shuffle([String(right), ...distractors([String(right + 1), String(right - 1), String(right + 2), String(right + 3), 1, 0].map(String), String(right)).slice(0, 3)]);
        return {
          html: `<div style="font-size:11px;opacity:.7">ĐẾM NHANH</div>
                 <div style="font-size:12px;opacity:.7;margin-top:6px">Có bao nhiêu biểu tượng
                   <b style="font-size:20px">${shape}</b>?</div>
                 <div style="font-size:26px;letter-spacing:6px;line-height:1.7;margin-top:10px">${cells.join(' ')}</div>`,
          opts, ans: String(right),
          exp: `Có <b>${right}</b> biểu tượng ${shape}.`,
        };
      },
    };

    /* ══════════════════════════════════════════════════════════════════════════
       ENGINE VÁN CHƠI — lưu tiến độ sau mỗi hành động
       ══════════════════════════════════════════════════════════════════════ */

    const LEVEL_STEP = 3;   // số câu đúng để lên màn
    const RUN_SECS = 25;    // giây cho mỗi câu
    const START_LIVES = 3;

    let run = null;

    /** Ghi tiến độ ván hiện tại xuống localStorage. */
    function persist() {
      if (!run) return;
      HP.save({
        game: run.id, name: run.def.name, icon: run.def.icon,
        level: run.level, score: run.score, correct: run.correct,
        answered: run.answered, lives: run.lives,
      });
    }

    /**
     * Bắt đầu (hoặc tiếp tục) một ván.
     *
     * KHÔNG được tin `HP.data` ở đây — nó chỉ có giá trị sau khi sảnh đã gọi
     * HP.refresh(). Nếu người chơi vào thẳng URL game (bookmark, F5, mở link
     * chia sẻ) thì HP.data còn null và tiến độ sẽ bị bỏ qua. Vì vậy luôn tự
     * đọc lại từ localStorage khi không được truyền vào.
     *
     * @param {object} def  entry trong GAMES
     * @param {object|null} saved  tiến độ đã lưu (bỏ trống = tự đọc từ đĩa)
     */
    function startRun(def, saved) {
      const data = saved && typeof saved === 'object' ? saved : HP.refresh();
      const keep = data && data.game === def.id;
      run = {
        def, id: def.id,
        level: keep ? Math.max(1, data.level || 1) : 1,
        score: keep ? (data.score || 0) : 0,
        correct: keep ? (data.correct || 0) : 0,
        answered: keep ? (data.answered || 0) : 0,
        lives: keep && Number.isFinite(data.lives) ? Math.max(1, data.lives) : START_LIVES,
        streak: 0, locked: false, cur: null, time: RUN_SECS,
        justResumed: !!keep,
      };
      persist();
      nextQuestion();
    }

    /** Màn tiếp theo (đã lưu tiến độ). */
    function nextQuestion() {
      if (!run) return;

      while (run.correct >= LEVEL_STEP) {
        run.correct -= LEVEL_STEP;
        run.level += 1;
        run.score += 25;
        sfx.win();
        toast(`🎉 Lên màn ${run.level}!`);
      }
      if (run.lives <= 0) { endRun(); return; }

      run.locked = false;
      run.time = RUN_SECS;
      run.cur = run.def.make(run.level);
      persist();
      renderQuestion();
      startTimer();
    }

    function startTimer() {
      T.int(() => {
        if (!run || run.locked) return;
        run.time -= 0.1;
        const bar = $('#tb');
        if (bar) bar.style.width = Math.max(0, (run.time / RUN_SECS) * 100) + '%';
        if (run.time <= 0) onAnswer(-1);          // hết giờ = trả lời sai
      }, 100);
    }

    /** Hien so mang: toi da 5 trai tim, vuot qua thi ghi them so du. */
    function hearts(n) {
      const v = Math.max(0, Math.floor(n) || 0);
      return "❤️".repeat(Math.min(5, v)) + (v > 5 ? ` <b>+${v - 5}</b>` : "");
    }

    function renderQuestion() {
      const c = run.cur;
      const resumed = run.justResumed;
      run.justResumed = false;

      $('#stage').innerHTML = `
        <div class="hud">
          <span>Màn <b>${run.level}</b></span>
          <span>⭐ <b>${run.score}</b></span>
          <span>💗 ${hearts(run.lives) || '—'}</span>
          <span>🔥 <b>${run.correct}/${LEVEL_STEP}</b></span>
        </div>
        <div class="tbar"><i id="tb" style="width:100%"></i></div>
        ${resumed ? `<div class="explain" style="border-left:3px solid var(--amber)">
            ▶ Đã khôi phục tiến độ từ localStorage — màn ${run.level}, ${run.score} ⭐</div>` : ''}
        <div class="qbox">${c.html}</div>
        <div class="opts" id="opts">
          ${c.opts.map((o, k) => `<button class="opt" data-k="${k}" ${c.style ? `style="${c.style[k]}"` : ''}>${o}</button>`).join('')}
        </div>
        <div id="ex"></div>
        <div class="row" id="nx"></div>`;

      $('#opts').onclick = e => {
        const b = e.target.closest('.opt');
        if (b) onAnswer(+b.dataset.k);
      };
    }

    /** Trả lời. k = -1 nghĩa là hết giờ. */
    function onAnswer(k) {
      if (!run || run.locked) return;
      run.locked = true;

      const c = run.cur;
      const btns = [...document.querySelectorAll('#opts .opt')];
      const right = k >= 0 && String(c.opts[k]) === String(c.ans);
      const ci = c.opts.findIndex(o => String(o) === String(c.ans));

      if (ci >= 0 && btns[ci]) btns[ci].classList.add('ok');
      if (right) {
        run.correct++; run.streak++;
        run.score += 10 + Math.ceil(run.time) + (run.streak >= 3 ? 5 : 0);
        S.flags.answerRight = (S.flags.answerRight || 0) + 1;
        sfx.ok();
      } else {
        run.streak = 0;
        run.lives -= 1;
        S.flags.answerWrong = (S.flags.answerWrong || 0) + 1;
        sfx.bad();
        if (k >= 0 && btns[k]) btns[k].classList.add('bad');
      }
      run.answered += 1;

      const ex = $('#ex'), nx = $('#nx');
      if (ex) ex.innerHTML = `<div class="explain">${right ? '✅ Chính xác!' : (k < 0 ? '⏰ Hết giờ!' : '❌ Chưa đúng.')} ${c.exp}</div>`;
      if (nx) {
        const over = run.lives <= 0;
        nx.innerHTML = over
          ? `<button class="btn" data-next="1">Xem kết quả</button>`
          : `<button class="btn" data-next="1">${run.correct >= LEVEL_STEP ? 'Lên màn! →' : 'Câu tiếp theo →'}</button>`;
        nx.onclick = () => { if (run) nextQuestion(); };
      }

      persist();          // ← lưu sau MỖI câu
    }

    function endRun() {
      if (!run) return;
      const snap = run;
      run = null;
      HP.clear();          // hết ván → không cần giữ tiến độ dang dở
      sfx.win();
      finish({
        id: snap.id,
        score: snap.score,
        xp: snap.answered * 5,
        lines: [`Màn cao nhất: ${snap.level}`, `Câu đúng: ${snap.correct}`, `Đã trả lời: ${snap.answered} câu`],
        replay: false,
        details: { level: snap.level, answered: snap.answered },
      });
    }

    /* ══════════════════════════════════════════════════════════════════════════
       BẢNG TIẾN ĐỘ TRÊN SẢNH
       ══════════════════════════════════════════════════════════════════════ */

    function progressPanel() {
      const d = HP.refresh();
      const hub = $('#hub');
      if (!hub) return;

      if (d) {
        const g = _GAMES.find(x => x.id === d.game);
        const box = document.createElement('div');
        box.className = 'panel';
        box.style.cssText = 'max-width:680px;margin:0 auto 16px;text-align:left;border-left:4px solid var(--amber)';
        box.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div style="font-size:28px">${d.icon || g?.icon || '💾'}</div>
            <div style="flex:1;min-width:180px">
              <div style="font-size:11px;opacity:.7;letter-spacing:.5px">TIẾN ĐỘ ĐANG LƯU TRONG LOCALSTORAGE</div>
              <div style="font-size:17px;font-weight:800;margin-top:2px">${d.name || g?.name || 'Ván đang chơi'}</div>
              <div style="font-size:13px;opacity:.85;margin-top:3px">
                Màn <b>${d.level || 1}</b> · ⭐ <b>${d.score || 0}</b> ·
                💗 ${hearts(d.lives ?? START_LIVES)} ·
                <span style="opacity:.7">lưu ${HP.ago()}</span>
              </div>
            </div>
            <div class="row" style="margin:0">
              <button class="btn" data-resume>▶ Tiếp tục</button>
              <button class="btn alt ghost" data-check>🔍 Kiểm tra</button>
              <button class="btn alt ghost" data-clear>🗑 Xoá</button>
            </div>
          </div>`;
        box.querySelector('[data-resume]').onclick = () => openGame(d.game);
        box.querySelector('[data-check]').onclick = () => {
          const again = HP.refresh();
          if (!again) { toast('🗑 Không còn tiến độ nào được lưu'); }
          else toast(`🔍 localStorage["${PROGRESS_KEY}"] → màn ${again.level}, ${again.score} ⭐`);
          renderHub();
        };
        box.querySelector('[data-clear]').onclick = () => {
          HP.clear();
          toast('🗑 Đã xoá tiến độ');
          renderHub();
        };
        hub.prepend(box);
      } else {
        const box = document.createElement('div');
        box.className = 'panel';
        box.style.cssText = 'max-width:680px;margin:0 auto 16px;text-align:center;opacity:.85';
        box.innerHTML = `<div style="font-size:13px">
            💾 Chưa có tiến độ lưu. Mọi câu trả lời sẽ tự động lưu vào
            <code style="font-size:12px;background:#000;padding:2px 6px;border-radius:6px">${PROGRESS_KEY}</code>
            — đóng tab rồi mở lại vẫn chơi tiếp được.
          </div>`;
        hub.append(box);
      }
    }

    // Bọc renderHub của game-core để chèn bảng tiến độ sau mỗi lần vẽ sảnh
    const _renderHub = renderHub;
    renderHub = function () { _renderHub(); progressPanel(); };

    // Lưu nốt khi người chơi đóng tab / đổi trang
    window.addEventListener('beforeunload', () => { if (run) persist(); });
    window.addEventListener('pagehide', () => { if (run) persist(); });

    /* ══════════════════════════════════════════════════════════════════════════
       DANH SÁCH GAME + KHỞI ĐỘNG
       ══════════════════════════════════════════════════════════════════════ */

    const GAMES = [
      { id: 'anagram', name: 'Đảo Chữ Nhí', tag: 'Tiếng Anh', c: 'var(--amber)', icon: '🧩', desc: 'Chữ bị xáo trộn, nghĩa cho sẵn. Xếp lại từ tiếng Anh đúng nghĩa.', make: MAKERS.anagram, fn: () => startRun(GAMES[0], HP.data) },
      { id: 'stroop', name: 'Đuổi Màu', tag: 'Tập trung', c: 'var(--violet)', icon: '🎨', desc: 'Câu lệnh nói một màu, hãy chọn đúng ô mang màu đó chứ không phải màu chữ.', make: MAKERS.stroop, fn: () => startRun(GAMES[1], HP.data) },
      { id: 'sumseq', name: 'Chuỗi Số', tag: 'Toán', c: 'var(--sky)', icon: '➕', desc: 'Điền số tiếp theo: cộng đều, giảm đều, chính phương hay nhân đôi.', make: MAKERS.sumseq, fn: () => startRun(GAMES[2], HP.data) },
      { id: 'compare', name: 'Ai Nhiều Hơn?', tag: 'So sánh', c: 'var(--lime)', icon: '⚖️', desc: 'Trong hai số hãy chọn số lớn nhất hoặc nhỏ nhất. Càng lên màn số càng to.', make: MAKERS.compare, fn: () => startRun(GAMES[3], HP.data) },
      { id: 'riddle', name: 'Đố Vui Nhanh', tag: 'Kiến thức', c: 'var(--coral)', icon: '💡', desc: 'Câu đố vui đầu tiên nghĩ ra là đáp án.', make: MAKERS.riddle, fn: () => startRun(GAMES[4], HP.data) },
      { id: 'shapecount', name: 'Đếm Nhanh', tag: 'Tập trung', c: '#ff9de2', icon: '🔷', desc: 'Lưới biểu tượng lẫn lộn nhiều loại. Đếm đúng số lượng cần tìm.', make: MAKERS.shapecount, fn: () => startRun(GAMES[5], HP.data) },
    ];

    initCore({
      games: GAMES,
      storageKey: 'hmc_game4',
      hubTitle: 'Tiến độ lưu ngay trên máy.',
      hubDesc: 'Sáu thử thách Toán · Tiếng Anh · Tập trung. Tiến độ tự lưu vào localStorage — đóng tab rồi mở lại vẫn chơi tiếp đúng chỗ.',
      badges: [
        { id: 'first', n: 'Khởi động', i: '🌱', ok: () => S.games >= 1 },
        { id: 'all', n: 'Thử đủ 6 game', i: '🧭', ok: () => S.played.size >= 6 },
        { id: 'right10', n: 'Đúng 10 câu', i: '✅', ok: () => (S.flags.answerRight || 0) >= 10 },
        { id: 'lv3', n: 'Đạt cấp 3', i: '⭐', ok: () => lvl() >= 3 },
        { id: 'lv5', n: 'Đạt cấp 5', i: '🌟', ok: () => lvl() >= 5 },
        { id: 'flawless', n: 'Một mạng thôi', i: '💎', ok: () => (S.flags.answerWrong || 0) === 0 && (S.flags.answerRight || 0) >= 5 },
        { id: 'comeback', n: 'Quay lại sau khi hết mạng', i: '🔁', ok: () => (S.flags.answerWrong || 0) > 0 && (S.flags.answerRight || 0) > (S.flags.answerWrong || 0) },
      ],
    });

    /* Tiện ích nhỏ: bảng điều khiển tiến độ (nhấn phím P hoặc gõ trong console) */
    window.HP = HP;
    window.HP.info = () => {
      const d = HP.refresh();
      console.log('%cTiến độ offline', 'font-weight:bold', d || '(chưa có)');
      console.table([d || { game: '—', level: 0, score: 0, answered: 0, lives: 0 }]);
      return d;
    };
    onKey = e => {
      if (e.key === 'p' || e.key === 'P') { e.preventDefault(); window.HP.info(); }
    };
    </script>
</body>
</html>
