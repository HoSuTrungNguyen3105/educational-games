<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Master</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --paper: #FBF7EE;
    --ink: #20283A;
    --card: #FFFFFF;
    --line: #E7D9BE;
    --teal: #1B998B;
    --orange: #E4572E;
    --yellow: #F4B942;
    --ticket: #E4572E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .font-display { font-family: 'Poppins', sans-serif; }
  .font-body { font-family: 'Nunito', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .bg-paper { background: var(--paper); }
  .text-ink { color: var(--ink); }

  .note-card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 4px 0 var(--line), 0 8px 24px rgba(32,40,58,0.06);
  }

  .dash-rule { border-top: 2px dashed var(--line); }

  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .anim-pop { animation: pop 0.25s ease-out; }

  @keyframes clearFlash {
    0% { background: rgba(244,185,66,0.8); transform: scale(1); }
    50% { background: rgba(244,185,66,0.3); transform: scale(0.9); }
    100% { background: rgba(244,185,66,0); transform: scale(0); opacity: 0; }
  }
  .anim-clear { animation: clearFlash 0.35s ease-out forwards; }

  @keyframes scoreFloat {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-50px) scale(1.4); opacity: 0; }
  }
  .score-popup {
    position: absolute;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    color: var(--yellow);
    text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    pointer-events: none;
    animation: scoreFloat 0.9s ease-out forwards;
    z-index: 10;
    white-space: nowrap;
  }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .hidden { display: none !important; }

  button { font-family: inherit; cursor: pointer; }

  .menu-btn {
    width: 100%;
    padding: 1rem;
    border-radius: 16px;
    font-size: 1.125rem;
    font-weight: 700;
    border: 2px solid;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
    background: none;
  }
  .menu-btn:hover { box-shadow: 0 6px 16px rgba(32,40,58,0.12); }
  .menu-btn:active { transform: scale(0.97); }

  .back-link {
    margin-top: 1.5rem;
    background: none;
    border: none;
    font-size: 0.875rem;
    color: rgba(32,40,58,0.5);
    font-family: 'Poppins', sans-serif;
  }
  .back-link:hover { color: var(--ink); }

  header.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.6rem 0.75rem;
    background: white;
    border-bottom: 1px solid rgba(32,40,58,0.1);
    flex-wrap: wrap;
  }

  .header-info {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .header-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(32,40,58,0.55);
    display: flex;
    align-items: center;
    gap: 0.2rem;
  }
  .header-stat .val { font-size: 0.95rem; font-weight: 700; }

  .header-btn {
    font-family: 'Poppins', sans-serif;
    font-size: 0.8rem;
    border-radius: 12px;
    padding: 0.35rem 0.7rem;
    border: 1px solid;
    background: none;
    transition: background 0.15s ease;
  }
  .pause-btn { color: var(--teal); border-color: rgba(27,153,139,0.4); }
  .pause-btn:hover { background: rgba(27,153,139,0.06); }
  .quit-btn { color: var(--ticket); border-color: rgba(228,87,46,0.4); }
  .quit-btn:hover { background: rgba(228,87,46,0.06); }

  .game-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.4rem 0.5rem 0.6rem;
    gap: 0.5rem;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: min(90vw, 380px);
    height: min(90vw, 380px);
    background: #EDE5D4;
    border: 2px solid var(--line);
    border-radius: 8px;
    gap: 1px;
    padding: 1px;
    position: relative;
  }

  .cell {
    width: 100%;
    height: 100%;
    border-radius: 3px;
    background: #FFFBF2;
    border: none;
    padding: 0;
    margin: 0;
    transition: background 0.12s ease;
    position: relative;
    outline: 1px solid rgba(231,217,190,0.3);
  }

  .cell.highlight {
    background: rgba(27, 153, 139, 0.3) !important;
  }
  .cell.invalid-highlight {
    background: rgba(228, 87, 46, 0.3) !important;
  }

  .tray {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 0.5rem 0.75rem;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 4px 0 var(--line), 0 8px 24px rgba(32,40,58,0.06);
    width: min(90vw, 380px);
    min-height: 90px;
  }

  .tray-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid transparent;
    min-width: 70px;
    min-height: 70px;
  }
  .tray-slot.empty { opacity: 0.15; pointer-events: none; }
  .tray-slot.selected {
    border-color: var(--teal);
    background: rgba(27, 153, 139, 0.1);
    box-shadow: 0 0 0 3px rgba(27, 153, 139, 0.2);
  }
  .tray-slot:not(.empty):hover {
    background: rgba(27, 153, 139, 0.05);
  }

  .tray-block {
    display: grid;
    gap: 1px;
  }

  .tray-cell {
    width: 13px;
    height: 13px;
    border-radius: 2px;
  }
  .tray-cell.empty { background: transparent; }

  .guide-text {
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    color: rgba(32, 40, 58, 0.4);
    text-align: center;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 40, 58, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
    backdrop-filter: blur(4px);
  }

  .overlay-card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 4px 0 var(--line), 0 8px 24px rgba(32,40,58,0.06);
    padding: 2.5rem;
    max-width: 28rem;
    width: 100%;
    text-align: center;
  }

  .stat-block { text-align: center; }
  .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; }
  .stat-label { font-family: 'Nunito', sans-serif; font-size: 0.75rem; color: rgba(32,40,58,0.5); }

  @media (max-height: 650px) {
    .board { width: min(85vw, 320px); height: min(85vw, 320px); }
    .tray { min-height: 75px; }
    .game-area { gap: 0.3rem; padding: 0.2rem 0.5rem 0.4rem; }
    .tray-cell { width: 11px; height: 11px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  /* ========== SHAPES ========== */
  var SHAPES = [
    { cells: [[0,0]],                         color: '#1B998B' },
    { cells: [[0,0],[0,1]],                   color: '#1B998B' },
    { cells: [[0,0],[1,0]],                   color: '#1B998B' },
    { cells: [[0,0],[0,1],[0,2]],             color: '#2ECC71' },
    { cells: [[0,0],[1,0],[2,0]],             color: '#2ECC71' },
    { cells: [[0,0],[0,1],[0,2],[0,3]],       color: '#27AE60' },
    { cells: [[0,0],[1,0],[2,0],[3,0]],       color: '#27AE60' },
    { cells: [[0,0],[0,1],[1,0],[1,1]],       color: '#E4572E' },
    { cells: [[0,0],[1,0],[1,1]],             color: '#F4B942' },
    { cells: [[0,1],[1,0],[1,1]],             color: '#F4B942' },
    { cells: [[0,0],[0,1],[1,1]],             color: '#F4B942' },
    { cells: [[0,0],[0,1],[1,0]],             color: '#F4B942' },
    { cells: [[0,0],[0,1],[0,2],[1,1]],       color: '#E4572E' },
    { cells: [[1,0],[1,1],[1,2],[0,1]],       color: '#E4572E' },
    { cells: [[0,0],[1,0],[2,0],[1,1]],       color: '#E4572E' },
    { cells: [[0,1],[1,0],[1,1],[2,1]],       color: '#E4572E' },
    { cells: [[0,0],[1,0],[2,0],[2,1]],       color: '#9B59B6' },
    { cells: [[0,1],[1,1],[2,0],[2,1]],       color: '#9B59B6' },
    { cells: [[0,0],[0,1],[1,1],[2,1]],       color: '#9B59B6' },
    { cells: [[0,0],[0,1],[1,0],[2,0]],       color: '#9B59B6' },
    { cells: [[0,0],[0,1],[0,2],[1,0],[1,2]], color: '#3498DB' },
    { cells: [[0,0],[1,0],[1,1],[1,2],[2,0]], color: '#3498DB' },
    { cells: [[0,1],[1,0],[1,1],[1,2],[2,1]], color: '#E4572E' },
  ];

  function randomShape() {
    var s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    return { cells: s.cells.map(function(c){ return [c[0], c[1]]; }), color: s.color };
  }

  /* ========== BOARD ========== */
  var ROWS = 10, COLS = 10;

  function createBoard() {
    var b = [];
    for (var r = 0; r < ROWS; r++) {
      b[r] = [];
      for (var c = 0; c < COLS; c++) b[r][c] = null;
    }
    return b;
  }

  function canPlace(board, shape, ar, ac) {
    for (var i = 0; i < shape.cells.length; i++) {
      var r = ar + shape.cells[i][0], c = ac + shape.cells[i][1];
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      if (board[r][c] !== null) return false;
    }
    return true;
  }

  function placeBlock(board, shape, ar, ac) {
    for (var i = 0; i < shape.cells.length; i++) {
      board[ar + shape.cells[i][0]][ac + shape.cells[i][1]] = shape.color;
    }
  }

  function findFullLines(board) {
    var rows = [], cols = [];
    for (var r = 0; r < ROWS; r++) {
      var full = true;
      for (var c = 0; c < COLS; c++) { if (!board[r][c]) { full = false; break; } }
      if (full) rows.push(r);
    }
    for (var c = 0; c < COLS; c++) {
      var full2 = true;
      for (var r = 0; r < ROWS; r++) { if (!board[r][c]) { full2 = false; break; } }
      if (full2) cols.push(c);
    }
    return { rows: rows, cols: cols };
  }

  function clearLines(board, lines) {
    for (var i = 0; i < lines.rows.length; i++)
      for (var c = 0; c < COLS; c++) board[lines.rows[i]][c] = null;
    for (var i = 0; i < lines.cols.length; i++)
      for (var r = 0; r < ROWS; r++) board[r][lines.cols[i]] = null;
  }

  function canAnyFit(board, tray) {
    for (var t = 0; t < tray.length; t++) {
      if (!tray[t]) continue;
      for (var r = 0; r < ROWS; r++)
        for (var c = 0; c < COLS; c++)
          if (canPlace(board, tray[t], r, c)) return true;
    }
    return false;
  }

  /* ========== STATE ========== */
  var state = {
    screen: 'menu',
    board: createBoard(),
    tray: [null, null, null],
    selectedSlot: -1,
    score: 0,
    combo: 0,
    paused: false,
    gameOver: false,
    gameStartTime: 0,
    timeUsed: 0,
    bestScore: 0,
    playerName: '',
    gameId: '',
    totalLinesCleared: 0,
    clearing: false,
  };

  function loadBest() {
    try { var v = localStorage.getItem('block-master-best'); state.bestScore = v ? parseInt(v, 10) || 0 : 0; } catch(e) {}
  }
  function saveBest() {
    try { if (state.score > state.bestScore) { state.bestScore = state.score; localStorage.setItem('block-master-best', '' + state.score); } } catch(e) {}
  }

  function generateTray() {
    state.tray = [randomShape(), randomShape(), randomShape()];
  }
  function refillTray() {
    for (var i = 0; i < 3; i++) if (!state.tray[i]) state.tray[i] = randomShape();
  }

  function checkGameOver() {
    for (var t = 0; t < 3; t++) {
      if (!state.tray[t]) continue;
      for (var r = 0; r < ROWS; r++)
        for (var c = 0; c < COLS; c++)
          if (canPlace(state.board, state.tray[t], r, c)) return false;
    }
    return true;
  }

  /* ========== RENDERING ========== */
  var root = document.getElementById('root');

  function render() {
    if (state.screen === 'menu') return renderStart();
    if (state.screen === 'gameover') return renderGameOver();
    return renderGame();
  }

  /* --- START SCREEN --- */
  function renderStart() {
    root.innerHTML =
      '<div class="screen bg-paper">' +
        '<div class="anim-pop note-card" style="padding:2.5rem; max-width:28rem; width:100%; text-align:center;">' +
          '<div style="font-size:3.5rem; margin-bottom:0.75rem;">🧱</div>' +
          '<h1 class="font-display" style="font-size:2rem; margin:0 0 0.25rem;">' +
            '<span style="color:#1B998B">BLOCK</span> <span style="color:#E4572E">MASTER</span>' +
          '</h1>' +
          '<p class="font-body" style="color:rgba(32,40,58,0.55); margin-bottom:0.35rem;">Siêu Puzzle — Thử thách tư duy!</p>' +
          '<div class="font-mono" style="font-size:0.85rem; color:rgba(32,40,58,0.4); margin-bottom:1.75rem;">🏆 Kỷ lục: ' + state.bestScore + '</div>' +
          '<div style="display:flex; flex-direction:column; gap:0.75rem;">' +
            '<button id="btn-play" class="menu-btn font-display" style="border-color:#1B998B; color:white; background:#1B998B;">▶ CHƠI NGAY</button>' +
            '<button id="btn-help" class="menu-btn font-display" style="border-color:#E4572E; color:#E4572E; background:#E4572E10;">📖 HƯỚNG DẪN</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('btn-play').onclick = startGame;
    document.getElementById('btn-help').onclick = showHelp;
  }

  function showHelp() {
    var ov = document.createElement('div');
    ov.className = 'overlay anim-pop';
    ov.innerHTML =
      '<div class="overlay-card">' +
        '<div style="font-size:2.5rem; margin-bottom:0.75rem;">📖</div>' +
        '<h2 class="font-display" style="font-size:1.5rem; margin:0 0 1rem; color:#1B998B;">HƯỚNG DẪN</h2>' +
        '<div style="text-align:left; font-size:0.9rem; line-height:1.8; color:rgba(32,40,58,0.75);">' +
          '<p>🧱 <strong>Chọn block</strong> từ khay bên dưới, rồi <strong>nhấp ô</strong> trên lưới để đặt.</p>' +
          '<p>📏 <strong>Xóa dòng/cột:</strong> Hàng hoặc cột đầy sẽ biến mất, nhận điểm!</p>' +
          '<p>🔥 <strong>Combo:</strong> Xóa liên tiếp → nhân điểm x2, x3, x4!</p>' +
          '<p>⭐ <strong>Điểm:</strong> 100/đường + bonus 50/đường thừa + nhân combo.</p>' +
          '<p>🚫 <strong>Game Over:</strong> Khi cả 3 block đều không đặt được.</p>' +
          '<p>⏸️ Nhấn <strong>TẠM DỪNG</strong> để nghỉ ngơi bất cứ lúc nào.</p>' +
        '</div>' +
        '<button id="btn-close-help" class="menu-btn font-display" style="border-color:#1B998B; color:#1B998B; background:#1B998B10; margin-top:1rem;">ĐÃ HIỂU</button>' +
      '</div>';
    document.body.appendChild(ov);
    document.getElementById('btn-close-help').onclick = function(){ ov.remove(); };
    ov.onclick = function(e){ if (e.target === ov) ov.remove(); };
  }

  function startGame() {
    state.screen = 'playing';
    state.board = createBoard();
    state.selectedSlot = -1;
    state.score = 0;
    state.combo = 0;
    state.paused = false;
    state.gameOver = false;
    state.gameStartTime = Date.now();
    state.timeUsed = 0;
    state.totalLinesCleared = 0;
    state.clearing = false;
    generateTray();
    render();
  }

  /* --- GAME SCREEN --- */
  function renderGame() {
    var cellsHtml = '';
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var color = state.board[r][c];
        cellsHtml += '<button class="cell" data-r="' + r + '" data-c="' + c + '"' +
          ' style="background:' + (color || '#FFFBF2') + ';"></button>';
      }
    }

    var trayHtml = '';
    for (var i = 0; i < 3; i++) {
      var cls = 'tray-slot' + (!state.tray[i] ? ' empty' : '') + (state.selectedSlot === i ? ' selected' : '');
      var inner = '';
      if (state.tray[i]) {
        var s = state.tray[i];
        var maxR = 0, maxC = 0;
        for (var j = 0; j < s.cells.length; j++) {
          if (s.cells[j][0] > maxR) maxR = s.cells[j][0];
          if (s.cells[j][1] > maxC) maxC = s.cells[j][1];
        }
        inner = '<div class="tray-block" style="grid-template-columns:repeat(' + (maxC+1) + ',13px);">';
        for (var rr = 0; rr <= maxR; rr++) {
          for (var cc = 0; cc <= maxC; cc++) {
            var found = false;
            for (var jj = 0; jj < s.cells.length; jj++) {
              if (s.cells[jj][0]===rr && s.cells[jj][1]===cc) { found=true; break; }
            }
            inner += '<div class="tray-cell' + (found?'':' empty') + '"' +
              (found ? ' style="background:'+s.color+'"' : '') + '></div>';
          }
        }
        inner += '</div>';
      }
      trayHtml += '<div class="' + cls + '" data-slot="' + i + '">' + inner + '</div>';
    }

    var elapsed = state.paused ? state.timeUsed : Math.floor((Date.now() - state.gameStartTime) / 1000);
    var mm = Math.floor(elapsed/60), ss = elapsed%60;
    var timeStr = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;

    root.innerHTML =
      '<div class="bg-paper" style="flex:1; display:flex; flex-direction:column;">' +
        '<header class="app-header">' +
          '<div style="display:flex;align-items:center;gap:0.5rem;">' +
            '<span style="font-size:1.4rem;">🧱</span>' +
            '<h1 class="font-display" style="font-size:1rem;color:#1B998B;margin:0;">BLOCK MASTER</h1>' +
          '</div>' +
          '<div class="header-info">' +
            '<div class="header-stat"><span>⭐</span><span class="val" id="hd-score" style="color:#E4572E;">'+state.score+'</span></div>' +
            '<div class="header-stat"><span>⏱️</span><span class="val" id="hd-time" style="color:#1B998B;">'+timeStr+'</span></div>' +
            '<div class="header-stat"><span>🔥</span><span class="val" id="hd-combo" style="color:#F4B942;">'+(state.combo>0?'x'+state.combo:'-')+'</span></div>' +
          '</div>' +
          '<div style="display:flex;gap:0.4rem;">' +
            '<button id="btn-pause" class="header-btn pause-btn">⏸ TẠM DỪNG</button>' +
            '<button id="btn-quit-game" class="header-btn quit-btn">✕</button>' +
          '</div>' +
        '</header>' +
        '<div class="game-area">' +
          '<div class="board" id="board">'+cellsHtml+'</div>' +
          '<div class="guide-text" id="guide">'+(state.selectedSlot>=0?'Nhấp ô trên lưới để đặt block':'Chọn block bên dưới rồi đặt lên lưới')+'</div>' +
          '<div class="tray" id="tray">'+trayHtml+'</div>' +
        '</div>' +
      '</div>';

    bindEvents();
    if (state.paused) showPause();
  }

  function bindEvents() {
    var cells = document.querySelectorAll('.cell');
    cells.forEach(function(cell) {
      cell.addEventListener('click', onCellClick);
    });

    document.querySelectorAll('.tray-slot').forEach(function(slot) {
      slot.addEventListener('click', function() {
        if (state.clearing || state.paused || state.gameOver) return;
        var idx = parseInt(slot.dataset.slot, 10);
        if (!state.tray[idx]) return;
        state.selectedSlot = state.selectedSlot === idx ? -1 : idx;
        updateGuide();
        document.querySelectorAll('.tray-slot').forEach(function(s, si) {
          s.classList.toggle('selected', si === state.selectedSlot);
        });
      });
    });

    document.getElementById('btn-pause').onclick = function() {
      if (state.clearing) return;
      state.timeUsed = Math.floor((Date.now() - state.gameStartTime) / 1000);
      state.paused = true;
      render();
    };
    document.getElementById('btn-quit-game').onclick = function() {
      sendQuit();
      state.screen = 'menu';
      render();
    };
  }

  function updateGuide() {
    var el = document.getElementById('guide');
    if (el) el.textContent = state.selectedSlot >= 0 ? 'Nhấp ô trên lưới để đặt block' : 'Chọn block bên dưới rồi đặt lên lưới';
  }

  function onCellClick(e) {
    if (state.clearing || state.paused || state.gameOver) return;
    var r = parseInt(e.currentTarget.dataset.r, 10);
    var c = parseInt(e.currentTarget.dataset.c, 10);
    if (state.selectedSlot < 0 || !state.tray[state.selectedSlot]) return;

    var shape = state.tray[state.selectedSlot];
    if (!canPlace(state.board, shape, r, c)) {
      flashInvalid(r, c, shape);
      return;
    }

    placeBlock(state.board, shape, r, c);
    state.tray[state.selectedSlot] = null;
    state.selectedSlot = -1;

    var lines = findFullLines(state.board);
    var total = lines.rows.length + lines.cols.length;

    if (total > 0) {
      state.combo++;
      var pts = 0;
      for (var i = 0; i < total; i++) { pts += 100; if (i > 0) pts += 50; }
      pts *= Math.min(state.combo, 4);
      state.score += pts;
      state.totalLinesCleared += total;

      highlightAndClear(lines, total, pts, r, c);
    } else {
      state.combo = 0;
      afterPlace();
    }
  }

  function highlightAndClear(lines, total, pts, r, c) {
    state.clearing = true;
    showScorePopup(r, c, '+' + pts);
    updateHeader();

    var cells = document.querySelectorAll('.cell');
    lines.rows.forEach(function(row) {
      for (var col = 0; col < COLS; col++) cells[row * COLS + col].classList.add('anim-clear');
    });
    lines.cols.forEach(function(col) {
      for (var row = 0; row < ROWS; row++) cells[row * COLS + col].classList.add('anim-clear');
    });

    setTimeout(function() {
      clearLines(state.board, lines);
      state.clearing = false;
      afterPlace();
    }, 380);
  }

  function afterPlace() {
    refillTray();
    if (checkGameOver()) {
      endGame();
      return;
    }
    render();
  }

  function flashInvalid(r, c, shape) {
    var cells = document.querySelectorAll('.cell');
    shape.cells.forEach(function(d) {
      var cr = r + d[0], cc = c + d[1];
      if (cr >= 0 && cr < ROWS && cc >= 0 && cc < COLS) {
        var cell = cells[cr * COLS + cc];
        cell.classList.add('invalid-highlight');
        setTimeout(function(){ cell.classList.remove('invalid-highlight'); }, 400);
      }
    });
  }

  function showScorePopup(r, c, text) {
    var boardEl = document.getElementById('board');
    if (!boardEl) return;
    var bw = boardEl.offsetWidth, bh = boardEl.offsetHeight;
    var cw = bw / COLS, ch = bh / ROWS;
    var popup = document.createElement('div');
    popup.className = 'score-popup';
    popup.textContent = text;
    popup.style.left = (c * cw + cw / 2 - 20) + 'px';
    popup.style.top = (r * ch + ch / 2 - 10) + 'px';
    boardEl.appendChild(popup);
    setTimeout(function(){ popup.remove(); }, 900);
  }

  function updateHeader() {
    var se = document.getElementById('hd-score');
    if (se) se.textContent = state.score;
    var sc = document.getElementById('hd-combo');
    if (sc) sc.textContent = state.combo > 0 ? 'x' + Math.min(state.combo, 4) : '-';
  }

  /* --- PAUSE OVERLAY --- */
  function showPause() {
    var ov = document.createElement('div');
    ov.className = 'overlay anim-pop';
    ov.id = 'pause-overlay';
    ov.innerHTML =
      '<div class="overlay-card">' +
        '<div style="font-size:2.5rem; margin-bottom:0.75rem;">⏸️</div>' +
        '<h2 class="font-display" style="font-size:1.5rem; margin:0 0 0.5rem; color:#F4B942;">TẠM DỪNG</h2>' +
        '<p class="font-body" style="color:rgba(32,40,58,0.6); margin-bottom:1.5rem;">Điểm: <strong style="color:#E4572E;">' + state.score + '</strong></p>' +
        '<div style="display:flex; flex-direction:column; gap:0.75rem;">' +
          '<button id="btn-resume" class="menu-btn font-display" style="border-color:#1B998B; color:white; background:#1B998B;">▶ TIẾP TỤC</button>' +
          '<button id="btn-restart-p" class="menu-btn font-display" style="border-color:#F4B942; color:#F4B942; background:#F4B94210;">🔄 CHƠI LẠI</button>' +
          '<button id="btn-quit-p" class="menu-btn font-display" style="border-color:#E4572E; color:#E4572E; background:#E4572E10;">🚪 THOÁT</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    document.getElementById('btn-resume').onclick = function() {
      ov.remove();
      state.paused = false;
      state.gameStartTime = Date.now() - state.timeUsed * 1000;
      render();
    };
    document.getElementById('btn-restart-p').onclick = function() { ov.remove(); startGame(); };
    document.getElementById('btn-quit-p').onclick = function() { ov.remove(); sendQuit(); state.screen = 'menu'; render(); };
  }

  /* --- GAME OVER --- */
  function endGame() {
    state.gameOver = true;
    state.timeUsed = Math.floor((Date.now() - state.gameStartTime) / 1000);
    saveBest();
    sendGameOver();
    state.screen = 'gameover';
    render();
  }

  function renderGameOver() {
    var isNew = state.score > 0 && state.score >= state.bestScore;
    var mm = Math.floor(state.timeUsed/60), ss = state.timeUsed%60;
    root.innerHTML =
      '<div class="screen bg-paper">' +
        '<div class="anim-pop note-card" style="padding:2.5rem; max-width:28rem; width:100%; text-align:center;">' +
          '<div style="font-size:3.5rem; margin-bottom:0.75rem;">' + (isNew ? '🏆' : '💥') + '</div>' +
          '<h2 class="font-display" style="font-size:1.75rem; margin:0 0 0.5rem; color:#E4572E;">GAME OVER</h2>' +
          '<p class="font-body" style="color:rgba(32,40,58,0.6); margin-bottom:1.5rem;">' +
            (isNew ? '🎉 Kỷ lục mới!' : 'Thử lại nhé!') +
          '</p>' +
          '<div class="dash-rule" style="padding-top:1.25rem; margin-bottom:1.25rem;">' +
            '<div style="display:flex; justify-content:center; gap:2rem;">' +
              '<div class="stat-block"><div class="stat-num" style="color:#E4572E;">' + state.score + '</div><div class="stat-label">Điểm</div></div>' +
              '<div class="stat-block"><div class="stat-num" style="color:#F4B942;">' + state.bestScore + '</div><div class="stat-label">Kỷ lục</div></div>' +
              '<div class="stat-block"><div class="stat-num" style="color:#1B998B;">' + (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss + '</div><div class="stat-label">Thời gian</div></div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex; flex-direction:column; gap:0.75rem;">' +
            '<button id="btn-restart" class="menu-btn font-display" style="border-color:#1B998B; color:white; background:#1B998B;">🔄 CHƠI LẠI</button>' +
            '<button id="btn-quit-go" class="menu-btn font-display" style="border-color:#E4572E; color:#E4572E; background:#E4572E10;">🚪 THOÁT</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('btn-restart').onclick = startGame;
    document.getElementById('btn-quit-go').onclick = function() { sendQuit(); state.screen = 'menu'; render(); };
  }

  /* --- TIMER TICK --- */
  function tickTimer() {
    if (state.screen === 'playing' && !state.paused && !state.gameOver) {
      var el = document.getElementById('hd-time');
      if (el) {
        var s = Math.floor((Date.now() - state.gameStartTime) / 1000);
        var m = Math.floor(s/60), ss = s%60;
        el.textContent = (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
      }
    }
    requestAnimationFrame(tickTimer);
  }

  /* ========== POST MESSAGE ========== */
  window.addEventListener('message', function(ev) {
    try {
      var msg = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
      if (msg && msg.type === 'init' && msg.data) {
        state.gameId = msg.data.gameId || '';
        state.playerName = msg.data.playerName || '';
      }
    } catch(e) {}
  });

  function sendGameOver() {
    try {
      window.parent.postMessage({ type: 'game-over', data: { score: state.score, timeUsed: state.timeUsed } }, '*');
    } catch(e) {}
  }
  function sendQuit() {
    try { window.parent.postMessage({ type: 'quit' }, '*'); } catch(e) {}
  }

  /* ========== INIT ========== */
  loadBest();
  render();
  requestAnimationFrame(tickTimer);

})();
</script>
</body>
</html>
