<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Làng Nhỏ Của Tôi · FPS Di Động</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0a0d09;
            --panel: #161c14;
            --panel2: #1f271c;
            --line: rgba(255, 255, 255, .09);
            --ink: #eef1e6;
            --ink-dim: #9aa48f;
            --accent: #e8a33d;
            --accent-dark: #b97b22;
            --ok: #7fd858;
            --ok-dark: #4f9a34;
            --danger: #e14b4b;
            --danger-dark: #a52f2f;
            --gold: #f2c14e;
            --hud-bg: rgba(9, 12, 8, .74);
            --radius: 14px;
            --radius-sm: 9px;
            --dpad-size: 52px;
        }
        html,
        body {
            height: 100%;
            background: #000;
            color: var(--ink);
            font-family: 'Segoe UI', 'Nunito', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #root {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            touch-action: manipulation;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden {
            display: none !important;
        }
        .font-mono {
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
        }

        /* ============ FPS SCREEN ============ */
        .fps-screen {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #000;
        }
        .scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: crosshair;
        }
        .sky {
            position: absolute;
            inset: 0 0 46% 0;
            transition: background 0.4s ease;
        }
        .sky::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--fog, rgba(255, 255, 255, .06));
            pointer-events: none;
        }
        .sun {
            position: absolute;
            top: 8%;
            left: 20%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 244, 200, .95), rgba(255, 220, 140, .15) 70%, transparent 100%);
            filter: blur(1px);
            pointer-events: none;
        }
        .ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 46%;
            overflow: hidden;
            transition: background 0.4s ease;
        }
        .ground::before {
            content: '';
            position: absolute;
            left: -60%;
            right: -60%;
            top: -10%;
            bottom: 0;
            background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .10) 0 2px, transparent 2px 9%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 12%);
            transform: perspective(280px) rotateX(58deg);
            transform-origin: bottom;
            pointer-events: none;
        }
        .ground::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, .35) 100%);
            pointer-events: none;
        }
        .horizon-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 54%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent);
            z-index: 1;
            pointer-events: none;
            transition: bottom 0.2s ease;
        }
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            box-shadow: inset 0 0 18vw 4vw rgba(0, 0, 0, .55);
        }
        .scene.shake {
            animation: screenShake .18s ease;
        }
        @keyframes screenShake {
            0%,
            100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(-5px, 3px);
            }
            50% {
                transform: translate(5px, -3px);
            }
            75% {
                transform: translate(-3px, -2px);
            }
        }

        /* ============ WORLD SPRITES ============ */
        .decor-item {
            position: absolute;
            transform: translate(-50%, -100%) scale(var(--depth, 1));
            transform-origin: bottom center;
            pointer-events: none;
            z-index: 2;
            filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .4));
            font-size: 2.6rem;
            line-height: 1;
            transition: left .25s ease, top .25s ease;
            opacity: .92;
        }
        .hotspot {
            position: absolute;
            transform: translate(-50%, -100%) scale(var(--depth, 1));
            transform-origin: bottom center;
            z-index: 5;
            cursor: pointer;
            transition: left .25s ease, top .25s ease, filter .2s;
            touch-action: manipulation;
        }
        .hotspot .hs-shadow {
            position: absolute;
            left: 50%;
            bottom: -4px;
            width: 70px;
            height: 16px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, .4), transparent 70%);
            transform: translateX(-50%);
        }
        .hotspot .hs-tag {
            position: absolute;
            left: 50%;
            bottom: 100%;
            transform: translateX(-50%);
            margin-bottom: 6px;
            font-weight: 800;
            font-size: .62rem;
            color: #fff;
            background: rgba(10, 12, 8, .78);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 3px 9px;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .35);
        }
        .hotspot.locked {
            filter: grayscale(.65) brightness(.65);
            cursor: not-allowed;
        }
        .hotspot.energy-low {
            filter: saturate(.55) brightness(.85);
        }
        .hotspot.targeted {
            animation: targetPulse .3s ease infinite;
            z-index: 7;
        }
        .hotspot.scanned {
            filter: drop-shadow(0 0 14px var(--accent));
        }
        @keyframes targetPulse {
            0%,
            100% {
                filter: brightness(1) drop-shadow(0 0 0 rgba(232, 163, 61, 0));
            }
            50% {
                filter: brightness(1.35) drop-shadow(0 0 16px rgba(232, 163, 61, .9));
            }
        }
        .hotspot:active {
            filter: brightness(1.2);
        }

        .monster-hotspot {
            position: absolute;
            transform: translate(-50%, -100%) scale(var(--depth, 1));
            transform-origin: bottom center;
            z-index: 6;
            cursor: pointer;
            text-align: center;
            transition: left .25s ease, top .25s ease;
            touch-action: manipulation;
        }
        .monster-hotspot .m-icon {
            font-size: 4rem;
            filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .5));
            display: block;
            animation: monsterSway 2.4s ease-in-out infinite;
        }
        @keyframes monsterSway {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-5px) rotate(-2deg);
            }
        }
        .monster-hotspot .m-hpwrap {
            width: 84px;
            margin: 2px auto 0;
        }
        .monster-hotspot .m-hpbar {
            height: 7px;
            background: rgba(0, 0, 0, .5);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .18);
        }
        .monster-hotspot .m-hpfill {
            height: 100%;
            background: linear-gradient(90deg, #e14b4b, #f2c14e);
            transition: width .3s ease;
        }
        .monster-hotspot .m-name {
            font-size: .68rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 5px rgba(0, 0, 0, .8);
            background: rgba(140, 20, 20, .55);
            padding: 2px 8px;
            border-radius: 7px;
            display: inline-block;
            margin-top: 3px;
        }
        .monster-hotspot.boss .m-icon {
            font-size: 5.4rem;
        }
        .monster-hotspot.boss .m-hpwrap {
            width: 120px;
        }
        .monster-hotspot.boss .m-name {
            font-size: .82rem;
            background: rgba(180, 20, 20, .65);
        }
        .monster-hotspot.dead {
            opacity: .45;
            pointer-events: none;
        }
        .monster-hotspot.dead .m-icon {
            animation: none;
            filter: grayscale(1) drop-shadow(0 6px 6px rgba(0, 0, 0, .4));
        }
        .monster-hotspot.targeted .m-icon {
            filter: drop-shadow(0 0 18px rgba(232, 163, 61, 1)) brightness(1.3);
        }

        /* ============ CROSSHAIR ============ */
        .crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translate(-50%, -50%);
            z-index: 40;
            pointer-events: none;
            transition: transform .1s;
        }
        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 0 3px rgba(0, 0, 0, .6);
        }
        .crosshair::before {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }
        .crosshair::after {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }
        .crosshair i {
            position: absolute;
            inset: 8px;
            border: 2px solid rgba(255, 255, 255, .55);
            border-radius: 50%;
        }
        .crosshair.locked-on {
            transform: translate(-50%, -50%) scale(1.3);
        }
        .crosshair.locked-on::before,
        .crosshair.locked-on::after {
            background: var(--accent);
        }
        .crosshair.locked-on i {
            border-color: var(--accent);
        }

        /* ============ LOOK BUTTONS ============ */
        .look-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 56px;
            z-index: 22;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            background: rgba(9, 12, 8, .4);
            backdrop-filter: blur(4px);
            border: 1.5px solid var(--line);
            opacity: .55;
            transition: opacity .2s, background .15s;
        }
        .look-btn:active {
            opacity: .95;
            background: rgba(232, 163, 61, .3);
        }
        .look-left {
            left: 0;
            border-radius: 0 16px 16px 0;
        }
        .look-right {
            right: 0;
            border-radius: 16px 0 0 16px;
        }

        /* ============ WEAPON VIEWMODEL ============ */
        .weapon-dock {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .weapon-viewmodel {
            font-size: 5rem;
            line-height: 1;
            filter: drop-shadow(0 -6px 10px rgba(0, 0, 0, .55));
            transform-origin: bottom center;
            animation: weaponIdle 2.6s ease-in-out infinite;
            transform: translateY(14%) rotate(-6deg);
        }
        @keyframes weaponIdle {
            0%,
            100% {
                transform: translateY(14%) rotate(-6deg);
            }
            50% {
                transform: translateY(8%) rotate(-4deg);
            }
        }
        .weapon-viewmodel.recoil {
            animation: none !important;
            transform: translateY(-4%) rotate(6deg) scale(1.05);
            transition: transform .09s ease-out;
        }
        .weapon-viewmodel.working {
            animation: weaponWork .28s ease-in-out infinite;
        }
        @keyframes weaponWork {
            0%,
            100% {
                transform: translateY(10%) rotate(-6deg);
            }
            50% {
                transform: translateY(2%) rotate(24deg);
            }
        }

        /* ============ FX ============ */
        .tracer {
            position: fixed;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, rgba(255, 225, 140, .95), rgba(255, 225, 140, 0));
            box-shadow: 0 0 8px 2px rgba(255, 190, 90, .75);
            transform-origin: 0 50%;
            z-index: 150;
            pointer-events: none;
        }
        .muzzle-flash {
            position: fixed;
            width: 30px;
            height: 30px;
            margin: -15px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8d8, rgba(255, 190, 80, .7) 45%, transparent 72%);
            z-index: 151;
            pointer-events: none;
            animation: flashPop .16s ease forwards;
        }
        @keyframes flashPop {
            0% {
                transform: scale(.3);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        .hit-spark {
            position: fixed;
            width: 40px;
            height: 40px;
            margin: -20px;
            z-index: 151;
            pointer-events: none;
            background: radial-gradient(circle, #fff, rgba(255, 110, 70, .75) 45%, transparent 72%);
            border-radius: 50%;
            animation: sparkPop .26s ease forwards;
        }
        @keyframes sparkPop {
            0% {
                transform: scale(.25);
                opacity: 1;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }
        .floatpop {
            position: fixed;
            pointer-events: none;
            font-weight: 800;
            font-size: 1.05rem;
            z-index: 200;
            animation: floatUp .9s ease forwards;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .55);
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-56px) scale(1.1);
            }
        }
        .floatpop.good {
            color: #b8f0a8;
        }
        .floatpop.coin {
            color: var(--gold);
        }
        .floatpop.bad {
            color: #ffb0b8;
        }

        /* ============ HUD TOP ============ */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 25;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 0;
            pointer-events: none;
            gap: 6px;
            flex-wrap: wrap;
        }
        .hud-top>* {
            pointer-events: auto;
        }
        .hud-pill {
            display: flex;
            align-items: center;
            gap: .32rem;
            background: var(--hud-bg);
            color: #fff;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: .22rem .6rem;
            font-size: .72rem;
            font-weight: 700;
            backdrop-filter: blur(6px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
            white-space: nowrap;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 70%);
        }
        .hud-pill.gold {
            color: var(--gold);
        }
        .hud-energybar {
            width: 48px;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .18);
            overflow: hidden;
            flex-shrink: 0;
        }
        .hud-energyfill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            transition: width .3s ease;
        }
        .hud-xp {
            display: flex;
            align-items: center;
            gap: .32rem;
            background: var(--hud-bg);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: .18rem .55rem;
            backdrop-filter: blur(6px);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 70%);
        }
        .hud-xp .xp-bar {
            width: 52px;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .18);
            overflow: hidden;
        }
        .hud-xp .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--ok), var(--ok-dark));
            transition: width .3s ease;
        }
        .hud-xp .xp-lbl {
            font-size: .64rem;
            font-weight: 800;
            color: #fff;
        }
        .hud-icon-btn {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--hud-bg);
            border: 1.5px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            color: #fff;
            backdrop-filter: blur(6px);
            transition: transform .12s, background .2s;
        }
        .hud-icon-btn:active {
            transform: scale(.9);
        }
        .hud-icon-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: .52rem;
            font-weight: 800;
            border-radius: 9px;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 2px 6px rgba(225, 75, 75, .5);
        }

        /* ============ HOTBAR ============ */
        .hotbar {
            position: absolute;
            left: 50%;
            bottom: 70px;
            transform: translateX(-50%);
            z-index: 24;
            display: flex;
            gap: 4px;
            background: var(--hud-bg);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            padding: 4px 8px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
            pointer-events: none;
        }
        .hotbar .slot {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: auto;
        }
        .hotbar .slot .sicon2 {
            font-size: 1.05rem;
            line-height: 1;
        }
        .hotbar .slot .sqty {
            font-size: .55rem;
            font-weight: 700;
            margin-top: 1px;
            opacity: .9;
        }

        .zone-nav {
            position: absolute;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            z-index: 24;
            display: flex;
            gap: 5px;
            background: var(--hud-bg);
            border: 1.5px solid var(--line);
            border-radius: 14px;
            padding: 4px 8px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
            pointer-events: none;
        }
        .zone-nav>* {
            pointer-events: auto;
        }
        .zone-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3px 8px;
            border-radius: 9px;
            color: #fff;
            font-size: .6rem;
            font-weight: 800;
            background: rgba(255, 255, 255, .04);
            border: 1.5px solid transparent;
            min-width: 40px;
            transition: background .2s, transform .12s;
        }
        .zone-btn .zicon {
            font-size: 1.15rem;
        }
        .zone-btn .zlabel {
            font-size: .44rem;
            opacity: .8;
            margin-top: 1px;
        }
        .zone-btn.active {
            background: rgba(232, 163, 61, .2);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(232, 163, 61, .25);
        }
        .zone-btn:active {
            transform: scale(.92);
        }

        .farm-toggle {
            position: absolute;
            right: 8px;
            bottom: 170px;
            z-index: 24;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--hud-bg);
            border: 1.5px solid var(--line);
            color: #fff;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .farm-toggle:active {
            transform: scale(.92);
        }

        /* ============ D-PAD ============ */
        .dpad-container {
            position: absolute;
            left: 10px;
            bottom: 80px;
            z-index: 28;
            display: grid;
            grid-template-columns: var(--dpad-size) var(--dpad-size) var(--dpad-size);
            grid-template-rows: var(--dpad-size) var(--dpad-size) var(--dpad-size);
            gap: 3px;
            pointer-events: none;
        }
        .dpad-btn {
            width: var(--dpad-size);
            height: var(--dpad-size);
            border-radius: 14px;
            background: rgba(9, 12, 8, .7);
            border: 2px solid var(--line);
            color: #fff;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            transition: transform .08s, background .15s, border-color .2s;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
        }
        .dpad-btn:active {
            background: rgba(232, 163, 61, .4);
            border-color: var(--accent);
            transform: scale(.88);
        }
        .dpad-up {
            grid-column: 2;
            grid-row: 1;
        }
        .dpad-left {
            grid-column: 1;
            grid-row: 2;
        }
        .dpad-right {
            grid-column: 3;
            grid-row: 2;
        }
        .dpad-down {
            grid-column: 2;
            grid-row: 3;
        }
        .dpad-center {
            grid-column: 2;
            grid-row: 2;
            background: transparent;
            border: none;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            color: rgba(255, 255, 255, .4);
        }

        /* ============ ACTION BUTTON ============ */
        .action-btn {
            position: absolute;
            right: 14px;
            bottom: 100px;
            z-index: 28;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #f0b45a, var(--accent-dark));
            border: 3px solid rgba(255, 255, 255, .45);
            color: #1a1204;
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 22px rgba(232, 163, 61, .45), inset 0 -3px 6px rgba(0, 0, 0, .2);
            pointer-events: auto;
            transition: transform .1s, box-shadow .2s, opacity .2s;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .action-btn:active {
            transform: scale(.85);
            box-shadow: 0 2px 12px rgba(232, 163, 61, .3), inset 0 -2px 4px rgba(0, 0, 0, .3);
        }
        .action-btn.cooldown {
            opacity: .45;
            pointer-events: none;
            transform: scale(.9);
        }

        /* ============ MINIMAP ============ */
        .minimap {
            position: absolute;
            right: 8px;
            top: 58px;
            z-index: 26;
            width: 110px;
            height: 78px;
            background: rgba(9, 12, 8, .75);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            overflow: hidden;
            pointer-events: none;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .4);
        }
        .minimap-dot {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .minimap-player {
            width: 8px;
            height: 8px;
            background: #fff;
            border: 2px solid var(--accent);
            z-index: 5;
            box-shadow: 0 0 6px rgba(255, 255, 255, .7);
            transition: left .2s ease, top .2s ease;
        }
        .minimap-spot {
            width: 5px;
            height: 5px;
            background: var(--accent);
            opacity: .85;
            z-index: 3;
        }
        .minimap-monster {
            width: 5px;
            height: 5px;
            background: var(--danger);
            opacity: .9;
            z-index: 4;
            animation: mmPulse 1.5s ease-in-out infinite;
        }
        @keyframes mmPulse {
            0%,
            100% {
                opacity: .9;
            }
            50% {
                opacity: .3;
            }
        }

        /* ============ TOAST / HINT ============ */
        .toast-hint {
            position: absolute;
            left: 50%;
            top: 14px;
            transform: translateX(-50%);
            z-index: 26;
            background: rgba(9, 12, 8, .82);
            color: #fff;
            font-weight: 700;
            font-size: .78rem;
            padding: .4rem 1rem;
            border-radius: 10px;
            border: 1.5px solid var(--line);
            backdrop-filter: blur(6px);
            pointer-events: none;
            animation: hintIn .3s ease;
        }
        @keyframes hintIn {
            0% {
                transform: translateX(-50%) translateY(-10px);
                opacity: 0;
            }
            100% {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        .toast {
            position: fixed;
            left: 50%;
            top: calc(env(safe-area-inset-top, 0px) + 16px);
            transform: translateX(-50%);
            z-index: 300;
            background: var(--panel2);
            border: 2px solid var(--accent-dark);
            border-radius: 12px;
            padding: .6rem 1.2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            font-weight: 700;
            font-size: .85rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: .5rem;
            animation: toastIn .4s cubic-bezier(.2, .9, .3, 1.2), toastOut .3s ease 2.4s forwards;
            max-width: 90vw;
        }
        @keyframes toastIn {
            0% {
                transform: translate(-50%, -20px);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translate(-50%, -12px);
            }
        }

        /* ============ PANEL ============ */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(4, 5, 3, .65);
            z-index: 40;
            backdrop-filter: blur(3px);
            animation: fadeIn .25s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .panel {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 420px);
            max-height: 80vh;
            background: var(--panel);
            border: 2px solid var(--accent-dark);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
            z-index: 41;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: panelIn .28s cubic-bezier(.2, .9, .3, 1.2) forwards;
            color: var(--ink);
        }
        @keyframes panelIn {
            0% {
                transform: translate(-50%, -50%) scale(.94) translateY(10px);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) translateY(0);
                opacity: 1;
            }
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .7rem 1rem;
            background: linear-gradient(135deg, var(--panel2), var(--panel));
            border-bottom: 2px solid var(--accent-dark);
            color: #fff;
            flex-shrink: 0;
        }
        .panel-header h2 {
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: .4rem;
        }
        .panel-close {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: rgba(255, 255, 255, .08);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, transform .12s;
        }
        .panel-close:active {
            transform: scale(.9);
            background: rgba(255, 255, 255, .16);
        }
        .panel-subnav {
            display: flex;
            background: var(--panel2);
            border-bottom: 2px solid var(--line);
            flex-shrink: 0;
            overflow-x: auto;
        }
        .panel-subtab {
            flex: 1;
            padding: .4rem .2rem;
            text-align: center;
            font-weight: 700;
            font-size: .7rem;
            color: var(--ink-dim);
            transition: background .2s, color .2s;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            min-width: 60px;
            cursor: pointer;
        }
        .panel-subtab.active {
            background: var(--panel);
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: .8rem 1rem 1.2rem;
            -webkit-overflow-scrolling: touch;
        }
        .panel-body::-webkit-scrollbar {
            width: 4px;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: var(--accent-dark);
            border-radius: 4px;
        }

        .resource-strip {
            display: flex;
            gap: .4rem;
            overflow-x: auto;
            padding-bottom: .4rem;
            margin-bottom: .7rem;
        }
        .res-chip {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: var(--panel2);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: .2rem .5rem;
            min-width: 48px;
        }
        .res-chip .ricon {
            font-size: .9rem;
        }
        .res-chip .rqty {
            font-family: 'JetBrains Mono', monospace;
            font-size: .7rem;
            font-weight: 700;
            color: #fff;
        }
        .res-chip .rcap {
            font-size: .5rem;
            color: var(--ink-dim);
        }

        .building-card,
        .shop-card,
        .quest-card {
            background: var(--panel2);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            padding: .7rem;
            margin-bottom: .6rem;
            display: flex;
            align-items: center;
            gap: .7rem;
        }
        .building-card .bicon,
        .shop-card .sicon {
            font-size: 1.8rem;
            flex: 0 0 auto;
        }
        .building-info,
        .shop-info {
            flex: 1;
            min-width: 0;
        }
        .building-title,
        .shop-title {
            font-weight: 700;
            font-size: .85rem;
            display: flex;
            align-items: center;
            gap: .3rem;
            flex-wrap: wrap;
            color: #fff;
        }
        .lvl-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: .6rem;
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 1px 6px;
            color: var(--ink-dim);
        }
        .building-sub,
        .shop-sub {
            font-size: .65rem;
            color: var(--ink-dim);
            margin-top: 2px;
        }
        .building-btn,
        .shop-btn,
        .claim-btn {
            flex: 0 0 auto;
            padding: .35rem .7rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: .7rem;
            transition: transform .12s, opacity .2s;
        }
        .building-btn {
            background: var(--accent);
            color: #1a1204;
        }
        .building-btn:active {
            transform: scale(.94);
        }
        .building-btn:disabled {
            background: #3a3a30;
            color: rgba(255, 255, 255, .35);
        }
        .building-btn.locked {
            background: var(--gold);
        }
        .shop-btn {
            background: var(--gold);
            color: #3a2a04;
        }
        .shop-btn:active {
            transform: scale(.94);
        }
        .shop-btn:disabled {
            background: #3a3a30;
            color: rgba(255, 255, 255, .25);
        }
        .claim-btn {
            background: var(--ok);
            color: #0e2405;
        }
        .claim-btn:active {
            transform: scale(.94);
        }
        .claim-btn:disabled {
            background: #3a3a30;
            color: rgba(255, 255, 255, .35);
        }
        .quest-card.complete {
            border-color: var(--ok);
        }
        .quest-title {
            font-weight: 700;
            font-size: .85rem;
            color: #fff;
        }
        .quest-desc {
            font-size: .7rem;
            color: var(--ink-dim);
            margin: .15rem 0 .4rem;
        }
        .quest-progress {
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, .1);
            overflow: hidden;
            margin-bottom: .4rem;
        }
        .quest-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--accent-dark));
            border-radius: 5px;
            transition: width .4s ease;
        }
        .quest-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: .7rem;
            flex-wrap: wrap;
            gap: .3rem;
        }
        .quest-reward {
            color: var(--gold);
            font-weight: 700;
        }
        .quest-status-done {
            color: var(--ok);
            font-weight: 700;
            font-size: .7rem;
        }
        .settings-btn {
            width: 100%;
            padding: .7rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: .85rem;
            margin-bottom: .5rem;
            background: var(--panel2);
            border: 1.5px solid var(--line);
            color: var(--ink);
            transition: transform .12s, background .2s;
        }
        .settings-btn:active {
            transform: scale(.97);
        }
        .settings-btn.danger {
            color: var(--danger);
            border-color: rgba(225, 75, 75, .35);
        }
        .settings-btn.primary {
            background: var(--ok);
            color: #0e2405;
            border-color: var(--ok);
        }
        .empty-note {
            text-align: center;
            color: var(--ink-dim);
            font-size: .75rem;
            padding: 1rem 0;
        }

        /* ============ FARM WIDGET ============ */
        .farm-widget {
            position: absolute;
            right: 8px;
            bottom: 190px;
            z-index: 27;
            width: min(60vw, 240px);
            background: var(--hud-bg);
            border: 1.5px solid var(--accent-dark);
            border-radius: 14px;
            padding: .6rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
        }
        .farm-widget h3 {
            font-size: .72rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: .4rem;
            display: flex;
            align-items: center;
            gap: .3rem;
        }
        .fw-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .fw-tile {
            aspect-ratio: 1/1;
            border-radius: 7px;
            background: #3a2a16;
            border: 1.5px solid #5a4224;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: 1.35rem;
            overflow: hidden;
        }
        .fw-tile .fw-bar {
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: 8%;
            height: 3px;
            border-radius: 3px;
            background: rgba(0, 0, 0, .4);
            overflow: hidden;
        }
        .fw-tile .fw-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #b0e8a0, #7ad06a);
        }
        .fw-tile.ready {
            background: var(--ok-dark);
            animation: pulseGlow 1.2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }

        /* ============ MENU SCREEN ============ */
        .menu-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at 50% 20%, #1a2416, #0a0d09 70%);
        }
        .menu-card {
            background: var(--panel);
            border: 2px solid var(--accent-dark);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
            padding: 2rem 1.8rem;
            max-width: 26rem;
            width: 100%;
            text-align: center;
            animation: popIn .35s cubic-bezier(.2, .9, .3, 1.2) forwards;
            color: var(--ink);
        }
        @keyframes popIn {
            0% {
                transform: scale(.94);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .menu-card .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: .6rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .4));
        }
        .menu-card h1 {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: .5px;
        }
        .menu-card p {
            color: var(--ink-dim);
            font-size: .9rem;
            margin: .6rem 0 1.6rem;
            line-height: 1.5;
        }
        .btn-primary {
            width: 100%;
            padding: .9rem;
            border-radius: 11px;
            font-weight: 800;
            font-size: 1.05rem;
            background: var(--accent);
            color: #1a1204;
            box-shadow: 0 4px 0 var(--accent-dark);
        }
        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--accent-dark);
        }
        .btn-ghost {
            width: 100%;
            margin-top: .5rem;
            padding: .7rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: .85rem;
            background: transparent;
            color: var(--danger);
            border: 2px solid rgba(225, 75, 75, .35);
        }
        .menu-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.4rem;
            padding-top: 1.2rem;
            border-top: 2px dashed rgba(255, 255, 255, .12);
        }
        .menu-stats .n {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 1.1rem;
        }
        .menu-stats .l {
            font-size: .62rem;
            color: var(--ink-dim);
            text-transform: uppercase;
            letter-spacing: .3px;
        }

        /* ============ MOBILE ============ */
        @media (max-width:480px) {
            :root {
                --dpad-size: 44px;
            }
            .weapon-viewmodel {
                font-size: 3.8rem;
            }
            .hotbar {
                bottom: 56px;
                padding: 3px 6px;
                gap: 3px;
            }
            .hotbar .slot {
                width: 32px;
                height: 32px;
            }
            .hotbar .slot .sicon2 {
                font-size: .85rem;
            }
            .hotbar .slot .sqty {
                font-size: .48rem;
            }
            .zone-nav {
                bottom: 8px;
                padding: 3px 6px;
                gap: 3px;
            }
            .zone-btn {
                min-width: 32px;
                padding: 2px 4px;
            }
            .zone-btn .zicon {
                font-size: 1rem;
            }
            .zone-btn .zlabel {
                font-size: .4rem;
            }
            .farm-toggle {
                width: 34px;
                height: 34px;
                bottom: 150px;
                font-size: 1rem;
            }
            .farm-widget {
                bottom: 170px;
                width: min(65vw, 200px);
            }
            .hud-pill {
                font-size: .62rem;
                padding: .16rem .45rem;
            }
            .hud-energybar {
                width: 36px;
            }
            .hud-xp .xp-bar {
                width: 40px;
            }
            .hud-icon-btn {
                width: 31px;
                height: 31px;
                font-size: .9rem;
            }
            .look-btn {
                width: 32px;
                height: 48px;
                font-size: 1.2rem;
            }
            .monster-hotspot .m-icon {
                font-size: 3rem;
            }
            .monster-hotspot .m-hpwrap {
                width: 58px;
            }
            .monster-hotspot.boss .m-icon {
                font-size: 4rem;
            }
            .monster-hotspot.boss .m-hpwrap {
                width: 84px;
            }
            .decor-item {
                font-size: 1.7rem;
            }
            .dpad-container {
                left: 6px;
                bottom: 70px;
            }
            .action-btn {
                width: 58px;
                height: 58px;
                font-size: 1.7rem;
                right: 10px;
                bottom: 85px;
            }
            .minimap {
                width: 90px;
                height: 64px;
                right: 6px;
                top: 50px;
            }
        }
        @media (max-width:360px) {
            :root {
                --dpad-size: 38px;
            }
            .weapon-viewmodel {
                font-size: 3rem;
            }
            .hud-pill {
                font-size: .55rem;
            }
            .zone-btn {
                min-width: 28px;
            }
            .action-btn {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
                bottom: 75px;
                right: 8px;
            }
            .dpad-container {
                left: 4px;
                bottom: 62px;
            }
        }
    </style>
</head>

            var QUEST_DEFS = [

            var SHOP_DEFS = [

                        alive: true, respawnTimer: null };

            function loadState() {
                try {
                    var raw = localStorage.getItem(STORE_KEY);
                    if (raw) {
                        var parsed = JSON.parse(raw);
                        var def = defaultState();
                        if (!parsed.monsters) parsed.monsters = def.monsters;
                        if (!parsed.player) parsed.player = def.player;
                        return Object.assign(def, parsed);
                    }
                } catch (e) {}
                return defaultState();
            }

            function saveState() {
                try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
                broadcastState();

            function broadcastState() {
                try {

                        type: 'state-update',
                        data: {
                            type: 'play-to-win',

            /* ========================= TICK ========================= */
            function startTick() {
                stopTick();
                tickInterval = setInterval(function() {
                    var changed = false;
                    clockMinutes += 4;
                    if (clockMinutes >= 26 * 60) { clockMinutes = 6 * 60;
                        state.day = (state.day || 1) + 1; }
                    updateClock();
                    if (state.energy < state.maxEnergy) {
                        state._energyAcc = (state._energyAcc || 0) + 1;
                        if (state._energyAcc >= 4) { state._energyAcc = 0;
                            state.energy = Math.min(state.maxEnergy, state.energy + 1);
                            changed = true; }
                    }
                    state.plots.forEach(function(p) {
                        if (p.state === 'growing') {
                            p.remaining = Math.max(0, p.remaining - 1000);
                            if (p.remaining <= 0) p.state = 'ready';
                            changed = true;
                        }
                    });
                    Object.keys(state.monsters).forEach(function(key) {
                        var m = state.monsters[key];
                        if (!m.alive && m.respawnTimer === null) {
                            m.respawnTimer = setTimeout(function() {
                                m.alive = true;
                                m.hp = m.maxHp;
                                m.respawnTimer = null;
                                if (screen === 'playing' && currentZone === key.split('-')[0])
                                    renderZoneScene();
                                saveState();
                            }, 5000);
                        }
                    });
                    if (changed && screen === 'playing') {
                        updateHud();
                        if (openPanelName === null) { refreshFarmVisual();
                            refreshGrowthVisual(); }
                    }
                }, 1000);
            }

            function stopTick() {
                if (tickInterval) { clearInterval(tickInterval);
                    tickInterval = null; }
            }

            function formatClock() {
                var h24 = Math.floor(clockMinutes / 60) % 24,
                    m = clockMinutes % 60;
                var ampm = h24 >= 12 ? 'ch' : 'sa';
                var h12 = h24 % 12;
                if (h12 === 0) h12 = 12;
                return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
            }

            function updateClock() {
                var c = document.getElementById('hud-clock');
                if (c) c.textContent = formatClock();
