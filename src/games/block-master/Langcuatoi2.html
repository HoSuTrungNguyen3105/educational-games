            /* ========================= MOVEMENT ========================= */
            function bindMoveButtons() {
                var btnUp = document.getElementById('btn-move-up');
                var btnDown = document.getElementById('btn-move-down');
                var btnLeft = document.getElementById('btn-move-left');
                var btnRight = document.getElementById('btn-move-right');

                function startMove(dir) {
                    return function(e) {
                        e.preventDefault();
                        moveDir = dir;
                        if (moveHold) clearInterval(moveHold);
                        moveHold = setInterval(function() {
                            movePlayer(dir);
                        }, MOVE_INTERVAL);
                        movePlayer(dir);
                    };
                }

                function stopMove(e) {
                    if (moveHold) { clearInterval(moveHold);
                        moveHold = null; }
                    moveDir = null;
                }

                if (btnUp) {
                    btnUp.addEventListener('pointerdown', startMove('up'));
                    btnUp.addEventListener('pointerup', stopMove);
                    btnUp.addEventListener('pointerleave', stopMove);
                    btnUp.addEventListener('pointercancel', stopMove);
                }
                if (btnDown) {
                    btnDown.addEventListener('pointerdown', startMove('down'));
                    btnDown.addEventListener('pointerup', stopMove);
                    btnDown.addEventListener('pointerleave', stopMove);
                    btnDown.addEventListener('pointercancel', stopMove);
                }
                if (btnLeft) {
                    btnLeft.addEventListener('pointerdown', startMove('left'));
                    btnLeft.addEventListener('pointerup', stopMove);
                    btnLeft.addEventListener('pointerleave', stopMove);
                    btnLeft.addEventListener('pointercancel', stopMove);
                }
                if (btnRight) {
                    btnRight.addEventListener('pointerdown', startMove('right'));
                    btnRight.addEventListener('pointerup', stopMove);
                    btnRight.addEventListener('pointerleave', stopMove);
                    btnRight.addEventListener('pointercancel', stopMove);
                }
            }

            function movePlayer(dir) {
                var newX = playerX;
                var newZ = playerZ;
                switch (dir) {
                    case 'up':
                        newZ += MOVE_SPEED;
                        break;
                    case 'down':
                        newZ -= MOVE_SPEED;
                        break;
                    case 'left':
                        newX -= MOVE_SPEED;
                        break;
                    case 'right':
                        newX += MOVE_SPEED;
                        break;
                }
                newX = Math.max(0, Math.min(150, newX));
                newZ = Math.max(0, Math.min(55, newZ));
                if (newX !== playerX || newZ !== playerZ) {
                    playerX = newX;
                    playerZ = newZ;
                    state.player.x = playerX;
                    state.player.z = playerZ;
                    state.player.angle = playerAngle;
                    saveState();
                    renderZoneScene();
                    updateMinimap();
                    updateCrosshair();
                }
            }

            function setPlayerPosition(x, z) {
                playerX = Math.max(0, Math.min(150, x));
                playerZ = Math.max(0, Math.min(55, z));
                state.player.x = playerX;
                state.player.z = playerZ;
                state.player.angle = playerAngle;
                saveState();
                renderZoneScene();
                updateMinimap();
                updateCrosshair();
            }

            function setPlayerAngle(angle) {
                playerAngle = angle;
                state.player.angle = playerAngle;
                saveState();
                renderZoneScene();
                updateCrosshair();
            }

            /* ========================= CAMERA ========================= */
            function bindLookButton(id, dir) {
                var el = document.getElementById(id);
                if (!el) return;

                function start(e) {
                    e.preventDefault();
                    step();
                    if (lookHold) clearInterval(lookHold);
                    lookHold = setInterval(step, 90);
                }

                function step() { setCamera(cameraX + dir * 4); }

                function stop() { if (lookHold) { clearInterval(lookHold);
                        lookHold = null; } }
                el.addEventListener('pointerdown', start);
                el.addEventListener('pointerup', stop);
                el.addEventListener('pointerleave', stop);
                el.addEventListener('pointercancel', stop);
            }

            var dragState = null;

            function bindDragLook() {
                var scene = document.getElementById('scene');
                scene.addEventListener('pointerdown', function(e) {
                    dragState = { startX: e.clientX, camStart: cameraX, moved: false };
                });
                scene.addEventListener('pointermove', function(e) {
                    if (!dragState) return;
                    var dx = e.clientX - dragState.startX;
                    if (Math.abs(dx) > 6) dragState.moved = true;
                    if (dragState.moved) setCamera(dragState.camStart - dx / 6);
                });
                window.addEventListener('pointerup', function() { dragState = null; });
            }

            function setCamera(val) {
                cameraX = Math.max(0, Math.min(50, val));
                updateCameraPositions();
                updateCrosshair();
            }

            function updateCameraPositions() {
                document.querySelectorAll('#scene [data-wx]').forEach(function(el) {
                    var wx = parseFloat(el.dataset.wx),
                        pf = parseFloat(el.dataset.pf || '1');
                    var sx = wx - playerX - cameraX * pf;
                    el.style.left = sx + '%';
                    var wy = parseFloat(el.dataset.wy || '50');
                    var relZ = wy - playerZ;
                    el.style.display = (sx > -25 && sx < 125 && relZ > 1.5) ? '' : 'none';
                    if (relZ > 1.5) {
                        var scale = computeScale(wy, pf);
                        el.style.setProperty('--depth', scale);
                        var screenY = wy - playerZ * 0.35;
                        el.style.top = screenY + '%';
                    }
                });
            }

            function computeScale(wy, pf) {
                var relZ = wy - playerZ;
                if (relZ <= 1) return 0;
                var baseScale = 0.55 + (wy / 100) * 0.9;
                var zoomFactor = Math.max(0.5, Math.min(2.2, 30 / relZ));
                return (baseScale * zoomFactor).toFixed(3);
            }

            function computeScreenX(wx, pf) {
                return wx - playerX - cameraX * (pf || 1);
            }

            function computeScreenY(wy) {
                return wy - playerZ * 0.35;
            }

            function isVisible(wy) {
                return wy - playerZ > 1.5;
            }

            /* ========================= KEYBOARD ========================= */
            var keysDown = {};

            function onKeyDown(e) {
                var k = e.key.toLowerCase();
                if (k === 'arrowleft' || k === 'a') { keysDown['left'] = true;
                    e.preventDefault(); }
                if (k === 'arrowright' || k === 'd') { keysDown['right'] = true;
                    e.preventDefault(); }
                if (k === 'arrowup' || k === 'w') { keysDown['up'] = true;
                    e.preventDefault(); }
                if (k === 'arrowdown' || k === 's') { keysDown['down'] = true;
                    e.preventDefault(); }
                if (k === ' ' || k === 'e') { e.preventDefault();
                    doAction(); }
                if (keysDown['up'] || keysDown['down'] || keysDown['left'] || keysDown['right']) {
                    if (moveHold) clearInterval(moveHold);
                    moveHold = setInterval(function() {
                        if (keysDown['up']) movePlayer('up');
                        if (keysDown['down']) movePlayer('down');
                        if (keysDown['left']) movePlayer('left');
                        if (keysDown['right']) movePlayer('right');
                    }, MOVE_INTERVAL);
                }
            }

            function onKeyUp(e) {
                var k = e.key.toLowerCase();
                if (k === 'arrowleft' || k === 'a') keysDown['left'] = false;
                if (k === 'arrowright' || k === 'd') keysDown['right'] = false;
                if (k === 'arrowup' || k === 'w') keysDown['up'] = false;
                if (k === 'arrowdown' || k === 's') keysDown['down'] = false;
                if (!keysDown['up'] && !keysDown['down'] && !keysDown['left'] && !keysDown['right']) {
                    if (moveHold) { clearInterval(moveHold);
                        moveHold = null; }
                }
            }

            /* ========================= ACTION ========================= */
            function doAction() {
                if (actionBusy) return;
                var target = findTargetAtCenter();
                if (!target) { showHint('Không có mục tiêu trong tầm ngắm!'); return; }
                var t = target.element;
                if (t.dataset.chop) { doGather('chop', t); return; }
                if (t.dataset.stone) { doGather('stone', t); return; }
                if (t.dataset.gold) { doGather('gold', t); return; }
                if (t.dataset.dig) { doGather('dig', t); return; }
                if (t.dataset.openbuild) {
                    t.classList.add('scanned');
                    setTimeout(function() { t.classList.remove('scanned'); }, 300);
                    optionsSubTab = 'build';
                    openPanel('options');
                    return;
                }
                if (t.dataset.monster) { attackMonster(t.dataset.monster, t); return; }
                showHint('Không thể tương tác với mục tiêu này.');
            }

            function findTargetAtCenter() {
                var scene = document.getElementById('scene');
                if (!scene) return null;
                var centerX = window.innerWidth / 2;
                var centerY = window.innerHeight / 2;
                var best = null;
                var bestDist = Infinity;
                document.querySelectorAll('#hotspot-layer .hotspot, #monster-layer .monster-hotspot').forEach(
                function(el) {
                    if (el.style.display === 'none') return;
                    var rect = el.getBoundingClientRect();
                    var cx = rect.left + rect.width / 2;
                    var cy = rect.top + rect.height * 0.4;
                    var dist = Math.sqrt((cx - centerX) ** 2 + (cy - centerY) ** 2);
                    if (dist < bestDist) { bestDist = dist;
                        best = { element: el, dist: dist }; }
                });
                if (best && best.dist < 180) return best;
                return null;
            }

            function updateCrosshair() {
                var ch = document.getElementById('crosshair');
                if (!ch) return;
                var target = findTargetAtCenter();
                if (target) ch.classList.add('locked-on');
                else ch.classList.remove('locked-on');
                var ab = document.getElementById('btn-action');
                if (ab) ab.classList.toggle('cooldown', actionBusy);
            }

            function onSceneClick(evt) {
                var t = evt.target;
                var chop = t.closest('[data-chop]');
                if (chop) { doGather('chop', chop); return; }
                var stone = t.closest('[data-stone]');
                if (stone) { doGather('stone', stone); return; }
                var gold = t.closest('[data-gold]');
                if (gold) { doGather('gold', gold); return; }
                var dig = t.closest('[data-dig]');
                if (dig) { doGather('dig', dig); return; }
                var openbuild = t.closest('[data-openbuild]');
                if (openbuild) {
                    openbuild.classList.add('scanned');
                    setTimeout(function() { openbuild.classList.remove('scanned'); }, 300);
                    optionsSubTab = 'build';
                    openPanel('options');
                    return;
                }
                var mon = t.closest('[data-monster]');
                if (mon) { attackMonster(mon.dataset.monster, mon); return; }
            }

            /* ========================= SWITCH ZONE ========================= */
            function switchZone(newZone) {
                if (newZone === currentZone) return;
                currentZone = newZone;
                cameraX = 25;
                document.querySelectorAll('.zone-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.zone === newZone);
                });
                var fw = document.getElementById('farm-widget');
                if (fw) fw.classList.add('hidden');
                renderZoneScene();
                updateHud();
                updateMinimap();
                updateCrosshair();
            }

            /* ========================= RENDER ZONE SCENE ========================= */
            function renderZoneScene() {
                var zone = ZONES[currentZone];
                if (!zone) return;
                var theme = ZONE_THEME[currentZone];
                var sky = document.getElementById('sky'),
                    ground = document.getElementById('ground'),
                    sun = document.getElementById('sun');
                if (sky) { sky.style.background = theme.sky;
                    sky.style.setProperty('--fog', theme.fog); }
                if (ground) ground.style.background = theme.ground;
                if (sun) sun.style.display = theme.showSun ? '' : 'none';
                var horizon = document.getElementById('horizon-line');
                if (horizon) horizon.style.bottom = (54 - playerZ * 0.3) + '%';

                var decorList = DECOR[currentZone] || [];
                document.getElementById('decor-layer').innerHTML = decorList.map(function(d) {
                    var sx = computeScreenX(d.x, d.pf);
                    var sy = computeScreenY(d.y);
                    var sc = computeScale(d.y, d.pf);
                    var vis = isVisible(d.y);
                    return '<div class="decor-item" data-wx="' + d.x + '" data-pf="' + d.pf + '" data-wy="' + d
                        .y + '" style="left:' + sx + '%;top:' + sy + '%;--depth:' + sc + ';display:' + (vis ?
                            '' : 'none') + ';font-size:' + (1.6 + d.pf * 2.2) + 'rem;">' + d.e + '</div>';
                }).join('');

                var hsHtml = '';
                if (zone.hasResources && currentZone === 'village') hsHtml += villageHotspotsHtml();
                document.getElementById('hotspot-layer').innerHTML = hsHtml;

                document.getElementById('monster-layer').innerHTML = monstersHtml(zone);

                var farmBtn = document.getElementById('btn-farm');
                if (farmBtn) farmBtn.classList.toggle('hidden', !(zone.hasFarm));

                updateCameraPositions();
                updateMinimap();
                updateCrosshair();
                setWeaponIcon();
            }

            function villageHotspotsHtml() {
                var html = '';
                var energyLowChop = state.energy < ACTIONS.chop.energy;
                html += worldHotspot('chop', 'data-chop="1"', SPOTS.tree, energyLowChop ? ' energy-low' : '',
                    '🪓 Chặt cây (⚡' + ACTIONS.chop.energy + ')',
                    '<svg viewBox="0 0 90 90" width="100%" height="100%"><rect x="40" y="58" width="10" height="26" rx="2" fill="#7a4f2a"/><circle cx="45" cy="42" r="26" fill="#4f9760"/><circle cx="24" cy="55" r="17" fill="#5aa06c"/><circle cx="66" cy="55" r="17" fill="#5aa06c"/></svg>'
                    );

                var mineUnlocked = state.buildings.mine.level >= 1;
                var stoneLocked = !mineUnlocked || !state.items.pickaxe;
                html += worldHotspot('stone', 'data-stone="1"', SPOTS.stoneSpot, stoneLocked ? ' locked' : (state
                    .energy < ACTIONS.stone.energy ? ' energy-low' : ''),
                    stoneLocked ? '🔒 Cần Hầm mỏ + Cuốc chim' : '🪨 Khai đá (⚡' + ACTIONS.stone.energy + ')',
                    '<svg viewBox="0 0 70 50" width="100%" height="100%"><ellipse cx="35" cy="38" rx="30" ry="10" fill="#a89f8a"/><circle cx="22" cy="26" r="14" fill="#948a75"/><circle cx="46" cy="22" r="17" fill="#a89f8a"/><circle cx="55" cy="34" r="10" fill="#8b8270"/></svg>'
                    );

                var goldLocked = !mineUnlocked || !state.items.pickaxe;
                html += worldHotspot('gold', 'data-gold="1"', SPOTS.goldSpot, goldLocked ? ' locked' : (state
                    .energy < ACTIONS.gold.energy ? ' energy-low' : ''),
                    goldLocked ? '🔒 Cần Hầm mỏ + Cuốc chim' : '🥇 Đào vàng (⚡' + ACTIONS.gold.energy + ')',
                    '<svg viewBox="0 0 60 46" width="100%" height="100%"><ellipse cx="30" cy="36" rx="26" ry="8" fill="#8b8270"/><circle cx="20" cy="22" r="13" fill="#9c927a"/><circle cx="40" cy="20" r="15" fill="#a89f8a"/><circle cx="18" cy="18" r="2.4" fill="#ffd166"/><circle cx="34" cy="14" r="2" fill="#ffd166"/><circle cx="42" cy="24" r="2.2" fill="#ffd166"/></svg>'
                    );

                html += worldHotspot('dig', 'data-dig="1"', SPOTS.digSpot, state.energy < ACTIONS.dig.energy ?
                    ' energy-low' : '',
                    '🗺️ Đào kho báu (⚡' + ACTIONS.dig.energy + ')',
                    '<svg viewBox="0 0 60 40" width="100%" height="100%"><ellipse cx="30" cy="32" rx="26" ry="7" fill="#c9a06a"/><ellipse cx="30" cy="29" rx="17" ry="4.5" fill="#a9713f"/><line x1="44" y1="6" x2="30" y2="26" stroke="#7a4f2a" stroke-width="4" stroke-linecap="round"/><rect x="40" y="1" width="9" height="9" rx="2" fill="#93896a"/></svg>'
                    );

                html += worldHotspot(null, 'data-openbuild="house"', SPOTS.houseBuild, '',
                    'Nhà ở Lv.' + state.buildings.house.level, houseSvg(state.buildings.house.level));
                html += worldHotspot(null, 'data-openbuild="shop"', SPOTS.shopBuild, '',
                    'Cửa hàng Lv.' + state.buildings.shop.level, shopSvg(state.buildings.shop.level));
                html += worldHotspot(null, 'data-openbuild="mine"', SPOTS.mineBuild, '',
                    mineUnlocked ? ('Hầm mỏ Lv.' + state.buildings.mine.level) : 'Hầm mỏ (khóa)',
                    mineVisualSvg(state.buildings.mine.level));
                html += worldHotspot(null, 'data-openbuild="land"', SPOTS.landBuild, '',
                    state.buildings.land.level >= 1 ? ('Khu đất Lv.' + state.buildings.land.level) : 'Khu đất (khóa)',
                    landSvg(state.buildings.land.level));

                return html;
            }

            function worldHotspot(kind, attrs, spot, extraClass, tag, innerSvg) {
                var sx = computeScreenX(spot.x, 1);
                var sy = computeScreenY(spot.y);
                var sc = computeScale(spot.y, 1);
                var vis = isVisible(spot.y);
                var box = Math.round(56 + (spot.y / 100) * 40);
                return '<div class="hotspot' + extraClass + '" ' + attrs + ' data-wx="' + spot.x + '" data-pf="1" data-wy="' +
                    spot.y + '" style="left:' + sx + '%;top:' + sy + '%;--depth:' + sc + ';display:' + (vis ? '' :
                        'none') + ';">' +
                    '<div class="hs-shadow"></div>' +
                    '<span class="hs-tag">' + tag + '</span>' +
                    '<div style="width:' + box + 'px;height:' + box + 'px;">' + innerSvg + '</div>' +
                    '</div>';
            }

            function monstersHtml(zone) {
                var html = '';
                (zone.monsters || []).forEach(function(mon, idx) {
                    var key = currentZone + '-' + mon.id;
                    var monState = state.monsters[key];
                    if (!monState) return;
                    var spot = idx === 0 ? SPOTS.monster1 : SPOTS.monster2;
                    var alive = monState.alive;
                    var hpPct = monState.hp / monState.maxHp * 100;
                    var sx = computeScreenX(spot.x, 1);
                    var sy = computeScreenY(spot.y);
                    var sc = computeScale(spot.y, 1);
                    var vis = isVisible(spot.y);
                    html += '<div class="monster-hotspot' + (alive ? '' : ' dead') + '" data-monster="' + key +
                        '" data-wx="' + spot.x + '" data-pf="1" data-wy="' + spot.y + '" style="left:' + sx +
                        '%;top:' + sy + '%;--depth:' + sc + ';display:' + (vis ? '' : 'none') + ';">' +
                        '<span class="m-icon">' + (alive ? mon.icon : '💀') + '</span>' +
                        '<div class="m-hpwrap"><div class="m-hpbar"><div class="m-hpfill" style="width:' + (alive ?
                            hpPct : 0) + '%;"></div></div></div>' +
                        '<span class="m-name">' + mon.name + (alive ? '' : ' (đã chết)') + '</span>' +
                        '</div>';
                });
                if (zone.boss) {
                    var bossKey = currentZone + '-boss';
                    var bossState = state.monsters[bossKey];
                    if (bossState) {
                        var alive = bossState.alive;
                        var hpPct = bossState.hp / bossState.maxHp * 100;
                        var sx = computeScreenX(SPOTS.boss.x, 1);
                        var sy = computeScreenY(SPOTS.boss.y);
                        var sc = computeScale(SPOTS.boss.y, 1);
                        var vis = isVisible(SPOTS.boss.y);
                        html += '<div class="monster-hotspot boss' + (alive ? '' : ' dead') + '" data-monster="' +
                            bossKey + '" data-wx="' + SPOTS.boss.x + '" data-pf="1" data-wy="' + SPOTS.boss.y +
                            '" style="left:' + sx + '%;top:' + sy + '%;--depth:' + sc + ';display:' + (vis ? '' :
                                'none') + ';">' +
                            '<span class="m-icon">' + (alive ? zone.boss.icon : '💀') + '</span>' +
                            '<div class="m-hpwrap"><div class="m-hpbar"><div class="m-hpfill" style="width:' + (
                                alive ? hpPct : 0) + '%;"></div></div></div>' +
                            '<span class="m-name">' + zone.boss.name + (alive ? '' : ' (đã chết)') + '</span>' +
                            '</div>';
                    }
                }
                return html;
            }

            /* ========================= SVG HELPERS ========================= */
            function houseSvg(level) {
                var chimney = level >= 4 ? '<rect x="40" y="6" width="8" height="14" fill="#7a4f2a"/>' : '';
                var floor2 = level >= 3 ?
                    '<rect x="14" y="14" width="36" height="16" fill="#f3ecd6" stroke="#7a4f2a" stroke-width="2"/>' :
                    '';
                var windows = level >= 2 ?
                    '<rect x="18" y="34" width="8" height="8" fill="#eaf6ff" stroke="#7a4f2a"/><rect x="38" y="34" width="8" height="8" fill="#eaf6ff" stroke="#7a4f2a"/>' :
                    '';
                var flowers = level >= 5 ?
                    '<rect x="12" y="46" width="10" height="4" fill="#d1495b"/><rect x="42" y="46" width="10" height="4" fill="#e0a72e"/>' :
                    '';
                return '<svg viewBox="0 0 64 60" width="100%" height="100%">' + chimney +
                    '<polygon points="6,30 32,8 58,30" fill="#a9713f"/>' + floor2 +
                    '<rect x="14" y="30" width="36" height="20" fill="#fffaf0" stroke="#7a4f2a" stroke-width="2"/>' +
                    windows + '<rect x="27" y="38" width="10" height="12" fill="#7a4f2a"/>' + flowers + '</svg>';
            }

            function shopSvg(level) {
                var goods = level >= 2 ?
                    '<circle cx="20" cy="42" r="4" fill="#e0a72e"/><circle cx="30" cy="42" r="4" fill="#d1495b"/><circle cx="40" cy="42" r="4" fill="#5aa06c"/>' :
                    '<circle cx="30" cy="42" r="4" fill="#e0a72e"/>';
                var n = level >= 3 ? 5 : 3,
                    stripes = '',
                    sw = 50 / n;
                for (var i = 0; i < n; i++)
                    stripes += '<rect x="' + (5 + i * sw) + '" y="14" width="' + sw + '" height="8" fill="' + (i % 2 ===
                        0 ? '#d1495b' : '#fffaf0') + '"/>';
                return '<svg viewBox="0 0 60 50" width="100%" height="100%"><polygon points="2,22 30,8 58,22" fill="#7a4f2a"/><g>' +
                    stripes + '</g><rect x="6" y="22" width="48" height="20" fill="#e9dcbd" stroke="#7a4f2a" stroke-width="2"/>' +
                    goods + '</svg>';
            }

            function mineVisualSvg(level) {
                if (level < 1)
                    return '<svg viewBox="0 0 70 70" width="100%" height="100%"><polygon points="5,62 35,10 65,62" fill="#9c8f72"/><polygon points="20,62 35,36 50,62" fill="#8a7d61"/><circle cx="35" cy="50" r="7" fill="#3a331f"/><text x="35" y="54" font-size="10" text-anchor="middle">🔒</text></svg>';
                return '<svg viewBox="0 0 70 70" width="100%" height="100%"><polygon points="5,62 35,10 65,62" fill="#9c8f72"/><polygon points="20,62 35,34 50,62" fill="#3a331f"/><rect x="17" y="34" width="6" height="28" fill="#7a4f2a"/><rect x="47" y="34" width="6" height="28" fill="#7a4f2a"/><rect x="17" y="32" width="36" height="6" fill="#7a4f2a"/></svg>';
            }

            function landSvg(level) {
                if (level < 1)
                    return '<svg viewBox="0 0 60 46" width="100%" height="100%"><rect x="4" y="28" width="52" height="4" fill="#a9713f"/><rect x="4" y="6" width="4" height="26" fill="#a9713f"/><rect x="52" y="6" width="4" height="26" fill="#a9713f"/><text x="30" y="20" font-size="9" text-anchor="middle">🏷️</text></svg>';
                var t1 = level >= 2 ? '<circle cx="14" cy="20" r="8" fill="#5aa06c"/>' : '';
                var t2 = level >= 3 ? '<circle cx="44" cy="18" r="9" fill="#4f9760"/>' : '';
                return '<svg viewBox="0 0 60 46" width="100%" height="100%"><rect x="4" y="30" width="52" height="10" fill="#8fce85"/>' +
                    t1 + t2 + '<text x="30" y="40" font-size="9" text-anchor="middle">🌷</text></svg>';
            }

            /* ========================= FX ========================= */
            function fireShot(targetEl) {
                if (!targetEl) return;
                var sceneRect = document.getElementById('scene').getBoundingClientRect();
                var originX = sceneRect.left + sceneRect.width / 2;
                var originY = sceneRect.bottom - sceneRect.height * 0.06;
                var tRect = targetEl.getBoundingClientRect();
                var targetX = tRect.left + tRect.width / 2;
                var targetY = tRect.top + tRect.height * 0.35;
                var dx = targetX - originX,
                    dy = targetY - originY;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var angle = Math.atan2(dy, dx) * 180 / Math.PI;
                var tracer = document.createElement('div');
                tracer.className = 'tracer';
                tracer.style.left = originX + 'px';
                tracer.style.top = originY + 'px';
                tracer.style.width = dist + 'px';
                tracer.style.transform = 'rotate(' + angle + 'deg)';
                document.body.appendChild(tracer);
                setTimeout(function() { tracer.remove(); }, 170);
                var flash = document.createElement('div');
                flash.className = 'muzzle-flash';
                flash.style.left = originX + 'px';
                flash.style.top = originY + 'px';
                document.body.appendChild(flash);
                setTimeout(function() { flash.remove(); }, 160);
                var spark = document.createElement('div');
                spark.className = 'hit-spark';
                spark.style.left = targetX + 'px';
                spark.style.top = targetY + 'px';
                document.body.appendChild(spark);
                setTimeout(function() { spark.remove(); }, 260);
                var weapon = document.getElementById('weapon-viewmodel');
                if (weapon) { weapon.classList.add('recoil');
                    setTimeout(function() { weapon.classList.remove('recoil'); }, 170); }
                var scene = document.getElementById('scene');
                scene.classList.add('shake');
                setTimeout(function() { scene.classList.remove('shake'); }, 180);
            }

            function setWeaponIcon() {
                var weapon = document.getElementById('weapon-viewmodel');
                if (!weapon) return;
                var zone = ZONES[currentZone];
                weapon.textContent = (zone.monsters.length || zone.boss) ? '🏹' : '🪓';
            }

            /* ========================= GATHER ========================= */
            function doGather(kind, targetEl) {
                if (actionBusy) return;
                var a = ACTIONS[kind];
                if (a.req === 'mine' && (state.buildings.mine.level < 1 || !state.items.pickaxe)) {
                    showHint(kind === 'stone' || kind === 'gold' ? 'Cần mở khóa Hầm mỏ và mua Cuốc chim (☰ Tùy chọn)' :
                        'Chưa thể thực hiện');
                    return;
                }
                if (state.energy < a.energy) { showHint('Không đủ năng lượng ⚡'); return; }
                state.energy -= a.energy;
                updateHud();
                actionBusy = true;
                updateCrosshair();
                fireShot(targetEl);
                targetEl.classList.add('targeted');
                var weapon = document.getElementById('weapon-viewmodel');
                if (weapon) weapon.classList.add('working');
                setTimeout(function() {
                    resolveGather(a, targetEl);
                    targetEl.classList.remove('targeted');
                    if (weapon) weapon.classList.remove('working');
                    actionBusy = false;
                    updateCrosshair();
                }, a.durMs);
            }

            function resolveGather(a, targetEl) {
                if (a.treasure) {
                    var roll = Math.random();
                    if (roll < 0.12) { state.stats.mapFragments += 1;
                        popFloatAt(targetEl, 'good', '+1 🗺️ Mảnh bản đồ');
                        toast('🗺️ Bạn tìm thấy một mảnh bản đồ!'); } else if (roll < 0.30) { var g = 15 + Math.floor(
                            Math.random() * 20);
                        state.coins += g;
                        popFloatAt(targetEl, 'coin', '+' + g + ' 🪙'); } else { var s = 5 + Math.floor(Math.random() *
                            10);
                        state.coins += s;
                        popFloatAt(targetEl, 'coin', '+' + s + ' 🪙'); }
                    gainXp(6);
                } else {
                    var amount = a.min + Math.floor(Math.random() * (a.max - a.min + 1));
                    var cap = RES_DEF[a.resId].cap;
                    var before = state.resources[a.resId];
                    state.resources[a.resId] = Math.min(cap, before + amount);
                    var gained = state.resources[a.resId] - before;
                    popFloatAt(targetEl, 'good', '+' + gained + ' ' + RES_DEF[a.resId].icon);
                    if (a.resId === 'wood') state.stats.totalWood += gained;
                    gainXp(3);
                }
                saveState();
                updateHud();
                renderZoneScene();
            }

            /* ========================= ATTACK MONSTER ========================= */
            function attackMonster(key, targetEl) {
                if (actionBusy) return;
                var monState = state.monsters[key];
                if (!monState || !monState.alive) { showHint('Quái đã chết, đợi hồi sinh!'); return; }
                var energyCost = 4;
                if (state.energy < energyCost) { showHint('Không đủ năng lượng ⚡'); return; }
                state.energy -= energyCost;
                updateHud();
                actionBusy = true;
                updateCrosshair();
                fireShot(targetEl);
                setTimeout(function() {
                    var damage = 10 + Math.floor(Math.random() * 10);
                    monState.hp -= damage;
                    if (monState.hp <= 0) {
                        monState.hp = 0;
                        monState.alive = false;
                        var zone = ZONES[currentZone];
                        var monDef = null;
                        if (key.indexOf('-boss') !== -1) monDef = zone.boss;
                        else { var id = key.split('-')[1];
                            zone.monsters.forEach(function(m) { if (m.id === id) monDef = m; }); }
                        if (monDef) {
                            state.coins += monDef.rewardCoins;
                            gainXp(monDef.rewardXp);
                            popFloatAt(targetEl, 'coin', '+' + monDef.rewardCoins + ' 🪙');
                            popFloatAt(targetEl, 'good', '+' + monDef.rewardXp + ' XP');
                            toast('💥 Đã hạ ' + monDef.name + '! Nhận ' + monDef.rewardCoins + ' xu, ' + monDef
                                .rewardXp + ' XP');
                        }
                        saveState();
                    } else {
                        popFloatAt(targetEl, 'bad', '-' + damage + ' HP');
                    }
                    renderZoneScene();
                    updateHud();
                    actionBusy = false;
                    updateCrosshair();
                }, 280);
            }

            /* ========================= FARM ========================= */
            function toggleFarmWidget() {
                var w = document.getElementById('farm-widget');
                if (!w) return;
                w.classList.toggle('hidden');
                if (!w.classList.contains('hidden')) renderFarmWidget();
            }

            function renderFarmWidget() {
                var el = document.getElementById('farm-widget');
                if (!el) return;
                if (state.buildings.farm.level < 1) {
                    el.innerHTML = '<div class="empty-note">🔒 Nông trại chưa xây (☰ Tùy chọn > Xây dựng)</div>';
                    return;
                }
                var html = '<h3>🌾 Nông trại</h3><div class="fw-grid">';
                state.plots.forEach(function(p, i) {
                    if (p.state === 'empty') html += '<div class="fw-tile" data-plant="' + i + '">🟫</div>';
                    else if (p.state === 'growing') {
                        var pct = Math.max(0, 100 - (p.remaining / p.total * 100));
                        var icon = pct < 40 ? '🌱' : pct < 75 ? '🌿' : '🌾';
                        html += '<div class="fw-tile" data-water="' + i + '">' + icon +
                            '<div class="fw-bar"><i style="width:' + pct + '%;"></i></div></div>';
                    } else html += '<div class="fw-tile ready" data-harvest="' + i + '">🌾</div>';
                });
                html += '</div>';
                el.innerHTML = html;
                el.onclick = function(evt) {
                    var plant = evt.target.closest('[data-plant]');
                    if (plant) { plantSeed(parseInt(plant.dataset.plant, 10)); return; }
                    var water = evt.target.closest('[data-water]');
                    if (water) { waterPlot(parseInt(water.dataset.water, 10)); return; }
                    var harvest = evt.target.closest('[data-harvest]');
                    if (harvest) { harvestPlot(parseInt(harvest.dataset.harvest, 10), harvest); return; }
                };
            }

            function refreshFarmVisual() {
                var w = document.getElementById('farm-widget');
                if (w && !w.classList.contains('hidden')) renderFarmWidget();
            }

            function refreshGrowthVisual() {}

            function plantSeed(idx) {
                if (state.energy < 2) { showHint('Không đủ năng lượng ⚡'); return; }
                var p = state.plots[idx];
                if (!p || p.state !== 'empty') return;
                state.energy -= 2;
                var totalMs = 9000;
                p.state = 'growing';
                p.remaining = totalMs;
                p.total = totalMs;
                updateHud();
                saveState();
                renderFarmWidget();
            }

            function waterPlot(idx) {
                var p = state.plots[idx];
                if (!p || p.state !== 'growing') return;
                if (!state.items.wateringCan) { showHint('Cần mua Bình tưới nước ở ☰ Tùy chọn > Cửa hàng'); return; }
                p.remaining = Math.max(0, p.remaining - 3000);
                if (p.remaining <= 0) p.state = 'ready';
                saveState();
                renderFarmWidget();
            }

            function harvestPlot(idx, tileEl) {
                var p = state.plots[idx];
                if (!p || p.state !== 'ready') return;
                var amount = 3 + Math.floor(Math.random() * 3);
                var cap = RES_DEF.wheat.cap;
                var before = state.resources.wheat;
                state.resources.wheat = Math.min(cap, before + amount);
                var gained = state.resources.wheat - before;
                var coinGain = 5 + Math.floor(Math.random() * 6);
                state.coins += coinGain;
                state.stats.totalWheat += gained;
                gainXp(8);
                popFloatAt(tileEl, 'good', '+' + gained + ' 🌾');
                popFloatAt(tileEl, 'coin', '+' + coinGain + ' 🪙', 18);
                state.plots[idx] = { state: 'empty' };
                saveState();
                updateHud();
                renderFarmWidget();
            }

            /* ========================= HUD ========================= */
            function updateHud() {
                var c = document.getElementById('hud-coins');
                if (c) c.textContent = state.coins;
                var e = document.getElementById('hud-energy');
                if (e) e.textContent = Math.floor(state.energy);
                var me = document.getElementById('hud-maxenergy');
                if (me) me.textContent = state.maxEnergy;
                var ef = document.getElementById('energy-fill');
                if (ef) ef.style.width = (state.energy / state.maxEnergy * 100) + '%';
                var xf = document.getElementById('xp-fill');
                if (xf) xf.style.width = (state.xp / state.xpToNext * 100) + '%';
                var xl = document.querySelector('.hud-xp .xp-lbl');
                if (xl) xl.textContent = 'Lv.' + state.level;
                Object.keys(RES_DEF).forEach(function(k) { var el = document.getElementById('hb-' + k);
                    if (el) el.textContent = state.resources[k]; });
                updateClock();
                updateQuestBadge();
                setWeaponIcon();
                updateCrosshair();
            }

            function updateQuestBadge() {
                var n = 0;
                QUEST_DEFS.forEach(function(q) { if (!state.quests[q.id] && questProgress(q) >= q.target) n++; });
                var b = document.getElementById('quest-badge');
                if (b) { if (n > 0) { b.textContent = n;
                        b.classList.remove('hidden'); } else b.classList.add('hidden'); }
            }

            /* ========================= MINIMAP ========================= */
            function updateMinimap() {
                var mm = document.getElementById('minimap');
                if (!mm) return;
                var w = mm.clientWidth || 110;
                var h = mm.clientHeight || 78;
                var scaleX = w / 150;
                var scaleY = h / 80;
                var html = '';
                var zone = ZONES[currentZone];
                (zone.monsters || []).forEach(function(mon) {
                    var key = currentZone + '-' + mon.id;
                    var ms = state.monsters[key];
                    if (ms && ms.alive) {
                        var spot = mon.id === zone.monsters[0].id ? SPOTS.monster1 : SPOTS.monster2;
                        var mx = spot.x * scaleX;
                        var my = spot.y * scaleY;
                        html += '<div class="minimap-dot minimap-monster" style="left:' + mx + 'px;top:' + my +
                            'px;"></div>';
                    }
                });
                if (zone.boss) {
                    var bk = currentZone + '-boss';
                    var bs = state.monsters[bk];
                    if (bs && bs.alive) {
                        html += '<div class="minimap-dot minimap-monster" style="left:' + (SPOTS.boss.x * scaleX) +
                            'px;top:' + (SPOTS.boss.y * scaleY) + 'px;"></div>';
                    }
                }
                if (currentZone === 'village') {
                    Object.keys(SPOTS).forEach(function(k) {
                        if (k.indexOf('monster') === -1 && k !== 'boss') {
                            var s = SPOTS[k];
                            html += '<div class="minimap-dot minimap-spot" style="left:' + (s.x * scaleX) +
                                'px;top:' + (s.y * scaleY) + 'px;"></div>';
                        }
                    });
                }
                var px = playerX * scaleX;
                var py = playerZ * scaleY;
                html +=
                    '<div class="minimap-dot minimap-player" style="left:' + px + 'px;top:' + py + 'px;"></div>';
                mm.innerHTML = html;
            }

            /* ========================= XP ========================= */
            function gainXp(amount) {
                state.xp += amount;
                while (state.xp >= state.xpToNext) {
                    state.xp -= state.xpToNext;
                    state.level += 1;
                    state.xpToNext = Math.round(state.xpToNext * 1.35);
                    state.maxEnergy += 5;
                    toast('🎉 Lên cấp ' + state.level + '! Năng lượng tối đa +5');
                }
            }

            /* ========================= QUESTS ========================= */
            function questProgress(q) { var v = state.stats[q.metric]; if (v === undefined) v = 0; return Math.min(q
                    .target, v); }

            /* ========================= PANELS ========================= */
            function openPanel(name) { openPanelName = name;
                renderPanels(); }

            function closePanel() { openPanelName = null;
                renderPanels();
                renderZoneScene(); }

            function renderPanels() {
                var old = document.getElementById('panel-layer');
                if (old) old.remove();
                if (!openPanelName) return;
                var layer = document.createElement('div');
                layer.id = 'panel-layer';
                if (openPanelName === 'quest') {
                    layer.innerHTML = '<div class="modal-backdrop" id="pbackdrop"></div><div class="panel">' +
                        '<div class="panel-header"><h2>📜 Nhiệm vụ</h2><button class="panel-close" id="pclose">✕</button></div>' +
                        '<div class="panel-body" id="panel-body">' + questTabHtml() + '</div></div>';
                } else if (openPanelName === 'options') {
                    layer.innerHTML = '<div class="modal-backdrop" id="pbackdrop"></div><div class="panel">' +
                        '<div class="panel-header"><h2>☰ Tùy chọn</h2><button class="panel-close" id="pclose">✕</button></div>' +
                        '<div class="panel-subnav">' + subtabBtn('build', '🏗️ Xây dựng') + subtabBtn('shop',
                            '🏪 Cửa hàng') + subtabBtn('settings', '⚙️ Cài đặt') + '</div>' +
                        '<div class="panel-body" id="panel-body">' + optionsBodyHtml() + '</div></div>';
                }
                document.body.appendChild(layer);
                document.getElementById('pbackdrop').onclick = closePanel;
                document.getElementById('pclose').onclick = closePanel;
                attachPanelHandlers();
            }

            function subtabBtn(key, label) { return '<button class="panel-subtab' + (optionsSubTab === key ?
                    ' active' : '') + '" data-subtab="' + key + '">' + label + '</button>'; }

            function optionsBodyHtml() { if (optionsSubTab === 'build') return buildTabHtml(); if (optionsSubTab ===
                    'shop') return resourceStripHtml() + shopTabHtml(); return settingsHtml(); }

            function settingsHtml() {
                return '<button class="settings-btn danger" id="btn-quit-game">🚪 Lưu & Thoát về menu</button>' +
                    '<button class="settings-btn" id="btn-reset-game">♻️ Chơi lại từ đầu</button>' +
                    '<div class="empty-note">Làng của bạn được tự động lưu sau mỗi hành động.</div>';
            }

            function resourceStripHtml() {
                var html = '<div class="resource-strip">';
                Object.keys(RES_DEF).forEach(function(k) { var d = RES_DEF[k];
                    html += '<div class="res-chip"><span class="ricon">' + d.icon +
                        '</span><span class="rqty font-mono">' + state.resources[k] + '</span><span class="rcap">/' +
                        d.cap + '</span></div>'; });
                html += '</div>';
                return html;
            }

            function buildTabHtml() {
                var html = '';
                Object.keys(BUILDING_DEFS).forEach(function(key) {
                    var def = BUILDING_DEFS[key];
                    var b = state.buildings[key];
                    var locked = b.level === 0 && def.unlockCoin !== undefined;
                    var atMax = b.level >= def.maxLevel;
                    var costCoins, costResLabel = '',
                        canAfford = true,
                        btnLabel;
                    if (locked) { costCoins = def.unlockCoin;
                        btnLabel = 'Mở khóa (' + costCoins + ' 🪙)';
                        canAfford = state.coins >= costCoins; } else if (atMax) { btnLabel = 'Đã tối đa'; } else {
                        costCoins = Math.round(def.baseCoin * Math.pow(def.growth, b.level - 1));
                        var resReq = {};
                        Object.keys(def.baseRes || {}).forEach(function(rk) { resReq[rk] = Math.round(def.baseRes[
                                rk] * Math.pow(def.growth, b.level - 1)); });
                        var parts = [];
                        Object.keys(resReq).forEach(function(rk) { parts.push(RES_DEF[rk].icon + ' ' + resReq[rk]);
                            if (state.resources[rk] < resReq[rk]) canAfford = false; });
                        costResLabel = parts.join(' · ');
                        if (state.coins < costCoins) canAfford = false;
                        btnLabel = 'Nâng cấp (' + costCoins + ' 🪙' + (costResLabel ? ' · ' + costResLabel : '') +
                            ')';
                    }
                    html += '<div class="building-card"><span class="bicon">' + def.icon + '</span>' +
                        '<div class="building-info"><div class="building-title">' + def.name +
                        ' <span class="lvl-badge">Lv.' + b.level + '/' + def.maxLevel + '</span></div>' +
                        '<div class="building-sub">' + (locked ? 'Chưa mở khóa' : (atMax ? 'Cấp tối đa' :
                            btnLabel)) + '</div></div>' +
                        (atMax ? '' : '<button class="building-btn' + (locked ? ' locked' : '') +
                            '" data-build="' + key + '" ' + (canAfford ? '' : 'disabled') + '>' + (locked ?
                                'Mở khóa' : 'Nâng cấp') + '</button>') +
                        '</div>';
                });
                return html;
            }

            function upgradeBuilding(key) {
                var def = BUILDING_DEFS[key];
                var b = state.buildings[key];
                var locked = b.level === 0 && def.unlockCoin !== undefined;
                if (locked) {
                    if (state.coins < def.unlockCoin) return;
                    state.coins -= def.unlockCoin;
                    b.level = 1;
                    if (key === 'mine') state.stats.mineUnlocked = 1;
                    if (key === 'land') { state.plots.push({ state: 'empty' });
                        state.maxEnergy += 15; }
                    gainXp(30);
                    toast(def.icon + ' Đã mở khóa ' + def.name + '!');
                } else {
                    if (b.level >= def.maxLevel) return;
                    var costCoins = Math.round(def.baseCoin * Math.pow(def.growth, b.level - 1));
                    var resReq = {};
                    Object.keys(def.baseRes || {}).forEach(function(rk) { resReq[rk] = Math.round(def.baseRes[rk] *
                            Math.pow(def.growth, b.level - 1)); });
                    if (state.coins < costCoins) return;
                    for (var rk in resReq) { if (state.resources[rk] < resReq[rk]) return; }
                    state.coins -= costCoins;
                    for (var rk2 in resReq) { state.resources[rk2] -= resReq[rk2]; }
                    b.level += 1;
                    if (key === 'farm') state.plots.push({ state: 'empty' });
                    if (key === 'land') state.maxEnergy += 10;
                    gainXp(20);
                    toast('🔧 ' + def.name + ' đã lên cấp ' + b.level + '!');
                }
                saveState();
                updateHud();
                renderPanels();
                renderZoneScene();
            }

            function questTabHtml() {
                var html = '';
                QUEST_DEFS.forEach(function(q) {
                    var progress = questProgress(q);
                    var claimed = !!state.quests[q.id];
                    var complete = progress >= q.target;
                    var pct = Math.min(100, (progress / q.target) * 100);
                    html += '<div class="quest-card' + (complete ? ' complete' : '') + '"><div class="quest-title">' +
                        q.title + '</div>' +
                        '<div class="quest-desc">' + q.desc + '</div>' +
                        '<div class="quest-progress"><div class="quest-progress-fill" style="width:' + pct +
                        '%;"></div></div>' +
                        '<div class="quest-footer"><span class="quest-reward">🪙 ' + q.rewardCoins + ' · ✨ ' + q
                        .rewardXp + ' XP</span>' +
                        (claimed ? '<span class="quest-status-done">✅ Đã nhận</span>' :
                            '<button class="claim-btn" data-claim="' + q.id + '" ' + (complete ? '' : 'disabled') +
                            '>' + (complete ? 'Nhận thưởng' : progress + '/' + q.target) + '</button>') +
                        '</div></div>';
                });
                return html;
            }

            function claimQuest(qid, cardEl) {
                var q = QUEST_DEFS.filter(function(x) { return x.id === qid; })[0];
                if (!q || state.quests[qid]) return;
                if (questProgress(q) < q.target) return;
                state.quests[qid] = true;
                state.coins += q.rewardCoins;
                gainXp(q.rewardXp);
                popFloatAt(cardEl, 'coin', '+' + q.rewardCoins + ' 🪙');
                toast('📜 Hoàn thành: ' + q.title + '!');
                saveState();
                updateHud();
                renderPanels();
            }

            function shopTabHtml() {
                var html = '';
                SHOP_DEFS.forEach(function(item) {
                    var owned = item.kind === 'tool' && state.items[item.flag];
                    var canAfford = state.coins >= item.cost;
                    html += '<div class="shop-card"><span class="sicon">' + item.icon + '</span>' +
                        '<div class="shop-info"><div class="shop-title">' + item.name + (item.kind === 'consumable' &&
                            state.items[item.flag] > 0 ? ' <span class="lvl-badge">x' + state.items[item.flag] +
                            '</span>' : '') + '</div>' +
                        '<div class="shop-sub">' + item.desc + '</div></div>' +
                        (owned ? '<span class="quest-status-done">✅ Đã mua</span>' :
                            '<button class="shop-btn" data-buy="' + item.id + '" ' + (canAfford ? '' : 'disabled') +
                            '>' + item.cost + ' 🪙</button>') +
                        '</div>';
                });
                return html;
            }

            function buyItem(itemId, cardEl) {
                var item = SHOP_DEFS.filter(function(x) { return x.id === itemId; })[0];
                if (!item) return;
                if (item.kind === 'tool' && state.items[item.flag]) return;
                if (state.coins < item.cost) return;
                state.coins -= item.cost;
                if (item.kind === 'tool') { state.items[item.flag] = true;
                    state.stats.toolsBought = (state.stats.toolsBought || 0) + 1; } else state.items[item.flag] = (
                    state.items[item.flag] || 0) + 1;
                toast(item.icon + ' Đã mua ' + item.name + '!');
                popFloatAt(cardEl, 'bad', '-' + item.cost + ' 🪙');
                saveState();
                updateHud();
                renderPanels();
            }

            function attachPanelHandlers() {
                var body = document.getElementById('panel-body');
                document.querySelectorAll('[data-subtab]').forEach(function(btn) { btn.onclick = function() {
                        optionsSubTab = btn.dataset.subtab;
                        renderPanels(); }; });
                if (!body) return;
                body.onclick = function(evt) {
                    var claimBtn = evt.target.closest('[data-claim]');
                    if (claimBtn) { claimQuest(claimBtn.dataset.claim, claimBtn.closest('.quest-card')); return; }
                    var buildBtn = evt.target.closest('[data-build]');
                    if (buildBtn) { upgradeBuilding(buildBtn.dataset.build); return; }
                    var buyBtn = evt.target.closest('[data-buy]');
                    if (buyBtn) { buyItem(buyBtn.dataset.buy, buyBtn.closest('.shop-card')); return; }
                    if (evt.target.id === 'btn-quit-game') { saveState();
                        stopTick();
                        sendQuit();
                        closePanel();
                        screen = 'menu';
                        render(); return; }
                    if (evt.target.id === 'btn-reset-game') { state = defaultState();
                        playerX = state.player.x;
                        playerZ = state.player.z;
                        playerAngle = state.player.angle;
                        saveState();
                        closePanel();
                        renderPlaying(); return; }
                };
            }

            /* ========================= FX HELPERS ========================= */
            function popFloatAt(el, kind, text, offsetY) {
                var rect = el && el.getBoundingClientRect ? el.getBoundingClientRect() : { left: window.innerWidth / 2,
                    top: window.innerHeight / 2, width: 0 };
                var f = document.createElement('div');
                f.className = 'floatpop ' + kind;
                f.textContent = text;
                f.style.left = (rect.left + rect.width / 2 - 20) + 'px';
                f.style.top = (rect.top - (offsetY || 0)) + 'px';
                document.body.appendChild(f);
                setTimeout(function() { f.remove(); }, 900);
            }

            function toast(msg) {
                var t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(function() { t.remove(); }, 2700);
            }
            var hintTimer = null;

            function showHint(msg) {
                var old = document.getElementById('scene-hint');
                if (old) old.remove();
                var scene = document.getElementById('scene');
                if (!scene) return;
                var h = document.createElement('div');
                h.id = 'scene-hint';
                h.className = 'toast-hint';
                h.textContent = msg;
                scene.appendChild(h);
                if (hintTimer) clearTimeout(hintTimer);
                hintTimer = setTimeout(function() { h.remove(); }, 2000);
            }

            /* ========================= INIT ========================= */
            try { window.parent.postMessage({ type: 'ready' }, '*'); } catch (e) {}
            render();
        })();
    </script>
</body>
</html>
