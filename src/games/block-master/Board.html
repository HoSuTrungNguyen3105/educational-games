                    { text:'Được miễn thuế lần sau!', effect:{ type:'taxExempt' } },
                ],
                questions: [],
            };

            let activeTheme = JSON.parse(JSON.stringify(DEFAULT_THEME));

            // =========================
            // POST MESSAGE PROTOCOL
            // =========================
            let isExternal = false;
            window.addEventListener('message', function(e) {
                const msg = e.data;
                if (!msg || typeof msg !== 'object') return;
                if (msg.type === 'init') {
                    isExternal = true;
                    const d = msg.data || {};
                    if (d.apiBase) API_BASE_URL = d.apiBase;
                    if (d.token) API_TOKEN = d.token;
                    if (d.gameId) API_GAME_ID = d.gameId;
                    if (d.playerName) API_PLAYER_NAME = d.playerName;
                    if (d.theme) {
                        activeTheme = mergeTheme(DEFAULT_THEME, d.theme);
                    }
                    if (d.players && d.players.length) {
                        setupState.names = d.players;
                        setupState.count = d.players.length;
                    }
                    if (d.questions) {
                        activeTheme.questions = d.questions;
                    }
                    if (d.mode === 'teacher') {
                        window.__teacherMode = true;
                    }
                    render();
                } else if (msg.type === 'teacher-action') {
                    handleTeacherAction(msg.data);
                }
            });

            function mergeTheme(base, override) {
                const merged = JSON.parse(JSON.stringify(base));
                for (const key of Object.keys(override)) {
                    if (override[key] !== null && override[key] !== undefined) {
                        merged[key] = override[key];
                    }
                }
                return merged;
            }

            function postToParent(type, data) {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type, data }, '*');
                }
            }

            // =========================
            // API CLIENT
            // =========================
            let API_BASE_URL = '';
            let API_TOKEN = '';
            let API_GAME_ID = '';
            let API_PLAYER_NAME = '';
            let apiSessionId = null;

            async function apiCall(path, options = {}) {
                if (!API_BASE_URL) return null;
                try {
                    const url = API_BASE_URL + path;
                    const headers = { 'Content-Type': 'application/json' };
                    if (API_TOKEN) headers['Authorization'] = 'Bearer ' + API_TOKEN;
                    const res = await fetch(url, {
                        method: options.method || 'GET',
                        headers,
                        body: options.body ? JSON.stringify(options.body) : undefined,
                    });
                    if (!res.ok) return null;
                    const json = await res.json();
                    return json && json.data !== undefined ? json.data : json;
                } catch (e) {
                    console.warn('[API]', path, e.message);
                    return null;
                }
            }

            async function apiGameStart() {
                if (!API_GAME_ID) return;
                const data = await apiCall('/results', {
                    method: 'POST',
                    body: {
                        gameId: API_GAME_ID,
                        playerName: API_PLAYER_NAME,
                        score: 0,
                        correct: 0,
                        totalQuestions: 0,
                        timeUsed: 0,
                        status: 'playing',
                        theme: activeTheme.id || 'viET',
                        players: gameState.players.map(p => ({ name: p.name, money: p.money })),
                    },
                });
                if (data && data._id) apiSessionId = data._id;
            }

            async function apiRecordAction(action, payload) {
                if (!API_GAME_ID || !apiSessionId) return;
                apiCall('/results/' + apiSessionId, {
                    method: 'PUT',
                    body: { action, ...payload, timestamp: Date.now() },
                }).catch(() => {});
            }

            async function apiAnswerQuestion(questionId, selectedOption, isCorrect, reward) {
                if (!API_GAME_ID) return;
                apiCall('/games/answer', {
                    method: 'POST',
                    body: {
                        questionId: questionId,
                        answerId: selectedOption,
                        gameId: API_GAME_ID,
                        correct: isCorrect,
                        reward: reward,
                    },
                }).catch(() => {});
            }

            async function apiSubmitResult(finalData) {
                if (!API_GAME_ID || !apiSessionId) return;
                apiCall('/results/' + apiSessionId, {
                    method: 'PUT',
                    body: {
                        score: finalData.score || 0,
                        correct: finalData.correct || 0,
                        totalQuestions: finalData.totalQuestions || 0,
                        timeUsed: finalData.timeUsed || 0,
                        status: finalData.status || 'finished',
                        xp: finalData.xp || 0,
                        level: finalData.level || 1,
                        money: finalData.money || 0,
                        properties: finalData.properties || 0,
                        winner: finalData.winner || false,
                        players: finalData.players || [],
                    },
                }).catch(() => {});
            }

            async function apiAddXP(amount) {
                if (!API_GAME_ID) return;
                apiCall('/users/me/games/' + API_GAME_ID + '/experience', {
                    method: 'POST',
                    body: { amount },
                }).catch(() => {});
            }

            async function apiIncrementPlay() {
                if (!API_GAME_ID) return;
                apiCall('/users/me/games/' + API_GAME_ID + '/play', {
                    method: 'POST',
                }).catch(() => {});
            }

            // Teacher mode actions
            function handleTeacherAction(action) {
                if (!window.__teacherMode || !action) return;
                const pl = currentPlayer();
                if (!pl) return;
                switch (action.type) {
                    case 'addMoney': changeMoney(pl, action.amount || 100); addLog(`👨‍🏫 Giáo viên cộng $${action.amount || 100} cho ${pl.name}`); render(); break;
                    case 'removeMoney': changeMoney(pl, -(action.amount || 100)); addLog(`👨‍🏫 Giáo viên trừ $${action.amount || 100} của ${pl.name}`); render(); break;
                    case 'moveTo': if (typeof action.position === 'number') { movePlayerTo(pl, action.position, false); } break;
                    case 'sendToJail': sendToJail(pl); finishResolution(pl, false); render(); break;
                    case 'skipTurn': gameState.skipNextTurn = true; addLog(`👨‍🏫 Giáo viên cho ${pl.name} mất lượt.`); render(); break;
                    case 'pause': gameState.phase = 'paused'; addLog('⏸️ Game đã tạm dừng.'); render(); break;
                    case 'resume': gameState.phase = 'rolling'; addLog('▶️ Game tiếp tục.'); render(); break;
                }
            }

            // =========================
            // GAME CONFIG
            // =========================
            const PLAYER_COLORS = ["#e4572e","#1b998b","#3a6bd9","#f4b942","#8e44ad","#2ecc71"];
            const AVATARS = ["🐯","🐸","🐧","🦊","🐼","🐵"];
            const STATION_RENTS = [25, 50, 100, 200];
            const XP_CORRECT = 50;
            const XP_BUY = 20;
            const XP_WIN = 200;

            // =========================
            // GAME STATE
            // =========================
            let gameState = {
                players: [], board: [], currentPlayerIndex: 0, turn: 1,
                phase: 'waiting', dice: [1,1], doublesStreak: 0,
                log: [], winner: null, skipNextTurn: false, extraTurn: false,
            };
            let setupState = { count: 2, names: ['Người chơi 1','Người chơi 2','Người chơi 3','Người chơi 4'] };
            let uiState = { modal: null, toast: '' };
            let diceInterval = null;

            // =========================
            // INITIALIZE GAME
            // =========================
            function buildBoard() {
                return activeTheme.board.map((def, i) => ({ id: i, position: i, ...JSON.parse(JSON.stringify(def)), ownerId: null, level: 0, mortgaged: false }));
            }

            function initGame(playerCount, names) {
                const T = activeTheme;
                gameState.board = buildBoard();
                gameState.players = [];
                for (let i = 0; i < playerCount; i++) {
                    gameState.players.push({
                        id: i, name: names[i] || ('Người chơi ' + (i+1)),
                        avatar: T.playerAvatars[i % T.playerAvatars.length],
                        color: T.playerColors[i % T.playerColors.length],
                        money: T.startMoney, position: 0, properties: [],
                        isBankrupt: false, isInJail: false, jailTurns: 0,
                        getOutOfJailCards: 0, pendingReward: null, bonusIfDouble: 0,
                        taxExempt: false, xp: 0, level: 1, achievements: [],
                    });
                }
                gameState.currentPlayerIndex = 0;
                gameState.turn = 1;
                gameState.phase = 'rolling';
                gameState.dice = [1,1];
                gameState.doublesStreak = 0;
                gameState.log = [];
                gameState.winner = null;
                gameState.skipNextTurn = false;
                gameState.extraTurn = false;
                addLog(`🎮 Ván chơi bắt đầu với ${playerCount} người chơi!`);
                render();
                postToParent('game-start', { players: names.slice(0, playerCount) });
                apiGameStart();
                apiIncrementPlay();
            }

            function addLog(msg) {
                gameState.log.unshift(msg);
                if (gameState.log.length > 80) gameState.log.pop();
            }

            function currentPlayer() { return gameState.players[gameState.currentPlayerIndex]; }

            function addXP(player, amount) {
                player.xp += amount;
                apiAddXP(amount);
                const newLevel = Math.floor(player.xp / 100) + 1;
                if (newLevel > player.level) {
                    player.level = newLevel;
                    addLog(`🎉 ${player.name} lên cấp ${player.level}!`);
                    return true;
                }
                return false;
            }

            // =========================
            // DICE & MOVEMENT
            // =========================
            function rollDice() {
                if (gameState.phase !== 'rolling') return;
                const pl = currentPlayer();
                if (gameState.skipNextTurn) {
                    gameState.skipNextTurn = false;
                    addLog(`⏭️ ${pl.name} bị mất lượt theo hiệu lực.`);
                    endTurn();
                    return;
                }
                gameState.phase = 'moving';
                const rollBtn = document.querySelector('.roll-btn');
                if (rollBtn) rollBtn.disabled = true;
                renderDiceOnly(true);
                if (diceInterval) clearInterval(diceInterval);
                let spins = 0;
                diceInterval = setInterval(() => {
                    gameState.dice = [1+Math.floor(Math.random()*6), 1+Math.floor(Math.random()*6)];
                    renderDiceOnly(true);
                    spins++;
                    if (spins >= 10) {
                        clearInterval(diceInterval);
                        diceInterval = null;
                        const d1 = 1+Math.floor(Math.random()*6);
                        const d2 = 1+Math.floor(Math.random()*6);
                        gameState.dice = [d1, d2];
                        renderDiceOnly(false);
                        handleDiceResult(pl, d1, d2);
                    }
                }, 70);
            }

            function handleDiceResult(pl, d1, d2) {
                renderDiceOnly(false);
                const isDouble = d1 === d2;
                const T = activeTheme;

                if (pl.isInJail) {
                    handleJailRoll(pl, d1, d2, isDouble);
                    return;
                }

                if (isDouble) {
                    gameState.doublesStreak++;
                    if (gameState.doublesStreak >= (T.maxDoublesStreak || 3)) {
                        addLog(`🎲 ${pl.name} tung đôi 3 lần liên tiếp → vào tù!`);
                        sendToJail(pl);
                        gameState.doublesStreak = 0;
                        setTimeout(endTurn, 600);
                        return;
                    }
                } else {
                    gameState.doublesStreak = 0;
                }

                addLog(`🎲 ${pl.name} tung được ${d1} + ${d2} = ${d1+d2}`);
                movePlayerBy(pl, d1+d2, () => { resolveCell(pl, isDouble); });
            }

            function movePlayerBy(pl, steps, onDone) {
                const total = gameState.board.length;
                let remaining = Math.abs(steps);
                const dir = steps >= 0 ? 1 : -1;
                gameState.phase = 'moving';
                function step() {
                    if (remaining <= 0) {
                        gameState.phase = 'resolving';
                        render();
                        if (onDone) onDone();
                        return;
                    }
                    const before = pl.position;
                    pl.position = (pl.position + dir + total) % total;
                    if (dir > 0 && pl.position < before) {
                        changeMoney(pl, activeTheme.salaryPassGo);
                        addLog(`💵 ${pl.name} đi qua KHỞI HÀNH, nhận $${activeTheme.salaryPassGo}`);
                        spawnParticles(pl.position);
                    }
                    remaining--;
                    render();
                    setTimeout(step, 120);
                }
                step();
            }

            function movePlayerTo(pl, targetPos, passGoBonus) {
                const total = gameState.board.length;
                let steps = targetPos - pl.position;
                if (steps < 0) steps += total;
                if (steps === 0) steps = total;
                gameState.phase = 'moving';
                movePlayerBy(pl, steps, () => { resolveCell(pl, false); });
            }

            function spawnParticles(pos) {
                const cellEl = document.querySelector(`.cell[data-pos="${pos}"]`);
                if (!cellEl) return;
                for (let i = 0; i < 8; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = '50%'; p.style.top = '50%';
                    p.style.setProperty('--tx', (Math.random()*80-40)+'px');
                    p.style.setProperty('--ty', (Math.random()*80-40)+'px');
                    p.style.background = ['#f4b942','#f59e2e','#fff'][Math.floor(Math.random()*3)];
                    cellEl.appendChild(p);
                    setTimeout(() => p.remove(), 1000);
                }
            }

            // =========================
            // CELL RESOLUTION
            // =========================
            function resolveCell(pl, wasDouble) {
                const cell = gameState.board[pl.position];
                gameState.phase = 'resolving';
                switch (cell.type) {
                    case 'START': addLog(`${pl.name} dừng tại KHỞI HÀNH.`); finishResolution(pl, wasDouble); break;
                    case 'PROPERTY': case 'STATION': case 'UTILITY': resolveProperty(pl, cell, wasDouble); break;
                    case 'TAX': openModal({ type:'tax', cell, pl, wasDouble }); break;
                    case 'CHANCE': drawCardFromDeck(activeTheme.chanceCards || [], 'Cơ Hội', pl, wasDouble); break;
                    case 'COMMUNITY': drawCardFromDeck(activeTheme.communityCards || [], 'Vận May', pl, wasDouble); break;
                    case 'EVENT': drawEventCard(pl, wasDouble); break;
                    case 'QUESTION': resolveQuestionCell(pl, wasDouble); break;
                    case 'BONUS': resolveBonusCell(pl, cell, wasDouble); break;
                    case 'TELEPORT': resolveTeleportCell(pl, wasDouble); break;
                    case 'REST': resolveRestCell(pl, cell, wasDouble); break;
                    case 'JAIL': addLog(`${pl.name} ghé thăm nhà tù (chỉ tham quan).`); finishResolution(pl, wasDouble); break;
                    case 'GO_TO_JAIL': sendToJail(pl); finishResolution(pl, false); break;
                    case 'FREE_PARKING': addLog(`${pl.name} nghỉ ngơi tại Bãi Đỗ Xe.`); finishResolution(pl, wasDouble); break;
                    default: finishResolution(pl, wasDouble);
                }
                render();
            }

            function finishResolution(pl, wasDouble) {
                if (pl.pendingReward) {
                    pl.pendingReward.turns--;
                    if (pl.pendingReward.turns <= 0) {
                        changeMoney(pl, pl.pendingReward.amount);
                        addLog(`🏦 ${pl.name} nhận $${pl.pendingReward.amount} từ đầu tư.`);
                        pl.pendingReward = null;
                    }
                }
                if (pl.bonusIfDouble > 0 && wasDouble) {
                    changeMoney(pl, pl.bonusIfDouble);
                    addLog(`🔮 ${pl.name} nhận bonus $${pl.bonusIfDouble} vì tung được đôi!`);
                    pl.bonusIfDouble = 0;
                }
                checkBankruptcyNeeded(pl, () => {
                    if ((wasDouble || gameState.extraTurn) && !pl.isInJail && gameState.phase !== 'finished') {
                        gameState.extraTurn = false;
                        gameState.phase = 'rolling';
                        addLog(`✨ ${pl.name} được tung xúc xắc thêm lượt!`);
                    } else {
                        endTurn();
                    }
                    render();
                });
            }

            // =========================
            // NEW CELL TYPES
            // =========================
            function resolveQuestionCell(pl, wasDouble) {
                const questions = activeTheme.questions || [];
                if (!questions.length) {
                    addLog(`📖 ${pl.name} dừng tại ô Câu hỏi (không có câu hỏi).`);
                    finishResolution(pl, wasDouble);
                    return;
                }
                const q = questions[Math.floor(Math.random() * questions.length)];
                openModal({ type: 'question', question: q, pl, wasDouble, answered: false, selected: null, correct: null, timeLeft: q.timeLimit || 15 });
            }

            function resolveBonusCell(pl, cell, wasDouble) {
                const rewards = activeTheme.bonusRewards || [{ text:'Nhận $100!', effect:{ type:'money', amount:100 } }];
                const reward = rewards[Math.floor(Math.random() * rewards.length)];
                applyEffect(reward.effect, pl);
                addLog(`🎁 ${pl.name} nhận thưởng: ${reward.text}`);
                addXP(pl, 10);
                finishResolution(pl, wasDouble);
            }

            function resolveTeleportCell(pl, wasDouble) {
                const randomPos = Math.floor(Math.random() * gameState.board.length);
                addLog(`🌀 ${pl.name} bị teleported!`);
                movePlayerTo(pl, randomPos, false);
            }

            function resolveRestCell(pl, cell, wasDouble) {
                addLog(`😴 ${pl.name} nghỉ ngơi tại "${cell.name}". Mất lượt.`);
                gameState.skipNextTurn = true;
                finishResolution(pl, wasDouble);
            }

            function applyEffect(effect, pl) {
                if (!effect) return;
                const T = activeTheme;
                switch (effect.type) {
                    case 'money': changeMoney(pl, effect.amount); break;
                    case 'jailCard': pl.getOutOfJailCards++; break;
                    case 'taxExempt': pl.taxExempt = true; break;
                    case 'moneyAndSkip': changeMoney(pl, effect.amount); gameState.skipNextTurn = true; break;
                    case 'moneyAndExtraTurn': changeMoney(pl, effect.amount); gameState.extraTurn = true; break;
                    case 'collectFromAll':
                        gameState.players.forEach(o => { if(o.id!==pl.id&&!o.isBankrupt){ o.money-=effect.amount; pl.money+=effect.amount; } });
                        break;
                    case 'payToAll':
                        gameState.players.forEach(o => { if(o.id!==pl.id&&!o.isBankrupt){ o.money+=effect.amount; pl.money-=effect.amount; } });
                        break;
                    case 'moveTo': movePlayerTo(pl, effect.target, !!effect.salary); break;
                    case 'moveBy': movePlayerBy(pl, effect.steps, null); break;
                    case 'jail': sendToJail(pl); break;
                    case 'investment': pl.money-=effect.cost; pl.pendingReward={ amount:effect.reward, turns:effect.turns }; break;
                    case 'losePercent': changeMoney(pl, -Math.round(pl.money * effect.percent / 100)); break;
                    case 'bonusIfDouble': pl.bonusIfDouble = effect.amount; break;
                }
            }

            // =========================
            // PROPERTY LOGIC
            // =========================
            function resolveProperty(pl, cell, wasDouble) {
                if (cell.ownerId === null || cell.ownerId === undefined) {
                    gameState.phase = 'buying';
                    openModal({ type: 'buy', cell, pl, wasDouble });
                    return;
                }
                if (cell.ownerId === pl.id) {
                    addLog(`${pl.name} đứng trên đất của chính mình.`);
                    finishResolution(pl, wasDouble);
                    return;
                }
                if (cell.mortgaged) {
                    addLog(`Đất "${cell.name}" đang bị cầm cố, không thu tiền thuê.`);
                    finishResolution(pl, wasDouble);
                    return;
                }
                const owner = gameState.players.find(p => p.id === cell.ownerId);
                const rent = computeRent(cell, owner);
                addLog(`💸 ${pl.name} trả $${rent} tiền thuê "${cell.name}" cho ${owner.name}`);
                changeMoney(pl, -rent);
                changeMoney(owner, rent);
                checkBankruptcyNeeded(pl, () => { finishResolution(pl, wasDouble); }, rent, owner);
            }

            function computeRent(cell, owner) {
                if (cell.type === 'PROPERTY') return cell.rent[cell.level];
                if (cell.type === 'STATION') {
                    const count = owner.properties.filter(id => gameState.board[id].type === 'STATION').length;
                    return STATION_RENTS[Math.min(count - 1, 3)];
                }
                if (cell.type === 'UTILITY') {
                    const count = owner.properties.filter(id => gameState.board[id].type === 'UTILITY').length;
                    const mult = count >= 2 ? 10 : 4;
                    return (gameState.dice[0] + gameState.dice[1]) * mult;
                }
                return 0;
            }

            function buyProperty(pl, cell, wasDouble) {
                if (pl.money < cell.price) return;
                changeMoney(pl, -cell.price);
                cell.ownerId = pl.id;
                pl.properties.push(cell.id);
                addLog(`🏠 ${pl.name} đã mua "${cell.name}" giá $${cell.price}`);
                addXP(pl, XP_BUY);
                closeModal();
                finishResolution(pl, wasDouble);
            }

            function skipBuy(pl, wasDouble) {
                addLog(`${pl.name} bỏ qua không mua "${gameState.board[pl.position].name}"`);
                closeModal();
                finishResolution(pl, wasDouble);
            }

            function ownsFullGroup(pl, group) {
                const groupCells = gameState.board.filter(c => c.type === 'PROPERTY' && c.group === group);
                return groupCells.length > 0 && groupCells.every(c => c.ownerId === pl.id && !c.mortgaged);
            }

            function buildHouse(pl, cellId) {
                const cell = gameState.board[cellId];
                if (cell.ownerId !== pl.id || cell.type !== 'PROPERTY') return;
                if (!ownsFullGroup(pl, cell.group)) { flashToast('Bạn cần sở hữu trọn bộ nhóm đất để xây nhà!'); return; }
                if (cell.level >= 5) { flashToast('Đất đã đạt cấp Hotel tối đa!'); return; }
                if (pl.money < cell.houseCost) { flashToast('Không đủ tiền để xây nhà!'); return; }
                changeMoney(pl, -cell.houseCost);
                cell.level++;
                addLog(`🏗️ ${pl.name} nâng cấp "${cell.name}" lên cấp ${cell.level}`);
                addXP(pl, 10);
                render();
            }

            function mortgageProperty(pl, cellId) {
                const cell = gameState.board[cellId];
                if (cell.ownerId !== pl.id || cell.mortgaged) return;
                if (cell.type === 'PROPERTY' && cell.level > 0) { flashToast('Bán hết nhà trước khi cầm cố!'); return; }
                cell.mortgaged = true;
                const value = Math.round(cell.price / 2);
                changeMoney(pl, value);
                addLog(`🏦 ${pl.name} cầm cố "${cell.name}", nhận $${value}`);
                render();
            }

            function unmortgageProperty(pl, cellId) {
                const cell = gameState.board[cellId];
                if (cell.ownerId !== pl.id || !cell.mortgaged) return;
                const cost = Math.round(cell.price / 2 * 1.1);
                if (pl.money < cost) { flashToast('Không đủ tiền chuộc lại đất!'); return; }
                changeMoney(pl, -cost);
                cell.mortgaged = false;
                addLog(`✅ ${pl.name} chuộc lại "${cell.name}" giá $${cost}`);
                render();
            }

            function sellHouse(pl, cellId) {
                const cell = gameState.board[cellId];
                if (cell.ownerId !== pl.id || cell.level <= 0) return;
                cell.level--;
                const refund = Math.round(cell.houseCost / 2);
                changeMoney(pl, refund);
                addLog(`🔨 ${pl.name} bán 1 cấp nhà tại "${cell.name}", nhận $${refund}`);
                render();
            }

            // =========================
            // CARDS & EVENTS
            // =========================
            function drawCardFromDeck(deck, label, pl, wasDouble) {
                if (!deck.length) { finishResolution(pl, wasDouble); return; }
                const card = deck[Math.floor(Math.random() * deck.length)];
                openModal({ type: 'card', label, card, pl, wasDouble });
            }

            function drawEventCard(pl, wasDouble) {
                const deck = activeTheme.eventCards || [];
                if (!deck.length) { finishResolution(pl, wasDouble); return; }
                const card = deck[Math.floor(Math.random() * deck.length)];
                openModal({ type: 'eventCard', card, pl, wasDouble });
            }

            function applyCardEffect(effect, pl) {
                if (!effect) return { handled: true };
                const T = activeTheme;
                switch (effect.type) {
                    case 'money': changeMoney(pl, effect.amount); return { handled: true };
                    case 'moveTo': return { handled: false, moveSteps: (() => { let s = effect.target - pl.position; if(s<0) s+=gameState.board.length; if(s===0) s=gameState.board.length; return s; })() };
                    case 'moveBy': return { handled: false, moveSteps: effect.steps };
                    case 'jail': sendToJail(pl); return { handled: true };
                    case 'jailCard': pl.getOutOfJailCards++; addLog(`🎫 ${pl.name} nhận thẻ Ra Tù Miễn Phí.`); return { handled: true };
                    case 'collectFromAll': gameState.players.forEach(o => { if(o.id!==pl.id&&!o.isBankrupt){ o.money-=effect.amount; pl.money+=effect.amount; } }); addLog(`💰 ${pl.name} thu $${effect.amount} từ mỗi người.`); return { handled: true };
                    case 'payToAll': gameState.players.forEach(o => { if(o.id!==pl.id&&!o.isBankrupt){ o.money+=effect.amount; pl.money-=effect.amount; } }); addLog(`💸 ${pl.name} trả $${effect.amount} cho mỗi người.`); return { handled: true };
                    case 'moneyAndSkip': changeMoney(pl, effect.amount); gameState.skipNextTurn = true; return { handled: true };
                    case 'moneyAndExtraTurn': changeMoney(pl, effect.amount); gameState.extraTurn = true; return { handled: true };
                    case 'investment': changeMoney(pl, -effect.cost); pl.pendingReward = { amount: effect.reward, turns: effect.turns }; return { handled: true };
                    case 'challenge': return { handled: false, challenge: { pay: effect.pay, penalty: effect.penalty } };
                    case 'choosePlayerCollect': return { handled: false, choosePlayer: { action: 'collect', amount: effect.amount } };
                    case 'bonusIfDouble': pl.bonusIfDouble = effect.amount; return { handled: true };
                    case 'losePercent': changeMoney(pl, -Math.round(pl.money * effect.percent / 100)); return { handled: true };
                    default: return { handled: true };
                }
            }

            // =========================
            // QUESTION SYSTEM
            // =========================
            let questionTimer = null;
            function startQuestionTimer() {
                if (questionTimer) clearInterval(questionTimer);
                const m = uiState.modal;
                if (!m || m.type !== 'question' || m.answered) return;
                questionTimer = setInterval(() => {
                    m.timeLeft--;
                    const bar = document.querySelector('.timer-fill');
                    if (bar) {
                        const pct = (m.timeLeft / (m.question.timeLimit || 15)) * 100;
                        bar.style.width = pct + '%';
                        bar.style.background = pct > 50 ? '#1fb25a' : pct > 20 ? '#f4b942' : '#e4572e';
                    }
                    if (m.timeLeft <= 0) {
                        clearInterval(questionTimer);
                        questionTimer = null;
                        answerQuestion(null);
                    }
                    renderModal();
                }, 1000);
            }

            function answerQuestion(optionIndex) {
                const m = uiState.modal;
                if (!m || m.type !== 'question' || m.answered) return;
                if (questionTimer) { clearInterval(questionTimer); questionTimer = null; }
                const q = m.question;
                const correct = optionIndex === q.answer;
                m.answered = true;
                m.selected = optionIndex;
                m.correct = correct;
                if (correct) {
                    changeMoney(m.pl, q.reward || 100);
                    addXP(m.pl, XP_CORRECT);
                    addLog(`✅ ${m.pl.name} trả lời đúng! +$${q.reward || 100}`);
                } else {
                    const penalty = Math.round((q.reward || 100) / 2);
                    changeMoney(m.pl, -penalty);
                    addLog(`❌ ${m.pl.name} trả lời sai. -$${penalty}`);
                }
                apiAnswerQuestion(q.id || q._id || '', optionIndex, correct, q.reward || 100);
                apiRecordAction('answer_question', {
                    questionId: q.id || q._id,
                    selected: optionIndex,
                    correct: correct,
                    reward: correct ? (q.reward || 100) : -Math.round((q.reward || 100) / 2),
                    player: m.pl.name,
                });
                renderModal();
                setTimeout(() => {
                    closeModal();
                    checkBankruptcyNeeded(m.pl, () => { finishResolution(m.pl, m.wasDouble); });
                }, 2000);
            }

            // =========================
            // JAIL
            // =========================
            function sendToJail(pl) {
                const jailPos = activeTheme.jailPosition !== undefined ? activeTheme.jailPosition : 10;
                pl.position = gameState.board.findIndex(c => c.type === 'JAIL') !== -1 ? gameState.board.findIndex(c => c.type === 'JAIL') : jailPos;
                pl.isInJail = true;
                pl.jailTurns = 0;
                addLog(`🚔 ${pl.name} bị đưa vào NHÀ TÙ!`);
            }

            function handleJailRoll(pl, d1, d2, isDouble) {
                const T = activeTheme;
                if (isDouble) {
                    addLog(`🎲 ${pl.name} tung đôi ${d1}-${d2}, được ra tù!`);
                    pl.isInJail = false;
                    pl.jailTurns = 0;
                    movePlayerBy(pl, d1+d2, () => resolveCell(pl, false));
                    return;
                }
                pl.jailTurns++;
                addLog(`🎲 ${pl.name} tung ${d1}+${d2}, không phải đôi. (Lượt tù thứ ${pl.jailTurns})`);
                if (pl.jailTurns >= (T.maxJailTurns || 3)) {
                    addLog(`⛓️ ${pl.name} phải nộp phạt $${T.jailFine} để ra tù.`);
                    changeMoney(pl, -T.jailFine);
                    pl.isInJail = false;
                    pl.jailTurns = 0;
                    checkBankruptcyNeeded(pl, () => { resolveCell(pl, false); });
                    return;
                }
                render();
                setTimeout(endTurn, 600);
            }

            function payJailFine(pl) {
                const T = activeTheme;
                if (pl.money < T.jailFine) { flashToast('Không đủ tiền nộp phạt!'); return; }
                changeMoney(pl, -T.jailFine);
                pl.isInJail = false;
                pl.jailTurns = 0;
                addLog(`💵 ${pl.name} nộp $${T.jailFine} để ra tù.`);
                render();
            }

            function useJailCard(pl) {
                if (pl.getOutOfJailCards <= 0) return;
                pl.getOutOfJailCards--;
                pl.isInJail = false;
                pl.jailTurns = 0;
                addLog(`🎫 ${pl.name} dùng thẻ "Ra Tù Miễn Phí".`);
                render();
            }

            // =========================
            // TRADE
            // =========================
            function openTradeModal(pl) {
                openModal({ type:'trade', pl, target:null, offerMoney:0, offerProp:'', wantMoney:0, wantProp:'' });
            }

            function sendTradeOffer(state) {
                const { pl, target, offerMoney, offerProp, wantMoney, wantProp } = state;
                if (!target) { flashToast('Chọn người chơi để giao dịch!'); return; }
                const targetPl = gameState.players.find(p => p.id === Number(target));
                if (!targetPl) return;
                if (pl.money < offerMoney) { flashToast('Bạn không đủ tiền!'); return; }
                if (targetPl.money < wantMoney) { flashToast('Đối phương không đủ tiền!'); return; }
                const summary =
                    `${pl.name} đề nghị giao dịch với ${targetPl.name}:\n\n` +
                    `${pl.name} ĐƯA: $${offerMoney}${offerProp ? ` + ${gameState.board[offerProp].name}` : ''}\n` +
                    `${pl.name} NHẬN: $${wantMoney}${wantProp ? ` + ${gameState.board[wantProp].name}` : ''}\n\n` +
                    `${targetPl.name} có đồng ý không?`;
                closeModal();
                const accepted = window.confirm(summary);
                if (accepted) {
                    pl.money -= offerMoney; targetPl.money += offerMoney;
                    targetPl.money -= wantMoney; pl.money += wantMoney;
                    if (offerProp) { const c = gameState.board[offerProp]; c.ownerId = targetPl.id; pl.properties = pl.properties.filter(id => id != offerProp); targetPl.properties.push(Number(offerProp)); }
                    if (wantProp) { const c = gameState.board[wantProp]; c.ownerId = pl.id; targetPl.properties = targetPl.properties.filter(id => id != wantProp); pl.properties.push(Number(wantProp)); }
                    addLog(`🤝 Giao dịch giữa ${pl.name} và ${targetPl.name} thành công!`);
                } else {
                    addLog(`❌ ${targetPl.name} đã từ chối giao dịch.`);
                }
                render();
            }

            // =========================
            // BANKRUPTCY & WIN
            // =========================
            function changeMoney(pl, amount) { pl.money += amount; if (pl.money < 0) pl.money = Math.round(pl.money); }

            function checkBankruptcyNeeded(pl, onOk, debtAmount, creditor) {
                if (pl.money >= 0) { onOk(); return; }
                openModal({ type: 'bankruptcy-help', pl, onOk, creditor });
                render();
            }

            function attemptResolveDebt(pl) {
                if (pl.money >= 0) {
                    closeModal();
                    const cb = uiState.modal && uiState.modal.onOk;
                    if (cb) cb();
                    render();
                    return true;
                }
                return false;
            }

            function declareBankrupt(pl, creditor) {
                pl.isBankrupt = true;
                addLog(`💀 ${pl.name} đã PHÁ SẢN!`);
                pl.properties.forEach(id => {
                    const c = gameState.board[id];
                    if (creditor) { c.ownerId = creditor.id; c.mortgaged = false; c.level = 0; creditor.properties.push(id); }
                    else { c.ownerId = null; c.mortgaged = false; c.level = 0; }
                });
                pl.properties = [];
                closeModal();
                checkWinCondition();
                if (gameState.phase !== 'finished') endTurn();
                render();
            }

            function checkWinCondition() {
                const alive = gameState.players.filter(p => !p.isBankrupt);
                if (alive.length <= 1) {
                    gameState.phase = 'finished';
                    gameState.winner = alive[0] || null;
                    if (gameState.winner) {
                        addLog(`🏆 ${gameState.winner.name} CHIẾN THẮNG!`);
                        addXP(gameState.winner, XP_WIN);
                    } else {
                        addLog('Ván chơi kết thúc.');
                    }
                    openModal({ type: 'win' });
                    postToParent('game-over', {
                        winner: gameState.winner ? gameState.winner.name : null,
                        players: gameState.players.map(p => ({ name: p.name, money: p.money, level: p.level, xp: p.xp })),
                    });
                }
            }

            // =========================
            // TURN MANAGEMENT
            // =========================
            function endTurn() {
                if (gameState.phase === 'finished') return;
                gameState.doublesStreak = 0;
                let next = gameState.currentPlayerIndex;
                let loopGuard = 0;
                do { next = (next + 1) % gameState.players.length; loopGuard++; }
                while (gameState.players[next].isBankrupt && loopGuard <= gameState.players.length);
                gameState.currentPlayerIndex = next;
                gameState.turn++;
                gameState.phase = 'rolling';
                gameState.extraTurn = false;
                render();
            }

            // =========================
            // UI HELPERS
            // =========================
            function openModal(m) { uiState.modal = m; render(); }
            function closeModal() { if (questionTimer) { clearInterval(questionTimer); questionTimer = null; } uiState.modal = null; render(); }
            function flashToast(msg) { uiState.toast = msg; render(); setTimeout(() => { if(uiState.toast===msg){ uiState.toast=''; render(); } }, 2200); }

            // =========================
            // UI RENDER
            // =========================
            const root = document.getElementById('app');
            function render() {
                if (gameState.players.length === 0) renderSetup();
                else renderGame();
            }

            function renderSetup() {
                const T = activeTheme;
                let rows = '';
                for (let i = 0; i < setupState.count; i++) {
                    rows += `<div class="player-row"><div class="swatch" style="background:${T.playerColors[i%T.playerColors.length]}">${T.playerAvatars[i%T.playerAvatars.length]}</div><input type="text" value="${setupState.names[i]}" oninput="window.__updateName(${i}, this.value)"></div>`;
                }
                let countBtns = '';
                for (let n = 2; n <= 4; n++) {
                    countBtns += `<button class="count-btn ${setupState.count===n?'active':''}" onclick="window.__setCount(${n})">${n}</button>`;
                }
                root.innerHTML = `
          <div class="setup-screen">
            <div class="setup-card">
              <h1>${T.icon} CỜ TỶ PHÚ</h1>
              <p class="sub">${T.name || 'Phiên bản nâng cấp'}</p>
              <div style="text-align:center;font-size:13px;color:#7a6a4a;margin-bottom:10px;font-weight:600;">Số người chơi</div>
              <div class="count-select">${countBtns}</div>
              ${rows}
              <button class="btn btn-primary start-btn" onclick="window.__startGame()">🎲 BẮT ĐẦU CHƠI</button>
            </div>
          </div>`;
            }

            window.__setCount = function(n) { setupState.count = n; renderSetup(); };
            window.__updateName = function(i, val) { setupState.names[i] = val; };
            window.__startGame = function() { initGame(setupState.count, setupState.names.slice(0, setupState.count)); };

            function cellCornerClass(cell) { return ['START','JAIL','FREE_PARKING','GO_TO_JAIL'].includes(cell.type) ? 'corner' : ''; }
            function cellSpecialClass(cell) {
                switch(cell.type) {
                    case 'QUESTION': return 'cell-question';
                    case 'BONUS': return 'cell-bonus';
                    case 'TELEPORT': return 'cell-teleport';
                    case 'REST': return 'cell-rest';
                    default: return '';
                }
            }

            function gridPosFor(i) {
                let row, col;
                if (i<=10) { row=11; col=11-i; }
                else if (i<=20) { row=11-(i-10); col=1; }
                else if (i<=30) { row=1; col=1+(i-20); }
                else { row=1+(i-30); col=11; }
                return { row, col };
            }

            function renderCell(cell, i) {
                const { row, col } = gridPosFor(i);
                const T = activeTheme;
                let inner = '';
                if (cell.type === 'PROPERTY') {
                    const owner = cell.ownerId !== null && cell.ownerId !== undefined ? gameState.players[cell.ownerId] : null;
                    inner = `<div class="grp" style="background:${cell.groupColor || '#ccc'}"></div><div class="cname">${cell.name}${cell.mortgaged?' 🔒':''}</div><div class="cprice">${owner ? '★'.repeat(cell.level) || '$'+cell.price : '$'+cell.price}</div>`;
                } else if (cell.type === 'STATION') {
                    inner = `<div class="cicon">🚉</div><div class="cname">${cell.name}</div><div class="cprice">$${cell.price}</div>`;
                } else if (cell.type === 'UTILITY') {
                    inner = `<div class="cicon">${cell.name.includes('Điện')?'💡':'🚿'}</div><div class="cname">${cell.name}</div><div class="cprice">$${cell.price}</div>`;
                } else if (cell.type === 'TAX') {
                    inner = `<div class="cicon">💰</div><div class="cname">${cell.name}</div><div class="cprice">$${cell.amount}</div>`;
                } else if (cell.type === 'EVENT') {
                    inner = `<div class="cicon">⚡</div><div class="cname">${cell.name}</div><div class="cprice">Sự kiện</div>`;
                } else {
                    const icon = T.cellIcons[cell.type] || ' ';
                    inner = `<div class="cicon">${icon}</div><div class="cname">${cell.name}</div>`;
                    if (cell.desc) inner += `<div class="cprice">${cell.desc.substring(0,20)}</div>`;
                }
                const playersHere = gameState.players.filter(p => p.position === i && !p.isBankrupt);
                const tokensHtml = playersHere.length ? `<div class="tokens-in-cell">${playersHere.map(p=>`<div class="token" style="background:${p.color}" title="${p.name}"></div>`).join('')}</div>` : '';
                const ownedClass = (cell.ownerId !== null && cell.ownerId !== undefined) ? 'owned' : '';
                return `<div class="cell ${cellCornerClass(cell)} ${cellSpecialClass(cell)} ${ownedClass}" style="grid-row:${row};grid-column:${col};" data-pos="${i}">${inner}${tokensHtml}</div>`;
            }

            function renderBoard() {
                let cellsHtml = '';
                gameState.board.forEach((cell, i) => { cellsHtml += renderCell(cell, i); });
                const pl = currentPlayer();
                const canRoll = gameState.phase === 'rolling';
                const rollLabel = pl && pl.isInJail ? '🎲 THỬ RA TÙ' : '🎲 TUNG XÚC XẮC';
                const pct = pl ? Math.min((pl.xp % 100), 100) : 0;
                const centerHtml = `
          <div class="center-panel">
            <h1>CỜ TỶ PHÚ</h1>
            ${pl ? `
            <div class="cur-player"><span class="dot" style="background:${pl.color};color:${pl.color}"></span> ${pl.avatar} ${pl.name} ${pl.isInJail?'🚔':''}</div>
            <div class="dice-row">
              <div class="die" id="die1">${gameState.dice[0]}</div>
              <div class="die" id="die2">${gameState.dice[1]}</div>
            </div>
            <button class="roll-btn" ${canRoll?'':'disabled'} onclick="window.__rollDice()">${rollLabel}</button>
            <div class="money-tag">💵 $${pl.money}</div>
            <div class="xp-tag">⭐ Lv.${pl.level} (${pl.xp} XP)</div>
            ${pl.isInJail ? `
            <div class="center-actions">
              <button class="btn btn-secondary" style="font-size:11px;padding:6px 10px;" onclick="window.__payJailFine()">Trả $${activeTheme.jailFine} ra tù</button>
              ${pl.getOutOfJailCards>0?`<button class="btn btn-teal" style="font-size:11px;padding:6px 10px;" onclick="window.__useJailCard()">Dùng thẻ ra tù</button>`:''}
            </div>` : ''}
            ` : ''}
            <div class="toast-area">${uiState.toast || 'Chờ hành động...'}</div>
          </div>`;
                return `<div class="board">${cellsHtml}${centerHtml}</div>`;
            }

            function renderSidebar() {
                const playersHtml = gameState.players.map(p => `
          <div class="player-card ${p.id===gameState.currentPlayerIndex?'active':''} ${p.isBankrupt?'bankrupt':''}">
            <div class="avatar" style="background:${p.color}">${p.avatar}</div>
            <div class="pname">${p.name}${p.isInJail?' <span class="pjail">🚔 Tù</span>':''}</div>
            <div class="pmoney">$${p.money}</div>
            <div class="pxp">Lv.${p.level}</div>
          </div>`).join('');
                const pl = currentPlayer();
                const myProps = pl ? pl.properties.map(id => gameState.board[id]) : [];
                const propsHtml = myProps.length ? myProps.map(c => `
          <div class="prow" style="background:${c.type==='PROPERTY'?(c.groupColor||'#eee')+'55':'#eee'}">
            <span>${c.name}${c.mortgaged?' 🔒':''}${c.level?` (Lv${c.level})`:''}</span>
            <span style="display:flex;gap:4px;">
              ${c.type==='PROPERTY'&&!c.mortgaged&&c.level<5?`<button class="btn btn-teal" style="padding:2px 6px;font-size:10px;" onclick="window.__buildHouse(${c.id})">🏗️$${c.houseCost}</button>`:''}
              ${c.type==='PROPERTY'&&c.level>0?`<button class="btn btn-secondary" style="padding:2px 6px;font-size:10px;" onclick="window.__sellHouse(${c.id})">➖🏠</button>`:''}
              ${!c.mortgaged?`<button class="btn btn-secondary" style="padding:2px 6px;font-size:10px;" onclick="window.__mortgage(${c.id})">Cầm cố</button>`:`<button class="btn btn-secondary" style="padding:2px 6px;font-size:10px;" onclick="window.__unmortgage(${c.id})">Chuộc</button>`}
            </span>
          </div>`).join('') : '<div style="color:#999;font-size:12px;">Chưa sở hữu tài sản nào.</div>';
                const logHtml = gameState.log.map(l => `<div>${l}</div>`).join('');
                return `
          <div class="sidebar">
            <div class="panel"><h3>👥 Người chơi — Lượt ${gameState.turn}</h3>${playersHtml}</div>
            <div class="panel"><h3>🏘️ Tài sản</h3><div class="props-box">${propsHtml}</div></div>
            <div class="panel"><h3>⚡ Hành động</h3><div class="actions-grid">
              <button class="btn btn-secondary" onclick="window.__openTrade()">🤝 Giao dịch</button>
              ${pl&&pl.isInJail?`<button class="btn btn-teal" onclick="window.__payJailFine()">💵 Trả phạt ra tù</button>`:''}
            </div></div>
            <div class="panel"><h3>📜 Nhật ký</h3><div class="log-box">${logHtml}</div></div>
          </div>`;
            }

            // =========================
            // MODALS
            // =========================
            function renderModal() {
                const m = uiState.modal;
                if (!m) return '';
                const T = activeTheme;

                if (m.type === 'buy') {
                    const { cell, pl, wasDouble } = m;
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>🏠 ${cell.name}</h2>
                      <div class="modal-sub">${cell.type==='PROPERTY'?`Nhóm: <span class="group-swatch" style="background:${cell.groupColor||'#ccc'}"></span>`:cell.type}</div>
                      <div class="modal-body">
                        <div class="price-row"><span>Giá mua</span><b>$${cell.price}</b></div>
                        <div class="price-row"><span>Tiền thuê cơ bản</span><b>$${cell.type==='PROPERTY'?cell.rent[0]:(cell.type==='STATION'?STATION_RENTS[0]:'4x xúc xắc')}</b></div>
                        <div class="price-row"><span>Tiền của bạn</span><b>$${pl.money}</b></div>
                      </div>
                      <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="window.__skipBuy()">BỎ QUA</button>
                        <button class="btn btn-primary" ${pl.money<cell.price?'disabled':''} onclick="window.__buy()">MUA ĐẤT</button>
                      </div>
                    </div></div>`;
                }

                if (m.type === 'tax') {
                    const { cell, pl, wasDouble } = m;
                    if (pl.taxExempt) {
                        pl.taxExempt = false;
                        addLog(`🛡️ ${pl.name} được miễn thuế!`);
                        closeModal();
                        finishResolution(pl, wasDouble);
                        return '';
                    }
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>💰 ${cell.name}</h2>
                      <div class="modal-body">Bạn phải trả <b>$${cell.amount}</b></div>
                      <div class="modal-actions"><button class="btn btn-primary" onclick="window.__payTax(${cell.amount})">ĐỒNG Ý</button></div>
                    </div></div>`;
                }

                if (m.type === 'card') {
                    const { label, card } = m;
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>${label==='Cơ Hội'?'🎴':'🎁'} ${label}</h2>
                      <div class="modal-body">${card.text}</div>
                      <div class="modal-actions"><button class="btn btn-primary" onclick="window.__applyCard()">ĐỒNG Ý</button></div>
                    </div></div>`;
                }

                if (m.type === 'eventCard') {
                    const { card } = m;
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>⚡ Sự kiện đặc biệt</h2>
                      <div class="challenge-emoji">⚡</div>
                      <div class="modal-body">${card.text}</div>
                      <div class="modal-actions"><button class="btn btn-primary" onclick="window.__applyEventCard()">TIẾP TỤC</button></div>
                    </div></div>`;
                }

                if (m.type === 'question') {
                    const q = m.question;
                    const labels = ['A','B','C','D','E','F'];
                    const options = (q.options || []).map((opt, i) => {
                        let cls = 'q-option';
                        if (m.answered) {
                            if (i === q.answer) cls += ' correct';
                            else if (i === m.selected && !m.correct) cls += ' wrong';
                        }
                        return `<button class="${cls}" ${m.answered?'disabled':''} onclick="window.__answerQuestion(${i})">
                          <span class="q-label">${labels[i]}</span><span>${typeof opt === 'string' ? opt : opt.text || opt.content || ''}</span>
                        </button>`;
                    }).join('');
                    const pct = m.timeLeft / (q.timeLimit || 15) * 100;
                    const color = pct > 50 ? '#1fb25a' : pct > 20 ? '#f4b942' : '#e4572e';
                    let resultMsg = '';
                    if (m.answered) {
                        resultMsg = m.correct
                            ? `<div style="text-align:center;font-size:16px;font-weight:700;color:#1fb25a;margin-top:10px;">✅ Chính xác! +$${q.reward||100}</div>`
                            : `<div style="text-align:center;font-size:16px;font-weight:700;color:#e4572e;margin-top:10px;">❌ Sai rồi!</div>`;
                    }
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>📖 Câu hỏi</h2>
                      <div class="timer-bar"><div class="timer-fill" style="width:${pct}%;background:${color}"></div></div>
                      <div class="question-reward">💰 Phần thưởng: $${q.reward || 100}</div>
                      <div class="modal-body" style="font-size:16px;font-weight:600;text-align:center;margin:12px 0;">${q.question || q.content || q.text || ''}</div>
                      <div class="question-options">${options}</div>
                      ${resultMsg}
                      ${m.answered && q.explanation ? `<div style="margin-top:10px;font-size:13px;color:#555;background:#f9f9f9;padding:10px;border-radius:8px;">💡 ${q.explanation}</div>` : ''}
                    </div></div>`;
                }

                if (m.type === 'challenge') {
                    const { pl, challenge } = m;
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>⚡ Thử thách!</h2>
                      <div class="challenge-emoji">🤔</div>
                      <div class="modal-body">
                        ${challenge.pay?`<p>Bạn có thể trả <b>$${challenge.pay}</b> để tránh hình phạt.</p>`:''}
                        ${challenge.penalty==='skip'?'<p>Hoặc mất lượt tiếp theo.</p>':''}
                        ${challenge.penalty==='jail'?'<p>Hoặc vào tù ngay lập tức.</p>':''}
                      </div>
                      <div class="modal-actions">
                        <button class="btn btn-danger" onclick="window.__acceptChallengePenalty()">Chấp nhận hình phạt</button>
                        ${challenge.pay?`<button class="btn btn-primary" onclick="window.__payChallenge()">Trả $${challenge.pay}</button>`:''}
                      </div>
                    </div></div>`;
                }

                if (m.type === 'choosePlayer') {
                    const { pl, action, amount } = m;
                    const others = gameState.players.filter(p => p.id !== pl.id && !p.isBankrupt);
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>👥 Chọn người chơi</h2>
                      <div class="modal-body">Chọn một người chơi để ${action==='collect'?`nhận $${amount} từ họ`:''}</div>
                      <div class="modal-actions" style="flex-direction:column;gap:6px;">
                        ${others.map(o=>`<button class="btn btn-secondary" onclick="window.__choosePlayerAction(${o.id})">${o.avatar} ${o.name}</button>`).join('')}
                      </div>
                    </div></div>`;
                }

                if (m.type === 'bankruptcy-help') {
                    const { pl } = m;
                    return `<div class="modal-overlay"><div class="modal">
                      <h2>⚠️ BẠN KHÔNG ĐỦ TIỀN</h2>
                      <div class="modal-sub">Số dư hiện tại: <b style="color:var(--red)">$${pl.money}</b></div>
                      <div class="modal-body">Hãy bán nhà, cầm cố đất, hoặc giao dịch để có đủ tiền. Nếu vẫn không đủ, bạn sẽ phá sản.</div>
                      <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="window.__openTrade()">🤝 Giao dịch</button>
                        <button class="btn btn-danger" onclick="window.__bankrupt()">TUYÊN BỐ PHÁ SẢN</button>
                        <button class="btn btn-primary" onclick="window.__retryDebt()">Đã xử lý xong</button>
                      </div>
                    </div></div>`;
                }

                if (m.type === 'trade') {
                    const pl = m.pl;
                    const others = gameState.players.filter(p => p.id !== pl.id && !p.isBankrupt);
                    const myProps = pl.properties.map(id => gameState.board[id]);
                    const targetPl = m.target ? gameState.players.find(p => p.id === Number(m.target)) : null;
                    const theirProps = targetPl ? targetPl.properties.map(id => gameState.board[id]) : [];
                    return `<div class="modal-overlay"><div class="modal" style="max-width:460px;">
                      <h2>🤝 Giao dịch</h2>
                      <div class="modal-sub">Chọn người chơi và đề nghị trao đổi</div>
                      <select class="trade-select" onchange="window.__tradeSetField('target', this.value)">
                        <option value="">-- Chọn người chơi --</option>
                        ${others.map(o=>`<option value="${o.id}" ${m.target==o.id?'selected':''}>${o.name}</option>`).join('')}
                      </select>
                      <div class="trade-box">
                        <h4>Bạn đưa</h4>
                        <label>Tiền: <input type="number" min="0" value="${m.offerMoney}" style="width:80px;" oninput="window.__tradeSetField('offerMoney', this.value)"></label>
                        <label>Đất: <select onchange="window.__tradeSetField('offerProp', this.value)"><option value="">(không)</option>${myProps.map(c=>`<option value="${c.id}" ${m.offerProp==c.id?'selected':''}>${c.name}</option>`).join('')}</select></label>
                      </div>
                      <div class="trade-box">
                        <h4>Bạn nhận</h4>
                        <label>Tiền: <input type="number" min="0" value="${m.wantMoney}" style="width:80px;" oninput="window.__tradeSetField('wantMoney', this.value)"></label>
                        <label>Đất: <select onchange="window.__tradeSetField('wantProp', this.value)" ${!targetPl?'disabled':''}><option value="">(không)</option>${theirProps.map(c=>`<option value="${c.id}" ${m.wantProp==c.id?'selected':''}>${c.name}</option>`).join('')}</select></label>
                      </div>
                      <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="window.__closeModal()">HỦY</button>
                        <button class="btn btn-primary" onclick="window.__sendTrade()">GỬI ĐỀ NGHỊ</button>
                      </div>
                    </div></div>`;
                }

                if (m.type === 'win') {
                    const w = gameState.winner;
                    return `<div class="modal-overlay"><div class="modal" style="text-align:center;">
                      <div class="win-emoji">🏆</div>
                      <h2>${w?('CHIẾN THẮNG! '+w.name):'Ván chơi kết thúc'}</h2>
                      ${w?`<div class="modal-body">Tổng tài sản: <b>$${w.money}</b> | Level: <b>${w.level}</b> | XP: <b>${w.xp}</b></div>`:''}
                      <div class="modal-actions" style="justify-content:center;">
                        <button class="btn btn-primary" onclick="window.__restart()">CHƠI LẠI</button>
                      </div>
                    </div></div>`;
                }
                return '';
            }

            function renderGame() {
                root.innerHTML = `
          <div class="game-screen">
            <div class="topbar">
              <h2>${activeTheme.icon||'🎩'} CỜ TỶ PHÚ</h2>
              <div class="turn-info">Lượt: ${gameState.turn} | ${gameState.phase}</div>
              <button class="quit-btn" onclick="window.__quit()">Thoát</button>
            </div>
            <div class="layout">
              <div class="board-area">${renderBoard()}</div>
              ${renderSidebar()}
            </div>
          </div>
          ${renderModal()}`;
            }

            function renderDiceOnly(rolling) {
                const d1 = document.getElementById('die1');
                const d2 = document.getElementById('die2');
                if (d1) { d1.textContent = gameState.dice[0]; d1.classList.toggle('rolling', rolling); }
                if (d2) { d2.textContent = gameState.dice[1]; d2.classList.toggle('rolling', rolling); }
            }

            // =========================
            // EVENT HANDLERS
            // =========================
            window.__rollDice = function() { rollDice(); };
            window.__payJailFine = function() { payJailFine(currentPlayer()); };
            window.__useJailCard = function() { useJailCard(currentPlayer()); };
            window.__buy = function() { const m = uiState.modal; buyProperty(m.pl, m.cell, m.wasDouble); };
            window.__skipBuy = function() { const m = uiState.modal; skipBuy(m.pl, m.wasDouble); };
            window.__payTax = function(amount) {
                const m = uiState.modal; const pl = m.pl;
                changeMoney(pl, -amount);
                addLog(`💰 ${pl.name} đã trả $${amount} tiền thuế.`);
                closeModal();
                checkBankruptcyNeeded(pl, () => { finishResolution(pl, m.wasDouble); });
            };
            window.__applyCard = function() { const m = uiState.modal; closeModal(); const result = applyCardEffect(m.card.effect, m.pl); render(); setTimeout(() => { checkBankruptcyNeeded(m.pl, () => { if (!result.handled && result.moveSteps) { movePlayerBy(m.pl, result.moveSteps, () => resolveCell(m.pl, false)); } else { finishResolution(m.pl, m.wasDouble); } }); }, 250); };
            window.__applyEventCard = function() { const m = uiState.modal; closeModal(); const result = applyCardEffect(m.card.effect, m.pl); render(); if (!uiState.modal) { setTimeout(() => { checkBankruptcyNeeded(m.pl, () => { if (!result.handled) { if (result.challenge) { openModal({ type:'challenge', pl:m.pl, challenge:result.challenge }); } else if (result.choosePlayer) { openModal({ type:'choosePlayer', pl:m.pl, action:result.choosePlayer.action, amount:result.choosePlayer.amount }); } else if (result.moveSteps) { movePlayerBy(m.pl, result.moveSteps, () => resolveCell(m.pl, false)); } else { finishResolution(m.pl, m.wasDouble); } } else { finishResolution(m.pl, m.wasDouble); } }); }, 300); } };
            window.__answerQuestion = function(idx) { answerQuestion(idx); };
            window.__acceptChallengePenalty = function() { const m = uiState.modal; const pl = m.pl; closeModal(); if (m.challenge.penalty === 'skip') gameState.skipNextTurn = true; if (m.challenge.penalty === 'jail') sendToJail(pl); finishResolution(pl, false); };
            window.__payChallenge = function() { const m = uiState.modal; const pl = m.pl; changeMoney(pl, -m.challenge.pay); addLog(`💵 ${pl.name} trả $${m.challenge.pay} để tránh hình phạt.`); closeModal(); finishResolution(pl, false); };
            window.__choosePlayerAction = function(targetId) { const m = uiState.modal; const pl = m.pl; const target = gameState.players.find(p => p.id === targetId); if (!target) return; if (m.action === 'collect') { const amt = m.amount; if (target.money < amt) { flashToast(`${target.name} không đủ tiền!`); return; } target.money -= amt; pl.money += amt; addLog(`💸 ${pl.name} nhận $${amt} từ ${target.name}.`); } closeModal(); finishResolution(pl, false); };
            window.__buildHouse = function(id) { buildHouse(currentPlayer(), id); };
            window.__sellHouse = function(id) { sellHouse(currentPlayer(), id); };
            window.__mortgage = function(id) { mortgageProperty(currentPlayer(), id); };
            window.__unmortgage = function(id) { unmortgageProperty(currentPlayer(), id); };
            window.__openTrade = function() { openTradeModal(currentPlayer()); };
            window.__tradeSetField = function(field, val) { if (!uiState.modal || uiState.modal.type !== 'trade') return; if (field==='offerMoney'||field==='wantMoney') val = Number(val)||0; uiState.modal[field] = val; render(); };
            window.__sendTrade = function() { sendTradeOffer(uiState.modal); };
            window.__closeModal = function() { closeModal(); };
            window.__bankrupt = function() { const m = uiState.modal; declareBankrupt(m.pl, m.creditor); };
            window.__retryDebt = function() { const pl = uiState.modal.pl; attemptResolveDebt(pl); };
            window.__quit = function() {
                if (confirm('Bạn có chắc muốn thoát?')) {
                    postToParent('quit', {});
                    gameState = { players:[], board:[], currentPlayerIndex:0, turn:1, phase:'waiting', dice:[1,1], doublesStreak:0, log:[], winner:null, skipNextTurn:false, extraTurn:false };
                    uiState = { modal:null, toast:'' };
                    render();
                }
            };
            window.__restart = function() {
                gameState = { players:[], board:[], currentPlayerIndex:0, turn:1, phase:'waiting', dice:[1,1], doublesStreak:0, log:[], winner:null, skipNextTurn:false, extraTurn:false };
                uiState = { modal:null, toast:'' };
                render();
            };

            // Signal ready to parent
            postToParent('ready', {});

            // initial render
            render();
        })();
    </script>
</body>
</html>
