<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Cờ Tỷ Phú - Phiên Bản Nâng Cấp</title>
    <style>
        /* ... (toàn bộ style giữ nguyên) ... */
        :root {
            --bg: #0d5c3a;
            --paper: #f4ecd8;
            --ink: #20283A;
            --gold: #f4b942;
            --red: #e4572e;
            --teal: #1b998b;
            --card: #ffffff;
            --line: #d8c9a3;
            --brown: #955436;
            --lblue: #aae0fa;
            --pink: #d93a96;
            --orange: #f7941d;
            --dred: #ed1b24;
            --yellow: #fef200;
            --green: #1fb25a;
            --dblue: #0072bb;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --radius: 14px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
        }
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            transition: all var(--transition);
        }
        .btn {
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transform: translateY(0);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-primary {
            background: var(--gold);
            color: #3a2600;
        }
        .btn-secondary {
            background: #e5e5e5;
            color: #222;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-teal {
            background: var(--teal);
            color: #fff;
        }
        .hidden {
            display: none !important;
        }

        /* Setup Screen */
        .setup-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 20% 20%, #0f6b42, #063a24);
        }
        .setup-card {
            background: var(--paper);
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: var(--shadow);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .setup-card h1 {
            text-align: center;
            font-size: 32px;
            margin: 0 0 6px;
            color: var(--red);
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.08);
        }
        .setup-card .sub {
            text-align: center;
            color: #7a6a4a;
            margin-bottom: 24px;
            font-size: 15px;
        }
        .count-select {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .count-btn {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #fff;
            border: 2px solid var(--line);
            font-size: 20px;
            font-weight: 700;
            transition: all var(--transition);
        }
        .count-btn.active {
            background: var(--teal);
            color: #fff;
            border-color: var(--teal);
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(27, 153, 139, 0.4);
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            background: #fff;
            border-radius: 14px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            transition: all var(--transition);
        }
        .player-row:focus-within {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(27, 153, 139, 0.2);
        }
        .player-row .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .player-row input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            color: var(--ink);
        }
        .start-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            font-size: 18px;
            border-radius: 40px;
            background: linear-gradient(135deg, #f4b942, #f59e2e);
            box-shadow: 0 10px 24px rgba(244, 185, 66, 0.5);
        }

        /* Game Screen */
        .game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(6, 48, 30, 0.95);
            color: #fff;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            z-index: 50;
        }
        .topbar h2 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 1px;
            color: var(--gold);
            font-weight: 800;
        }
        .topbar .turn-info {
            font-size: 12px;
            opacity: 0.85;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .topbar .quit-btn {
            background: var(--red);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 14px;
            padding: 14px;
            min-height: 0;
            overflow: hidden;
        }
        @media(max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                overflow-y: auto;
            }
        }

        .board-area {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            position: relative;
        }
        .board {
            aspect-ratio: 1/1;
            width: 100%;
            max-width: 700px;
            max-height: 78vh;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            background: #0a7a4d;
            border-radius: 18px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.05);
            position: relative;
            transition: all 0.3s;
        }
        .cell {
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #f7f2e3;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            font-size: 7px;
            text-align: center;
            padding: 2px 1px;
            transition: all 0.2s;
            cursor: default;
        }
        .cell:hover {
            background: #fffef5;
            z-index: 2;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            transform: scale(1.03);
        }
        .cell .grp {
            height: 14%;
            width: 100%;
            flex-shrink: 0;
        }
        .cell .cname {
            font-weight: 700;
            line-height: 1.05;
            padding: 1px 2px;
            word-break: break-word;
            font-size: 6.5px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
        }
        .cell .cprice {
            font-size: 6px;
            color: #555;
            font-weight: 600;
        }
        .cell .cicon {
            font-size: 17px;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
        }
        .cell.corner {
            font-size: 8px;
            background: #f0e6d3;
        }
        .cell.corner .cicon {
            font-size: 22px;
        }
        .cell.owned {
            outline: 2px solid var(--gold);
            outline-offset: -2px;
        }
        .tokens-in-cell {
            position: absolute;
            bottom: 2px;
            left: 2px;
            right: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            justify-content: center;
            pointer-events: none;
        }
        .token {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: bounceIn 0.4s;
        }
        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            60% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }

        .center-panel {
            grid-column: 2/11;
            grid-row: 2/11;
            background: radial-gradient(circle at 50% 30%, #12734a, #0a4a2f);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .center-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
            animation: rotateGlow 12s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .center-panel h1 {
            color: var(--gold);
            font-size: clamp(20px, 3.5vw, 32px);
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            font-style: italic;
            font-weight: 900;
            position: relative;
            z-index: 1;
        }
        .center-panel .cur-player {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: clamp(13px, 1.8vw, 17px);
            position: relative;
            z-index: 1;
        }
        .cur-player .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 12px currentColor;
        }
        .dice-row {
            display: flex;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .die {
            width: clamp(38px, 5.5vw, 52px);
            height: clamp(38px, 5.5vw, 52px);
            background: #fff;
            color: #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 3.5vw, 30px);
            font-weight: 800;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s;
        }
        .die.rolling {
            animation: diceSpin 0.08s infinite;
        }
        @keyframes diceSpin {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.1);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }
        .roll-btn {
            padding: 12px 30px;
            font-size: clamp(14px, 1.8vw, 17px);
            border-radius: 40px;
            background: linear-gradient(135deg, #f4b942, #f59e2e);
            color: #3a2600;
            font-weight: 800;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .roll-btn:not(:disabled):hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
        }
        .money-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(16px, 2.5vw, 22px);
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        .center-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .toast-area {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            font-size: 11px;
            color: #fff;
            text-align: center;
            min-height: 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 4px 8px;
            backdrop-filter: blur(6px);
            z-index: 5;
            transition: all 0.4s;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }
        .panel {
            background: var(--paper);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .panel h3 {
            margin: 0 0 10px;
            font-size: 13px;
            color: #7a4a1a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 12px;
            margin-bottom: 6px;
            background: #fff;
            border: 2px solid transparent;
            transition: all 0.25s;
            cursor: default;
        }
        .player-card.active {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(27, 153, 139, 0.25);
            background: #f0fffa;
        }
        .player-card.bankrupt {
            opacity: 0.4;
            filter: grayscale(1);
        }
        .player-card .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .player-card .pname {
            font-weight: 700;
            font-size: 13px;
            flex: 1;
        }
        .player-card .pmoney {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            color: var(--teal);
        }
        .player-card .pjail {
            font-size: 10px;
            color: var(--red);
        }
        .log-box {
            font-size: 11px;
            line-height: 1.5;
            max-height: 180px;
            overflow-y: auto;
            color: #4a3d20;
            scrollbar-width: thin;
        }
        .log-box div {
            border-bottom: 1px dashed var(--line);
            padding: 3px 0;
            animation: fadeIn 0.2s;
        }
        .props-box {
            font-size: 11px;
            max-height: 180px;
            overflow-y: auto;
        }
        .props-box .prow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 6px;
            border-radius: 8px;
            margin-bottom: 4px;
            gap: 4px;
            flex-wrap: wrap;
            transition: background 0.2s;
        }
        .props-box .prow:hover {
            background: rgba(0, 0, 0, 0.03);
        }
        .actions-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .actions-grid .btn {
            width: 100%;
            text-align: center;
            justify-content: center;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 15, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 16px;
            backdrop-filter: blur(4px);
            animation: fadeInOverlay 0.2s;
        }
        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 85vh;
            overflow-y: auto;
        }
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal h2 {
            margin: 0 0 4px;
            font-size: 20px;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal .modal-sub {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }
        .modal .modal-body {
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 18px;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }
        .group-swatch {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: -2px;
        }
        .trade-select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            background: #fafafa;
            transition: border 0.2s;
        }
        .trade-select:focus {
            border-color: var(--teal);
            outline: none;
        }
        .trade-box {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fefefe;
        }
        .trade-box h4 {
            margin: 0 0 8px;
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }
        .trade-box label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .trade-box input,
        .trade-box select {
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 13px;
            background: #fff;
        }
        .win-emoji {
            font-size: 64px;
            text-align: center;
            animation: bounceIn 0.6s;
        }
        .challenge-emoji {
            font-size: 48px;
            text-align: center;
            margin-bottom: 8px;
            animation: bounceIn 0.5s;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly 1s ease-out forwards;
        }
        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        @media(max-width: 700px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
                gap: 8px;
                padding: 8px;
            }
            .board {
                max-height: 60vh;
                aspect-ratio: 1/1;
            }
            .cell .cname {
                font-size: 5px;
            }
            .cell .cprice {
                font-size: 5px;
            }
            .cell .cicon {
                font-size: 14px;
            }
            .topbar h2 {
                font-size: 14px;
            }
            .sidebar {
                flex-direction: column;
                max-height: 40vh;
            }
            .panel {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        (function() {
            "use strict";

            // =========================
            // GAME CONFIG
            // =========================
            const STARTING_MONEY = 1500;
            const SALARY_PASS_GO = 200;
            const JAIL_POSITION = 10;
            const GO_TO_JAIL_POSITION = 30;
            const JAIL_FINE = 50;
            const MAX_JAIL_TURNS = 3;
            const MAX_DOUBLES_STREAK = 3;
            const PLAYER_COLORS = ["#e4572e", "#1b998b", "#3a6bd9", "#f4b942", "#8e44ad", "#2ecc71"];
            const AVATARS = ["🐯", "🐸", "🐧", "🦊", "🐼", "🐵"];
            const STATION_RENTS = [25, 50, 100, 200];

            const GROUP_COLORS = {
                brown: "var(--brown)",
                lblue: "var(--lblue)",
                pink: "var(--pink)",
                orange: "var(--orange)",
                dred: "var(--dred)",
                yellow: "var(--yellow)",
                green: "var(--green)",
                dblue: "var(--dblue)"
            };

            function P(name, price, baseRent, group) {
                return {
                    name,
                    type: "PROPERTY",
                    price,
                    group,
                    ownerId: null,
                    level: 0,
                    mortgaged: false,
                    rentTable: [baseRent, baseRent * 5, baseRent * 15, baseRent * 45, baseRent * 70, baseRent * 90],
                    houseCost: Math.round(price / 2)
                };
            }

            function S(name) { return { name, type: "STATION", price: 200, ownerId: null, mortgaged: false }; }

            function U(name) { return { name, type: "UTILITY", price: 150, ownerId: null, mortgaged: false }; }

            function T(name, amount) { return { name, type: "TAX", amount }; }

            function E(name, desc) { return { name, type: "EVENT", desc }; }

            const BOARD_DEF = [
                { name: "KHỞI HÀNH", type: "START" },

            const CELL_ICON = {

            const CHANCE_CARDS = [

            const COMMUNITY_CARDS = [
