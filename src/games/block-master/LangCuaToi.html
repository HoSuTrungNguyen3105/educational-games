<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Làng Nhỏ Của Tôi · Phiên bản Hiện Đại</title>
  <style>
    /* -------- RESET & FONTS -------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --soil: #d9a066;
      --soil-dark: #b67e42;
      --soil-light: #edc79a;
      --grass: #6aaf72;
      --grass-dark: #4a8a54;
      --grass-light: #8ed48a;
      --wood: #9c7a4a;
      --wood-dark: #785a2e;
      --wood-light: #c0a06a;
      --gold: #f5c842;
      --gold-dark: #d4a820;
      --panel: #fefaf0;
      --line: #d4b88a;
      --ink: #2a1f10;
      --ink-dim: #8a7a5a;
      --danger: #d94a5a;
      --water: #5ab0d0;
      --shadow: rgba(20, 12, 4, 0.35);
      --radius: 16px;
      --radius-sm: 10px;
      --hud-bg: rgba(20, 12, 4, 0.65);
    }
    html,
    body {
      height: 100%;
      background: #1a1208;
      color: var(--ink);
      font-family: 'Segoe UI', 'Nunito', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #2e2318;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      touch-action: manipulation;
    }
    .hidden {
      display: none !important;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
    }

    /* -------- GAME SCREEN -------- */
    .game-screen {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #4a3a2a;
    }
    .scene {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 240, 200, 0.12), transparent 60%),
        linear-gradient(175deg, var(--soil-light) 0%, var(--soil) 50%, var(--soil-dark) 100%);
      overflow: hidden;
      will-change: transform;
    }
    .scene::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.3) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(100, 60, 20, 0.2) 1px, transparent 1.5px);
      background-size: 30px 30px, 40px 40px;
      background-position: 0 0, 15px 20px;
    }

    /* grass edges */
    .grass-edge {
      position: absolute;
      left: 0;
      right: 0;
      height: 8%;
      z-index: 1;
      pointer-events: none;
    }
    .grass-edge.top {
      top: 0;
      background: linear-gradient(180deg, var(--grass-light), var(--grass));
      clip-path: polygon(0 0, 100% 0, 100% 55%, 96% 100%, 92% 50%, 88% 100%, 84% 50%, 80% 100%, 76% 50%, 72% 100%, 68% 50%, 64% 100%, 60% 50%, 56% 100%, 52% 50%, 48% 100%, 44% 50%, 40% 100%, 36% 50%, 32% 100%, 28% 50%, 24% 100%, 20% 50%, 16% 100%, 12% 50%, 8% 100%, 4% 50%, 0 100%);
    }
    .grass-edge.bottom {
      bottom: 0;
      background: linear-gradient(0deg, var(--grass-light), var(--grass));
      clip-path: polygon(0 100%, 100% 100%, 100% 45%, 96% 0, 92% 50%, 88% 0, 84% 50%, 80% 0, 76% 50%, 72% 0, 68% 50%, 64% 0, 60% 50%, 56% 0, 52% 50%, 48% 0, 44% 50%, 40% 0, 36% 50%, 32% 0, 28% 50%, 24% 0, 20% 50%, 16% 0, 12% 50%, 8% 0, 4% 50%, 0 0);
    }

    /* -------- POND (decor) -------- */
    .pond {
      position: absolute;
      border-radius: 50% 50% 46% 46%/60% 60% 40% 40%;
      background: linear-gradient(180deg, #8fd8f0, #4a9ab8);
      border: 4px solid #d8b878;
      box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.20);
      z-index: 2;
      pointer-events: none;
    }

    /* -------- FARM PATCH -------- */
    .farm-patch {
      position: absolute;
      padding: 6px;
      border-radius: 14px;
      background: rgba(80, 50, 20, 0.30);
      border: 3px solid var(--wood-dark);
      z-index: 2;
      backdrop-filter: blur(2px);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.15);
      pointer-events: auto;
    }
    .fp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .fp-tile {
      width: 14vw;
      max-width: 54px;
      aspect-ratio: 1/1;
      border-radius: 8px;
      background: #8a5a2e;
      border: 2px solid #6b431f;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.12s, box-shadow 0.15s;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.20);
      font-size: 1.6rem;
    }
    .fp-tile:active {
      transform: scale(0.92);
    }
    .fp-tile .fp-bar {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 10%;
      height: 4px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.30);
      overflow: hidden;
    }
    .fp-tile .fp-bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #b0e8a0, #7ad06a);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .fp-tile.ready {
      background: #7a9a3f;
      animation: pulseGlow 1.2s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(100, 200, 80, 0.3);
    }
    @keyframes pulseGlow {
      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 12px rgba(100, 200, 80, 0.25);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 24px rgba(100, 200, 80, 0.5);
      }
    }

    /* -------- HOTSPOT (cây, đá, vàng, đào) -------- */
    .hotspot {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: pointer;
      z-index: 3;
      transition: filter 0.2s, transform 0.15s;
      touch-action: manipulation;
      pointer-events: auto;
    }
    .hotspot:active {
      transform: translate(-50%, -100%) scale(0.94);
    }
    .hotspot .hp-tag {
      position: absolute;
      left: 50%;
      bottom: 100%;
      transform: translateX(-50%);
      margin-bottom: 4px;
      font-weight: 700;
      font-size: 0.5rem;
      color: #fff;
      background: rgba(30, 18, 8, 0.70);
      border-radius: 8px;
      padding: 2px 8px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
    .hotspot:hover .hp-tag,
    .hotspot:active .hp-tag {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
    .hotspot.locked {
      filter: grayscale(0.6) brightness(0.8) saturate(0.4);
      cursor: not-allowed;
    }
    .hotspot.energy-low {
      opacity: 0.5;
    }
    .hotspot.decor {
      cursor: pointer;
    }

    /* -------- MONSTER -------- */
    .monster-hotspot {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: pointer;
      z-index: 3;
      text-align: center;
      transition: transform 0.15s;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .monster-hotspot:active {
      transform: translate(-50%, -100%) scale(0.92);
    }
    .monster-hotspot .monster-icon {
      font-size: 3rem;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.30));
      display: block;
      margin-bottom: 2px;
    }
    .monster-hotspot .monster-hp-bar {
      width: 60px;
      height: 5px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      overflow: hidden;
      margin: 2px auto 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .monster-hotspot .monster-hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #e74c3c, #f1c40f);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .monster-hotspot .monster-name {
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 6px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 2px;
      backdrop-filter: blur(2px);
    }
    .monster-hotspot.boss .monster-icon {
      font-size: 4rem;
    }
    .monster-hotspot.boss .monster-hp-bar {
      width: 90px;
      height: 7px;
    }
    .monster-hotspot.boss .monster-name {
      font-size: 0.75rem;
      background: rgba(180, 30, 30, 0.6);
    }
    .monster-hotspot.dead {
      opacity: 0.5;
      pointer-events: none;
    }

    /* -------- VILLAGER -------- */
    .villager-pos {
      position: absolute;
      transform: translate(-50%, -100%);
      z-index: 6;
      pointer-events: none;
      transition: left 0.25s ease, top 0.25s ease;
      will-change: left, top;
    }
    .villager-pos.face-left .villager-svg {
      transform: scaleX(-1);
    }
    .villager-svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.30));
    }
    .villager-pos:not(.moving) .villager-body {
      animation: idleBob 1.8s ease-in-out infinite;
    }
    .villager-pos.moving .villager-body {
      animation: walkBob 0.3s ease-in-out infinite;
    }
    @keyframes idleBob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }
    @keyframes walkBob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }
    /* tool bubble */
    .tool-bubble {
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 14px;
    }
    .villager-pos.act .tool-bubble {
      opacity: 1;
    }
    .villager-pos.act-swing .arm-right {
      animation: swingArm 0.3s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: top center;
    }
    .villager-pos.act-dig .arm-left,
    .villager-pos.act-dig .arm-right {
      animation: digArms 0.38s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: top center;
    }
    .villager-pos.act-water .arm-right {
      animation: waterTilt 0.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: top center;
    }
    .villager-pos.act-bend .villager-body {
      animation: bendDown 0.5s ease-in-out infinite;
    }
    .villager-pos.act-attack .arm-right {
      animation: attackArm 0.25s ease-in-out 2;
      transform-box: fill-box;
      transform-origin: top center;
    }
    @keyframes attackArm {
      0%,
      100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-60deg) scaleX(1.2);
      }
    }
    @keyframes swingArm {
      0%,
      100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-48deg);
      }
    }
    @keyframes digArms {
      0%,
      100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(32deg);
      }
    }
    @keyframes waterTilt {
      0%,
      100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-28deg);
      }
    }
    @keyframes bendDown {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(4px);
      }
    }

    /* -------- HUD -------- */
    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 10px;
      pointer-events: none;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hud-top>* {
      pointer-events: auto;
    }
    .hud-pill {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--hud-bg);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.10);
      border-radius: 14px;
      padding: 0.2rem 0.65rem;
      font-size: 0.7rem;
      font-weight: 600;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .hud-pill.gold {
      color: var(--gold);
    }
    .hud-energybar {
      width: 48px;
      height: 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.20);
      overflow: hidden;
      flex-shrink: 0;
    }
    .hud-energyfill {
      height: 100%;
      background: linear-gradient(90deg, #f5c842, #e8a030);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .hud-xp {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--hud-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0.15rem 0.6rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }
    .hud-xp .xp-bar {
      width: 56px;
      height: 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.20);
      overflow: hidden;
    }
    .hud-xp .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #8ad07a, #4a9a5a);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .hud-xp .xp-lbl {
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
    }
    .hud-iconrow {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .hud-icon-btn {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--hud-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #fff;
      backdrop-filter: blur(6px);
      transition: transform 0.12s, background 0.2s;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }
    .hud-icon-btn:active {
      transform: scale(0.92);
    }
    .hud-icon-btn .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--danger);
      color: #fff;
      font-size: 0.5rem;
      font-weight: 800;
      border-radius: 10px;
      min-width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 2px 6px rgba(217, 74, 90, 0.4);
    }

    /* -------- HOTBAR -------- */
    .hotbar {
      position: absolute;
      left: 50%;
      bottom: 62px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 4px;
      background: var(--hud-bg);
      border: 2px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 4px 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
      pointer-events: none;
    }
    .hotbar .slot {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 250, 240, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      pointer-events: auto;
      transition: background 0.2s;
    }
    .hotbar .slot .sicon2 {
      font-size: 1.1rem;
      line-height: 1;
    }
    .hotbar .slot .sqty {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      font-weight: 600;
      margin-top: 1px;
      opacity: 0.9;
    }

    /* -------- ZONE NAV -------- */
    .zone-nav {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 21;
      display: flex;
      gap: 6px;
      background: var(--hud-bg);
      border: 2px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 4px 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
      pointer-events: none;
    }
    .zone-nav>* {
      pointer-events: auto;
    }
    .zone-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3px 8px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      transition: background 0.2s, transform 0.12s;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid transparent;
      min-width: 42px;
    }
    .zone-btn .zicon {
      font-size: 1.2rem;
      line-height: 1.2;
    }
    .zone-btn .zlabel {
      font-size: 0.45rem;
      opacity: 0.8;
      margin-top: 1px;
    }
    .zone-btn.active {
      background: rgba(255, 215, 0, 0.15);
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
    }
    .zone-btn:active {
      transform: scale(0.92);
    }

    /* -------- TOAST / HINT / FLOATING TEXT -------- */
    .toast-hint {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(20, 12, 4, 0.75);
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.4rem 1rem;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      animation: hintIn 0.3s ease;
    }
    @keyframes hintIn {
      0% {
        transform: translateX(-50%) translateY(-10px);
        opacity: 0;
      }
      100% {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }
    .floatpop {
      position: fixed;
      pointer-events: none;
      font-weight: 800;
      font-size: 1rem;
      z-index: 200;
      animation: floatUp 0.9s ease forwards;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      font-family: 'Segoe UI', sans-serif;
    }
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-52px) scale(1.08);
      }
    }
    .floatpop.good {
      color: #b8f0a8;
    }
    .floatpop.coin {
      color: var(--gold);
    }
    .floatpop.bad {
      color: #ffb0b8;
    }
    .toast {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      z-index: 300;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 0.6rem 1.2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: toastIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2), toastOut 0.3s ease 2.4s forwards;
      max-width: 90vw;
    }
    @keyframes toastIn {
      0% {
        transform: translate(-50%, -20px);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }
    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translate(-50%, -12px);
      }
    }

    /* -------- PANEL (modal) -------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 8, 4, 0.55);
      z-index: 40;
      backdrop-filter: blur(3px);
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
    .panel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      width: min(92vw, 420px);
      max-height: 80vh;
      background: var(--panel);
      border: 3px solid var(--wood);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      z-index: 41;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: panelIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    }
    @keyframes panelIn {
      0% {
        transform: translate(-50%, -50%) scale(0.92) translateY(12px);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1) translateY(0);
        opacity: 1;
      }
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      background: linear-gradient(135deg, var(--wood-light), var(--wood));
      color: #fff;
      flex-shrink: 0;
    }
    .panel-header h2 {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.4rem;

      grid-row: 1;

      grid-column: 2;
      grid-row: 3;

    .dpad .left {

      grid-row: 2;

    .dpad .right {
      grid-column: 3;
      grid-row: 2;

      grid-row: 2;

      }
      .zone-nav {
        bottom: 8px;
        padding: 3px 6px;
        gap: 3px;
      }
      .zone-btn {
        min-width: 34px;
        padding: 2px 4px;
        font-size: 0.5rem;
      }
      .zone-btn .zicon {
        font-size: 1rem;
      }
      .zone-btn .zlabel {
        font-size: 0.4rem;
      }
      .fp-tile {
        max-width: 44px;
        font-size: 1.2rem;
      }
      .hud-pill {
        font-size: 0.6rem;
        padding: 0.15rem 0.4rem;
      }
      .hud-energybar {
        width: 36px;
      }
      .hud-xp .xp-bar {
        width: 44px;
      }
      .hud-icon-btn {
        width: 30px;

        font-size: 0.85rem;
      }
      .monster-hotspot .monster-icon {
        font-size: 2.4rem;
      }
      .monster-hotspot .monster-hp-bar {
        width: 44px;
      }
      .monster-hotspot.boss .monster-icon {
        font-size: 3rem;
      }

        width: 64px;
      }
    }
    @media (max-width: 380px) {
      .dpad {
        grid-template-columns: repeat(3, 32px);
        grid-template-rows: repeat(3, 32px);
        bottom: 100px;
        left: 4px;
      }
      .dpad>* {
        font-size: 0.8rem;
        border-radius: 8px;
      }
      .hotbar .slot {
        width: 28px;
        height: 28px;
      }
      .hotbar .slot .sicon2 {
        font-size: 0.7rem;
      }
      .hotbar .slot .sqty {
        font-size: 0.4rem;
      }
      .fp-tile {
        max-width: 36px;
        font-size: 1rem;
      }
      .fp-grid {
        gap: 2px;
      }
      .zone-btn {
        min-width: 28px;
        padding: 1px 3px;
      }
      .zone-btn .zicon {
        font-size: 0.8rem;
      }
    }

    /* -------- RESPONSIVE MISC -------- */
    @media (pointer: coarse) {
      .hotspot .hp-tag {
        opacity: 1;
        transform: translateX(-50%) translateY(-2px);
        font-size: 0.55rem;
        padding: 2px 6px;
      }
    }
  </style>

      var SPOTS = {

      var STORE_KEY = 'little-village-save';

        Object.keys(ZONES).forEach(function(zoneKey) {

          var raw = localStorage.getItem(STORE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            var def = defaultState();
            if (!parsed.monsters) parsed.monsters = def.monsters;
            return Object.assign(def, parsed);

        } catch (e) {}
        return defaultState();

      function saveState() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
        broadcastState();
        if (_authToken && _backendCoins !== null && state.coins !== _backendCoins) {
          var diff = state.coins - _backendCoins;
          if (diff > 0) syncCoinsToBackend(state.coins);
          _backendCoins = state.coins;

        try {
          window.parent.postMessage({
            type: 'state-update',
            data: {
              type: 'play-to-win',
              coins: state.coins,
              resources: Object.keys(state.resources).map(function(k) {

                return { id: k, level: state.buildings[k].level };
              }),
            }
          }, '*');
        } catch (e) {}

      var _authToken = null;

        if (!_apiBase || !_authToken) return;
        try {
          var url = _apiBase.replace(/\/api\/?$/, '') + '/api/auth/me/coins';
          fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _authToken },
            body: JSON.stringify({ amount: newTotal })
          }).catch(function() {});
        } catch (e) {}
      }

      window.addEventListener('message', function(e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'init' && e.data.data) {
          var d = e.data.data;
          _apiBase = d.apiBase || null;
          _authToken = d.authToken || null;

          var saved = loadState();

          if (d.userCoins != null && d.userCoins > 0) {
            saved.coins = d.userCoins;
            _backendCoins = d.userCoins;
          }

          state = Object.assign(defaultState(), saved);
          if (screen === 'playing') renderPlaying();
        }
      });

      var state = loadState();
      var screen = 'menu';
      var openPanelName = null;
      var optionsSubTab = 'build';
      var clockMinutes = 6 * 60;
      var root = document.getElementById('root');
      var tickInterval = null;
      var currentZone = 'village';
      var actionBusy = false;

      // ========== PLAYER ==========
      var player = {
        x: SPOTS.idle.x,
        y: SPOTS.idle.y,
        zone: 'village',
        moving: false,
        targetX: null,
        targetY: null,
        speed: 0.12, // % per frame
      };

      // ========== RENDER ==========
      function render() {
        if (screen === 'menu') return renderMenu();
        if (screen === 'playing') return renderPlaying();
      }

      // ========== MENU ==========
      function renderMenu() {
        stopTick();
        var hasSave = state.coins > 30 || state.level > 1 || Object.keys(state.quests).length > 0;
        root.innerHTML =
          '<div class="screen" style="flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(170deg,#eaf6ff,#f5ede0);">' +
          '<div style="background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 32px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.6);padding:2rem 1.8rem;max-width:28rem;width:100%;text-align:center;animation:popIn 0.35s cubic-bezier(0.2,0.9,0.3,1.2) forwards;">' +
          '<span style="font-size:4rem;display:block;margin-bottom:0.6rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.10));">🏡</span>' +
          '<h1 style="font-family:Quicksand,sans-serif;font-size:1.8rem;font-weight:800;color:var(--grass-dark);letter-spacing:-0.5px;">LÀNG NHỎ CỦA TÔI</h1>' +
          '<p style="color:var(--ink-dim);font-size:0.92rem;margin-bottom:1.6rem;line-height:1.5;">Xây dựng làng, chiến đấu với quái vật, thu thập tài nguyên và chinh phục boss!</p>' +
          '<button id="btn-play" style="width:100%;padding:0.9rem;border-radius:var(--radius-sm);font-weight:700;font-size:1.05rem;border:2px solid;background:var(--grass);color:#fff;border-color:var(--grass-dark);box-shadow:0 4px 0 var(--grass-dark);transition:transform 0.12s,box-shadow 0.2s;">▶ ' +
          (hasSave ? 'Tiếp tục chơi' : 'Bắt đầu') + '</button>' +
          (hasSave ?
            '<button id="btn-reset" style="width:100%;margin-top:0.5rem;padding:0.7rem;border-radius:var(--radius-sm);font-weight:700;font-size:0.85rem;background:transparent;color:var(--danger);border:2px solid rgba(217,74,90,0.3);transition:transform 0.12s,box-shadow 0.2s;">♻️ Chơi lại từ đầu</button>' :
            '') +
          '<div style="display:flex;justify-content:center;gap:2rem;margin-top:1.4rem;padding-top:1.2rem;border-top:2px dashed rgba(180,160,130,0.3);">' +
          '<div style="text-align:center;"><div style="font-family:JetBrains Mono,monospace;font-weight:700;font-size:1.1rem;color:var(--gold-dark);">🪙 ' +
          state.coins + '</div><div style="font-size:0.65rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.3px;">Xu hiện có</div></div>' +
          '<div style="text-align:center;"><div style="font-family:JetBrains Mono,monospace;font-weight:700;font-size:1.1rem;color:var(--grass-dark);">Lv.' +
          state.level + '</div><div style="font-size:0.65rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.3px;">Cấp độ</div></div>' +
          '</div>' +
          '</div>' +
          '</div>';
        document.getElementById('btn-play').onclick = function() { screen = 'playing';
          renderPlaying();
          startTick(); };
        var resetBtn = document.getElementById('btn-reset');
        if (resetBtn) resetBtn.onclick = function() { state = defaultState();
          saveState();
          render(); };
      }

      // ========== TICK ==========
      function startTick() {
        stopTick();
        tickInterval = setInterval(function() {
          var changed = false;
          clockMinutes += 4;
          if (clockMinutes >= 26 * 60) { clockMinutes = 6 * 60;
            state.day = (state.day || 1) + 1; }
          updateClock();
          if (state.energy < state.maxEnergy) {
            state._energyAcc = (state._energyAcc || 0) + 1;
            if (state._energyAcc >= 4) { state._energyAcc = 0;
              state.energy = Math.min(state.maxEnergy, state.energy + 1);
              changed = true; }
          }
          state.plots.forEach(function(p) {
            if (p.state === 'growing') {
              p.remaining = Math.max(0, p.remaining - 1000);
              if (p.remaining <= 0) { p.state = 'ready'; }
              changed = true;
            }
          });
          Object.keys(state.monsters).forEach(function(key) {
            var m = state.monsters[key];
            if (!m.alive && m.respawnTimer === null) {
              m.respawnTimer = setTimeout(function() {
                m.alive = true;
                m.hp = m.maxHp;
                m.respawnTimer = null;
                if (screen === 'playing' && currentZone === key.split('-')[0]) {
                  renderZoneScene();
                }
                saveState();
              }, 5000);
            }
          });
          if (changed && screen === 'playing') {
            updateHud();
            if (openPanelName === null) renderZoneScene();
          }
        }, 1000);
      }

      function stopTick() { if (tickInterval) { clearInterval(tickInterval);
          tickInterval = null; } }

      function formatClock() {
        var h24 = Math.floor(clockMinutes / 60) % 24,
          m = clockMinutes % 60;
        var ampm = h24 >= 12 ? 'ch' : 'sa';
        var h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
      }

      function updateClock() {
        var c = document.getElementById('hud-clock');
        if (c) c.textContent = formatClock();
        var d = document.getElementById('hud-day');
        if (d) d.textContent = 'Ngày ' + (state.day || 1);
      }

      // ========== PLAYING ==========
      function renderPlaying() {
        root.innerHTML =
          '<div class="game-screen">' +
          '<div class="scene" id="scene">' +
          '<div class="grass-edge top"></div>' +
          '<div class="grass-edge bottom"></div>' +
          '<div class="pond" id="sc-pond" style="left:82%;top:74%;width:20%;height:20%;"></div>' +
          '<div class="farm-patch" id="sc-farm" style="left:2%;top:8%;"></div>' +
          '<div id="sc-hotspots"></div>' +
          '<div id="monster-container"></div>' +
          '<div class="villager-pos" id="villager-pos" style="left:' + player.x + '%;top:' + player.y +
          '%;">' + VILLAGER_SVG + '</div>' +
          '</div>' +

          '<div class="hud-top">' +
          '<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">' +
          '<div class="hud-xp"><span class="xp-lbl">Lv.' + state.level + '</span>' +
          '<div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:' + (state.xp / state.xpToNext *
            100) + '%;"></div></div>' +
          '</div>' +
          '<div class="hud-pill gold">🪙 <span id="hud-coins">' + state.coins + '</span></div>' +
          '<div class="hud-pill">⚡ <span id="hud-energy">' + Math.floor(state.energy) + '</span>/<span id="hud-maxenergy">' +
          state.maxEnergy + '</span>' +
          '<div class="hud-energybar"><div class="hud-energyfill" id="energy-fill" style="width:' + (state
            .energy / state.maxEnergy * 100) + '%;"></div></div>' +
          '</div>' +
          '</div>' +
          '<div style="display:flex;gap:4px;align-items:center;">' +
          '<div class="hud-pill">🕐 <span id="hud-clock">' + formatClock() + '</span> · <span id="hud-day">Ngày ' + (state
            .day || 1) + '</span></div>' +
          '<button class="hud-icon-btn" id="btn-open-quest" title="Nhiệm vụ">📜<span class="badge hidden" id="quest-badge">0</span></button>' +
          '<button class="hud-icon-btn" id="btn-open-options" title="Tùy chọn">☰</button>' +
          '</div>' +
          '</div>' +

          '<div class="hotbar">' +
          Object.keys(RES_DEF).map(function(k) {
            var d = RES_DEF[k];
            return '<div class="slot"><span class="sicon2">' + d.icon +
              '</span><span class="sqty font-mono" id="hb-' + k + '">' + state.resources[k] +
              '</span></div>';
          }).join('') +
          '</div>' +

          '<div class="zone-nav" id="zone-nav">' +
          Object.keys(ZONES).map(function(key) {
            var z = ZONES[key];
            return '<button class="zone-btn' + (key === currentZone ? ' active' : '') +
              '" data-zone="' + key + '">' +
              '<span class="zicon">' + z.icon + '</span>' +
              '<span class="zlabel">' + z.name + '</span>' +
              '</button>';
          }).join('') +
          '</div>' +

          '<div class="dpad">' +
          '<div class="up" data-dir="up">▲</div>' +
          '<div class="down" data-dir="down">▼</div>' +
          '<div class="left" data-dir="left">◀</div>' +
          '<div class="right" data-dir="right">▶</div>' +
          '<div class="center">★</div>' +
          '</div>' +
          '</div>';

        // Events
        document.getElementById('btn-open-quest').onclick = function() { openPanel('quest'); };
        document.getElementById('btn-open-options').onclick = function() { openPanel('options'); };
        document.getElementById('scene').onclick = onSceneClick;

        document.querySelectorAll('.zone-btn').forEach(function(btn) {
          btn.onclick = function() {
            var zone = btn.dataset.zone;
            if (zone && zone !== currentZone) {
              switchZone(zone);
            }
          };
        });

        // D-pad
        document.querySelectorAll('.dpad>*[data-dir]').forEach(function(el) {
          el.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            var dir = el.dataset.dir;
            var step = 1.8;
            var dx = 0,
              dy = 0;
            if (dir === 'left') dx = -step;
            if (dir === 'right') dx = step;
            if (dir === 'up') dy = -step;
            if (dir === 'down') dy = step;
            movePlayer(dx, dy);
          });
        });

        // Keyboard
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // Init
        player.zone = currentZone;
        player.x = SPOTS.idle.x;
        player.y = SPOTS.idle.y;
        renderZoneScene();
        updateHud();
        updateQuestBadge();
        gameLoop();
      }

      // ========== GAME LOOP (di chuyển mượt) ==========
      var keys = { left: false, right: false, up: false, down: false };
      var animFrame = null;

      function gameLoop() {
        if (screen !== 'playing') return;
        var moved = false;
        var step = 0.8;
        var dx = 0,
          dy = 0;
        if (keys.left) dx = -step;
        if (keys.right) dx = step;
        if (keys.up) dy = -step;
        if (keys.down) dy = step;
        if (dx !== 0 || dy !== 0) {
          moved = movePlayer(dx, dy);
        }
        // Nếu không di chuyển và không có action, đảm bảo nhân vật ở trạng thái idle
        if (!moved && !actionBusy) {
          var v = document.getElementById('villager-pos');
          if (v && v.classList.contains('moving')) {
            v.classList.remove('moving');
          }
        }
        animFrame = requestAnimationFrame(gameLoop);
      }

      function movePlayer(dx, dy) {
        var newX = player.x + dx;
        var newY = player.y + dy;
        // Giới hạn trong zone (5% - 95% để tránh sát biên)
        if (newX < 2) newX = 2;
        if (newX > 98) newX = 98;
        if (newY < 2) newY = 2;
        if (newY > 98) newY = 98;

        // Kiểm tra vượt biên để chuyển zone
        var zone = ZONES[currentZone];
        var connect = zone.connections;
        var changed = false;
        if (newX <= 2 && connect.left) {
          switchZone(connect.left);
          newX = 98;
          changed = true;
        } else if (newX >= 98 && connect.right) {
          switchZone(connect.right);
          newX = 2;
          changed = true;
        } else if (newY <= 2 && connect.up) {
          switchZone(connect.up);
          newY = 98;
          changed = true;
        } else if (newY >= 98 && connect.down) {
          switchZone(connect.down);
          newY = 2;
          changed = true;
        }

        player.x = newX;
        player.y = newY;

        // Cập nhật vị trí nhân vật
        var v = document.getElementById('villager-pos');
        if (v) {
          v.style.left = player.x + '%';
          v.style.top = player.y + '%';
          if (!changed && (dx !== 0 || dy !== 0)) {
            v.classList.add('moving');
            // hướng mặt
            if (dx < 0) v.classList.add('face-left');
            else if (dx > 0) v.classList.remove('face-left');
          } else if (!changed) {
            v.classList.remove('moving');
          }
        }
        return true;
      }

      // ========== KEYBOARD ==========
      function onKeyDown(e) {
        var k = e.key;
        if (k === 'ArrowLeft' || k === 'a') { keys.left = true;
          e.preventDefault(); }
        if (k === 'ArrowRight' || k === 'd') { keys.right = true;
          e.preventDefault(); }
        if (k === 'ArrowUp' || k === 'w') { keys.up = true;
          e.preventDefault(); }
        if (k === 'ArrowDown' || k === 's') { keys.down = true;
          e.preventDefault(); }
        // Phím tắt: E để tương tác với hotspot gần nhất (không bắt buộc)
        if (k === 'e' || k === 'E') {
          interactNearest();
        }
      }

      function onKeyUp(e) {
        var k = e.key;
        if (k === 'ArrowLeft' || k === 'a') { keys.left = false;
          e.preventDefault(); }
        if (k === 'ArrowRight' || k === 'd') { keys.right = false;
          e.preventDefault(); }
        if (k === 'ArrowUp' || k === 'w') { keys.up = false;
          e.preventDefault(); }
        if (k === 'ArrowDown' || k === 's') { keys.down = false;
          e.preventDefault(); }
      }

      // ========== SWITCH ZONE ==========
      function switchZone(newZone) {
        if (newZone === currentZone) return;
        currentZone = newZone;
        player.zone = newZone;
        // Cập nhật UI zone-nav
        document.querySelectorAll('.zone-btn').forEach(function(btn) {
          btn.classList.toggle('active', btn.dataset.zone === newZone);
        });
        renderZoneScene();
        updateHud();
        // Cập nhật vị trí nhân vật (đã được set trong movePlayer)
      }

      // ========== RENDER ZONE SCENE ==========
      function renderZoneScene() {
        var zone = ZONES[currentZone];
        if (!zone) return;

        // Farm
        var farmEl = document.getElementById('sc-farm');
        if (farmEl) {
          if (zone.hasFarm && state.buildings.farm.level >= 1) {
            farmEl.style.display = 'block';
            renderFarmPatch();
          } else {
            farmEl.style.display = 'none';
          }
        }

        // Hotspots
        var hs = document.getElementById('sc-hotspots');
        if (zone.hasResources && currentZone === 'village') {
          hs.style.display = 'block';
          renderVillageHotspots(hs);
        } else {
          hs.style.display = 'none';
        }

        // Monsters
        renderMonsters(zone);
      }

      // ========== VILLAGE HOTSPOTS ==========
      function renderVillageHotspots(hs) {
        var html = '';
        var energyLowChop = state.energy < ACTIONS.chop.energy;
        html += '<div class="hotspot' + (energyLowChop ? ' energy-low' : '') + '" data-chop="1" style="left:' + SPOTS
          .tree.x + '%;top:' + SPOTS.tree.y + '%;">' +
          '<span class="hp-tag">🪓 Chặt cây (⚡' + ACTIONS.chop.energy + ')</span>' +
          '<svg viewBox="0 0 90 90" width="66" height="66">' +
          '<rect x="40" y="58" width="10" height="26" rx="2" fill="#7a4f2a"/>' +
          '<circle cx="45" cy="42" r="26" fill="#4f9760"/>' +
          '<circle cx="24" cy="55" r="17" fill="#5aa06c"/>' +
          '<circle cx="66" cy="55" r="17" fill="#5aa06c"/>' +
          '</svg></div>';

        var mineUnlocked = state.buildings.mine.level >= 1;
        var stoneLocked = !mineUnlocked || !state.items.pickaxe;
        html += '<div class="hotspot' + (stoneLocked ? ' locked' : (state.energy < ACTIONS.stone.energy ?
          ' energy-low' : '')) + '" data-stone="1" style="left:' + SPOTS.stone.x + '%;top:' + SPOTS.stone.y +
          '%;">' +
          '<span class="hp-tag">' + (stoneLocked ? '🔒 Cần Hầm mỏ + Cuốc chim' : '🪨 Khai đá (⚡' + ACTIONS
            .stone.energy + ')') + '</span>' +
          '<svg viewBox="0 0 70 50" width="52" height="38"><ellipse cx="35" cy="38" rx="30" ry="10" fill="#a89f8a"/><circle cx="22" cy="26" r="14" fill="#948a75"/><circle cx="46" cy="22" r="17" fill="#a89f8a"/><circle cx="55" cy="34" r="10" fill="#8b8270"/></svg>' +
          '</div>';

        var goldLocked = !mineUnlocked || !state.items.pickaxe;
        html += '<div class="hotspot' + (goldLocked ? ' locked' : (state.energy < ACTIONS.gold.energy ?
          ' energy-low' : '')) + '" data-gold="1" style="left:' + SPOTS.gold.x + '%;top:' + SPOTS.gold.y +
          '%;">' +
          '<span class="hp-tag">' + (goldLocked ? '🔒 Cần Hầm mỏ + Cuốc chim' : '🥇 Đào vàng (⚡' + ACTIONS
            .gold.energy + ')') + '</span>' +
          '<svg viewBox="0 0 60 46" width="46" height="36"><ellipse cx="30" cy="36" rx="26" ry="8" fill="#8b8270"/><circle cx="20" cy="22" r="13" fill="#9c927a"/><circle cx="40" cy="20" r="15" fill="#a89f8a"/><circle cx="18" cy="18" r="2.4" fill="#ffd166"/><circle cx="34" cy="14" r="2" fill="#ffd166"/><circle cx="42" cy="24" r="2.2" fill="#ffd166"/></svg>' +
          '</div>';

        html += '<div class="hotspot' + (state.energy < ACTIONS.dig.energy ? ' energy-low' : '') + '" data-dig="1" style="left:' +
          SPOTS.dig.x + '%;top:' + SPOTS.dig.y + '%;">' +
          '<span class="hp-tag">🗺️ Đào kho báu (⚡' + ACTIONS.dig.energy + ')</span>' +
          '<svg viewBox="0 0 60 40" width="48" height="34"><ellipse cx="30" cy="32" rx="26" ry="7" fill="#c9a06a"/><ellipse cx="30" cy="29" rx="17" ry="4.5" fill="#a9713f"/><line x1="44" y1="6" x2="30" y2="26" stroke="#7a4f2a" stroke-width="4" stroke-linecap="round"/><rect x="40" y="1" width="9" height="9" rx="2" fill="#93896a"/></svg>' +
          '</div>';

        html += '<div class="hotspot decor" data-openbuild="house" style="left:88%;top:16%;"><span class="hp-tag">Nhà ở Lv.' +
          state.buildings.house.level + '</span>' + houseSvg(state.buildings.house.level) + '</div>';
        html += '<div class="hotspot decor" data-openbuild="shop" style="left:96%;top:34%;"><span class="hp-tag">Cửa hàng Lv.' +
          state.buildings.shop.level + '</span>' + shopSvg(state.buildings.shop.level) + '</div>';
        html += '<div class="hotspot decor" data-openbuild="mine" style="left:42%;top:24%;"><span class="hp-tag">' + (
          mineUnlocked ? ('Hầm mỏ Lv.' + state.buildings.mine.level) : 'Hầm mỏ (khóa)') + '</span>' + mineVisualSvg(
          state.buildings.mine.level) + '</div>';
        html += '<div class="hotspot decor" data-openbuild="land" style="left:8%;top:66%;"><span class="hp-tag">' + (
          state.buildings.land.level >= 1 ? ('Khu đất Lv.' + state.buildings.land.level) :
          'Khu đất (khóa)') + '</span>' + landSvg(state.buildings.land.level) + '</div>';

        hs.innerHTML = html;
      }

      // SVG helpers
      function houseSvg(level) {
        var chimney = level >= 4 ? '<rect x="40" y="6" width="8" height="14" fill="#7a4f2a"/>' : '';
        var floor2 = level >= 3 ?
          '<rect x="14" y="14" width="36" height="16" fill="#f3ecd6" stroke="#7a4f2a" stroke-width="2"/>' : '';
        var windows = level >= 2 ?
          '<rect x="18" y="34" width="8" height="8" fill="#eaf6ff" stroke="#7a4f2a"/><rect x="38" y="34" width="8" height="8" fill="#eaf6ff" stroke="#7a4f2a"/>' :
          '';
        var flowers = level >= 5 ?
          '<rect x="12" y="46" width="10" height="4" fill="#d1495b"/><rect x="42" y="46" width="10" height="4" fill="#e0a72e"/>' :
          '';
        return '<svg viewBox="0 0 64 60" width="48" height="44">' + chimney +
          '<polygon points="6,30 32,8 58,30" fill="#a9713f"/>' + floor2 +
          '<rect x="14" y="30" width="36" height="20" fill="#fffaf0" stroke="#7a4f2a" stroke-width="2"/>' +
          windows + '<rect x="27" y="38" width="10" height="12" fill="#7a4f2a"/>' + flowers + '</svg>';
      }

      function shopSvg(level) {
        var goods = level >= 2 ?
          '<circle cx="20" cy="42" r="4" fill="#e0a72e"/><circle cx="30" cy="42" r="4" fill="#d1495b"/><circle cx="40" cy="42" r="4" fill="#5aa06c"/>' :
          '<circle cx="30" cy="42" r="4" fill="#e0a72e"/>';
        var n = level >= 3 ? 5 : 3;
        var stripes = '';
        var sw = 50 / n;
        for (var i = 0; i < n; i++) {
          stripes += '<rect x="' + (5 + i * sw) + '" y="14" width="' + sw + '" height="8" fill="' + (i % 2 ===
            0 ? '#d1495b' : '#fffaf0') + '"/>';
        }
        return '<svg viewBox="0 0 60 50" width="46" height="38"><polygon points="2,22 30,8 58,22" fill="#7a4f2a"/><g>' +
          stripes + '</g><rect x="6" y="22" width="48" height="20" fill="#e9dcbd" stroke="#7a4f2a" stroke-width="2"/>' +
          goods + '</svg>';
      }

      function mineVisualSvg(level) {
        if (level < 1) return '<svg viewBox="0 0 70 70" width="44" height="44"><polygon points="5,62 35,10 65,62" fill="#9c8f72"/><polygon points="20,62 35,36 50,62" fill="#8a7d61"/><circle cx="35" cy="50" r="7" fill="#3a331f"/><text x="35" y="54" font-size="10" text-anchor="middle">🔒</text></svg>';
        return '<svg viewBox="0 0 70 70" width="44" height="44"><polygon points="5,62 35,10 65,62" fill="#9c8f72"/><polygon points="20,62 35,34 50,62" fill="#3a331f"/><rect x="17" y="34" width="6" height="28" fill="#7a4f2a"/><rect x="47" y="34" width="6" height="28" fill="#7a4f2a"/><rect x="17" y="32" width="36" height="6" fill="#7a4f2a"/></svg>';
      }

      function landSvg(level) {
        if (level < 1) return '<svg viewBox="0 0 60 46" width="44" height="34"><rect x="4" y="28" width="52" height="4" fill="#a9713f"/><rect x="4" y="6" width="4" height="26" fill="#a9713f"/><rect x="52" y="6" width="4" height="26" fill="#a9713f"/><text x="30" y="20" font-size="9" text-anchor="middle">🏷️</text></svg>';
        var t1 = level >= 2 ? '<circle cx="14" cy="20" r="8" fill="#5aa06c"/>' : '';
        var t2 = level >= 3 ? '<circle cx="44" cy="18" r="9" fill="#4f9760"/>' : '';
        return '<svg viewBox="0 0 60 46" width="44" height="34"><rect x="4" y="30" width="52" height="10" fill="#8fce85"/>' +
          t1 + t2 + '<text x="30" y="40" font-size="9" text-anchor="middle">🌷</text></svg>';
      }

      // ========== FARM ==========
      function renderFarmPatch() {
        var el = document.getElementById('sc-farm');
        if (!el) return;
        if (state.buildings.farm.level < 1) {
          el.innerHTML =
            '<div style="width:30vw;max-width:120px;padding:.6rem;text-align:center;color:#fff;font-size:.62rem;font-weight:700;background:rgba(0,0,0,.25);border-radius:10px;">🔒 Nông trại chưa xây</div>';
          return;
        }
        var html = '<div class="fp-grid">';
        state.plots.forEach(function(p, i) {
          if (p.state === 'empty') {
            html += '<div class="fp-tile" data-plant="' + i + '">🟫</div>';
          } else if (p.state === 'growing') {
            var pct = Math.max(0, 100 - (p.remaining / p.total * 100));
            var icon = pct < 40 ? '🌱' : pct < 75 ? '🌿' : '🌾';
            html += '<div class="fp-tile" data-water="' + i + '">' + icon +
              '<div class="fp-bar"><i style="width:' + pct + '%;"></i></div></div>';
          } else {
            html += '<div class="fp-tile ready" data-harvest="' + i + '">🌾</div>';
          }
        });
        html += '</div>';
        el.innerHTML = html;
      }

      // ========== MONSTERS ==========
      function renderMonsters(zone) {
        var container = document.getElementById('monster-container');
        if (!container) return;
        var html = '';
        var monsterList = zone.monsters || [];
        var boss = zone.boss;

        var posIdx = 0;
        monsterList.forEach(function(mon) {
          var key = currentZone + '-' + mon.id;
          var monState = state.monsters[key];
          if (!monState) return;
          var spot = posIdx === 0 ? SPOTS.monster1 : SPOTS.monster2;
          posIdx++;
          var alive = monState.alive;
          var hpPct = monState.hp / monState.maxHp * 100;
          var isDead = !alive;
          html += '<div class="monster-hotspot' + (isDead ? ' dead' : '') + '" data-monster="' + key +
            '" style="left:' + spot.x + '%;top:' + spot.y + '%;">' +
            '<span class="monster-icon">' + (isDead ? '💀' : mon.icon) + '</span>' +
            '<div class="monster-hp-bar"><div class="monster-hp-fill" style="width:' + (isDead ? 0 :
              hpPct) + '%;"></div></div>' +
            '<span class="monster-name">' + mon.name + (isDead ? ' (đã chết)' : '') + '</span>' +
            '</div>';
        });

        if (boss) {
          var bossKey = currentZone + '-boss';
          var bossState = state.monsters[bossKey];
          if (bossState) {
            var alive = bossState.alive;
            var hpPct = bossState.hp / bossState.maxHp * 100;
            var isDead = !alive;
            html += '<div class="monster-hotspot boss' + (isDead ? ' dead' : '') + '" data-monster="' +
              bossKey + '" style="left:' + SPOTS.boss.x + '%;top:' + SPOTS.boss.y + '%;">' +
              '<span class="monster-icon">' + (isDead ? '💀' : boss.icon) + '</span>' +
              '<div class="monster-hp-bar"><div class="monster-hp-fill" style="width:' + (isDead ? 0 :
                hpPct) + '%;"></div></div>' +
              '<span class="monster-name">' + boss.name + (isDead ? ' (đã chết)' : '') + '</span>' +
              '</div>';
          }
        }

        container.innerHTML = html;
        container.querySelectorAll('[data-monster]').forEach(function(el) {
          el.onclick = function(e) {
            e.stopPropagation();
            var key = el.dataset.monster;
            attackMonster(key);
          };
        });
      }

      // ========== TẤN CÔNG QUÁI ==========
      function attackMonster(key) {
        if (actionBusy) return;
        var monState = state.monsters[key];
        if (!monState || !monState.alive) {
          showHint('Quái đã chết, đợi hồi sinh!');
          return;
        }
        var energyCost = 4;
        if (state.energy < energyCost) { showHint('Không đủ năng lượng ⚡'); return; }
        state.energy -= energyCost;
        updateHud();

        actionBusy = true;
        // Di chuyển nhân vật đến vị trí quái
        var container = document.getElementById('monster-container');
        var el = container.querySelector('[data-monster="' + key + '"]');
        var targetPos = SPOTS.monster1;
        if (el) {
          var left = parseFloat(el.style.left);
          var top = parseFloat(el.style.top);
          targetPos = { x: left, y: top };
        }
        animateVillagerTo(targetPos.x, targetPos.y + 8, function() {
          var villager = document.getElementById('villager-pos');
          if (villager) {
            villager.classList.add('act', 'act-attack');
            var damage = 10 + Math.floor(Math.random() * 10);
            monState.hp -= damage;
            if (monState.hp <= 0) {
              monState.hp = 0;
              monState.alive = false;
              var zone = ZONES[currentZone];
              var monDef = null;
              if (key.indexOf('-boss') !== -1) {
                monDef = zone.boss;
              } else {
                var id = key.split('-')[1];
                zone.monsters.forEach(function(m) { if (m.id === id) monDef = m; });
              }
              if (monDef) {
                state.coins += monDef.rewardCoins;
                gainXp(monDef.rewardXp);
                popFloatAt(el, 'coin', '+' + monDef.rewardCoins + ' 🪙');
                popFloatAt(el, 'good', '+' + monDef.rewardXp + ' XP');
                toast('💥 Đã hạ ' + monDef.name + '! Nhận ' + monDef.rewardCoins + ' xu, ' + monDef
                  .rewardXp + ' XP');
              }
              saveState();
            } else {
              popFloatAt(el, 'bad', '-' + damage + ' HP');
            }
            renderZoneScene();
            updateHud();
            actionBusy = false;
            setTimeout(function() {
              if (villager) {
                villager.classList.remove('act', 'act-attack');
                animateVillagerTo(SPOTS.idle.x, SPOTS.idle.y, function() {});
              }
            }, 500);
          } else {
            actionBusy = false;
          }
        });
      }

      // ========== ANIMATE VILLAGER ==========
      function animateVillagerTo(tx, ty, callback) {
        var v = document.getElementById('villager-pos');
        if (!v) { if (callback) callback(); return; }
        var startX = parseFloat(v.style.left) || player.x;
        var startY = parseFloat(v.style.top) || player.y;
        var dur = 400;
        var startTime = performance.now();

        // hướng mặt
        v.classList.toggle('face-left', tx < startX);

        function step(time) {
          var t = Math.min(1, (time - startTime) / dur);
          var ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          var cx = startX + (tx - startX) * ease;
          var cy = startY + (ty - startY) * ease;
          v.style.left = cx + '%';
          v.style.top = cy + '%';
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            v.style.left = tx + '%';
            v.style.top = ty + '%';
            if (callback) callback();
          }
        }
        v.classList.add('moving');
        requestAnimationFrame(step);
        // Sau khi hoàn tất, xóa moving
        setTimeout(function() {
          v.classList.remove('moving');
        }, dur + 50);
      }

      // ========== SCENE CLICK ==========
      function onSceneClick(evt) {
        var t = evt.target;
        if (currentZone === 'village') {
          var chop = t.closest('[data-chop]');
          if (chop) { doGather('chop'); return; }
          var stone = t.closest('[data-stone]');
          if (stone) { doGather('stone'); return; }
          var gold = t.closest('[data-gold]');
          if (gold) { doGather('gold'); return; }
          var dig = t.closest('[data-dig]');
          if (dig) { doGather('dig'); return; }
          var openbuild = t.closest('[data-openbuild]');
          if (openbuild) { optionsSubTab = 'build';
            openPanel('options'); return; }
          var plant = t.closest('[data-plant]');
          if (plant) { plantSeed(parseInt(plant.dataset.plant, 10)); return; }
          var water = t.closest('[data-water]');
          if (water) { waterPlot(parseInt(water.dataset.water, 10)); return; }
          var harvest = t.closest('[data-harvest]');
          if (harvest) { harvestPlot(parseInt(harvest.dataset.harvest, 10), harvest); return; }
        }
        // Click vào scene để tương tác với hotspot gần nhất
        interactNearest();
      }

      // ========== INTERACT NEAREST ==========
      function interactNearest() {
        // Tìm hotspot gần nhân vật nhất và thực hiện hành động tương ứng
        var hs = document.querySelectorAll('.hotspot:not(.decor):not(.locked)');
        var minDist = Infinity;
        var target = null;
        hs.forEach(function(el) {
          var left = parseFloat(el.style.left);
          var top = parseFloat(el.style.top);
          if (isNaN(left) || isNaN(top)) return;
          var dx = left - player.x;
          var dy = top - player.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < minDist && dist < 25) {
            minDist = dist;
            target = el;
          }
        });
        if (target) {
          // Mô phỏng click
          var ev = new MouseEvent('click', { bubbles: true });
          target.dispatchEvent(ev);
        } else {
          showHint('Không có gì để tương tác gần đây.');
        }
      }

      // ========== GATHER ==========
      function doGather(kind) {
        if (actionBusy) return;
        var a = ACTIONS[kind];
        if (a.req === 'mine' && (state.buildings.mine.level < 1 || !state.items.pickaxe)) {
          showHint(kind === 'stone' || kind === 'gold' ? 'Cần mở khóa Hầm mỏ và mua Cuốc chim (☰ Tùy chọn)' :
            'Chưa thể thực hiện');
          return;
        }
        if (state.energy < a.energy) { showHint('Không đủ năng lượng ⚡'); return; }
        state.energy -= a.energy;
        updateHud();
        actionBusy = true;

        var target = SPOTS[kind] || SPOTS.idle;
        animateVillagerTo(target.x, target.y, function() {
          var v = document.getElementById('villager-pos');
          if (v) {
            var cls = kind === 'dig' ? 'act-dig' : 'act-swing';
            v.classList.add('act', cls);
            setTimeout(function() {
              resolveGather(a);
              v.classList.remove('act', cls);
              animateVillagerTo(SPOTS.idle.x, SPOTS.idle.y, function() {
                actionBusy = false;
              });
            }, a.durMs);
          } else {
            actionBusy = false;
          }
        });
      }

      function resolveGather(a) {
        var posEl = document.getElementById('villager-pos');
        if (a.treasure) {
          var roll = Math.random();
          if (roll < 0.12) { state.stats.mapFragments += 1;
            popFloatAt(posEl, 'good', '+1 🗺️ Mảnh bản đồ');
            toast('🗺️ Bạn tìm thấy một mảnh bản đồ!'); } else if (roll < 0.30) { var g = 15 + Math.floor(Math
              .random() * 20);
            state.coins += g;
            popFloatAt(posEl, 'coin', '+' + g + ' 🪙'); } else { var s = 5 + Math.floor(Math.random() * 10);
            state.coins += s;
            popFloatAt(posEl, 'coin', '+' + s + ' 🪙'); }
          gainXp(6);
        } else {
          var amount = a.min + Math.floor(Math.random() * (a.max - a.min + 1));
          var cap = RES_DEF[a.resId].cap;
          var before = state.resources[a.resId];
          state.resources[a.resId] = Math.min(cap, before + amount);
          var gained = state.resources[a.resId] - before;
          popFloatAt(posEl, 'good', '+' + gained + ' ' + RES_DEF[a.resId].icon);
          if (a.resId === 'wood') state.stats.totalWood += gained;
          gainXp(3);
        }
        saveState();
        updateHud();
        renderZoneScene();
      }

      // ========== FARM ACTIONS ==========
      function plantSeed(idx) {
        if (state.energy < 2) { showHint('Không đủ năng lượng ⚡'); return; }
        var p = state.plots[idx];
        if (!p || p.state !== 'empty') return;
        state.energy -= 2;
        var totalMs = 9000;
        p.state = 'growing';
        p.remaining = totalMs;
        p.total = totalMs;
        var f = SPOTS.farm;
        animateVillagerTo(f.x, f.y, function() {
          var v = document.getElementById('villager-pos');
          if (v) { v.classList.add('act', 'act-bend');
            setTimeout(function() { v.classList.remove('act', 'act-bend');
              animateVillagerTo(SPOTS.idle.x, SPOTS.idle.y, function() {}); }, 600); }
        });
        updateHud();
        saveState();
        renderFarmPatch();
      }

      function waterPlot(idx) {
        var p = state.plots[idx];
        if (!p || p.state !== 'growing') return;
        if (!state.items.wateringCan) { showHint('Cần mua Bình tưới nước ở ☰ Tùy chọn > Cửa hàng'); return; }
        p.remaining = Math.max(0, p.remaining - 3000);
        if (p.remaining <= 0) p.state = 'ready';
        var f = SPOTS.farm;
        animateVillagerTo(f.x, f.y, function() {
          var v = document.getElementById('villager-pos');
          if (v) { v.classList.add('act', 'act-water');
            setTimeout(function() { v.classList.remove('act', 'act-water');
              animateVillagerTo(SPOTS.idle.x, SPOTS.idle.y, function() {}); }, 500); }
        });
        saveState();
        renderFarmPatch();
      }

      function harvestPlot(idx, tileEl) {
        var p = state.plots[idx];
        if (!p || p.state !== 'ready') return;
        var amount = 3 + Math.floor(Math.random() * 3);
        var cap = RES_DEF.wheat.cap;
        var before = state.resources.wheat;
        state.resources.wheat = Math.min(cap, before + amount);
        var gained = state.resources.wheat - before;
        var coinGain = 5 + Math.floor(Math.random() * 6);
        state.coins += coinGain;
        state.stats.totalWheat += gained;
        gainXp(8);
        var f = SPOTS.farm;
        animateVillagerTo(f.x, f.y, function() {
          var v = document.getElementById('villager-pos');
          if (v) { v.classList.add('act', 'act-bend');
            setTimeout(function() { v.classList.remove('act', 'act-bend');
              animateVillagerTo(SPOTS.idle.x, SPOTS.idle.y, function() {}); }, 600); }
        });
        popFloatAt(tileEl, 'good', '+' + gained + ' 🌾');
        popFloatAt(tileEl, 'coin', '+' + coinGain + ' 🪙', 18);
        state.plots[idx] = { state: 'empty' };
        saveState();
        updateHud();
        renderFarmPatch();
      }

      // ========== HUD ==========
      function updateHud() {
        var c = document.getElementById('hud-coins');
        if (c) c.textContent = state.coins;
        var e = document.getElementById('hud-energy');
        if (e) e.textContent = Math.floor(state.energy);
        var me = document.getElementById('hud-maxenergy');
        if (me) me.textContent = state.maxEnergy;
        var ef = document.getElementById('energy-fill');
        if (ef) ef.style.width = (state.energy / state.maxEnergy * 100) + '%';
        var xf = document.getElementById('xp-fill');
        if (xf) xf.style.width = (state.xp / state.xpToNext * 100) + '%';
        var xl = document.querySelector('.hud-xp .xp-lbl');
        if (xl) xl.textContent = 'Lv.' + state.level;
        Object.keys(RES_DEF).forEach(function(k) {
          var el = document.getElementById('hb-' + k);
          if (el) el.textContent = state.resources[k];
        });
        updateClock();
        updateQuestBadge();
      }

      function updateQuestBadge() {
        var n = 0;
        QUEST_DEFS.forEach(function(q) { if (!state.quests[q.id] && questProgress(q) >= q.target) n++; });
        var b = document.getElementById('quest-badge');
        if (b) { if (n > 0) { b.textContent = n;
            b.classList.remove('hidden'); } else { b.classList.add('hidden'); } }
      }

      // ========== XP ==========
      function gainXp(amount) {
        state.xp += amount;
        while (state.xp >= state.xpToNext) {
          state.xp -= state.xpToNext;
          state.level += 1;
          state.xpToNext = Math.round(state.xpToNext * 1.35);
          state.maxEnergy += 5;
          toast('🎉 Lên cấp ' + state.level + '! Năng lượng tối đa +5');
        }
      }

      // ========== QUEST PROGRESS ==========
      function questProgress(q) { var v = state.stats[q.metric]; if (v === undefined) v = 0; return Math.min(q.target,
          v); }

      // ========== PANELS ==========
      function openPanel(name) {
        openPanelName = name;
        renderPanels();
      }

      function closePanel() { openPanelName = null;
        renderPanels();
        renderZoneScene(); }

      function renderPanels() {
        var old = document.getElementById('panel-layer');
        if (old) old.remove();
        if (!openPanelName) return;
        var layer = document.createElement('div');
        layer.id = 'panel-layer';
        if (openPanelName === 'quest') {
          layer.innerHTML = '<div class="modal-backdrop" id="pbackdrop"></div>' +
            '<div class="panel">' +
            '<div class="panel-header"><h2>📜 Nhiệm vụ</h2><button class="panel-close" id="pclose">✕</button></div>' +
            '<div class="panel-body" id="panel-body">' + questTabHtml() + '</div>' +
            '</div>';
        } else if (openPanelName === 'options') {
          layer.innerHTML = '<div class="modal-backdrop" id="pbackdrop"></div>' +
            '<div class="panel">' +
            '<div class="panel-header"><h2>☰ Tùy chọn</h2><button class="panel-close" id="pclose">✕</button></div>' +
            '<div class="panel-subnav">' +
            subtabBtn('build', '🏗️ Xây dựng') + subtabBtn('shop', '🏪 Cửa hàng') + subtabBtn('settings',
              '⚙️ Cài đặt') +
            '</div>' +
            '<div class="panel-body" id="panel-body">' + optionsBodyHtml() + '</div>' +
            '</div>';
        }
        document.body.appendChild(layer);
        document.getElementById('pbackdrop').onclick = closePanel;
        document.getElementById('pclose').onclick = closePanel;
        attachPanelHandlers();
      }

      function subtabBtn(key, label) {
        return '<button class="panel-subtab' + (optionsSubTab === key ? ' active' : '') + '" data-subtab="' + key +
          '">' + label + '</button>';
      }

      function optionsBodyHtml() {
        if (optionsSubTab === 'build') return buildTabHtml();
        if (optionsSubTab === 'shop') return resourceStripHtml() + shopTabHtml();
        return settingsHtml();
      }

      function settingsHtml() {
        return '<button class="settings-btn danger" id="btn-quit-game">🚪 Lưu &amp; Thoát về menu</button>' +
          '<button class="settings-btn" id="btn-reset-game">♻️ Chơi lại từ đầu</button>' +
          '<div class="empty-note">Làng của bạn được tự động lưu sau mỗi hành động.</div>';
      }

      function resourceStripHtml() {
        var html = '<div class="resource-strip">';
        Object.keys(RES_DEF).forEach(function(k) {
          var d = RES_DEF[k];
          html += '<div class="res-chip"><span class="ricon">' + d.icon +
            '</span><span class="rqty font-mono">' + state.resources[k] + '</span><span class="rcap">/' +
            d.cap + '</span></div>';
        });
        html += '</div>';
        return html;
      }

      function buildTabHtml() {
        var html = '';
        Object.keys(BUILDING_DEFS).forEach(function(key) {
          var def = BUILDING_DEFS[key];
          var b = state.buildings[key];
          var locked = b.level === 0 && def.unlockCoin !== undefined;
          var atMax = b.level >= def.maxLevel;
          var costCoins, costResLabel = '',
            canAfford = true,
            btnLabel;
          if (locked) {
            costCoins = def.unlockCoin;
            btnLabel = 'Mở khóa (' + costCoins + ' 🪙)';
            canAfford = state.coins >= costCoins;
          } else if (atMax) {
            btnLabel = 'Đã tối đa';
          } else {
            costCoins = Math.round(def.baseCoin * Math.pow(def.growth, b.level - 1));
            var resReq = {};
            Object.keys(def.baseRes || {}).forEach(function(rk) { resReq[rk] = Math.round(def.baseRes[
              rk] * Math.pow(def.growth, b.level - 1)); });
            var parts = [];
            Object.keys(resReq).forEach(function(rk) { parts.push(RES_DEF[rk].icon + ' ' + resReq[
              rk]); if (state.resources[rk] < resReq[rk]) canAfford = false; });
            costResLabel = parts.join(' · ');
            if (state.coins < costCoins) canAfford = false;
            btnLabel = 'Nâng cấp (' + costCoins + ' 🪙' + (costResLabel ? ' · ' + costResLabel : '') +
              ')';
          }
          html += '<div class="building-card">' +
            '<span class="bicon">' + def.icon + '</span>' +
            '<div class="building-info"><div class="building-title">' + def.name +
            ' <span class="lvl-badge">Lv.' + b.level + '/' + def.maxLevel + '</span></div>' +
            '<div class="building-sub">' + (locked ? 'Chưa mở khóa' : (atMax ? 'Cấp tối đa' : btnLabel)) +
            '</div></div>' +
            (atMax ? '' : '<button class="building-btn' + (locked ? ' locked' : '') + '" data-build="' +
              key + '" ' + (canAfford ? '' : 'disabled') + '>' + (locked ? 'Mở khóa' : 'Nâng cấp') +
            '</button>') +
            '</div>';
        });
        return html;
      }

      function upgradeBuilding(key) {
        var def = BUILDING_DEFS[key];
        var b = state.buildings[key];
        var locked = b.level === 0 && def.unlockCoin !== undefined;
        if (locked) {
          if (state.coins < def.unlockCoin) return;
          state.coins -= def.unlockCoin;
          b.level = 1;
          if (key === 'mine') state.stats.mineUnlocked = 1;
          if (key === 'land') { state.plots.push({ state: 'empty' });
            state.maxEnergy += 15; }
          gainXp(30);
          toast(def.icon + ' Đã mở khóa ' + def.name + '!');
        } else {
          if (b.level >= def.maxLevel) return;
          var costCoins = Math.round(def.baseCoin * Math.pow(def.growth, b.level - 1));
          var resReq = {};
          Object.keys(def.baseRes || {}).forEach(function(rk) { resReq[rk] = Math.round(def.baseRes[
            rk] * Math.pow(def.growth, b.level - 1)); });
          if (state.coins < costCoins) return;
          for (var rk in resReq) { if (state.resources[rk] < resReq[rk]) return; }
          state.coins -= costCoins;
          for (var rk2 in resReq) { state.resources[rk2] -= resReq[rk2]; }
          b.level += 1;
          if (key === 'farm') { state.plots.push({ state: 'empty' }); }
          if (key === 'land') { state.maxEnergy += 10; }
          gainXp(20);
          toast('🔧 ' + def.name + ' đã lên cấp ' + b.level + '!');
        }
        saveState();
        updateHud();
        renderPanels();
        renderZoneScene();
      }

      function questTabHtml() {
        var html = '';
        QUEST_DEFS.forEach(function(q) {
          var progress = questProgress(q);
          var claimed = !!state.quests[q.id];
          var complete = progress >= q.target;
          var pct = Math.min(100, (progress / q.target) * 100);
          html += '<div class="quest-card' + (complete ? ' complete' : '') + '">' +
            '<div class="quest-title">' + q.title + '</div>' +
            '<div class="quest-desc">' + q.desc + '</div>' +
            '<div class="quest-progress"><div class="quest-progress-fill" style="width:' + pct +
            '%;"></div></div>' +
            '<div class="quest-footer">' +
            '<span class="quest-reward">🪙 ' + q.rewardCoins + ' · ✨ ' + q.rewardXp + ' XP</span>' +
            (claimed ? '<span class="quest-status-done">✅ Đã nhận</span>' :
              '<button class="claim-btn" data-claim="' + q.id + '" ' + (complete ? '' :
                'disabled') + '>' + (complete ? 'Nhận thưởng' : progress + '/' + q.target) +
              '</button>') +
            '</div></div>';
        });
        return html;
      }

      function claimQuest(qid, cardEl) {
        var q = QUEST_DEFS.filter(function(x) { return x.id === qid; })[0];
        if (!q || state.quests[qid]) return;
        if (questProgress(q) < q.target) return;
        state.quests[qid] = true;
        state.coins += q.rewardCoins;
        gainXp(q.rewardXp);
        popFloatAt(cardEl, 'coin', '+' + q.rewardCoins + ' 🪙');
        toast('📜 Hoàn thành: ' + q.title + '!');
        saveState();
        updateHud();
        renderPanels();
      }

      function shopTabHtml() {
        var html = '';
        SHOP_DEFS.forEach(function(item) {
          var owned = item.kind === 'tool' && state.items[item.flag];
          var canAfford = state.coins >= item.cost;
          html += '<div class="shop-card">' +
            '<span class="sicon">' + item.icon + '</span>' +
            '<div class="shop-info"><div class="shop-title">' + item.name + (item.kind ===
              'consumable' && state.items[item.flag] > 0 ? ' <span class="lvl-badge">x' + state
              .items[item.flag] + '</span>' : '') + '</div>' +
            '<div class="shop-sub">' + item.desc + '</div></div>' +
            (owned ? '<span class="quest-status-done">✅ Đã mua</span>' :
              '<button class="shop-btn" data-buy="' + item.id + '" ' + (canAfford ? '' :
                'disabled') + '>' + item.cost + ' 🪙</button>') +
            '</div>';
        });
        return html;
      }

      function buyItem(itemId, cardEl) {
        var item = SHOP_DEFS.filter(function(x) { return x.id === itemId; })[0];
        if (!item) return;
        if (item.kind === 'tool' && state.items[item.flag]) return;
        if (state.coins < item.cost) return;
        state.coins -= item.cost;
        if (item.kind === 'tool') { state.items[item.flag] = true;
          state.stats.toolsBought = (state.stats.toolsBought || 0) + 1; } else { state.items[item.flag] = (state
            .items[item.flag] || 0) + 1; }
        toast(item.icon + ' Đã mua ' + item.name + '!');
        popFloatAt(cardEl, 'bad', '-' + item.cost + ' 🪙');
        saveState();
        updateHud();
        renderPanels();
      }

      function attachPanelHandlers() {
        var body = document.getElementById('panel-body');
        document.querySelectorAll('[data-subtab]').forEach(function(btn) {
          btn.onclick = function() { optionsSubTab = btn.dataset.subtab;
            renderPanels(); };
        });
        if (!body) return;
        body.onclick = function(evt) {
          var claimBtn = evt.target.closest('[data-claim]');
          if (claimBtn) { claimQuest(claimBtn.dataset.claim, claimBtn.closest('.quest-card')); return; }
          var buildBtn = evt.target.closest('[data-build]');
          if (buildBtn) { upgradeBuilding(buildBtn.dataset.build); return; }
          var buyBtn = evt.target.closest('[data-buy]');
          if (buyBtn) { buyItem(buyBtn.dataset.buy, buyBtn.closest('.shop-card')); return; }
          if (evt.target.id === 'btn-quit-game') { saveState();
            stopTick();
            sendQuit();
            closePanel();
            screen = 'menu';
            render(); return; }
          if (evt.target.id === 'btn-reset-game') { state = defaultState();
            saveState();
            closePanel();
            renderPlaying(); return; }
        };
      }

      // ========== FX ==========
      function popFloatAt(el, kind, text, offsetY) {
        var rect = el && el.getBoundingClientRect ? el.getBoundingClientRect() : { left: window.innerWidth / 2,
          top: window.innerHeight / 2, width: 0 };
        var f = document.createElement('div');
        f.className = 'floatpop ' + kind;
        f.textContent = text;
        f.style.left = (rect.left + rect.width / 2 - 20) + 'px';
        f.style.top = (rect.top - (offsetY || 0)) + 'px';
        document.body.appendChild(f);
        setTimeout(function() { f.remove(); }, 900);
      }

      function toast(msg) {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function() { t.remove(); }, 2700);
      }

      var hintTimer = null;

      function showHint(msg) {
        var old = document.getElementById('scene-hint');
        if (old) old.remove();
        var scene = document.getElementById('scene');
        if (!scene) return;
        var h = document.createElement('div');
        h.id = 'scene-hint';
        h.className = 'toast-hint';
        h.textContent = msg;
        scene.appendChild(h);
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(function() { h.remove(); }, 2000);
      }

      // ========== KHỞI ĐỘNG ==========
      try { window.parent.postMessage({ type: 'ready' }, '*'); } catch (e) {}
      render();
    })();
  </script>
</body>
</html>
