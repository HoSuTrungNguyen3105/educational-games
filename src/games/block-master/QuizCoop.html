<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz Co-op — Trả Lời Cùng Nhau</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6C63FF;
      --primary-dark: #5046e5;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --bg: #0f172a;
      --card: #1e293b;
      --card-light: #334155;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      user-select: none;
    }
    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      touch-action: manipulation;
    }
    .hidden { display: none !important; }
    .font-mono { font-family: 'JetBrains Mono', 'Cascadia Code', monospace; }

    /* ---- HEADER ---- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 10;
      flex-shrink: 0;
    }
    .header .title {
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .team-score {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .header .team-score .score-num {
      color: var(--gold);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
    }
    .header .timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 50px;
      text-align: right;
    }
    .header .timer.warning { color: var(--warning); }
    .header .timer.danger { color: var(--danger); animation: pulse 0.5s infinite alternate; }

    @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes correctFlash { 0% { background: var(--success); } 100% { background: transparent; } }
    @keyframes wrongFlash { 0% { background: var(--danger); } 100% { background: transparent; } }

    /* ---- PLAYER BAR ---- */
    .player-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 10px 16px;
      background: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .player-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      min-width: 140px;
      transition: all 0.3s;
    }
    .player-card.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.15);
    }
    .player-card .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem;
      flex-shrink: 0;
      color: #fff;
    }
    .player-card .info { text-align: left; }
    .player-card .info .name { font-size: 0.85rem; font-weight: 600; }
    .player-card .info .pts { font-size: 0.75rem; color: var(--gold); font-family: 'JetBrains Mono', monospace; }
    .player-card .status-icon { font-size: 1.1rem; }

    /* ---- PROGRESS BAR ---- */
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      flex-shrink: 0;
    }
    .progress-bar .track {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.4s ease;
    }
    .progress-bar .label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    /* ---- QUESTION AREA ---- */
    .question-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .question-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(108, 99, 255, 0.15);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .question-text {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
      max-width: 500px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 500px;
    }
    .option-btn {
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--card);
      border: 2px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: rgba(108, 99, 255, 0.12);
      transform: translateY(-1px);
    }
    .option-btn:active:not(:disabled) { transform: scale(0.97); }
    .option-btn.correct {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }
    .option-btn.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }
    .option-btn.disabled { opacity: 0.4; pointer-events: none; }
    .option-btn .option-letter {
      position: absolute;
      top: 6px; left: 10px;
      font-size: 0.7rem;
      opacity: 0.5;
    }

    /* ---- ANSWER STATUS ---- */
    .answer-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .answer-status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .answer-status .dot.answered { background: var(--success); }
    .answer-status .dot.waiting { background: var(--warning); animation: pulse 1s infinite; }

    /* ---- RESULT SCREEN ---- */
    .result-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .result-icon { font-size: 4rem; margin-bottom: 16px; }
    .result-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .result-subtitle {
      font-size: 1rem;
      color: var(--text-dim);
      margin-bottom: 24px;
    }
    .result-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
    }
    .result-stat {
      text-align: center;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .result-stat .num {
      font-size: 1.8rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }
    .result-stat .label {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .result-buttons {
      display: flex;
      gap: 12px;
    }
    .result-btn {
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .result-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
    }
    .result-btn.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .result-btn:hover { transform: translateY(-1px); }

    /* ---- LOBBY ---- */
    .lobby {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lobby-icon { font-size: 4rem; margin-bottom: 16px; }
    .lobby-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .lobby-subtitle {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-bottom: 24px;
      text-align: center;
    }
    .lobby-players {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lobby-player {
      width: 80px;
      text-align: center;
    }
    .lobby-player .avatar-lg {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 8px;
      border: 2px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .lobby-player.ready .avatar-lg {
      border-color: var(--success);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
    }
    .lobby-player .pname { font-size: 0.8rem; font-weight: 600; }
    .lobby-player .pstatus { font-size: 0.7rem; color: var(--text-dim); }

    .lobby-subject {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .subject-btn {
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--card);
      border: 2px solid rgba(255,255,255,0.08);
      color: var(--text-dim);
      transition: all 0.2s;
    }
    .subject-btn.selected {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .subject-btn:hover:not(:disabled) { border-color: var(--primary); }

    .lobby-btn {
      padding: 14px 40px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      transition: all 0.2s;
    }
    .lobby-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108, 99, 255, 0.3); }
    .lobby-btn:disabled { opacity: 0.5; pointer-events: none; }

    /* ---- TOAST ---- */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      padding: 10px 20px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 999;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ---- ANSWERED MARKERS ---- */
    .player-answered {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .player-answered.p1 { color: #60a5fa; }
    .player-answered.p2 { color: #f472b6; }

    /* ---- COMBO ---- */
    .combo-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 0;
      flex-shrink: 0;
    }
    .combo-bar .combo-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 480px) {
      .options-grid { grid-template-columns: 1fr; gap: 8px; }
      .question-text { font-size: 1.1rem; }
      .result-stats { flex-direction: column; gap: 12px; }
      .player-bar { gap: 10px; padding: 8px 10px; }
      .player-card { min-width: 120px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      var root = document.getElementById('root');
      var _apiBase = '';
      var _authToken = null;
      var _gameId = null;
      var _gameName = 'Quiz Co-op';

      var TIMER_PER_Q = 15;
      var TOTAL_QUESTIONS = 10;
      var CORRECT_PTS = 100;
      var COMBO_BONUS = 50;
      var STREAK_FOR_COMBO = 3;

      var SUBJECTS = [
        { id: 'math', name: 'Toán', icon: '📐' },
        { id: 'english', name: 'Tiếng Anh', icon: '🔤' },
        { id: 'science', name: 'Khoa học', icon: '🔬' },
        { id: 'history', name: 'Lịch sử', icon: '📜' },
        { id: 'general', name: 'Tổng hợp', icon: '🧠' }
      ];

      var SAMPLE_QUESTIONS = {
        math: [
          { q: '15 × 6 = ?', opts: ['80', '90', '96', '85'], correct: 2 },
          { q: '25 × 4 = ?', opts: ['100', '90', '110', '80'], correct: 0 },
          { q: '36 ÷ 9 = ?', opts: ['3', '4', '5', '6'], correct: 1 },
          { q: '125 + 275 = ?', opts: ['380', '400', '420', '450'], correct: 1 },
          { q: '7² = ?', opts: ['42', '49', '56', '64'], correct: 1 },
          { q: '√144 = ?', opts: ['11', '12', '13', '14'], correct: 1 },
          { q: '3/4 + 1/4 = ?', opts: ['4/8', '1', '2/4', '3/8'], correct: 1 },
          { q: '20% của 150 = ?', opts: ['25', '30', '35', '40'], correct: 1 },
          { q: '18 × 5 = ?', opts: ['80', '85', '90', '95'], correct: 2 },
          { q: '1000 - 375 = ?', opts: ['525', '575', '625', '675'], correct: 2 },
        ],
        english: [
          { q: 'What is the past tense of "go"?', opts: ['goed', 'went', 'gone', 'going'], correct: 1 },
          { q: '"Beautiful" means...', opts: ['Xấu', 'Đẹp', 'To', 'Nhỏ'], correct: 1 },
          { q: 'Opposite of "hot":', opts: ['warm', 'cold', 'cool', 'mild'], correct: 1 },
          { q: '"She ___ to school every day"', opts: ['go', 'goes', 'going', 'went'], correct: 1 },
          { q: 'Plural of "child":', opts: ['childs', 'childes', 'children', 'child'], correct: 2 },
          { q: '"I have ___ apple"', opts: ['a', 'an', 'the', 'one'], correct: 1 },
          { q: 'Which is a verb?', opts: ['happy', 'run', 'blue', 'fast'], correct: 1 },
          { q: '"Can" is a...', opts: ['noun', 'adjective', 'modal verb', 'adverb'], correct: 2 },
          { q: 'Opposite of "big":', opts: ['huge', 'tall', 'small', 'long'], correct: 2 },
          { q: '"They ___ playing"', opts: ['is', 'are', 'am', 'be'], correct: 1 },
        ],
        science: [
          { q: 'Nước sôi ở bao nhiêu độ C?', opts: ['90°C', '100°C', '110°C', '120°C'], correct: 1 },
          { q: 'Hành tinh nào gần mặt trời nhất?', opts: ['Sao Kim', 'Sao Thủy', 'Trái Đất', 'Sao Hỏa'], correct: 1 },
          { q: 'Quang hợp tạo ra...', opts: ['CO₂', 'O₂', 'N₂', 'H₂O'], correct: 1 },
          { q: 'Có bao nhiêu nguyên tố trong Bảng tuần hoàn?', opts: ['102', '112', '118', '126'], correct: 2 },
          { q: 'Ánh sáng đi nhanh nhất trong...', opts: ['Khí', 'Chất lỏng', 'Chất rắn', 'Chân không'], correct: 3 },
          { q: 'Trái Đất mất bao lâu để quay 1 vòng?', opts: ['24 giờ', '365 ngày', '30 ngày', '7 ngày'], correct: 0 },
          { q: 'Nước được tạo từ...', opts: ['C + O', 'H + O', 'N + H', 'C + H'], correct: 1 },
          { q: 'Mặt Trăng tự...', opts: ['Phát sáng', 'Phản chiếu ánh sáng', 'Tạo nhiệt', 'Tạo điện'], correct: 1 },
          { q: 'Chất nào dẫn điện tốt nhất?', opts: ['Gỗ', 'Sắt', 'Cao su', 'Glasses'], correct: 1 },
          { q: 'Nguyên tố nào chiếm nhiều nhất trong không khí?', opts: ['O₂', 'CO₂', 'N₂', 'Ar'], correct: 2 },
        ],
        history: [
          { q: 'Việt Nam độc lập năm nào?', opts: ['1944', '1945', '1946', '1954'], correct: 1 },
          { q: 'Hồ Chí Minh mất năm nào?', opts: ['1967', '1968', '1969', '1970'], correct: 2 },
          { q: 'Chiến thắng Điện Biên Phủ năm?', opts: ['1952', '1953', '1954', '1955'], correct: 2 },
          { q: 'Thánh Giống đánh tan quân?', opts: ['Ân', 'Lý', 'Triệu', 'Ngô'], correct: 0 },
          { q: 'Hưng Yên nằm ở vùng nào?', opts: ['Tây Bắc', 'Đông Bắc', 'Đồng bằng sông Hồng', 'Bắc Trung Bộ'], correct: 2 },
          { q: 'Bà Triệu khởi nghĩa năm?', opts: ['247', '248', '249', '250'], correct: 1 },
          { q: 'Ngô Quyền đánh tan quân?', opts: ['Hán', 'Tống', 'Nam Hán', 'Minh'], correct: 2 },
          { q: 'Đại La đổi tên thành Thăng Long năm?', opts: ['1000', '1010', '1020', '1030'], correct: 1 },
          { q: 'Cuộc kháng chiến chống Pháp kéo dài bao lâu?', opts: ['7 năm', '8 năm', '9 năm', '10 năm'], correct: 2 },
          { q: 'Năm 1975 miền Nam hoàn toàn giải phóng ngày?', opts: ['30/4', '2/9', '19/8', '1/5'], correct: 0 },
        ],
        general: [
          { q: '3 + 5 × 2 = ?', opts: ['16', '13', '18', '21'], correct: 0 },
          { q: 'Thủ đô của Việt Nam?', opts: ['HCM', 'Hà Nội', 'Đà Nẵng', 'Hải Phòng'], correct: 1 },
          { q: 'Màu của bầu trời?', opts: ['Xanh lá', 'Xanh dương', 'Đỏ', 'Tím'], correct: 1 },
          { q: 'Con vật nào biết nói?', opts: ['Vẹt', 'Chó', 'Mèo', 'Cá'], correct: 0 },
          { q: '1 mét = bao nhiêu cm?', opts: ['50', '100', '200', '500'], correct: 1 },
          { q: 'Năm có 366 ngày gọi là...', opts: ['Năm thường', 'Năm nhuận', 'Năm kép', 'Năm đặc biệt'], correct: 1 },
          { q: 'Liên Hợp Quốc thành lập năm?', opts: ['1942', '1945', '1948', '1950'], correct: 1 },
          { q: 'Bảy ngày trong tuần, tên viết tắt T7 là...', opts: ['Thứ 6', 'Thứ 7', 'Chủ nhật', 'Thứ 2'], correct: 1 },
          { q: 'Thành phần chính của nước biển?', opts: ['Đường', 'Muối', 'Sắt', 'Đá'], correct: 1 },
          { q: 'Ngọn núi cao nhất thế giới?', opts: ['K2', 'Kangchenjunga', 'Everest', 'Lhotse'], correct: 2 },
        ]
      };

      var state = {
        screen: 'lobby',
        selectedSubject: 'general',
        teamScore: 0,
        questionIdx: 0,
        timer: TIMER_PER_Q,
        timerInterval: null,
        player1: { name: 'Bạn 1', score: 0, color: '#60a5fa', answered: false, answerIdx: -1 },
        player2: { name: 'Bạn 2', score: 0, color: '#f472b6', answered: false, answerIdx: -1 },
        questions: [],
        streak: 0,
        totalCorrect: 0,
        totalWrong: 0,
        gameOver: false,
        _userId: null,
        currentPlayer: 1,
        coopMode: false,
        ready: false,
        aiActive: true
      };

      function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2200);
      }

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      }

      function getQuestions(subject) {
        var pool = SAMPLE_QUESTIONS[subject] || SAMPLE_QUESTIONS.general;
        return shuffle(pool).slice(0, TOTAL_QUESTIONS);
      }

      function postToParent(type, data) {
        try { window.parent.postMessage({ type: type, data: data || {} }, '*'); } catch (e) {}
      }

      function currentQ() {
        return state.questions[state.questionIdx] || null;
      }

      // ---- RENDER ----
      function render() {
        if (state.screen === 'lobby') renderLobby();
        else if (state.screen === 'playing') renderPlaying();
        else if (state.screen === 'result') renderResult();
      }

      function renderLobby() {
        var subHtml = SUBJECTS.map(function(s) {
          var sel = state.selectedSubject === s.id ? ' selected' : '';
          return '<button class="subject-btn' + sel + '" data-subject="' + s.id + '">' + s.icon + ' ' + s.name + '</button>';
        }).join('');

        var p1Ready = state.coopMode || state.aiActive;
        var p2Ready = state.coopMode;
        var p1Cls = p1Ready ? ' ready' : '';
        var p2Cls = p2Ready ? ' ready' : '';

        root.innerHTML =
          '<div class="lobby">' +
          '<div class="lobby-icon">🧠</div>' +
          '<div class="lobby-title">QUIZ CO-OP</div>' +
          '<div class="lobby-subtitle">Cùng nhau trả lời câu hỏi,<br>tích lũy điểm cho đội!</div>' +
          '<div class="lobby-players">' +
          '<div class="lobby-player' + p1Cls + '">' +
          '<div class="avatar-lg" style="background:linear-gradient(135deg,#60a5fa,#3b82f6);">' + (state.player1.name[0] || '?') + '</div>' +
          '<div class="pname">' + state.player1.name + '</div>' +
          '<div class="pstatus">' + (p1Ready ? '✅ Sẵn sàng' : '⏳ Chờ...') + '</div>' +
          '</div>' +
          '<div class="lobby-player' + p2Cls + '">' +
          '<div class="avatar-lg" style="background:linear-gradient(135deg,#f472b6,#ec4899);">' + (state.player2.name[0] || '?') + '</div>' +
          '<div class="pname">' + state.player2.name + '</div>' +
          '<div class="pstatus">' + (p2Ready ? '✅ Sẵn sàng' : '🤖 AI Bot') + '</div>' +
          '</div>' +
          '</div>' +
          '<div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:12px;">Chọn chủ đề:</div>' +
          '<div class="lobby-subject">' + subHtml + '</div>' +
          '<div style="font-size:0.8rem;color:var(--text-dim);margin-bottom:20px;">🎮 Chế độ: ' + (state.coopMode ? 'Co-op 2 người' : ' vs AI Bot') + '</div>' +
          '<button class="lobby-btn" id="btn-start">▶ BẮT ĐẦU</button>' +
          '</div>';

        document.querySelectorAll('.subject-btn').forEach(function(btn) {
          btn.onclick = function() {
            state.selectedSubject = btn.dataset.subject;
            renderLobby();
          };
        });

        document.getElementById('btn-start').onclick = function() {
          state.questions = getQuestions(state.selectedSubject);
          state.screen = 'playing';
          state.questionIdx = 0;
          state.teamScore = 0;
          state.streak = 0;
          state.totalCorrect = 0;
          state.totalWrong = 0;
          state.player1.score = 0;
          state.player2.score = 0;
          state.gameOver = false;
          startQuestion();
        };
      }

      function startQuestion() {
        state.player1.answered = false;
        state.player1.answerIdx = -1;
        state.player2.answered = false;
        state.player2.answerIdx = -1;
        state.timer = TIMER_PER_Q;
        render();
        startTimer();
        if (state.aiActive) scheduleAIAnswer();
      }

      function startTimer() {
        clearInterval(state.timerInterval);
        state.timerInterval = setInterval(function() {
          state.timer = Math.max(0, state.timer - 0.1);
          var timerEl = document.getElementById('timer-display');
          if (timerEl) {
            timerEl.textContent = state.timer.toFixed(1) + 's';
            timerEl.className = 'timer font-mono' + (state.timer <= 5 ? ' danger' : state.timer <= 8 ? ' warning' : '');
          }
          if (state.timer <= 0) {
            clearInterval(state.timerInterval);
            timeUp();
          }
        }, 100);
      }

      function timeUp() {
        if (state.player1.answered && state.player2.answered) return;
        state.streak = 0;
        state.totalWrong++;
        var q = currentQ();
        var correctIdx = q ? q.correct : 0;
        showTimeUpFeedback(correctIdx);
        setTimeout(nextQuestion, 1500);
      }

      function showTimeUpFeedback(correctIdx) {
        var opts = document.querySelectorAll('.option-btn');
        opts.forEach(function(btn, i) {
          btn.disabled = true;
          if (i === correctIdx) btn.classList.add('correct');
        });
        var statusEl = document.getElementById('answer-status');
        if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger);font-weight:600;">⏱️ Hết giờ!</span>';
      }

      function scheduleAIAnswer() {
        var delay = 1500 + Math.random() * 3000;
        setTimeout(function() {
          if (state.screen !== 'playing' || state.player2.answered) return;
          var q = currentQ();
          if (!q) return;
          var correctChance = 0.6 + Math.random() * 0.25;
          var aiAnswer;
          if (Math.random() < correctChance) {
            aiAnswer = q.correct;
          } else {
            var wrongOpts = [0, 1, 2, 3].filter(function(i) { return i !== q.correct; });
            aiAnswer = wrongOpts[Math.floor(Math.random() * wrongOpts.length)];
          }
          state.player2.answered = true;
          state.player2.answerIdx = aiAnswer;
          if (aiAnswer === q.correct) {
            state.player2.score += CORRECT_PTS;
            state.teamScore += CORRECT_PTS;
          }
          renderPlayerStatus();
          checkBothAnswered(correctIdx);
        }, delay);
      }

      function renderPlayerStatus() {
        var el = document.getElementById('answer-status');
        if (!el) return;
        var p1Icon = state.player1.answered ? (state.player1.answerIdx === currentQ().correct ? '✅' : '❌') : '⏳';
        var p2Icon = state.player2.answered ? (state.player2.answerIdx === currentQ().correct ? '✅' : '❌') : '⏳';
        el.innerHTML =
          '<span>' + state.player1.name + ': ' + p1Icon + '</span>' +
          '<span style="margin:0 8px;opacity:0.3;">|</span>' +
          '<span>' + state.player2.name + ': ' + p2Icon + '</span>';
      }

      function checkBothAnswered(correctIdx) {
        if (!state.player1.answered || !state.player2.answered) return;
        var q = currentQ();
        var opts = document.querySelectorAll('.option-btn');
        opts.forEach(function(btn, i) {
          btn.disabled = true;
          if (i === correctIdx) btn.classList.add('correct');
        });

        var p1Correct = state.player1.answerIdx === q.correct;
        var p2Correct = state.player2.answerIdx === q.correct;

        if (p1Correct && p2Correct) {
          state.streak++;
          var combo = state.streak >= STREAK_FOR_COMBO ? COMBO_BONUS : 0;
          var pts = CORRECT_PTS + combo;
          state.teamScore += pts;
          state.totalCorrect++;
          toast('🎉 Đội trả lời đúng! +' + pts + (combo ? ' (combo x' + state.streak + '!)' : ''));
        } else if (p1Correct || p2Correct) {
          state.teamScore += CORRECT_PTS / 2;
          state.totalCorrect++;
          toast('👍 Một người đúng! +' + Math.floor(CORRECT_PTS / 2));
        } else {
          state.streak = 0;
          state.totalWrong++;
          toast('❌ Sai rồi!');
        }

        renderPlayerStatus();
        clearInterval(state.timerInterval);
        setTimeout(nextQuestion, 1200);
      }

      function nextQuestion() {
        state.questionIdx++;
        if (state.questionIdx >= state.questions.length) {
          state.screen = 'result';
          state.gameOver = true;
          clearInterval(state.timerInterval);
          postToParent('game-over', {
            score: state.teamScore,
            correct: state.totalCorrect,
            totalQuestions: state.questions.length,
            timeUsed: 0,
            coinReward: Math.floor(state.teamScore / 10)
          });
          render();
          return;
        }
        startQuestion();
      }

      function handleAnswer(idx) {
        if (state.player1.answered) return;
        var q = currentQ();
        if (!q) return;
        state.player1.answered = true;
        state.player1.answerIdx = idx;
        var isCorrect = idx === q.correct;
        if (isCorrect) {
          state.player1.score += CORRECT_PTS;
        }

        var btns = document.querySelectorAll('.option-btn');
        btns.forEach(function(btn, i) {
          if (i === idx) {
            btn.classList.add(isCorrect ? 'correct' : 'wrong');
          }
        });
        renderPlayerStatus();
        checkBothAnswered(q.correct);
      }

      function renderPlaying() {
        var q = currentQ();
        if (!q) { state.screen = 'result'; render(); return; }

        var letters = ['A', 'B', 'C', 'D'];
        var optsHtml = q.opts.map(function(opt, i) {
          return '<button class="option-btn" data-idx="' + i + '">' +
            '<span class="option-letter">' + letters[i] + '</span>' + opt + '</button>';
        }).join('');

        var progress = ((state.questionIdx + 1) / state.questions.length * 100).toFixed(0);
        var comboHtml = state.streak >= 2 ?
          '<div class="combo-bar"><span class="combo-text">🔥 Combo x' + state.streak + '!</span></div>' : '';

        root.innerHTML =
          '<div class="header">' +
          '<div class="title">QUIZ CO-OP</div>' +
          '<div class="team-score">🏆 <span class="score-num" id="team-score">' + state.teamScore + '</span></div>' +
          '<div class="timer font-mono" id="timer-display">' + state.timer.toFixed(1) + 's</div>' +
          '</div>' +
          '<div class="player-bar">' +
          renderPlayerCard(state.player1, 1) +
          renderPlayerCard(state.player2, 2) +
          '</div>' +
          '<div class="progress-bar">' +
          '<div class="track"><div class="fill" style="width:' + progress + '%;"></div></div>' +
          '<div class="label">' + (state.questionIdx + 1) + '/' + state.questions.length + '</div>' +
          '</div>' +
          comboHtml +
          '<div class="question-area">' +
          '<div class="question-badge">📖 Câu ' + (state.questionIdx + 1) + '</div>' +
          '<div class="question-text">' + q.q + '</div>' +
          '<div class="options-grid" id="options-grid">' + optsHtml + '</div>' +
          '<div class="answer-status" id="answer-status">' +
          '<div class="dot waiting"></div> Đang chờ trả lời...' +
          '</div>' +
          '</div>';

        document.querySelectorAll('.option-btn').forEach(function(btn) {
          btn.onclick = function() {
            var idx = parseInt(btn.dataset.idx, 10);
            if (!isNaN(idx)) handleAnswer(idx);
          };
        });
      }

      function renderPlayerCard(p, num) {
        var active = (num === 1 && !state.player1.answered) || (num === 2 && !state.player2.answered);
        var cls = active ? ' active' : '';
        var statusIcon = '';
        if (num === 1) {
          statusIcon = state.player1.answered ? (state.player1.answerIdx === currentQ()?.correct ? '✅' : '❌') : '⏳';
        } else {
          statusIcon = state.player2.answered ? (state.player2.answerIdx === currentQ()?.correct ? '✅' : '❌') : (state.aiActive ? '🤖' : '⏳');
        }
        return '<div class="player-card' + cls + '">' +
          '<div class="avatar" style="background:' + p.color + ';">' + (p.name[0] || '?') + '</div>' +
          '<div class="info">' +
          '<div class="name">' + p.name + '</div>' +
          '<div class="pts">⭐ ' + p.score + '</div>' +
          '</div>' +
          '<div class="status-icon">' + statusIcon + '</div>' +
          '</div>';
      }

      function renderResult() {
        var maxScore = state.questions.length * CORRECT_PTS + COMBO_BONUS * Math.floor(state.questions.length / STREAK_FOR_COMBO);
        var pct = maxScore > 0 ? Math.round(state.teamScore / maxScore * 100) : 0;
        var grade, icon;
        if (pct >= 80) { grade = 'Xuất sắc!'; icon = '🏆'; }
        else if (pct >= 60) { grade = 'Tốt lắm!'; icon = '🌟'; }
        else if (pct >= 40) { grade = 'Khá ổn!'; icon = '👍'; }
        else { grade = 'Cố gắng nhé!'; icon = '💪'; }

        root.innerHTML =
          '<div class="result-screen">' +
          '<div class="result-icon">' + icon + '</div>' +
          '<div class="result-title">' + grade + '</div>' +
          '<div class="result-subtitle">Đội đã hoàn thành ' + state.questions.length + ' câu hỏi!</div>' +
          '<div class="result-stats">' +
          '<div class="result-stat"><div class="num" style="color:var(--gold);">' + state.teamScore + '</div><div class="label">Điểm đội</div></div>' +
          '<div class="result-stat"><div class="num" style="color:var(--success);">' + state.totalCorrect + '</div><div class="label">Đúng</div></div>' +
          '<div class="result-stat"><div class="num" style="color:var(--danger);">' + state.totalWrong + '</div><div class="label">Sai</div></div>' +
          '<div class="result-stat"><div class="num" style="color:var(--accent);">' + Math.floor(state.teamScore / 10) + '</div><div class="label">Xu nhận được</div></div>' +
          '</div>' +
          '<div class="result-buttons">' +
          '<button class="result-btn secondary" id="btn-home">🏠 Menu</button>' +
          '<button class="result-btn primary" id="btn-replay">🔄 Chơi lại</button>' +
          '</div>' +
          '</div>';

        document.getElementById('btn-home').onclick = function() {
          state.screen = 'lobby';
          state.teamScore = 0;
          render();
        };
        document.getElementById('btn-replay').onclick = function() {
          state.questions = getQuestions(state.selectedSubject);
          state.screen = 'playing';
          state.questionIdx = 0;
          state.teamScore = 0;
          state.streak = 0;
          state.totalCorrect = 0;
          state.totalWrong = 0;
          state.player1.score = 0;
          state.player2.score = 0;
          state.gameOver = false;
          startQuestion();
        };
      }

      // ---- INIT ----
      window.addEventListener('message', function(e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'init' && e.data.data) {
          var d = e.data.data;
          _apiBase = d.apiBase || '';
          _authToken = d.authToken || null;
          _gameId = d.gameId || null;
          state._userId = d.userId || null;
          if (d.playerName) state.player1.name = d.playerName;
          if (d.players && d.players.length >= 2) {
            state.player2.name = d.players[1];
            state.coopMode = true;
            state.aiActive = false;
          }
          if (d.questions && d.questions.length > 0) {
            state.questions = d.questions;
          }
          render();
        } else if (e.data.type === 'opponent-move' && e.data.data) {
          var om = e.data.data;
          if (om.playerId && om.playerId !== (state._userId || '')) {
            state.coopMode = true;
            state.aiActive = false;
            state.player2.name = om.playerName || 'Bạn';
            state.player2.answered = true;
            state.player2.answerIdx = om.answerIdx != null ? om.answerIdx : -1;
            renderPlayerStatus();
            var q = currentQ();
            if (q) checkBothAnswered(q.correct);
          }
        }
      });

      postToParent('ready');
      render();
    })();
  </script>
</body>
</html>
