<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Template — PostMessage Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CSS RESET & THEME TOKENS
   Chỉnh sửa các biến này để đổi theme cho từng game khác nhau
   ============================================================ */
:root{
  --ink:#0b0d1a;
  --panel:#13162b;
  --panel-2:#1a1e38;
  --panel-3:#222742;
  --line:rgba(232,214,176,.12);
  --line-strong:rgba(232,214,176,.22);
  --gold:#f0c05a;
  --gold-dim:#a08040;
  --gold-glow:rgba(240,192,90,.18);
  --crimson:#e85d74;
  --crimson-dim:#a03048;
  --crimson-glow:rgba(232,93,116,.2);
  --teal:#4fd1c0;
  --teal-dim:#2a887c;
  --teal-glow:rgba(79,209,192,.18);
  --paper:#f2ecd8;
  --paper-dim:#a09880;
  --azure:#5aa8f0;
  --azure-dim:#2f5f96;
  --azure-glow:rgba(90,168,240,.2);
  --violet:#8b6fbf;
  --violet-dim:#5a4480;
  --violet-glow:rgba(139,111,191,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 15% -5%,rgba(76,60,120,.25) 0%,transparent 60%),
    radial-gradient(900px 500px at 95% 105%,rgba(120,40,60,.2) 0%,transparent 55%),
    radial-gradient(600px 400px at 50% 60%,rgba(40,60,100,.1) 0%,transparent 50%),
    var(--ink);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  padding:28px 16px 60px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e8d6b0' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.6;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%,rgba(242,236,216,.9),transparent),
    radial-gradient(1.4px 1.4px at 28% 8%,rgba(242,236,216,.7),transparent),
    radial-gradient(1.8px 1.8px at 46% 22%,rgba(240,192,90,.8),transparent),
    radial-gradient(1.2px 1.2px at 62% 6%,rgba(242,236,216,.6),transparent),
    radial-gradient(1.6px 1.6px at 78% 16%,rgba(242,236,216,.8),transparent),
    radial-gradient(1.3px 1.3px at 90% 28%,rgba(139,111,191,.8),transparent),
    radial-gradient(1.5px 1.5px at 8% 42%,rgba(242,236,216,.55),transparent),
    radial-gradient(1.7px 1.7px at 35% 55%,rgba(242,236,216,.7),transparent),
    radial-gradient(1.4px 1.4px at 68% 48%,rgba(240,192,90,.6),transparent),
    radial-gradient(1.6px 1.6px at 92% 62%,rgba(242,236,216,.65),transparent),
    radial-gradient(1.3px 1.3px at 20% 78%,rgba(242,236,216,.5),transparent),
    radial-gradient(1.5px 1.5px at 55% 88%,rgba(242,236,216,.6),transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{
  0%{opacity:.35}
  50%{opacity:.75}
  100%{opacity:.45}
}
.stage{width:100%;max-width:1400px;position:relative;z-index:1}

/* ============================================================
   TOPBAR — thanh trên cùng, có thể tùy biến
   ============================================================ */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  flex-wrap:wrap;
  gap:10px;
  padding:0 4px;
}
.brand{
  font-family:'Cinzel',serif;
  font-weight:800;
  letter-spacing:.06em;
  font-size:24px;
  color:var(--gold);
  text-shadow:0 0 30px rgba(240,192,90,.25),0 2px 4px rgba(0,0,0,.4);
  position:relative;
}
.brand span{
  color:var(--paper-dim);
  font-size:12.5px;
  font-family:'Inter';
  font-weight:500;
  letter-spacing:.02em;
  display:block;
  margin-top:3px;
  text-shadow:none;
}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  color:var(--paper);
  background:linear-gradient(180deg,var(--panel),rgba(19,22,43,.8));
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 14px;
  box-shadow:0 4px 12px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .15s,border-color .15s;
}
.score:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.score b{color:var(--gold)}
.btn-quit{
  font-family:'Cinzel',serif;
  font-size:12px;
  border:1px solid var(--crimson-dim);
  border-radius:10px;
  padding:7px 16px;
  color:var(--crimson);
  background:linear-gradient(180deg,rgba(232,93,116,.08),transparent);
  cursor:pointer;
  transition:all .2s;
  letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(232,93,116,.1);
}
.btn-quit:hover{
  border-color:var(--crimson);
  background:linear-gradient(180deg,rgba(232,93,116,.15),transparent);
  box-shadow:0 4px 14px rgba(232,93,116,.2);
  transform:translateY(-1px);
}
.btn-shop{
  font-family:'Cinzel',serif;
  font-size:12px;
  border:1px solid var(--gold-dim);
  border-radius:10px;
  padding:7px 16px;
  color:var(--gold);
  background:linear-gradient(180deg,rgba(240,192,90,.1),transparent);
  cursor:pointer;
  transition:all .2s;
  letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(240,192,90,.1);
}
.btn-shop:hover{
  border-color:var(--gold);
  background:linear-gradient(180deg,rgba(240,192,90,.18),transparent);
  box-shadow:0 4px 14px var(--gold-glow);
  transform:translateY(-1px);
}

/* ============================================================
   LEVEL / XP BAR — có thể ẩn nếu game không cần
   ============================================================ */
.levelbar{
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(180deg,var(--panel),rgba(19,22,43,.9));
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 16px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.03);
}
.lv-badge{
  font-family:'Cinzel',serif;
  font-weight:800;
  font-size:14px;
  color:#2a2008;
  background:linear-gradient(180deg,var(--gold),#d4a845);
  border-radius:10px;
  padding:6px 12px;
  white-space:nowrap;
  box-shadow:0 0 14px var(--gold-glow),inset 0 1px 0 rgba(255,255,255,.35);
  flex-shrink:0;
}
.xp-track{
  flex:1;
  min-width:80px;
  height:10px;
  border-radius:8px;
  background:#0a0c18;
  border:1px solid var(--line);
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
}
.xp-fill{
  height:100%;
  background:linear-gradient(90deg,var(--azure-dim),var(--azure));
  box-shadow:0 0 10px var(--azure-glow);
  border-radius:8px;
  transition:width .5s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}
.xp-fill::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.18),transparent 70%);
  animation:shimmer 2.5s ease-in-out infinite;
}
@keyframes shimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
.xp-text{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--paper-dim);
  white-space:nowrap;
  flex-shrink:0;
}

/* ============================================================
   DUNGEON HEADER — có thể ẩn nếu game không cần
   ============================================================ */
.dungeon-head{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.floor-badge,.tier-badge{
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:6px 14px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.floor-badge{color:var(--paper-dim)}
.floor-badge b{color:var(--gold)}
.tier-badge{font-weight:700;transition:all .3s}
.tier-badge.common{color:#8fa0c0;border-color:rgba(143,160,192,.35)}
.tier-badge.elite{color:var(--violet);border-color:rgba(139,111,191,.5);box-shadow:0 0 14px var(--violet-glow)}
.tier-badge.boss{
  color:var(--crimson);border-color:rgba(232,93,116,.6);box-shadow:0 0 18px var(--crimson-glow);
  animation:bossPulse 1.6s ease-in-out infinite;
}
@keyframes bossPulse{
  0%,100%{box-shadow:0 0 14px var(--crimson-glow)}
  50%{box-shadow:0 0 26px var(--crimson-glow)}
}

/* ============================================================
   ARENA — khu vực chiến đấu chính
   ============================================================ */
.arena{
  position:relative;
  background:
    linear-gradient(180deg,rgba(19,22,43,.95) 0%,rgba(15,17,34,.97) 62%,rgba(8,9,18,1) 100%),
    radial-gradient(700px 250px at 30% 100%,rgba(79,209,192,.07),transparent),
    radial-gradient(600px 200px at 70% 100%,rgba(232,93,116,.06),transparent);
  border:1px solid var(--line);
  border-radius:20px;
  padding:32px 26px 22px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
  gap:14px;
  overflow:hidden;
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 0 1px rgba(255,255,255,.02),
    inset 0 1px 0 rgba(255,255,255,.04);
  transition:box-shadow .4s;
}
.arena.boss-active{
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 0 1px rgba(232,93,116,.15),
    inset 0 1px 0 rgba(255,255,255,.04),
    0 0 40px rgba(232,93,116,.12);
}
.combatant{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  z-index:1;
  position:relative;
}
.combatant .name{
  font-family:'Cinzel',serif;
  font-size:14px;
  letter-spacing:.04em;
  color:var(--paper-dim);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  position:relative;
}
.combatant .name::after{
  content:'';
  display:block;
  width:28px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
  margin:5px auto 0;
  border-radius:2px;
  opacity:.6;
}
.hpbar-wrap{width:170px;position:relative}
.hpbar{
  height:11px;
  border-radius:8px;
  background:#0a0c18;
  border:1px solid var(--line);
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.03);
}
.hpfill{
  height:100%;
  border-radius:8px;
  transition:width .6s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}
.hpfill.player{
  background:linear-gradient(90deg,var(--teal-dim),var(--teal));
  box-shadow:0 0 12px var(--teal-glow),inset 0 -1px 0 rgba(0,0,0,.2);
}
.hpfill.enemy{
  background:linear-gradient(90deg,var(--crimson-dim),var(--crimson));
  box-shadow:0 0 12px var(--crimson-glow),inset 0 -1px 0 rgba(0,0,0,.2);
}
.hptext{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--paper-dim);
  margin-top:5px;
  text-align:center;
  letter-spacing:.02em;
}
.sprite{
  width:110px;
  height:110px;
  position:relative;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
  transition:transform .3s ease;
  overflow:visible;
}
.sprite.boss-size{width:132px;height:132px}
.sprite svg{width:100%;height:100%}
.sprite.hit{animation:hit .45s ease}
@keyframes hit{
  0%,100%{transform:translateX(0) scale(1)}
  15%{transform:translateX(-10px) rotate(-4deg) scale(.97)}
  35%{transform:translateX(8px) rotate(3deg) scale(.97)}
  55%{transform:translateX(-5px) rotate(-2deg)}
  75%{transform:translateX(3px) rotate(1deg)}
}
.sprite.attack{animation:attackLunge .4s ease}
@keyframes attackLunge{
  0%{transform:translateX(0)}
  40%{transform:translateX(28px) scale(1.05)}
  100%{transform:translateX(0)}
}
.sprite.enemy-attack{animation:enemyLunge .4s ease}
@keyframes enemyLunge{
  0%{transform:translateX(0)}
  40%{transform:translateX(-28px) scale(1.05)}
  100%{transform:translateX(0)}
}
.vs{
  font-family:'Cinzel',serif;
  color:var(--gold-dim);
  font-size:26px;
  padding-bottom:50px;
  font-weight:700;
  letter-spacing:.08em;
  position:relative;
  text-shadow:0 0 20px rgba(240,192,90,.15);
}
.floattext{
  position:absolute;
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
  font-size:22px;
  pointer-events:none;
  opacity:0;
  z-index:10;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
  letter-spacing:.02em;
  white-space:nowrap;
}
.floattext.show{animation:floatUp 1.1s ease forwards}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) scale(.8)}
  12%{opacity:1;transform:translateY(-8px) scale(1.1)}
  25%{transform:translateY(-16px) scale(1)}
  100%{opacity:0;transform:translateY(-56px) scale(.95)}
}
.floattext.dmg{color:var(--crimson)}
.floattext.heal{color:var(--gold)}
.floattext.coin{color:var(--gold);font-size:19px}
.floattext.xp{color:var(--azure);font-size:16px}

/* ============================================================
   QCARD — khu vực câu hỏi
   ============================================================ */
.qcard{
  margin-top:0;
  background:linear-gradient(180deg,var(--panel),rgba(19,22,43,.97));
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px 24px 20px;
  position:relative;
  box-shadow:
    0 16px 48px rgba(0,0,0,.3),
    0 0 0 1px rgba(255,255,255,.02),
    inset 0 1px 0 rgba(255,255,255,.03);
  overflow:hidden;
}
.game-left .qcard{margin-top:20px}
.qmeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.qeyebrow{
  font-family:'Cinzel',serif;
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-dim);
  position:relative;
  padding-left:14px;
}
.qeyebrow::before{
  content:'';
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:6px;
  height:6px;
  background:var(--gold);
  border-radius:50%;
  box-shadow:0 0 8px var(--gold-glow);
}
.timerwrap{display:flex;align-items:center;gap:10px}
.timerring{position:relative;width:36px;height:36px}
.timerring svg{
  width:36px;
  height:36px;
  transform:rotate(-90deg);
  filter:drop-shadow(0 0 4px rgba(240,192,90,.2));
}
.timerring circle.bg{stroke:rgba(232,214,176,.1)}
.timerring circle.fg{stroke:var(--gold);transition:stroke-dashoffset 1s linear}
.timernum{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  color:var(--paper);
}
.qtext{
  font-size:19px;
  font-weight:600;
  line-height:1.55;
  margin-bottom:18px;
  color:var(--paper);
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  padding:0 2px;
}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.options{grid-template-columns:1fr}}
.game-right .options{grid-template-columns:1fr}
.opt{
  text-align:left;
  background:linear-gradient(180deg,var(--panel-2),var(--panel-3));
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:12px;
  padding:14px 18px;
  font-family:'Inter';
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.03);
}
.opt:hover:not(:disabled){
  border-color:var(--gold-dim);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.25),0 0 16px var(--gold-glow);
}
.opt:disabled{cursor:default;opacity:.85}
.opt.correct{
  border-color:var(--gold);
  background:linear-gradient(180deg,rgba(232,182,73,.18),rgba(232,182,73,.06));
  box-shadow:0 0 20px var(--gold-glow);
}
.opt.wrong{
  border-color:var(--crimson);
  background:linear-gradient(180deg,rgba(224,84,106,.16),rgba(224,84,106,.05));
  box-shadow:0 0 16px var(--crimson-glow);
  animation:wrongShake .45s ease;
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}
.feedback{
  margin-top:16px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13.5px;
  min-height:20px;
  padding:10px 14px;
  border-radius:10px;
  transition:all .3s ease;
}
.feedback.ok{
  color:var(--gold);
  background:rgba(240,192,90,.08);
  border:1px solid rgba(240,192,90,.15);
}
.feedback.bad{
  color:var(--crimson);
  background:rgba(232,93,116,.06);
  border:1px solid rgba(232,93,116,.12);
}

/* ============================================================
   ATTACK MODAL — chọn đòn tấn công
   ============================================================ */
.attack-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(6,7,16,.8);
  backdrop-filter:blur(4px);
  z-index:300;
  align-items:center;justify-content:center;
  padding:20px;
}
.attack-overlay.show{display:flex;animation:fadeInUp .2s ease}
.attack-modal{
  width:100%;max-width:520px;
  background:linear-gradient(180deg,var(--panel),rgba(11,13,26,.98));
  border:1px solid var(--line-strong);
  border-radius:20px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);
}
.attack-modal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.attack-modal-title{
  font-family:'Cinzel',serif;font-size:18px;font-weight:700;
  color:var(--gold);letter-spacing:.03em;
  text-shadow:0 0 20px rgba(240,192,90,.2);
}
.attack-modal-hint{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--paper-dim);
}
.attack-modal-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
@media(max-width:500px){.attack-modal-grid{grid-template-columns:repeat(2,1fr)}}
.atk-card{
  background:linear-gradient(180deg,#262a4e,#1c1f3a);
  border:1px solid var(--gold-dim);
  border-radius:12px;
  padding:14px 10px;
  text-align:center;
  cursor:pointer;
  color:var(--paper);
  transition:all .2s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.2);
  opacity:0;
  transform:translateY(16px) scale(.92);
  animation:atkCardIn .35s ease forwards;
}
@keyframes atkCardIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}
.atk-card:hover:not(.locked){
  border-color:var(--gold);
  transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(0,0,0,.3),0 0 20px var(--gold-glow);
}
.atk-card .icon{font-size:26px;display:block;margin-bottom:4px}
.atk-card .aname{font-weight:700;font-size:12px;line-height:1.25}
.atk-card .arange{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--paper-dim);margin-top:3px;display:block}
.atk-card .areq{font-family:'IBM Plex Mono',monospace;font-size:10px;margin-top:4px;display:block;font-weight:600}
.atk-card.locked{cursor:not-allowed;filter:grayscale(.75) brightness(.6);opacity:.5;animation:none}
.atk-card.locked .areq{color:var(--crimson)}

/* ============================================================
   BANNER — kết thúc game
   ============================================================ */
.banner{
  display:none;
  margin-top:22px;
  text-align:center;
  padding:36px 28px;

}
.banner h2{
  font-family:'Cinzel',serif;

  margin-bottom:10px;
  font-weight:700;

}

}
.banner .summary{

}
.banner .summary .chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  padding:8px 16px;
  border-radius:10px;

}
.banner .summary .chip b{color:var(--gold)}
.retry{
  font-family:'Cinzel',serif;
  background:linear-gradient(180deg,var(--gold),#d4a845);

  border:none;
  border-radius:10px;
  padding:12px 28px;
  font-weight:700;
  cursor:pointer;
  letter-spacing:.04em;
  font-size:14px;
  transition:all .2s ease;
  box-shadow:0 6px 20px rgba(240,192,90,.25),inset 0 1px 0 rgba(255,255,255,.3);
}
.retry:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(240,192,90,.35),inset 0 1px 0 rgba(255,255,255,.3);
}
.statusline{
  text-align:center;
  margin-top:14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:var(--paper-dim);
  min-height:20px;
}
.statusline.err{color:var(--crimson)}

/* ============================================================
   LAYOUT — 2 cột
   ============================================================ */
.game-layout{
  display:flex;
  gap:20px;
  align-items:flex-start;
}
.game-left{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.game-right{

  .game-layout{flex-direction:column}

/* ============================================================
   SHOP OVERLAY
   ============================================================ */
.shop-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(6,7,16,.72);
  backdrop-filter:blur(3px);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.shop-overlay.show{display:flex;animation:fadeInUp .25s ease}
.shop-panel{
  width:100%;
  max-width:660px;
  max-height:85vh;
  overflow-y:auto;
  background:linear-gradient(180deg,var(--panel),rgba(11,13,26,.98));
  border:1px solid var(--line-strong);
  border-radius:20px;
  padding:22px 22px 26px;

}

}

}

.shop-tabs{display:flex;gap:8px;margin-bottom:10px}
.shop-tab{

  padding:8px 18px;
  border-radius:10px 10px 0 0;

@keyframes fadeInUp{
  from{opacity:0;transform:translateY(12px)}

}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<script>
/* ================================================================
   GAME TEMPLATE — PostMessage Bridge
   
   Kiến trúc:
   - Game Engine: quản lý state, render UI, xử lý logic
   - PostMessage Bridge: giao tiếp với React parent
   - API Layer: gọi API qua postMessage, nhận kết quả qua event
   
   Cách dùng cho game mới:
   1. Sửa CSS variables ở :root để đổi theme
   2. Sửa HTML structure (arena, qcard, banner, ...) cho phù hợp
   3. Sửa GAME_CONFIG với thông số game
   4. Sửa các hàm xử lý logic (renderQuestion, submitAnswer, ...)
   5. Giữ nguyên phần PostMessage Bridge
   ================================================================ */

(function(){
'use strict';

/* ================================================================
   GAME CONFIG — tất cả thông số có thể tùy chỉnh
   ================================================================ */
var GAME_CONFIG = {
  // Leveling
  levels: [0, 30, 80, 150, 250, 400, 600, 900],
  xpPerCorrect: 8,
  
  // Player
  playerMaxHp: 100,
  
  // Enemy
  enemyBaseHp: 80,
  enemyHpStep: 14,
  enemyHitDmg: [8, 16],
  enemyNames: ["Kẻ Địch 1", "Kẻ Địch 2", "Kẻ Địch 3", "Kẻ Địch 4", "Kẻ Địch 5", "Kẻ Địch 6"],
  bossNames: ["TRÙM: Kẻ Hủy Diệt", "TRÙM: Bóng Tối", "TRÙM: Hư Không", "TRÙM: Cổ Thần"],
  
  // Dungeon
  bossEvery: 5,
  eliteEvery: 3,
  
  // Rewards
  coinBase: 10,
  coinFloorMult: 4,
  coinBossMult: 4,
  coinEliteMult: 2,
  
  // Attacks
  attacks: [
    {name:"Đòn Cơ Bản",icon:"\u2694\uFE0F",min:10,max:18,tier:1,reqXp:0},
    {name:"Đòn Mạnh",icon:"\uD83D\uDCA5",min:12,max:19,tier:1,reqXp:0},
    {name:"Đòn Nhanh",icon:"\uD83D\uDCA8",min:11,max:20,tier:1,reqXp:0},
    {name:"Đòn Lửa",icon:"\uD83D\uDD25",min:16,max:26,tier:2,reqXp:30},
    {name:"Đòn Sét",icon:"\u26A1",min:14,max:30,tier:2,reqXp:30},
    {name:"Đòn Gió",icon:"\uD83C\uDF00",min:18,max:27,tier:2,reqXp:30},
    {name:"Đòn Băng",icon:"\u2744\uFE0F",min:20,max:32,tier:3,reqXp:80},
    {name:"Đòn Độc",icon:"\u2620\uFE0F",min:19,max:29,tier:3,reqXp:80},
    {name:"Đòn Bão",icon:"\uD83C\uDF2A\uFE0F",min:22,max:34,tier:3,reqXp:80},
    {name:"Đòn Thiên Thạch",icon:"\u2604\uFE0F",min:26,max:40,tier:4,reqXp:150},
    {name:"Đòn Hắc Ám",icon:"\uD83C\uDF11",min:28,max:42,tier:4,reqXp:150},
    {name:"Đòn Rồng",icon:"\uD83D\uDC09",min:40,max:60,tier:5,reqXp:250}
  ]
};

/* ================================================================
   STATE
   ================================================================ */
var state = {
  questions: [],
  qIndex: 0,
  score: 0,
  xp: 0,
  level: 1,
  playerHp: GAME_CONFIG.playerMaxHp,
  enemyHp: GAME_CONFIG.enemyBaseHp,
  enemyMaxHp: GAME_CONFIG.enemyBaseHp,
  enemyRound: 0,
  tier: 'common',
  floor: 1,
  timer: null,
  timeLeft: 20,
  timeLimit: 20,
  locked: false,
  gameId: null,
  sessionCoins: 0,
  started: false
};

var userCoins = 0;
var hasWebAvatar = false;

/* ================================================================
   POSTMESSAGE BRIDGE — giao tiếp với React parent
   
   Các type message gửi đi:
   - 'ready'          : game đã sẵn sàng
   - 'state-update'   : cập nhật state (coins, score, ...)
   - 'add-coins'      : yêu cầu cộng/trừ coins
   - 'game-over'      : game kết thúc
   - 'quit'           : người dùng thoát
   - 'save-loadout'   : lưu trang bị
   
   Các type message nhận vào:
   - 'init'           : khởi tạo game với data
   ================================================================ */
function postToParent(type, data) {
  try {
    window.parent.postMessage({ type: type, data: data }, '*');
  } catch(e) {
    console.warn('postMessage failed:', e);
  }
}

function broadcastState() {
  postToParent('state-update', {
    type: 'play-to-win',
    coins: userCoins,
    score: state.score,
    xp: state.xp,
    level: state.level,
    floor: state.floor,
    gameId: state.gameId
  });
}

/* ================================================================
   API LAYER — gọi API qua postMessage
   
   React parent cần lắng nghe message type 'api-call' và trả lời
   bằng cách gọi window.apiCallback trong iframe.
   
   Cách hoạt động:
   1. Iframe gửi: { type: 'api-call', data: { api: 'submitAnswer', params: {...}, callbackId: 'xxx' } }
   2. React gọi API, sau đó gửi lại: { type: 'api-response', data: { callbackId: 'xxx', result: {...} } }
   3. Iframe nhận và resolve promise
   ================================================================ */
var apiCallbacks = {};
var apiCallbackId = 0;

function callApi(apiName, params) {
  return new Promise(function(resolve, reject) {
    var callbackId = 'api_' + (++apiCallbackId);
    apiCallbacks[callbackId] = { resolve: resolve, reject: reject };
    
    postToParent('api-call', {
      api: apiName,
      params: params,
      callbackId: callbackId
    });
    
    // Timeout sau 10s
    setTimeout(function() {
      if (apiCallbacks[callbackId]) {
        delete apiCallbacks[callbackId];
        reject(new Error('API timeout: ' + apiName));
      }
    }, 10000);
  });
}

// Hàm này được React gọi khi có kết quả API
window.apiCallback = function(callbackId, result, error) {
  var cb = apiCallbacks[callbackId];
  if (!cb) return;
  delete apiCallbacks[callbackId];
  if (error) cb.reject(new Error(error));
  else cb.resolve(result);
};

/* ================================================================
   DOM HELPERS
   ================================================================ */
function el(id) { return document.getElementById(id); }

function setStatus(msg, isErr) {
  var s = el('statusline');
  s.textContent = msg || '';
  s.className = 'statusline' + (isErr ? ' err' : '');
}

/* ================================================================
   LEVEL / XP
   ================================================================ */
function levelFromXp(xp) {
  var lv = 1;
  for (var i = 0; i < GAME_CONFIG.levels.length; i++) {
    if (xp >= GAME_CONFIG.levels[i]) lv = i + 1;
  }
  return lv;
}

function xpRangeForLevel(lv) {
  var cur = GAME_CONFIG.levels[lv-1] !== undefined ? GAME_CONFIG.levels[lv-1] : GAME_CONFIG.levels[GAME_CONFIG.levels.length-1];
  var next = GAME_CONFIG.levels[lv] !== undefined ? GAME_CONFIG.levels[lv] : null;
  return { cur: cur, next: next };
}

function updateLevelUI(prevLevel) {
  var lv = levelFromXp(state.xp);
  state.level = lv;
  el('lvVal').textContent = lv;
  var rng = xpRangeForLevel(lv);
  if (rng.next === null) {
    el('xpFill').style.width = '100%';
    el('xpText').textContent = state.xp + ' XP (Cấp tối đa)';
  } else {
    var pct = Math.max(0, Math.min(100, (state.xp - rng.cur) / (rng.next - rng.cur) * 100));
    el('xpFill').style.width = pct + '%';
    el('xpText').textContent = state.xp + ' / ' + rng.next + ' XP';
  }
  if (prevLevel !== undefined && lv > prevLevel) {
    el('levelbar').classList.add('levelup-flash');
    setTimeout(function() { el('levelbar').classList.remove('levelup-flash'); }, 1000);
    setStatus('Thăng cấp! Bạn đã đạt Lv.' + lv);
  }
}

function gainXp(amount, overEnemy) {
  var prevLevel = state.level;
  state.xp += amount;
  updateLevelUI(prevLevel);
  floatText('+' + amount + ' XP', 'xp', !!overEnemy);
}

/* ================================================================
   DUNGEON
   ================================================================ */
function computeDungeonMeta(round) {
  var pos = round + 1;
  var tier = 'common';
  if (pos % GAME_CONFIG.bossEvery === 0) tier = 'boss';
  else if (pos % GAME_CONFIG.eliteEvery === 0) tier = 'elite';
  var floor = Math.floor(round / GAME_CONFIG.bossEvery) + 1;
  return { tier: tier, floor: floor };
}

function updateDungeonUI() {
  el('floorVal').textContent = state.floor;
  var tb = el('tierBadge');
  tb.className = 'tier-badge ' + state.tier;
  tb.textContent = state.tier === 'boss' ? 'TRÙM TẦNG' : (state.tier === 'elite' ? 'Tinh Anh' : 'Thường');
  el('arena').classList.toggle('boss-active', state.tier === 'boss');
  var spriteCls = 'sprite' + (state.tier === 'boss' ? ' boss-size boss' : (state.tier === 'elite' ? ' elite' : ''));
  el('enemySprite').className = spriteCls;
}

function enemyDisplayName(round, tier) {
  if (tier === 'boss') return GAME_CONFIG.bossNames[Math.floor(round / GAME_CONFIG.bossEvery) % GAME_CONFIG.bossNames.length];
  return GAME_CONFIG.enemyNames[round % GAME_CONFIG.enemyNames.length];
}

function coinRewardFor(tier, floor) {
  var base = GAME_CONFIG.coinBase + floor * GAME_CONFIG.coinFloorMult;
  if (tier === 'boss') return Math.round(base * GAME_CONFIG.coinBossMult);
  if (tier === 'elite') return Math.round(base * GAME_CONFIG.coinEliteMult);
  return base;
}

/* ================================================================
   QUESTION FLOW
   ================================================================ */
function renderQuestion() {
  clearInterval(state.timer);
  state.locked = false;
  closeAttackModal();
  el('feedback').textContent = '';
  el('feedback').className = 'feedback';
  
  if (!state.questions.length) {
    el('qtext').textContent = 'Không có câu hỏi.';
    return;
  }
  
  var q = state.questions[state.qIndex % state.questions.length];
  el('qcounter').textContent = 'Câu hỏi ' + (state.qIndex + 1);
  el('qtext').textContent = q.content;
  
  var optWrap = el('options');
  optWrap.innerHTML = '';
  q.options.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.content;
    btn.onclick = function() { submitAnswer(q, opt.id, btn); };
    optWrap.appendChild(btn);
  });
  
  state.timeLimit = q.timeLimit || 20;
  state.timeLeft = state.timeLimit;
  updateTimerRing();
  
  state.timer = setInterval(function() {
    state.timeLeft--;
    updateTimerRing();
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      if (!state.locked) handleTimeout();
    }
  }, 1000);
}

function updateTimerRing() {
  var circ = 2 * Math.PI * 15;
  var ratio = Math.max(0, state.timeLeft / state.timeLimit);
  el('timerCircle').style.strokeDasharray = circ;
  el('timerCircle').style.strokeDashoffset = circ * (1 - ratio);
  el('timerNum').textContent = Math.max(0, state.timeLeft);
}

function submitAnswer(question, answerId, btnEl) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(state.timer);
  
  Array.from(el('options').children).forEach(function(b) { b.disabled = true; });
  
  // Gọi API qua postMessage
  callApi('submitAnswer', { questionId: question.id, answerId: answerId })
    .then(function(result) {
      handleAnswerResult(result, btnEl);
    })
    .catch(function(err) {
      console.error('submitAnswer error:', err);
      setStatus('Lỗi gửi đáp án', true);
      state.locked = false;
      Array.from(el('options').children).forEach(function(b) { b.disabled = false; });
    });
}

function handleAnswerResult(result, btnEl) {
  setStatus('');
  if (result.correct) {
    btnEl.classList.add('correct');
    el('feedback').textContent = 'Chính xác! +' + (result.points || 0) + ' điểm — chọn một đòn để tấn công.';
    el('feedback').className = 'feedback ok';
    state.score += (result.points || 0);
    el('scoreVal').textContent = state.score;
    gainXp(GAME_CONFIG.xpPerCorrect, false);
    showAttackOptions();
  } else {
    btnEl.classList.add('wrong');
    el('feedback').textContent = 'Sai rồi — đối thủ phản đòn!';
    el('feedback').className = 'feedback bad';
    setTimeout(enemyStrikes, 500);
  }
}

function handleTimeout() {
  state.locked = true;
  Array.from(el('options').children).forEach(function(b) { b.disabled = true; });
  el('feedback').textContent = 'Hết giờ — đối thủ phản đòn!';
  el('feedback').className = 'feedback bad';
  setTimeout(enemyStrikes, 400);
}

/* ================================================================
   ATTACK SELECTION
   ================================================================ */
function showAttackOptions() {
  var grid = el('attackModalGrid');
  grid.innerHTML = '';
  var unlockedCount = 0;
  
  GAME_CONFIG.attacks.forEach(function(a) {
    var locked = state.xp < a.reqXp;
    if (!locked) unlockedCount++;
    
    var div = document.createElement('div');
    div.className = 'atk-card' + (locked ? ' locked' : '');
    div.setAttribute('data-tier', a.tier);
    
    var reqHtml = locked ? '<span class="areq">\uD83D\uDD12 Cần ' + a.reqXp + ' XP</span>' : '';
    var rangeLabel = a.min + '-' + a.max + ' dmg';
    
    div.innerHTML = '<span class="icon">' + a.icon + '</span>' +
      '<span class="aname">' + a.name + '</span>' +
      '<span class="arange">' + rangeLabel + '</span>' + reqHtml;
    
    if (!locked) {
      div.onclick = function() { closeAttackModal(); playerAttacks(a); };
    }
    grid.appendChild(div);
  });
  
  el('attackModalHint').textContent = unlockedCount + '/' + GAME_CONFIG.attacks.length + ' đòn';
  el('attackOverlay').classList.add('show');
}

function closeAttackModal() {
  el('attackOverlay').classList.remove('show');
}

el('attackOverlay').addEventListener('click', function(e) {
  if (e.target === el('attackOverlay')) closeAttackModal();
});

/* ================================================================
   COMBAT
   ================================================================ */
function floatText(text, cls, overEnemy) {
  var arena = el('arena'), ft = el('floatText');
  var rect = (overEnemy ? el('enemySprite') : el('playerSprite')).getBoundingClientRect();
  var arenaRect = arena.getBoundingClientRect();
  ft.style.left = (rect.left - arenaRect.left + rect.width/2 - 14) + 'px';
  ft.style.top = (rect.top - arenaRect.top - 6) + 'px';
  ft.textContent = text;
  ft.className = 'floattext ' + cls;
  void ft.offsetWidth;
  ft.className = 'floattext ' + cls + ' show';
}

function playerAttacks(atk) {
  closeAttackModal();
  var dmg = Math.floor(Math.random() * (atk.max - atk.min + 1)) + atk.min;
  state.enemyHp = Math.max(0, state.enemyHp - dmg);
  
  el('enemySprite').classList.add('hit');
  el('playerSprite').className = 'sprite attack';
  floatText('-' + dmg, 'dmg', true);
  updateBars();
  
  setTimeout(function() {
    el('enemySprite').classList.remove('hit');
    el('playerSprite').className = 'sprite';
  }, 450);
  
  if (state.enemyHp <= 0) {
    setTimeout(defeatEnemy, 600);
  } else {
    setTimeout(nextQuestionOrEnd, 1000);
  }
}

function enemyStrikes() {
  var dmgMult = state.tier === 'boss' ? 1.6 : (state.tier === 'elite' ? 1.2 : 1);
  var dmg = Math.round((Math.floor(Math.random() * (GAME_CONFIG.enemyHitDmg[1] - GAME_CONFIG.enemyHitDmg[0] + 1)) + GAME_CONFIG.enemyHitDmg[0]) * dmgMult);
  state.playerHp = Math.max(0, state.playerHp - dmg);
  
  el('playerSprite').className = 'sprite hit';
  el('enemySprite').classList.add('enemy-attack');
  el('arena').classList.add('shake');
  floatText('-' + dmg, 'dmg', false);
  updateBars();
  
  setTimeout(function() {
    el('playerSprite').className = 'sprite';
    el('enemySprite').classList.remove('enemy-attack');
    el('arena').classList.remove('shake');
  }, 450);
  
  if (state.playerHp <= 0) setTimeout(gameOver, 700);
  else setTimeout(nextQuestionOrEnd, 1000);
}

function updateBars() {
  el('playerHpFill').style.width = (state.playerHp / GAME_CONFIG.playerMaxHp * 100) + '%';
  el('playerHpText').textContent = state.playerHp + ' / ' + GAME_CONFIG.playerMaxHp;
  el('enemyHpFill').style.width = (state.enemyHp / state.enemyMaxHp * 100) + '%';
  el('enemyHpText').textContent = state.enemyHp + ' / ' + state.enemyMaxHp;
}

function grantCoins(amount) {
  if (amount <= 0) return;
  userCoins += amount;
  state.sessionCoins += amount;
  el('coinVal').textContent = userCoins;
  if (el('shopOverlay').classList.contains('show')) el('shopCoinVal').textContent = userCoins;
  broadcastState();
  postToParent('add-coins', { amount: amount });
}

function defeatEnemy() {
  var defeatedTier = state.tier, defeatedFloor = state.floor;
  var reward = coinRewardFor(defeatedTier, defeatedFloor);
  grantCoins(reward);
  floatText('+' + reward + ' XU', 'coin', true);
  gainXp(defeatedTier === 'boss' ? 25 : (defeatedTier === 'elite' ? 15 : 8), true);
  
  state.enemyRound++;
  var meta = computeDungeonMeta(state.enemyRound);
  state.tier = meta.tier;
  state.floor = meta.floor;
  var nextMax = GAME_CONFIG.enemyBaseHp + state.enemyRound * GAME_CONFIG.enemyHpStep;
  if (state.tier === 'boss') nextMax = Math.round(nextMax * 1.6);
  else if (state.tier === 'elite') nextMax = Math.round(nextMax * 1.25);
  state.enemyMaxHp = nextMax;
  state.enemyHp = nextMax;
  
  el('enemyName').textContent = enemyDisplayName(state.enemyRound, state.tier);
  updateDungeonUI();
  updateBars();
  
  var msg = defeatedTier === 'boss'
    ? 'Hạ gục Trùm tầng! +' + reward + ' xu — bước sang tầng mới.'
    : 'Hạ gục! +' + reward + ' xu. Một đối thủ mới xuất hiện.';
  el('feedback').textContent = msg;
  el('feedback').className = 'feedback ok';
  
  setTimeout(nextQuestionOrEnd, 300);
}

function nextQuestionOrEnd() {
  state.qIndex++;
  if (state.qIndex >= state.questions.length * 20) winGame();
  else renderQuestion();
}

function summaryChips() {
  return '<div class="chip">Điểm: <b>' + state.score + '</b></div>' +
    '<div class="chip">Xu kiếm được: <b>' + state.sessionCoins + '</b></div>' +
    '<div class="chip">Cấp: <b>Lv.' + state.level + '</b></div>' +
    '<div class="chip">Tầng đạt tới: <b>' + state.floor + '</b></div>';
}

function gameOver() {
  clearInterval(state.timer);
  el('qcard').style.display = 'none';
  el('bannerTitle').textContent = 'Bạn đã gục ngã';
  el('bannerText').textContent = 'Đừng nản lòng — thử lại để leo cao hơn!';
  el('bannerSummary').innerHTML = summaryChips();
  el('banner').className = 'banner show';
  
  postToParent('game-over', {
    score: state.score,
    correct: state.qIndex,
    timeUsed: 0,
    totalCoins: userCoins,
    result: 'lose'
  });
}

function winGame() {
  clearInterval(state.timer);
  el('qcard').style.display = 'none';
  el('bannerTitle').textContent = 'Chiến thắng vang dội!';
  el('bannerText').textContent = 'Bạn đã trả lời hết câu hỏi và chinh phục ' + state.floor + ' tầng dungeon.';
  el('bannerSummary').innerHTML = summaryChips();
  el('banner').className = 'banner show';
  
  postToParent('game-over', {
    score: state.score,
    correct: state.questions.length,
    timeUsed: 0,
    totalCoins: userCoins,
    result: 'win'
  });
}

/* ================================================================
   GAME INIT
   ================================================================ */
function initGame(data) {
  var meta0 = computeDungeonMeta(0);
  
  state = {
    questions: data.questions || [],
    qIndex: 0,
    score: 0,
    xp: 0,
    level: 1,
    playerHp: GAME_CONFIG.playerMaxHp,
    enemyHp: GAME_CONFIG.enemyBaseHp,
    enemyMaxHp: GAME_CONFIG.enemyBaseHp,
    enemyRound: 0,
    tier: meta0.tier,
    floor: meta0.floor,
    timer: null,
    timeLeft: 20,
    timeLimit: 20,
    locked: false,
    gameId: data.gameId || null,
    sessionCoins: 0,
    started: true
  };
  
  userCoins = data.coins || 0;
  
  // Avatar tùy chỉnh từ React
  if (data.avatarSvg) {
    hasWebAvatar = true;
    var ps = document.getElementById('playerSprite');
    if (ps) {
      ps.innerHTML = '<svg viewBox="0 0 512 700" style="width:100%;height:auto;overflow:visible;">' + data.avatarSvg + '</svg>';
    }
  }
  
  el('scoreVal').textContent = '0';
  el('coinVal').textContent = userCoins;
  el('enemyName').textContent = enemyDisplayName(0, state.tier);
  el('qcard').style.display = 'block';
  el('banner').className = 'banner';
  
  updateLevelUI();
  updateDungeonUI();
  updateBars();
  renderQuestion();
  
  postToParent('state-update', { type: 'init', coins: userCoins, gameId: state.gameId });
}

/* ================================================================
   EVENT LISTENERS
   ================================================================ */
el('retryBtn').onclick = function() {
  var keepQuestions = state.questions;
  var keepGameId = state.gameId;
  var meta0 = computeDungeonMeta(0);
  
  state = {
    questions: keepQuestions,
    qIndex: 0,
    score: 0,
    xp: 0,
    level: 1,
    playerHp: GAME_CONFIG.playerMaxHp,
    enemyHp: GAME_CONFIG.enemyBaseHp,
    enemyMaxHp: GAME_CONFIG.enemyBaseHp,
    enemyRound: 0,
    tier: meta0.tier,
    floor: meta0.floor,
    timer: null,
    timeLeft: 20,
    timeLimit: 20,
    locked: false,
    gameId: keepGameId,
    sessionCoins: 0,
    started: true
  };
  
  el('scoreVal').textContent = '0';
  el('coinVal').textContent = userCoins;
  el('enemyName').textContent = enemyDisplayName(0, state.tier);
  updateLevelUI();
  updateDungeonUI();
  updateBars();
  el('qcard').style.display = 'block';
  el('banner').className = 'banner';
  renderQuestion();
};

el('btnQuit').onclick = function() {
  postToParent('quit');
};

el('btnShop').onclick = function() {
  el('shopOverlay').classList.add('show');
  el('shopCoinVal').textContent = userCoins;
};

el('shopClose').onclick = function() {
  el('shopOverlay').classList.remove('show');
};

el('shopOverlay').addEventListener('click', function(e) {
  if (e.target === el('shopOverlay')) el('shopOverlay').classList.remove('show');
});

/* ================================================================
   MESSAGE HANDLER — nhận lệnh từ React parent
   ================================================================ */
window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  
  switch (e.data.type) {
    case 'init':
      initGame(e.data.data || {});
      break;
      
    case 'api-response':
      // React trả lời API call
      var d = e.data.data || {};
      window.apiCallback(d.callbackId, d.result, d.error);
      break;
      
    case 'update-coins':
      userCoins = e.data.data.coins || 0;
      el('coinVal').textContent = userCoins;
      break;
      
    case 'pause':
      if (state.timer) clearInterval(state.timer);
      break;
      
    case 'resume':
      if (state.started && !state.locked && state.timeLeft > 0) {
        state.timer = setInterval(function() {
          state.timeLeft--;
          updateTimerRing();
          if (state.timeLeft <= 0) {
            clearInterval(state.timer);
            if (!state.locked) handleTimeout();
          }
        }, 1000);
      }
      break;
  }
});

/* ================================================================
   BOOT — báo cho React biết game đã sẵn sàng
   ================================================================ */
postToParent('ready', { version: '1.0.0', game: 'template' });

})();
</script>
