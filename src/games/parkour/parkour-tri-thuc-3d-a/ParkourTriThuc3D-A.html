<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Parkour Tri Thức 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Baloo 2",system-ui,sans-serif;touch-action:none}
  #wrap{position:fixed;top:0;left:0;transform-origin:0 0;overflow:hidden;background:#000}
  canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:optimizeSpeed}
  button{font-family:inherit;cursor:pointer;border:0}

  /* HUD */
  #hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
  #hud.on{display:block}
  .hud-tl{position:absolute;left:14px;top:12px;display:flex;gap:10px;align-items:center}
  .avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ffb3d9,#ff6ba8);border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3);display:grid;place-items:center;font-size:28px}
  .coin-pill{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border-radius:99px;background:rgba(255,255,255,.9);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25);font-weight:800;font-size:20px;color:#7a3f00}
  .coin-pill.gem{color:#0088a8}
  .coin-pill span.i{font-size:22px;line-height:1}
  .hud-tr{position:absolute;right:14px;top:12px;display:flex;gap:8px;pointer-events:auto}
  .icon-btn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.9);border:3px solid #fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.25)}

  #progressWrap{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(46%,340px);height:14px;border-radius:14px;background:rgba(0,0,0,.35);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3);overflow:hidden}
  #progressFill{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ffd43b,#ff9500);transition:width .2s}

  /* Controls */
  #ctrl{position:absolute;inset:0;pointer-events:none;display:none;z-index:6}
  #ctrl.on{display:block}
  .dpad{position:absolute;left:22px;bottom:22px;display:flex;gap:12px;pointer-events:auto}
  .actions{position:absolute;right:22px;bottom:22px;display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
  .cbtn{
    width:74px;height:74px;border-radius:50%;border:5px solid #fff;
    background:rgba(255,255,255,.35);backdrop-filter:blur(6px);
    color:#fff;font-size:32px;font-weight:800;
    display:grid;place-items:center;padding:0;line-height:1;
    box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.35);
    text-shadow:0 2px 4px rgba(0,0,0,.4);
    transition:transform .06s,background .06s;
  }
  .cbtn.press{transform:translateY(4px);background:rgba(255,255,255,.75);color:#333;box-shadow:0 1px 0 rgba(0,0,0,.35);text-shadow:none}
  .cbtn.jump{
    width:94px;height:94px;font-size:40px;
    background:linear-gradient(#ffe066,#f59e0b);
    box-shadow:0 6px 0 #b45309,0 10px 20px rgba(0,0,0,.4);
  }
  .cbtn.jump.press{background:linear-gradient(#fff3b0,#fbbf24);box-shadow:0 1px 0 #b45309}

  /* Screens */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:20;overflow-y:auto;touch-action:pan-y}
  .screen.on{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}}
  .bgp{background:
    radial-gradient(circle at 20% 20%,rgba(255,180,220,.5),transparent 40%),
    radial-gradient(circle at 80% 30%,rgba(140,220,255,.6),transparent 45%),
    linear-gradient(180deg,#89d4ff 0%,#c4a8ff 55%,#7e3fd4 100%);}
  .logo{text-align:center;font-weight:800;font-style:italic;line-height:.95;font-size:clamp(36px,7vh,60px);letter-spacing:1px;
    background:linear-gradient(180deg,#fff8b0,#ffb300 60%,#ff6a00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:3px #6b1a4a;paint-order:stroke fill;
    filter:drop-shadow(0 5px 0 rgba(80,10,60,.9)) drop-shadow(0 10px 18px rgba(0,0,0,.4));
    transform:skewX(-3deg);
  }
  .logo small{display:block;font-size:.28em;font-style:normal;-webkit-text-stroke:2px #6b1a4a;margin-top:4px;letter-spacing:2px}
  .hero{font-size:clamp(70px,16vh,120px);line-height:1;animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}
  .btn{border:0;font-weight:800;font-size:22px;color:#4a2500;padding:12px 40px;border-radius:20px;
    background:linear-gradient(#fff0a0,#ffb300);
    box-shadow:0 6px 0 #b86a00,0 10px 18px rgba(0,0,0,.35);transition:transform .1s}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b86a00}
  .btn.g{background:linear-gradient(#b7ff8c,#2f9e44);color:#063b12;box-shadow:0 6px 0 #1a6b2e,0 10px 18px rgba(0,0,0,.35)}
  .btn.g:active{box-shadow:0 1px 0 #1a6b2e}
  .btn.w{background:linear-gradient(#fff,#e2dcff);color:#2a1a5e;box-shadow:0 6px 0 #8a7dd0,0 10px 18px rgba(0,0,0,.35)}
  .btn.w:active{box-shadow:0 1px 0 #8a7dd0}
  .btn.sm{font-size:15px;padding:8px 18px;border-radius:14px;box-shadow:0 4px 0 #b86a00}
  .btn.g.sm{box-shadow:0 4px 0 #1a6b2e}
  .btn.w.sm{box-shadow:0 4px 0 #8a7dd0}
  .btn.big{font-size:28px;padding:14px 60px;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .chip{padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.25);border:2px solid #fff;color:#fff;font-weight:800;font-size:15px}
  .subjects{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:600px}
  .subj{padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);color:#fff;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;transition:all .15s}
  .subj.sel{background:linear-gradient(#ffe777,#ffb300);color:#4a2500;border-color:#fff;transform:scale(1.06);box-shadow:0 0 20px rgba(255,212,59,.7)}
  .subj .e{font-size:22px}

  /* Panel */
  .panel{width:min(100%,480px);padding:20px 24px;border-radius:28px;background:linear-gradient(#fff,#eef3ff);color:#2a1a5e;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;align-items:center;border:5px solid #fff}
  .panel h2{font-size:28px;font-weight:800;font-style:italic;color:#4a1670}
  .res{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-weight:800;font-size:13px;color:#4a1670}
  .res b{display:block;font-size:24px;color:#e8590c}
  .col{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
  #result,#pause{background:rgba(20,10,50,.78);backdrop-filter:blur(6px)}

  /* Question */
  #qm{background:rgba(20,10,50,.82);backdrop-filter:blur(6px);z-index:30}
  .qcard{width:min(100%,640px);background:linear-gradient(#fff,#f0ebff);color:#2a1a5e;border-radius:28px;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.6);border:5px solid #ffd43b;display:flex;flex-direction:column;gap:10px;animation:qin .4s cubic-bezier(.2,1.3,.4,1)}
  @keyframes qin{from{transform:translateY(40px) scale(.85);opacity:0}}
  .qtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .qchip{font-weight:800;font-size:13px;padding:3px 12px;border-radius:99px;background:linear-gradient(90deg,#7b3fb8,#a855f7);color:#fff}
  .qpips{font-size:18px;letter-spacing:2px}
  .qrow{display:flex;align-items:center;gap:12px}
  .qhero{font-size:52px;line-height:1;flex:none}
  .qhero.cheer{animation:cheer .7s ease-in-out 2}
  .qhero.sad{animation:sad .5s ease-in-out}
  @keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px) rotate(8deg)}}
  @keyframes sad{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .qtext{flex:1;font-size:clamp(18px,4vw,24px);font-weight:800;line-height:1.2}
  .qicon{font-size:48px;text-align:center;line-height:1}
  .qtools{display:flex;gap:8px;justify-content:center}
  .qtools button{border:0;font-weight:800;font-size:13px;padding:6px 14px;border-radius:99px;background:#eae4ff;color:#4a2fb8;box-shadow:0 3px 0 #b9acf0}
  .qtools button:active{transform:translateY(2px)}
  .qtools button:disabled{opacity:.4}
  .qans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qa{display:flex;align-items:center;gap:10px;text-align:left;border:0;color:#fff;font-weight:800;font-size:clamp(15px,3.2vw,20px);padding:12px;border-radius:18px;min-height:60px;line-height:1.15;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
  .qa:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .qa i{flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:16px}
  .qa:nth-child(1){background:linear-gradient(#ff8787,#ff6b6b)}
  .qa:nth-child(2){background:linear-gradient(#74c0fc,#4dabf7)}
  .qa:nth-child(3){background:linear-gradient(#8ce99a,#51cf66)}
  .qa:nth-child(4){background:linear-gradient(#ffc078,#ffa94d)}
  .qa.ok{background:linear-gradient(#69db7c,#2b8a3e)!important;animation:okp .5s}
  .qa.bad{background:linear-gradient(#868e96,#495057)!important;animation:sad .5s}
  .qa.out{opacity:.18;pointer-events:none}
  .qa.lock{pointer-events:none}
  @keyframes okp{50%{transform:scale(1.05)}}
  .qfb{min-height:38px;font-size:16px;font-weight:700;line-height:1.3;text-align:center}
  .qfb.ok{color:#2b8a3e}.qfb.bad{color:#c92a2a}
  @media (max-width:520px){.qans{grid-template-columns:1fr}}

  #say{position:absolute;left:50%;top:26%;transform:translate(-50%,0);opacity:0;pointer-events:none;font-size:38px;font-weight:800;font-style:italic;white-space:nowrap;z-index:7;text-shadow:0 4px 0 #7a2a00,0 0 22px rgba(255,200,60,.9);color:#fff}
  #say.show{animation:say 1.2s ease-out}
  @keyframes say{0%{opacity:0;transform:translate(-50%,12px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}28%{transform:translate(-50%,0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
  #tip{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);z-index:7;pointer-events:none;max-width:90%;text-align:center;font-size:15px;font-weight:700;padding:8px 18px;border-radius:99px;background:rgba(0,0,0,.7);color:#fff;border:2px solid #fff;opacity:0;transition:opacity .3s}
  #tip.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="hud-tl">
      <div class="avatar">😎</div>
      <div class="coin-pill"><span class="i">💎</span><span id="gemN">0</span></div>
      <div class="coin-pill gem"><span class="i">🪙</span><span id="coinN">0</span></div>
    </div>
    <div id="progressWrap"><div id="progressFill"></div></div>
    <div class="hud-tr">
      <button class="icon-btn" id="pauseBtn">⏸</button>
    </div>
  </div>

  <div id="say"></div>
  <div id="tip"></div>

  <div id="ctrl">
    <div class="dpad">
      <button class="cbtn" id="btnL">◀</button>
      <button class="cbtn" id="btnR">▶</button>
    </div>
    <div class="actions">
      <button class="cbtn jump" id="btnJ">⬆</button>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen bgp on" id="home">
    <div class="row"><div class="chip" id="hStreak">🔥 0 ngày</div><div class="chip" id="hWallet">⭐ 0</div><div class="chip" id="hBest">🏆 0</div></div>
    <div class="logo">Parkour<br>Tri Thức<small>Nhảy · Trả lời · Về đích</small></div>
    <div class="hero">🏃‍♂️</div>
    <div class="subjects" id="subjects"></div>
    <button class="btn g big" id="playBtn">CHƠI NGAY! 🎮</button>
    <div class="row">
      <button class="btn w sm" id="repBtn">📊 Báo cáo</button>
      <button class="btn w sm" id="edBtn">🧑‍🏫 Câu hỏi</button>
      <button class="btn w sm" id="sndBtn">🔊 Bật</button>
    </div>
  </div>

  <!-- QUESTION -->
  <div class="screen" id="qm"><div class="qcard">
    <div class="qtop"><span class="qchip" id="qChip"></span><span class="qpips" id="qPips"></span></div>
    <div class="qrow"><div class="qhero" id="qHero">🏃</div><div class="qtext" id="qText"></div></div>
    <div class="qicon" id="qIcon"></div>
    <div class="qtools"><button id="qSpeak">🔊 Nghe</button><button id="qHint">💡 Gợi ý (3⭐)</button></div>
    <div class="qans" id="qAns"></div>
    <div class="qfb" id="qFb"></div>
  </div></div>

  <!-- RESULT -->
  <div class="screen" id="result">
    <div class="panel"><h2 id="rTitle">Về đích!</h2>
      <div class="res">
        <div><b id="rCoin">0</b>🪙 xu</div>
        <div><b id="rGem">0</b>💎 ngọc</div>
        <div><b id="rAcc">0%</b>đúng</div>
        <div><b id="rLen">0</b>khối</div>
      </div>
      <div class="col">
        <button class="btn g" id="rRetry">↺ Chơi lại</button>
        <button class="btn w sm" id="rHome">🏠 Trang chủ</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div class="screen" id="pause">
    <div class="panel"><h2>Tạm dừng</h2><div class="col">
      <button class="btn g" id="resumeBtn">Tiếp tục ▶</button>
      <button class="btn w sm" id="pRetry">↺ Chơi lại</button>
      <button class="btn w sm" id="pHome">🏠 Trang chủ</button>
    </div></div>
  </div>

  <!-- REPORT -->
  <div class="screen bgp" id="report">
    <div class="panel"><h2>📊 Báo cáo</h2>
      <div id="repBars" style="width:100%;display:flex;flex-direction:column;gap:8px"></div>
      <div style="width:100%;max-height:140px;overflow-y:auto;text-align:left;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px" id="repWrong"></div>
      <button class="btn w sm" id="repBack">◀ Quay lại</button>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="screen" id="editor" style="background:#1a0d4a">
    <div class="panel" style="background:#0a0525;color:#fff;border-color:#ffd43b;width:min(100%,700px)">
      <h2 style="color:#ffd43b">🧑‍🏫 Bộ câu hỏi</h2>
      <div style="font-size:12px;opacity:.85;text-align:left">Mỗi câu: <code style="background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px">{"q":"...","a":["A","B","C","D"],"c":0,"g":3,"icon":"🎯"}</code>. <code>c</code>=vị trí đáp án đúng.</div>
      <textarea id="bankText" spellcheck="false" style="width:100%;height:200px;background:#000;color:#9effa0;border:2px solid #ffd43b;border-radius:10px;padding:8px;font-family:monospace;font-size:12px"></textarea>
      <div id="bankErr" style="color:#ff9a9a;font-size:12px;min-height:14px;width:100%;text-align:left"></div>
      <div class="row">
        <button class="btn g sm" id="bkApply">✅ Áp dụng</button>
        <button class="btn w sm" id="bkReset">↺ Mặc định</button>
        <button class="btn w sm" id="bkDown">⬇️ Tải</button>
        <button class="btn w sm" id="bkLoad">📂 Nạp</button>
        <input type="file" id="bkFile" accept=".json" hidden>
      </div>
      <button class="btn w sm" id="edBack">◀ Quay lại</button>
    </div>
  </div>
</div>

<script type="application/json" id="bankDefault">
{
  "viet": [
    {"q":"Từ nào chỉ con vật?","a":["mèo","bàn","sách","bút"],"c":0,"g":1,"icon":"🐱"},

  ],
  "eng": [

    {"q":"Con mèo tiếng Anh?","a":["Cat","Dog","Bird","Fish"],"c":0,"g":1,"icon":"🐱"},
    {"q":"I ___ a student.","a":["am","is","are","be"],"c":0,"g":2},
    {"q":"Số nhiều của 'child':","a":["children","childs","childes","childrens"],"c":0,"g":4}
  ],

    {"q":"Hành tinh gần Mặt Trời nhất?","a":["Sao Thủy","Sao Hỏa","Trái Đất","Sao Kim"],"c":0,"g":3,"icon":"🪐"},
    {"q":"Trái Đất quay quanh Mặt Trời hết:","a":["365 ngày","30 ngày","24 giờ","7 ngày"],"c":0,"g":5,"icon":"🌍"}

    {"q":"Đỉnh cao nhất VN?","a":["Phan-xi-păng","Bà Đen","Ngọc Linh","Lang Biang"],"c":0,"g":4,"icon":"⛰️"}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ===== Save ===== */
const KEY='parkour3d-v1';let mem=null;
const loadS=()=>{try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return mem?JSON.parse(mem):{};};
const S=Object.assign({wallet:0,grade:3,subject:'mix',stats:{},streak:{last:'',n:0},sfx:true,voice:true,wrong:[],bank:null,best:0},loadS());
const persist=()=>{const s=JSON.stringify(S);try{localStorage.setItem(KEY,s);}catch(e){mem=s;}};

/* ===== Data ===== */
const SUBN={math:'Toán',viet:'Tiếng Việt',eng:'Tiếng Anh',sci:'Khoa học',geo:'Địa lí',custom:'Thầy cô',mix:'Tổng hợp'};
const SUBJ_ICON={math:'🔢',viet:'📖',eng:'🔤',sci:'🔬',geo:'🗺️',mix:'🌈',custom:'🧑‍🏫'};
const COLORS=['#ec4899','#3b82f6','#fbbf24','#22c55e','#a855f7','#ef4444','#06b6d4','#f97316','#84cc16','#e879f9'];
const COLORS_STRIPE=['#fbcfe8','#bfdbfe','#fef3c7','#bbf7d0','#e9d5ff','#fecaca','#a5f3fc','#fed7aa'];

function validateBank(b){
  const er=[];if(!b||typeof b!=='object')return['JSON phải là object'];
  ['viet','eng','sci','geo','custom'].forEach(k=>{
    if(b[k]===undefined)return;
    if(!Array.isArray(b[k])){er.push(`"${k}" phải mảng`);return;}
    b[k].forEach((q,i)=>{

function opts(c,sp,fmt=String,min=-1e9,st=1){
  const set=new Set([+c.toFixed(2)]);let g=0;
  while(set.size<4&&g++<90){const v=+(c+ri(-sp,sp)*st).toFixed(2);if(v!==+c.toFixed(2)&&v>=min)set.add(v);}
  let k=1;while(set.size<4){set.add(+(c+k*st).toFixed(2));k++;}
  const arr=shuffle([...set]);return{a:arr.map(fmt),c:arr.indexOf(+c.toFixed(2))};
}
function genMath(g){

  if(lv===2){const a=ri(2,9),b=ri(2,9),r=a*b;const o=opts(r,6,String,0);return mq(`${a} × ${b} = ?`,o.a,o.c,`${a}×${b}=${r}`,'✖️');}

function tone(f,d=.15,v=.1,type='sine',delay=0,slide=0){
  if(!ac||!S.sfx)return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);

}

/* ===== Camera & Projection ===== */
const cam={x:0,y:5,z:-7,pitch:-0.32,focal:0};
function updateFocal(){cam.focal=Math.max(W,H)*0.85;}
function project(wx,wy,wz){
  const dx=wx-cam.x,dy=wy-cam.y,dz=wz-cam.z;
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const fx=0,fy=sp,fz=cp;
  const ux=0,uy=cp,uz=-sp;
  const lz=dx*fx+dy*fy+dz*fz;
  if(lz<0.3)return null;
  const ly=dx*ux+dy*uy+dz*uz;
  return{x:W/2+dx*cam.focal/lz,y:H/2-ly*cam.focal/lz,z:lz};
}

/* ===== Level gen ===== */

/* ===== Update ===== */
function update(dt){
  G.T+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  // particles
  let pn=0;
  for(let i=0;i<G.parts.length;i++){
    const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=900*dt;p.life-=dt;
    if(p.life>0)G.parts[pn++]=p;
  }
  G.parts.length=pn;
  let fn=0;
  for(let i=0;i<G.floats.length;i++){
    const f=G.floats[i];f.y-=40*dt;f.life-=dt;
    if(f.life>0)G.floats[fn++]=f;
  }
  G.floats.length=fn;
  // clouds drift
  for(let i=0;i<G.clouds.length;i++){const c=G.clouds[i];c.x+=c.sp*dt;}
  if(!G.player||G.paused||G.over)return;
  const p=G.player;

  // forward auto
  p.z+=G.speed*dt;
  G.dist=p.z;

  // x movement
  const ACC=30,MAX=7;
  if(keys.left)p.vx-=ACC*dt;
  if(keys.right)p.vx+=ACC*dt;
  p.vx*=Math.pow(.002,dt);
  p.vx=clamp(p.vx,-MAX,MAX);
  p.x+=p.vx*dt;
  p.x=clamp(p.x,-20,20);

  // jump
  if(keys.jump&&!p.jumpHeld&&p.onGround){
    p.vy=9.5;p.onGround=false;p.sq=-0.3;sfx.jump();
  }
  if(!keys.jump&&p.jumpHeld&&p.vy>0){p.vy*=0.55;} // short hop
  p.jumpHeld=keys.jump;

  // gravity
  p.vy-=22*dt;
  if(p.vy<-22)p.vy=-22;
  p.y+=p.vy*dt;

  // landing
  p.onGround=false;
  let bestTop=-1,bestBlock=null;
  for(const b of G.blocks){
    const top=b.y+b.h;
    if(p.x>b.x-b.w/2-0.5 && p.x<b.x+b.w/2+0.5 &&
       p.z>b.z-b.d/2-0.5 && p.z<b.z+b.d/2+0.5){
      if(p.vy<=0 && p.y<=top+0.15 && p.y>=top-0.7 && top>bestTop){
        bestTop=top;bestBlock=b;
      }
    }
  }
  if(bestBlock){
    p.y=bestTop;p.vy=0;p.onGround=true;p.lastBlock=bestBlock;
    if(Math.abs(p.sq)<0.05)p.sq=0.15;
  }

  // head bump into question blocks (floaters)
  if(p.vy>0){
    for(const b of G.blocks){
      if(b.type!=='question'||b.used)continue;
      const btm=b.y+b.h;
      if(p.x>b.x-b.w/2 && p.x<b.x+b.w/2 &&
         p.z>b.z-b.d/2 && p.z<b.z+b.d/2 &&
         p.y+1.5>btm-0.1 && p.y+1.5<btm+0.5){
        b.used=true;p.vy=-3;sfx.block();
        burst3D(p.x,p.y+1.5,p.z,['#ffd43b','#fff'],14);
        showQuestion(b);
        return;
      }
    }
  }

  // coin / gem pickup
  for(const b of G.blocks){
    if(b.type==='coin'&&!b.collected&&b.coinFloat){
      const cy=b.y+b.h+1.2;
      if(Math.abs(p.x-b.x)<1.2 && Math.abs(p.z-b.z)<1.2 && Math.abs(p.y+0.7-cy)<1.5){
        b.collected=true;G.coins++;sfx.coin();
        floatTxt(b.x,cy,b.z,'+1 🪙');
        burst3D(b.x,cy,b.z,['#ffd43b','#fff'],10);
      }
    }
    if(b.type==='question'&&b.used&&!b.rewarded){
      b.rewarded=true;G.gems++;sfx.gem();
      floatTxt(b.x,b.y+b.h+1,b.z,'+1 💎');
    }
  }

  // fall
  if(p.y<-15){
    G.over=true;$('ctrl').classList.remove('on');
    $('hud').classList.remove('on');
    sfx.lose();say('💀 Rơi rồi!');
    setTimeout(()=>{endGame(false);},800);
    return;
  }

  // win
  if(p.z>G.totalDist){
    G.over=true;$('ctrl').classList.remove('on');
    $('hud').classList.remove('on');
    sfx.win();say('🎉 Về đích!');
    setTimeout(()=>{endGame(true);},800);
  }

  // camera
  cam.x=p.x;cam.y=p.y+4.5;cam.z=p.z-6.5;
  updateFocal();

  // HUD
  $('progressFill').style.width=clamp(p.z/G.totalDist*100,0,100)+'%';
}

/* ===== Draw ===== */
function shade(hex,amt){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=v=>Math.max(0,Math.min(255,Math.round(v+amt*255)));
  return`rgb(${f(r)},${f(g)},${f(b)})`;
}
function drawQuad(p1,p2,p3,p4,fill,stroke){
  ctx.fillStyle=fill;
  ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);
  ctx.closePath();ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}
}
function drawBox(b){
  const hw=b.w/2,hd=b.d/2,bt=b.y+b.h;
  const corners={
    fbl:{x:b.x-hw,y:b.y,z:b.z-hd},fbr:{x:b.x+hw,y:b.y,z:b.z-hd},
    ftl:{x:b.x-hw,y:bt,z:b.z-hd},ftr:{x:b.x+hw,y:bt,z:b.z-hd},
    bbl:{x:b.x-hw,y:b.y,z:b.z+hd},bbr:{x:b.x+hw,y:b.y,z:b.z+hd},
    btl:{x:b.x-hw,y:bt,z:b.z+hd},btr:{x:b.x+hw,y:bt,z:b.z+hd}
  };
  const p={};
  for(const k in corners){p[k]=project(corners[k].x,corners[k].y,corners[k].z);if(!p[k])return;}
  const base=b.used?'#9ca3af':b.color;
  const isQ=b.type==='question'&&!b.used;
  const showL=cam.x<b.x-hw,showR=cam.x>b.x+hw;
  // side
  if(showL){
    drawQuad(p.ftl,p.fbl,p.bbl,p.btl,shade(base,-0.18),'#fff');
  }else if(showR){
    drawQuad(p.ftr,p.fbr,p.bbr,p.btr,shade(base,-0.22),'#fff');
  }
  // front
  const fr=isQ?shade(base,0.15):shade(base,0.05);
  drawQuad(p.ftl,p.ftr,p.fbr,p.fbl,fr,'#fff');
  // top
  const tp=isQ?shade(base,0.35):shade(base,0.22);
  drawQuad(p.ftl,p.ftr,p.btr,p.btl,tp,'#fff');
  // stripes on top
  if(b.stripe&&!b.used){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p.ftl.x,p.ftl.y);ctx.lineTo(p.ftr.x,p.ftr.y);ctx.lineTo(p.btr.x,p.btr.y);ctx.lineTo(p.btl.x,p.btl.y);ctx.closePath();
    ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=Math.max(3,8*(cam.focal/(p.ftl.z||1))/100);
    const step=12;
    for(let i=-60;i<60;i+=step){
      ctx.beginPath();
      ctx.moveTo(p.ftl.x+i,p.ftl.y-100);ctx.lineTo(p.ftl.x+i+40,p.ftl.y+200);
      ctx.stroke();
    }
    ctx.restore();
  }
  // question mark icon
  if(isQ){
    const cx=(p.ftl.x+p.ftr.x+p.btr.x+p.btl.x)/4;
    const cy=(p.ftl.y+p.ftr.y+p.btr.y+p.btl.y)/4;
    const sz=Math.min(60,Math.max(20,cam.focal/8/p.ftl.z));
    // wave / bob
    const bob=Math.sin(G.T*3+b.z)*3;
    ctx.font=`800 ${sz}px "Baloo 2",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=3;
    ctx.strokeText('?',cx,cy+bob);ctx.fillText('?',cx,cy+bob);
  }
  // coin icon on top
  if(b.type==='coin'&&!b.collected&&b.coinFloat){
    const cp=project(b.x,b.y+b.h+1.2,b.z);
    if(cp){
      const sz=Math.min(70,Math.max(22,cam.focal/6/cp.z));
      emoji('🪙',cp.x,cp.y+Math.sin(G.T*4+b.z)*4,sz);
    }
  }
  // gem on solved question
  if(b.type==='question'&&b.used&&b.rewarded){
    const gp=project(b.x,b.y+b.h+1,b.z);
    if(gp){const sz=Math.min(50,Math.max(20,cam.focal/8/gp.z));emoji('💎',gp.x,gp.y,sz,0.9);}
  }
}
function drawSky(){
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#5eb8ff');
  g.addColorStop(.55,'#a8dfff');
  g.addColorStop(1,'#dff2ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // ocean horizon line (as a wide strip)
  const horizonY=H*0.42;
  const og=ctx.createLinearGradient(0,horizonY-30,0,H);
  og.addColorStop(0,'#4ea8de');
  og.addColorStop(1,'#7fcdff');
  ctx.fillStyle=og;
  ctx.fillRect(0,horizonY,W,H-horizonY);
  // wave lines
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    const y=horizonY+30+i*38+Math.sin(G.T*.5+i)*4;
    ctx.beginPath();
    for(let x=0;x<W;x+=20)ctx.lineTo(x,y+Math.sin(x*.01+G.T+i)*3);
    ctx.stroke();
  }
  // distant islands
  const islands=[{x:.15,s:.7},{x:.5,s:.9},{x:.85,s:.6}];
  islands.forEach((isl,i)=>{
    const cx=W*isl.x;
    const base=horizonY+10;
    const w=180*isl.s,h=60*isl.s;
    ctx.fillStyle='#6dbf67';
    ctx.beginPath();
    ctx.moveTo(cx-w/2,base);
    ctx.quadraticCurveTo(cx,base-h*1.6,cx+w/2,base);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a8f3a';
    ctx.beginPath();
    ctx.moveTo(cx-w/2,base);
    ctx.quadraticCurveTo(cx,base-h*1.6,cx+w/2,base);
    ctx.lineTo(cx+w/2,base+8);ctx.lineTo(cx-w/2,base+8);
    ctx.closePath();ctx.fill();
    // palm
    emoji('🌴',cx,base-h*1.1,40*isl.s);
  });
}
function drawClouds(){
  for(const c of G.clouds){
    const p=project(c.x,c.y,c.z);
    if(!p||p.x<-100||p.x>W+100)continue;
    const sz=Math.min(180,Math.max(40,cam.focal/(p.z+10)*1.6*c.s));
    emoji('☁️',p.x,p.y,sz,0.9);
  }
}
function drawNPC(npc){
  const p=project(npc.x,npc.y,npc.z);
  if(!p||p.x<-60||p.x>W+60)return;
  const sz=Math.min(120,Math.max(40,cam.focal/p.z*0.9));
  const bob=Math.sin(G.T*2+npc.ph)*3;
  drawChar(p.x,p.y+bob,sz,npc.color,0,false);
}
function drawPlayer(){
  const pl=G.player;if(!pl)return;
  const p=project(pl.x,pl.y,pl.z);
  if(!p)return;
  const sz=Math.min(150,Math.max(50,cam.focal/p.z*1.0));
  // shadow
  const sp=project(pl.x,pl.y-0.01,pl.z);
  if(sp){
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(sp.x,sp.y+sz*.5,sz*.28,sz*.08,0,0,6.283);ctx.fill();
  }
  if(pl.invuln>0&&Math.floor(G.T*16)%2===0)return;
  drawChar(p.x,p.y,sz,'#f59e0b',pl.runPhase,true);
  // run phase
  if(pl.onGround&&Math.abs(pl.vx)>1)pl.runPhase+=0.3;
  else pl.runPhase+=0.1;
}
function drawChar(cx,cy,sz,shirtColor,phase,isPlayer){
  const headR=sz*0.16;
  const bodyW=sz*0.32,bodyH=sz*0.42;
  const legW=sz*0.11,legH=sz*0.35;
  const armW=sz*0.09,armH=sz*0.3;
  // shadow already drawn outside
  // legs
  const swing=Math.sin(phase)*0.5;
  const lx1=cx-bodyW*0.28, lx2=cx+bodyW*0.28;
  const lyTop=cy+bodyH*0.5;
  ctx.fillStyle='#1e3a8a';
  // leg 1
  ctx.save();
  ctx.translate(lx1,lyTop);ctx.rotate(swing*0.5);
  ctx.fillRect(-legW/2,0,legW,legH);
  ctx.fillStyle='#111';ctx.fillRect(-legW/2-1,legH-4,legW+2,5);
  ctx.restore();
  ctx.fillStyle='#1e3a8a';
  ctx.save();
  ctx.translate(lx2,lyTop);ctx.rotate(-swing*0.5);
  ctx.fillRect(-legW/2,0,legW,legH);
  ctx.fillStyle='#111';ctx.fillRect(-legW/2-1,legH-4,legW+2,5);
  ctx.restore();
  // body
  const bodyTop=cy-bodyH*0.5;
  ctx.fillStyle=shirtColor;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(cx-bodyW/2,bodyTop,bodyW,bodyH,sz*.06);
  else ctx.rect(cx-bodyW/2,bodyTop,bodyW,bodyH);
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1.5;ctx.stroke();
  // arms
  ctx.fillStyle='#fbbf24';
  // arm 1
  ctx.save();
  ctx.translate(cx-bodyW/2,bodyTop+bodyH*0.15);ctx.rotate(-swing*0.7);
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(-armW,0,armW,armH,armW/2);
  else ctx.rect(-armW,0,armW,armH);
  ctx.fill();
  ctx.restore();
  // arm 2
  ctx.save();
  ctx.translate(cx+bodyW/2,bodyTop+bodyH*0.15);ctx.rotate(swing*0.7);
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(0,0,armW,armH,armW/2);
  else ctx.rect(0,0,armW,armH);
  ctx.fill();
  ctx.restore();
  // head (back of head — we only see hair/back)
  const headCy=bodyTop-headR*0.85;
  // neck
  ctx.fillStyle='#fbbf24';
  ctx.fillRect(cx-headR*0.4,headCy,headR*0.8,headR*0.6);
  // head
  ctx.fillStyle='#fbbf24';
  ctx.beginPath();ctx.arc(cx,headCy,headR,0,6.283);ctx.fill();
  // hair (back view — big blob on top)
  ctx.fillStyle='#4a2810';
  ctx.beginPath();
  ctx.arc(cx,headCy-headR*0.15,headR*1.02,Math.PI,0);
  ctx.lineTo(cx+headR,headCy+headR*0.3);
  ctx.lineTo(cx-headR,headCy+headR*0.3);
  ctx.closePath();ctx.fill();
  // cap (back)
  if(isPlayer){
    ctx.fillStyle='#dc2626';
    ctx.beginPath();
    ctx.arc(cx,headCy-headR*0.1,headR*1.1,Math.PI,0);
    ctx.lineTo(cx+headR*1.1,headCy+headR*0.1);
    ctx.lineTo(cx-headR*1.1,headCy+headR*0.1);
    ctx.closePath();ctx.fill();
  }
}
function drawParticles(){
  const list=[];
  for(const p of G.parts){
    const pr=project(p.x,p.y,p.z);
    if(!pr)continue;
    list.push({pr,p});
  }
  list.sort((a,b)=>b.pr.z-a.pr.z);
  for(const it of list){
    const p=it.p,pr=it.pr;
    const sz=Math.max(2,Math.min(20,cam.focal/pr.z*0.05*p.r));
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(pr.x,pr.y,sz,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawFloats(){
  for(const f of G.floats){
    const p=project(f.x,f.y,f.z);
    if(!p)continue;
    const sz=Math.min(50,Math.max(14,cam.focal/p.z*0.07));
    ctx.globalAlpha=clamp(f.life*1.5,0,1);
    ctx.font=`800 ${sz}px "Baloo 2",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.7)';
    ctx.strokeText(f.t,p.x,p.y);ctx.fillStyle='#fff';ctx.fillText(f.t,p.x,p.y);
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();
  if(G.shake>.3)ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  drawSky();
  drawClouds();
  if(!G.player){
    ctx.restore();
    return;
  }
  // sort blocks by z descending (far first)
  const visible=[];
  for(const b of G.blocks){
    // cull
    if(b.z>G.player.z+80)continue;
    if(b.z<G.player.z-15)continue;
    visible.push(b);
  }
  visible.sort((a,b)=>b.z-a.z);
  // insert NPCs & player into depth order
  const items=[];
  for(const b of visible)items.push({z:b.z,type:'block',obj:b});
  for(const n of G.npcs){
    if(n.z<G.player.z-15||n.z>G.player.z+80)continue;
    items.push({z:n.z,type:'npc',obj:n});
  }
  items.push({z:G.player.z-0.01,type:'player'});
  items.sort((a,b)=>b.z-a.z);
  for(const it of items){
    if(it.type==='block')drawBox(it.obj);
    else if(it.type==='npc')drawNPC(it.obj);
    else drawPlayer();
  }
  drawParticles();
  drawFloats();
  ctx.restore();
}

/* ===== Loop ===== */
let lastT=performance.now();
function loop(t){
  const dt=Math.min(.033,(t-lastT)/1000);lastT=t;
  update(dt);draw();
  requestAnimationFrame(loop);
}

/* ===== HUD ===== */
function updateHUD(){
  $('coinN').textContent=G.coins;
  $('gemN').textContent=G.gems;
}
function say(t){const e=$('say');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}
function tip(t,ms=5000){const e=$('tip');e.textContent=t;e.classList.add('show');clearTimeout(tip.t);tip.t=setTimeout(()=>e.classList.remove('show'),ms);}

/* ===== Question ===== */
let QA=null;
function closeModal(){$('qm').classList.remove('on');try{speechSynthesis.cancel();}catch(e){}}
function showQuestion(block){
  const q=pickQuestion();G.paused=true;G.asked++;
  QA={q,block,done:false,fin:false,hinted:false};
  $('qChip').textContent=`${SUBN[q.subj]||''} · Lớp ${S.grade}`;
  $('qHero').textContent='🏃';$('qHero').className='qhero';
  $('qText').textContent=q.q;$('qIcon').textContent=q.icon||'';
  $('qIcon').style.display=q.icon?'':'none';
  $('qFb').textContent='';$('qFb').className='qfb';
  $('qHint').disabled=false;$('qHint').textContent='💡 Gợi ý (3⭐)';
  $('qSpeak').style.display=('speechSynthesis' in window)?'':'none';
  const box=$('qAns');box.innerHTML='';
  q.a.forEach((t,i)=>{
    const b=document.createElement('button');b.className='qa';b.dataset.i=i;
    b.innerHTML=`<i>${['A','B','C','D'][i]}</i><span></span>`;b.lastChild.textContent=t;
    box.appendChild(b);
  });
  $('qm').classList.add('on');
  if(S.voice)speak(q.q,q.lang);
}
$('qAns').addEventListener('click',e=>{
  const b=e.target.closest('.qa');if(!b||!QA||QA.done)return;
  audio();QA.done=true;
  const i=+b.dataset.i,ok=i===QA.q.c,q=QA.q;
  const st=S.stats[q.subj]||(S.stats[q.subj]={a:0,c:0});st.a++;if(ok)st.c++;
  document.querySelectorAll('.qa').forEach(x=>{x.classList.add('lock');if(+x.dataset.i===q.c)x.classList.add('ok');});
  const fb=$('qFb'),hero=$('qHero');
  if(ok){
    G.correct++;b.classList.add('ok');sfx.ok();
    hero.className='qhero cheer';fb.className='qfb ok';
    fb.textContent=pick(['Chính xác! 🎉','Tuyệt vời! ⭐','Giỏi quá! 👏','Đúng rồi! 🌟'])+(q.e?' '+q.e:'');
    persist();
    setTimeout(()=>{if(!QA||QA.fin)return;QA.fin=true;closeModal();onAnswer(true);},1200);
  }else{
    b.classList.add('bad');sfx.bad();hero.className='qhero sad';fb.className='qfb bad';
    fb.textContent=`Chưa đúng. Đáp án: ${q.a[q.c]}.`+(q.e?' '+q.e:'');
    S.wrong.unshift({q:q.q,a:q.a[q.c]});S.wrong=S.wrong.slice(0,30);persist();
    setTimeout(()=>{if(!QA||QA.fin)return;QA.fin=true;closeModal();onAnswer(false);},1500);
  }
});
function onAnswer(ok){
  if(ok){
    G.coins+=10;
    say('+10 🪙');
    updateHUD();
  }else{
    G.shake=12;
    say('❌ Sai rồi!');
  }
  setTimeout(()=>{G.paused=false;},300);
}
$('qSpeak').onclick=()=>{audio();if(QA){const w=S.voice;S.voice=true;speak(QA.q.q+'. '+QA.q.a.map((t,i)=>['A','B','C','D'][i]+', '+t).join('. '),QA.q.lang);S.voice=w;}};
$('qHint').onclick=()=>{
  if(!QA||QA.done||QA.hinted)return;audio();
  if(S.wallet<3){sfx.bad();$('qHint').textContent='Chưa đủ ⭐';return;}
  S.wallet-=3;persist();QA.hinted=true;$('qHint').disabled=true;sfx.gem();
  const wrong=shuffle(QA.q.a.map((_,i)=>i).filter(i=>i!==QA.q.c)).slice(0,Math.min(2,QA.q.a.length-2));
  document.querySelectorAll('.qa').forEach(x=>{if(wrong.includes(+x.dataset.i))x.classList.add('out');});
};

/* ===== Controls ===== */
function bind(id,key){
  const el=$(id);
  const on=e=>{e.preventDefault();e.stopPropagation();if(!ac)audio();el.classList.add('press');keys[key]=true;
    if(el.setPointerCapture&&e.pointerId!==undefined){try{el.setPointerCapture(e.pointerId);}catch(er){}}};
  const off=e=>{if(e)e.preventDefault();el.classList.remove('press');keys[key]=false;};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
}
bind('btnL','left');bind('btnR','right');bind('btnJ','jump');
const keyMap={'arrowleft':'left','a':'left','arrowright':'right','d':'right','arrowup':'jump','w':'jump',' ':'jump'};
document.addEventListener('keydown',e=>{
  const k=keyMap[e.key.toLowerCase()]||(e.key===' '?'jump':null);
  if(k){e.preventDefault();if(!ac)audio();keys[k]=true;}
});
document.addEventListener('keyup',e=>{
  const k=keyMap[e.key.toLowerCase()]||(e.key===' '?'jump':null);
  if(k){e.preventDefault();keys[k]=false;}
});

/* ===== Menus ===== */
function renderHome(){
  $('hStreak').textContent=`🔥 ${S.streak.n||0} ngày`;
  $('hWallet').textContent=`⭐ ${S.wallet}`;
  $('hBest').textContent=`🏆 ${S.best||0}`;
  $('sndBtn').textContent='🔊 '+(S.sfx?'Bật':'Tắt');
  const subs=['mix','math','viet','eng','sci','geo'].concat((bank.custom||[]).length?['custom']:[]);
  const el=$('subjects');el.innerHTML='';
  subs.forEach(s=>{
    const b=document.createElement('button');
    b.className='subj'+(S.subject===s?' sel':'');
    b.innerHTML=`<span class="e">${SUBJ_ICON[s]}</span>${SUBN[s]}`;
    b.onclick=()=>{audio();S.subject=s;persist();sfx.tap();renderHome();};
    el.appendChild(b);
  });
}
function renderReport(){
  const subs=['math','viet','eng','sci','geo','custom'];
  const cols=['#ff758c','#7ed957','#ffb347','#8e9bff','#ffd43b','#4cd6b3'];
  let h='';
  subs.forEach((k,i)=>{
    const s=S.stats[k];if(!s&&k==='custom')return;
    const a=s?s.a:0,p=a?Math.round(s.c/a*100):0;
    h+=`<div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px"><span style="flex:0 0 100px">${SUBN[k]}</span><div style="flex:1;height:16px;border-radius:16px;background:rgba(0,0,0,.15);overflow:hidden"><i style="display:block;height:100%;width:${p}%;background:${cols[i]};border-radius:16px"></i></div><span style="flex:0 0 40px;text-align:right">${a?p+'%':'—'}</span></div>`;
  });
  $('repBars').innerHTML=h||'<div style="opacity:.6">Chưa có dữ liệu</div>';
  $('repWrong').innerHTML=S.wrong.length?S.wrong.slice(0,10).map(w=>`<div style="background:#f0eaff;border-radius:10px;padding:6px 10px;color:#2a1a5e">${esc(w.q)} → <b style="color:#2f9e44">${esc(w.a)}</b></div>`).join(''):'<div style="opacity:.6">Chưa có câu sai.</div>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Events ===== */
$('playBtn').onclick=()=>{audio();
  const d=new Date(),today=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(S.streak.last!==today){const y=new Date(d.getTime()-864e5),yest=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak.n=S.streak.last===yest?S.streak.n+1:1;S.streak.last=today;persist();}
  startLevel();
};
$('pauseBtn').onclick=()=>{if(!G.player||G.paused||G.over)return;G.paused=true;$('pause').classList.add('on');$('ctrl').classList.remove('on');};
$('resumeBtn').onclick=()=>{if(G.player)G.paused=false;$('pause').classList.remove('on');$('ctrl').classList.add('on');};
$('pRetry').onclick=()=>{audio();startLevel();};
$('pHome').onclick=()=>{audio();$('pause').classList.remove('on');$('hud').classList.remove('on');$('ctrl').classList.remove('on');G.player=null;renderHome();$('home').classList.add('on');};
$('rRetry').onclick=()=>{audio();startLevel();};
$('rHome').onclick=()=>{audio();$('result').classList.remove('on');$('hud').classList.remove('on');$('ctrl').classList.remove('on');G.player=null;renderHome();$('home').classList.add('on');};
$('repBtn').onclick=()=>{audio();renderReport();$('report').classList.add('on');};
$('repBack').onclick=()=>{$('report').classList.remove('on');};
$('sndBtn').onclick=()=>{audio();S.sfx=!S.sfx;persist();renderHome();};
$('edBtn').onclick=()=>{audio();
  const pretty=o=>{const one=v=>JSON.stringify(v).replace(/,"/g,', "').replace(/":/g,'": ');let s='{\n';const ks=Object.keys(o);ks.forEach((k,i)=>{s+=`  "${k}": [\n`+o[k].map(q=>'    '+one(q)).join(',\n')+`${o[k].length?'\n':''}  ]`+(i<ks.length-1?',\n':'\n');});return s+'}';};
  $('bankText').value=pretty(Object.assign({viet:[],eng:[],sci:[],geo:[],custom:[]},bank));
  $('bankErr').textContent='';$('editor').classList.add('on');
};
$('edBack').onclick=()=>$('editor').classList.remove('on');
$('bkApply').onclick=()=>{
  let b;try{b=JSON.parse($('bankText').value);}catch(e){$('bankErr').textContent='JSON sai: '+e.message;return;}
  const er=validateBank(b);
  if(er.length){$('bankErr').textContent=er.slice(0,6).join(' • ');return;}
  bank=b;S.bank=b;persist();$('bankErr').textContent='✅ Đã áp dụng!';
};
$('bkReset').onclick=()=>{const pretty=o=>{const one=v=>JSON.stringify(v).replace(/,"/g,', "').replace(/":/g,'": ');let s='{\n';const ks=Object.keys(o);ks.forEach((k,i)=>{s+=`  "${k}": [\n`+o[k].map(q=>'    '+one(q)).join(',\n')+`${o[k].length?'\n':''}  ]`+(i<ks.length-1?',\n':'\n');});return s+'}';};$('bankText').value=pretty(BANK_DEF);$('bankErr').textContent='Đã nạp mặc định.';};
$('bkDown').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('bankText').value],{type:'application/json'}));a.download='bo-cau-hoi.json';document.body.appendChild(a);a.click();a.remove();};
$('bkLoad').onclick=()=>$('bkFile').click();
$('bkFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('bankText').value=r.result;$('bankErr').textContent='Đã nạp file.';};r.readAsText(f);e.target.value='';};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.player&&!G.paused&&!G.over){G.paused=true;$('pause').classList.add('on');$('ctrl').classList.remove('on');}});

function endGame(won){
  $('rTitle').textContent=won?'🎉 Về đích!':'💪 Thử lại nhé!';
  $('rCoin').textContent=G.coins;
  $('rGem').textContent=G.gems;
  $('rAcc').textContent=Math.round((G.asked?G.correct/G.asked:1)*100)+'%';
  $('rLen').textContent=G.blocks.length;
  S.wallet+=Math.floor(G.coins/2+G.gems);persist();
  const score=G.coins*10+G.gems*50;
  if(score>(S.best||0)){S.best=score;persist();}
  $('result').classList.add('on');
}

/* ===== Start ===== */
renderHome();
updateFocal();
requestAnimationFrame(loop);
})();
</script>
