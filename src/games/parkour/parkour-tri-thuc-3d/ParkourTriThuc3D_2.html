<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
/* ===== Lưu ===== */
const KEY='parkour-climb-v1';let mem=null;
const load=()=>{try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem?JSON.parse(mem):{}};

const persist=()=>{const s=JSON.stringify(S);try{localStorage.setItem(KEY,s)}catch(e){mem=s}};
/* ===== Danh sách thử thách (sửa ở đây) =====

const CH=[
 {id:'free',     name:'Chinh phục', icon:'🏔️',lv:1,desc:'Leo lên đỉnh, không giới hạn',reward:0},

 {id:'hiker',    name:'Sườn núi',   icon:'🧗',lv:2,desc:'Leo cao 100 mét',minDistance:100,reward:140},
 {id:'collector',name:'Sưu tập',    icon:'🪙',lv:2,desc:'Nhặt 25 xu để thắng',collectCoins:25,reward:80},
 {id:'treasure', name:'Kho báu',    icon:'💰',lv:3,desc:'Nhặt 50 xu để thắng',collectCoins:50,reward:200},

 {id:'lava',     name:'Dung nham',  icon:'🌋',lv:4,desc:'Chạy đua với dung nham đang dâng',lava:.42,reward:250},
 {id:'sprint',   name:'Siêu tốc',   icon:'💨',lv:4,desc:'Lên đỉnh trong 5 phút',timeLimit:300,reward:300},
 {id:'marathon', name:'Everest',    icon:'🏃',lv:4,desc:'Leo 120m, không rơi',minDistance:120,noFall:true,reward:350},
 {id:'volcano',  name:'Núi lửa',    icon:'🔥',lv:5,desc:'Dung nham nhanh + không va khối đỏ',lava:.6,noHit:true,reward:600},
 {id:'godspeed', name:'Thần tốc',   icon:'🌟',lv:5,desc:'4,5 phút + không rơi + không va',timeLimit:270,noFall:true,noHit:true,reward:700},
 {id:'legend',   name:'Huyền thoại',icon:'👑',lv:5,desc:'Dung nham + 30 xu + không rơi + không va',lava:.5,minCoins:30,noFall:true,noHit:true,reward:1200}
];
/* ===== Âm thanh ===== */
let ac=null;const audio=()=>{if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ac&&ac.state==='suspended')ac.resume()};
function tone(f,d=.15,v=.09,ty='sine',dl=0,sl=0){if(!ac||!S.sfx)return;const t=ac.currentTime+dl,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
const sfx={jump:()=>tone(440,.14,.08,'triangle',0,300),dj:()=>{tone(660,.14,.08,'triangle',0,280);tone(990,.12,.06,'triangle',.04,200)},coin:()=>{tone(988,.06,.06,'square');tone(1319,.1,.06,'square',.04)},ok:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.2,.1,'triangle',i*.06)),bad:()=>{tone(260,.2,.1,'sawtooth',0,-90);tone(180,.3,.09,'sawtooth',.15,-80)},tap:()=>tone(620,.06,.06,'triangle'),fall:()=>{tone(440,.15,.08,'triangle',0,-300);tone(220,.25,.09,'sawtooth',.1,-120)},win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,.11,'triangle',i*.1)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.4,.11,'sawtooth',i*.2)),crack:()=>tone(140,.12,.07,'sawtooth',0,-40)};
/* ===== Canvas + camera góc nhìn thứ nhất ===== */
const cv=$('c'),ctx=cv.getContext('2d',{alpha:false});let W=0,H=0,F=0;
function resize(){const sc=Math.min(1,1000/innerWidth)*Math.min(devicePixelRatio||1,1.5);W=cv.width=Math.round(innerWidth*sc);H=cv.height=Math.round(innerHeight*sc);F=H*.92}
addEventListener('resize',resize);resize();
const EYE=1.6,NEAR=.12;let SKY=[168,223,255];
let yaw=0,pitch=0,cyw=1,syw=0,cpt=1,spt=0,ex=0,ey=0,ez=0;
function cam(x,y,z){const dx=x-ex,dy=y-ey,dz=z-ez,x1=dx*cyw-dz*syw,z1=dx*syw+dz*cyw;return[x1,-z1*spt+dy*cpt,z1*cpt+dy*spt]}
function fog(c,s,d){const f=clamp((d-16)/70,0,.88);return`rgb(${(c[0]*s*(1-f)+SKY[0]*f)|0},${(c[1]*s*(1-f)+SKY[1]*f)|0},${(c[2]*s*(1-f)+SKY[2]*f)|0})`}
function face(pts,col,edge){const p=pts.map(q=>cam(q[0],q[1],q[2])),o=[];
 for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],ia=a[2]>NEAR,ib=b[2]>NEAR;if(ia)o.push(a);if(ia!==ib){const t=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR])}}
 if(o.length<3)return;ctx.beginPath();o.forEach((q,i)=>{const x=W/2+q[0]*F/q[2],y=H/2-q[1]*F/q[2];i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=col;ctx.fill();
 ctx.lineWidth=edge?2.5:1;ctx.strokeStyle=edge?'rgba(255,255,255,.85)':'rgba(0,0,0,.25)';ctx.stroke()}
function box(b){const x0=b.x-b.w/2,x1=b.x+b.w/2,z0=b.z-b.d/2,z1=b.z+b.d/2,y0=b.y0,y1=b.y1,d=Math.hypot(b.x-ex,b.z-ez,(y0+y1)/2-ey),c=b.cr?[225,80,50]:b.c,f=s=>fog(c,s,d);
 if(ex<x0)face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],f(.78));
 if(ex>x1)face([[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],f(.6));
 if(ez<z0)face([[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],f(.7));
 if(ez>z1)face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],f(.52));
 if(ey<y0)face([[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]],f(.4));
 if(ey>y1)face([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],f(1.12),1)}
function coin(o){const m=cam(o.x,o.y,o.z);if(m[2]<NEAR)return;const r=F*.28/m[2],sx=W/2+m[0]*F/m[2],sy=H/2-m[1]*F/m[2],sp=Math.abs(Math.cos(T*3+o.x));
 ctx.beginPath();ctx.ellipse(sx,sy,r*sp+2,r,0,0,6.283);ctx.fillStyle=fog([255,205,40],1,m[2]);ctx.fill();ctx.lineWidth=Math.max(1,r/5);ctx.strokeStyle='#b8860b';ctx.stroke()}

/* Bầu trời đổi màu theo độ cao: 8 vùng */
const Z=[
 {n:'🌿 Đồng cỏ',p:['#4ade80','#22c55e','#a3e635','#facc15'],t:'#5aaef7',b:'#d6f0ff'},
 {n:'🌲 Rừng sâu',p:['#16a34a','#15803d','#a16207','#65a30d'],t:'#3d8fd6',b:'#bfe3d0'},
 {n:'🏜️ Sa mạc',p:['#f59e0b','#d97706','#fb923c','#fcd34d'],t:'#e8924a',b:'#ffe2a8'},

 {n:'⚙️ Thành phố máy',p:['#94a3b8','#64748b','#a78bfa','#38bdf8'],t:'#5b4a9a',b:'#f29bb5'},
 {n:'🌋 Núi lửa',p:['#ef4444','#b91c1c','#f97316','#78350f'],t:'#4a1010',b:'#ff8c42'},
 {n:'☁️ Đỉnh mây',p:['#e879f9','#a855f7','#f9a8d4','#fde68a'],t:'#1a0f4d',b:'#8a5fe0'},
 {n:'🌌 Vũ trụ',p:['#22d3ee','#818cf8','#f0abfc','#fef08a'],t:'#050210',b:'#2b1b6e'}];
const NZ=Z.length;
const ZTIP=['','🪵 Cầu hẹp & bệ nhỏ — giữ thăng bằng!','🟫 Bệ sụp nhanh · 🟥 khối đỏ tuần tra: nhảy qua!','🧊 Băng trơn trượt — phanh sớm!','🌬️ Có gió khi ở trên không (mũi tên góc trái) · bệ biến mất nhấp nháy','🌋 Bệ di chuyển nhanh — chọn đúng nhịp!','☁️ Gió mạnh hơn, bệ nhỏ dần','🌌 Vùng cuối — mọi bẫy cùng lúc!'];
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const ZT=Z.map(z=>rgb(z.t)),ZB=Z.map(z=>rgb(z.b)),lc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rs=a=>`rgb(${a.map(Math.round)})`;
function drawSky(fr){const f=clamp(fr*NZ-.5,0,NZ-1),i=Math.min(NZ-2,f|0),t=f-i,tp=lc(ZT[i],ZT[i+1],t),bt=lc(ZB[i],ZB[i+1],t);SKY=bt;
 const hy=H/2+Math.tan(pitch)*F,h=clamp(hy,0,H);
 let g=ctx.createLinearGradient(0,0,0,h||1);g.addColorStop(0,rs(tp));g.addColorStop(1,rs(bt));ctx.fillStyle=g;ctx.fillRect(0,0,W,h);
 if(h<H){g=ctx.createLinearGradient(0,h,0,H);g.addColorStop(0,rs(lc(bt,[255,255,255],.55)));g.addColorStop(1,rs(lc(bt,[90,110,190],.6)));ctx.fillStyle=g;ctx.fillRect(0,h,W,H-h)}}
/* ===== Trạng thái ===== */

 if(gb&&P.vy<=0&&P.y<=gy+.001){P.y=gy;
  if(gb.t==='bounce'){P.vy=15.5;P.ju=1;sfx.dj()}

$('playBtn').onclick=()=>{audio();start()};$('pauseBtn').onclick=pause;
$('resumeBtn').onclick=()=>{G.paused=false;show();$('ctrl').classList.add('on')};$('pRetry').onclick=()=>{audio();start()};$('pHome').onclick=toHome;$('rRetry').onclick=()=>{audio();start()};$('rHome').onclick=toHome;
$('sndBtn').onclick=()=>{audio();S.sfx=!S.sfx;persist();home()};
/* ===== Lưu ván đang chơi =====
 * Địa hình sinh từ seed nên chỉ cần lưu seed + trạng thái người chơi.
 * __gqFlush / "gq:flush": app gọi để ghi trước khi thoát (FLUSH_BRIDGE trong OfflineGamePage.jsx). */
const RK='parkour-climb-run-v3';
function saveRun(){
  if(!P||G.over)return;
  try{localStorage.setItem(RK,JSON.stringify({v:3,at:Date.now(),seed:G.seed,ch:G.ch?G.ch.id:'free',
    G:{coins:G.coins,falls:G.falls,hits:G.hits,dist:G.dist,left:G.left,zone:G.zone,time:G.time,lava:G.lava},
    cam:{yaw,pitch},
    P:{x:P.x,y:P.y,z:P.z,vx:P.vx,vy:P.vy,vz:P.vz,lx:P.lx,ly:P.ly,lz:P.lz,ju:P.ju},
    cg:C.map(o=>o.got?1:0).join('')}))}catch(e){}
}
function loadRun(){try{const s=JSON.parse(localStorage.getItem(RK)||'null');return s&&s.v===3&&s.seed!=null&&s.P&&s.G&&typeof s.cg==='string'?s:null}catch(e){return null}}
function clearRun(){try{localStorage.removeItem(RK)}catch(e){}}
function refreshRunUi(){
  const r=loadRun(),b=$('contBtn');b.hidden=!r;
  $('runInfo').textContent=r?`Ván đang dở · 🪙 ${r.G.coins} · ⛰️ ${Math.floor(r.G.dist||0)}m · ⏱ ${fmt(r.G.time||0)}`:'';
}
function resumeRun(){
  const r=loadRun();if(!r)return;
  genLevel(r.seed);
  C.forEach((o,i)=>{o.got=r.cg[i]==='1'});
  P=Object.assign(newP(),r.P);B.forEach(b=>{if(b.cp&&b.y1<=P.ly+.01)b.got=1});
  yaw=r.cam?r.cam.yaw:0;pitch=r.cam?r.cam.pitch:-.1;
  Object.assign(G,{over:false,paused:true,coins:r.G.coins|0,falls:r.G.falls|0,hits:r.G.hits|0,dist:r.G.dist||0,left:r.G.left||0,zone:r.G.zone|0,time:r.G.time||0,lava:typeof r.G.lava==='number'?r.G.lava:-18});
  G.ch=CH.find(c=>c.id===r.ch)||CH[0];
  show();$('hud').classList.add('on');$('ctrl').classList.add('on');hudUp();
  $('prog').firstChild.style.height=clamp(G.dist/G.goalY*100,0,100)+'%';
  say('▶ Tiếp tục leo!');lastSave=0;G.paused=false;
}
$('contBtn').onclick=()=>{audio();resumeRun()};
window.__gqFlush=saveRun;
addEventListener('gq:flush',saveRun);
addEventListener('pagehide',saveRun);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
home();requestAnimationFrame(loop);
})();
</script>
