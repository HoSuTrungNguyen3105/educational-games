<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Word Runner — Temple Parkour</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--dusk:#170A3A;--violet:#5B21B6;--pink:#FF6B9D;--amber:#FFB36B;--teal:#19D3A2;--cream:#FFF4E6;--sun:#FFD25E;--red:#FF5C7A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c0522;overscroll-behavior:none}
body{font-family:"Baloo 2","Nunito",system-ui,sans-serif;color:var(--cream);display:grid;place-items:center;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;max-height:880px;overflow:hidden;background:var(--dusk);touch-action:none}
@media (min-width:500px){#app{border-radius:30px;box-shadow:0 0 0 2px #4b2a8f,0 30px 90px rgba(255,107,157,.28)}}
canvas{position:absolute;inset:0;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:flex-start}
#lives{font-size:22px;letter-spacing:2px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
#coins{font-size:14px;font-weight:700;color:var(--sun);margin-top:2px}
.stats{text-align:right;line-height:1}
#score{font-size:34px;font-weight:800;text-shadow:0 0 14px rgba(255,107,157,.8)}
#lvl{font-size:14px;color:var(--amber);font-weight:700}
.lbar{width:96px;height:7px;border-radius:9px;background:rgba(255,244,230,.2);margin:5px 0 0 auto;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--teal);border-radius:9px;transition:width .3s}
#card{margin:6px auto 0;width:fit-content;min-width:190px;text-align:center;padding:8px 26px 10px;border-radius:24px;background:rgba(23,10,58,.55);border:2px solid rgba(255,179,107,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 34px rgba(255,107,157,.4);pointer-events:auto;cursor:pointer}
#cEmoji{font-size:64px;line-height:1.05;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#cLabel{font-size:14px;font-weight:600;color:var(--amber);line-height:1}
#card.pulse{animation:pulse .45s}
@keyframes pulse{40%{transform:scale(1.1)}}
#combo{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 48px);font-weight:800;font-size:20px;color:var(--sun);text-shadow:0 0 12px rgba(255,210,94,.8);opacity:0;transition:opacity .2s;pointer-events:none}
#combo.on{opacity:1}
#toast{position:absolute;left:12px;right:12px;top:38%;text-align:center;font-size:26px;font-weight:800;opacity:0;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.4)}
#toast.show{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.9)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:56px;font-weight:800;color:var(--sun);text-shadow:0 0 24px rgba(255,210,94,.9),0 4px 0 #b57a00;opacity:0;pointer-events:none}
#banner.show{animation:ban 1.3s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);text-align:center;font-size:13px;color:rgba(255,244,230,.75);pointer-events:none;transition:opacity 1s;padding:0 16px}
#hint.off{opacity:0}
#mute{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 110px);width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,179,107,.55);background:rgba(23,10,58,.55);color:#fff;font-size:18px;cursor:pointer;z-index:3}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 25%,rgba(150,50,160,.5),rgba(16,6,40,.94) 70%);z-index:5;transition:opacity .3s;overflow-y:auto}
.overlay.hidden{opacity:0;pointer-events:none}
.logo{font-size:60px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,150,80,.7))}
@keyframes float{50%{transform:translateY(-10px) rotate(-6deg)}}
h1{font-size:44px;line-height:1;font-weight:800;text-shadow:0 0 28px rgba(255,107,157,.9),0 4px 0 #7a1f58}
.sub{color:var(--amber);font-size:15px;max-width:320px;line-height:1.3;font-weight:600}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:320px;margin-top:4px}
.tp{border:0;border-radius:20px;padding:12px 8px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;color:var(--dusk);background:var(--cream);box-shadow:0 5px 0 var(--c),0 0 22px rgba(255,255,255,.08);transition:transform .08s;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.tp:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c)}
.tp .e{font-size:34px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tp small{font-size:12px;font-weight:600;opacity:.65}
.toggle{border:2px solid rgba(255,179,107,.6);background:transparent;color:var(--cream);border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#053D2C}
.btn{border:0;border-radius:18px;padding:12px 26px;font:inherit;font-weight:800;font-size:20px;cursor:pointer;color:var(--dusk);background:var(--sun);box-shadow:0 5px 0 #B98500;width:100%;max-width:300px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B98500}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:none;border:2px solid rgba(255,179,107,.6)}
.big{font-size:68px;font-weight:800;color:var(--sun);text-shadow:0 0 26px rgba(255,210,94,.8);line-height:1}
.medal{font-size:22px;font-weight:700;color:var(--teal)}
.res{display:flex;gap:22px;color:var(--amber);font-size:14px}
.res b{display:block;font-size:24px;color:#fff}
.lt{font-size:13px;font-weight:700;color:var(--amber);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px}
.chip{background:rgba(255,244,230,.14);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.miss{background:rgba(255,92,122,.28)}
@media (prefers-reduced-motion:reduce){.logo,#card.pulse,#toast.show,#banner.show{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="row">
      <div><div id="lives"></div><div id="coins">🪙 0</div></div>
      <div class="stats"><div id="score">0</div><div id="lvl">Cấp 1</div><div class="lbar"><i id="lfill"></i></div></div>
    </div>
    <div id="card" role="button" tabindex="0" aria-live="polite"><div id="cEmoji">🦊</div><div id="cLabel">Word Runner</div></div>
  </div>
  <div id="combo"></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="hint">Vuốt hoặc chạm nửa trái / nửa phải màn hình để quẹo</div>
  <button id="mute">🔊</button>

  <div id="start" class="overlay">
    <div class="logo">🦊</div>
    <h1>Word Runner</h1>
    <p class="sub">Chạy như Temple Run. Tới ngã ba, quẹo trái hoặc phải để chọn từ tiếng Anh đúng.</p>
    <button class="toggle" id="listen" aria-pressed="false">🎧 Chế độ nghe: Tắt</button>
    <div class="topics" id="topicList"></div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="medal" id="medal">Chạy giỏi lắm!</div>
    <div class="big" id="fScore">0</div>
    <div class="res">
      <div><b id="fSolved">0</b>câu đúng</div>
      <div><b id="fLvl">1</b>cấp đạt</div>
      <div><b id="fCoins">0</b>xu</div>
      <div><b id="fBest">0</b>kỷ lục</div>
    </div>
    <div id="learnBox"><div class="lt">Từ đã học</div><div class="chips" id="learned"></div></div>
    <div id="missBox"><div class="lt">Cần ôn lại</div><div class="chips" id="missed"></div></div>
    <button class="btn" id="again">Chạy lại</button>
    <button class="btn ghost" id="menu">Đổi chủ đề</button>
  </div>
</div>

<script>
/* ============================================================
   JSON nhúng sẵn — để chạy được từ file://.
   Nếu muốn tách file: xóa khối script này và nạp bằng fetch.
   ============================================================ */
const EMBEDDED_DATA = {
  "version": 1,
  "meta": {"title":"Word Runner — Temple Parkour","subtitle":"Chạy như Temple Run, quẹo trái/phải chọn từ đúng"},
  "game": {
    "lives": 3, "levelEvery": 6,
    "speed": {"base": 16, "perLevel": 2.2, "max": 36},
    "segment": {"straightMin":24,"straightMax":38,"forkLength":26,"forkSpread":4.0,"forkLead":16},
    "camera": {"distance":7.2,"height":3.6,"focal":1.05,"horizon":0.34},
    "road": {"width":5.6,"tileSize":1.6},
    "coins": {"enabled":true,"chance":0.8,"perRow":5,"value":2,"spacing":1.3}
  },
  "topics": [
    {"id":"fruit","name":"Trái cây","emoji":"🍎","color":"#E2A100","words":[
      {"e":"🍎","en":"apple","vi":"quả táo"},{"e":"🍌","en":"banana","vi":"quả chuối"},
      {"e":"🍇","en":"grape","vi":"quả nho"},{"e":"🍓","en":"strawberry","vi":"dâu tây"},
      {"e":"🍊","en":"orange","vi":"quả cam"},{"e":"🍉","en":"watermelon","vi":"dưa hấu"},
      {"e":"🍍","en":"pineapple","vi":"quả dứa"},{"e":"🍒","en":"cherry","vi":"anh đào"},
      {"e":"🥭","en":"mango","vi":"quả xoài"},{"e":"🥥","en":"coconut","vi":"quả dừa"},
      {"e":"🍋","en":"lemon","vi":"quả chanh"},{"e":"🍑","en":"peach","vi":"quả đào"}]},
    {"id":"animal","name":"Động vật","emoji":"🐘","color":"#D4577E","words":[
      {"e":"🐶","en":"dog","vi":"con chó"},{"e":"🐱","en":"cat","vi":"con mèo"},
      {"e":"🐘","en":"elephant","vi":"con voi"},{"e":"🦁","en":"lion","vi":"sư tử"},
      {"e":"🐵","en":"monkey","vi":"con khỉ"},{"e":"🐰","en":"rabbit","vi":"con thỏ"},
      {"e":"🐟","en":"fish","vi":"con cá"},{"e":"🐦","en":"bird","vi":"con chim"},
      {"e":"🐮","en":"cow","vi":"con bò"},{"e":"🐷","en":"pig","vi":"con lợn"},
      {"e":"🐢","en":"turtle","vi":"con rùa"},{"e":"🦒","en":"giraffe","vi":"hươu cao cổ"},
      {"e":"🐯","en":"tiger","vi":"con hổ"},{"e":"🐼","en":"panda","vi":"gấu trúc"}]},
    {"id":"object","name":"Đồ vật","emoji":"🎒","color":"#12A07C","words":[
      {"e":"📚","en":"book","vi":"quyển sách"},{"e":"✏️","en":"pencil","vi":"bút chì"},
      {"e":"🎒","en":"backpack","vi":"cái cặp"},{"e":"⏰","en":"clock","vi":"đồng hồ"},
      {"e":"🏠","en":"house","vi":"ngôi nhà"},{"e":"🚗","en":"car","vi":"ô tô"},
      {"e":"⚽","en":"ball","vi":"quả bóng"},{"e":"🚲","en":"bicycle","vi":"xe đạp"},
      {"e":"☂️","en":"umbrella","vi":"cái ô"},{"e":"🌙","en":"moon","vi":"mặt trăng"},
      {"e":"⭐","en":"star","vi":"ngôi sao"},{"e":"🔑","en":"key","vi":"chìa khóa"},
      {"e":"🎈","en":"balloon","vi":"bóng bay"},{"e":"🎁","en":"gift","vi":"món quà"}]},
    {"id":"mix","name":"Tổng hợp","emoji":"🌈","color":"#7C4BD6","mixOf":["fruit","animal","object"]}
  ]
};

/* ============================================================
   Khởi động
   ============================================================ */
let DATA = EMBEDDED_DATA;
// Nếu bạn có fetch (từ server), thử tải game-data.json để override:
if (location.protocol !== 'file:') {
  fetch('game-data.json').then(r => r.ok ? r.json() : null).then(j => { if (j) DATA = j; init(); })
    .catch(() => init());
} else { init(); }

function init() {
  const CFG = DATA.game;
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');

  /* ---------- tiện ích ---------- */
  const rnd = () => Math.random();
  const rand = (a,b) => Math.floor(rnd()*(b-a+1))+a;
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const lerp = (a,b,t) => a+(b-a)*t;
  const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rand(0,i);const t=a[i];a[i]=a[j];a[j]=t;} return a; };
  const FONT = '"Baloo 2",system-ui,sans-serif';

  /* ---------- chủ đề ---------- */
  const TOPICS = {};
  DATA.topics.forEach(t => {
    if (t.mixOf) {
      const w = [];
      t.mixOf.forEach(mid => {
        const src = DATA.topics.find(x => x.id === mid);
        if (src && src.words) w.push(...src.words);
      });
      TOPICS[t.id] = { ...t, words: w };
    } else {
      TOPICS[t.id] = t;
    }
  });
  const TOPIC_IDS = Object.keys(TOPICS);

  /* ---------- canvas / camera ---------- */
  let W=0, H=0, DPR=1, CX=0, FOCAL=0, HORIZON_Y=0;
  let skyGrad=null, fogGrad=null;
  let stars=[];
  function resize() {
    const r = $('app').getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = r.width; H = r.height;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2;
    FOCAL = H * CFG.camera.focal;
    HORIZON_Y = H * CFG.camera.horizon;

    skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON_Y*1.6);
    skyGrad.addColorStop(0,    '#170a3a');
    skyGrad.addColorStop(0.45, '#3a1055');
    skyGrad.addColorStop(0.8,  '#7a1f58');
    skyGrad.addColorStop(1,    '#c9506b');

    fogGrad = ctx.createLinearGradient(0, HORIZON_Y - 8, 0, HORIZON_Y + H*0.22);
    fogGrad.addColorStop(0,   'rgba(122,31,88,0)');
    fogGrad.addColorStop(0.5, 'rgba(122,31,88,0.55)');
    fogGrad.addColorStop(1,   'rgba(23,10,58,0)');

    stars = Array.from({length:50}, () => ({
      x: rnd()*W, y: rnd()*HORIZON_Y*0.9, r: 0.4+rnd()*1.2, p: rnd()*6.28
    }));
  }
  window.addEventListener('resize', resize);

  /* ---------- state ---------- */
  let phase='menu', topic='fruit', listen=false;
  let playerZ=0, playerX=0, targetX=0;
  let speed=CFG.speed.base;
  let score=0, lives=CFG.lives, level=1, combo=0, correctCnt=0, coinCnt=0, best=0;
  let learned=[], missed=[], lastWords=[];
  let sections=[], nextSecZ=0, activeFork=null;
  let coins=[], particles=[];
  let shakeT=0, flashT=0, flashCol='255,60,90';
  let T=0, lastT=0;
  let AC=null, muted=false;

  /* ---------- âm thanh ---------- */
  function tone(f,d,type,v,slide){
    if(muted)return;
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
      g.gain.setValueAtTime(v||.15,t);
      g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t+d);
    }catch(e){}
  }
  const sfx = {
    coin:()=>tone(1250,.07,'square',.04),
    ok:  ()=>{tone(523,.12,'triangle',.15);setTimeout(()=>tone(784,.18,'triangle',.15),90);},
    bad: ()=>tone(170,.34,'sawtooth',.12,-110),
    up:  ()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.15),i*90));},
    over:()=>{[400,300,220,150].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sawtooth',.1),i*140));},
    sw:  ()=>tone(420,.09,'sine',.07,-180)
  };
  function speak(text){
    if(muted||!window.speechSynthesis)return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);}catch(e){}
  }
  $('mute').onclick = () => { muted=!muted; $('mute').textContent = muted?'🔇':'🔊'; };

  /* ---------- projection ---------- */
  function project(wx, wy, wz){
    const camX = playerX;
    const camY = CFG.camera.height;
    const camZ = playerZ - CFG.camera.distance;
    const rx = wx - camX;
    const ry = wy - camY;
    const rz = wz - camZ;
    if (rz < 0.7) return null;
    return {
      x: CX + (rx/rz) * FOCAL,
      y: HORIZON_Y - (ry/rz) * FOCAL,
      z: rz
    };
  }

  /* ---------- track generation ---------- */
  function pushStraight(){
    const L = CFG.segment.straightMin + rnd()*(CFG.segment.straightMax - CFG.segment.straightMin);
    sections.push({ type:'straight', z0:nextSecZ, z1:nextSecZ+L });
    nextSecZ += L;
    // coins trên đoạn thẳng
    if (CFG.coins.enabled && rnd() < CFG.coins.chance){
      const n = CFG.coins.perRow;
      const startZ = nextSecZ - L*0.6;
      const lane = rand(-1,1) * 1.6;
      for (let i=0;i<n;i++) coins.push({ x: lane, z: startZ + i*CFG.coins.spacing, taken:false });
    }
  }
  function pushFork(){
    const L = CFG.segment.forkLength;
    const bank = TOPICS[topic].words;
    const correct = pickWord(bank);
    const others = bank.filter(w => w.en !== correct.en);
    const wrong = others[rand(0, others.length-1)];
    const flip = rnd() < 0.5;
    const leftWord  = flip ? correct : wrong;
    const rightWord = flip ? wrong   : correct;
    const correctSide = flip ? 'L' : 'R';
    const fork = {
      type:'fork', z0:nextSecZ, z1:nextSecZ+L,
      leftWord, rightWord, correctSide,
      choice:null, resolved:false
    };
    sections.push(fork);
    nextSecZ += L;
    return fork;
  }
  function pickWord(bank){
    let w, g=0;
    do { w = bank[rand(0, bank.length-1)]; } while (lastWords.indexOf(w)>=0 && g++<30);
    lastWords.push(w);
    if (lastWords.length > 4) lastWords.shift();
    return w;
  }
  function ensureTrackAhead(){
    while (nextSecZ < playerZ + 120) {
      // Luôn có 1 đoạn thẳng trước mỗi fork
      pushStraight();
      if (!activeFork || activeFork.resolved) {
        const last = sections[sections.length-1];
        // Chỉ tạo fork nếu không phải là fork liền trước
        const prev = sections[sections.length-2];
        if (!prev || prev.type !== 'fork' || (playerZ > prev.z1 + 4)) {
          // xác suất: gần như luôn tạo fork trừ đầu game
          if (nextSecZ > CFG.segment.forkLead + 20) {
            const f = pushFork();
            if (!activeFork || activeFork.resolved) activeFork = f;
          }
        }
      }
    }
  }

  /* ---------- gameplay ---------- */
  function startGame(t){
    topic = t;
    score=0; lives=CFG.lives; level=1;
    combo=0; correctCnt=0; coinCnt=0;
    learned=[]; missed=[];
    playerZ=0; playerX=0; targetX=0;
    speed = CFG.speed.base;
    sections=[]; nextSecZ=0; activeFork=null;
    coins=[]; particles=[];
    shakeT=0; flashT=0;
    // Tạo sẵn vài đoạn
    ensureTrackAhead();
    // Tìm fork gần nhất
    activeFork = sections.find(s => s.type==='fork') || null;

    $('start').classList.add('hidden');
    $('over').classList.add('hidden');
    phase = 'play';

    updateCard();
    updateHud();

    const hint = $('hint');
    hint.classList.remove('off');
    setTimeout(()=>hint.classList.add('off'), 5500);
  }
  function endGame(){
    phase='over';
    sfx.over();
    best = Math.max(best, score);
    setTimeout(()=>{
      $('fScore').textContent  = score;
      $('fSolved').textContent = correctCnt;
      $('fLvl').textContent    = level;
      $('fCoins').textContent  = coinCnt;
      $('fBest').textContent   = best;
      $('medal').textContent =
        score>=300 ? 'Nhà thông thái tí hon! 🏆' :
        score>=150 ? 'Chạy xuất sắc! 🌟' :
        score>=60  ? 'Chạy giỏi lắm!' :
                     'Cố lên, thử lại nhé!';
      fill($('learned'), learned, '');
      fill($('missed'),  missed,  'miss');
      $('learnBox').style.display = learned.length ? 'block' : 'none';
      $('missBox').style.display  = missed.length ? 'block' : 'none';
      $('over').classList.remove('hidden');
    }, 900);
  }
  function fill(box, list, cls){
    box.textContent = '';
    list.slice(0,8).forEach(w=>{
      const s = document.createElement('span');
      s.className = 'chip '+cls;
      s.textContent = w.e+' '+w.en+' · '+w.vi;
      box.appendChild(s);
    });
  }
  function updateHud(){
    $('score').textContent = score;
    $('lvl').textContent = 'Cấp '+level;
    $('lives').textContent = '❤️'.repeat(Math.max(0,lives)) + '🖤'.repeat(Math.max(0, CFG.lives - Math.max(0,lives)));
    $('coins').textContent = '🪙 '+coinCnt;
    $('lfill').style.width = ((correctCnt % CFG.levelEvery) / CFG.levelEvery * 100) + '%';
    const c = $('combo');
    if (combo >= 2) { c.textContent = 'Liên tiếp x'+combo+' 🔥'; c.classList.add('on'); }
    else c.classList.remove('on');
  }
  function updateCard(){
    if (!activeFork || activeFork.resolved) return;
    if (listen) {
      $('cEmoji').textContent = '🔊';
      $('cLabel').textContent = 'Nghe và quẹo đúng';
      setTimeout(()=>{ if (activeFork && !activeFork.resolved) speak(activeFork.correctSide==='L'?activeFork.leftWord.en:activeFork.rightWord.en); }, 250);
    } else {
      const correctWord = activeFork.correctSide==='L'?activeFork.leftWord:activeFork.rightWord;
      $('cEmoji').textContent = correctWord.e;
      $('cLabel').textContent = 'Đây là gì? Quẹo trái hay phải?';
    }
    const card = $('card');
    card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse');
  }

  function makeChoice(side){
    if (phase!=='play' || !activeFork || activeFork.resolved) return;
    // phải nằm trong cửa sổ quyết định
    const f = activeFork;
    if (playerZ < f.z0 - CFG.segment.forkLead*1.4) return;
    if (playerZ > f.z0 + (f.z1-f.z0)*0.55) return;

    f.choice = side;
    f.resolved = true;
    const ok = (side === f.correctSide);
    const correctWord = f.correctSide==='L'?f.leftWord:f.rightWord;

    if (ok){
      combo++; correctCnt++;
      const mult = Math.min(4, 1 + Math.floor(combo/4));
      score += 10*mult;
      if (learned.indexOf(correctWord)<0) learned.push(correctWord);
      sfx.ok();
      setTimeout(()=>speak(correctWord.en), 120);
      burst(playerX, 1.2, playerZ+1, ['#FFD25E','#FF6B9D','#19D3A2','#35E0FF','#FFF4E6'], 34);
      toast(correctWord.e+' '+correctWord.en+' = '+correctWord.vi, '#3DF0B0');
      if (correctCnt % CFG.levelEvery === 0){
        level++;
        speed = Math.min(CFG.speed.max, CFG.speed.base + (level-1)*CFG.speed.perLevel);
        banner('Cấp '+level+'!');
        sfx.up();
      }
    } else {
      combo = 0; lives--;
      shakeT = 0.5; flashT = 1; flashCol = '255,60,90';
      if (missed.indexOf(correctWord)<0) missed.push(correctWord);
      sfx.bad();
      setTimeout(()=>speak(correctWord.en), 220);
      burst(playerX, 1.2, playerZ+1, ['#FF5C7A','#8F5AA8'], 22);
      toast('Đáp án: '+correctWord.e+' '+correctWord.en+' = '+correctWord.vi, '#FFB0C0');
    }
    updateHud();
    if (lives <= 0) setTimeout(endGame, 800);
    // đặt activeFork mới sau khi qua fork này
    setTimeout(() => {
      const nxt = sections.find(s => s.type==='fork' && s.z0 > f.z0);
      if (nxt) { activeFork = nxt; updateCard(); }
      else activeFork = null;
    }, 900);
  }

  function burst(x,y,z,cols,n){
    if (particles.length>120) n = Math.min(n, 14);
    for (let i=0;i<n;i++){
      const a = rnd()*6.28, s = 2 + rnd()*4;
      particles.push({
        x, y, z,
        vx: Math.cos(a)*s, vy: 2+rnd()*4, vz: Math.sin(a)*s,
        life: 0.6+rnd()*0.6, max: 1.2,
        c: cols[rand(0, cols.length-1)],
        sz: 2+rnd()*3
      });
    }
  }
  function toast(t, col){
    const el = $('toast');
    el.textContent = t;
    el.style.color = col||'';
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }
  function banner(t){
    const el = $('banner');
    el.textContent = t;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }

  /* ---------- input ---------- */
  let pStartX = 0, pStartY = 0, pUsed = false, pDown = false;
  cv.addEventListener('pointerdown', e => {
    pStartX = e.clientX; pStartY = e.clientY;
    pUsed = false; pDown = true;
  });
  cv.addEventListener('pointermove', e => {
    if (!pDown || pUsed) return;
    const dx = e.clientX - pStartX, dy = e.clientY - pStartY;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)){
      makeChoice(dx > 0 ? 'R' : 'L');
      sfx.sw();
      pUsed = true;
    }
  });
  cv.addEventListener('pointerup', e => {
    pDown = false;
    if (pUsed) return;
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left;
    if (x < W*0.5) makeChoice('L');
    else makeChoice('R');
    sfx.sw();
  });
  cv.addEventListener('pointercancel', ()=>{ pDown = false; });

  window.addEventListener('keydown', e => {
    if (phase!=='play') return;
    if (e.key==='ArrowLeft' || e.key==='a' || e.key==='A') { makeChoice('L'); sfx.sw(); }
    if (e.key==='ArrowRight'|| e.key==='d' || e.key==='D') { makeChoice('R'); sfx.sw(); }
  });

  $('card').addEventListener('click', ()=>{
    if (listen && activeFork && !activeFork.resolved){
      const w = activeFork.correctSide==='L'?activeFork.leftWord:activeFork.rightWord;
      speak(w.en);
    }
  });

  $('listen').onclick = ()=>{
    listen = !listen;
    $('listen').setAttribute('aria-pressed', listen);
    $('listen').textContent = '🎧 Chế độ nghe: ' + (listen?'Bật':'Tắt');
    updateCard();
  };

  $('again').onclick = ()=> startGame(topic);
  $('menu').onclick = ()=>{
    $('over').classList.add('hidden');
    $('start').classList.remove('hidden');
    phase = 'menu';
    sections=[]; coins=[]; particles=[]; activeFork=null;
    playerZ=0; playerX=0; targetX=0;
    $('cEmoji').textContent='🦊'; $('cLabel').textContent='Word Runner';
  };

  /* ---------- build menu topics ---------- */
  (function buildTopics(){
    const cont = $('topicList');
    DATA.topics.forEach(t=>{
      const b = document.createElement('button');
      b.className = 'tp';
      b.style.setProperty('--c', t.color || '#7C4BD6');
      b.dataset.topic = t.id;
      b.innerHTML = `<span class="e">${t.emoji||'🌈'}</span>${t.name}<small>${t.id.toUpperCase()}</small>`;
      b.onclick = ()=> startGame(t.id);
      cont.appendChild(b);
    });
  })();

  /* ---------- update ---------- */
  function update(dt){
    T += dt;
    if (phase === 'play'){
      playerZ += speed*dt;
      ensureTrackAhead();
    } else if (phase === 'menu') {
      playerZ += 6*dt;
      ensureTrackAhead();
    } else {
      playerZ += 2*dt;
    }

    // target X dựa vào fork đang có choice
    targetX = 0;
    const fNow = sections.find(s => s.type==='fork' && playerZ >= s.z0 && playerZ <= s.z1 && s.choice);
    if (fNow){
      const u = (playerZ - fNow.z0) / (fNow.z1 - fNow.z0);
      const spread = CFG.segment.forkSpread * Math.sin(u * Math.PI);
      targetX = (fNow.choice === 'L' ? -1 : 1) * spread;
    }
    playerX = lerp(playerX, targetX, Math.min(1, dt*8));

    // xoá section đã qua
    while (sections.length && sections[0].z1 < playerZ - 30) sections.shift();

    // coins
    const pickRadius = 1.2;
    for (const c of coins){
      if (c.taken) continue;
      if (Math.abs(c.z - playerZ) < 0.6 && Math.abs(c.x - playerX) < pickRadius){
        c.taken = true; coinCnt++; score += CFG.coins.value; sfx.coin(); updateHud();
      }
    }
    coins = coins.filter(c => !c.taken && c.z > playerZ - 20);

    // particles
    for (let i=0;i<particles.length;i++){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      p.vy -= 6*dt;
      p.life -= dt;
    }
    if (particles.length) particles = particles.filter(p => p.life > 0);

    shakeT = Math.max(0, shakeT - dt*1.4);
    flashT = Math.max(0, flashT - dt*2.2);

    // auto-fail nếu vào quá nửa fork mà chưa chọn
    const fPass = sections.find(s => s.type==='fork' && !s.resolved && playerZ > s.z0 + (s.z1-s.z0)*0.55);
    if (fPass && phase==='play') makeChoice(fPass.correctSide==='L'?'R':'L'); // chọn sai để phạt

    // Cập nhật activeFork theo vị trí
    const nextFork = sections.find(s => s.type==='fork' && !s.resolved && s.z1 > playerZ - 4);
    if (nextFork !== activeFork && nextFork && !nextFork.resolved){
      activeFork = nextFork;
      updateCard();
    }
  }

  /* ---------- vẽ ---------- */
  function rr(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawSky(){
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,HORIZON_Y*1.6);
    // sao
    ctx.fillStyle = '#fff';
    for (const s of stars){
      ctx.globalAlpha = 0.3 + 0.5*Math.sin(T*2 + s.p);
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // trăng
    const cx = W*0.78, cy = HORIZON_Y*0.42, r = Math.min(W*0.09, 42);
    const gl = ctx.createRadialGradient(cx,cy,r*0.4,cx,cy,r*2.4);
    gl.addColorStop(0,'rgba(255,210,140,.5)');
    gl.addColorStop(1,'rgba(255,210,140,0)');
    ctx.fillStyle = gl; ctx.fillRect(cx-r*3, cy-r*3, r*6, r*6);
    ctx.fillStyle = '#FFE9B0';
    ctx.beginPath(); ctx.arc(cx,cy,r,0,6.28); ctx.fill();
    // núi xa
    ctx.fillStyle = '#2b1656';
    ctx.beginPath(); ctx.moveTo(0, HORIZON_Y+2);
    for (let x=0; x<=W; x+=22){
      const y = HORIZON_Y*0.72 + Math.sin(x*0.014+1.7)*12 + Math.sin(x*0.031+4.1)*6;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, HORIZON_Y+2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a0e3d';
    ctx.beginPath(); ctx.moveTo(0, HORIZON_Y+2);
    for (let x=0; x<=W; x+=22){
      const y = HORIZON_Y*0.86 + Math.sin(x*0.021+3.1)*8 + Math.sin(x*0.045+0.9)*4;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, HORIZON_Y+2); ctx.closePath(); ctx.fill();
    // nền dưới horizon
    ctx.fillStyle = '#1d0730';
    ctx.fillRect(0, HORIZON_Y+2, W, H-HORIZON_Y);
  }

  function drawRoadQuad(x1,z1,x2,z2,halfW,c1,c2,edge){
    const p1 = project(x1-halfW, 0, z1);
    const p2 = project(x1+halfW, 0, z1);
    const p3 = project(x2+halfW, 0, z2);
    const p4 = project(x2-halfW, 0, z2);
    if (!p1||!p2||!p3||!p4) return;
    // fill
    const g = ctx.createLinearGradient(0, p1.y, 0, p4.y);
    g.addColorStop(0, c2); g.addColorStop(1, c1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath(); ctx.fill();
    // cạnh phát sáng
    if (edge){
      ctx.strokeStyle = edge; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p4.x,p4.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.stroke();
    }
  }

  function addRoadItems(items){
    const HALF = CFG.road.width * 0.5;
    const TILE = CFG.road.tileSize;

    // Sinh các tile theo z từ xa tới gần
    const zFar = playerZ + 80;
    const zNear = playerZ - CFG.camera.distance + 1.2;

    // Đoạn thẳng
    for (let z = zFar; z > zNear; z -= TILE){
      const zA = z, zB = z - TILE;
      // bỏ qua nếu đang trong fork
      if (isInsideFork(zA) || isInsideFork(zB)) continue;
      const idx = Math.floor(z / TILE);
      const odd = ((idx%2)+2)%2;
      const c1 = odd ? '#3a2b5c' : '#33224f';
      const c2 = odd ? '#241540' : '#1f0f36';
      const edge = '#8a5cff';
      items.push({
        z: (zA+zB)/2,
        draw: () => drawRoadQuad(0, zA, 0, zB, HALF, c1, c2, edge)
      });
    }

    // Đoạn fork: 2 nhánh
    const forkList = sections.filter(s => s.type==='fork' && s.z1 > zNear && s.z0 < zFar);
    for (const f of forkList){
      const SEG = 22;
      const len = f.z1 - f.z0;
      for (let i=0;i<SEG;i++){
        const uA = i/SEG, uB = (i+1)/SEG;
        const zA = f.z0 + uA*len;
        const zB = f.z0 + uB*len;
        const xLA = -CFG.segment.forkSpread*Math.sin(uA*Math.PI);
        const xLB = -CFG.segment.forkSpread*Math.sin(uB*Math.PI);
        const xRA =  CFG.segment.forkSpread*Math.sin(uA*Math.PI);
        const xRB =  CFG.segment.forkSpread*Math.sin(uB*Math.PI);
        const ARM = HALF*0.72;
        const colL1 = '#5a2a6f', colL2 = '#3a1a52';
        const colR1 = '#2a5a7f', colR2 = '#1a3a52';
        items.push({
          z: (zA+zB)/2,
          draw: () => drawRoadQuad(xLA,zA,xLB,zB,ARM,colL1,colL2,'#FF6B9D')
        });
        items.push({
          z: (zA+zB)/2,
          draw: () => drawRoadQuad(xRA,zA,xRB,zB,ARM,colR1,colR2,'#19D3A2')
        });
      }
    }
  }
  function isInsideFork(z){
    for (const s of sections){
      if (s.type==='fork' && z >= s.z0 && z <= s.z1) return true;
    }
    return false;
  }

  function addForkCards(items){
    const zFar = playerZ + 80;
    const zNear = playerZ - CFG.camera.distance + 1.2;
    for (const f of sections){
      if (f.type!=='fork') continue;
      if (f.z1 < zNear || f.z0 > zFar) continue;
      const zMid = (f.z0 + f.z1) * 0.5;
      const spread = CFG.segment.forkSpread;
      // card bên trái
      items.push({ z: zMid - 0.01, draw: () => drawCard3D(-spread, zMid, f.leftWord, f, 'L') });
      items.push({ z: zMid,        draw: () => drawCard3D( spread, zMid, f.rightWord, f, 'R') });
    }
  }
  function drawCard3D(x, z, word, fork, side){
    // cột dựng từ đường lên
    const base = project(x, 0, z);
    const top  = project(x, 3.4, z);
    if (!base || !top) return;
    // cột
    ctx.strokeStyle = 'rgba(255,244,230,.35)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();

    // kích thước card trên màn hình tỉ lệ theo 1/z
    const scale = FOCAL / top.z;
    const cw = clamp(scale * 1.7, 60, 130);
    const ch = clamp(scale * 0.75, 28, 56);
    const cx = top.x - cw/2;
    const cy = top.y - ch/2;

    const isCorrect = fork.correctSide === side;
    const isResolved = fork.resolved;
    const wasChosen = fork.choice === side;

    let bg = '#FFF4E6', fg = '#2B1055', border = side==='L'?'#FF6B9D':'#19D3A2';
    if (isResolved){
      if (isCorrect){ bg='#3DF0B0'; fg='#053D2C'; border='#3DF0B0'; }
      else if (wasChosen){ bg='#FF5C7A'; fg='#fff'; border='#FF5C7A'; }
      else { bg='#cfc6dc'; fg='#6b5e86'; border='#9d94b3'; }
    }

    // bóng + nền
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    rr(cx+3, cy+4, cw, ch, 12); ctx.fill();
    rr(cx, cy, cw, ch, 12);
    ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = border; ctx.stroke();

    // chữ
    let fs = ch * 0.52;
    ctx.font = '800 '+fs+'px '+FONT;
    let tw = ctx.measureText(word.en).width;
    const maxW = cw - 16;
    if (tw > maxW){ fs = fs * maxW / tw; ctx.font = '800 '+fs+'px '+FONT; }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = fg;
    ctx.fillText(word.en, cx + cw/2, cy + ch/2 + 1);

    // mũi tên chỉ hướng
    ctx.fillStyle = border;
    const ax = cx + cw/2, ay = cy + ch + 8;
    ctx.beginPath();
    ctx.moveTo(ax-8, ay-6); ctx.lineTo(ax+8, ay-6); ctx.lineTo(ax, ay+2);
    ctx.closePath(); ctx.fill();
  }

  function addCoinItems(items){
    const zFar = playerZ + 60;
    const zNear = playerZ - CFG.camera.distance + 1;
    for (const c of coins){
      if (c.taken) continue;
      if (c.z < zNear || c.z > zFar) continue;
      items.push({ z: c.z, draw: () => drawCoin3D(c) });
    }
  }
  function drawCoin3D(c){
    const p = project(c.x, 0.7, c.z);
    if (!p) return;
    const s = FOCAL / p.z;
    const r = clamp(s*0.28, 6, 24);
    const wob = Math.abs(Math.cos(T*4 + c.z*0.3));
    ctx.fillStyle = '#FFD25E';
    ctx.strokeStyle = '#B98500'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r*wob + 2, r, 0, 0, 6.28);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath();
    ctx.ellipse(p.x - r*0.25, p.y - r*0.3, r*0.22, r*0.3, 0, 0, 6.28);
    ctx.fill();
  }

  function addParticleItems(items){
    for (const p of particles){
      const pr = project(p.x, p.y, p.z);
      if (!pr) continue;
      const s = FOCAL / pr.z;
      items.push({
        z: p.z - 0.001,
        draw: () => {
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(pr.x, pr.y, clamp(s*p.sz*0.1, 1, 12), 0, 6.28);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      });
    }
  }

  function drawFoxSprite(){
    const p = project(playerX, 0, playerZ);
    if (!p) return;
    const s = FOCAL / p.z;
    const baseH = clamp(s * 1.1, 40, 120);  // chiều cao trên màn hình
    const w = baseH * 0.75;
    const x = p.x, y = p.y;

    // bóng
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath();
    ctx.ellipse(x, y, w*0.55, w*0.16, 0, 0, 6.28);
    ctx.fill();

    const run = Math.sin(T*14);
    const bx = x, by = y - baseH*0.35;

    // chân
    const OR='#FF8A3D', DK='#5a2d12';
    ctx.fillStyle = DK;
    const legOffset = baseH*0.10;
    ctx.fillRect(bx - w*0.28, by + baseH*0.10 + (run>0?-legOffset*0.6:0), w*0.16, baseH*0.28);
    ctx.fillRect(bx + w*0.12, by + baseH*0.10 + (run>0?0:-legOffset*0.6), w*0.16, baseH*0.28);

    // thân (nhìn từ sau)
    ctx.fillStyle = OR;
    ctx.beginPath();
    ctx.ellipse(bx, by + baseH*0.02, w*0.55, baseH*0.34, 0, 0, 6.28);
    ctx.fill();
    // bụng sáng
    ctx.fillStyle = '#FFB07A';
    ctx.beginPath();
    ctx.ellipse(bx, by + baseH*0.05, w*0.32, baseH*0.20, 0, 0, 6.28);
    ctx.fill();

    // đuôi vẫy
    const tw = Math.sin(T*7)*0.4;
    ctx.save();
    ctx.translate(bx, by - baseH*0.05);
    ctx.rotate(tw);
    ctx.fillStyle = OR;
    ctx.beginPath();
    ctx.ellipse(w*0.35, -baseH*0.15, w*0.30, baseH*0.28, 0.4, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = '#FFF4E6';
    ctx.beginPath();
    ctx.ellipse(w*0.52, -baseH*0.32, w*0.22, baseH*0.14, 0.4, 0, 6.28);
    ctx.fill();
    ctx.restore();

    // đầu (nhìn từ sau)
    ctx.fillStyle = OR;
    ctx.beginPath();
    ctx.arc(bx, by - baseH*0.35, w*0.42, 0, 6.28);
    ctx.fill();

    // tai
    ctx.beginPath();
    ctx.moveTo(bx - w*0.38, by - baseH*0.42);
    ctx.lineTo(bx - w*0.28, by - baseH*0.65);
    ctx.lineTo(bx - w*0.10, by - baseH*0.45);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + w*0.38, by - baseH*0.42);
    ctx.lineTo(bx + w*0.28, by - baseH*0.65);
    ctx.lineTo(bx + w*0.10, by - baseH*0.45);
    ctx.fill();
    // lót tai
    ctx.fillStyle = DK;
    ctx.beginPath();
    ctx.moveTo(bx - w*0.30, by - baseH*0.47);
    ctx.lineTo(bx - w*0.26, by - baseH*0.60);
    ctx.lineTo(bx - w*0.16, by - baseH*0.47);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + w*0.30, by - baseH*0.47);
    ctx.lineTo(bx + w*0.26, by - baseH*0.60);
    ctx.lineTo(bx + w*0.16, by - baseH*0.47);
    ctx.fill();

    // khăn quàng
    const scarf = Math.sin(T*12)*w*0.06;
    ctx.fillStyle = '#35E0FF';
    ctx.fillRect(bx - w*0.40, by - baseH*0.20, w*0.80, baseH*0.08);
    ctx.beginPath();
    ctx.moveTo(bx + w*0.28, by - baseH*0.16);
    ctx.lineTo(bx + w*0.72 + scarf, by - baseH*0.10);
    ctx.lineTo(bx + w*0.62 + scarf, by + baseH*0.02);
    ctx.lineTo(bx + w*0.22, by - baseH*0.06);
    ctx.fill();
  }

  function draw(){
    ctx.save();
    if (shakeT > 0) ctx.translate((rnd()-0.5)*shakeT*20, (rnd()-0.5)*shakeT*20);

    drawSky();

    // Collect items far-to-near
    const items = [];
    addRoadItems(items);
    addCoinItems(items);
    addForkCards(items);
    addParticleItems(items);
    items.sort((a,b) => b.z - a.z);
    for (const it of items) it.draw();

    drawFoxSprite();

    // fog dải ngang horizon
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, HORIZON_Y-8, W, H*0.22);

    ctx.restore();

    if (flashT > 0){
      ctx.fillStyle = 'rgba('+flashCol+','+flashT*0.32+')';
      ctx.fillRect(0,0,W,H);
    }
  }

  /* ---------- loop ---------- */
  function loop(ts){
    const dt = Math.min(0.05, (ts-lastT)/1000 || 0);
    lastT = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  /* ---------- go ---------- */
  resize();
  updateHud();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
