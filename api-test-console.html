<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDU GAME — API Test Console</title>
<style>
:root{
  --bg:#0f1117;--bg2:#161923;--bg3:#1e2230;--line:#2a3040;
  --fg:#e6e9f0;--fg2:#98a2b8;--fg3:#6b7488;
  --acc:#5b8cff;--ok:#3ecf8e;--warn:#f0b429;--err:#ff5f6d;--purple:#a78bfa;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--fg)}
.app{display:grid;grid-template-columns:295px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:flex-end;gap:10px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.3px;white-space:nowrap;padding-bottom:2px}
.brand span{color:var(--acc)}
.grow{flex:1}
aside{background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:10px}
main{overflow:auto;padding:16px 18px 60px}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;font-family:var(--mono);font-size:12px}
label{display:block;font-size:10.5px;color:var(--fg2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#262b3a;border-color:#3a4256}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06281b;font-weight:600}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#3a2a00;font-weight:600}
.btn.sm{padding:4px 8px;font-size:11px;border-radius:6px}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;min-width:150px}
.tb{display:flex;flex-direction:column;min-width:160px}
.tb input{width:250px}
.tb.tight input{width:120px}
.grp{margin-bottom:5px}
.grp-h{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2)}
.grp-h:hover{background:var(--bg3);color:var(--fg)}
.grp-h .cnt{margin-left:auto;font-weight:500;color:var(--fg3);font-size:11px}
.grp-h .chev{font-size:9px;color:var(--fg3);transition:transform .15s}
.grp.open .chev{transform:rotate(90deg)}
.grp-b{display:none;padding-left:6px;border-left:1px solid var(--line);margin-left:9px}
.grp.open .grp-b{display:block}
.nav{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--fg2);text-decoration:none}
.nav:hover{background:var(--bg3);color:var(--fg)}
.nav.active{background:#23304d;color:#cfe0ff}
.m{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:4px;min-width:44px;text-align:center;flex-shrink:0}
.m-GET{background:#12331f;color:#5fd39a}
.m-POST{background:#12324d;color:#63b3ff}
.m-PUT{background:#3a2f0d;color:#f5c451}
.m-PATCH{background:#33210e;color:#ffab5c}
.m-DELETE{background:#3d1518;color:#ff8b93}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer}
.card-h:hover{background:#1b202c}
.card.open .card-h{background:#1b202c;border-bottom:1px solid var(--line)}
.path{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.sum{color:var(--fg2);font-size:12px;margin-left:auto;text-align:right;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-b{display:none;padding:14px}
.card.open .card-b{display:block}
.chip{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--fg2);white-space:nowrap}
.chip.auth{border-color:#3a4a6b;color:#9db8ff}
.chip.open{border-color:#1d5c3d;color:#5fd39a;background:#0f2419}
.chip.role{border-color:#5c3d6b;color:#c79bf0}
.chip.no{border-color:#5c262b;color:#ff9aa1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.req{color:var(--err);margin-left:3px}
.hint{color:var(--fg3);font-size:11px;margin-top:3px}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg3);margin:16px 0 8px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px}
.sub:first-child{margin-top:0}
.cases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.case{border:1px solid var(--line);background:var(--bg3);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:11.5px}
.case:hover{border-color:#3a4256}
.case.sel{background:#23304d;border-color:var(--acc);color:#cfe0ff}
.case .exp{color:var(--fg3);font-family:var(--mono);font-size:10px;margin-left:5px}
.resp{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0c0e14}
.resp-h{display:flex;align-items:center;gap:9px;padding:8px 11px;background:#12151d;border-bottom:1px solid var(--line);flex-wrap:wrap}
.st{font-family:var(--mono);font-weight:700;padding:2px 9px;border-radius:6px;font-size:12px}
.st.s2{background:#12331f;color:#5fd39a}.st.s3{background:#3a2f0d;color:#f5c451}
.st.s4,.st.s5{background:#3d1518;color:#ff8b93}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{font-size:11px;padding:3px 9px;border-radius:6px;cursor:pointer;color:var(--fg2)}
.tab.sel{background:var(--bg3);color:var(--fg)}
pre{margin:0;padding:11px;overflow:auto;max-height:480px;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.url{font-family:var(--mono);font-size:11.5px;color:var(--fg2);padding:7px 11px;border-bottom:1px solid var(--line);word-break:break-all;background:#0f1218}
.k{color:#7ee0c0}.s{color:#ffcf8a}.n{color:#9db8ff}.b{color:#c79bf0}
.drawer{position:fixed;right:0;top:0;bottom:0;width:350px;background:var(--bg2);border-left:1px solid var(--line);transform:translateX(101%);transition:transform .2s;z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-h{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
.drawer-b{padding:12px 14px;overflow:auto;flex:1}
.var{display:grid;grid-template-columns:92px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.var .vk{font-family:var(--mono);font-size:11px;color:var(--purple)}
.var input{padding:4px 7px;font-size:11.5px;font-family:var(--mono)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--fg3);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.tbl tr:hover td{background:#141824}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--err);font-weight:700}.skip{color:var(--fg3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.open{display:flex}
.modal-c{background:var(--bg2);border:1px solid var(--line);border-radius:12px;max-width:1050px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal-h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-b{padding:15px;overflow:auto}
.prog{height:4px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:9px 16px;border-radius:9px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.live{width:7px;height:7px;border-radius:50%;background:var(--fg3);display:inline-block}
.live.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3346;border-radius:6px}
@media(max-width:920px){.app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">EDU GAME <span>API Test Console</span></div>
    <div class="tb"><label>Base URL <span style="color:var(--fg3);text-transform:none">(không kèm /api)</span></label><input id="baseUrl" placeholder="http://localhost:5000" /></div>
    <div class="tb tight"><label>Token <span class="live" id="live"></span></label><input id="token" placeholder="JWT — rỗng = không auth" /></div>
    <div class="tb"><label>Đăng nhập nhanh</label>
      <div class="row">
        <button class="btn sm" data-login="teacher">teacher</button>
        <button class="btn sm" data-login="admin">admin</button>
        <button class="btn sm" data-login="student">student</button>
        <button class="btn sm ghost" id="btnLogout" title="Xoá token">✕</button>
      </div>
    </div>
    <div class="tb tight"><label>Chế độ token</label>
      <select id="mode"><option value="auto">Auto</option><option value="on">Luôn gửi</option><option value="off">Không gửi</option></select>
    </div>
    <div class="grow"></div>
    <button class="btn" id="btnVars">🧩 Biến <span id="varCount">0</span></button>
    <button class="btn warn" id="btnSmoke">▶ Smoke test</button>
    <button class="btn ghost" id="btnHealth">Health</button>
  </header>
  <aside>
    <div style="margin-bottom:10px"><input id="search" placeholder="🔍 Tìm endpoint (path / mô tả)…" /></div>
    <div id="nav"></div>
  </aside>
  <main id="main"></main>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-h">🧩 Biến dùng chung <span class="grow"></span><button class="btn sm" id="btnVarClear">Xoá hết</button><button class="btn sm" id="btnVarClose">✕</button></div>
  <div class="drawer-b">
    <p style="color:var(--fg2);font-size:12px;margin:0 0 10px">Dùng <code style="color:var(--purple)">{{tên}}</code> trong mọi ô nhập. Endpoint có khai báo <b>capture</b> sẽ tự điền biến từ response.</p>
    <div id="vars"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-c">
    <div class="modal-h"><b id="mTitle">Smoke test</b><span class="grow"></span><button class="btn sm" id="mClose">Đóng</button></div>
    <div class="modal-b"><div class="prog"><i id="mProg"></i></div><div id="mBody"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════ 0. TIỆN ÍCH ══════════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem('apitc:'+k);return v?JSON.parse(v):d}catch{return d}},
          set(k,v){try{localStorage.setItem('apitc:'+k,JSON.stringify(v))}catch{}}};
function toast(m,ms=1900){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getPath(o,e){return String(e).split('.').reduce((a,k)=>{const m=k.match(/^(\w+)\[(\d+)\]$/);return m?a?.[m[1]]?.[+m[2]]:a?.[k]},o)}

/* ══════════════════ 1. CATALOG ENDPOINT ══════════════════
   E(id, method, path, {auth, sum, path:[], query:[], body:[], cases:[]})
   auth: none | any | student | teacher | admin
   body field: {k, t, req, d, v}  t=text|number|password|bool|json|array|textarea|date|select
   case: {n, expect:[...], auth, body, path, query, capture:{}, note, repeat}
   ═════════════════════════════════════════════════════ */
const E=(id,method,path,o={})=>({id,method,path,auth:'any',...o});
const CATALOG = [
/* ── SYSTEM ── */
{g:'System',items:[
 E('health','GET','/api/health',{auth:'none',sum:'Server còn sống (luôn 200)',
   cases:[{n:'Bình thường',expect:[200]},{n:'503 khi DB chưa sẵn sàng',expect:[503],note:'Render cold start — thử lại sau vài giây'}]}),
 E('stats','GET','/api/stats',{auth:'teacher',sum:'Thống kê tổng quan (teacher/admin)',
   cases:[{n:'Teacher',expect:[200]},{n:'Không token',auth:'none',expect:[401]},{n:'Student bị chặn',auth:'student',expect:[403]}]}),
]},
/* ── AUTH ── */
{g:'Auth · Coins · Stars · XP',items:[
 E('auth.login','POST','/api/auth/login',{auth:'none',sum:'Đăng nhập → token',
   bd:[{k:'identifier',t:'text',d:'username hoặc email (bỏ trống = dùng `username`)'},{k:'username',t:'text',v:'teacher'},{k:'password',t:'password',req:1,v:'123456'}],
   cases:[
     {n:'✔ Đúng',expect:[200],capture:{token:'data.token'}},
     {n:'Sai mật khẩu',expect:[401],bd:{password:'sai-mat-khau'}},
     {n:'Thiếu mật khẩu',expect:[400],bd:{password:undefined}},
     {n:'User không tồn tại',expect:[401],bd:{username:'khong-co-that-aaa'}},
     {n:'Đăng nhập bằng email',expect:[400],bd:{username:undefined,identifier:'khong-co@x.com'}},
   ]}),
 E('auth.register','POST','/api/auth/register',{auth:'none',sum:'Đăng ký (role luôn = student)',
   bd:[{k:'username',t:'text',req:1,v:'hocsinh01'},{k:'password',t:'password',req:1,v:'123456'},{k:'name',t:'text',req:1,v:'Học Sinh 01'},{k:'email',t:'text',v:'hs01@example.com'}],
   cases:[{n:'✔ Đăng ký mới',expect:[201]},{n:'Trùng username',expect:[409],bd:{username:'hocsinh01'}},
          {n:'Mật khẩu < 6 ký tự',expect:[400],bd:{password:'123'}},{n:'Thiếu name',expect:[400],bd:{name:undefined}}]}),
 E('auth.me','GET','/api/auth/me',{auth:'any',sum:'Hồ sơ tài khoản hiện tại',
   cases:[{n:'✔ Có token',expect:[200]},{n:'Token sai',auth:'none',expect:[401]}]}),
 E('auth.me.update','PUT','/api/auth/me',{auth:'any',sum:'Sửa hồ sơ (cần currentPassword khi đổi mật)',
   bd:[{k:'name',t:'text',v:'Tên Mới'},{k:'email',t:'text'},{k:'password',t:'password'},{k:'currentPassword',t:'password'},{k:'avatarLoadout',t:'json',d:'vd {"hat":"hat_01"}'}],
   cases:[{n:'✔ Đổi tên',expect:[200],bd:{name:'Tên Mới'}},
          {n:'Đổi mật thiếu currentPassword',expect:[400],bd:{password:'matkhaumoi',currentPassword:undefined}},
          {n:'Body rỗng',expect:[400],bd:{name:undefined,email:undefined,password:undefined}}]}),
 E('auth.coins.get','GET','/api/auth/me/coins',{auth:'any',sum:'Đọc số coin',
   cases:[{n:'✔ Có token',expect:[200]},{n:'Không token',auth:'none',expect:[401]}]}),
 E('auth.coins.add','POST','/api/auth/me/coins',{auth:'any',sum:'Cộng / bớt coin',
   bd:[{k:'amount',t:'number',req:1,v:50}],
   cases:[{n:'✔ Cộng 50',expect:[200]},{n:'Bớt (âm)',expect:[200],bd:{amount:-10}},
          {n:'Thiếu amount',expect:[400],bd:{amount:undefined}},{n:'amount sai kiểu',expect:[400],bd:{amount:'abc'}}]}),
 E('auth.stars.get','GET','/api/auth/me/stars',{auth:'any',sum:'Đọc số sao'}),
 E('auth.stars.add','POST','/api/auth/me/stars',{auth:'any',sum:'Cộng sao',
   bd:[{k:'amount',t:'number',req:1,v:5}],
   cases:[{n:'✔ Cộng 5',expect:[200]},{n:'Thiếu amount',expect:[400],bd:{amount:undefined}}]}),
 E('auth.stars.exchange','POST','/api/auth/me/stars/exchange',{auth:'any',sum:'Đổi toàn bộ sao → coin (10 coin/sao)',
   cases:[{n:'✔ Đủ sao',expect:[200]},{n:'Không còn sao → 400',expect:[400]}]}),
 E('auth.xp','GET','/api/auth/me/xp',{auth:'any',sum:'★ XP / Level — read-only, không cộng XP từ client',
   cases:[{n:'✔ Có token',expect:[200],expectFields:{data:['xp','level','xpIntoLevel','xpPerLevel']}},
          {n:'Không token',auth:'none',expect:[401]}]}),
]},
/* ── USERS ── */
{g:'Users',items:[
 E('users.list','GET','/api/users',{auth:'teacher',sum:'Danh sách user (teacher/admin)',
   cases:[{n:'✔ Teacher',expect:[200]},{n:'Không token',auth:'none',expect:[401]},{n:'Student bị chặn',auth:'student',expect:[403]}]}),
 E('users.get','GET','/api/users/:id',{auth:'any',sum:'Chi tiết user (không giới hạn role)',
   pp:[{k:'id',t:'text',req:1,v:'{{userId}}'}],
   cases:[{n:'✔ User có thật',expect:[200]},{n:'Không tồn tại',expect:[404],pp:{id:'khong-co'}}]}),
 E('users.search','GET','/api/users/search',{auth:'any',sum:'Tìm user (bỏ trừ chính mình, max 20)',
   qp:[{k:'q',t:'text',req:1,v:'a'}],
   cases:[{n:'✔ ≥ 2 ký tự',expect:[200]},{n:'q = 1 ký tự → []',expect:[200],qp:{q:'a'}},{n:'Thiếu q → []',expect:[200],qp:{q:undefined}}]}),
 E('users.create','POST','/api/users',{auth:'teacher',sum:'Tạo user',
   bd:[{k:'username',t:'text',req:1,v:'newuser01'},{k:'password',t:'password',req:1,v:'123456'},{k:'name',t:'text',req:1,v:'Người Dùng Mới'},{k:'email',t:'text',v:'new01@example.com'},{k:'role',t:'select',v:'student',options:['student','teacher','admin']}],
   cases:[{n:'✔ Tạo student',expect:[201],capture:{userId:'data.id'}},{n:'Trùng username',expect:[400],bd:{username:'newuser01'}},
          {n:'Mật khẩu < 6',expect:[400],bd:{password:'1'}},{n:'Tạo role admin (bị chặn)',expect:[403],bd:{role:'admin',username:'adminmoi01',email:undefined}}]}),
 E('users.update','PATCH','/api/users/:id',{auth:'admin',sum:'Sửa user (chỉ admin)',
   pp:[{k:'id',t:'text',req:1,v:'{{userId}}'}],
   bd:[{k:'name',t:'text',v:'Tên Đã Sửa'},{k:'email',t:'text'},{k:'role',t:'select',v:'',options:['','student','teacher','admin']}],
   cases:[{n:'✔ Admin sửa',expect:[200]},{n:'Teacher bị chặn',auth:'teacher',expect:[403]}]}),
 E('users.role','PATCH','/api/users/:id/role',{auth:'admin',sum:'Đổi role',
   pp:[{k:'id',t:'text',req:1,v:'{{userId}}'}],bd:[{k:'role',t:'select',req:1,v:'teacher',options:['student','teacher','admin']}],
   cases:[{n:'✔ Đổi role',expect:[200]},{n:'Thiếu role',expect:[400],bd:{role:undefined}},{n:'Không đổi được user-001',expect:[400],pp:{id:'user-001'}}]}),
 E('users.resetpw','PATCH','/api/users/:id/reset-password',{auth:'teacher',sum:'Reset mật khẩu',
   pp:[{k:'id',t:'text',req:1,v:'{{userId}}'}],bd:[{k:'newPassword',t:'password',req:1,v:'123456'}],
   cases:[{n:'✔ Reset',expect:[200]},{n:'Mật khẩu < 6',expect:[400],bd:{newPassword:'123'}}]}),
 E('users.delete','DELETE','/api/users/:id',{auth:'teacher',sum:'Xoá user',
   pp:[{k:'id',t:'text',req:1,v:''}],
   cases:[{n:'✔ Xoá (tạo user nháp trước)',expect:[204]},{n:'Không xoá được user-001',expect:[400],pp:{id:'user-001'}},{n:'Không token',auth:'none',expect:[401]}]}),
]},
/* ── GAME PROGRESS ── */
{g:'Users › Game Progress',items:[
 E('gp.list','GET','/api/users/me/games',{auth:'any',sum:'Tiến độ game của tôi'}),
 E('gp.get','GET','/api/users/me/games/:gameId',{auth:'any',sum:'Tiến độ 1 game (luôn 200, không 404)',
   pp:[{k:'gameId',t:'text',req:1,v:'{{gameId}}'}],
   cases:[{n:'✔ Game có data',expect:[200]},{n:'Game chưa chơi → số 0',expect:[200],pp:{gameId:'khong-co-game'}}]}),
 E('gp.upsert','PUT','/api/users/me/games/:gameId',{auth:'any',sum:'Cập nhật tiến độ',
   pp:[{k:'gameId',t:'text',req:1,v:'{{gameId}}'}],

const state={
  baseUrl:LS.get('baseUrl',(location.origin&&location.origin!=='null'?location.origin:'http://localhost:5000')),
  token:LS.get('token',''), role:LS.get('role',''), mode:LS.get('mode','auto'),
  vars:LS.get('vars',{}), open:LS.get('open',{}), caseSel:LS.get('caseSel',{}),
  vals:{}, resp:{}, q:''
};
const VAR_ORDER=['classId','classCode','gameId','gameId2','gameCode','templateId','questionId','bankId',
  'userId','assignmentId','assignmentCode','submissionId','playId','taskId','roleKey','reminderId',
  'sessionId','tokenStudent','deadline','in1min','avatarItemCode','plantTypeId'];

  deadline:()=>new Date(Date.now()+864e5).toISOString().slice(0,16),
  in1min:()=>new Date(Date.now()+6e4).toISOString().slice(0,16)};
VAR_ORDER.forEach(k=>{if(state.vars[k]==null)state.vars[k]=SPECIAL[k]?SPECIAL[k]():''});
function save(){LS.set('baseUrl',state.baseUrl);LS.set('token',state.token);LS.set('role',state.role);
  LS.set('mode',state.mode);LS.set('vars',state.vars);LS.set('open',state.open);LS.set('caseSel',state.caseSel)}
function setVar(k,v){state.vars[k]=v;save();renderVars();renderNav()}
function interp(s){return String(s??'').replace(/\{\{\s*([\w.]+)\s*\}\}/g,(_,k)=>{const v=state.vars[String(k).trim()];return v==null?'':String(v)})}
function parsed(v,t){
  if(v==null||v==='')return undefined;
  if(t==='number'){const n=Number(v);return Number.isFinite(n)?n:v}
  if(t==='bool')return v===true||v==='true'||v==='1';
  if(t==='array'||t==='json'){if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return v}}
  return v;
}

/* ══════════════════ 3. GỬI REQUEST ══════════════════
   Quy ước khóa trong catalog: path = URL mẫu · pp = path param · qp = query param · bd = body field */

/** Nạp sẵn giá trị mặc định của mọi field vào state để ô nhập và request khớp nhau. */
function ensureVals(ep){
  const v=state.vals[ep.id]||(state.vals[ep.id]={pp:{},qp:{},bd:{}});
  for(const [key,list] of [['pp',ep.pp],['qp',ep.qp],['bd',ep.bd]])
    for(const f of (list||[])) if(v[key][f.k]===undefined&&f.v!==undefined) v[key][f.k]=String(f.v);
  return v;
}

async function send(ep,o={}){
  const v=ensureVals(ep);
  const p={...v.pp,...(o.overrides?.pp||{})}, q={...v.qp,...(o.overrides?.qp||{})}, b={...v.bd,...(o.overrides?.bd||{})};
  let route=ep.path;
  // Ô trống → dùng giá trị mặc định của field (thường là {{biến}})
  (ep.pp||[]).forEach(f=>{route=route.replace(':'+f.k,encodeURIComponent(interp(p[f.k]||f.v||'')))});
  const qs=Object.entries(q).filter(([,x])=>x!=null&&x!=='').map(([k2,x])=>encodeURIComponent(k2)+'='+encodeURIComponent(interp(x))).join('&');
  // Base URL có thể bị dán kèm "/api" — bỏ đi để khỏi thành /api/api/...
  const base=state.baseUrl.trim().replace(/\/+$/,'').replace(/\/api$/,'');
  const url=base+route+(qs?'?'+qs:'');

  const mode=o.authOverride||state.mode;
  const wantAuth=mode==='on'?true:mode==='off'?false:ep.auth!=='none';
  const headers={Accept:'application/json'};
  if(wantAuth&&state.token)headers.Authorization='Bearer '+state.token;

  const hasBody=ep.method!=='GET'&&ep.method!=='DELETE';
  if(hasBody)headers['Content-Type']='application/json';

  let payload;
  if(hasBody){
    const out={};
    // duyệt field khai báo trước (để gửi cả giá trị mặc định), rồi tới key người dùng tự thêm
    const keys=[...(ep.bd||[]).map(f=>f.k), ...Object.keys(b).filter(k=>!(ep.bd||[]).some(f=>f.k===k))];
    for(const k2 of keys){
      const f=(ep.bd||[]).find(x=>x.k===k2);
      if(k2.startsWith('(')){                       // trường đặc biệt = toàn bộ body
        const raw=interp(b[k2]??f?.v??'');
        if(raw==='')continue;
        try{const j=JSON.parse(raw); if(Array.isArray(j)||(j!==null&&typeof j!=="object")) payload=j; else Object.assign(out,j)}catch{payload=raw}
        continue;
      }
      const val=parsed(interp(b[k2]??f?.v??''),f?.t||'text');
      if(val===undefined||val==='')continue;
      if(Array.isArray(val)&&!val.length)continue;          // mảng rỗng → không gửi
      if(val&&typeof val==='object'&&!Array.isArray(val)&&!Object.keys(val).length)continue;
      out[k2]=val;
    }
    payload=payload!==undefined?payload:(Object.keys(out).length?out:undefined);
  }

  const t0=performance.now();
  let status=0,text='',err=null;
  try{
    const res=await fetch(url,{method:ep.method,headers,body:hasBody&&payload!==undefined?JSON.stringify(payload):undefined});
    status=res.status;text=await res.text();
  }catch(e){err=e;status=0;text=String(e.message||e)}
  const ms=Math.round(performance.now()-t0);
  let json=null; try{json=JSON.parse(text)}catch{}

  state.resp[ep.id]={url,method:ep.method,status,ms,body:json,raw:text,tab:'pretty',err:!!err,usedAuth:wantAuth};
  if(!o.silent)renderCard(ep.id);

  for(const[src,key]of[[o,'cap'],[o.overrides?.__case,'capture']])
    if(src&&src[key])for(const[k,e]of Object.entries(src[key])){const val=getPath(json,e);if(val!=null&&val!=='')setVar(k,val)}
  return{status,json,ms,text,payload,url,usedAuth:wantAuth};
}

/* ══════════════════ 4. RENDER ══════════════════ */
const ALL=[];
CATALOG.forEach(g=>g.items.forEach(e=>{e.g=g.g;ALL.push(e)}));

function authChip(e){const m={none:['Công khai','no'],any:['Cần token','auth'],student:['Học sinh','role'],teacher:['Giáo viên/Admin','role'],admin:['Chỉ Admin','role']};const[t,c]=m[e.auth]||m.any;return`<span class="chip ${c}">${t}</span>`}
function fieldHtml(f,scope,id,val){
  const a=`id="f_${scope}_${id}_${f.k.replace(/[^\w]/g,'')}"`;
  const req=f.req?'<span class="req">*</span>':'';
  const v=esc(val??f.v??'');
  let inp;
  if(f.t==='select'){const o=(f.options||[]).map(x=>`<option value="${esc(x)}"${String(val??f.v)===String(x)?' selected':''}>${esc(x||'(không gửi)')}</option>`).join('');inp=`<select ${a}>${o}</select>`}
  else if(f.t==='textarea')inp=`<textarea ${a} rows="4">${v}</textarea>`;
  else if(f.t==='bool'){const on=val===true||String(val)==='true'||String(f.v)==='true';inp=`<select ${a}><option value=""${on?'':' selected'}>(không gửi)</option><option value="true"${on?' selected':''}>true</option><option value="false"${on?'':' selected'}>false</option></select>`}
  else{const ty=f.t==='number'?'number':f.t==='password'?'password':f.t==='date'?'datetime-local':'text';inp=`<input type="${ty}" ${a} value="${v}" placeholder="${esc(f.v??'')}" />`}
  return`<div class="field"><label>${esc(f.k)}${req}</label>${inp}${f.d?`<div class="hint">${esc(f.d)}</div>`:''}</div>`;
}
function casesHtml(ep){
  if(!ep.cases?.length)return'';
  const sel=state.caseSel[ep.id]??0;
  return`<div class="sub">Ca test (${ep.cases.length}) — bấm để chọn, "Gửi" sẽ dùng luôn override của ca</div><div class="cases">`+
    ep.cases.map((c,i)=>`<span class="case${i===sel?' sel':''}" data-act="case" data-ep="${ep.id}" data-i="${i}">${esc(c.n)}<span class="exp">${c.expect.map(x=>' '+x).join('')}</span></span>`).join('')+`</div>`;
}
function syntax(v){
  const j=JSON.stringify(v,null,2)||'null';
  return esc(j).replace(/&quot;([^&]*?)&quot;(\s*:)/g,'<span class="k">"$1"</span>$2')
    .replace(/:\s&quot;(.*?)&quot;/g,': <span class="s">"$1"</span>')
    .replace(/:\s(-?\d+\.?\d*)/g,': <span class="n">$1</span>')
    .replace(/:\s(true|false|null)/g,': <span class="b">$1</span>');
}
function respHtml(ep){
  const r=state.resp[ep.id];if(!r)return'';
  const cls=r.status>=500?'s5':r.status>=400?'s4':r.status>=300?'s3':'s2';
  const ci=state.caseSel[ep.id]??0, c=ep.cases?.[ci]||{};
  let warn='';
  if(c.expect?.length&&!c.expect.includes(r.status))warn=`<span class="chip no">mong đợi ${c.expect.join('/')} — nhận ${r.status||'ERR'}</span>`;
  else if(c.expect?.length)warn=`<span class="chip open">đúng ${r.status}</span>`;
  if(c.expectPresent)for(const f of c.expectPresent)if(getPath(r.body,f)===undefined)warn+=`<span class="chip no">thiếu ${f}</span>`;
  if(c.expectAbsent)for(const f of c.expectAbsent)if(getPath(r.body,f)!==undefined)warn+=`<span class="chip no">lộ ${f}</span>`;
  if(c.expectFields?.data)for(const f of c.expectFields.data)if(getPath(r.body,'data.'+f)===undefined)warn+=`<span class="chip no">thiếu data.${f}</span>`;
  const body=r.tab==='raw'?esc(r.raw):(r.body!==null?syntax(r.body):esc(r.raw));
  return`<div class="resp"><div class="resp-h">
    <span class="st ${cls}">${r.status||'ERR'}</span>
    <span class="chip">${r.ms}ms</span>
    <span class="chip">${(r.raw||'').length} B</span>
    <span class="chip">${r.method}</span>
    <span class="chip">token: ${r.usedAuth?'có':'không'}</span>
    ${warn}
    <span class="tabs">
      <span class="tab${r.tab!=='raw'?' sel':''}" data-act="tab" data-ep="${ep.id}" data-tab="pretty">Pretty</span>
      <span class="tab${r.tab==='raw'?' sel':''}" data-act="tab" data-ep="${ep.id}" data-tab="raw">Raw</span>
      <span class="tab" data-act="curl" data-ep="${ep.id}">cURL</span>
      <span class="tab" data-act="copy" data-ep="${ep.id}">Copy JSON</span>
    </span></div>
    <div class="url">${esc(r.method)} ${esc(r.url)}</div><pre>${body}</pre></div>`;
}
function cardInner(ep){
  const v=ensureVals(ep);
  const sel=state.caseSel[ep.id]??0, c=ep.cases?.[sel]||{};
  let h='';
  if(ep.pp?.length)h+=`<div class="sub">Path param</div><div class="grid">${ep.pp.map(f=>fieldHtml(f,'pp',ep.id,v.pp[f.k])).join('')}</div>`;
  if(ep.qp?.length)h+=`<div class="sub">Query param</div><div class="grid">${ep.qp.map(f=>fieldHtml(f,'qp',ep.id,v.qp[f.k])).join('')}</div>`;
  if(ep.bd?.length&&ep.method!=='GET'&&ep.method!=='DELETE')
    h+=`<div class="sub">Body ${c.bd?'<span class="chip">ca test đang ghi đè: '+esc(c.n)+'</span>':''}</div><div class="grid">${ep.bd.map(f=>fieldHtml(f,'bd',ep.id,v.bd[f.k])).join('')}</div>`;
  const note=(c.note||ep.note)?`<div class="hint" style="margin-top:8px">ℹ ${esc(c.note||ep.note)}</div>`:'';
  return`<div class="card-h" data-act="toggle" data-ep="${ep.id}">
      <span class="m m-${ep.method}">${ep.method}</span>
      <span class="path">${esc(ep.path)}</span>
      ${ep.danger?'<span class="chip no">NGUY HIỂM</span>':''}${authChip(ep)}
      <span class="sum">${esc(c.n||ep.sum||'')}</span></div>
    <div class="card-b">${casesHtml(ep)}${note}${h}
      <div class="row" style="margin-top:14px">
        <button class="btn primary" data-act="send" data-ep="${ep.id}">▶ Gửi: ${esc(c.n||'giá trị đang nhập')}</button>
        <button class="btn" data-act="sendplain" data-ep="${ep.id}">Gửi giá trị đang nhập</button>
        <button class="btn ghost" data-act="reset" data-ep="${ep.id}">Xoá ô nhập</button>
      </div>${respHtml(ep)}</div>`;
}
function renderCard(id){const el=$('#card_'+id);if(el){const ep=ALL.find(e=>e.id===id);if(ep)el.innerHTML=cardInner(ep)}}
function renderNav(){
  const q=state.q.trim().toLowerCase();
  const open=new Set(Object.entries(state.open).filter(([,v])=>v).map(([k])=>k));
  let h='';
  CATALOG.forEach((g,gi)=>{
    const items=g.items.filter(e=>!q||e.path.toLowerCase().includes(q)||(e.sum||'').toLowerCase().includes(q)||e.id.toLowerCase().includes(q));
    if(!items.length)return;
    const open_=q?true:LS.get('grp_'+gi,true);
    h+=`<div class="grp${open_?' open':''}"><div class="grp-h" data-act="grp" data-gi="${gi}"><span class="chev">▶</span>${esc(g.g)}<span class="cnt">${items.length}</span></div><div class="grp-b">`+
      items.map(e=>`<a class="nav${open.has(e.id)?' active':''}" href="#${e.id}" data-act="jump" data-ep="${e.id}"><span class="m m-${e.method}">${e.method}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.path.replace('/api',''))}</span></a>`).join('')+`</div></div>`;
  });
  $('#nav').innerHTML=h||'<p style="color:var(--fg3);padding:8px">Không tìm thấy.</p>';
}
function renderMain(){
  const ids=Object.entries(state.open).filter(([,v])=>v).map(([k])=>k);
  $('#main').innerHTML=ids.length?ids.map(id=>{const ep=ALL.find(e=>e.id===id);return ep?`<div class="card${state.open[id]?' open':''}" id="card_${id}">${cardInner(ep)}</div>`:''}).join(''):WELCOME;
}
const WELCOME=`<div style="max-width:780px;margin:36px auto;color:var(--fg2);text-align:center">
<h2 style="color:var(--fg)">API Test Console</h2>
<p>Bấm endpoint ở cột trái để mở form nhập, hoặc ▶ <b>Smoke test</b> để chạy tự động.</p>
<p style="margin-top:16px;text-align:left">Gợi ý trình tự test core flow:</p>
<ol style="line-height:2">
<li><b>Auth</b> → đăng nhập <code>teacher</code> (token tự lưu)</li>
<li><b>Classes → Tạo lớp</b> (tự lưu biến <code>classId</code>, <code>classCode</code>)</li>
<li><b>Templates → Tạo template</b> kèm <code>htmlTemplate</code></li>
<li><b>Games → Tạo game</b> gắn template (tự lưu <code>gameId</code>)</li>
<li><b>Questions → PUT /questions/game/:gameId</b> (lưu <code>questionId</code>)</li>
<li><b>Assignments → Tạo bài</b> gắn game + câu hỏi</li>
<li><b>Game Plays → complete</b> → kiểm tra <code>verified</code>, XP, idempotency</li>
</ol>
<p style="margin-top:16px;font-size:12.5px">Mỗi endpoint có nhiều <b>ca test</b> (200 / 400 / 401 / 403 / 404 / 500) — chọn ca rồi bấm Gửi. Trường hợp nguy hiểm được đánh dấu đỏ.</p></div>`;

function tbl(rows){
  return`<table class="tbl"><thead><tr><th>#</th><th>Method</th><th>Path</th><th>Cần</th><th>Nhận</th><th>ms</th><th>KQ</th><th>Message</th></tr></thead><tbody>`+
    rows.map((r,i)=>{const c=r.pass===null?'skip':r.pass?'pass':'fail';return`<tr><td>${i+1}</td><td><span class="m m-${r.m}">${r.m||'—'}</span></td><td style="font-family:var(--mono);font-size:11px">${esc(r.p)}</td><td style="font-family:var(--mono)">${r.want||''}</td><td style="font-family:var(--mono)" class="${c}">${r.got||'ERR'}</td><td>${r.ms||''}</td><td class="${c}">${r.pass===null?'SKIP':r.pass?'PASS':'FAIL'}</td><td style="color:var(--fg3);font-size:11px">${esc(String(r.msg||'').slice(0,60))}</td></tr>`}).join('')+`</tbody></table>`;
}
async function loginAs(role,pw){
  const ep=ALL.find(e=>e.id==='auth.login');
  const r=await send(ep,{authOverride:'none',silent:true,overrides:{bd:{username:role,password:pw,identifier:undefined}},cap:{}});
  if(r.status===200&&r.json?.token){state.token=r.json.token;state.role=role;save();syncTop();return true}
  toast(`Đăng nhập ${role} thất bại: ${r.json?.msg||r.status}`);return false;
}
async function runList(list,rows,onProg){
  let ok=0,bad=0;
  for(const s of list){
    const ep=ALL.find(e=>e.id===s.e);
    if(!ep){onProg&&onProg();continue}
    if(s.as)await loginAs(s.as);
    const ci=s.c|0, c=ep.cases?.[ci]||{};
    const v=ensureVals(ep);
    if(s.creds){v.bd.username=s.creds[0];v.bd.password=s.creds[1];v.bd.identifier=''}
    const ov={__case:c};
    if(c.bd)ov.bd=c.bd; if(c.pp)ov.pp=c.pp; if(c.qp)ov.qp=c.qp;
    if(s.bd)ov.bd={...(ov.bd||{}),...s.bd}; if(s.pp)ov.pp={...(ov.pp||{}),...s.pp};
    const r=await send(ep,{authOverride:s.auth||c.auth,overrides:ov,silent:true,cap:s.cap});
    let pass=r.status===s.x;
    if(s.absent&&getPath(r.body,s.absent)!==undefined)pass=false;
    if(pass)ok++;else bad++;
    rows.push({n:s.n,m:ep.method,p:ep.path,want:s.x,got:r.status,ms:r.ms,pass,msg:r.json?.msg||r.json?.message||''});
    onProg&&onProg();
  }
  return{ok,bad};
}
async function runSmoke(){
  $('#modal').classList.add('open');$('#mBody').innerHTML='';$('#mProg').style.width='0%';
  $('#mTitle').textContent='Smoke test — kết nối & phân quyền';
  const rows=[];
  const upd=()=>{$('#mBody').innerHTML=tbl(rows);$('#mProg').style.width=Math.min(100,(rows.length/(SMOKE.length+FLOW.length)*100))+'%';$('#mBody').scrollTop=1e9};
  const r1=await runList(SMOKE,rows,upd);
  $('#mBody').innerHTML='<h3 style="margin:16px 0 6px;font-size:14px">Luồng đầy đủ — tạo dữ liệu thật rồi dọn dẹp</h3>'+tbl(rows);
  const r2=await runList(FLOW,rows,upd);
  await loginAs('teacher');
  $('#mTitle').innerHTML=`Smoke test — <span class="pass">${r1.ok+r2.ok} pass</span> · <span class="fail">${r1.bad+r2.bad} fail</span>`;
  upd();
}

/* ══════════════════ 6. SỰ KIỆN ══════════════════ */
function syncTop(){$('#baseUrl').value=state.baseUrl;$('#token').value=state.token;$('#mode').value=state.mode;
  $('#live').classList.toggle('on',!!state.token);$('#varCount').textContent=VAR_ORDER.filter(k=>state.vars[k]).length}
function renderVars(){
  $('#vars').innerHTML=VAR_ORDER.map(k=>`<div class="var"><span class="vk">${k}</span><input id="var_${k}" value="${esc(state.vars[k])}" /></div>`).join('');
  $('#varCount').textContent=VAR_ORDER.filter(k=>state.vars[k]).length;
}
function curlOf(ep){
  const r=state.resp[ep.id];if(!r)return'';
  const h=r.usedAuth&&state.token?['-H',`Authorization: Bearer ${state.token}`]:[];
  const body=r.method!=='GET'&&r.method!=='DELETE'?' -H "Content-Type: application/json"':'';
  return`curl -X ${r.method} '${r.url}' ${h.join(' ')}${body}`;
}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act],[data-login]');
  if(!t)return;
  if(t.dataset.login){
    const role=t.dataset.login, pw=role==='admin'?'admin123':'123456';
    if(await loginAs(role,pw))toast(`Đã đăng nhập: ${role}`);
    return;
  }
  const act=t.dataset.act, id=t.dataset.ep;
  if(act==='grp'){const gi=t.dataset.gi;const k='grp_'+gi;LS.set(k,!LS.get(k,true));renderNav();return}
  if(act==='jump'){
    ev.preventDefault();
    if(!state.open[id]){state.open[id]=true;save()}
    renderNav();renderMain();
    const el=$('#card_'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const ep=ALL.find(e=>e.id===id);if(!ep)return;
  if(act==='toggle'){state.open[id]=!state.open[id];save();renderNav();renderMain();
    if(state.open[id]){const el=$('#card_'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}return}
  if(act==='case'){state.caseSel[id]=+t.dataset.i;save();renderCard(id);return}
  if(act==='reset'){state.vals[id]={pp:{},qp:{},bd:{}};renderCard(id);return}
  if(act==='tab'){const r=state.resp[id];if(r){r.tab=t.dataset.tab;renderCard(id)}return}
  if(act==='curl'){const c=curlOf(ep);if(!c)return toast('Chưa gửi request nào');
    try{await navigator.clipboard.writeText(c);toast('Đã copy cURL')}catch{window.prompt('cURL:',c)}return}
  if(act==='copy'){const r=state.resp[id];if(!r)return toast('Chưa có response');
    try{await navigator.clipboard.writeText(JSON.stringify(r.body,null,2));toast('Đã copy JSON')}catch{toast('Copy thất bại')}return}
  if(act==='send'||act==='sendplain'){
    const ci=act==='send'?(state.caseSel[id]??0):-1;
    const c=ci>=0?(ep.cases?.[ci]||{}):{};
    const ov={__case:c};
    if(c.bd)ov.bd=c.bd;if(c.pp)ov.pp=c.pp;if(c.qp)ov.qp=c.qp;
    const r=await send(ep,{authOverride:act==='send'?c.auth:undefined,overrides:ov});
    if(ci>=0&&c.repeat&&c.repeat>1)for(let i=1;i<c.repeat;i++)await send(ep,{authOverride:c.auth,overrides:ov,silent:true});
    toast(`${ep.method} ${ep.path} → ${r.status||'ERR'} (${r.ms}ms)`);
    return;
  }
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='search'){state.q=el.value;renderNav();return}
  if(el.id==='baseUrl'){state.baseUrl=el.value.trim();save();return}
  if(el.id==='token'){state.token=el.value.trim();state.role='';save();syncTop();return}
  if(el.id.startsWith('var_')){state.vars[el.id.slice(4)]=el.value;save();$('#varCount').textContent=VAR_ORDER.filter(k=>state.vars[k]).length;return}
  const m=el.id.match(/^f_(pp|qp|bd)_([\w]+)_(.+)$/);
  if(m){const ep=ALL.find(e=>e.id===m[2]);if(!ep)return;
    const v=state.vals[m[2]]||(state.vals[m[2]]={pp:{},qp:{},bd:{}});
    v[m[1]][m[3]]=el.value;return}
});
$('#mode').addEventListener('change',e=>{state.mode=e.target.value;save()});

$('#btnVarClose').addEventListener('click',()=>$('#drawer').classList.remove('open'));
$('#btnVarClear').addEventListener('click',()=>{VAR_ORDER.forEach(k=>state.vars[k]='');save();renderVars();toast('Đã xoá biến')});

$('#mClose').addEventListener('click',()=>$('#modal').classList.remove('open'));
$('#btnHealth').addEventListener('click',async()=>{
  const ep=ALL.find(e=>e.id==='health');
  const r=await send(ep,{authOverride:'none'});
  toast(r.status===200?'✅ Server OK':'⚠ '+r.status+' — thử lại sau vài giây (cold start)');
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&ALL.find(e=>e.id===id)){state.open[id]=true;save();renderNav();renderMain();}});

syncTop();renderVars();renderNav();renderMain();
if(location.hash.slice(1)&&ALL.find(e=>e.id===location.hash.slice(1))){state.open[location.hash.slice(1)]=true;save();renderMain()}
</script>
