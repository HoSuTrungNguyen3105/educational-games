<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật 23 tuổi 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1d33;--soft:#8a5a70;--pink:#ff6fa5;--peach:#ffb27a;--lilac:#b69cff;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;overflow-x:hidden;background:radial-gradient(ellipse at 50% 110%,#4a1650 0%,#160a2e 55%,#07030f 100%) fixed;color:#fff}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#page{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;width:100%;background:#fff;color:var(--ink);border-radius:32px;padding:36px 28px 30px;text-align:center;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 20px 80px rgba(255,111,165,.55);opacity:0;transform:scale(.7) translateY(60px);transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.2,1.4,.4,1)}
body.show main{opacity:1;transform:none}
@keyframes fs{to{opacity:1;transform:none}}
@keyframes fso{to{opacity:0;visibility:hidden}}
main{animation:fs .1s 12s forwards}
#ov{animation:fso .1s 12s forwards}
.age{font-family:Pacifico,cursive;font-size:clamp(84px,24vw,128px);line-height:1.1;margin:0;background:linear-gradient(135deg,var(--pink),var(--peach),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent;animation:glow 2.5s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 14px var(--pink))}}
h2{font-family:Pacifico,cursive;font-weight:400;font-size:clamp(26px,7vw,36px);margin:6px 0 4px;color:var(--ink)}
.date{color:var(--soft);margin:0 0 20px}
.frame{width:min(260px,72%);margin:0 auto 18px;padding:10px 10px 34px;background:#fff;border-radius:6px;box-shadow:0 10px 30px rgba(255,111,165,.4);transform:rotate(-3deg)}
.frame img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px}
.cake{font-size:56px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.msg{font-size:17px;line-height:1.75;margin:10px auto 22px;max-width:46ch;min-height:7em;color:var(--ink)}
.btn{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pink),var(--peach));border:0;border-radius:999px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 20px rgba(255,111,165,.4)}
.btn:active{transform:scale(.96)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn:focus-visible,#skip:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
/* intro */
#ov{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:none;transition:opacity 1.2s ease,transform 1.2s ease}
body.show #ov{opacity:0;transform:scale(1.25)}
#count{font-family:Pacifico,cursive;font-size:clamp(120px,40vw,260px);line-height:1;color:#ffd36e;text-shadow:0 0 40px #ff6fa5,0 0 90px #b69cff;min-height:1em}
#count.pop{animation:pop .95s ease-out}
@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(.9);opacity:.15}}
#pre{font-size:18px;opacity:.9;margin:0 0 6px}
#title{display:none;font-weight:900;font-size:clamp(36px,11vw,76px);line-height:1.1;margin:0;text-shadow:0 4px 30px rgba(0,0,0,.7)}
#title.on{display:block}
#title span{display:inline-block;opacity:0;transform:translateY(-90px) scale(2.2) rotate(-20deg);background:linear-gradient(180deg,#fff,#ffc2da,#ff6fa5);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,111,165,.9));animation:drop .7s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes drop{to{opacity:1;transform:none}}
#sub{font-family:Pacifico,cursive;font-size:clamp(26px,8vw,44px);margin:18px 0 0;color:#ffd36e;text-shadow:0 2px 20px rgba(0,0,0,.7);opacity:0;transform:scale(.6);transition:opacity 1s,transform 1s}
#sub.on{opacity:1;transform:none}
#skip{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 16px;cursor:pointer}
body.show #skip{display:none}
.balloon{position:fixed;bottom:-120px;z-index:1;font-size:48px;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-130vh) translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.age,.cake{animation:none}}
</style>
</head>
<body>
<div id="stars"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="page">
<main>
  <p class="age">23</p>
  <h2>Chúc mừng sinh nhật!</h2>
  <p class="date">Ngày 7 tháng 11</p>
  <!-- ĐỔI LINK ẢNH Ở DÒNG DƯỚI: thay chữ trong src="..." bằng link ảnh của bạn -->
  <div class="frame"><img id="photo" src="https://example.com/anh-cua-ban.jpg" alt="Ảnh sinh nhật"></div>
  <div class="cake" aria-hidden="true">🎂</div>
  <p class="msg" id="msg"></p>
  <div class="btns"><button class="btn" id="prev" hidden>⬅ Lời chúc trước</button><button class="btn" id="next">Lời chúc tiếp theo 💌</button></div>
</main>
</div>
<div id="ov">
  <p id="pre">Có một điều bất ngờ dành cho em...</p>
  <div id="count"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
</div>
<button id="skip">Bỏ qua ⏭</button>
<script>
var wishes=[
"Chúc mừng sinh nhật em! Tuổi 23 anh mong em luôn xinh đẹp, tự tin và tỏa sáng theo cách riêng của mình. ✨",
"Anh chúc em tuổi mới thật nhiều sức khỏe, niềm vui và may mắn trong công việc. Mong mọi điều em ước đều từ từ trở thành hiện thực. 🌸",
"Dù em ở đâu hay làm gì, anh luôn mong em hạnh phúc và được yêu thương thật nhiều. Sinh nhật vui vẻ nhé em! 🎉"
];
var wi=0,msg=document.getElementById('msg'),nx=document.getElementById('next'),pv=document.getElementById('prev');
function showWish(){msg.textContent=wishes[wi];pv.hidden=wi===0;nx.hidden=wi===wishes.length-1}
nx.onclick=function(){if(wi<wishes.length-1){wi++;showWish()}};
pv.onclick=function(){if(wi>0){wi--;showWish()}};
showWish();

/* ảnh dự phòng nếu link lỗi */
var photo=document.getElementById('photo');
photo.onerror=function(){photo.onerror=null;photo.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd1e3"/><stop offset="1" stop-color="#d9ccff"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="200" y="215" font-size="110" text-anchor="middle">🌸</text></svg>')};

/* sao */
var st=document.getElementById('stars');
for(var s=0;s<70;s++){var d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*3+'s';d.style.opacity=.4+Math.random()*.6;st.appendChild(d)}

var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,R=[],P=[],F=[],bg=false;
function size(){W=c.width=innerWidth;H=c.height=innerHeight}
size();addEventListener('resize',size);
var cols=['#ff6fa5','#ffb27a','#b69cff','#ffd36e','#7fd8ff','#ffffff'];
function rocket(tx){R.push({x:tx!=null?tx:W*(.1+Math.random()*.8),y:H,ty:H*(.1+Math.random()*.4),vy:-(10+Math.random()*3),c:cols[Math.random()*6|0]})}
function burst(cx,cy,col){var n=100,big=Math.random()<.4;for(var k=0;k<n;k++){var a=k/n*6.283,sp=(big?5:3)+Math.random()*(big?3:2);P.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:70+Math.random()*30,c:Math.random()<.6?col:cols[Math.random()*6|0]})}}
function heart(cx,cy){for(var k=0;k<90;k++){var t=k/90*6.283,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));P.push({x:cx,y:cy,vx:hx*.3,vy:hy*.3,l:90,c:k%2?'#ff6fa5':'#ffb3d1'})}}
function volley(n,gap){for(var k=0;k<n;k++)setTimeout(rocket,k*gap)}
function confettiShower(ms){var end=Date.now()+ms,iv=setInterval(function(){if(Date.now()>end){clearInterval(iv);return}for(var k=0;k<5;k++)F.push({x:Math.random()*W,y:-10,vx:Math.random()*2-1,vy:2+Math.random()*3,w:6+Math.random()*6,h:10+Math.random()*8,r:Math.random()*6,vr:Math.random()*.2-.1,c:cols[Math.random()*6|0]})},40)}
function loop(){
x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,W,H);
x.globalCompositeOperation='lighter';
R=R.filter(function(r){r.y+=r.vy;r.vy*=.985;x.fillStyle=r.c;x.beginPath();x.arc(r.x,r.y,3,0,6.283);x.fill();if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y,r.c);return false}return true});
P=P.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.vy*=.985;p.l--;x.globalAlpha=Math.max(0,Math.min(1,p.l/40));x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.4,0,6.283);x.fill();x.globalAlpha=1;return p.l>0});
x.globalCompositeOperation='source-over';
F=F.filter(function(f){f.x+=f.vx+Math.sin(f.y/30);f.y+=f.vy;f.r+=f.vr;x.save();x.translate(f.x,f.y);x.rotate(f.r);x.fillStyle=f.c;x.fillRect(-f.w/2,-f.h/2,f.w,f.h);x.restore();return f.y<H+20});
requestAnimationFrame(loop)}
loop();

function balloons(){var e=['🎈','🎈','🎀','💖','🎈'];for(var k=0;k<12;k++)setTimeout(function(){var b=document.createElement('div');b.className='balloon';b.textContent=e[Math.random()*5|0];b.style.left=(Math.random()*92)+'%';b.style.setProperty('--dx',(Math.random()*120-60)+'px');b.style.animationDuration=(7+Math.random()*5)+'s';document.body.appendChild(b);setTimeout(function(){b.remove()},13000)},k*500)}

var t=[],done=false;
function later(f,ms){t.push(setTimeout(f,ms))}
function reveal(){if(done)return;done=true;t.forEach(clearTimeout);document.body.classList.add('show');confettiShower(4000);balloons();volley(5,250);
  /* pháo hoa nền, nằm sau tấm thiệp nên không che chữ */
  setInterval(function(){rocket(Math.random()<.5?W*(.05+Math.random()*.2):W*(.75+Math.random()*.2))},2200)}
var count=document.getElementById('count'),pre=document.getElementById('pre'),title=document.getElementById('title'),sub=document.getElementById('sub');
function num(n){count.textContent=n;count.classList.remove('pop');void count.offsetWidth;count.classList.add('pop');rocket(W*(.3+Math.random()*.4))}
later(function(){num(3)},1500);
later(function(){num(2)},2500);
later(function(){num(1)},3500);
later(function(){
  count.style.display='none';pre.style.display='none';
  var s='HAPPY BIRTHDAY',h='';
  for(var k=0;k<s.length;k++){h+=s[k]==' '?'<br>':'<span style="animation-delay:'+(k*.08)+'s">'+s[k]+'</span>'}
  title.innerHTML=h;title.classList.add('on');
  volley(16,160);setTimeout(function(){heart(W/2,H*.3)},900);confettiShower(2500);
},4500);
later(function(){sub.textContent='Chúc mừng tuổi 23 xinh đẹp! 🎂';sub.classList.add('on');heart(W*.25,H*.25);heart(W*.75,H*.25)},6500);
later(reveal,10000);
document.getElementById('skip').onclick=reveal;
if(matchMedia('(prefers-reduced-motion:reduce)').matches)reveal();
</script>
</body>
</html>
