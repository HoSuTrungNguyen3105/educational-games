    height:10px;

    opacity:.85;

    border:2px dashed rgba(29,46,74,0.35);

    content:"";

    z-index:2;
  }
  .ticket-stub::before{ left:-13px; }
  .ticket-stub::after{ right:-13px; }

   MOCK PERSISTENCE (in-memory — artifact-safe, no browser storage APIs)
   ========================================================================= */

const memoryStore = { games: null, questions: null, results: null };

function loadStore(key, fallback) {
  if (!memoryStore[key]) memoryStore[key] = JSON.parse(JSON.stringify(fallback));
  return memoryStore[key];
}
function saveStore(key, data) { memoryStore[key] = data; }

const delay = (ms) => new Promise((res) => setTimeout(res, ms));
const uid = (prefix) => `${prefix}-${Math.random().toString(36).slice(2, 9)}`;

const gameService = {
  async list(filters = {}) {
    await delay(450);
    let games = loadStore("games", initialGames);
    if (filters.query) {
      const q = filters.query.trim().toLowerCase();
      games = games.filter(g => g.title.toLowerCase().includes(q) || g.topic.toLowerCase().includes(q));
    }
    if (filters.status && filters.status !== "all") games = games.filter(g => g.status === filters.status);
    if (filters.subject && filters.subject !== "all") games = games.filter(g => g.subject === filters.subject);
    if (filters.category && filters.category !== "all") {
      games = games.filter(g => {
        const tpl = mockGameTemplates.find(t => t.id === g.template);
        return tpl && tpl.category === filters.category;
      });
    }
    return games.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  },
  async get(id) {
    await delay(300);
    return loadStore("games", initialGames).find(g => g.id === id) || null;
  },
  async getByCode(code) {
    await delay(550);
    const games = loadStore("games", initialGames);
    return games.find(g => g.code.toLowerCase() === code.trim().toLowerCase() && g.status === "published") || null;
  },
  async create(data) {
    await delay(400);
    const games = loadStore("games", initialGames);
    const now = new Date().toISOString();
    const game = { id: uid("game"), status: "draft", playersCount: 0, questionsCount: 0, code: uid("code").slice(0, 8).toUpperCase(), createdAt: now, updatedAt: now, ...data };
    games.push(game);
    saveStore("games", games);
    return game;
  },
  async update(id, data) {
    await delay(400);
    const games = loadStore("games", initialGames);
    const idx = games.findIndex(g => g.id === id);
    if (idx === -1) throw new Error("Không tìm thấy trò chơi");
    games[idx] = { ...games[idx], ...data, updatedAt: new Date().toISOString() };
    saveStore("games", games);
    return games[idx];
  },
  async remove(id) {
    await delay(350);
    let games = loadStore("games", initialGames);
    games = games.filter(g => g.id !== id);
    saveStore("games", games);
    let qs = loadStore("questions", initialQuestions);
    qs = qs.filter(q => q.gameId !== id);
    saveStore("questions", qs);
    return true;
  },
  async duplicate(id) {
    await delay(450);
    const games = loadStore("games", initialGames);
    const src = games.find(g => g.id === id);
    if (!src) throw new Error("Không tìm thấy trò chơi");
    const now = new Date().toISOString();
    const copy = { ...src, id: uid("game"), title: `${src.title} (Bản sao)`, status: "draft", playersCount: 0, code: uid("code").slice(0, 8).toUpperCase(), createdAt: now, updatedAt: now };
    games.push(copy);
    saveStore("games", games);
    const qs = loadStore("questions", initialQuestions).filter(q => q.gameId === id);
    const allQs = loadStore("questions", initialQuestions);
    qs.forEach(q => allQs.push({ ...q, id: uid("question"), gameId: copy.id }));
    saveStore("questions", allQs);
    return copy;
  },
};

const questionService = {
  async listByGame(gameId) {
    await delay(300);
    return loadStore("questions", initialQuestions).filter(q => q.gameId === gameId);
  },
  async save(gameId, questions) {
    await delay(300);
    let all = loadStore("questions", initialQuestions);
    all = all.filter(q => q.gameId !== gameId);
    all = all.concat(questions.map(q => ({ ...q, gameId })));
    saveStore("questions", all);
    const games = loadStore("games", initialGames);
    const idx = games.findIndex(g => g.id === gameId);
    if (idx !== -1) { games[idx].questionsCount = questions.length; saveStore("games", games); }
    return questions;
  },
};

const resultService = {
  async listByGame(gameId) {
    await delay(400);
    return loadStore("results", initialResults).filter(r => r.gameId === gameId).sort((a, b) => b.score - a.score);
  },
  async submit(result) {
    await delay(300);
    const all = loadStore("results", initialResults);
    const entry = { id: uid("result"), ...result };
    all.push(entry);
    saveStore("results", all);
    return entry;
  },
};

function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((message, type = "info") => {
    setToast({ message, type });
    window.clearTimeout(show._t);
    show._t = window.setTimeout(() => setToast(null), 2600);
  }, []);
  return [toast, show];
}

function App() {
  const [role, setRole] = useState(null);
  const [toast, showToast] = useToast();
  if (!role) return <HomeScreen onSelectRole={setRole} />;
  if (role === "teacher") return <TeacherApp onExit={() => setRole(null)} showToast={showToast} toast={toast} />;
  return <StudentApp onExit={() => setRole(null)} showToast={showToast} toast={toast} />;
}

function TeacherApp({ onExit, showToast, toast }) {
  const [screen, setScreen] = useState("dashboard");
  const [activeGameId, setActiveGameId] = useState(null);
  const [refreshFlag, setRefreshFlag] = useState(0);
  const bump = () => setRefreshFlag(f => f + 1);

  const goResults = (id) => { setActiveGameId(id); setScreen("results"); };
  const goEdit = (id) => { setActiveGameId(id); setScreen("create"); };
  const goCreateNew = () => { setActiveGameId(null); setScreen("create"); };

  return (
    <div className="min-h-screen flex flex-col bg-paper">
      <TeacherNav screen={screen} setScreen={setScreen} onExit={onExit} onCreate={goCreateNew} />
      <main className="flex-1 max-w-6xl w-full mx-auto px-5 md:px-8 py-8">
        {screen === "dashboard" && <TeacherDashboard key={refreshFlag} onOpenLibrary={() => setScreen("library")} onCreate={goCreateNew} onEdit={goEdit} onResults={goResults} />}
        {screen === "library" && <GameLibrary key={refreshFlag} onCreate={goCreateNew} onEdit={goEdit} onResults={goResults} showToast={showToast} onChanged={bump} />}
        {screen === "create" && <CreateGameFlow gameId={activeGameId} showToast={showToast} onDone={() => { bump(); setScreen("library"); }} onCancel={() => setScreen("library")} />}
        {screen === "results" && <TeacherResults gameId={activeGameId} onBack={() => setScreen("library")} />}
      </main>
      <Toast toast={toast} />
    </div>
  );
}

function TeacherNav({ screen, setScreen, onExit, onCreate }) {
  const tabs = [{ id: "dashboard", label: "Dashboard" }, { id: "library", label: "Thư viện trò chơi" }];
  return (
    <header className="marquee-panel sticky top-0 z-20">
      <div className="marquee-lights w-full"></div>
      <div className="max-w-6xl mx-auto px-5 md:px-8 py-4 flex items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <span className="text-2xl">🎪</span>
          <span className="font-display text-paper text-lg">Lớp Học Vui</span>
        </div>
        <nav className="hidden sm:flex items-center gap-1 bg-paper/10 rounded-full p-1">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setScreen(t.id)}
              className={`px-4 py-2 rounded-full text-sm font-body transition ${screen === t.id ? "bg-gold text-ink font-semibold" : "text-paper/70 hover:text-paper"}`}>
              {t.label}
            </button>
          ))}
        </nav>
        <div className="flex items-center gap-3">
          <PrimaryButton onClick={onCreate} className="!bg-ticket !text-white !shadow-none px-4 py-2 text-sm">+ Tạo trò chơi</PrimaryButton>
          <button onClick={onExit} className="flex items-center gap-2 text-paper/70 hover:text-paper text-sm">
            <span className="w-8 h-8 rounded-full bg-paper/15 flex items-center justify-center font-display">{mockCurrentUser.name[0]}</span>
            <span className="hidden md:inline">Thoát</span>
          </button>
        </div>
      </div>
    </header>
  );
}

function TeacherDashboard({ onOpenLibrary, onCreate, onEdit, onResults }) {
  const [games, setGames] = useState(null);
  const [error, setError] = useState(null);

  const load = useCallback(() => { setGames(null); setError(null); gameService.list().then(setGames).catch(e => setError(e.message)); }, []);
  useEffect(() => { load(); }, [load]);

  const stats = useMemo(() => {
    if (!games) return null;
    const published = games.filter(g => g.status === "published").length;
    const drafts = games.filter(g => g.status === "draft").length;
    const players = games.reduce((s, g) => s + g.playersCount, 0);
    return { total: games.length, published, drafts, players };
  }, [games]);

  return (
    <div className="space-y-8">
      <div>
        <p className="text-[#8A7C63] text-sm font-mono">Xin chào,</p>
        <h1 className="font-display text-3xl text-ink">{mockCurrentUser.name} 👋</h1>
      </div>

      {error && <ErrorState subtitle="Không thể tải dữ liệu Dashboard." onRetry={load} />}
      {!error && !games && <Loader label="Đang tải dashboard..." />}

      {!error && games && (
        <React.Fragment>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {[
              { label: "Tổng trò chơi", value: stats.total, icon: "🎟️", ring: "#1D2E4A" },
              { label: "Đã xuất bản", value: stats.published, icon: "✅", ring: "#1B998B" },
              { label: "Bản nháp", value: stats.drafts, icon: "✏️", ring: "#F4B942" },
              { label: "Lượt chơi", value: stats.players, icon: "🎮", ring: "#FF6F91" },
            ].map(s => (
              <div key={s.label} className="note-card p-5">
                <StampToken icon={s.icon} ring={s.ring} size={40} fontSize={18} />
                <div className="font-display text-2xl text-ink mt-3">{s.value}</div>
                <div className="text-xs text-[#8A7C63] font-mono uppercase mt-1">{s.label}</div>
              </div>
            ))}
          </div>

          <div>
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-display text-xl text-ink">Trò chơi gần đây</h2>
              <button onClick={onOpenLibrary} className="text-sm text-ticket font-semibold hover:underline">Xem tất cả →</button>
            </div>
            {games.length === 0 ? (
              <EmptyState icon="🎲" title="Chưa có trò chơi nào" subtitle="Tạo trò chơi đầu tiên để bắt đầu ôn tập cùng học sinh."
                action={<PrimaryButton onClick={onCreate} className="mt-2">+ Tạo trò chơi</PrimaryButton>} />
            ) : (
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {games.slice(0, 3).map(g => <GameCard key={g.id} game={g} onEdit={() => onEdit(g.id)} onResults={() => onResults(g.id)} />)}
              </div>
            )}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function GameCard({ game, onEdit, onResults, onDuplicate, onDelete, onShare }) {
  const tpl = mockGameTemplates.find(t => t.id === game.template);
  return (
    <div className="note-card p-5 flex flex-col gap-3 anim-pop hover:-translate-y-0.5 transition shadow-[0_2px_0_rgba(0,0,0,0.06)]">
      <div className="flex items-start justify-between">
        <StampToken icon={tpl ? tpl.icon : "🎲"} ring={tpl ? tpl.ring : "#1D2E4A"} size={44} fontSize={20} />
        <StatusBadge status={game.status} />
      </div>
      <div>
        <h3 className="font-display text-lg text-ink leading-snug clamp-2">{game.title}</h3>
        <p className="text-sm text-[#8A7C63] mt-1 clamp-2">{game.description}</p>
      </div>
      <div className="flex items-center gap-3 text-xs text-[#8A7C63] font-mono flex-wrap">
        <span>{game.subject}</span><span>·</span><span>{tpl ? tpl.categoryLabel : ""}</span><span>·</span><span>{game.questionsCount} câu hỏi</span><span>·</span><span>{game.playersCount} lượt chơi</span>
      </div>
      <hr className="dash-rule my-1" />
      <div className="flex items-center justify-between gap-2">
        <div className="flex gap-2">
          <IconButton title="Chỉnh sửa" onClick={onEdit}>✏️</IconButton>
          {onDuplicate && <IconButton title="Sao chép" onClick={onDuplicate}>📄</IconButton>}
          {onShare && game.status === "published" && <IconButton title="Chia sẻ" onClick={onShare}>🎟️</IconButton>}
          {onDelete && <IconButton title="Xóa" onClick={onDelete}>🗑️</IconButton>}
        </div>
        <button onClick={onResults} className="text-sm font-semibold text-ticket hover:underline">Kết quả →</button>
      </div>

function GameLibrary({ onCreate, onEdit, onResults, showToast, onChanged }) {
  const [query, setQuery] = useState("");
  const [status, setStatus] = useState("all");
  const [subject, setSubject] = useState("all");
  const [category, setCategory] = useState("all");
  const [games, setGames] = useState(null);
  const [error, setError] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [shareGame, setShareGame] = useState(null);

  const load = useCallback(() => {
    setGames(null); setError(null);
    gameService.list({ query, status, subject, category }).then(setGames).catch(e => setError(e.message || "Lỗi tải dữ liệu"));
  }, [query, status, subject, category]);

  useEffect(() => { const t = setTimeout(load, 250); return () => clearTimeout(t); }, [load]);

  const handleDelete = async (id) => { await gameService.remove(id); showToast("Đã xóa trò chơi", "success"); setConfirmDelete(null); onChanged(); load(); };
  const handleDuplicate = async (id) => { await gameService.duplicate(id); showToast("Đã sao chép trò chơi vào Bản nháp", "success"); onChanged(); load(); };

  return (
    <div className="space-y-6">
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <h1 className="font-display text-3xl text-ink">Thư viện trò chơi</h1>
        <PrimaryButton onClick={onCreate}>+ Tạo trò chơi mới</PrimaryButton>
      </div>

      <div className="flex flex-col sm:flex-row gap-3">
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Tìm theo tên hoặc chủ đề..."
          className="flex-1 note-card px-4 py-2.5 text-sm placeholder:text-[#B7A987]" />
        <select value={status} onChange={e => setStatus(e.target.value)} className="note-card px-4 py-2.5 text-sm">
          <option value="all">Tất cả trạng thái</option>
          <option value="published">Đã xuất bản</option>
          <option value="draft">Bản nháp</option>
        </select>
        <select value={subject} onChange={e => setSubject(e.target.value)} className="note-card px-4 py-2.5 text-sm">
          <option value="all">Tất cả môn học</option>
          {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <div className="flex flex-wrap gap-2">
        {CATEGORIES.map(c => (
          <button key={c.id} onClick={() => setCategory(c.id)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-body border transition ${category === c.id ? "bg-ink text-paper border-ink" : "border-ink/15 text-ink/70 hover:border-ink/35"}`}>
            {c.label}
          </button>
        ))}
      </div>

      {error && <ErrorState subtitle="Không thể tải thư viện trò chơi." onRetry={load} />}
      {!error && !games && <Loader label="Đang tìm trò chơi..." />}
      {!error && games && games.length === 0 && (
        <EmptyState icon="🔍" title="Không tìm thấy trò chơi phù hợp" subtitle="Thử đổi từ khóa tìm kiếm hoặc bộ lọc, hoặc tạo một trò chơi mới."
          action={<PrimaryButton onClick={onCreate} className="mt-2">+ Tạo trò chơi</PrimaryButton>} />
      )}
      {!error && games && games.length > 0 && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
          {games.map(g => (
            <GameCard key={g.id} game={g} onEdit={() => onEdit(g.id)} onResults={() => onResults(g.id)}
              onDuplicate={() => handleDuplicate(g.id)} onDelete={() => setConfirmDelete(g)} onShare={() => setShareGame(g)} />
          ))}
        </div>
      )}

      {confirmDelete && (
        <Modal onClose={() => setConfirmDelete(null)}>
          <h3 className="font-display text-xl text-ink mb-2">Xóa "{confirmDelete.title}"?</h3>
          <p className="text-sm text-[#8A7C63] mb-6">Thao tác này không thể hoàn tác. Toàn bộ câu hỏi và kết quả liên quan sẽ bị xóa.</p>
          <div className="flex justify-end gap-3">
            <GhostButton onClick={() => setConfirmDelete(null)}>Hủy</GhostButton>
            <PrimaryButton onClick={() => handleDelete(confirmDelete.id)} className="!bg-ticket">Xóa trò chơi</PrimaryButton>
          </div>
        </Modal>
      )}
      {shareGame && (
        <Modal onClose={() => setShareGame(null)}>
          <h3 className="font-display text-xl text-ink mb-2">Vé mời "{shareGame.title}"</h3>
          <p className="text-sm text-[#8A7C63] mb-4">Học sinh nhập mã vé sau tại màn hình "Tham gia trò chơi":</p>
          <TicketStub icon="🎟️" code={shareGame.code} notchBg="#FFFBF2" />

            <PrimaryButton onClick={() => setShareGame(null)}>Đã hiểu</PrimaryButton>
          </div>

  );

function Modal({ children, onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4 bg-ink/40 backdrop-blur-sm" onClick={onClose}>
      <div className="note-card max-w-md w-full p-6 anim-pop" onClick={e => e.stopPropagation()}>{children}</div>
    </div>
  );
}

/* ---------------------- CREATE / EDIT GAME FLOW ---------------------- */

const STEPS = [
  { id: "template", label: "Chọn mẫu" },
  { id: "info", label: "Nhập thông tin" },
  { id: "questions", label: "Câu hỏi" },
  { id: "customize", label: "Tùy chỉnh" },
  { id: "preview", label: "Xem trước" },
];

function emptyQuestion() {
  return {
    id: uid("question"), content: "",
    options: [{ id: uid("answer"), content: "" }, { id: uid("answer"), content: "" }, { id: uid("answer"), content: "" }],
    correctAnswer: null, timeLimit: 20, points: 100,
  };
}

function CreateGameFlow({ gameId, onDone, onCancel, showToast }) {
  const [loading, setLoading] = useState(!!gameId);
  const [stepIdx, setStepIdx] = useState(0);
  const [form, setForm] = useState({ title: "", description: "", subject: SUBJECTS[0], topic: "", template: null, theme: "gold" });
  const [questions, setQuestions] = useState([]);
  const [savingStatus, setSavingStatus] = useState(null);

  useEffect(() => {
    if (!gameId) return;
    (async () => {
      const g = await gameService.get(gameId);
      if (g) { setForm({ title: g.title, description: g.description, subject: g.subject, topic: g.topic, template: g.template, theme: g.theme || "gold" }); setStepIdx(1); }
      const qs = await questionService.listByGame(gameId);
      setQuestions(qs.length ? qs : [emptyQuestion()]);
      setLoading(false);
    })();
  }, [gameId]);

  useEffect(() => { if (!gameId && questions.length === 0) setQuestions([emptyQuestion()]); }, []);

  const step = STEPS[stepIdx];
  const canNext = useMemo(() => {
    if (step.id === "template") return !!form.template;
    if (step.id === "info") return form.title.trim().length > 2 && form.topic.trim().length > 1;
    if (step.id === "questions") return questions.length > 0 && questions.every(q => q.content.trim() && q.correctAnswer && q.options.every(o => o.content.trim()));
    return true;
  }, [step, form, questions]);

  const persist = async (status) => {
    setSavingStatus(status);
    let id = gameId;
    const payload = { ...form, status, questionsCount: questions.length };
    if (id) await gameService.update(id, payload);
    else { const created = await gameService.create(payload); id = created.id; }
    await questionService.save(id, questions);
    setSavingStatus(null);
    showToast(status === "published" ? "Đã xuất bản trò chơi 🎉" : "Đã lưu bản nháp", "success");
    onDone();
  };

  if (loading) return <Loader label="Đang tải trò chơi..." />;

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between">
        <h1 className="font-display text-3xl text-ink">{gameId ? "Chỉnh sửa trò chơi" : "Tạo trò chơi mới"}</h1>
        <button onClick={onCancel} className="text-sm text-[#8A7C63] hover:text-ink">Hủy ✕</button>
      </div>

      <Stepper steps={STEPS} activeIdx={stepIdx} onJump={(i) => i < stepIdx && setStepIdx(i)} />

      <div className="note-card p-6 md:p-8 min-h-[380px]">
        {step.id === "template" && <StepTemplate form={form} setForm={setForm} />}
        {step.id === "info" && <StepInfo form={form} setForm={setForm} />}
        {step.id === "questions" && <StepQuestions questions={questions} setQuestions={setQuestions} />}
        {step.id === "customize" && <StepCustomize form={form} setForm={setForm} />}
        {step.id === "preview" && <StepPreview form={form} questions={questions} />}
      </div>

      <div className="flex items-center justify-between">
        <GhostButton onClick={() => setStepIdx(i => Math.max(0, i - 1))} disabled={stepIdx === 0}>← Quay lại</GhostButton>
        <div className="flex gap-3">
          {step.id === "preview" ? (
            <React.Fragment>
              <GhostButton onClick={() => persist("draft")} disabled={savingStatus !== null}>{savingStatus === "draft" ? "Đang lưu..." : "Lưu bản nháp"}</GhostButton>
              <PrimaryButton onClick={() => persist("published")} disabled={savingStatus !== null}>{savingStatus === "published" ? "Đang xuất bản..." : "Xuất bản 🚀"}</PrimaryButton>
            </React.Fragment>
          ) : (
            <PrimaryButton onClick={() => setStepIdx(i => Math.min(STEPS.length - 1, i + 1))} disabled={!canNext}>Tiếp tục →</PrimaryButton>
          )}
        </div>
      </div>
    </div>
  );
}

function Stepper({ steps, activeIdx, onJump }) {
  return (
    <div className="flex items-center gap-1 sm:gap-2 overflow-x-auto pb-1">
      {steps.map((s, i) => (
        <React.Fragment key={s.id}>
          <button onClick={() => onJump(i)}
            className={`flex items-center gap-2 px-3 py-2 rounded-full text-xs sm:text-sm whitespace-nowrap font-body transition
              ${i === activeIdx ? "bg-ink text-paper font-semibold" : i < activeIdx ? "bg-teal/15 text-teal" : "bg-ink/5 text-[#8A7C63]"}`}>
            <span className="font-mono">{i + 1}</span>{s.label}
          </button>
          {i < steps.length - 1 && <div className="w-4 sm:w-8 h-px dash-rule flex-shrink-0"></div>}
        </React.Fragment>
      ))}
    </div>
  );
}

function StepTemplate({ form, setForm }) {
  const [filter, setFilter] = useState("all");
  const list = filter === "all" ? mockGameTemplates : mockGameTemplates.filter(t => t.category === filter);
  return (
    <div>
      <h2 className="font-display text-xl text-ink mb-1">Chọn mẫu trò chơi</h2>
      <p className="text-sm text-[#8A7C63] mb-4">Mỗi mẫu mang một cách chơi khác nhau — chọn mẫu phù hợp với nội dung ôn tập của bạn.</p>
      <div className="flex flex-wrap gap-2 mb-6">
        {CATEGORIES.map(c => (
          <button key={c.id} onClick={() => setFilter(c.id)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-body border transition ${filter === c.id ? "bg-ink text-paper border-ink" : "border-ink/15 text-ink/70 hover:border-ink/35"}`}>
            {c.label}
          </button>
        ))}
      </div>
      <div className="grid sm:grid-cols-2 gap-4">
        {list.map(t => (
          <button key={t.id} onClick={() => setForm(f => ({ ...f, template: t.id }))}
            className={`text-left p-5 rounded-2xl border-2 transition flex gap-4 items-start
              ${form.template === t.id ? "border-ticket bg-ticket/5" : "border-ink/10 hover:border-ink/25"}`}>
            <StampToken icon={t.icon} ring={t.ring} size={48} fontSize={22} />
            <div>
              <h3 className="font-display text-base text-ink">{t.name}</h3>
              <p className="text-sm text-[#8A7C63] mt-1">{t.description}</p>
              <span className="inline-block mt-2 text-[10px] font-mono uppercase text-[#B7A987]">{t.categoryLabel}</span>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function Field({ label, children, hint }) {
  return (
    <label className="block mb-5">
      <span className="block text-sm font-semibold text-ink mb-1.5">{label}</span>
      {children}
      {hint && <span className="block text-xs text-[#B7A987] mt-1">{hint}</span>}
    </label>
  );

function StepQuestions({ questions, setQuestions }) {
  const [openIdx, setOpenIdx] = useState(0);
  const update = (idx, patch) => setQuestions(qs => qs.map((q, i) => i === idx ? { ...q, ...patch } : q));
  const updateOption = (idx, optId, content) => setQuestions(qs => qs.map((q, i) => i !== idx ? q : { ...q, options: q.options.map(o => o.id === optId ? { ...o, content } : o) }));
  const addOption = (idx) => setQuestions(qs => qs.map((q, i) => i !== idx ? q : (q.options.length >= 4 ? q : { ...q, options: [...q.options, { id: uid("answer"), content: "" }] })));
  const removeOption = (idx, optId) => setQuestions(qs => qs.map((q, i) => {
    if (i !== idx || q.options.length <= 2) return q;
    const opts = q.options.filter(o => o.id !== optId);
    return { ...q, options: opts, correctAnswer: q.correctAnswer === optId ? null : q.correctAnswer };
  }));
  const addQuestion = () => { setQuestions(qs => [...qs, emptyQuestion()]); setOpenIdx(questions.length); };
  const removeQuestion = (idx) => { setQuestions(qs => qs.filter((_, i) => i !== idx)); setOpenIdx(0); };
  const move = (idx, dir) => setQuestions(qs => {
    const next = [...qs]; const target = idx + dir;
    if (target < 0 || target >= next.length) return qs;
    [next[idx], next[target]] = [next[target], next[idx]];
    return next;
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <h2 className="font-display text-xl text-ink">Quản lý câu hỏi</h2>
        <span className="text-xs font-mono text-[#8A7C63]">{questions.length} câu hỏi</span>
      </div>
      <div className="space-y-3">
        {questions.map((q, idx) => (
          <div key={q.id} className="border border-ink/10 rounded-2xl overflow-hidden">
            <button onClick={() => setOpenIdx(openIdx === idx ? -1 : idx)} className="w-full flex items-center justify-between px-4 py-3 bg-ink/[0.03] text-left">
              <span className="flex items-center gap-3 min-w-0">
                <span className="w-7 h-7 rounded-full bg-ink text-paper text-xs flex items-center justify-center font-mono flex-shrink-0">{idx + 1}</span>
                <span className="font-body text-sm text-ink truncate">{q.content || "Câu hỏi mới — nhấn để chỉnh sửa"}</span>
              </span>
              <span className="text-[#8A7C63] text-xs flex-shrink-0 ml-2">{openIdx === idx ? "▲" : "▼"}</span>
            </button>
            {openIdx === idx && (
              <div className="p-4 sm:p-5 border-t border-ink/10 space-y-4">
                <Field label="Nội dung câu hỏi">
                  <textarea className={inputCls} value={q.content} onChange={e => update(idx, { content: e.target.value })} placeholder="Nhập câu hỏi..." />
                </Field>
                <div>
                  <span className="block text-sm font-semibold text-ink mb-2">Phương án trả lời (chọn ô tròn cho đáp án đúng)</span>
                  <div className="space-y-2">
                    {q.options.map(o => (
                      <div key={o.id} className="flex items-center gap-2">
                        <button onClick={() => update(idx, { correctAnswer: o.id })}
                          className={`w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition ${q.correctAnswer === o.id ? "bg-teal border-teal text-white" : "border-ink/25"}`}>
                          {q.correctAnswer === o.id && "✓"}
                        </button>
                        <input className={inputCls} value={o.content} onChange={e => updateOption(idx, o.id, e.target.value)} placeholder="Nội dung đáp án" />
                        {q.options.length > 2 && <button onClick={() => removeOption(idx, o.id)} className="text-[#B7A987] hover:text-ticket px-1">✕</button>}
                      </div>
                    ))}
                  </div>
                  {q.options.length < 4 && <button onClick={() => addOption(idx)} className="text-sm text-ticket font-semibold mt-2 hover:underline">+ Thêm đáp án</button>}
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <Field label="Thời gian trả lời (giây)">
                    <input type="number" min={5} max={120} className={inputCls} value={q.timeLimit} onChange={e => update(idx, { timeLimit: Number(e.target.value) || 5 })} />
                  </Field>
                  <Field label="Điểm số">
                    <input type="number" min={10} step={10} className={inputCls} value={q.points} onChange={e => update(idx, { points: Number(e.target.value) || 10 })} />
                  </Field>
                </div>
                <div className="flex items-center justify-between pt-1">
                  <div className="flex gap-2">
                    <IconButton title="Di chuyển lên" onClick={() => move(idx, -1)}>↑</IconButton>
                    <IconButton title="Di chuyển xuống" onClick={() => move(idx, 1)}>↓</IconButton>
                  </div>
                  {questions.length > 1 && <button onClick={() => removeQuestion(idx)} className="text-sm text-ticket font-semibold hover:underline">Xóa câu hỏi</button>}
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      <GhostButton onClick={addQuestion} className="mt-4 w-full">+ Thêm câu hỏi</GhostButton>
    </div>
  );
}

  const restart = () => { setScreen("join"); setGame(null); setQuestions([]); setPlayerName(""); setFinalResult(null); setLeaderboard(null); };

  const handleFinish = async (sessionResult) => {
    const entry = await resultService.submit({
      gameId: game.id, playerId: uid("player"), playerName,
      score: sessionResult.score, correctAnswers: sessionResult.correct,
      totalQuestions: questions.length, accuracy: Math.round((sessionResult.correct / questions.length) * 100),
      completionTime: sessionResult.timeUsed,

/* Generic timed-answer hook shared by several play screens */
function useTimedQuestion(questions, onFinish) {
  const [idx, setIdx] = useState(0);
  const q = questions[idx];
  const [timeLeft, setTimeLeft] = useState(q.timeLimit);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const startRef = useRef(Date.now());

  useEffect(() => { setTimeLeft(q.timeLimit); setSelected(null); setRevealed(false); }, [idx]);

  useEffect(() => {
    if (revealed) return;
    if (timeLeft <= 0) { handleAnswer(null); return; }
    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [timeLeft, revealed]);

  function handleAnswer(optionId) {
    if (revealed) return;
    const isCorrect = optionId === q.correctAnswer;
    const earned = isCorrect ? q.points + Math.round((timeLeft / q.timeLimit) * 40) : 0;
    setSelected(optionId);
    setRevealed(true);
    const nextScore = score + earned;
    const nextCorrect = correctCount + (isCorrect ? 1 : 0);
    setScore(nextScore);
    setCorrectCount(nextCorrect);
    setTimeout(() => {
      if (idx + 1 < questions.length) { setIdx(i => i + 1); }
      else {
        const timeUsed = Math.round((Date.now() - startRef.current) / 1000);
        onFinish({ score: nextScore, correct: nextCorrect, timeUsed });
      }
    }, 1300);
    return isCorrect;
  }

  return { idx, q, timeLeft, selected, revealed, score, handleAnswer, total: questions.length };
}

/* ---------------------- WHACK-A-MOLE ---------------------- */

function WhackAMolePlayScreen({ game, questions, onFinish, onQuit }) {
  const { idx, q, timeLeft, selected, revealed, score, handleAnswer, total } = useTimedQuestion(questions, onFinish);
  const pct = (timeLeft / q.timeLimit) * 100;
  const timerColor = pct > 50 ? "#4CAF7D" : pct > 20 ? "#F4B942" : "#E4572E";
  const moleHoles = useMemo(() => Array.from({ length: 6 }, (_, i) => i), []);
  const answerHoles = useMemo(() => {
    const holes = [...moleHoles].sort(() => Math.random() - 0.5).slice(0, q.options.length);
    return q.options.map((o, i) => ({ ...o, hole: holes[i] }));
  }, [q.id]);

  return (
    <div className="flex-1 flex flex-col bg-paper">
      <PlayHeader icon="🔨" title="ĐẬP CHUỘT NHANH TAY" accent="#F4B942" code={game.code}
        progressLabel={`Câu hỏi: ${idx + 1}/${total}`} timeLeft={timeLeft} timeColor={timerColor} score={score} onQuit={onQuit} />
      <div className="flex-1 flex flex-col items-center justify-center p-5 md:p-8">
        <div className="note-card p-5 max-w-xl w-full mb-6 text-center">
          <span className="text-xs font-mono text-[#8A7C63] uppercase">Đập vào con chuột có đáp án đúng!</span>
          <h2 className="font-display text-xl sm:text-2xl text-ink mt-2">{q.content}</h2>
        </div>
        <div className="grid grid-cols-3 gap-4 sm:gap-6 max-w-xl w-full">
          {moleHoles.map(hole => {
            const opt = answerHoles.find(a => a.hole === hole);
            let stateCls = "";
            if (revealed && opt) {
              stateCls = opt.id === q.correctAnswer ? "ring-4 ring-teal scale-105" : opt.id === selected ? "ring-4 ring-ticket opacity-60" : "opacity-40";

function MemoryMatchPlayScreen({ game, questions, onFinish, onQuit }) {
  const { idx, q, timeLeft, selected, revealed, score, handleAnswer, total } = useTimedQuestion(questions, onFinish);

  return (
    <div className="flex-1 flex flex-col bg-paper">

          <>
          <p className={`text-center mt-6 font-display text-lg ${selected === q.correctAnswer ? "text-teal" : "text-ticket"}`}>
            {selected === q.correctAnswer ? "Lật đúng thẻ rồi! 🃏" : selected === null ? "Hết giờ! ⏰" : "Chưa đúng, thử câu sau nhé!"}
          </p>
          <AnswerExplain q={q} />
          </>
        )}
      </div>
    </div>
  );
}

/* ---------------------- DUNGEON QUEST (RPG battle-style) ---------------------- */

const DUNGEON_MONSTERS = ["🐉", "👹", "🧟", "🦂", "🦇", "🐍", "👻", "🕷️"];

function DungeonQuestPlayScreen({ game, questions, onFinish, onQuit }) {
  const [idx, setIdx] = useState(0);
  const q = questions[idx];
  const [timeLeft, setTimeLeft] = useState(q.timeLimit);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const [heroHp, setHeroHp] = useState(100);
  const [monsterHp, setMonsterHp] = useState(100);
  const [flash, setFlash] = useState(null); // "hero" | "monster" | null
  const startRef = useRef(Date.now());
  const monster = DUNGEON_MONSTERS[idx % DUNGEON_MONSTERS.length];

  useEffect(() => { setTimeLeft(q.timeLimit); setSelected(null); setRevealed(false); setMonsterHp(100); }, [idx]);

  useEffect(() => {
    if (revealed) return;
    if (timeLeft <= 0) { handleAnswer(null); return; }
    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [timeLeft, revealed]);

  function handleAnswer(optionId) {
    if (revealed) return;
    const isCorrect = optionId === q.correctAnswer;
    const earned = isCorrect ? q.points + Math.round((timeLeft / q.timeLimit) * 40) : 0;
    setSelected(optionId);
    setRevealed(true);
    if (isCorrect) { setMonsterHp(0); setFlash("monster"); }
    else { setHeroHp(h => Math.max(0, h - 20)); setFlash("hero"); }
    setTimeout(() => setFlash(null), 400);

    const nextScore = score + earned;
    const nextCorrect = correctCount + (isCorrect ? 1 : 0);
    setScore(nextScore);
    setCorrectCount(nextCorrect);

    setTimeout(() => {
      if (idx + 1 < questions.length) { setIdx(i => i + 1); }
      else {
        const timeUsed = Math.round((Date.now() - startRef.current) / 1000);
        onFinish({ score: nextScore, correct: nextCorrect, timeUsed });
      }
    }, 1400);
  }

  const pct = (timeLeft / q.timeLimit) * 100;
  const timerColor = pct > 50 ? "#4CAF7D" : pct > 20 ? "#F4B942" : "#E4572E";

  return (
    <div className="flex-1 flex flex-col" style={{ background: "radial-gradient(120% 140% at 50% 0%, #2E1F4A 0%, #170F28 60%)" }}>
      <PlayHeader icon="🗡️" title="HẦM NGỤC BÍ ẨN" accent="#B58AFF" code={game.code}
        progressLabel={`Chặng: ${idx + 1}/${questions.length}`} timeLeft={timeLeft} timeColor={timerColor} score={score} onQuit={onQuit} />
      <div className="flex-1 flex flex-col items-center p-5 md:p-8 gap-6">
        <div className={`w-full max-w-2xl flex items-center justify-between gap-4 ${flash === "hero" ? "shake-hit" : ""}`}>
          <div className="flex-1 note-card p-4">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-2xl">🛡️</span>
              <span className="font-display text-sm text-ink">Anh hùng</span>
            </div>
            <div className="w-full h-3 bg-ink/10 rounded-full overflow-hidden">
              <div className="h-full bg-teal transition-all duration-500" style={{ width: `${heroHp}%` }}></div>
            </div>
          </div>
          <span className="text-3xl text-white/60">⚔️</span>
          <div className={`flex-1 note-card p-4 ${flash === "monster" ? "shake-hit" : ""}`}>
            <div className="flex items-center gap-2 mb-2 justify-end">
              <span className="font-display text-sm text-ink">Quái vật</span>
              <span className="text-2xl">{monster}</span>
            </div>
            <div className="w-full h-3 bg-ink/10 rounded-full overflow-hidden">
              <div className="h-full bg-ticket transition-all duration-500 ml-auto" style={{ width: `${monsterHp}%` }}></div>
            </div>
          </div>
        </div>

        <div className="text-7xl anim-pop" key={idx}>{monster}</div>

        <div className="note-card p-6 max-w-lg w-full">
          <span className="text-xs font-mono text-[#8A7C63] uppercase">Trả lời đúng để tung đòn chí mạng</span>
          <p className="font-display text-lg sm:text-xl text-ink mt-2 mb-6">{q.content}</p>
          <div className="grid gap-3">
            {q.options.map((o, i) => {
              let stateCls = "border-ink/12 hover:border-[#8B6FF1]/50";
              if (revealed) {
                if (o.id === q.correctAnswer) stateCls = "border-teal bg-teal/10";
                else if (o.id === selected) stateCls = "border-ticket bg-ticket/10";
                else stateCls = "border-ink/10 opacity-50";
              } else if (o.id === selected) stateCls = "border-ticket bg-ticket/5";
              return (
                <button key={o.id} disabled={revealed} onClick={() => handleAnswer(o.id)}
                  className={`w-full text-left flex items-center gap-3 px-5 py-3.5 rounded-2xl border-2 transition font-body ${stateCls}`}>
                  <span className="w-8 h-8 rounded-full border-2 border-current flex items-center justify-center text-xs font-mono flex-shrink-0">{String.fromCharCode(65 + i)}</span>
                  <span className="flex-1">{o.content}</span>
                  {revealed && o.id === q.correctAnswer && <span>⚔️</span>}
                </button>
              );
            })}
          </div>
          {revealed && (
            <>
            <p className={`text-center mt-4 font-display ${selected === q.correctAnswer ? "text-teal" : "text-ticket"}`}>
              {selected === q.correctAnswer ? "Hạ gục quái vật! 🎉" : "Quái vật phản đòn, mất máu rồi!"}
            </p>
            <AnswerExplain q={q} />
            </>
          )}
        </div>
      </div>
    </div>
  );
}

                  <span className="w-8 h-8 rounded-full border-2 border-current flex items-center justify-center text-xs font-mono flex-shrink-0">{String.fromCharCode(65 + i)}</span>
                  <span className="flex-1">{o.content}</span>
                  {revealed && o.id === q.correctAnswer && <span>🥷</span>}
                </button>
              );
            })}
          </div>
          {revealed && (
            <>
            <p className={`text-center mt-4 font-display ${selected === q.correctAnswer ? "text-teal" : "text-ticket"}`}>
              {selected === q.correctAnswer ? "Bật nhảy qua chướng ngại vật! 🥷" : selected === null ? "Hết giờ, va phải chướng ngại vật! ⏰" : "Va phải chướng ngại vật rồi!"}
            </p>
            <AnswerExplain q={q} />
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------- LUCKY WHEEL ---------------------- */

const WHEEL_COLORS = ["#E4572E", "#F4B942", "#1B998B", "#FF6F91", "#4C8DFF", "#8B6FF1", "#4CAF7D", "#FF9F5A", "#31B0C9", "#D96CD9"];

function LuckyWheelPlayScreen({ game, questions, playerName, onFinish, onQuit }) {
  const [rotation, setRotation] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [answeredIds, setAnsweredIds] = useState([]);
  const [currentQuestion, setCurrentQuestion] = useState(null);
  const [gamePhase, setGamePhase] = useState("wheel"); // wheel | question
  const [timeLeft, setTimeLeft] = useState(0);
  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const startTimeRef = useRef(Date.now());

  const segmentCount = questions.length;
  const segmentAngle = 360 / segmentCount;

  const wheelNames = useMemo(() => {
    const pool = mockPlayersPool.map(p => p.name);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return Array.from({ length: segmentCount }, (_, i) => shortName(pool[i % pool.length]));
  }, [segmentCount]);

  const segments = useMemo(
    () => questions.map((q, i) => ({ ...q, name: wheelNames[i % wheelNames.length], color: WHEEL_COLORS[i % WHEEL_COLORS.length] })),
    [questions, wheelNames]
  );

  const allDone = answeredIds.length >= segmentCount;

  const spinWheel = () => {
    if (spinning || allDone) return;
    setSpinning(true);

    const availableIdx = segments.map((_, i) => i).filter(i => !answeredIds.includes(segments[i].id));
    const winIdx = availableIdx[Math.floor(Math.random() * availableIdx.length)];

    // Segment i occupies [i*segmentAngle, (i+1)*segmentAngle) measured clockwise from the
    // top of the wheel (the pointer sits fixed at the top). Its center is winCenter.
    const winCenter = winIdx * segmentAngle + segmentAngle / 2;
    // After rotating the wheel by R degrees clockwise, the point that lands under the
    // fixed top pointer is the one whose original angle satisfies angle + R ≡ 0 (mod 360).
    // So we need R ≡ (360 - winCenter) (mod 360).
    const targetMod = (360 - winCenter + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    let delta = targetMod - currentMod;
    if (delta <= 0) delta += 360;
    const extraSpins = 5 + Math.floor(Math.random() * 2); // 5-6 full laps for drama
    const newRotation = rotation + extraSpins * 360 + delta;

    setRotation(newRotation);

    setTimeout(() => {
      setSpinning(false);
      const winner = segments[winIdx];
      setCurrentQuestion(winner);
      setGamePhase("question");
      setTimeLeft(winner.timeLimit);
      setSelectedAnswer(null);
      setRevealed(false);
    }, 4200);
  };

  useEffect(() => {
    if (gamePhase !== "question" || !currentQuestion || revealed) return;
    if (timeLeft <= 0) { handleAnswer(null); return; }
    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [timeLeft, gamePhase, currentQuestion, revealed]);

  function handleAnswer(optionId) {
    if (revealed || !currentQuestion) return;
    setSelectedAnswer(optionId);
    setRevealed(true);

    const isCorrect = optionId === currentQuestion.correctAnswer;
    const earned = isCorrect ? currentQuestion.points + Math.round((timeLeft / currentQuestion.timeLimit) * 40) : 0;
    const nextScore = score + earned;
    const nextCorrect = correctCount + (isCorrect ? 1 : 0);
    const nextAnswered = [...answeredIds, currentQuestion.id];

    setScore(nextScore);
    setCorrectCount(nextCorrect);
    setAnsweredIds(nextAnswered);

    setTimeout(() => {
      if (nextAnswered.length >= segmentCount) {
        onFinish({ score: nextScore, correct: nextCorrect, timeUsed: Math.round((Date.now() - startTimeRef.current) / 1000) });
      } else {
        setGamePhase("wheel");
        setCurrentQuestion(null);
      }
    }, 1900);
  }

  /* ---- wheel rendering ---- */
  const size = 320;
  const center = size / 2;
  const radius = size / 2 - 8;

  function polar(angleDeg, r) {
    // angleDeg measured clockwise from the top (12 o'clock); convert to SVG coords.
    const rad = ((angleDeg - 90) * Math.PI) / 180;
    return { x: center + r * Math.cos(rad), y: center + r * Math.sin(rad) };
  }

  return (
    <div className="flex-1 flex flex-col" style={{ background: "radial-gradient(120% 140% at 50% 0%, #2A1F52 0%, #17102F 55%, #120C24 100%)" }}>
      <PlayHeader icon="🎡" title="VÒNG QUAY MAY MẮN" accent="#F4B942" code={game.code}
        progressLabel={`Đã quay: ${answeredIds.length}/${segmentCount}`} score={score} onQuit={onQuit} />

      <div className="flex-1 flex flex-col items-center justify-center p-5 md:p-8 gap-6">
        {gamePhase === "wheel" && (
          <div className="flex flex-col items-center anim-pop">
            <div className="relative" style={{ width: size, height: size + 26 }}>
              {/* marquee glow ring */}
              <div className="absolute inset-0 rounded-full" style={{
                boxShadow: "0 0 0 10px rgba(244,185,66,0.10), 0 0 60px rgba(244,185,66,0.25)",
              }}></div>

              {/* bulbs around the rim */}
              <svg className="absolute inset-0" width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                {Array.from({ length: 24 }, (_, i) => {
                  const p = polar((i * 360) / 24, radius + 8);
                  return <circle key={i} cx={p.x} cy={p.y} r={3.4} fill="#F4B942" opacity={spinning ? (i % 2 === 0 ? 1 : 0.35) : 0.75} />;
                })}
              </svg>

              {/* fixed pointer at the top, aligned with angle 0 */}
              <div className="absolute left-1/2 -translate-x-1/2 z-20" style={{ top: -4 }}>
                <svg width="36" height="40" viewBox="0 0 36 40">
                  <polygon points="18,36 4,6 32,6" fill="#E4572E" stroke="#FFFBF2" strokeWidth="3" strokeLinejoin="round" />
                  <circle cx="18" cy="6" r="6" fill="#FFFBF2" stroke="#E4572E" strokeWidth="2" />
                </svg>
              </div>

              {/* rotating wheel */}
              <svg
                width={size} height={size} viewBox={`0 0 ${size} ${size}`}
                className="absolute left-0"
                style={{
                  top: 26,
                  transition: spinning ? "transform 4.2s cubic-bezier(0.12,0.67,0.1,1)" : "none",
                  transform: `rotate(${rotation}deg)`,
                }}
              >
                <circle cx={center} cy={center} r={radius + 6} fill="#FFFBF2" stroke="#1D2E4A" strokeWidth="3" />
                {segments.map((segment, i) => {
                  const startAngle = i * segmentAngle;
                  const endAngle = (i + 1) * segmentAngle;
                  const p1 = polar(startAngle, radius);
                  const p2 = polar(endAngle, radius);
                  const largeArc = endAngle - startAngle <= 180 ? "0" : "1";
                  const labelPos = polar(startAngle + segmentAngle / 2, radius * 0.66);
                  const isDone = answeredIds.includes(segment.id);
                  return (
                    <g key={segment.id}>
                      <path
                        d={`M ${center} ${center} L ${p1.x} ${p1.y} A ${radius} ${radius} 0 ${largeArc} 1 ${p2.x} ${p2.y} Z`}
                        fill={segment.color}
                        stroke="#FFFBF2"
                        strokeWidth="3"
                        opacity={isDone ? 0.28 : 1}
                      />
                      <text
                        x={labelPos.x} y={labelPos.y}
                        fill="#fff" fontSize="20" fontWeight="700" fontFamily="Fredoka, sans-serif"
                        textAnchor="middle" dominantBaseline="middle"
                        transform={`rotate(${startAngle + segmentAngle / 2}, ${labelPos.x}, ${labelPos.y})`}
                        opacity={isDone ? 0.5 : 1}
                      >
                        {isDone ? "✓" : segment.name}
                      </text>
                    </g>
                  );
                })}
                <circle cx={center} cy={center} r={radius * 0.22} fill="#1D2E4A" stroke="#F4B942" strokeWidth="4" />
                <text x={center} y={center + 1} fill="#F4B942" fontSize="15" fontWeight="700" fontFamily="Fredoka, sans-serif" textAnchor="middle" dominantBaseline="middle">
                  QUAY
                </text>
              </svg>
            </div>

            <button
              onClick={spinWheel}
              disabled={spinning || allDone}
              className="mt-6 font-display font-semibold text-lg px-10 py-4 rounded-full bg-gradient-to-b from-gold to-[#E4572E] text-white shadow-[0_5px_0_rgba(0,0,0,0.35)] active:translate-y-1 active:shadow-[0_2px_0_rgba(0,0,0,0.35)] transition disabled:opacity-50 disabled:active:translate-y-0"
            >
              {spinning ? "ĐANG QUAY... 🎡" : allDone ? "HOÀN THÀNH! 🎉" : "QUAY NGAY! 🎯"}
            </button>
            <p className="mt-3 text-sm text-paper/70 font-mono">
              Đã trả lời {answeredIds.length}/{segmentCount} câu · ⭐ {score} điểm
            </p>
          </div>
        )}

        {gamePhase === "question" && currentQuestion && (
          <div className="w-full max-w-lg anim-pop">
            <div className="note-card p-6 sm:p-7 relative overflow-hidden">
              <div className="absolute -right-6 -top-6 text-7xl opacity-10 rotate-12 select-none">🎡</div>
              <div className="flex justify-between items-center mb-4">
                <span className="inline-flex items-center gap-1.5 bg-gold/20 text-[#8a6a10] font-mono text-xs uppercase px-3 py-1 rounded-full">
                  🎟️ {currentQuestion.name}
                </span>
                <span className={`font-mono text-sm font-semibold ${timeLeft <= 5 ? "text-ticket" : "text-ink/70"}`}>⏱ {timeLeft}s</span>
              </div>
              <h2 className="font-display text-xl sm:text-2xl text-ink mb-6 leading-snug">{currentQuestion.content}</h2>
              <div className="space-y-3">
                {currentQuestion.options.map((option, i) => {
                  let stateCls = "border-ink/12 hover:border-ticket/50";
                  if (revealed) {
                    if (option.id === currentQuestion.correctAnswer) stateCls = "border-teal bg-teal/10";
                    else if (option.id === selectedAnswer) stateCls = "border-ticket bg-ticket/10";
                    else stateCls = "border-ink/10 opacity-50";
                  } else if (option.id === selectedAnswer) stateCls = "border-ticket bg-ticket/10";
                  return (
                    <button key={option.id} disabled={revealed} onClick={() => handleAnswer(option.id)}
                      className={`w-full text-left flex items-center gap-3 px-5 py-3.5 rounded-2xl border-2 transition font-body ${stateCls}`}>
                      <span className="w-8 h-8 rounded-full border-2 border-current flex items-center justify-center text-xs font-mono font-semibold flex-shrink-0">
                        {String.fromCharCode(65 + i)}
                      </span>
                      <span className="flex-1">{option.content}</span>
                      {revealed && option.id === currentQuestion.correctAnswer && <span>✅</span>}
                      {revealed && option.id === selectedAnswer && option.id !== currentQuestion.correctAnswer && <span>❌</span>}
                    </button>
                  );
                })}
              </div>
              {revealed && (
                <>
                <p className={`text-center mt-5 font-display text-lg ${selectedAnswer === currentQuestion.correctAnswer ? "text-teal" : "text-ticket"}`}>
                  {selectedAnswer === currentQuestion.correctAnswer
                    ? `Chính xác! +${currentQuestion.points + Math.round((timeLeft / currentQuestion.timeLimit) * 40)} điểm 🎉`
                    : selectedAnswer === null ? "Hết giờ rồi! ⏰" : "Chưa đúng, quay tiếp nhé!"}
                </p>
                <AnswerExplain q={currentQuestion} />
                </>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function PlayGameScreen({ game, questions, onFinish }) {
  const [idx, setIdx] = useState(0);
  const q = questions[idx];
  const [timeLeft, setTimeLeft] = useState(q.timeLimit);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const startRef = useRef(Date.now());
  const tpl = mockGameTemplates.find(t => t.id === game.template);

  useEffect(() => { setTimeLeft(q.timeLimit); setSelected(null); setRevealed(false); }, [idx]);

  useEffect(() => {
    if (revealed) return;
    if (timeLeft <= 0) { handleAnswer(null); return; }
    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [timeLeft, revealed]);

  function handleAnswer(optionId) {
    if (revealed) return;
    const isCorrect = optionId === q.correctAnswer;
    setSelected(optionId);
    setRevealed(true);
    if (isCorrect) {
      const bonus = Math.round((timeLeft / q.timeLimit) * 40);
      setScore(s => s + q.points + bonus);
      setCorrectCount(c => c + 1);
    }
    setTimeout(() => {
      if (idx + 1 < questions.length) { setIdx(i => i + 1); }
      else {
        const timeUsed = Math.round((Date.now() - startRef.current) / 1000);
        onFinish({ score: score + (isCorrect ? q.points + Math.round((timeLeft / q.timeLimit) * 40) : 0), correct: correctCount + (isCorrect ? 1 : 0), timeUsed });
      }
    }, 1300);
  }

  const pct = (timeLeft / q.timeLimit) * 100;
  const progressColor = pct > 50 ? "#1B998B" : pct > 20 ? "#F4B942" : "#E4572E";

  return (
    <div className="flex-1 flex flex-col px-5 md:px-8 py-6 max-w-2xl mx-auto w-full">
      <div className="flex items-center justify-between mb-6">
        <span className="font-mono text-xs text-[#8A7C63]">Câu {idx + 1}/{questions.length}</span>
        <span className="flex items-center gap-2">
          <StampToken icon={tpl ? tpl.icon : "🎲"} ring={tpl ? tpl.ring : "#F4B942"} size={30} fontSize={14} />
          <span className="font-display text-ink">{score} điểm</span>
        </span>
      </div>

      <div className="w-full h-2 bg-ink/10 rounded-full mb-2 overflow-hidden">
        <div className="h-full rounded-full transition-all duration-1000 ease-linear" style={{ width: `${pct}%`, background: progressColor }}></div>
      </div>
      <div className="text-right text-xs font-mono text-[#8A7C63] mb-6">⏱ {timeLeft}s</div>

      <div key={q.id} className="note-card p-6 sm:p-8 flex-1 flex flex-col anim-pop">
        <h2 className="font-display text-xl sm:text-2xl text-ink mb-8 text-center">{q.content}</h2>
        <div className="grid gap-3 mt-auto">
          {q.options.map((o, i) => {
            let stateCls = "border-ink/12 hover:border-ticket/50";
            if (revealed) {
              if (o.id === q.correctAnswer) stateCls = "border-teal bg-teal/10";
              else if (o.id === selected) stateCls = "border-ticket bg-ticket/10";
              else stateCls = "border-ink/10 opacity-50";
            } else if (o.id === selected) stateCls = "border-ticket bg-ticket/10";
            return (
              <button key={o.id} disabled={revealed} onClick={() => handleAnswer(o.id)}
                className={`text-left px-5 py-4 rounded-2xl border-2 transition font-body text-base flex items-center gap-3 ${stateCls}`}>
                <span className="w-7 h-7 rounded-full border-2 border-current flex items-center justify-center text-xs font-mono flex-shrink-0">{String.fromCharCode(65 + i)}</span>
                <span className="flex-1">{o.content}</span>
                {revealed && o.id === q.correctAnswer && <span>✅</span>}
                {revealed && o.id === selected && o.id !== q.correctAnswer && <span>❌</span>}
              </button>
            );
          })}
        </div>
        {revealed && (
          <>
          <p className={`text-center mt-5 font-display text-lg ${selected === q.correctAnswer ? "text-teal" : "text-ticket"}`}>
            {selected === q.correctAnswer ? "Chính xác! 🎉" : selected === null ? "Hết giờ! ⏰" : "Chưa đúng rồi 😅"}
          </p>
          <AnswerExplain q={q} />
          </>
        )}
      </div>
    </div>
  );
}

/* ---------------------- SNAIL RACE — TEMPLATE-SPECIFIC PLAY SCREEN ---------------------- */

const SNAIL_LANE_COLORS = ["#FF6F91", "#4C8DFF", "#F4B942", "#4CAF7D", "#8B6FF1"];

function shortName(full) {
  const parts = full.trim().split(/\s+/);
  return parts.length > 1 ? parts.slice(-2).join(" ") : full;
}

function SnailIcon({ color = "#FF6F91", size = 46 }) {
  return (
    <svg width={size} height={size * 0.78} viewBox="0 0 64 50" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="30" cy="44" rx="22" ry="4" fill="rgba(29,46,74,0.10)" />
      <path d="M10 36 Q5 28 14 24 Q9 17 16 13 Q23 7 30 13 Q34 7 41 12" stroke={color} strokeWidth="6" fill="none" strokeLinecap="round" />
      <circle cx="22" cy="21" r="15" fill={color} />
      <circle cx="22" cy="21" r="10" fill="rgba(255,255,255,0.32)" />
      <circle cx="22" cy="21" r="5" fill="rgba(255,255,255,0.45)" />
      <line x1="41" y1="12" x2="46" y2="2" stroke={color} strokeWidth="3" strokeLinecap="round" />
      <line x1="34" y1="14" x2="37" y2="5" stroke={color} strokeWidth="3" strokeLinecap="round" />
      <circle cx="46" cy="2" r="3.2" fill="white" stroke={color} strokeWidth="1.5" />
      <circle cx="37" cy="5" r="3.2" fill="white" stroke={color} strokeWidth="1.5" />
      <circle cx="47" cy="1.4" r="1.1" fill={color} />
      <circle cx="38" cy="4.4" r="1.1" fill={color} />
    </svg>
  );
}

function SnailRacePlayScreen({ game, questions, playerName, onFinish, onQuit }) {
  const [idx, setIdx] = useState(0);
  const q = questions[idx];
  const [timeLeft, setTimeLeft] = useState(q.timeLimit);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [muted, setMuted] = useState(false);
  const startRef = useRef(Date.now());

  const opponentNames = mockPlayersPool.slice(0, 4).map(p => shortName(p.name));
  const racers = useMemo(() => ["Bạn", ...opponentNames].map((name, i) => ({ name, color: SNAIL_LANE_COLORS[i] })), []);
  const [scores, setScores] = useState(() => racers.map(() => 0));
  const [myScore, setMyScore] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const totalPoints = useMemo(() => questions.reduce((s, qq) => s + qq.points, 0), [questions]);

  useEffect(() => { setTimeLeft(q.timeLimit); setSelected(null); setRevealed(false); }, [idx]);

  useEffect(() => {
    if (revealed) return;
    if (timeLeft <= 0) { handleAnswer(null); return; }
    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [timeLeft, revealed]);

  function handleAnswer(optionId) {
    if (revealed) return;
    const isCorrect = optionId === q.correctAnswer;
    const earned = isCorrect ? q.points + Math.round((timeLeft / q.timeLimit) * 40) : 0;
    setSelected(optionId);
    setRevealed(true);

    const nextScores = scores.map((s, i) => {
      if (i === 0) return s + earned;
      return Math.random() > 0.35 ? s + Math.round(q.points * (0.5 + Math.random() * 0.6)) : s;
    });
    setScores(nextScores);
    const nextMyScore = myScore + earned;
    const nextCorrect = correctCount + (isCorrect ? 1 : 0);
    setMyScore(nextMyScore);
    setCorrectCount(nextCorrect);

    setTimeout(() => {
      if (idx + 1 < questions.length) { setIdx(i => i + 1); }
      else {
        const timeUsed = Math.round((Date.now() - startRef.current) / 1000);
        onFinish({ score: nextMyScore, correct: nextCorrect, timeUsed });
      }
    }, 1300);
  }

  const pct = (timeLeft / q.timeLimit) * 100;
  const timerColor = pct > 50 ? "#4CAF7D" : pct > 20 ? "#F4B942" : "#E4572E";

  return (
    <div className="flex-1 flex flex-col bg-paper">
      <div className="flex items-center justify-between gap-4 px-5 md:px-8 py-3 bg-white border-b border-ink/10 flex-wrap">
        <div className="flex items-center gap-3">
          <span className="text-3xl">🐌</span>
          <h1 className="font-display text-xl">
            <span className="text-teal">ĐƯỜNG ĐUA</span> <span className="text-ticket">ỐC SÊN</span>
          </h1>
        </div>
        <div className="flex items-center gap-5 text-sm text-ink/70 font-body flex-wrap">
          <span>Phòng: <b className="text-ink font-mono">{game.code}</b></span>
          <span className="hidden sm:inline">·</span>
          <span>📋 Câu hỏi: {idx + 1}/{questions.length}</span>
          <span className="hidden sm:inline">·</span>
          <span style={{ color: timerColor }}>⏱ Thời gian: {timeLeft}s</span>
          <span className="hidden sm:inline">·</span>
          <span>⭐ Điểm: {myScore}</span>
        </div>
        <div className="flex items-center gap-2">
          <IconButton title={muted ? "Bật âm thanh" : "Tắt âm thanh"} onClick={() => setMuted(m => !m)}>{muted ? "🔇" : "🔊"}</IconButton>
          <IconButton title="Toàn màn hình">⛶</IconButton>
          <button onClick={onQuit} className="font-display text-sm text-ticket border border-ticket/40 rounded-2xl px-4 py-2 hover:bg-ticket/5 transition">Thoát</button>
        </div>
      </div>

      <div className="flex-1 grid lg:grid-cols-[1.6fr_1fr] gap-5 p-5 md:p-8">
        {/* TRACK */}
        <div className="rounded-3xl overflow-hidden border border-ink/10 bg-gradient-to-b from-[#EAF6E4] to-[#D9EECC] flex flex-col">
          <div className="flex items-center justify-between px-5 py-3 bg-teal text-white">
            <span className="font-display font-semibold flex items-center gap-2">🏆 ĐƯỜNG ĐUA</span>
            <span className="font-display font-semibold flex items-center gap-2">🏁 ĐÍCH ĐẾN</span>
          </div>
          <div className="flex-1 relative">
            <div className="absolute right-0 top-0 bottom-0 w-5 sm:w-7" style={{ backgroundImage: "repeating-conic-gradient(#1D2E4A 0% 25%, #FFFBF2 0% 50%)", backgroundSize: "10px 10px" }}></div>
            <div className="divide-y divide-dashed divide-white/70 pr-5 sm:pr-7">
              {racers.map((r, i) => {
                const progress = Math.min(92, (scores[i] / Math.max(totalPoints, 1)) * 92);
                return (
                  <div key={r.name} className="relative h-16 sm:h-[68px] flex items-center px-4">
                    <div className="absolute transition-all duration-700 ease-out" style={{ left: `calc(${progress}% )` }}>
                      <SnailIcon color={r.color} size={44} />
                    </div>
                    <span className="absolute bottom-1 left-4 text-[10px] font-mono uppercase tracking-wide text-ink/45">Ốc Sên {i + 1}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="h-6 bg-[#BFE3A3] flex items-center justify-around text-[10px] opacity-70">
            {["🌼","🌿","🌸","🌿","🌼","🌿","🌸"].map((e, i) => <span key={i}>{e}</span>)}
          </div>
        </div>

        {/* QUESTION PANEL */}
        <div className="flex flex-col gap-4">
          <span className="inline-flex items-center gap-2 self-start bg-gold text-ink font-display text-xs font-semibold uppercase px-4 py-2 rounded-full shadow-[0_2px_0_rgba(0,0,0,0.1)]">
            ⭐ Câu hỏi thử thách
          </span>
          <div className="note-card p-6 flex-1">
            <p className="font-display text-lg sm:text-xl text-ink leading-snug mb-6">{q.content}</p>
            <div className="space-y-3">
              {q.options.map((o, i) => {
                let stateCls = "border-ink/12 hover:border-ticket/40";
                let badgeCls = "border-ink/25 text-ink/70";
                if (revealed) {
                  if (o.id === q.correctAnswer) { stateCls = "border-teal bg-teal/10"; badgeCls = "bg-teal border-teal text-white"; }
                  else if (o.id === selected) { stateCls = "border-ticket bg-ticket/10"; badgeCls = "bg-ticket border-ticket text-white"; }
                  else { stateCls = "border-ink/10 opacity-50"; }
                } else if (o.id === selected) { stateCls = "border-ticket bg-ticket/5"; badgeCls = "bg-ticket border-ticket text-white"; }
                return (
                  <button key={o.id} disabled={revealed} onClick={() => handleAnswer(o.id)}
                    className={`w-full text-left flex items-center gap-4 px-5 py-4 rounded-2xl border-2 transition font-body text-base ${stateCls}`}>
                    <span className={`w-9 h-9 rounded-full border-2 flex items-center justify-center text-sm font-mono font-semibold flex-shrink-0 transition ${badgeCls}`}>
                      {String.fromCharCode(65 + i)}
                    </span>
                    <span className="flex-1">{o.content}</span>
                    {revealed && o.id === q.correctAnswer && <span className="text-teal text-lg">✓</span>}
                  </button>
                );
              })}
            </div>
            <AnswerExplain q={q} />
          </div>
          <div className="flex items-center gap-3 bg-gold/15 border border-gold/40 rounded-2xl px-5 py-3">
            <span className="text-xl">💡</span>
            <p className="text-sm text-ink/80">Trả lời nhanh và chính xác để ốc sên về đích nhé!</p>
          </div>
        </div>
      </div>

      {/* PLAYERS BAR */}
      <div className="px-5 md:px-8 pb-6">
        <div className="note-card p-4 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-5 flex-wrap">
            {racers.map((r, i) => (
              <div key={r.name} className="flex items-center gap-2.5">
                <span className="w-9 h-9 rounded-full flex items-center justify-center text-white" style={{ background: r.color }}>
                  {i === 0 ? "🙂" : "👤"}
                </span>
                <div className="leading-tight">
                  <div className="text-sm font-semibold text-ink">{r.name}{i === 0 && <span className="text-ticket"> (bạn)</span>}</div>
                  <div className="text-xs text-[#8A7C63] font-mono">{scores[i]} điểm</div>
                </div>
              </div>
            ))}
          </div>
          <span className="inline-flex items-center gap-2 text-ticket border border-ticket/40 rounded-2xl px-4 py-2 font-display text-sm">
            🏆 Bảng xếp hạng
          </span>
        </div>
      </div>
    </div>
  );
}

function ResultScreen({ result, onSeeLeaderboard }) {
  const isGreat = result.accuracy >= 80;
  return (
    <div className="flex-1 flex items-center justify-center px-6 py-10">
      <div className="max-w-md w-full text-center anim-pop">
        <div className="text-7xl mb-4 float-slow">{isGreat ? "🏆" : result.accuracy >= 50 ? "🌟" : "💪"}</div>
        <h1 className="font-display text-3xl text-ink mb-1">{result.score} điểm</h1>
        <p className="text-[#8A7C63] mb-8">{result.correctAnswers}/{result.totalQuestions} câu đúng · độ chính xác {result.accuracy}%</p>
        <div className="grid grid-cols-2 gap-4 mb-8">
          <div className="note-card p-4"><div className="font-display text-2xl text-teal">{result.correctAnswers}</div><div className="text-xs text-[#8A7C63] font-mono uppercase mt-1">Câu đúng</div></div>
          <div className="note-card p-4"><div className="font-display text-2xl text-ticket">{result.completionTime}s</div><div className="text-xs text-[#8A7C63] font-mono uppercase mt-1">Thời gian</div></div>
        </div>
        <PrimaryButton onClick={onSeeLeaderboard} className="w-full">Xem bảng xếp hạng →</PrimaryButton>
      </div>
    </div>
  );
}

function LeaderboardScreen({ results, playerName, onPlayAgain }) {
  return (
    <div className="flex-1 flex items-center justify-center px-6 py-10">
      <div className="max-w-md w-full anim-pop">
        <h1 className="font-display text-2xl text-ink text-center mb-6">🏅 Bảng xếp hạng</h1>
        <div className="note-card divide-y divide-ink/5 overflow-hidden mb-6">
          {results.map((r, i) => {
            const medal = rankMedal(i + 1);
            const isMe = r.playerName === playerName;
            return (
              <div key={r.id} className={`flex items-center gap-3 px-4 py-3 ${isMe ? "bg-ticket/5" : ""}`}>
                <StampToken icon={medal.icon} ring={medal.ring} size={34} fontSize={i < 3 ? 16 : 13} />
                <span className={`flex-1 font-body ${isMe ? "font-semibold text-ticket" : "text-ink"}`}>{r.playerName}{isMe && " (bạn)"}</span>
                <span className="font-display text-ink">{r.score}</span>
              </div>
            );
          })}
        </div>
        <PrimaryButton onClick={onPlayAgain} className="w-full">Chơi trò chơi khác</PrimaryButton>
      </div>
    </div>
  );
}

/* =========================================================================
   MOUNT
   ========================================================================= */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
